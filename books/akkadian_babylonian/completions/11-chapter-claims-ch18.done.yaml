summary: |
  Chapter 18 (Etana: The Eagle and the Plant of Birth) claims document. Three co-equal Akkadian recensions — Old Babylonian (Sippar, ca. 1700 BCE), Middle Assyrian (Aššur, mid-2nd millennium BCE), and Standard Babylonian (Nineveh K.2606 + duplicates, 7th c. BCE) — presented in sequence (OB → MA → SB) per the brief's co-equal classification and the chapter-claims skill's co-equal handling. The shared narrative spine (eagle-serpent oath sworn by Šamaš; eagle's betrayal eating the serpent's young; serpent's appeal to Šamaš; eagle's punishment in the pit; Etana's parallel predicament of childlessness and prayer for the *šammu ša alādi*; Etana's rescue of the eagle; the eagle's reciprocity; the heaven-flight episodes — Ištar's gate, Anu's gate, receding-earth imagery; lost conclusion) is presented once, with each recension's distinctive contributions foregrounded.

  The structural lost ending of the heaven-flight is documented at the source-overview as a fourth [LACUNA:] marker (scholarly_reconstruction: no — the loss is structural; no in-tradition fill is available). The chapter does not extrapolate a resolution; the lost conclusion is preserved as a structural fact of the dossier across all three recensions.

  Sources: foster-2005 (pp. 533–554, all three recensions) and dalley-2008 (pp. 189–202) as the working English translations; foster-2007 (pp. 43–46) for late-tradition recensional context; noegel-2005 (pp. 233–245) for Etana in the wider heroic-epic context; black-green-1992 s.v. Etana, eagle, serpent for the deity-and-iconography entries; bottero-2001 for royal-divine relations and the SKL framing. All six source IDs resolve to existing entries in sources.yaml. Zero invented IDs.

  Narrative structure presents ALL THREE recensions:
    - OB Sippar (Foster 2005, pp. 533–540, ca. 1700 BCE): the founding framing — Etana's installation as king of Kish; the eagle-and-serpent oath sworn by Šamaš; the eagle's deliberation with his chick and the chick's warning; the betrayal; the serpent's appeal; Šamaš's pit-trap (partly damaged in Sippar tablets, cross-recensional fill from MA and SB); Etana's parallel predicament and prayer for the plant of birth; the rescue scene; the eagle's reciprocity; OB tablets break off within the heaven-flight episode itself.
    - MA Aššur (Foster 2005, pp. 540–544, mid-2nd millennium BCE): fragmentary intermediate witness; preserves portions of the eagle-and-serpent fable (the betrayal scene, the eagle-chick dialogue, the serpent's appeal) and of the rescue and opening heaven-flight; functions principally as parallel witness supplementing OB and SB.
    - SB Nineveh (Foster 2005, pp. 544–554, K.2606 + duplicates, 7th c. BCE): the most fully preserved of the three; Saggs 1986 join substantially enlarged the dossier and extended the surviving text into portions of the heaven-flight; preserves the hymnic invocation of Kish; the elaborated fable with formal oath, extended eagle-chick dialogue, and the chick's warning speech; the pit-trap at length as the formal punishment of the oath-breaker; the rescue over months; the eagle's voluntary reciprocity; the heaven-flight with the staged ascent, receding-earth imagery, Ištar's gate, and Anu's gate; surviving text breaks off within the flight.

  Saggs 1986 (the Nineveh-fragment join significantly enlarging the SB dossier) is named-but-flagged: named in the source-overview SB paragraph and in the [LACUNA:] marker for the SB recension, with the substantive SB reconstruction anchored through Foster 2005 and Dalley 2008. Saggs 1986 is not in sources.yaml; recorded here for inventory-audit follow-up.

  Two INFERENCE markers: (i) the structural alignment of the eagle's transgression-and-punishment with Etana's predicament-and-quest, both adjudicated by Šamaš, suggesting the eagle-and-serpent fable functions as a structural prologue rather than a digressive embedded tale; (ii) the composition's theological centre — the king's need for divine intervention to secure dynastic continuity, the heaven-flight as the divinely-sanctioned means of obtaining the *šammu ša alādi*, the *Etana* composition as one of the clearest Akkadian statements of royal-legitimation theology. Four LACUNA markers (OB Sippar columns damaged; MA Aššur fragmentary preservation; SB Nineveh damaged columns + lost conclusion; the structural lost ending of the heaven-flight in all three recensions — fourth and structural LACUNA). One RECONSTRUCTION marker (OB Sippar fable-scene damaged columns reconstructed from MA Aššur and SB Nineveh parallel material, with explicit period-gap flagging per scope.md's reconstruction policy). One VARIANT marker (all three recensions documented in sequence per the co-equal classification, with the chapter "choosing" none of the three but treating them as parallel witnesses).

  Five COMPARATIVE-HOOK comments: (i) Akkadian-internal Sumerian King List as Etana's earliest attestation (the antediluvian / postdiluvian distinction; Etana on the postdiluvian side as early king of Kish, the first city of postdiluvian kingship); (ii) Akkadian-internal flood-vs-Etana on the king-and-cosmic-order pattern (Atra-ḫasīs ch2 supplies the cosmic settlement; Etana ch18 supplies the early king's negotiation within that settlement); (iii) Akkadian-internal Adapa flight-up-and-back-down structural parallel (Adapa ch3 / Etana shared structural pattern of heaven-ascent for divine grant, gate-passage at Anu, goal at highest heaven; the question whether Etana's lost resolution mirrors or inverts Adapa's refusal-and-loss is undecidable on surviving evidence); (iv) cross-cultural Indo-European flight-of-the-hero typology (Bellerophon-Pegasus per Pindar Isthmian 7 and Olympian 13; Trita Āptya per RV 1.105 — typological, not transmissional; the childlessness-resolved-by-divine-intervention motif as Hebrew-Bible parallel); (v) the eagle-and-serpent embedded fable as antecedent to the disputation/fable tradition (cross-link to ch34-39 fable chapters of the present volume; the Aramaic Aḥiqar and later Aesopic tradition as cross-cultural parallels).

  EVIDENCE tokens (132 total): foster-2005, dalley-2008, foster-2007, noegel-2005, black-green-1992, bottero-2001. All six source IDs resolve to existing entries in sources.yaml. Zero invented IDs.

  Glossary check: Šamaš (locked form per glossary.yaml), Ištar (locked form), Anu (locked form with full first-mention gloss in the Anu-gate paragraph as a refresher per chapter 17 being the last reminder), Aššur (locked form), Nineveh (locked form). Composition-specific entities not in glossary.yaml — Etana (the new principal character; full inline first-mention gloss as "the early king of the Mesopotamian city of Kish, who has been granted kingship by the gods but lacks an heir"), the eagle and the serpent (the two principal characters of the embedded fable; inline glosses), the *šammu ša alādi* (the plant of birth; inline gloss with locked transliteration), Kish (the early Mesopotamian city-state in northern Babylonia; inline gloss with SKL framing), Sippar (inline gloss with location and recension date), Aššur (inline gloss for the MA Aššur recension), K.2606 (the SB Nineveh manuscript; inline gloss as Aššurbanipal-library tablet), Sumerian King List (inline gloss as the cuneiform chronicle of Mesopotamian dynastic succession). Saggs 1986 named-but-flagged in the SB section.

