summary: |
  Chapter 13 (The Descent of Ishtar) round-1 factcheck:
  VERDICT PASS-WITH-LIGHT-FIXES.

  Of 17 prose claims and 36 EVIDENCE tokens audited, 14 claims
  are SUPPORTED (with 2 SUPPORTED-WITH-CAVEAT), with 3 minor
  findings (1 MEDIUM, 2 LOW). NO HIGH-severity findings, NO
  contamination, NO fabrications, NO silent bridges, NO
  glossary violations. All narrative beats — the 138-line
  count, K.162 Nineveh / Aššurbanipal-library principal
  witness, Aššur duplicate from chief singer's (nargallu)
  library N 3, the seven-gate stripping ornament list AND
  ORDER (crown / earrings / neck-chains / breast-ornaments /
  girdle of birthstones / bangles / proud garment),
  gatekeeper's "Mistress of Earth" refrain, Aṣušu-namir's
  creation by Ea and the water-of-life stratagem, Ereškigal's
  curse on the messenger, Tammuz's neglect-and-substitution,
  Belili's lapis-lazuli mourning, and the closing Tammuz
  wailing-rite ritual instruction — are independently
  corroborated against multiple secondary sources. The
  Sumerian Inanna's Descent (412 lines per ETCSL 1.4.1) is
  correctly framed as INDEPENDENT comparative material per
  scope.md and treated only in COMPARATIVE-HOOK comments and
  one explicit comparative-tier EVIDENCE token. The audit-A7
  resolution (eBL URL https://www.ebl.lmu.de/corpus/L/1/8)
  is correctly applied. The bibliographic anchors (Foster
  2005 pp. 498–505; Dalley 2008 pp. 154–162) are supported at
  the overall-range level; per-paragraph page allocation is
  taken on trust (Note N-1).

  The three findings to address at stage 13 are all light
  fixes: F-1 (MEDIUM, *halziqu* lexeme spelling/gloss
  unverified at lemma level — narrative claim supported);
  F-2 (LOW, scholarship-currency — Lapinkivi 2010 SAACT 6 is
  the modern critical edition and should be acknowledged);
  F-3 (LOW, verbatim ascent-list quotation from Foster 2005
  not directly secured — structural argument suffices).

  Recommended action: PROCEED to stage 13 (post-human-
  normalize) with light fixes. No brief revision required.
  No round-2 rewrite required. The writer's caution flags are
  all corroborated at the narrative level.
