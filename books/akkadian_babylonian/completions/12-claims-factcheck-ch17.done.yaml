    locations: [line 33 (comment block), line 67 (body)]
    issue: "The *Catalogue of Texts and Authors* is conventionally dated 10th-7th c. BCE (Lambert 1962; surviving manuscripts from 7th-c. Nineveh and Hellenistic/Arsacid Babylon), NOT 'ca. 1200 BCE'. The chapter conflates the (estimated) date of Sîn-lēqi-unninni himself (ca. 1300-1000 BCE) with the date of the catalogue that names him. The phrase 'Late Babylonian... ca. 1200 BCE' is internally contradictory; 'Lambert's list' is misleading shorthand (Lambert published it in 1962, did not author it)."
