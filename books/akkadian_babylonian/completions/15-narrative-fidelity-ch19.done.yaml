# Verification of the three post-human-normalize fixes
# ─────────────────────────────────────────────────────────────────────────
post_human_normalize_fixes_verified:
  F1_paternal_vs_maternal_uncles: PASS
  F2_K3401_plus_duplicates_three_fragments: PASS
  F3_composition_date_hedging_clause: PASS
  notes: |
    F-1: Body prose names "paternal uncles" / "the brothers
         of Sargon's father" / Akkadian _aḫi abīya_ "the
         brother(s) of my father" at the §"The autobiographical
         opening" parentage paragraph (line 47), per the
         standard scholarly translation across ANET/Speiser,
         Foster 2005, World History Encyclopedia, and
         intertextual.bible. The textual puzzle (speaker
         claims unknown father yet knows of paternal uncles)
         is explicitly noted. Direct grep on body prose for
         "maternal" returns 0 hits; direct grep for "mother's
         brother" / "mother's brothers" returns 0 hits.
    F-2: Body prose uniformly names "K.3401 + duplicate
         manuscripts; three fragments are attested in the
         dossier" (or close variants) throughout the source-
         overview, the manuscript-dossier paragraph, the
         first-millennium-composition paragraph, the LACUNA
         and RECONSTRUCTION markers, the historical-Sargon
         section, the VARIANT marker, the variants-summary
         paragraph, and the legend's-place-in-the-corpus
         section. K.3401 is specifically identified as Neo-
         Assyrian from Aššurbanipal's library at Nineveh
         (7th c. BCE); the NA/NB split of the two further
         duplicates is left un-verified per the open-web
         sources, with Westenholz 1997 named as the
         authoritative reference. Direct grep on body prose
         for "Neo-Babylonian duplicate" returns 0 hits — no
         specific NA/NB-split claim for the further duplicates
         is made. The VARIANT marker's alt1 sub-field carries
         the explicit hedge "open-web sources confirm three
         manuscript fragments total but do not confirm an
         NA/NB breakdown for the two further witnesses".
    F-3: Body prose at line 18 preserves the hedging clause
         verbatim: "the composition's earliest core may go
         back further — some scholars locate the underlying
         composition in the Old Babylonian literary tradition,
         others in the Neo-Assyrian period as propaganda
         linked to Sargon II — but the surviving witnesses
         are all first-millennium and the manuscript-
         attestation floor is securely first-millennium". The
         hedge flags the contested composition-date question
         (Old Babylonian core vs. Neo-Assyrian propaganda
         linked to Sargon II) without diluting the manuscript-
         attestation-floor anchor elsewhere in the chapter.
         The other "first-millennium literary composition"
         loci (lines 143, 174, 188) remain as the conservative
         manuscript-attestation-floor framing.

