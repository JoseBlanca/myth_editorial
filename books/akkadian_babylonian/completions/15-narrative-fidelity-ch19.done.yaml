# Audit headline
# ─────────────────────────────────────────────────────────────────────────
headline: |
  Chapter 19 (Birth Legend of Sargon) is fidelity-clean.
  Every numbered claim maps to a body-prose paragraph in the
  same sequential position; all five structural markers
  (2 INFERENCE + 1 LACUNA + 1 RECONSTRUCTION + 1 VARIANT),
  all seven COMPARATIVE-HOOK comments, all 30 footnotes, and
  all 111 EVIDENCE tokens are preserved byte-identical from
  the approved claims contract. All three post-human-
  normalize fixes carry through correctly: F-1 (paternal
  uncles — _aḫi abīya_ "the brother(s) of my father" — 0
  hits on "maternal" / "mother's brother"); F-2 (K.3401 +
  duplicate manuscripts; three fragments attested; no
  specific NA/NB claim for the further duplicates — 0 hits
  on "Neo-Babylonian duplicate" in body prose); F-3
  (composition-date hedging clause preserved verbatim at the
  first body-prose claim asserting first-millennium dating).
  Single-prevalent recension handling per the brief: PASS —
  K.3401 + duplicate manuscripts presented as the prevailing
  reading in a single unified body-prose narrative.
  Structural lost closing peroration: PASS — flagged in the
  LACUNA and RECONSTRUCTION markers and in the dedicated
  §"The conquest catalogue and the closing autobiographical
  address" section; no extrapolation; the closing
  reconstructed in form only through generic affiliation
  with the *Cuthaean Legend of Narām-Sîn* (chapter 24).
  Glossary discipline: PASS — locked diacritics on Šarru-
  kīn, Ištar, Aššur (via Aššurbanipal), Aššurbanipal, Sîn,
  Narām-Sîn, Azupirānu, _aḫi abīya_, _râmu_, _dāli_, _narû_;
  all 12 never_use forms zero hits in body prose; the single
  "Ishtar" occurrence is inside a footnote quoting Foster
  2005's published translation byte-identical with claims-
  approved. Scope compliance: PASS — Moses (Exodus 2),
  Romulus-Remus, Cyrus, Königsnovelle, and Karna material is
  confined to the seven COMPARATIVE-HOOK comments at chapter
  foot; body-prose mentions are limited to two referential
  acknowledgments preserved byte-identical from claims.
  One ADVISORY finding documented (G-1 markup-normalisation
  `*` → `_`); policy-compliant per chapter-draft skill rule
  6; does not require revision.

