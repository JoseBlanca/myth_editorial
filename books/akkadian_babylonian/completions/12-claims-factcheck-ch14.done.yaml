summary: |
  Round-1 fact-check VERDICT: BLOCK. Three HIGH-severity findings,
  two of which are factual fabrications: (F-1) Etana is asserted
  three times to be in the Amarna archive; it is not — the Amarna
  literary cluster is EA 356 (Adapa), EA 357 (Nergal), EA 359
  (King of Battle), no Etana. (F-2) The union duration is given
  as "seven days and seven nights" twice; the actual surviving
  text reports six days and six nights. (F-4) The Sultantepe
  ending is described as a "formal royal wedding and coronation"
  with divine-assembly ratification and formal-recognition
  speeches; the actual surviving SB ending is Anu's decree
  (largely damaged) plus the closing "they impetuously entered
  the bedchamber" line — there is no formal wedding ceremony.

  Two further findings: (F-3, MEDIUM) the hair-seizing motif is
  in BOTH recensions; the chapter's Amarna section omits the
  recension's narrative climax; the Bottéro violence-vs-love-
  affair contrast is invisible from the chapter as written.
  (F-5, LOW-MEDIUM) the "looking" prohibition variance: Foster's
  rendering vs. the verbatim "do that which men and women do"
  Sultantepe text; needs a hedge.

  Other elements check out: the audit-A9 STT 28 identifier is
  correctly incorporated; the named-but-flagged citation policy
  for Gurney 1960 is correctly applied; the Late Babylonian Uruk
  fragment is correctly handled; the seven-gate-as-entry-points
  framing is supported by Novotny against the chapter-13
  stripping-points contrast; Namtar's role as vizier and
  embassy-bearer is supported; the fourteen apotropaic demons
  count is supported. No glossary violations; no Sumerian
  contamination; no silent bridges. The marker discipline
  (3 INFERENCE / 2 LACUNA / 1 RECONSTRUCTION / 1 VARIANT /
  5 COMPARATIVE-HOOK) is correct.

  Recommendation: BLOCK round-1; update the brief (line 42's
  'formal royal-wedding-and-coronation' framing); round-2
  chapter-claims rewrite of ~5 paragraphs and 1 COMPARATIVE-HOOK
  (lines 33, 73–75, 96, 106, 113, 132, 152, 183); focused
  round-2 fact-check on the corrected paragraphs; then proceed
  to stage 13 (post-human-normalize). The chapter's overall
  structure, source coverage, audit-A9 incorporation, and
  glossary compliance are sound — the five findings are
  localised to specific narrative beats, not to the chapter's
  organising framework.
