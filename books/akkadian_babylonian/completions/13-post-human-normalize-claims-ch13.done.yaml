summary: |
  Chapter 13 (The Descent of Ishtar) post-human-normalize. Round-1 claims-factcheck returned PASS-WITH-LIGHT-FIXES (0 HIGH / 1 MEDIUM / 2 LOW); three light edits applied to produce the approved file:

    (1) F-1 MEDIUM: hedged the *halziqu* lexeme gloss. The chapter no longer asserts the specific lexeme spelling "halziqu" at the lexical level (CAD lookup for the term was not retrievable in the open during the factcheck audit; Lapinkivi 2010's glossary was not directly accessed for transliterational authority). The narrative now follows Foster's narrative-level summary of the water-of-life stratagem and parenthetically notes that the technical Akkadian term for the vessel of the water of life appears in Foster's translation in transliteration but is not asserted at lemma level. The narrative claim about Aṣušu-namir's deception and the binding promise is unchanged.
    (2) F-2 LOW: added Lapinkivi 2010, *The Neo-Assyrian Myth of Ištar's Descent and Resurrection*, State Archives of Assyria Cuneiform Texts (SAACT) 6 (Helsinki: Neo-Assyrian Text Corpus Project, 2010), as the modern critical edition (named-but-flagged; not currently in sources.yaml). Foster 2005 and Dalley 2008 remain the principal cited translations; eBL is named as the online text resource consolidating Lapinkivi. The framing "no recent single-volume critical edition in the Lambert/George sense" was corrected: Lapinkivi 2010 IS such a critical edition.
    (3) F-3 LOW: hedged the ascent-list verbatim quotation. The chapter now describes the ascent as the structural reverse of the descent (the same items, in reverse order: garment → bangles → girdle → breast-ornaments → neck-chains → earrings → crown), drawn from Foster's translation's structural symmetry rather than from a verbatim quotation of the ascent passage. Cross-witness corroboration via Wikipedia s.v. Descent of Inanna and Sacred-Texts/ANET reproductions confirms the reverse-order pattern; the structural-symmetry argument suffices and the chapter no longer asserts a specific verbatim ornament-list at the ascent.

  Provenance comment block appended at the file foot recording: timestamp, edits applied, structural checks passed, and round-1 factcheck cross-references.

