summary: |
  Chapter 15 (Anzû: The Theft of the Tablet of Destinies) claims document. Co-equal Old Babylonian (Vogelzang 1988) and Standard Babylonian (Annus 2001) recensions presented in sequence per the brief's co-equal classification and the chapter-claims skill's co-equal handling. The principal substantive recensional difference — the hero's identity (Ningirsu in OB; Ninurta in SB) and tablet structure (three tablets in OB; two in SB) — is preserved throughout, not glossed over, per the brief's special_instructions.

  The glossary.yaml carve-out for "Ningirsu" (updated 2026-05-07: "*Ningirsu* is permitted in any passage discussing the OB *Anzû* recension's hero") is exercised. The OB Ningirsu / SB Ninurta substitution is presented as evidence for the 1st-millennium consolidation of the warrior-god identity (the two figures are the same warrior-god under different local-city names: Ningirsu of Lagash; Ninurta of Nippur).

  Sources: Annus 2001 (SAACT 3, SB critical edition) and Vogelzang 1988 (OB critical edition) as the primary critical editions; Foster 2005 (pp. 555–578, both recensions side by side) and Dalley 2008 (pp. 203–227) as the principal English translations; Foster 2007 (pp. 35–39) for late-tradition recensional context; Black & Green 1992 for deity entries (Anzû, Ninurta, Ningirsu, Ea, Tablet of Destinies); Bottéro 2001 for divine kingship and royal-legitimation theology; Lambert 2013 for the Enūma Eliš fifty-names parallel. All source IDs resolve to existing entries in sources.yaml.

  Narrative structure presents BOTH recensions:
    - OB Vogelzang 1988 (3-tablet, Ningirsu hero, ~1700 BCE, Susa and Tell Asmar): opening assembly; Anzû's bath-theft of the Tablet of Destinies from Enlil; cosmic decree-crisis; divine search for champion (partly damaged); Ningirsu identified as hero; combat with weapons-decree-reversal; second combat (partly damaged at climax); victory and Tablet recovery (partly damaged at conclusion).
    - SB Annus 2001 (2-tablet, Ninurta hero, 1st millennium, Nineveh + Sultantepe + Tarbiṣu + Aššur): elaborated divine-council opening; bath-theft (parallel to OB); structured catalogue of refusing candidate-heroes (Adad, Šara, third candidate); Ea proposes Ninurta; maternal commission by Bēlet-ilī/Mami; Sharur the sentient mace and its dialogue with hero; first combat with Anzû's decree-reversal of weapons (arrow-to-reed-bed, bowstring-to-sheep, bow-to-tree imagery); Sharur to Ea for tactical counsel; second combat (south wind, pinions); killing-blow and Tablet recovery; closing fifty-names hymn to Ninurta.
    - The fifty-names closing hymn structural parallel to *Enūma Eliš* (Tablets VI–VII) Marduk's fifty names is preserved as INFERENCE marker.

  Two INFERENCE markers: (i) Sharur as sentient war-mace and its placement within the older Mesopotamian tradition of personified divine weapons (with the Marduk's-bow comparandum in *Enūma Eliš* IV); (ii) the SB closing fifty-names hymn structural parallel to *Enūma Eliš* and the scribal-milieu reading. Two LACUNA markers (one for OB recension breaks; one for SB Tablet I and Tablet III climax damage). Two RECONSTRUCTION markers (Foster 2005's parallel reconstructions; OB Tablet III climax filled from SB Tablet III with explicit dialect/period flagging per scope.md's reconstruction policy). One VARIANT marker (the co-equal recensional structure documented per the skill's co-equal handling).

  Five COMPARATIVE-HOOK comments: (i) Akkadian-internal *Enūma Eliš* (chapter 1) as paired combat-myth dossier (Marduk-Tiamat / Ninurta-Anzû; shared Tablet of Destinies and fifty-names structures); (ii) Akkadian-internal Ninurta-as-warrior elsewhere in the tradition (Damkina's Bond ch9, 1st-millennium royal inscriptions, Neo-Assyrian iconography); (iii) Sumerian *Lugal-e* (ETCSL 1.6.2) as comparative-only background (NOT the original of which *Anzû* would be a translation; the Sumerian *Anzud* form acknowledged as out of scope); (iv) Indo-European HERO SLAY SERPENT typology (Watkins 1995 — named-but-flagged; Indra-Vṛtra RV 1.32, Thor-Jörmungandr, Apollo-Python, Zeus-Typhon, Tarḫunna-Illuyanka); (v) Hurro-Hittite *Illuyanka* (CTH 321) as the closest geographic-chronological neighbour with the storm-god-defeats-monster pattern.

  EVIDENCE tokens (116 total): annus-2001, vogelzang-1988, foster-2005, dalley-2008, foster-2007, black-green-1992, bottero-2001, lambert-2013. All eight source IDs resolve to existing entries in sources.yaml. Zero invented IDs.

  Glossary check: Anzû (locked form with circumflex per glossary.yaml; never_use Anzud is respected — Anzud appears only inside one COMPARATIVE-HOOK comment as an explicit Sumerian-tradition reference); Ninurta (SB hero); Ningirsu (OB hero — glossary.yaml carve-out for OB *Anzû* recension passages); Enlil; Anu (sky-god, formal head of the divine hierarchy); Ea (with full first-mention gloss per its prominence in the SB strategic role); Adad; Marduk (in Ea's first-mention gloss and in cross-reference to *Enūma Eliš*); Tablet of Destinies (locked English form with *ṭuppi šīmāti* in parentheses on first mention); *Apsû* (with circumflex); Mami / Bēlet-ilī (in the SB maternal-commission section). Composition-specific entities not in glossary.yaml — Sharur (*Šaruru*), Šara, the Susa, Tell Asmar, Tarbiṣu witness locations — receive inline first-mention glosses.

