  caution_on_specific_attestations: |
    The chapter is conservative about specific line-by-line attestations within Annus 2001 (SAACT 3), Vogelzang 1988, Foster 2005 (pp. 555–578), and Dalley 2008 (pp. 203–227). The writer has not directly accessed the Annus, Vogelzang, Foster, or Dalley pages; structural claims are anchored to those page ranges per the brief's locked sources, and the manuscript history (Susa and Tell Asmar for the OB recension; Nineveh, Sultantepe, Tarbiṣu, Aššur for the SB recension; the OB→SB recensional substitution and the fifty-names closing hymn) is presented at the level of the composition's overall narrative structure.

    Round-1 factcheck should focus on whether (a) the recensional content is correctly attributed (OB: three-tablet Ningirsu version; SB: two-tablet Ninurta version with the elaborated divine-council, candidate-search, maternal commission, Sharur dialogue, weapons-decree-reversal, south-wind-and-pinions strategy, and fifty-names closing hymn); (b) the bath-theft motif is correctly attributed to both recensions (Enlil bathing → Anzû seizes the Tablet); (c) the candidate-hero refusal-catalogue is correctly enumerated in the SB recension (Adad, Šara, third candidate) — the brief lists Adad and Šara explicitly; the third refusing candidate's identity in the SB recension should be verified at factcheck; (d) the weapons-decree-reversal imagery (arrow-to-reed-bed, bowstring-to-sheep, bow-to-tree, bronze-to-mountain) is correctly preserved; (e) the south-wind-and-pinions counter-strategy is correctly attributed (Ea's tactical counsel via Sharur); (f) the fifty-names closing hymn parallel to *Enūma Eliš* is correctly framed (the SB *Anzû* closes with a fifty-names litany; Lambert 2013 for the *Enūma Eliš* parallel); (g) the Sharur-as-sentient-mace claim is correctly anchored (Sharur speaks to the hero and serves as Ea-to-hero messenger in the SB recension; OB attestation is partly damaged).

  pattern_match_with_recent_chapters: |
    Following the chapter 14 / chapter 13 pattern of conservative line-by-line claims when the writer does not have direct primary-source access; specific verbatim quotations are not given; the chapter operates at the level of the composition's overall narrative structure with appropriate INFERENCE markers for interpretive readings. The chapter 15 case is structurally comparable to chapter 14 (co-equal recensions presented in sequence): the factcheck must verify both the OB and SB claims separately and cross-check the recensional substitutions (especially the Ningirsu/Ninurta naming and the structural differences in length, tablet count, and elaborated SB content). The 1st-millennium consolidation reading (the warrior-god identity consolidated under the Ninurta name in the SB recension) is the chapter's interpretive framing of the recensional substitution; the factcheck should verify this is properly attested in Annus 2001's commentary.

  decisions_on_ambiguous_points: |
    (i) The bath-theft motif is preserved as attested across BOTH recensions, on the strength of Foster 2005's narrative-level summary; the brief and the secondary literature (Black & Green 1992, Foster 2007) consistently locate the theft at the moment when Enlil sets the Tablet aside to bathe, and Foster 2005 / Dalley 2008 preserve this scene in both recensions.

