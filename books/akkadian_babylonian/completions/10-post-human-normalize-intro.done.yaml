summary: "Post-factcheck normalization of the introduction. All seven of the seven recommended findings from prose-factcheck (chapters/00-introduction.factcheck.yaml) applied. Five fixes to the prose: (F-1) Sîn-lēqi-unninni's '11th-century compilation' rewritten as 'late-second-millennium compilation... conventionally placed in the 13th-12th centuries BCE, in the late Kassite or Middle Babylonian period' — fixes the internal inconsistency with line 95's 'late second millennium BCE'. (F-3) Poor Man of Nippur tablet citation corrected from 'STT 38, with two minor witnesses STT 39 and STT 116' to 'STT 38, with one minor witness in the joined fragment STT 39+116' — STT 39+116 is a single joined tablet, not two witnesses. (F-5) Erra dating widened: body now reads 'composed somewhere in the late ninth to eighth century BCE' (was 'eighth century BCE' as fact); INFERENCE marker rewritten to acknowledge the full ninth-through-seventh-century scholarly range with most opinion settling on the eighth, replacing the prior late-eighth-with-seventh-century-tail reading. (F-6) Worm and Toothache tablet identifier corrected from 'CT 17, 50' to 'CT 17 50' — comma removed to match scope.md's convention. (F-9) King of Battle date framing rewritten from 'an Old Babylonian Sargon legend, the King of Battle, was preserved in an Egyptian royal archive at Amarna' to 'a Sargon legend of Old Babylonian origin, the King of Battle, was preserved in a Middle Babylonian copy in an Egyptian royal archive at Amarna' — the Amarna copy is the MB witness; the OB qualifier now describes the composition's origin, not the manuscript date. Two policy clarifications to glossary.yaml: (F-2) the Ninurta entry's rationale now permits Ningirsu in any chapter discussing the OB Anzû recension's hero (chapter 15 plus the introduction, comparative chapter, and influences chapter wherever the OB→SB substitution is named) — the prior 'chapter 15 only' lock was over-strict. (F-8) the Gilgameš entry's rationale now permits Bilgames only when citing Sumerian compositions by their Sumerian title (e.g., 'the Sumerian Bilgames poems') or in explicit comparative contexts — never as a name for the Akkadian hero. In parallel, the Ištar entry's rationale was extended to make the same carve-out for the Sumerian Inanna name (permitted only in Sumerian-tradition citations like 'the Sumerian Inanna's Descent'), and the Apsû entry's rationale was extended to permit abzu in the conventional Sumerian temple name E-abzu and in Sumerian-tradition citations. F-4 (Series of the Fox 'about 200 lines') and F-7 (Saggil-kīnam-ubbib acrostic wording variant) deferred as soft notes for chapter-claims to spot-check."
