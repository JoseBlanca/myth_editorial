summary: |
  Chapter 14 (Nergal and Ereškigal) claims document. Co-equal MB Amarna and SB Sultantepe recensions presented in sequence per the brief's co-equal classification and the chapter-claims skill's co-equal handling. The Late Babylonian Uruk fragment is treated as a partial witness to the SB recension. Audit finding A9 (Sultantepe identifier) is honoured: STT 28 + joins is the locked identifier, with the inventory's earlier "SU 51/7" form replaced. Gurney 1960's *Anatolian Studies* 10 (pp. 105–131) is named-but-flagged as the standard critical edition for the SB recension; its title's Roman-numeral "VII" refers to the seventh of his Sultantepe-tablets articles, not a tablet number.

  Sources: Foster 2005 (pp. 506–524, all three recensions side by side) and Dalley 2008 (pp. 163–181) as the principal cited translations; Foster 2007 (pp. 30–34) for recensional history; Black & Green 1992 for deity entries (Nergal, Ereškigal, Namtar, Anu, Ea, Sultantepe, Amarna, underworld); Bottéro 2001 for Nergal cult and underworld theology. Three witnesses verified via web search: EA 357 (Amarna, ~90 lines, 14th century BCE), STT 28 + joins (Sultantepe, ~750 lines, 7th century BCE, edited by Gurney 1960), Late Babylonian Uruk fragment.

  Narrative structure presents BOTH recensions:
    - MB Amarna (brief, etiological): divine banquet, Namtar's mission, Nergal's failure to rise, Ereškigal's offence, descent, encounter, etiological resolution as joint underworld co-rulers.
    - SB Sultantepe (long, courtly-romantic): same opening; Nergal seeks Ea's protection; Ea's stratagem (fourteen demons, prohibitions on chair/food/beer/water/looking); seven-gate descent; the chair-trick and prohibitions catalogue; the bathing scene and seven-day union; Nergal's flight; Ereškigal's threat to raise the dead; the divine assembly's decision; Nergal's second impassioned descent (seizing Ereškigal by the hair); the formal royal wedding and coronation.
    - Late Babylonian Uruk fragment: brief partial witness to the SB recension; not an independent third recension.

  Three INFERENCE markers: (i) the recensional contrast (Amarna brief etiological / Sultantepe elaborated courtly-romantic) as a Late-Bronze-vs-Neo-Assyrian compositional pattern; (ii) the Sultantepe prohibitions catalogue as a parallel to the Adapa pattern of Ea-instructed refusals; (iii) the elaborated courtly-romantic register as unusual within Akkadian myth. Two LACUNA markers (one for Sultantepe SB recension columns; one for Amarna MB tablet edges). One RECONSTRUCTION marker (Foster 2005's parallel reconstructions of each recension). One VARIANT marker (the co-equal recensional structure documented per the skill's co-equal handling).

  Five COMPARATIVE-HOOK comments: (i) Akkadian-internal *Descent of Ishtar* (chapter 13) as paired underworld dossier; (ii) Akkadian-internal Ea-and-Adapa instruction-and-prohibition pattern (chapter 3); (iii) Greek Hades-Persephone celestial-chthonic pairing; (iv) Hurro-Hittite celestial-chthonic encounter motifs; (v) Late Bronze international circulation evidenced by the Amarna cluster (*Adapa*, *Etana*, *King of Battle*, etc.).

  Source IDs used in EVIDENCE tokens (65 total): foster-2005 (pp. 506–524 throughout); dalley-2008 (pp. 163–181 throughout); foster-2007 (pp. 30–34 for recensional context); black-green-1992 (s.v. Nergal, Ereškigal, Namtar, Anu, Ea, Amarna, Sultantepe, underworld); bottero-2001 (passim on Nergal cult). All five source IDs resolve to existing entries in sources.yaml.

  Glossary check: Ereškigal (locked form with š-háček per chapter 13 convention), Ištar (locked form, used only in cross-reference to *The Descent of Ishtar* — composition title preserves "Ishtar"), Ea, Apsû, Marduk (in Ea's first-mention gloss), Anu (locked form), Nergal — all use locked glossary.yaml renderings. Composition-specific deities/places not in glossary.yaml — Namtar, Aṣušu-namir (cross-ref only), Belili (cross-ref only), Kurnugê (cross-ref to chapter 13's gloss), the fourteen demons, Sultantepe, Amarna, Ḫuzirina — receive inline first-mention glosses.

