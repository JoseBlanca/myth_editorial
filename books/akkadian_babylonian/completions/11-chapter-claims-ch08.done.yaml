summary: "Chapter 8 (Uraš and Marduk) claims document. Lambert 2013 pp. 308-325 is the sole modern critical edition; brief's variants.classification is 'single-prevalent' (Lambert's composite text from partially overlapping late-Babylonian manuscripts). Per the brief's special_instructions, the chapter is treated as a node in the late-Babylonian cosmogonic dossier rather than as a freestanding myth: marginal in attestation, fragmentary, and analytically paired with Damkina's Bond (Chapter 9) as a feminine-consortship sub-cluster. The chapter does NOT reconstruct verbatim quotations or specific column/line attributions, given that the only available source for the chapter writing was Lambert 2013 cited at page-range level (no digitized translation available; Foster 2005 / Dalley 2008 do not include this composition). All page references stay at the page-range level Lambert 2013, pp. 308-325 (with sub-ranges 308-311 for source overview / commentary, 311-321 for narrative content); these match the brief's loc range. Three INFERENCE markers covering (i) the late-Babylonian theological extension framing — Marduk absorbing Anu's consortship roles; (ii) the cosmogonic-theological function attribution — interpretive, deriving from Lambert's commentary rather than from a programmatic statement in the surviving lines; (iii) the dossier-node framing — the composition is best read as a temple-scholarly artifact rather than a freestanding myth. One LACUNA marker for the breaks across the late-Babylonian manuscripts; one RECONSTRUCTION marker for Lambert 2013's internal joins among the witnesses (no external in-tradition donor source available; confidence: low to medium). One VARIANT marker for the single-prevalent / sub-manuscript variation classification. Four COMPARATIVE-HOOK comments: Greek Gaia-Ouranos primordial pair (with Hesiodic inversion); Hurro-Hittite earth-deity material (Hoffner 1998); internal Akkadian Damkina's Bond parallel (closest comparandum); internal Akkadian Enūma Eliš / dossier-register framing. Source IDs used: lambert-2013 (sole anchor for textual claims), black-green-1992 (s.v. Uraš, Marduk, Anu, Ea), rla (s.v. Uraš A and Uraš B — the female earth-goddess vs. the male Dilbat deity distinction; Krebernik 2014 named in the footnote and routed through the rla source ID per the named-but-flagged pattern), bottero-2001 (chthonic-celestial pairings as a recurring Mesopotamian motif), foster-2007 (passim — late-Babylonian compositional milieu), foster-2005 and dalley-2008 (negative attestation: do not include this composition). Hoffner 1998 is named in the COMPARATIVE-HOOK section for the Hurro-Hittite comparison but no EVIDENCE token routes through it (not yet in sources.yaml — the COMPARATIVE-HOOK is a note for the comparative chapter). All seven source IDs in EVIDENCE tokens resolve to existing entries in sources.yaml. Glossary check: Uraš, Marduk, Anu, Ea, and the dossier-locus terms (Apsû, Tablet of Destinies) are used per the locked glossary.yaml renderings. Damkina is referenced from the chapter 07 first-mention gloss tracked in gloss-ledger.yaml. The brief's analytical pairing with Damkina's Bond is preserved as the closest internal comparandum and as a COMPARATIVE-HOOK."
