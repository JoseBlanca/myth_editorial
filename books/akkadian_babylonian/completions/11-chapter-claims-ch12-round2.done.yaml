summary: |
  Chapter 12 (The First Brick) round-2 claims document. Round-1 claims-factcheck (chapters/12-first-brick.claims.factcheck.yaml) returned BLOCK with three HIGH findings: F-1 CONTAMINATION (round-1 framed *First Brick* as Marduk-centred; Lambert 2013 chapter 33 is in fact Ea-centred per three independent Wikipedia summaries footnoted to specific Lambert pages within pp. 376–381); F-2 CITATION-WRONG (round-1 described single-witness manuscript; the composition is preserved on multiple Late Babylonian tablets — principally WVDOG 4 plate 12, with "etc." per Streck 2014 BSOAS — plus a late Assyrian fragment); F-3 CITATION-WRONG (round-1 framed the ritual context as new-temple foundation; the composition is a temple-RENOVATION incantation, with libittu maḫrītu being the brick recovered from the existing temple). The brief was revised round-2 (see briefs/12-first-brick.yaml header) and the claims rewritten on the corrected content model.

  Round-2 content model: *The First Brick* is an Ea-centred polytheistic / craft-pantheon-creation cosmogony embedded in a temple-renovation incantation. Ea creates the freshwater deep (Apsû/Abzû) and then fashions from clay seventeen named craft-pantheon deities (Kulla — the brick-god, tasked to renovate the libittu maḫrītu; Ninildu, Ninsimug, Ninagal — tasked to help with the construction; Arazu, Guškinbanda, Ninzadim, Ninkurra, Ašnan, Laḫar, Siris, Ningišzida, Ninšar, Adag, Umunmutamgu, Umunmutamnag — tasked to supply resources to mankind for the regular offerings; Kusu — tasked to perform the rites of the temple, addressed as "chief priest of the great gods") plus a king and mankind. The libittu maḫrītu ("first/former brick") is the brick recovered from the existing temple's structure during renovation, recycled into the new structure as a continuity-marker between old and new temples. Marduk is NOT in the composition; the round-2 claims explicitly note this and frame *First Brick* as belonging to the late-Babylonian creation dossier's Ea-centred minority register.

  Round-2 narrative structure: source overview (multi-witness manuscript transmission; Lambert 2013 chapter 33 / pp. 376–383 as sole modern critical edition); setting (temple renovation, libittu maḫrītu); Ea creates the freshwater deep; Ea fashions the craft-pantheon from clay (Kulla; the construction trio Ninildu/Ninsimug/Ninagal; the resource-supply cohort; Kusu the priest); Ea creates the king and mankind; the labour of renovation as the divine archetype; lexical commentary on libittu and libittu maḫrītu; variants and witness; place in the corpus (Ea-centred minority register); closing reflection on the diversity of Babylonian creation thought. Three INFERENCE markers (Ea-centred coherence with craft-pantheon subject; Sumerian-named-deity inheritance into Akkadian late-Babylonian theology; closing reflection on register diversity). One LACUNA marker (multi-witness with manuscript damage; multi-witness control mitigates but does not eliminate philological reconstruction). One RECONSTRUCTION marker (Lambert 2013's composite text from cross-witness joining). One VARIANT marker (single-prevalent classification retained; witnesses function as duplicates of a single recension). Five COMPARATIVE-HOOK comments: (i) Akkadian-internal architectural-cosmogony grouping with explicit divine-actor mismatch hedge; (ii) Akkadian-internal late-Babylonian dossier breadth; (iii) Mesopotamian-internal Sumerian-named-deity inheritance; (iv) Hebrew Bible Job 38:6; (v) Egyptian temple-renovation rituals; (vi) methodological / book-structural closing observation.

  Source IDs used in EVIDENCE tokens (44 total): lambert-2013 (the principal anchor at pp. 376–383 throughout; also pp. 1–401 and pp. 281–401 for the wider dossier observation); foster-2007 (passim for the late-period dossier and incantation-cosmogony genre); black-green-1992 (s.v. Ea, brick, foundation rituals, Kulla, Kusu, craftsmen-deities); bottero-2001 (passim on temple-foundation and temple-renovation cult, foundation-rite typology, royal piety, Babylonian theology); cad (L, s.v. libittu; M/I, s.v. maḫrû). All five source IDs resolve to existing entries in sources.yaml.

  Glossary check: Marduk, Ea, Apsû, Abzû (Sumerian-form note for Lambert's late-Babylonian translation), Tiamat, Enūma Eliš, akītu — all use locked glossary.yaml renderings. Ea is given a substantive first-mention gloss as "the wise god of the freshwater Apsû, patron of craft and cunning, father of Marduk in the wider Babylonian theology". The Akkadian common noun *libittu* (brick) and the technical phrase *libittu maḫrītu* (first/former brick) are glossed at first mention. The named craft-pantheon deities (Kulla, Ninildu, Ninsimug, Ninagal, etc.) are glossed inline at first mention. CAD L (libittu) and CAD M/I (maḫrû) referenced as the standard Akkadian-dictionary entries.

