  carried over unchanged; all 190 EVIDENCE tokens preserved byte-for-
  byte. Chapter ID anchor [[ch-17-gilgamesh-sb]] (per toc.yaml; NOT
  the claims-only anchor [[ch-17-gilgamesh-sb-claims]]).

  Composite-editorial classification per the brief — George 2003's
  SB recension narrated directly as the body text, with OB and MB
  forerunners cited by name and dialect as cross-fill donors flagged
  in RECONSTRUCTION markers (Tablet IV OB/MB cross-fill; Tablet VII
  Nineveh+Sultantepe joins). Tablet-by-tablet structure for Tablets
  I–XI (Tablet I: Gilgameš at Uruk, the creation of Enkidu, the
  meeting; Tablet II: Enkidu enters Uruk, the wrestling-match, the
  proposal to attack Ḫumbaba; Tablet III: preparations, Ninsun's
  prayer to Šamaš, departure; Tablet IV: the seven-day-march journey
  and the dream sequences; Tablet V: the slaying of Ḫumbaba in the
  Cedar Forest; Tablet VI: Ištar's proposal and the Bull of Heaven;
  Tablet VII: Enkidu's curse-and-blessing of Šamḫat, the death of
  Enkidu; Tablet VIII: Gilgameš's mourning and Enkidu's funeral;
  Tablet IX: the journey begins — wandering, Mt Māšu, the Scorpion-
  People; Tablet X: Šiduri, Ur-šanabi, the crossing of the Waters of
  Death; Tablet XI: the flood narrative, the plant of rejuvenation,
  the return). Tablet XII presented as a separate editorial-appendix
  section flagged by [VARIANT:] with the literal/near-verbatim
  framing per the F-4 fix in the claims document.

  Two prologues co-present within SB Tablet I (the late-recension
  *ša naqba īmuru* outer-wisdom prologue and the inner hymnic *šūtur
  eli šarrī* opening) narrated in dedicated §"The two prologues"
  section; the redactional doubling preserved as [VARIANT:] within
  the single SB recension rather than as a recensional split.
  Sîn-lēqi-unninni's redactorship handled as [INFERENCE:] per the
  claims document: the body prose presents the attribution
