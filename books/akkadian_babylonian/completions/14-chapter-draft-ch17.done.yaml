summary: |
  Chapter 17 (Standard Babylonian Epic of Gilgameš) narrative draft.
  Asimov-style prose drawn from chapters/17-gilgamesh-sb.claims.
  approved.adoc (post-human-normalize PASS-WITH-LIGHT-FIXES version).
