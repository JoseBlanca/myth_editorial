round1_to_round2_resolution_check: |
  All round-1 findings resolved per the brief's R2-1 through R2-6
  revisions:

  R2-1 (Ea principal, not Marduk; round-1 F-1 CONTAMINATION):
  RESOLVED. The round-2 claims foreground Ea throughout; no
  §"Marduk as divine architect" section; Marduk appears only in
  Ea's first-mention gloss, in explicit absence statements, and
  in comparative observations about other dossier compositions.

  R2-2 (Wider divine cast / seventeen craft-pantheon deities;
  round-1 F-1): RESOLVED. The seventeen named deities (Kulla,
  Ninildu, Ninsimug, Ninagal, Arazu, Guškinbanda, Ninzadim,
  Ninkurra, Ašnan, Laḫar, Siris, Ningišzida, Ninšar, Adag,
  Umunmutamgu, Umunmutamnag, Kusu) match the Wikipedia s.v. Enki
  verbatim list name-for-name and role-for-role. Plus the king
  and mankind, also in Wikipedia's verbatim summary.

  R2-3 (Temple renovation, not new-temple foundation; round-1
  F-3 CITATION-WRONG): RESOLVED. Section heading "Setting: temple
  renovation and the *libittu maḫrītu*" (line 58); explicit
  framing of the libittu maḫrītu as the brick recovered from the
  existing temple's structure and reset into the new structure
  as a continuity-marker between old and new temples (line 60);
  lexical commentary at line 120 explicitly distinguishes the
  "first/former brick" reading from "the inaugural brick of the
  building".

  R2-4 (Multi-witness manuscript history; round-1 F-2
  CITATION-WRONG): RESOLVED. Multiple Late Babylonian tablets
  (principally WVDOG 4 plate 12, with "etc." per Streck 2014)
  plus a late Assyrian fragment, consistently described at
  lines 51, 54, 56, 126, 128. The LACUNA, RECONSTRUCTION, and
  VARIANT markers all reflect the multi-witness reality.
  Single-prevalent classification retained on the
  duplicate-vs-recensional rationale per round-1 F-2 recommended
  fix.

  R2-5 (ušumgallu removed; round-1 F-4 UNVERIFIED): RESOLVED.
  The string "ušumgallu" does not appear anywhere in the round-2
  claims document; the §"The ušumgallu attribute and the
  foundation register" section is removed entirely; the
  associated INFERENCE marker is gone.

  R2-6 (Architectural-cosmogony framing hedged; round-1 F-5
  INFERENCE-OVER-EXTENDS): RESOLVED. The COMPARATIVE-HOOK at
  line 155 explicitly notes the divine-actor mismatch between
  *First Brick* (Ea-centred) and *Toil of Babylon* / *Founding
  of Eridu* (Marduk-centred); the closing-reflection INFERENCE
  at line 153 also handles the dossier-diversity framing in a
  way that does not assimilate *The First Brick* to a
  Marduk-centred whole.

  Round-1 LOW findings F-6 (libittu vs. libittu maḫrītu
  precision) and F-7 (WVDOG 4 plate 12 citation precision) are
  also RESOLVED at the round-2 rewrite stage: line 120 carries
  the libittu maḫrītu lexical commentary with both CAD L and
  CAD M/I cited; lines 51, 54, 126, 128 cite WVDOG 4 plate 12
  consistently.
