summary: |
  Chapter 12 (The First Brick) round-2 factcheck: VERDICT PASS.
  All five round-1 HIGH/MEDIUM findings (F-1 CONTAMINATION /
  Marduk-centred-reading; F-2 CITATION-WRONG / single-witness;
  F-3 CITATION-WRONG / new-foundation; F-4 UNVERIFIED /
  ušumgallu; F-5 INFERENCE-OVER-EXTENDS / architectural-
  cosmogony framing) are RESOLVED. Both round-1 LOW findings
  (F-6 libittu maḫrītu precision; F-7 WVDOG 4 plate 12
  citation) are also RESOLVED. The round-2 rewrite faithfully
  applies the brief's R2-1 through R2-6 content-model
  corrections. The seventeen named craft-pantheon deities at
  lines 91, 95, 99, 103 match Wikipedia s.v. Enki's verbatim
  list (round-1 q3) name-for-name and role-for-role. The new
  round-2 INFERENCE on Sumerian-named-deity inheritance (line
  111) is properly hedged with basis-and-risk fields. The
  single new finding F-R2-1 (LOW) is a precision concern on a
  minor sub-claim (Arazu "partly-Akkadianised" qualifier) within
  the otherwise well-founded Sumerian-inheritance INFERENCE; it
  is not blocking and can be addressed optionally at the
  chapter-draft stage. Source-id resolution: lambert-2013,
  foster-2007, black-green-1992, bottero-2001, cad all resolve;
  Streck 2014 and Novotny 2010 are correctly named-but-flagged.
  Glossary compliance: Marduk, Ea, Apsû, Tiamat, *Enūma Eliš*,
