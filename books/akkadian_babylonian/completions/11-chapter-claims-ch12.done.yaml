summary: |
  Chapter 12 (The First Brick) claims document. Brief preemptively revised before stage 10a, on the basis of Lambert 2013 TOC verification (DeGruyter Brill chapter landing for "The First Brick", doi:10.1515/9781575068619-028): the original brief's Lambert 2013 pp. 384–386 is wrong (the verified range for "The First Brick" — Lambert 2013 chapter 33 — is pp. 376–383). This correction is consistent with the chapter 10 brief revision, which determined that pp. 366–375 is "The Founding of Eridu" and pp. 376–383 is "The First Brick". Audit finding A8 (severity MEDIUM, kind SILENT-CONFLATION) is accordingly resolved at brief level.

  Composition: short late-Babylonian Akkadian composition that grounds the act of brick-laying in temple foundation rituals as an inherited divine archetype. Sole modern critical edition: Lambert 2013, *Babylonian Creation Myths*, pp. 376–383 (chapter 33 in the volume's "Further Babylonian Creation Tales" section). No widely-used English-language anthology translation; Foster 2005 and Dalley 2008 do not include this composition. Single late-Babylonian manuscript with several damaged passages; precise sequence of divine action in laying the first brick is partly reconstructed.

  Narrative structure (recoverable level): foundation-ritual context grounds brick-laying in divine archetype; Marduk as divine architect of the first brick; Ea associated with foundational construction (patron of craft); the first brick (*libittu*) as cosmic prototype for all subsequent bricks; the *ušumgallu* great-dragon attribute invoked in the foundation-ritual register. Composition belongs to the architectural-cosmogony sub-corpus alongside *The Toil of Babylon* (chapter 7) and *The Founding of Eridu* (chapter 10). Closing chapter of the book's cosmogonic cycle (chapters 1–12); chapter accordingly carries a brief summative reflection on the diversity of Babylonian creation thought beyond the dominant *Enūma Eliš*.

  Three INFERENCE markers: (i) architectural-cosmogony sub-corpus framing of *First Brick* with *Toil of Babylon* and *Founding of Eridu* as a register-coherent group within the late-Babylonian dossier; (ii) the *ušumgallu* attribute's appearance in foundation-ritual context as marking the cosmogonic-tier scale of the foundational act; (iii) closing-reflection inference on the breadth of registers preserved in the cosmogonic dossier (combat, flood, theogony, labour-rebellion, boundary-disputes, marital bond, city-foundation, incantation, architectural foundation), arguing against any reading of Babylonian cosmogony as a single epic dressed in different costumes. One LACUNA marker (single late-Babylonian manuscript with damaged lines; precise sequence of divine action partly indeterminate). One RECONSTRUCTION marker (Lambert 2013's internal-context philological restoration; no parallel manuscripts available for cross-witness reconstruction; confidence low to medium). One VARIANT marker (single-prevalent classification per brief; no parallel manuscripts).

  Five COMPARATIVE-HOOK comments: (i) Akkadian internal — *First Brick* / *Toil of Babylon* / *Founding of Eridu* as the architectural-cosmogony sub-corpus; (ii) Akkadian internal — wider late-Babylonian Marduk-cosmogonic dossier framing; (iii) Hebrew Bible Job 38:6 cornerstone imagery (typological parallel; reserved for influences chapter); (iv) Egyptian foundation-deposit rituals (typological parallel; reserved for influences chapter); (v) worldwide foundation-ritual typology (founding-as-cosmogony); (vi — methodological) closing chapter of the cosmogonic cycle, dossier-as-a-whole observation feeding into the comparative chapter and influences chapter.

  Source IDs used in EVIDENCE tokens: lambert-2013 (the principal anchor at pp. 376–383 throughout; also pp. 1–401 for the wider dossier observation in the closing reflection); foster-2007 (passim for the late-period dossier and its compositional milieu); black-green-1992 (s.v. brick, foundation rituals, Marduk, Ea, dragons, ušumgallu); bottero-2001 (passim on the temple-foundation cult, royal piety, Mesopotamian theology of craft, foundation-rite typology, the temple-as-cosmos register); cad (L, s.v. libittu — for the Akkadian masonry term). All five source IDs resolve to existing entries in sources.yaml.

  Glossary check: Marduk, Ea, Apsû, Tiamat, Enūma Eliš, akītu — all use locked glossary.yaml renderings. Ea is given a substantive first-mention gloss in the chapter as "the wise god of the freshwater *Apsû*, patron of craft and cunning". The Akkadian common noun *libittu* (brick) is glossed at first italicised mention; *ušumgallu* (great-dragon attribute) similarly glossed at first italicised mention. CAD L referenced as the standard Akkadian dictionary entry for *libittu*.
