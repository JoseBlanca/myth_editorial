summary: "Chapter 7 (The Toil of Babylon) claims document, round 2, rewritten on the corrected brief after factcheck-1 returned BLOCK / MAJOR-REVISE on round 1. Content model is now the labour-rebellion / divine-displeasure / urban-doom register attested in the surviving columns of Lambert 2013 pp. 301–310: Col. I — Anunnaki hostile to the father of the gods (line 1), Marduk despondent in his temple (line 2), populace of Babylon conscripted into forced labour (lines 5–6), figure determined to overthrow the dynasty (line 13); Col. II — Enlil exultant, Lugaldukuga bitter, Damkina's command to put a figure to death, figure escapes; Col. V — gods decree extinguishing as destiny of the peoples (line 9), gods weep for Babylon (lines 17–19). Page range corrected from pp. 366–375 (Slaying of Labbu) to pp. 301–310 throughout. Manuscript identifier dropped (BM 47860 unverified and likely wrong); working description: single Neo-Babylonian tablet edited by Lambert 2013, witness lineage Boscawen TSBA 5 (1876) → King STC I (1902). Dating corrected from Hellenistic to Neo-Babylonian. Closest Akkadian comparandum reframed: Atra-ḫasīs Igigi-rebellion register (Lambert & Millard 1969), NOT Enūma Eliš VI's Esagil-construction sequence (which is now framed as counter-foil). Two new entities introduced from the corrected content (Damkina, Lugaldukuga); these will need glossary entries on first use in the chapter draft. Royal-legitimation function dropped. lullū/awīlu reading dropped. INFERENCE markers rewritten: (i) Atra-ḫasīs as closer comparandum than Enūma Eliš VI; (ii) Toil of Babylon as darker theological counterpart to Enūma Eliš within the late-Babylonian Marduk dossier. Genesis-11 COMPARATIVE-HOOK reframed: not 'celebration vs condemnation' but 'two Babylon-as-locus-of-divine-displeasure traditions with different theological resolutions'."
