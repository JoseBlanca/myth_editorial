  on Sippar); F-2 (Kinnier Wilson 1985 / Novotny 2001
  named-but-flagged in body prose at SB-recension section,
  replacing the unverified Saggs 1986 — 0 hits on Saggs);
  F-3 (full seven-gate sequence preserved with inline
  deity descriptors at five body-prose loci). Co-equal
  recensions handling per the brief: PASS — OB, MA, SB
  presented side by side. Structural lost ending: PASS —
