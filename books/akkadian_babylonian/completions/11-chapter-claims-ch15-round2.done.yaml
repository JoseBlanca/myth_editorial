summary: |
  Chapter 15 (Anzû) round-2 claims revision. Round-1 factcheck
  returned BLOCK with four HIGH findings (F-1 SB tablet count;
  F-2 SB candidate-search canonical sequence; F-3 OB manuscript
  provenance / Tell Asmar; F-4 Black & Green misattribution on
  Ningirsu/Ninurta identity), one MEDIUM finding (F-5 fifty-names
  hedging), and one LOW finding (F-6 OB Sharur fragmentary
  attestation / Lugal-e comparative framing). Round-2 corrections
  applied to both the brief and the claims:

  Brief (R2-1, R2-2, R2-3, R2-4): added a ROUND 2 CORRECTIONS
  preamble. Corrected the variants block: prevalent_version
  why_prevalent reframed from "SB Anzu (2 tablets, ...)" to
  "SB Anzû (3 tablets — Tablet I, II, III per Annus 2001 SAACT 3
  ToC)" and the SB-vs-OB comparison reframed from tablet-count
  difference to LENGTH/elaboration difference (both recensions on
  three tablets; SB longer and more elaborated). The OB
  alternates entry now specifies Susa manuscripts only — Sb 9470
  (= OB Anzu II) and Sb 14683 (= OB Anzu III), both Louvre per
  SEAL HUJI — and explicitly notes that "NOT attested on Tell
  Asmar tablets; the Tell Asmar Hoard's Anzû bird is
  iconographic." The SB alternates entry's Ningirsu/Ninurta
  framing reframed from "identified with Ningirsu but distinct
  in pantheon" to "originally distinct cult-centre deities
  subsequently syncretized" per Black & Green 1992 (via Wikipedia
  s.v. Ningirsu). entities_glossary expanded to include Gerra
  (also Girra, Gibil) as the second candidate-refuser in the
  canonical Adad → Gerra → Šara SB sequence; Ea and Bēlet-ilī
  (Mami) also added for completeness. Šara's gloss updated to
  reflect "third refuser, son of Ištar." Adad's gloss updated to
  "first refuser." Lacunae entries updated with Sb 9470 / Sb
  14683 specifications. The iconography centrality_evidence
  expanded to note the Tell Asmar Hoard statue as iconographic
  precursor, not literary witness. special_instructions
  thoroughly rewritten to specify the three-tablet SB structure,
  the Susa-only OB provenance, the Adad → Gerra/Gibil → Šara
  canonical sequence, the syncretism reading of Ningirsu/Ninurta,
  and the fifty-names hedging.

  Claims (F-1 through F-6): added a ROUND 2 CORRECTIONS preamble
  comment block documenting all six findings addressed. Applied
  F-1 throughout (SB recension three tablets, Tablet I, II, III
  per Annus 2001 SAACT 3 ToC — corrected in source-overview,
  SB-recension narrative, LACUNA marker, RECONSTRUCTION marker,
  VARIANT block, corpus-place §; the SB-vs-OB comparison
  reframed from tablet-count difference to LENGTH/elaboration
  difference). Applied F-2 (rewrote the SB candidate-search to
  follow the canonical Adad → Gerra/Gibil → Šara sequence —
  three named candidates who all refuse before Ea proposes
  Ninurta; inserted a new claim paragraph for Gerra as the
  second refuser, identifying him as the fire-god; corrected
  Šara's position to THIRD with the parenthetical "son of Ištar"
  per altorientale-mythologie; Ea's proposal paragraph updated
  to reference "Adad, Gerra, and Šara have declined" instead of
  "Adad and Šara"). Applied F-3 (removed all references to "Tell
  Asmar tablets" as OB literary witnesses; OB Anzû manuscripts
  now consistently specified as Susa manuscripts only — Sb 9470
  = OB Anzu II; Sb 14683 = OB Anzu III, both Louvre per SEAL
  HUJI; the Tell Asmar Hoard statue's Anzû-bird base appears
  only in the iconography paragraph as Early Dynastic
  iconographic precursor). Applied F-4 (rewrote the
  Ningirsu/Ninurta identity framing at the co-equal note § and
  the Variants & witness § to reflect Black & Green 1992's
  actual reading — originally distinct cult-centre deities
  syncretized by the time of Gudea — and hedged the question
  with the explicit "Assyriologists remain divided" framing per
  Wikipedia s.v. Ninurta; the OB→SB substitution is now framed
  as a cult-political syncretism, not as a mere local-name
  change). Applied F-5 (hedged the "fifty names" claim: the SB
  closing hymn is now described as "a hymnic litany of
  Ninurta's names and epithets across the southern Mesopotamian
  sanctuaries — a structural feature paralleled by the fifty-
  names finale of Enūma Eliš (Tablet VI–VII), where Marduk's
  victory over Tiamat is similarly celebrated by an extended
  litany of names. Whether the SB Anzû closing hymn formally
  enumerates exactly fifty names is not securely established in
  the surviving text"; the INFERENCE marker is retained and
  expanded to note the count-hedging explicitly; the corpus-
  place § now reads "a litany of Ninurta's names and epithets
  in the SB Anzû (paralleling the Enūma Eliš structure, with
  the exact count for SB Anzû not securely established)").
  Applied F-6 (hedged the OB Sharur attestation: "fragmentarily
  attested in the OB recension per Vogelzang 1988"; the
  Sumerian COMPARATIVE-HOOK now foregrounds the Lugal-e
  comparative observation — "Sharur is more prominent in
  *Lugal-e* (where the mace's role is foregrounded as Ninurta's
  encourager-to-battle) than in the Akkadian *Anzû*"; the
  Sharur INFERENCE marker's risk field updated to note the
  Lugal-e comparative material as Sumerian and thus
  out-of-scope as primary).

  Source IDs unchanged from round 1: annus-2001, vogelzang-1988,
  foster-2005, dalley-2008, black-green-1992, bottero-2001,
  foster-2007, lambert-2013. Watkins 1995 retained as
  named-but-flagged in IE COMPARATIVE-HOOK (ACCEPTABLE per
  skill and N-1 of the round-1 factcheck — no EVIDENCE token
  routes through Watkins). Hoffner 1998 retained as
  named-but-flagged in Hittite COMPARATIVE-HOOK. Marker counts:
  2 INFERENCE + 2 LACUNA + 2 RECONSTRUCTION + 1 VARIANT = 7
  markers (unchanged from round 1). Comparative-hook count:
  5 COMPARATIVE-HOOKs (unchanged). Round-2 chapter is 306 lines
  (vs round-1's 245 lines; the additional 61 lines are mostly
  the round-2 preamble correction-log plus the new Gerra claim
  paragraph, the expanded Black & Green / Ningirsu-Ninurta
  framing, the hedged fifty-names framing, and the Tell Asmar
  Hoard iconography paragraph).

findings_addressed:
  - finding_id: F-1
    kind: FACTUAL-ERROR
    severity: HIGH
    disposition: ACCEPT
    rationale: "Corrected SB recension structure from 'two tablets' to THREE tablets (Tablet I, Tablet II, Tablet III) per Annus 2001 SAACT 3 ToC, throughout the document — source-overview (line 29 region), SB-recension narrative § header context, LACUNA marker, RECONSTRUCTION marker, VARIANT block, corpus-place §. The SB-vs-OB comparison reframed in terms of LENGTH (SB longer and more elaborated on the same three-tablet frame as the OB), not tablet count. The writer's own EVIDENCE tokens citing 'SB Tablet III' (rounds 1 lines 184–187, 191) are now consistent with the body framing. The brief's variants block (prevalent_version, alternates) was also corrected at the brief level. Independently confirmed by Eisenbrauns ToC for Annus 2001 (verbatim 'Tablet 1,' 'Tablet 2,' 'Tablet 3'), gatewaystobabylon, encyclopedia.com, bildungblocks."
  - finding_id: F-2
    kind: FACTUAL-ERROR
    severity: HIGH
    disposition: ACCEPT
    rationale: "Rewrote the SB candidate-search to follow the canonical Adad → Gerra/Gibil → Šara sequence (three named candidates who all refuse before Ea proposes Ninurta). Adad as first refuser (canal-controller / storm-god) retained. New claim paragraph inserted for Gerra (Girra, Gibil) as the second refuser, identifying him as the fire-god. Šara repositioned as the THIRD refuser, with the parenthetical 'son of Ištar' per altorientale-mythologie. Ea's proposal paragraph updated to reference 'Adad, Gerra, and Šara have declined' (instead of the round-1 'Adad and Šara'). The brief's entities_glossary updated to include Gerra (also Girra, Gibil) as a candidate-hero deity. Triangulated against gatewaystobabylon (verbatim 'Adad (canal-controller), Gerra, and Shara (Ishtar's son)'), encyclopedia.com (verbatim 'Adad... Girru and Shara'), altorientale-mythologie ('Adad → Gibil → Šara')."
  - finding_id: F-3
    kind: FACTUAL-ERROR
    severity: HIGH
    disposition: ACCEPT
    rationale: "Removed all references to 'Tell Asmar tablets' as OB literary witnesses. OB Anzû manuscripts now consistently specified as Susa manuscripts only — Sb 9470 (= OB Anzu II) and Sb 14683 (= OB Anzu III), both Louvre per SEAL HUJI — at the source-overview, the OB-recension narrative, the LACUNA and RECONSTRUCTION markers, the VARIANT block, the corpus-place §, and the geographic spread §. The Tell Asmar Hoard statue's Anzû-bird base (early-dynastic eye-statue from Eshnunna with an Anzû bird carved on the statue base, Black & Green s.v. Anzû) appears only in the iconography paragraph as Early Dynastic iconographic precursor, never as a literary witness. The brief's lacunae entry, alternates entry, and centrality_evidence iconography subentry are all updated in concert."
  - finding_id: F-4
    kind: EVIDENCE-MISATTRIBUTION
    severity: HIGH
    disposition: ACCEPT
    rationale: "Rewrote the Ningirsu/Ninurta identity framing at both the co-equal note § and the Variants and witness § to reflect Black & Green 1992's actual reading (via Wikipedia s.v. Ningirsu): the two are treated as originally distinct cult-centre deities (Ningirsu at Lagash; Ninurta at Nippur, warrior-son of Enlil), subsequently syncretized by the time of Gudea (late third millennium). The 'same warrior-god under different local names' framing is removed. The scholarly division is made explicit: 'Assyriologists remain divided on whether the two were originally manifestations of a single warrior-god or two distinct deities subsequently merged' (per Wikipedia s.v. Ninurta). The OB→SB substitution is reframed as a cult-political syncretism / consolidation under the Nippur-centred name, not as a mere rename. Black & Green 1992 is cited correctly. The brief's variants alternates entry and special_instructions are updated in concert."
  - finding_id: F-5
    kind: HEDGING-NEEDED
    severity: MEDIUM
    disposition: ACCEPT
    rationale: "Hedged the 'fifty names' claim. The SB closing hymn is now described as 'a hymnic litany of Ninurta's names and epithets across the southern Mesopotamian sanctuaries — a structural feature paralleled by the fifty-names finale of Enūma Eliš (Tablet VI–VII), where Marduk's victory over Tiamat is similarly celebrated by an extended litany of names.' The body explicitly hedges: 'Whether the SB Anzû closing hymn formally enumerates exactly fifty names is not securely established in the surviving text; the structural parallel to the Enūma Eliš fifty-names finale is the load-bearing observation.' The INFERENCE marker for the parallel is retained and expanded to note the count-hedging. The corpus-place § now reads 'a litany of Ninurta's names and epithets in the SB Anzû (paralleling the Enūma Eliš structure, with the exact count for SB Anzû not securely established).' Triangulated against gatewaystobabylon (verbatim 'multiple divine names and epithets for Ninurta across various locations... though the exact count isn't specified as fifty')."
  - finding_id: F-6
    kind: PARTIAL-SUPPORT / COMPARATIVE-FRAMING
    severity: LOW
    disposition: ACCEPT
    rationale: "Hedged the OB Sharur attestation: 'fragmentarily attested in the OB recension per Vogelzang 1988' (replacing the round-1 'in fragmentary form'). The Lugal-e comparative observation foregrounded in the Sumerian COMPARATIVE-HOOK: 'The sentient war-mace Sharur is more prominent in *Lugal-e* (where the mace's role is foregrounded as Ninurta's encourager-to-battle) than in the Akkadian *Anzû* (where Sharur's role is concentrated in the messenger-to-Ea episode); this comparative observation is reserved for the influences chapter.' The Sharur INFERENCE marker's risk field updated to note the Lugal-e comparative material as Sumerian and thus out-of-scope as primary per scope.md. Triangulated against mythlok.com s.v. Sharur (verbatim 'In mythological narratives, particularly the epic *Lugal-e*, Sharur is depicted as essential to Ninurta's victories') and worldhistory.org/Ninurta (verbatim 'In the poem Lugale... Ninurta's mace, Sharur, encourages him to go battle the demon')."

