summary: |
  Post-factcheck normalization of chapter 11 claims after factcheck-round-1 returned REVISE (1 HIGH, 2 MEDIUM, 2 LOW + 3 NOTES). All five findings ACCEPTED and applied. The HIGH finding (Cohen-Wasserman 2018 misattribution) is a substantive bibliographic correction that propagates from the brief into the comparative-hook; the two MEDIUM findings (cosmogonic-chain step count; YOS 11, 5a publication attribution) are factual corrections to the chapter's structural claims; the two LOW findings (Aššur duplicates hedge; verbatim-quote variants) are wording tightenings.

  - F-1 (HIGH, CITATION-WRONG): The Hurrian Mari 5 reanalysis was misattributed to Cohen and Wasserman 2018; the actual authors are Dennis R. M. Campbell and Sebastian Fischer (Campbell and Fischer, "A Hurrian Ritual Against Toothache: A Reanalysis of Mari 5", *Revue d'Assyriologie* 112 [2018], 31–47). The genuine Cohen-Wasserman publication on Old Babylonian worm/leech incantations including YOS 11, 5a is the 2008 *RA* 102 article "On Leeches, Dogs, and Gods in Old Babylonian Medical Incantations" (pp. 71–88). The COMPARATIVE-HOOK at the end of the chapter is corrected to cite Campbell and Fischer 2018 with the actual finding from their reanalysis: the Hurrian Mari 5 ritual invokes the daughters of the sun-god Šimige rather than a worm etiology, so the parallel between the Akkadian *Worm and the Toothache* and the Hurrian Mari 5 is at the level of shared therapeutic concern (toothache treated through divine-invocation incantation), not a shared worm-cosmogony tradition. Cohen-Wasserman 2008 *RA* 102 is added as a separate named-but-flagged citation in the VARIANT marker and in the manuscript-history footnote, since it is the genuine Cohen-Wasserman publication on the OB worm-cosmogony tradition.

  - F-2 (MEDIUM, INTERNAL-VARIANCE): The original claims doc framed the cosmogonic chain as "seven steps" (Anu → heavens → earth → rivers → canals → marshes → mud → worm). This conflated two different translation traditions: Speiser's older ANET 1969 translation gives a five-step chain (Anu → heaven → earth → rivers → marsh → worm); Foster 2005 gives a six-step chain (Anu → heavens → earth → rivers → irrigation ditches → mud → worm — no "marsh" as a separate node). The brief locks Foster 2005 as the source-anchor, so the six-step framing is correct. The chapter is updated throughout to use the six-step framing with explicit acknowledgement of the Speiser five-step variant. Section heading "The seven-step cosmogonic chain" → "The cosmogonic chain". Claim 7's "seven-step cosmogonic sequence" → "six-step cosmogonic sequence" with the Speiser variant noted parenthetically. Claim 8's "seventh and final term" → "sixth and final term in Foster's translation (the fifth and final term in Speiser's earlier rendering)". The INFERENCE marker after claim 7 updated to drop the "seven-step" framing. The "place in the corpus" section's "seven-step" reference also corrected. The Theogony-of-Dunnu COMPARATIVE-HOOK's "seven-step Anu → ... → worm chain" updated to "six-step".

  - F-3 (MEDIUM, CITATION-WRONG): The OB worm-cosmogony variant publication was misattributed to "Hussey-van Dijk". The correct attribution is van Dijk, Goetze, and Hussey 1985 (*Early Mesopotamian Incantations and Rituals*, Yale Oriental Series 11), with van Dijk (Jan) as the lead editor. The YOS 11, 5 siglum is tightened to YOS 11, 5a (the "a" portion of tablet YBC 4616). The genre is clarified: YOS 11, 5a is an Old Babylonian worm/leech-against-infant incantation invoking Gula, not a toothache incantation; the cosmogonic-chain typology is shared with *The Worm and the Toothache*, but the genre is different (anti-pest vs. anti-toothache). The VARIANT marker is rewritten with the correct attribution, the precise siglum, and the genre clarification.

  - F-4 (LOW, UNDERVERIFIED): The Aššur-duplicates claim was hedged. The Nineveh principal witness is well-attested (BM K.2413 from Aššurbanipal's library, with parallel K-collection fragments — added to the source-overview and LACUNA marker). The Aššur-duplicates attestation is sourced through Foster 2005's apparatus rather than independently corroborated; the LACUNA, RECONSTRUCTION, and source-overview claims are updated to reflect this attribution chain.

  - F-5 (LOW, INTERNAL-VARIANCE): The worm's defiance verbatim quote was noted as an attested translation variant (Foster's wording vs. Speiser's slightly different wording in ANET). The chapter retains Foster's wording (consistent with the locked source-anchor); the variance is acknowledged in the meta-comment header rather than in the body of the claims.

  Additional housekeeping: section anchor updated from `[[ch-11-worm-and-toothache-claims]]` to `[[ch-11-worm-and-toothache-claims-approved]]` (matching chapters 7/8/9/10 approved-version convention); chapter title updated to "The Worm and the Toothache — Claims (post-factcheck approved)"; meta-header comment block expanded with the round-1 fix log (F-1 / F-2 / F-3 / F-4 / F-5 dispositions inline). The substantive narrative content is preserved; all 14 claim paragraphs, 2 INFERENCE markers, 1 LACUNA marker, 1 RECONSTRUCTION marker, 1 VARIANT marker, and 5 COMPARATIVE-HOOK comments are preserved with the citation-routing and structural-correction fixes applied.

