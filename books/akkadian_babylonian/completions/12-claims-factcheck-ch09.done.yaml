summary: |
  Chapter 9 (Damkina's Bond) claims-factcheck — verdict REVISE.
  The claims document represents a substantial improvement on the
  preemptively-revised brief, fully implementing the four upstream
  corrections that motivated the brief revision (page range pp.
  321–325, two-manuscript count A 7882 NA + BM 27776 NB,
  substantive Marduk-vs-Enlil narrative, Marduk-vs-elder-pantheon
  framing pairing with Enmešarra's Defeat). All four upstream
  corrections are fully corroborated by Wikipedia s.v. Damgalnuna
  and Oshima 2010 (academia.edu, read directly).

  The four surviving issues are all localized:
  - MEDIUM-1 (F-1): Line 73 parenthetical gloss inverts the
    Damkianna name-form chronology (Damkianna is LATE Akkadian, not
    older Sumerian-style; Damgalnuna is the older Sumerian form).
  - MEDIUM-2 (F-2): Line 95 link of 360 to "the count of stars in
    the standard Mesopotamian sky-list (Three Stars Each, MUL.APIN)"
    is wrong on the star-count (Three Stars Each = 36 stars,
    MUL.APIN = 71). The 360-day schematic-year link is correct and
    should be retained.
  - LOW (F-3): Line 49 attribution of "pirištu" specifically to the
    BM 27776 colophon is unverified in the secondary sources.
  - LOW (F-4): Line 87 VARIANT marker oversharpens the Lambert
    'bond' vs. Oshima 'burden' opposition; both readings carry the
    obligation/bond semantic component etymologically.

  Plus 2 NOTES on inventory-audit: Oshima 2010 venue can now be
  specified (Festschrift Westenholz, BPOA 8, Madrid: CSIC 2010,
  pp. 145–162); Streck 2014 sources.yaml addition recommendation
  carryover from chapter 8.

  Per the verdict rules (REVISE = 1–2 HIGH or >3 MEDIUM), the
  present case has 0 HIGH and 2 MEDIUM, which would normally give
  PASS. However, the 2 MEDIUM findings are factually substantive
  errors (inverted name-form chronology; wrong star-count
  attribution), not just citation-routing — and the chapter's
  audience-facing prose would carry these errors through to chapter-
  draft if not corrected here. Following the chapter 8 round-2
  precedent of rating systematically-or-substantively material
  MEDIUMs as REVISE rather than PASS, I rate this case as REVISE.

  After the four localized fixes, the claims document should PASS
  to chapter-draft. The substantive corrections from the upstream
  brief revision are all in place; the surviving issues are
  citation-routing and wording refinements.
