summary: |
  Chapter 18 (Etana) post-human-normalize. Round-1 claims-factcheck returned PASS-WITH-LIGHT-FIXES with one HIGH (F-1: OB recension provenance — pervasive Sippar misattribution; correct is Susa + Tell Harmal), two MEDIUM (F-2 Saggs 1986 join apocryphal; F-3 heaven-flight gates incomplete — only two named, surviving SB lines preserve seven), and one NOTE (N-1: brief's bottero-2001 secondary loc-note describes Etana as "antediluvian king", contradicting both the brief's own cross_cultural_parallels block and the chapter body's correct postdiluvian framing). The factcheck agent judged all three as post-human-normalizable rather than round-2-worthy; this stage applies the three fixes mechanically and consistently across the chapter body plus the brief correction.

    (1) F-1 HIGH: Replaced every body-prose "OB Sippar" / "Sippar tablets" / "OB Sippar (ca. 1700 BCE)" reference with "OB Susa + Tell Harmal" / "Susa and Tell Harmal tablets" / "OB Susa + Tell Harmal (ca. 1700 BCE)" across 13 locations: the comment block (line 8), source-overview paragraph (line 51), OB-recension paragraph and its EVIDENCE token (lines 57–58), MA-recension paragraph (line 63), source-overview parallel-reconstructions paragraph (line 75), OB LACUNA marker (line 88), RECONSTRUCTION marker (line 96), co-equal recensions paragraph (line 100), OB-recension section opening paragraph (line 113), OB pit-trap paragraph (line 133), OB heaven-flight breaks paragraph (line 151), VARIANT marker (line 258), and chronological-spread paragraph (line 280). The OB Etana tablets are from Susa (Elamite capital, modern Shush in southwestern Iran) and Tell Harmal (ancient Šaduppum, near Baghdad), per Kinnier Wilson 1985 / Novotny 2001 / Wikipedia s.v. Etana / multiple open-web sources; the "Sippar" misattribution was a pattern-match from other OB Akkadian compositions (Atra-ḫasīs MS B; OB Anzû; OB Gilgameš Sippar tablet). All cross-paragraph references verified consistent after the replacement.

    (2) F-2 MEDIUM: Replaced every body-prose "Saggs 1986 join" reference with Kinnier Wilson 1985 (*The Legend of Etana*, Aris & Phillips; ISBN 978-0856683817) and/or Novotny 2001 (SAACT 2 — *The Standard Babylonian Etana Epic*, Helsinki) across the five named-but-flagged locations identified by the factcheck (32, 69, 92, 176, 258): the SAGGS 1986 JOIN comment block (now MODERN SCHOLARLY EDITIONS OF THE SB RECENSION, line 29), source-overview SB-recension paragraph (line 69), co-equal recensions paragraph (line 100), SB LACUNA marker (line 92), SB-recension section opening paragraph and its footnote/EVIDENCE token (lines 176–177), and VARIANT marker (line 258). Both Kinnier Wilson 1985 and Novotny 2001 are cited as named-but-flagged anchors (neither is in sources.yaml); the substantive SB reconstruction remains anchored through foster-2005 and dalley-2008 EVIDENCE tokens. Two retrospective Saggs 1986 mentions remain only in the MODERN SCHOLARLY EDITIONS provenance comment block where they document the correction itself; these are intentional bibliographic provenance, not body-prose claims.

    (3) F-3 MEDIUM: Augmented the shared-narrative-spine paragraph (line 117) to name the full seven-gate sequence of the surviving SB lines (Anu, Enlil, Ea — the upper-triad gates; Sin, Šamaš, Adad, Ištar — the astral / weather-deity gates) rather than only Ištar and Anu. Inserted a new dedicated seven-gate claim paragraph in the heaven-flight section (immediately before the existing Ištar's-gate paragraph) enumerating the seven gates with their deity-pantheon glosses, anchored through foster-2005, dalley-2008, foster-2007, and black-green-1992 EVIDENCE tokens, with Kinnier Wilson 1985 and Novotny 2001 named-but-flagged as the modern critical editions consolidating the SB-recension lines that preserve the sequence. Updated the existing Ištar's-gate and Anu's-gate paragraphs (lines 230 and 236) to acknowledge each gate's position within the seven-gate sequence while preserving their existing focus as narrative load-bearers. Updated the variants-summary paragraph (line 276) to enumerate the full seven-gate sequence rather than only the two foregrounded gates.

    (4) N-1 NOTE: Corrected in the brief (briefs/18-etana.yaml), not in the approved claims doc, since the claims doc already correctly placed Etana on the postdiluvian side of the SKL flood-divide. The brief's bottero-2001 secondary loc-note ("passim — Etana as antediluvian king") was internally inconsistent with (i) the brief's own cross_cultural_parallels block (Etana "integrated into the antediluvian-postdiluvian royal sequence"), (ii) the scholarly consensus per the SKL (Etana is the thirteenth king of the FIRST POSTDILUVIAN Kish dynasty per W-B 444), and (iii) the chapter body (line 121 "the first city of postdiluvian kingship"; line 299 COMPARATIVE-HOOK "the postdiluvian royal sequence"). The brief now reads "passim — royal-divine relations and the antediluvian/postdiluvian royal sequence", and the lacunae[1] / variants entries / cultural_relevance entries / special_instructions were also corrected to remove the OB Sippar misattribution and the Saggs 1986 reference per F-1 / F-2. A brief comment block at the top of the brief documents all post-human-normalize edits.

  Provenance comment block appended at the foot of the approved file recording: timestamp, agent model, source / factcheck cross-reference, edits applied (F-1 / F-2 / F-3 / N-1), and structural checks passed.

findings_triage:
  - finding_id: F-1
    kind: FACTUAL-ERROR
    severity: HIGH
    disposition: ACCEPT
    rationale: "Applied the F-1 fix as proposed by the factcheck. The OB recension of Etana is from Susa (the Elamite capital, modern Shush in southwestern Iran) and Tell Harmal (ancient Šaduppum, near Baghdad), NOT from Sippar; this is the scholarly consensus per Kinnier Wilson 1985 (*The Legend of Etana*, Aris & Phillips), Novotny 2001 (SAACT 2), Wikipedia s.v. Etana, the Hejon07 Substack summary, and multiple WebSearch summaries. The 'Sippar' misattribution was pervasive (13 explicit occurrences across the comment block, source-overview paragraphs, dedicated OB-recension paragraphs, MA-recension paragraph, LACUNA marker, RECONSTRUCTION marker, co-equal recensions paragraph, OB-recension section opening, OB pit-trap paragraph, OB heaven-flight breaks paragraph, VARIANT marker, and chronological-spread paragraph) and load-bearing for the recension-history paragraphs. The fix is mechanical (find-and-replace across the 13 locations) with consistency-check across cross-paragraph references; the brief's lacunae[1] / variants.prevalent_version / variants.alternates[0] / centrality_evidence[0] entries are correspondingly corrected. The factcheck agent explicitly judged this post-human-normalizable rather than round-2-worthy on grounds that the error is localised to a single attribute (the OB provenance) and the fix is mechanical."
  - finding_id: F-2
    kind: CITATION-WRONG / UNVERIFIED
    severity: MEDIUM
    disposition: ACCEPT
    rationale: "Applied the F-2 fix as proposed by the factcheck (option a — replace Saggs 1986 references with Kinnier Wilson 1985 and Novotny 2001). H.W.F. Saggs's bibliography (per Wikipedia s.v. H.W.F. Saggs and CDLI Wiki) does not list a 1986 Etana publication; the closest 1980s Saggs publication is *The Might That Was Assyria* (1984), a popular history. The actual modern scholarly editions of the SB Etana are Kinnier Wilson 1985 (*The Legend of Etana*, Aris & Phillips, ISBN 978-0856683817) — the standard scholarly edition consolidating all three recensions and presenting the SB dossier in its most extensive form — and Novotny 2001 (SAACT 2 — *The Standard Babylonian Etana Epic*, Helsinki) — the modern cuneiform / transliteration / score / glossary critical edition of the SB recension. Both are cited as named-but-flagged anchors (neither is in sources.yaml); the substantive SB reconstruction remains anchored through foster-2005 and dalley-2008. The 'named-but-flagged' pattern the writer used is preserved (the new Kinnier Wilson 1985 / Novotny 2001 citations are bibliographic provenance in prose, not new EVIDENCE tokens or sources.yaml entries), per the task instruction. Five body-prose locations (lines 32, 69, 92, 176, 258 per the factcheck) corrected; two retrospective Saggs 1986 mentions remain only in the post-human-normalize provenance comment block where they document the correction."
  - finding_id: F-3
    kind: HEDGING-NEEDED
    severity: MEDIUM
    disposition: ACCEPT
    rationale: "Applied the F-3 fix as proposed by the factcheck, expanding the heaven-flight gates citation from the round-1 selective focus on Ištar's and Anu's gates to the full seven-gate sequence preserved in the surviving SB lines. Per the factcheck's evidence section (World History Encyclopedia: 'they passed through the gates of Anu, Enlil and Ea, and then through the gates of Sin, Shamash, Adad and Ishtar'; corroborated by Tree of Visions and GatewaysToBabylon translation mirrors), the surviving SB lines preserve the heaven-flight as a passage through seven gates in two groups: the upper-triad gates of Anu (sky-god), Enlil (storm-god and chief executive of the divine assembly), Ea (god of the *apsû* and of wisdom); and the astral / weather-deity gates of Sin (moon-god), Šamaš (sun-god), Adad (storm-god), Ištar (queen of heaven). The fix (a) augments the shared-narrative-spine paragraph (line 117) to name the full seven-gate sequence; (b) inserts a new dedicated seven-gate claim paragraph in the heaven-flight section enumerating the gates with their deity-pantheon glosses and anchored through foster-2005 / dalley-2008 / foster-2007 / black-green-1992 EVIDENCE tokens (and named-but-flagged Kinnier Wilson 1985 / Novotny 2001 as the modern critical editions); (c) updates the existing Ištar's-gate and Anu's-gate paragraphs to acknowledge each gate's position within the seven-gate sequence while preserving their existing focus as narrative load-bearers; (d) updates the variants-summary paragraph to enumerate the full seven-gate sequence. The reader is now given the full documentary record."
  - finding_id: N-1
    kind: BRIEF-INCONSISTENCY
    severity: NOTE
    disposition: ACCEPT
    rationale: "Applied the N-1 fix as proposed by the factcheck. The brief's bottero-2001 secondary loc-note ('passim — Etana as antediluvian king') was internally inconsistent with (i) the brief's own cross_cultural_parallels block ('integrated into the antediluvian-postdiluvian royal sequence'), (ii) the scholarly consensus per the Sumerian King List (Etana is the thirteenth king of the FIRST POSTDILUVIAN Kish dynasty per Weld-Blundell Prism W-B 444 and parallel copies), and (iii) the chapter body (line 121 'the first city of postdiluvian kingship'; line 299 COMPARATIVE-HOOK 'the postdiluvian royal sequence'). The writer correctly resolved the inconsistency in favor of the postdiluvian classification (per writer-flagged item 1 in the factcheck, UPHELD by the auditor: 'chapter correct; brief was wrong'). The brief now reads 'passim — royal-divine relations and the antediluvian/postdiluvian royal sequence', aligning with the brief's own cross_cultural_parallels block and with the chapter body's correct framing. A brief comment block at the top of the brief documents the N-1 edit alongside the F-1 / F-2 corrections also applied to the brief's lacunae[1] / variants / cultural_relevance / special_instructions fields."

