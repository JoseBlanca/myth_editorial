summary: "Chapter 8 (Uraš and Marduk) claims document round 2 — substantive rewrite after factcheck-1 returned MAJOR-REVISE on the original (Round 1) claims. The original framing as a chthonic-celestial pairing of the female cosmogonic earth-goddess Uraš with Marduk has been corrected to: a small fragmentary cosmogonic-agricultural narrative in which Marduk creates plant life for the MALE agricultural tutelary Urash of Dilbat. Source: Lambert 2013, pp. 311–315 (+ p. 496 notes), the sole modern critical edition, on a single damaged tablet UET 6, 398 from Ur (per Streck 2014, BSOAS 77, 371). The composition is read as a node in the late-Babylonian dossier of small Marduk-creation narratives and as a small narrative articulation of Marduk's syncretism with regional cult-figures (Urash being equated with 'Marduk of planting' in late-Babylonian commentary). Three INFERENCE markers (Marduk-syncretism reading; Marduk-creation-narrative-dossier framing; scholarly-preservation profile); one LACUNA marker (single tablet UET 6, 398 with substantial breaks); one RECONSTRUCTION marker (Lambert 2013's restoration of breaks within the single witness; no external in-tradition donor source available); one VARIANT marker (single-prevalent / restoration-variation within a single damaged witness, not exemplar-variation); three COMPARATIVE-HOOK comments (all internal Akkadian — Marduk's syncretism with local cult-figures; Marduk's cosmogonic creation of specific aspects of the lived world; Damkina's Bond as TOC-adjacent but separate composition). Source IDs used: lambert-2013 (sole anchor for textual claims, at corrected page range pp. 311–315 + p. 496), black-green-1992 (s.v. Urash for the male tutelary), rla (s.v. Uraš A and Uraš B for the male/female distinction), foster-2005 (negative attestation; pp. 436–440 for cosmogonic incantation prologues parallel), foster-2007 (passim for the late-Babylonian milieu), bottero-2001 (Marduk's syncretism), livingstone-1989 (SAA 3 Marduk-Address texts), dalley-2008 (negative attestation). All eight source IDs in EVIDENCE tokens resolve to existing entries in sources.yaml. Streck 2014 (BSOAS 77, 371) is named in the source-overview footnote for the manuscript identification (UET 6, 398) but no EVIDENCE token routes through it (named-but-flagged pattern; sources.yaml addition recommended in the round-1 factcheck note N-2). Glossary check: Marduk and the dossier-locus terms (Apsû, Tablet of Destinies) used per the locked glossary.yaml renderings; Urash, Dilbat, and Ur are introduced with first-mention glosses (the glossary-ledger.yaml will need new entries for Urash and Dilbat; Ur is already present in the sumer book lineage)."
