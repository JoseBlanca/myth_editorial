summary: |
  Chapter 17 (The Standard Babylonian Epic of Gilgameš) claims document.
  Composite-editorial classification per the brief: the SB recension
  attributed to Sîn-lēqi-unninni (named in the late Babylonian
  *Catalogue of Texts and Authors*, ca. 1200 BCE) is the dominant
  scholarly text; George 2003 (vols. 1–2, OUP) is the definitive
  critical edition, collating some 80 manuscripts from Nineveh,
  Aššur, Sultantepe, Sippar, Babylon, Uruk, and other centres. No
  single manuscript preserves the entire 12-tablet epic; the
  composite text is reconstructed from the multi-manuscript dossier.
  Old Babylonian (Pennsylvania, Yale, Sippar, Schøyen) and Middle
  Babylonian (Boğazköy, Megiddo, Ur, Nippur) forerunners are cited
  as cross-fill donors per scope.md's reconstruction policy. Foster
  2005 (pp. 99–220) is the working English translation; Dalley 2008
  (pp. 39–153) is the second triangulation; Foster 2007 (pp. 1–20)
  and Noegel 2005 (pp. 233–245) supply the genre and recensional
  context; Black & Green 1992 supplies the deity-and-figure
  triangulation (s.v. Gilgameš, Enkidu, Ḫumbaba, Bull of Heaven,
  Uta-napišti, Ištar, Šamaš, Ereškigal, scorpion-people, Ur-šanabi,
  Šiduri); Bottéro 2001 supplies the religious-thought commentary;
  Lambert & Millard 1969 supplies the Atra-ḫasīs intertext anchor
  for Tablet XI.

  Sources used (eight total, all resolving to existing sources.yaml entries):
    - george-2003 (primary; the definitive critical edition)
    - foster-2005 (primary-translation; principal English translation)
    - dalley-2008 (primary-translation; second triangulation translation)
    - lambert-millard-1969 (primary; Atra-ḫasīs intertext for Tablet XI)
    - black-green-1992 (secondary; deity and figure entries)
    - bottero-2001 (secondary; religious-thought commentary)
    - foster-2007 (secondary; pp. 1–20, late tradition and genre)
    - noegel-2005 (secondary; pp. 233–245, the Mesopotamian epic genre)
  Zero invented source IDs.

  Narrative structure: source overview (six claims on the 12-tablet
  composite-editorial structure, the manuscript dossier, the
  Sîn-lēqi-unninni attribution, George 2003 as critical edition,
  and the OB and MB forerunners) followed by a dedicated section on
  the two prologues (*ša naqba īmuru* and *šūtur eli šarrī*) handled
  as variant-openings within the SB recension, then tablet-by-tablet
  narrative claims:
    - Tablet I: Gilgameš at Uruk, Aruru's creation of Enkidu, the
      civilizing of Enkidu through Šamḫat, the two dreams of the
      coming companion;
    - Tablet II: Enkidu enters Uruk, the wedding-house wrestling-
      match, the proposal of the Cedar Forest expedition;
    - Tablet III: preparations, Ninsun's prayer to Šamaš, the
      adoption of Enkidu, departure from Uruk;
    - Tablet IV: the seven-day-march journey, the dream sequences,
      the threshold of the Cedar Forest (with the [RECONSTRUCTION:]
      marker for the OB/MB cross-fill);
    - Tablet V: the Cedar Forest, the slaying of Ḫumbaba, Šamaš's
      thirteen winds, the felling of the cedars;
    - Tablet VI: Ištar's proposal and Gilgameš's refusal, the Bull
      of Heaven, the slaying, Enkidu's thigh-throwing offence;
    - Tablet VII: the divine council's verdict on Enkidu, Enkidu's
      curse-and-blessing of Šamḫat at Šamaš's intervention, the
      descent-of-the-soul dream, the death of Enkidu (with the
      [RECONSTRUCTION:] marker for the Nineveh+Sultantepe joins);
    - Tablet VIII: Gilgameš's lament, the funerary statue, the
      state funeral, the catalogue of offerings to underworld gods;
    - Tablet IX: the departure as wanderer, the journey to Mt Māšu,
      the Scorpion-People, the tunnel beneath the mountain, the
      jewelled garden of the gods;
    - Tablet X: Šiduri the tavern-keeper, Ur-šanabi the boatman,
      the *urnu*-stones and three hundred punting-poles, the
      crossing of the Waters of Death, the meeting with Uta-napišti
      and the wisdom-discourse on mortality;
    - Tablet XI: the flood narrative (with the Atra-ḫasīs textual-
      dependence claim and Lambert & Millard 1969 anchor), the
      sleep test, the plant of rejuvenation, the snake's theft,
      the return to Uruk and the showing of the walls;
    - Tablet XII: handled as a SEPARATE editorial-appendix section
      (per the brief's special_instructions). The partial Akkadian
      translation of the second half of the Sumerian *Gilgameš,
      Enkidu, and the Netherworld* (ETCSL 1.8.1.4); the *pukku* and
      *mekkû*; Enkidu (alive in XII) descending to retrieve them;
      the dialogue on the fates of the dead. The narrative non-
      continuity with Tablets I–XI (Enkidu alive in XII having died
      in VII) and the editorial-annex framing are foregrounded;
      handled by a dedicated [VARIANT:] marker covering the
      Tablets-I–XI vs Tablet-XII compositional distinction.

  Markers used (per the brief's lacunae and variants blocks):
    - 3 [LACUNA:] markers: SB Tablet I prologue lines 1–28 (the late-
      recension prologue *ša naqba īmuru* with damage across the
      principal Nineveh manuscripts; scholarly_reconstruction: yes,
      cross-witness collation); SB Tablet IV (the Cedar Forest
      journey with breaks in the seven-day-march framework and the
      dream sequences; scholarly_reconstruction: yes, partial cross-
      fill from OB and MB forerunners with explicit dialect/period
      flagging); SB Tablet VII opening (Enkidu's curse and dream,
      damaged in the principal Nineveh manuscripts; scholarly_
      reconstruction: yes, Nineveh+Sultantepe joins).
    - 2 [RECONSTRUCTION:] markers: (i) Tablet IV cedar journey
      restored from OB Schøyen and Sippar tablets and MB Boğazköy
      fragments — in-tradition Akkadian per scope.md with dialect/
      period gap (OB→SB, MB→SB) explicitly flagged; confidence:
      medium. (ii) Tablet VII opening restored from secondary Nineveh
      manuscripts and Sultantepe joins within the SB recension;
      confidence: high.
    - 3 [VARIANT:] markers: (i) The two prologues (*ša naqba īmuru*
      late-recension prologue and *šūtur eli šarrī* original
      opening) as variant-openings co-present within the SB
      recension itself, both retained per George 2003's
      reconstruction; (ii) Tablets I–XI (integral eleven-tablet
      epic) vs Tablet XII (editorial appendix translating Sumerian
      material), the structural distinction per the brief's
      composite-editorial classification; (iii) SB recension as
      primary body text with OB and MB forerunners as cross-fill
      donors with explicit dialect/period flagging per scope.md's
      reconstruction policy.
    - 2 [INFERENCE:] markers: (i) Sîn-lēqi-unninni as REDACTOR of
      the SB recension (the *Catalogue of Texts and Authors* notice
      reconstructed as redactor-attribution rather than
      composer-attribution, with risk flagged that the catalogue
      notice is sparse and the precise scope of editorial
      intervention is reconstructed); (ii) The SB epic as a
      wisdom-literature meditation on kingship and mortality framed
      as heroic epic, anchored to the *ša naqba īmuru* prologue's
      wisdom register and the ring-composition closing on Uruk's
      walls — interpretive reading with risk flagged that the
      wisdom-literature reading is one line in the secondary
      literature alongside tragic, theological-justice, and
      political-legitimation readings.

  Five COMPARATIVE-HOOK comments at chapter foot:
    (i) Akkadian internal — Tablet XI as Atra-ḫasīs intertext,
        cross-linked to chapter 2 (the textual dependence
        documented by Lambert & Millard 1969 and traced in George
        2003; the Uta-napišti / Atra-ḫasīs character-equation
        preserved by the SB epithet);
    (ii) Akkadian internal — Tablet VI Bull of Heaven and the
         *Descent of Ishtar* (chapter 13 cross-link via Ištar /
         Ereškigal; Ištar's underworld threat in Tablet VI
         directly parallels the opening threat of the *Descent
         of Ishtar*);
    (iii) Akkadian internal — Tablet XII as the only major in-
          corpus engagement with the Sumerian Gilgameš tradition
          (partial Akkadian translation of *Gilgameš, Enkidu, and
          the Netherworld*; the load-bearing example of how the
          Akkadian Gilgameš tradition relates to the Sumerian
          tradition);
    (iv) Hebrew Bible — Genesis 6–9 flood parallel (typological,
         not transmission-historical); motif-by-motif
         correspondence catalogued (divine warning; multi-deck
         boat; seven-day flood; bird-release sequence; post-
         flood sacrifice and divine acceptance; the divine
         resolution not to destroy humanity again); reserved
         for the influences chapter;
    (v) Greek epic — Iliad/Odyssey heroic-mortality and friendship
        comparanda (Gilgameš-Enkidu / Achilles-Patroclus, *Iliad*
        XVIII–XXIV; the nekyia and the boundary-of-the-world
        journey, *Odyssey* XI; the wisdom-discourse on mortality;
        the ring-composition closing on city or household);
        typological, not transmission-historical; the Boğazköy
        MB stratum noted as Late Bronze reach into Anatolia.

  Glossary compliance (locked forms used throughout body prose):
    - Gilgameš (š-háček; NEVER Gilgamesh in body prose). The
      published title of George 2003's critical edition is
      *The Babylonian Gilgamesh Epic*, preserved verbatim in
      footnote bibliographic citations only (the book title as
      published is not subject to the glossary lock; this matches
      the chapter 13 precedent of preserving *Descent of Ishtar*
      as composition title while using Ištar in body prose).
    - Ištar (š-háček; NEVER Ishtar in body prose; *Descent of
      Ishtar* preserved as the conventional composition title
      per chapter 13's locked usage).
    - Uta-napišti (locked form per glossary.yaml; NEVER
      Utnapishtim; locked epithet Atra-ḫasīs preserved in the
      character-equation claim).
    - Šamaš, Šiduri, Ḫumbaba (locked š-háček and ḫ-cedilla
      forms; NEVER Huwawa for Ḫumbaba; NEVER Shamash / Siduri
      / Humbaba in body prose).
    - Anu, Ea, Enlil, Ninsun, Aruru, Ištar, Ereškigal, Namtar
      — locked Akkadian renderings used throughout. Tammuz
      retained as the locked form used in chapter 13.
    - Uruk, Aššur, Nineveh, Sippar, Sultantepe, Boğazköy,
      Megiddo, Babylon, Nippur, Mt Māšu, Mt Nimuš — locked
      forms used.
    - Sîn-lēqi-unninni — composition-specific entity per the
      brief's entities_glossary; full vocalized form with
      sin-circumflex and macrons preserved.
    - Šamḫat — locked form per glossary entry.
    - Bull of Heaven — glossary first-mention gloss; the
      Akkadian *Alû* form noted parenthetically in the brief
      but not used in body prose (the brief's
      first_mention_gloss_candidate uses "Bull of Heaven (Alû)"
      as the primary lemma; the chapter uses "Bull of Heaven"
      as the locked body-prose form).
    - Lugalbanda — composition-specific Sumerian-named entity
      preserved as Gilgameš's legendary father per glossary
      precedent; no glossary entry for Lugalbanda specifically,
      but the name is standard in the Akkadian Gilgameš
      tradition (per the SB Tablet I prologue and per
      george-2003).
  No glossary violations in body prose.

  No comparative-Part-II material crosses the line from
  comparative hook into body prose: the Hebrew Bible, Greek, and
  Sumerian comparanda all appear only in COMPARATIVE-HOOK comments
