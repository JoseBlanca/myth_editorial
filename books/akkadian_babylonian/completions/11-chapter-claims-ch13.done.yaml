summary: |
  Chapter 13 (The Descent of Ishtar) claims document. The Akkadian Standard Babylonian poem of 138 lines, narrating Ishtar's descent into the underworld (Kurnugê), her stripping at the seven gates, captivity, retrieval through Ea's creation Aṣušu-namir, and substitution of Tammuz. Closes with a partly-damaged ritual instruction for the seasonal Tammuz wailing rites — the etiological hook of the composition. Per scope.md, treated as an INDEPENDENT composition, NOT a translation of the Sumerian *Inanna's Descent* (ETCSL 1.4.1).

  Sources: Foster 2005 (pp. 498–505) and Dalley 2008 (pp. 154–162) as the principal cited translations; Foster 2007 (pp. 26–29) for late-period transmission context; Black & Green 1992 for deity entries (Ishtar, Ereškigal, Tammuz, Namtar, Papsukkal, Ea, underworld); Bottéro 2001 for the seasonal Tammuz cult and underworld theology; ETCSL 1.4.1 for the Sumerian comparative reference. Audit finding A7 (severity MEDIUM, kind UNSUPPORTED) is honoured: the eBL electronic edition (https://www.ebl.lmu.de/corpus/L/1/8) is named-but-flagged as the modern online text resource superseding the inventory's earlier Borger 1979 *BAL II* note; eBL is not currently in sources.yaml but is referenced in the brief and named in the chapter's source-overview footnotes.

  Manuscript witnesses (verified via web search and British Museum collection record): K.162 from Aššurbanipal's seventh-century BCE royal library at Nineveh as the principal witness, with parallel Neo-Assyrian fragments; an additional manuscript from the chief singer's library at Aššur (the *nargallu* / N 3 attestation noted in the eBL/Wikipedia summary). The witnesses agree on the seven-gate structure and the substitution ending; minor textual variants principally in the closing ritual lines.

  Narrative structure (twelve narrative moves preserved): (1) underworld-description opening (Kurnugê, Ereškigal as queen, Namtar as vizier); (2) Ishtar's resolve and arrival at the gate; (3) Ishtar's threat to the gatekeeper; (4) Ereškigal's response and "ancient ordinances" instruction; (5) seven-gate stripping with formulaic refrain; (6) captivity and the sixty diseases; (7) cessation of fertility on earth; (8) Papsukkal's report to Ea; (9) Ea creates Aṣušu-namir; (10) Aṣušu-namir's water-of-life stratagem and Ereškigal's curse; (11) ascent through seven gates with progressive restoration; (12) Tammuz substitution and Belili's mourning; closing ritual instruction.

  Three INFERENCE markers: (i) the seven-gate stripping as ritual sequence + loss-of-status mythologem reading; (ii) the binding-speech theology underpinning Aṣušu-namir's stratagem and Ereškigal's curse; (iii) the etiological-cult function of the closing ritual instruction. One LACUNA marker (closing ritual instruction partly damaged in some witnesses; cross-witness joining and eBL consolidation reconstructs most of it). One RECONSTRUCTION marker (Foster 2005's composite text from the K.162 principal witness, Neo-Assyrian fragments, and Aššur duplicate). One VARIANT marker (single-prevalent classification per brief; minor textual variants principally in closing ritual lines; Aššur duplicate not a recensional variant).

  Six COMPARATIVE-HOOK comments: (i) Sumerian *Inanna's Descent* (ETCSL 1.4.1) as the wider Mesopotamian background — INDEPENDENT, not translation; (ii) Akkadian-internal *Nergal and Ereškigal* (chapter 14) as the paired underworld dossier; (iii) Greek Persephone (seasonal-vegetation parallel); (iv) Egyptian Osiris (dying-god typology); (v) Hebrew Bible Sheol imagery (Job, Psalms, Isaiah 14); (vi) worldwide dying-god typology.

  Source IDs used in EVIDENCE tokens (64 total): foster-2005 (the principal anchor at pp. 498–505 throughout); dalley-2008 (the second triangulation translation at pp. 154–162 throughout); foster-2007 (pp. 26–29 for late-period transmission); black-green-1992 (s.v. Ishtar, Ereškigal, Tammuz, Namtar, Papsukkal, Ea, underworld); bottero-2001 (passim on underworld theology and Tammuz cult); etcsl (ETCSL 1.4.1 comparative reference). All six source IDs resolve to existing entries in sources.yaml.

  Glossary check: Ishtar, Ereškigal, Tammuz, Ea, Apsû — all use locked glossary.yaml renderings. Tammuz appears as the locked Akkadian form (per glossary.yaml's Dumuzi/Tammuz handling: "Dumuzi" is the standard Akkadian form; "Tammuz" is the later Aramaic-biblical form retained in some 1st-millennium translations and is appropriate here per Foster's translation convention). The composition's named deities not in glossary.yaml — Namtar, Papsukkal, Aṣušu-namir, Belili — receive inline first-mention glosses in the chapter. Place-name *Kurnugê* receives an inline first-mention gloss as "the Land of No Return". Ritual term *halziqu* (water-skin holding the water of life) is referenced once with inline gloss; the technical term *šīmtu* (fate, mentioned in the binding-speech INFERENCE) is referenced via Black & Green 1992 entry.

