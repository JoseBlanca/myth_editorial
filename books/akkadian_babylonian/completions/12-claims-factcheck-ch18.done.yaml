high_findings_detail:
  - finding_id: F-1
    kind: FACTUAL-ERROR
    locations: [line 9 (comment block), line 51 (source-overview), line 57 (OB-recension paragraph), line 58 (EVIDENCE token), line 64 (MA-recension paragraph), line 88 (LACUNA marker), line 96 (RECONSTRUCTION marker), line 113 (OB-recension section), line 116 (EVIDENCE token), line 151 (OB-recension closing), line 152 (EVIDENCE token), line 258 (Variants block), line 280 (chronological spread)]
    issue: "The Old Babylonian recension of Etana is from Susa (Elamite capital) and Tell Harmal (Šaduppum, near Baghdad), NOT from Sippar. The chapter's 'OB Sippar' attribution is pervasive across approximately 10–12 instances and is factually wrong in every case. Per Wikipedia s.v. Etana, Hejon07 Substack, Kinnier Wilson 1985 catalogue, and Novotny 2001: 'The Old Babylonian version comes from Susa and Tell Harmal, the Middle Assyrian version comes from Assur, and the Standard version is from Nineveh.' The error appears to have been introduced by pattern-matching from other OB Akkadian compositions (Atra-ḫasīs MS B; OB Anzû; OB Gilgameš Sippar tablet) where Sippar IS the principal OB provenance. The Etana OB tradition is specifically Susa + Tell Harmal. Fix is mechanical: global find-and-replace 'OB Sippar' → 'OB Susa+Tell Harmal' (or simply 'OB recension'). HIGH severity but does not BLOCK because the fix is localised."

medium_findings_detail:
  - finding_id: F-2
    kind: HEDGING-NEEDED
    locations: [line 107 (shared-spine paragraph), line 213 (Ištar's gate paragraph), line 219 (Anu's gate paragraph)]
    issue: "The heaven-flight gates citation mentions only Ištar and Anu when the surviving SB lines preserve seven gates: 'the gates of Anu, Enlil and Ea' AND 'the gates of Sin, Shamash, Adad and Ishtar' (per World History Encyclopedia, multiple translation mirrors). Seven deities at gates, not two. The chapter's selective citation foregrounds the two most narratively load-bearing (Ištar as plant-of-birth keeper; Anu as head of hierarchy) but understates the documentary record. Recommended augmentation: at line 107, expand to mention the full seven-gate sequence; at lines 213 and 219, retain the existing focus but add a brief note on the wider sequence."
  - finding_id: F-3
    kind: CITATION-WRONG / UNVERIFIED
    locations: [line 32 (comment block), line 69 (SB-recension paragraph), line 92 (LACUNA marker), line 176 (SB-recension section), line 258 (Variants block)]
    issue: "The 'important join published by H.W.F. Saggs in 1986' is not located in any open-web source. H.W.F. Saggs's bibliography (per Wikipedia and CDLI Wiki) does not list any Etana publication in 1986. The actual modern scholarly editions that consolidate and extend the SB Etana dossier are: (i) J.V. Kinnier Wilson, *The Legend of Etana* (Aris & Phillips, 1985) — the edition that reconstructs all three recensions; (ii) Kinnier Wilson, *Studia Etanaica* (Ugarit-Verlag, 2007) — the follow-up volume; (iii) Jamie R. Novotny, *The Standard Babylonian Etana Epic* (SAACT 2, Helsinki, 2001) — the modern critical edition with cuneiform/transliteration/score. The named-but-flagged framing in the chapter is appropriate but the underlying claim is unverified and likely a confusion with Kinnier Wilson 1985 (right year-region, wrong author). Recommended substitution: replace 'Saggs 1986 join' with 'Kinnier Wilson 1985 / Novotny 2001' as named-but-flagged anchors."

