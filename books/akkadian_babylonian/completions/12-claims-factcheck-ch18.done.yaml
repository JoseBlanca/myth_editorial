  (i)   F-1 global find-and-replace for OB Sippar → Susa+Tell Harmal;
  (ii)  F-2 gates augmentation at lines 107, 213, 219;
  (iii) F-3 Saggs 1986 → Kinnier Wilson 1985 / Novotny 2001
