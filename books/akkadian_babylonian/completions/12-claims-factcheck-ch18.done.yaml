summary: |
  Round-1 fact-check of chapters/18-etana.claims.adoc completed
  in fresh context (no writer-side memory of producing the
  claims). Verdict: PASS-WITH-LIGHT-FIXES.

  ONE HIGH-severity finding: F-1 (FACTUAL-ERROR — the Old
  Babylonian recension of Etana is from **Susa and Tell Harmal**,
  NOT from Sippar; the chapter's 'OB Sippar' attribution is
  pervasive [≈10–12 instances] and factually wrong in every case).
  This is a load-bearing manuscript-provenance error verified
  against Wikipedia s.v. Etana, Hejon07 Substack, the Kinnier
  Wilson 1985 edition's catalogue description, and the Novotny
  2001 critical edition. The error appears to have been
  introduced by pattern-matching from other OB Akkadian
  compositions (Atra-ḫasīs MS B; OB Anzû; OB Gilgameš Sippar
  tablet) where Sippar IS the principal OB provenance. The fix
  is mechanical (global find-and-replace) but must be applied
  before chapter-draft. Despite HIGH severity, the verdict is
  PASS-WITH-LIGHT-FIXES (not BLOCK) because the error is
  localised to a single attribute (the OB provenance) — the
  recension-history structure, the eagle-serpent fable handling,
  the heaven-flight treatment, and the lost-ending discipline are
  all sound.

  Two MEDIUM findings: F-2 (HEDGING-NEEDED — the heaven-flight
  gates citation mentions only Ištar and Anu when the surviving
  SB lines preserve seven gates: Anu/Enlil/Ea AND
  Sin/Šamaš/Adad/Ištar) and F-3 (CITATION-WRONG / UNVERIFIED —
  the 'Saggs 1986 join' is not located in any open-web source;
  H.W.F. Saggs's bibliography does not include a 1986 Etana
  publication; the actual modern editions are Kinnier Wilson
  1985 *The Legend of Etana* and Novotny 2001 *The Standard
  Babylonian Etana Epic* SAACT 2).

  Zero LOW findings. One note: N-1 (BRIEF-INCONSISTENCY — the
  brief's sources.secondary loc-note for bottero-2001 describes
  Etana as 'antediluvian king', which is inconsistent with the
  brief's own cross_cultural_parallels block, with the SKL's
  postdiluvian placement, and with the chapter's correct
  framing; the brief should be revised at line 20).

  All seven writer-flagged-for-scrutiny items resolved:
  (1) Antediluvian vs postdiluvian = UPHELD (chapter correct;
      brief was wrong — Etana IS postdiluvian per SKL).
  (2) Saggs 1986 join = UNVERIFIED-RECOMMEND-REPLACE.
  (3) Three recensions provenance = PARTIAL-FACTUAL-ERROR
      (OB Susa+Tell Harmal not Sippar — F-1 HIGH; MA and SB
      correct).
  (4) Lost-ending claim = UPHELD (scholarly consensus).
  (5) Šammu ša alādi (plant of birth) = UPHELD.
  (6) Eagle-and-serpent fable as structural prologue = UPHELD-
      AS-INFERENCE (INFERENCE marker hedges appropriately).
  (7) Ištar's and Anu's gates = PARTIAL-INCOMPLETE (both named
      in text but five other gates also preserved — F-2 MEDIUM).

  Zero fabrications; zero contamination; zero silent bridges;
  zero glossary violations; zero marker-schema failures.

  Recommendation: route to stage 13 (post-human-normalize) with
