summary: |
  Chapter 19 (Birth Legend of Sargon) post-human-normalize. Round-1 claims-factcheck returned PASS-WITH-LIGHT-FIXES with zero HIGH findings, two MEDIUM findings (F-1 FACTUAL-ERROR — paternal-vs-maternal uncles inversion at the parentage paragraph; F-2 UNVERIFIED — manuscript-provenance Neo-Babylonian-duplicates breakdown not directly verifiable from open-web triangulation), and one LOW finding (F-3 HEDGING-NEEDED — first-millennium-composition-date framing slightly overstates the scholarly consensus on the composition-date question). The factcheck agent judged all three as post-human-normalizable rather than round-2-worthy; this stage applies the three fixes mechanically and consistently across the chapter body.

    (1) F-1 MEDIUM: Replaced the inverted "mother's brothers / Sargon's maternal uncles" / "maternal family among the highland populations" framing at the parentage paragraph (original line 91 body prose and the line's footnote) with the standard scholarly translation "the brothers of Sargon's father / his paternal uncles" / "paternal family among the highland populations", anchoring the corrected reading in the Akkadian phrasing *aḫi abīya* "the brother(s) of my father" that ANET/Speiser, Foster 2005, World History Encyclopedia, mostlydeadlanguages / Slightly Alive Translations, and intertextual.bible all attest as PATERNAL kinship. The highland-populations framing is preserved (the geographic setting holds for either kinship side). The corrected paragraph also adds a brief note on the textual puzzle the secondary literature observes (the speaker claims unknown father yet knows of paternal uncles), which earlier translators and Slightly Alive Translations explicitly comment on. The factcheck agent's safe-interim-fix recommendation was followed precisely.

    (2) F-2 MEDIUM: Relaxed the "K.3401 (Neo-Assyrian) + at least two Neo-Babylonian duplicate manuscripts" framing at the five loci flagged by the factcheck (original lines 50, 57, 80, 82, 216) and at the consistency-paired loci in the comment-block preamble (line 11) and in the later body-prose recurrences (lines 187, 232) to "K.3401 (Neo-Assyrian, from Aššurbanipal's library at Nineveh) + duplicate manuscripts; three fragments are attested in the dossier" — i.e., naming K.3401 specifically (which is independently verified via the British Museum K-3401 catalogue entry and via Wikipedia s.v. Sargon of Akkad) and leaving the NA/NB split of the two further duplicates as un-verified per the open-web sources. The "three manuscripts" / "three fragments" count is also independently confirmed (Wikipedia s.v. Sargon of Akkad: "Only the beginning of the text — the first two columns — is known, from the fragments of three manuscripts"). The Westenholz 1997 critical edition (Mesopotamian Civilizations 7, ISBN 978-0-931464-85-0) remains the authoritative reference for the manuscript inventory; direct verification of the NA/NB breakdown is deferred to the comparative chapter / line-edit pass. The VARIANT marker (original line 216) also adds a brief explanatory note on the un-verifiable breakdown to preserve transparency about what the chapter does and does not claim.

    (3) F-3 LOW: Applied. Added a brief hedging clause at the first body-prose claim asserting first-millennium dating (original line 62) — "(the composition's earliest core may go back further — some scholars locate the underlying composition in the Old Babylonian literary tradition, others in the Neo-Assyrian period as propaganda linked to Sargon II — but the surviving witnesses are all first-millennium and the manuscript-attestation floor is securely first-millennium)" — which sharpens the "first-millennium literary composition" framing as the conservative manuscript-attestation floor rather than a settled composition-date claim. The other "first-millennium" loci (lines 50, 187, 232) remain as the manuscript-attestation-floor framing; the single hedging clause at line 62 is sufficient to flag the contested composition-date question without diluting the manuscript-floor anchor elsewhere. Hands-on consultation of Brian Lewis 1980 (*The Sargon Legend*, ASOR Diss. Series 4) and Westenholz 1997's introductory commentary for the deeper composition-date question (Sargon-II-period propaganda vs. Old Babylonian roots) is deferred to the comparative chapter / line-edit pass.

  Post-human-normalize edits-header block prepended at the top of the approved file (after the title) recording: timestamp, source / factcheck cross-reference, and the F-1 / F-2 / F-3 edits with their reasoning, matching the format prescribed in the task instructions. The brief (briefs/19-birth-legend-of-sargon.yaml) does NOT need revision for this chapter: the factcheck did not flag the brief, and F-1 / F-2 / F-3 are all body-prose edits within the chapter claims doc.

findings_triage:
  - finding_id: F-1
    kind: FACTUAL-ERROR
    severity: MEDIUM
    disposition: ACCEPT
    rationale: "Applied the F-1 fix as proposed by the factcheck (the safe-interim-fix recommendation). The standard scholarly translation of the legend's hill-loving-brothers line across ANET/Speiser, Foster 2005, World History Encyclopedia, mostlydeadlanguages / Slightly Alive Translations, and intertextual.bible reads 'the brother(s) of MY FATHER' — PATERNAL kinship. Slightly Alive Translations explicitly notes the line 'literally means my father's brother' and observes the textual puzzle (the speaker claims unknown father yet knows of paternal uncles). The chapter's round-1 'mother's brothers / Sargon's maternal uncles' framing inverted the standard reading. The fix corrects the kinship side (paternal, anchored in the Akkadian *aḫi abīya* phrasing) while preserving the highland-populations framing, which is independent of the kinship-side question. The factcheck agent's safe-interim-fix is followed precisely; the deeper question of whether Westenholz 1997 proposes a maternal-kin alternative against the standard reading is deferred to the comparative chapter / line-edit pass when Westenholz 1997 can be consulted directly. The Foster 2005 footnote phrasing has been updated to register the paternal-kinship reading as the standard rendering."
  - finding_id: F-2
    kind: UNVERIFIED
    severity: MEDIUM
    disposition: ACCEPT
    rationale: "Applied the F-2 fix as proposed by the factcheck (the alternative-safe-framing recommendation). The chapter's specific 'K.3401 (Neo-Assyrian) + at least two Neo-Babylonian duplicate manuscripts' framing is plausible and may reflect Westenholz 1997's specific manuscript inventory but cannot be directly verified from open-web triangulation. Wikipedia s.v. Sargon of Akkad confirms 'three manuscripts' total but does not specify the NA-NB breakdown; one web-search summary reported 'three Neo-Assyrian and one Neo-Babylonian' (a different configuration). The relaxed framing 'K.3401 (Neo-Assyrian, from Aššurbanipal's library at Nineveh) + duplicate manuscripts; three fragments are attested in the dossier' names K.3401 specifically (independently verified via the British Museum K-3401 catalogue and via Wikipedia) and the three-manuscript count (independently verified via Wikipedia), while leaving the NA/NB split of the two further duplicates as un-verified — which is the conservative position the open-web triangulation supports. Five loci flagged by the factcheck (lines 50, 57, 80, 82, 216) corrected as the primary scope; three further loci updated for cross-paragraph consistency (the SINGLE-PREVALENT preamble comment at line 11; the legendary-tradition body paragraph at line 187; the first-millennium-attestation body paragraph at line 232) — the relaxed framing applies uniformly across the chapter without introducing inconsistency. Direct verification of the manuscript dossier against Westenholz 1997 pp. 36-37 (manuscript inventory section) is deferred to the comparative chapter / line-edit pass when Westenholz 1997 can be consulted directly."
  - finding_id: F-3
    kind: HEDGING-NEEDED
    severity: LOW
    disposition: ACCEPT
    rationale: "Applied the F-3 fix as proposed by the factcheck (the optional-refinement recommendation). The composition-date question is genuinely contested in the scholarly literature: some scholars (Brian Lewis 1980 building on earlier proposals) date the composition to the Neo-Assyrian period and link it to Sargon II's reign (722–705 BCE) as propaganda for the namesake king; other scholars place the underlying composition earlier (Old Babylonian literary roots, with the first-millennium manuscripts as the late transmission of an older composition). The chapter's round-1 framing ('first-millennium literary composition' across multiple loci) is defensible as the manuscript-attestation floor but slightly overstates the scholarly consensus on the composition-date question itself. The hedging clause added at the first body-prose claim asserting first-millennium dating (original line 62) — '(the composition's earliest core may go back further — some scholars locate the underlying composition in the Old Babylonian literary tradition, others in the Neo-Assyrian period as propaganda linked to Sargon II — but the surviving witnesses are all first-millennium and the manuscript-attestation floor is securely first-millennium)' — sharpens the manuscript-attestation-floor framing as the conservative position without diluting the anchor elsewhere. The other 'first-millennium' loci (lines 50, 187, 232) remain unchanged; the single hedging clause is sufficient to flag the question. Hands-on consultation of Brian Lewis 1980 (ASOR Diss. Series 4) and Westenholz 1997's introductory commentary for the deeper composition-date question (Sargon-II-period propaganda vs. Old Babylonian roots vs. first-millennium-product synthesis) is deferred to the comparative chapter / line-edit pass."

