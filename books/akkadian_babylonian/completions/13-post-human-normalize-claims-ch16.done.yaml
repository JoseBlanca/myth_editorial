summary: |
  Chapter 16 (Erra and Išum) post-human-normalize. Round-1 claims-factcheck returned PASS-WITH-LIGHT-FIXES (0 HIGH / 2 MEDIUM / 1 LOW); three light edits applied to produce the approved file:

    (1) F-2 MEDIUM: hedged the Sennacherib reception framing in the Marduk-leaving-his-throne COMPARATIVE-HOOK (line 241). The earlier "canonical theological frame within which Babylonian writers later read the catastrophes of their own history" formulation was overstated. Per Foster 2007, Frahm's *Enūma Eliš* reception survey, Tadmor 2022, and Bottéro 2001, the 689 BCE Sennacherib sack reading is one widely-discussed but contested proposal among several, not the consensus frame; the composition date is itself disputed (proposals span the eleventh to the seventh centuries BCE). The hook now describes the reading as "one widely-discussed but contested strand of the scholarship" and "one proposal among several rather than the consensus frame", and notes the composition-date dispute. Detailed treatment remains reserved for the influences chapter. The fix is localized to the COMPARATIVE-HOOK; the body claim is unchanged.

    (2) F-3 LOW: tightened the Marduk flood-era recollection paragraph (line 136). The unsupported paraphrase "the gods feared the consequences" was dropped and replaced with the attested textual material from Tablet I.131–162: the heavens-shaking detail (positions of heavenly bodies altered, could not be restored), the netherworld-quaking detail (yield of the furrow diminished, regulation of heaven and earth disintegrated), and — the load-bearing detail of the recollection, omitted in round 1 — Marduk's dispatch of the seven *apkallū* (antediluvian sages, original craftsmen of the cult statue) down to the Apsû with the order not to come back up. This element bears directly on the cult-statue refurbishment pretext: the original craftsmen are no longer within easy reach, which is precisely why a fresh cleansing requires Marduk himself to step away. Footnote updated to cite Cagni 1969 I.131–162 exactly and to add the Black & Green 1992 s.v. apkallu glossary entry. The body now uses the locked glossary rendering *apkallū* (italicized, plural with macron) and Apsû (with circumflex) per glossary.yaml.

    (3) F-4 MEDIUM: pinned the Sebitti differentiation claim (line 107) to the named catalogue. The earlier "differentiated within the catalogue: each carries a specific destructive remit" formulation was abstract. The fix appends the seven named commissions in the order Cagni 1969's critical text preserves: terror, fire, lion, mountain-feller, wind-encircler, no-survivors, venom (per Cagni 1969 I.31–44 and Foster 2005, pp. 882–884). The differentiation claim is now catalogue-grounded rather than abstract, and the writer-flagged-for-scrutiny item #6 (Sebitti differentiation) is now backed by the specific named destinies. Footnote updated to cite the exact line range and to record the apparatus on manuscript variation in the order.

  Provenance comment block appended at the file foot recording: timestamp, edits applied, structural checks passed, and round-1 factcheck cross-references.

