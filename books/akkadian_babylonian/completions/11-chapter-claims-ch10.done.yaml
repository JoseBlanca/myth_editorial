summary: "Chapter 10 (The Founding of Eridu) claims document. The brief was preemptively revised before stage 10a, on the basis of (i) Lambert 2013 TOC verification via DeGruyter Brill chapter landings (which surfaced two upstream errors in the original chapter-10 brief) and (ii) the chapter 8 factcheck-round-1 page-range pattern catching propagated +10-page errors across the Lambert 2013 Part III dossier briefs. Two upstream errors corrected in the brief: (1) wrong Lambert 2013 page range — pp. 376–383 → pp. 366–375 (pp. 376–383 belongs to *The First Brick*, Chapter 12 of this volume); (2) wrong incipit attribution — *enūma Anum ibnû šamê* ('When Anu created the heavens') belongs to a different composition (likely an *Enūma Anu Enlil*-related incantation prologue). The actual opening of *The Founding of Eridu* / BM 93014 is a negative-cosmogonic statement: 'the holy house, the house of the gods in the holy place had not yet been made.'

Composition: short bilingual Sumerian-Akkadian incantation prologue preserved on a single manuscript, BM 93014 (British Museum). Approximately 40 lines preserved in complete or nearly-complete form; the closing portion of the tablet (the ritual incantation that follows the cosmogonic prologue) is more heavily damaged than the cosmogony itself. Lambert 2013 pp. 366–375 is the standard modern critical edition; Foster 2005 *Before the Muses* p. 487 supplies an accessible English translation under the editorial title 'Marduk, Creator of the World' within the 'Myths of Origins' sub-section. Multiple alternative editorial titles in scholarly use: 'The Founding of Eridu' (Lambert 2013); 'The Bilingual Creation of the World by Marduk' / 'The Bilingual Version of the Creation Legend' (older usage from L. W. King's *The Seven Tablets of Creation* II, 1902); 'Marduk, Creator of the World' (Foster 2005). Dalley 2008 does not contain this composition.

Narrative structure (seven cosmogonic moves preserved in the bilingual columns): (1) negative-cosmogonic opening — 'the holy house had not yet been made' — primordial state before creation; (2) Marduk founds Eridu in the Apsû — the first cosmic structure (Eridu = Ea / Enki's traditional cult-centre, here founded by Marduk rather than Ea); (3) Marduk founds Babylon (Esagil), Nippur (E-kur), Erech (Sumerian Uruk; E-Aena) and the other primordial cities; (4) Marduk dams the cosmic waters, establishing dry land; (5) Marduk creates and names the rivers Idiglat (Tigris) and Purattu (Euphrates), setting them in their courses (cosmogonic naming-as-creation); (6) Marduk and Aruru together create humankind — 'the seed of mankind' — to settle the gods in their dwellings (joint Marduk-Aruru anthropogony, theologically distinct from *Enūma Eliš* Tablet VI's solo-Marduk creation from Qingu's blood); (7) ritual incantation follows on the same tablet, invoking Marduk's cosmogonic authority for ritual purposes (incantation recited in E-Zida temple, probably Nabu's at Borsippa).

Ritual context: incantation prologue, with cosmogony grounding the ritual's magical efficacy. Manuscript date Neo-/Late-Babylonian (sixth century BCE); composition date probably earlier (Kassite or post-Kassite) on theological-content grounds. Bilingual format characteristic of late-Babylonian Sumero-Akkadian scribal tradition; the Sumerian column is in scope only insofar as it is integral to the Akkadian literary product (per scope.md).

Three INFERENCE markers covering (i) the negative-cosmogonic opening as a structural-typological pattern shared with *Enūma Eliš*, *Atra-ḫasīs*, and Genesis 1; (ii) Marduk's foundation of Eridu (Ea's traditional cult-centre) as a theologically-political move characteristic of the late-Babylonian Marduk dossier; (iii) the joint Marduk-Aruru anthropogony as theologically distinct from *Enūma Eliš* Tablet VI's solo-Marduk anthropogony (complementary registers). One LACUNA marker (single bilingual tablet BM 93014 with ~40 preserved lines + fragmentary remainder); one RECONSTRUCTION marker (Lambert 2013's bilingual-parallelism reconstruction; medium-high confidence due to Sumerian / Akkadian column-glossing); one VARIANT marker (single-prevalent / restoration-variation within the single bilingual witness).

Four COMPARATIVE-HOOK comments — three internal Akkadian + one Genesis 1 typology: (i) *Enūma Eliš* (Chapter 1) as principal comparandum within the Marduk-cosmogony dossier; (ii) *The Worm and the Toothache* (Chapter 11) as closest comparandum among incantation-prologue cosmogonies; (iii) Sumerian column / bilingual-tradition framing forwarded to the influences chapter; (iv) Genesis 1 negative-cosmogonic opening typology forwarded to the influences chapter.

Source IDs used: lambert-2013 (sole textual anchor at corrected page range pp. 366–375; pp. 1–277 for *Enūma Eliš* cross-reference; pp. 281–401 for the Part III dossier); foster-2005 (accessible translation at p. 487 'Marduk, Creator of the World'); foster-2007 (passim for late-Babylonian incantation-prologue genre and Sumero-Akkadian bilingualism); black-green-1992 (s.v. Eridu, Aruru, Babylon, Nippur, Uruk, rivers, cosmogony); rla (s.v. Eridu); bottero-2001 (Mesopotamian theological geography; cosmogonic naming; Marduk theology registers); dalley-2008 (negative attestation). All seven source IDs in EVIDENCE tokens resolve to existing entries in sources.yaml. L. W. King's *The Seven Tablets of Creation* II (1902) is named-but-flagged in the source-overview as the older publication anchor for BM 93014 but no EVIDENCE token routes through it (King 1902 is not in sources.yaml; sources.yaml addition recommended at inventory-audit).

Glossary check: Marduk, Aruru, Anu, Enlil, Apsû, Tablet of Destinies — all use locked glossary.yaml renderings. Aruru is a new first-mention gloss in chapter 10 (mother-goddess co-creator with Marduk). New first-mention glosses given inline for: Esagil (Marduk's temple at Babylon — referenced in chapter 7 in passing, here given full first-mention as primordial cosmic structure), E-kur (Enlil's temple at Nippur), E-Aena (the temple of Uruk), E-Zida (the recitation context — Nabu's at Borsippa), Idiglat (Tigris), Purattu (Euphrates). Eridu and Babylon already glossed in chapter 0 / 1; Nippur in chapter 9. Erech (Sumerian Uruk) introduced as a parenthetical alongside Uruk."
