    statue pretext in Tablet II is presented at the level of "dim
    statue, tarnished insignia, gold of the crown lost lustre"; the
    factcheck should verify these details against Cagni 1969's
    apparatus and Foster 2005's translation.

    (iii) Marduk's recollection of the flood-era departure in Tablet
    II is presented as a parallel to the Atra-ḫasīs / Gilgameš XI
    flood tradition (the *Erra and Išum* poem invoking the earlier
    flood-era catastrophe as the historical precedent for Marduk's
    hesitation). The factcheck should verify whether this is the
    correct reading of the recollection scene or whether Marduk's
    reference is to a different earlier catastrophe.

    (iv) The historical-reception reading of Marduk's cleansing-
    absence as the canonical frame for Sennacherib's 689 BCE sack
    of Babylon and the Esarhaddon-era restoration is in the
    Akkadian-internal COMPARATIVE-HOOK comment, not in body prose;
    the reading is well-attested in the secondary literature (Foster
    2007; Bottéro 2001 on the historical reception), but the
    factcheck should verify the specific identification before the
    chapter-draft stage promotes it into body prose.

    (v) The named-author colophon's full attribution as
    "Kabti-ilāni-Marduk son of Dābibi" is presented at the level
    of the colophon as transmitted; the factcheck should verify
    the patronymic "son of Dābibi" against Cagni 1969's reading
    of the colophon and against Foster 2005's translation (Foster
    2005 pp. 909-911 is the cited locus). If the patronymic is
    not securely attested in the cited sources, it should be
    removed at round 2.

    (vi) The Sebitti are differentiated in the catalogue (each
    with his own commission and remit) per the wider attestation
    of the war-band's enumeration in the secondary literature;
    the factcheck should verify whether Cagni 1969 and Foster 2005
    present each of the seven with a specifically distinguished
    function or whether the differentiation is more uniform than
    the body claims.
