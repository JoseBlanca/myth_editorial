  decisions_on_ambiguous_points: |
    (i) The Sebitti's paternity by Anu is presented as the canonical
    attestation (per black-green-1992 s.v. Sebitti, and per the brief's
    entities_glossary "sky-god, who fathered the Sebitti and gave them
