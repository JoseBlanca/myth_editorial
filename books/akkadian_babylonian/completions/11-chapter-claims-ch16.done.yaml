summary: |
  Chapter 16 (Erra and Išum: The Rage of the Plague-God) claims document.
  Single-prevalent classification per the brief: the poem is preserved in
  a single first-millennium recension across multiple manuscripts that
  agree closely; Cagni 1969 (Studi Semitici 34, Rome) is the definitive
  critical edition; Foster 2005 (pp. 880-911) is the working English
  translation; Dalley 2008 (pp. 282-315) is the second triangulation;
  Foster 2007 (pp. 39-43) supplies recensional and reception context;
  Black & Green 1992 supplies the deity-entry triangulation (s.v. Erra,
  Išum, Sebitti, Marduk); Bottéro 2001 supplies the religious-thought
  commentary.

  Sources used (six total, all resolving to existing sources.yaml entries):
    - cagni-1969 (primary; the definitive critical edition)
    - foster-2005 (primary; principal English translation)
    - dalley-2008 (primary; second triangulation translation)
    - black-green-1992 (secondary; deity entries Erra, Išum, Sebitti, Marduk)
    - bottero-2001 (secondary; religious-thought commentary)
    - foster-2007 (secondary; pp. 39-43, recension and reception context)
  Zero invented source IDs.

  Narrative structure: source overview (five claims on the five-tablet
  structure, manuscript dossier, authorial colophon, and standard
  critical edition) followed by a self-presentation section
  (Kabti-ilāni-Marduk's named-author colophon and the apotropaic
  self-framing), then tablet-by-tablet narrative claims:
    - Tablet I: the opening invocation and the Sebitti (Anu's paternity;
      the differentiated war-band; the rhetorical incitement of Erra;
      Išum's counsel of restraint at the close);
    - Tablet II: persuading Marduk to leave his throne (the cult-statue
      pretext; Marduk's hesitation and the flood-era recollection;
      Erra's guarantee; Marduk's departure as theological pivot);
    - Tablet III: the destruction begins (Babylon as central target;
      the extended catalogue of social and cosmic disintegration; Išum's
      protest rebuffed);
    - Tablet IV: Babylon, Erra's lament for the city, and the lament-
      poem turn (the destruction of Marduk's city and the Esagil; the
      city-lament register embedded in the destruction-narrative);
    - Tablet V: Išum's persuasion, Erra's relenting, and the restoration
      (Išum's final speech; Erra's decree of restoration and Marduk's
      return; the closing apotropaic colophon).

  Manuscript variation per the brief's variants block — the Sebitti
  list order in Tablet I and the amulet-style closing colophons in
  Tablet V — is flagged with [LACUNA: ... | scholarly_reconstruction:
  yes] markers in the appropriate places (Tablet I Sebitti catalogue;
  Tablet V apotropaic colophon section). The Tablet III central column
  damage and Tablet IV opening damage are flagged with [LACUNA:] markers
  per the brief's lacunae block. One [RECONSTRUCTION:] marker covers
  Cagni 1969's cross-witness collation as the in-tradition reconstruction
  method (same composition, same dialect, same period, multiple
  manuscripts — high confidence).

  Two INFERENCE markers:
    (i) "Marduk's cleansing-absence as theology disguised as plot" — the
        chapter's interpretive reading of the structural function of the
        cleansing-absence pretext, foregrounded per the brief's
        special_instructions ("Foreground Marduk's cleansing-absence as
        the trigger for Erra's rampage; this is theology disguised as
        plot"). Basis cited (Foster 2007, Bottéro 2001); risk flagged.
    (ii) "Named-author colophon + apotropaic self-framing + amulet-format
        manuscripts as theologically deliberate combination" — the
        chapter's interpretive reading of the unusual standing of *Erra
        and Išum* in the Akkadian literary tradition. Basis cited (Foster
        2007, Bottéro 2001); risk flagged.

  One VARIANT marker covering the single-prevalent classification: Cagni
  1969's critical text as primary; the documented manuscript-level
  variations (Sebitti order in Tablet I; amulet-style closing colophons
  in Tablet V) as in-tradition variants within the single recension;
  chosen reading Cagni's critical text with in-tradition variants
  flagged at marker level.

  Five COMPARATIVE-HOOK comments:
    (i) Akkadian internal — Marduk-leaving-his-throne and the historical
        reception of *Erra and Išum*: the cult-statue absence motif as
        the canonical theological frame within which Babylonian writers
        read the catastrophes of their own history (notably Sennacherib's
        sack of Babylon in 689 BCE and the cult-statue's removal to
        Aššur, restored under Esarhaddon), cross-linked to *Enūma Eliš*
        (chapter 1) for the cosmic-kingship motif that *Erra and Išum*
        operationalises ("where Enūma Eliš installs the patron-god on
        the throne, Erra and Išum asks what happens when he leaves it");
    (ii) Akkadian internal / cross-cultural — the Sebitti as a demonic-
         Seven motif, with Sumerian (*udug*, *gallû*) and Hurrian
         parallels, the Akkadian Sebitti as the most fully elaborated
         literary instance of the motif;
    (iii) Greek divine-plague comparandum — Apollo's plague at the
          opening of the *Iliad* (Book I), licensed by the brief's Greek
          comparandum (foster-2007), structurally parallel to Erra in
          its (a) wrathful-god-as-plague, (b) directed at specific human
          community, (c) resolved by ritual / intercession;
    (iv) Mesopotamian apotropaic-ritual reception — the amulet-colophon
         evidence, the closing apotropaic self-framing, and the amulet-
         format manuscript dossier as a distinctive feature in Akkadian
         literature;
    (v) Hebrew Bible (prophetic) — divine-wrath-and-restoration
        rhetorical mode (Isaiah, Jeremiah, Ezekiel), the most direct
        cross-cultural rhetorical comparandum per the brief, anchored
        through foster-2007.

  Glossary compliance:
    - Marduk, Anu, Ea, Enlil, Tiamat, Ištar, Sebitti — locked Akkadian
      renderings used throughout. Sebitti uses glossary.yaml's locked
      form (not "Sibitti", not "the Seven" as a proper-noun substitute).
    - Erra and Išum — the title characters of the chapter; glossary.yaml
      first-mention glosses given on first mention in body prose. Per
      glossary.yaml: Erra's locked form is "Erra" (not "Irra"); Išum's
      locked form is "Išum" (with š-háček; not "Ishum").
    - Babylon, Aššur, Nineveh, Sultantepe — locked forms used; Aššur
      with š-háček; Sultantepe inline-glossed per the chapter 14
      precedent recorded in gloss-ledger.yaml.
    - Esagil and Esagila — glossary.yaml lists "Esagila" as Marduk's
      temple name in the Babylon entry; the gloss-ledger lists "Esagil"
      as the form used in chapters 7 and 10. Both forms refer to the
      same temple. The chapter uses "Esagil" with a parenthetical
      identification ("Marduk's temple") on first mention for
      consistency with the gloss-ledger and the form used in chapters
      7 and 10. (If a glossary lock is wanted, this should be set at
      glossary-lock review.)
    - Kabti-ilāni-Marduk — composition-specific entity per the brief's
      entities_glossary; inline-glossed on first mention as the named
      composer of the poem per the brief.
    - Nergal — referenced in passing ("sometimes identified with Nergal
      in the wider Akkadian tradition") with cross-reference to chapter
      14; locked form per glossary.yaml.
  No glossary violations.

  No comparative-Part-II material crosses the line from comparative
  hook into body prose: the Hebrew Bible, Greek, and Sumerian / Hurrian
  comparanda all appear only in COMPARATIVE-HOOK comments and are
  reserved for the influences chapter. The Sennacherib historical-
  reception reading is anchored to the Akkadian-internal hook (Marduk-
  leaving-his-throne and its first-millennium reception) and is
  bracketed as comparative; the chapter's body prose treats the poem's
  internal narrative, not its historical reception.

