summary: "Chapter 11 (The Worm and the Toothache) claims document. Brief preemptively revised before stage 10a, on the basis of Lambert 2013 TOC verification (DeGruyter Brill chapter landings): the original brief's Lambert 2013 pp. 396-398 is wrong (that range belongs to 'The River Incantation', Lambert 2013 chapter 36). Whether Lambert 2013 includes *The Worm and the Toothache* in his 'Mythological Introductions on Creation' section (pp. 399-402, chapter 37) could not be directly verified, so the chapter handles Lambert 2013 conservatively (mentioned in the source-overview footnote as a possible-but-unverified additional edition source; no EVIDENCE token routes through Lambert 2013).

Composition: short Akkadian incantation against toothache, preserved with a seven-step cosmogonic prologue. Principal cuneiform publication: CT 17, plate 50 (R. Campbell Thompson, *Cuneiform Texts from Babylonian Tablets in the British Museum*, Part XVII, 1903) — named-but-flagged, not in sources.yaml. Modern accessible English translation: Foster 2005, *Before the Muses* (3rd ed., CDL Press), pp. 995-996 — used as the principal current-reference anchor for this chapter. Speiser's older ANET translation is excluded per sources.yaml ('Speiser ANET' is on the exclusion list). Dalley 2008 does not contain this composition.

Manuscripts: Nineveh principal witness (CT 17 50, from Aššurbanipal's library); Aššur duplicate(s). Composite text stable across duplicates; minor lexical variants in the worm's request to Šamaš and Ea. First-millennium Babylonian / Assyrian recension; composition possibly older (colophon notes copy from earlier version).

Narrative structure (six narrative moves preserved in the composite): (1) seven-step cosmogonic chain (Anu → heavens → earth → rivers → canals → marshes → worm); (2) the worm's lament before Šamaš and Ea ('What will you give me to eat?'); (3) the gods' offer of fig and apricot; (4) the worm's defiance and demand to dwell in human teeth and gums; (5) Ea's curse upon the worm; (6) ritual prescription for the practitioner (closing portion partly damaged).

Two INFERENCE markers: (i) the seven-step cosmogonic chain as an instance of the broader Mesopotamian cosmogonic-typology (chain of begettings) shared with The Theogony of Dunnu (Chapter 4), Genesis 1, and other ancient Near Eastern creation literature; (ii) the cosmogonic prologue's performative function — the chain is part of the spell's mechanism (etiology-as-cure pattern). One LACUNA marker (minor breaks in some duplicates of CT 17 50, particularly in the closing ritual-prescription); one RECONSTRUCTION marker (cross-manuscript joining between Nineveh and Aššur duplicates; high confidence for cosmogony and dialogue, medium for ritual-prescription); one VARIANT marker (the Old Babylonian YOS 11, 5 worm-cosmogony variant 'Anu begot heaven... fly bore worm' is preserved separately and is a different composition, not a parallel manuscript of the first-millennium recension; the chapter focuses on the first-millennium *Worm and the Toothache*).

Five COMPARATIVE-HOOK comments: (i) The Founding of Eridu (Chapter 10) as principal incantation-prologue cosmogony comparandum; (ii) The Theogony of Dunnu (Chapter 4) as principal genealogical-chain cosmogony comparandum; (iii) Genesis 1 hierarchical creation chain typology (forwarded to influences chapter); (iv) Hurro-Hittite Mari 5 toothache ritual (Cohen-Wasserman 2018 RA 112; named-but-flagged; forwarded to influences chapter); (v) worldwide etiology-as-cure pattern; tooth-worm theory in European medicine (forwarded to influences chapter).

Source IDs used in EVIDENCE tokens: foster-2005 (the principal anchor at pp. 995-996; also p. 487 for the cross-reference to *The Founding of Eridu*); foster-2007 (passim for the incantation-prologue genre); black-green-1992 (s.v. cosmogony, demons, Šamaš, Ea); bottero-2001 (Mesopotamian medical-magical practice, etiological narratives, Akkadian magical-curse register, transmission of medical concepts); dalley-2008 (negative attestation). All five source IDs resolve to existing entries in sources.yaml. Lambert 2013 is named in the source-overview footnote as a possible-but-unverified additional edition source but no EVIDENCE token routes through it. Three named-but-flagged scholars: R. Campbell Thompson 1903 (CT 17 50 cuneiform publication); Hussey & van Dijk (YOS 11, 5 OB worm-cosmogony variant); Cohen & Wasserman 2018 (RA 112 Hurrian Mari 5 reanalysis).

Glossary check: Marduk, Anu, Ea, Šamaš, Apsû — all use locked glossary.yaml renderings. Šamaš given a substantive first-mention gloss in chapter 11 (was previously named only in passing in chapter 0). New first-mention gloss inline for *tūltu* (Akkadian 'worm/maggot'). The cosmogonic chain framework given a structural gloss as 'the seven-step creation sequence'."
