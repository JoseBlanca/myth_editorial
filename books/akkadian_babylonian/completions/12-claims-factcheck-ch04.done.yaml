  - finding_id: F-1
    severity: HIGH
    summary: "Chapter says the closing is broken and 'may have terminated at the figure of Enlil; the surviving text does not allow a confident reconstruction.' The standard scholarly reading (Lambert 2013, Lambert & Walcot 1965, Wikipedia s.v. Dynasty of Dunnum) DOES reconstruct the closing as Enlil and his sons Ninurta and Nušku sharing rule amicably — a stabilising generation that breaks the parricide-incest cycle. This omission also weakens the chapter's own forward-link to the influences chapter, since the Dunnu→Kumarbi→Hesiod parallel depends on the stable closing generation being visible (Teshub, Zeus)."
  - finding_id: F-2
    severity: MEDIUM
    summary: "Chapter mentions only Sumuqan and Lahar by name and elides middle generations as 'several more generations.' The brief's special_instructions require preserving the 'who killed/married whom' sequence faithfully. Named middle figures attested in Lambert 2013 / Lambert-Walcot 1965 include River, Gaiu (reading-variant), Haharnum and Belet-seri (the herdsman/pasture pairing), and Hayyashum (whose imprisonment of his father — rather than killing — marks the turning point toward the stabilising Enlil generation)."
  - finding_id: F-3
    severity: MEDIUM
    summary: "Sumuqan = Šakkan equivalence is correct; the 'cattle-god' gloss is too narrow. Standard reference (RlA s.v. Sumuqan, Wikipedia s.v. Šumugan) describes him as a herdsman/shepherd god of quadrupeds generally — donkeys, wild sheep, and cattle — with the epithet 'shepherd of everything.' The brief's entities_glossary also oversimplifies and could be updated."
  - finding_id: F-4
    severity: MEDIUM
    summary: "In the specific Sumuqan generation, the chapter records Sumuqan-marries-Earth and Sumuqan-kills-Ḫarab but omits Sumuqan-marries-his-sister (which is preserved in the Wikipedia/Lambert summary). The chapter does generalise later ('marries within the family — mother, sister, daughter') but the specific generation should record the sister-marriage per the brief's faithful-sequence directive."
  - finding_id: F-5
    severity: MEDIUM
    summary: "The CT 46 Summary Catalogue describes BM 74329 as 'A Late Babylonian tablet, copied from an original of Assur' — i.e., the colophon attests an earlier Aššur exemplar, which moves the underlying composition to at least the Middle/Neo-Assyrian period. The chapter writes only 'the underlying composition may be earlier' without naming the colophon-attested earlier exemplar. Adding this concrete detail sharpens the dating claim and supports the lacunae block."
  - finding_id: F-6
    severity: LOW
    summary: "The 'most Akkadian creation poems are set in Babylon (Esagil) or Eridu' framing is the chapter's interpretive contrast and is not directly traceable to a specific page in the cited Lambert 2013 / Foster 2005 / Bottéro 2001. Defensible on the standard view but should either be page-cited from an opened source or reframed as the chapter's own framing."
