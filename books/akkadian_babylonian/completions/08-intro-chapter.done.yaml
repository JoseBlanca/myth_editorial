summary: "Introduction chapter (~6,900 body words) framing the cultural relevance of all 41 chapters. Opens with George Smith's 1872 announcement of the Tablet XI flood discovery as the conventional starting point of modern Akkadian studies, then sets the corpus across three chronological horizons (Old Babylonian, Late Bronze international lingua franca, Standard Babylonian/first millennium) and surveys the scholarly editions on which the book rests (Lambert 2013, Lambert 1960, Lambert & Millard 1969, George 2003, Westenholz 1997, Cagni 1969, Annus 2001, Vogelzang 1988, Izre'el 2001, Cohen 2013, Kienast 2003, Oshima 2014, Livingstone 1989, Machinist 1978, Foster 2005, Dalley 2008). The companion-volume relationship to Sumerian is named explicitly in the opening and the dedicated influences chapter is forward-pointed. One section per cycle in toc.yaml order: cosmogony (12 entries grouped into the three majors plus the creation-dossier short pieces plus the etiological incantation prologues), divine conflict and underworld (4), heroic epic (2), royal legend (8) opening with a paragraph on the *narû* genre, wisdom dialogic (4) opening with a paragraph on the Akkadian theodicy tradition, wisdom practical (3), disputations and animal fables (6), visionary and popular (2). Closing 'Patterns and the Question of Influence' synthesis section identifies the four sustained concerns of the corpus (cosmic order, theology of kingship, the pious-sufferer / theodicy tradition, transmission of knowledge through the scribal apparatus) and previews the three contact streams the influences chapter will address (Sumerian inheritance, Hurro-Hittite contact, Ugaritic/West Semitic resonance). Footnotes: 42; EVIDENCE markers: 47; COMPARATIVE-HOOK markers: 19; INFERENCE markers: 3; LACUNA markers: 1. All markers verified at column 0 on their own lines (per skill rule §'Marker placement'). gloss-ledger.yaml created at the book root with 39 entries — 31 with full_gloss_in: '00' (the terms whose full glossary first_mention_gloss appeared in body prose) and 5 with full_gloss_in: null (terms named in body but not given the full glossary text yet — Apsû, Sîn, Damkina, Babylon, Nineveh; these will be glossed in full at first thematic appearance in a story chapter). Validation passed: chapter_anchor [[ch-00-introduction]] present at line 1; every ledger native exists in glossary.yaml; intro length within the 6000-10000-word target for a 41-chapter book; two purple-prose phrases corrected ('great storm-bird' → 'storm-bird' on Anzû paragraph; 'great compositions' → 'major compositions' on the OB period overview)."
