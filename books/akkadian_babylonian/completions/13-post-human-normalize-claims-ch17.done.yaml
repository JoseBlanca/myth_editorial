summary: |
  Chapter 17 (Standard Babylonian Epic of Gilgameš) post-human-normalize. Round-1 claims-factcheck returned PASS-WITH-LIGHT-FIXES (0 HIGH / 2 MEDIUM / 2 LOW); four light edits applied to produce the approved file:

    (1) F-1 MEDIUM: corrected the dating of the *Catalogue of Texts and Authors* at both occurrences (line 33 comment block and line 67 body). The round-1 "Late Babylonian … Lambert's list, ca. 1200 BCE" framing was internally contradictory (Late Babylonian = first millennium BCE, not ca. 1200) and conflated the date of Sîn-lēqi-unninni himself (late second millennium BCE, Kassite period, ca. 1300–1000 BCE) with the date of the catalogue that names him (conventionally 10th–7th c. BCE composition; preserved on Neo-Assyrian Nineveh manuscripts of the 7th c. from Ashurbanipal's library and on Late Babylonian witnesses from Babylon; published by Lambert 1962, JCS 16: 59–77 as the modern editor). Both occurrences corrected; the distinction between the catalogue's first-millennium date and the tradent's late-2nd-millennium date is now explicit at both lines. Evidence is pulled through george-2003 (which names Sîn-lēqi-unninni in the catalogue and the SB-manuscript colophons); the Lambert 1962 modern-editor citation is recorded in the prose as bibliographic provenance but lambert-1962 is not introduced as a sources.yaml entry — the chapter stays within the already-cited dossier per the factcheck's recommended_fix.

    (2) F-3 MEDIUM: augmented the Sîn-lēqi-unninni attribution paragraph (line 67) and the [INFERENCE:] marker (line 112) with the SB-colophon evidence. The round-1 framing treated the catalogue notice as the sole attribution trace; per the factcheck's recommended_fix, the chapter now foregrounds, alongside the catalogue notice, the SB-Gilgameš-manuscript colophons at Nineveh and other centres that record the scholarly lineage of Sîn-lēqi-unninni (later Uruk scribal families traced their ancestry to him). The INFERENCE-marker basis-clause is expanded to record both attribution traces (catalogue + colophons) and to distinguish the catalogue's first-millennium date from the tradent's late-2nd-millennium date; the risk-clause is unchanged. This is asserted directly through the already-cited george-2003 and foster-2007 sources (per factcheck evidence section) rather than introducing a new [INFERENCE:] hedge — the colophon-lineage attestation is in the standard literature and is not a fresh inference, so no `[INFERENCE:]` wrapper was needed for the addition itself.

    (3) F-2 LOW: hedged the Bull of Heaven third-snort 300-men figure (line 233). The open-web triangulation in the factcheck confirmed the 100-and-200 progression but did not confirm the third-snort 300 (Foster 2005 pp. 162–166 / Dalley 2008 pp. 82–86 could not be directly opened in the audit). Per the factcheck's recommended_fix option ("if it is restored or variant, hedge with 'and so on' or 'in escalating sequence'"), the "with its third snort three hundred" phrase was replaced with "the snort-pit sequence escalates in continuing stages across the SB recension's pit-enumeration", retaining the directly-attested 100/200 and hedging the third stage as escalation rather than fixing a number not confirmed in this audit's reachable sources.

    (4) F-4 LOW: sharpened the Tablet XII translation-framing across the chapter (lines 40–46 comment block; line 73 body source-overview; line 355 body Tablet XII section; line 368 VARIANT marker; line 394 COMPARATIVE-HOOK; and the corresponding footnotes). The round-1 "partial Akkadian translation of the second half" framing was refined to "literal Akkadian translation of the second half … literal in technique (near-verbatim, word-for-word), partial only in scope (covering the second half of the Sumerian source)". The literal/word-for-word framing is the standard description in the secondary literature; the "partial" descriptor is retained but disambiguated as scope-only (covering only the second half) rather than as quality-of-translation (less than complete). Tablet XII's status as the one place where the Akkadian Gilgameš tradition translates a Sumerian Gilgameš source rather than recomposing from it is now sharpened.

  Provenance comment block appended at the file foot recording: timestamp, edits applied, structural checks passed, and round-1 factcheck cross-references.

