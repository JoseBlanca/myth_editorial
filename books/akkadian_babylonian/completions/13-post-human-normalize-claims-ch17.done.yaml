    rationale: "Corrected the *Catalogue of Texts and Authors* dating at both occurrences (line 33 comment block; line 67 body). The factcheck's evidence section (Wikipedia s.v. Catalogue of Texts and Authors, citing Lambert 1962 and Mitto 2022) confirms the catalogue is 'tentatively dated at some point between the 10th … and 7th centuries BCE' with surviving manuscripts from 7th-century Nineveh (Ashurbanipal's library) and Hellenistic/Arsacid Babylon; the round-1 'ca. 1200 BCE' dating conflated the tradent's date (late 2nd millennium, Kassite period) with the catalogue's date (first millennium). The fix replaces the 'Late Babylonian … Lambert's list, ca. 1200 BCE' phrase with 'first-millennium *Catalogue of Texts and Authors* (preserved on Neo-Assyrian Nineveh and Late Babylonian manuscripts; published by Lambert 1962, JCS 16: 59–77)' and adds an explicit distinction between the catalogue's first-millennium date and the tradent's late-2nd-millennium date at both locations. Evidence pulled through george-2003 (which names the attribution in the catalogue per the BMCR review); the Lambert 1962 modern-editor citation is bibliographic provenance in the prose, not a new sources.yaml entry, per the factcheck's recommended_fix and the task's instruction to 'stay within already-cited sources'. The INFERENCE marker at line 112 can stand (its basis-clause is expanded with the corrected catalogue dating); only the dating phrase needed correction."
