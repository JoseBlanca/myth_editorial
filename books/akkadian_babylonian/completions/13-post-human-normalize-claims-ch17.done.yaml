    disposition: ACCEPT
    rationale: "Augmented the redactor-attribution framing at line 67 (body) and line 112 ([INFERENCE:] marker) with the SB-Gilgameš-manuscript colophon evidence alongside the catalogue notice. The factcheck's evidence section confirmed that Sîn-lēqi-unninni's name appears in colophons of SB Gilgameš manuscripts (Wikipedia s.v. Sîn-lēqi-unninni: name appears in 'colophons' of SB tablets; BMCR review of George 2003: 'supposedly as edited by one Sin-leqi-unninni some time in the late second millennium BCE'); the brief's entities_glossary at line 85 already says 'his name appears in colophons'. The fix foregrounds the colophon evidence as a second attribution trace alongside the catalogue notice — the catalogue is the late-1st-millennium written attribution and the colophons are the manuscript-level attribution traces; together they anchor the redactor framing more firmly. The colophon-lineage detail (later Uruk scribal families traced their ancestry to Sîn-lēqi-unninni) is in the standard secondary literature (george-2003, foster-2007) and is not a fresh inference, so no new [INFERENCE:] wrapper was added for the augmentation itself; the existing [INFERENCE:] marker at line 112 has its basis-clause expanded to record both traces (catalogue + colophons) and the corrected catalogue dating, with the risk-clause unchanged."
  - finding_id: F-2
    kind: UNVERIFIED
    severity: LOW
    disposition: ACCEPT-HEDGE
    rationale: "Hedged the Bull-of-Heaven third-snort 300-men figure at line 233. The factcheck's evidence section (Wikipedia s.v. Bull of Heaven) confirmed the 100/200 progression but did not confirm a third-snort 300; Foster 2005 pp. 162–166 and Dalley 2008 pp. 82–86 were paywalled in the audit and the third stage could not be directly triangulated. Per the factcheck's recommended_fix option ('if it is restored or variant, hedge with \"and so on\" or \"in escalating sequence\"'), the third-snort 300 phrase was replaced with 'the snort-pit sequence escalates in continuing stages across the SB recension's pit-enumeration', retaining the directly-attested 100/200 and hedging the third stage as escalation. The factcheck noted the third snort is 'plausible from George 2003 (the snort-pit sequence escalates in the SB recension)' but not 'explicitly confirmed in the open-web triangulation'; the hedge preserves the escalation framing the SB recension supports while not asserting a specific number this audit could not verify. The chapter is strengthened by the hedge: the only attested numbers (100, 200) remain, and the escalation structure is preserved without a load-bearing third figure."
  - finding_id: F-4
    kind: HEDGING-NEEDED
    severity: LOW
    disposition: ACCEPT
    rationale: "Sharpened the Tablet XII translation-framing across the chapter (lines 40–46 comment block; line 73 body source-overview footnote; line 355 body Tablet XII section + footnote; line 368 VARIANT marker; line 394 COMPARATIVE-HOOK; line 373 body). The factcheck's evidence section noted that multiple open-web sources describe Tablet XII as 'a literal, word-for-word translation of the last part of *Gilgameš, Enkidu, and the Netherworld*' — i.e., the translation is LITERAL (where it appears) and PARTIAL only in scope (only the second half is translated). The round-1 'partial Akkadian translation' framing risked being read as less-than-complete-translation-of-what-it-covers; the fix replaces it with 'literal Akkadian translation of the second half … literal in technique (near-verbatim, word-for-word), partial only in scope' across all six locations. The literal/word-for-word framing is the standard secondary-literature description; the 'partial' descriptor is retained but disambiguated as scope-only. Tablet XII's distinctive textual status as the one place where the Akkadian Gilgameš tradition translates a Sumerian Gilgameš source rather than recomposing from it is now sharpened, which is the load-bearing point of the COMPARATIVE-HOOK at line 394."

