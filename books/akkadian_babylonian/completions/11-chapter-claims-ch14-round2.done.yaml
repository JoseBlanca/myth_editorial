summary: |
  Chapter 14 (Nergal and Ereškigal) round-2 claims revision. Round-1 factcheck returned BLOCK with three HIGH findings (F-1 Etana wrongly in Amarna cluster; F-2 union duration "seven" → "six" days; F-4 royal-wedding-coronation closure was a fabrication) and two lower findings (F-3 Amarna hair-seizing-and-plea climax was elided; F-5 prohibitions-catalogue translation variance). Round-2 corrections applied to both the brief and the claims:

  Brief (R2-1, R2-2, R2-3): removed the "formal royal-wedding-and-coronation" framing in the Sultantepe alternates; expanded the Amarna alternates entry to flag the hair-seizing climax; corrected the Amarna literary cluster references in special_instructions to remove Etana and to note the actual cluster (Adapa EA 356, Nergal EA 357, King of Battle EA 359, plus lexical/educational material). The brief's special_instructions explicitly note the union duration and the Sultantepe ending corrections.

  Claims (F-1 through F-5): removed Etana from the Amarna cluster (three places: source-overview, INFERENCE marker basis field, COMPARATIVE-HOOK; the COMPARATIVE-HOOK explicitly notes "Etana's witnesses are at Susa, Aššur, and Nineveh, not at Amarna" for clarity). Corrected union duration from "seven days and seven nights" to "six days and six nights" (twice; the action turns on the seventh day with Anu's intervention / Nergal's escape). Expanded the Amarna recension's narrative climax to include the hair-seizing scene, Nergal's threat to kill Ereškigal, Ereškigal's plea for joint rule, and the etiological resolution. Replaced the Sultantepe SB ending paragraph with the actual surviving closure: Anu's decree (much of which is damaged) establishing Nergal's permanent co-rule, followed by the closing line of Nergal and Ereškigal entering the bedchamber together — no separate wedding ceremony, no coronation sequence. Added a sentence linking the hair-seizing motif across both recensions (different functions: existential threat in Amarna, reunion in Sultantepe). Hedged the prohibitions catalogue's fifth item to acknowledge translation variance (Foster's "looking" / "lustfully look" rendering vs. more literal "do what men and women do" / sex-prohibition rendering); the narrative function (bathing-as-failure-point) preserved. Renamed §"Nergal's second descent and the royal wedding" to §"Nergal's second descent and Anu's decree". Updated the LACUNA marker on the SB recension to flag specifically Anu's decree damage and the council scenes.

  Source IDs unchanged from round 1 (foster-2005, dalley-2008, foster-2007, black-green-1992, bottero-2001). Marker counts unchanged: 3 INFERENCE + 2 LACUNA + 1 RECONSTRUCTION + 1 VARIANT = 7 markers. Comparative-hook count unchanged: 5. Round-2 chapter is 224 lines (vs round-1's 183 lines; the additional 41 lines are mostly the round-2 preamble correction-log).

