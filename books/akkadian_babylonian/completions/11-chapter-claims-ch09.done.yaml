summary: "Chapter 9 (Damkina's Bond) claims document. The brief was preemptively revised before stage 10a, on the basis of (i) chapter 8's factcheck-round-1 finding F-2 (which flagged that the original chapter-8 brief's pp. 326–360 range for Damkina's Bond was wrong; the correct range is Lambert 2013 pp. 321–325 + p. 497 notes) and (ii) secondary-source verification (Wikipedia s.v. Damgalnuna; Oshima 2010 on academia.edu) which surfaced three additional upstream errors in the original chapter-9 brief: wrong manuscript count (single → two: A 7882 NA + BM 27776 NB), wrong narrative summary (gestures-only → substantive Marduk-vs-Enlil conflict at Nippur, Eshumesha gods' capture of Anunnaki, Damkina's il-let-sa release, Marduk's capture of 360 gods including Enlil), and a dropped 'feminine cosmogonic chthonic pairing' framing inherited from the wrong chapter-8 reading.

Composition: short, partly fragmentary Akkadian text preserved on TWO manuscripts — A 7882 (Neo-Assyrian, Oriental Institute Chicago) and BM 27776 (Neo-Babylonian, British Museum). Lambert 2013 pp. 321–325 (+ p. 497 notes) is the standard modern critical edition; Oshima 2010 (academia.edu, 'Damkina shall not bring back her Burden in the future: A new Mythological Text of Marduk, Enlil, and Damkianna') provides an independent edition with a substantive philological disagreement on the il-let-sa term — Lambert reads 'bond' (something displayable, perhaps a clay tablet); Oshima reads 'burden' (a potentially catastrophic plague or natural / celestial disaster). Both editions edit both manuscripts.

Narrative structure (six steps preserved across the two-manuscript composite): (1) Marduk arrives at Nippur with his army (flooding / inundation motif); (2) the gods of Eshumesha (Ninurta's temple at Nippur) capture Anunnaki deities — initial advantage to Enlil's pantheon; (3) Neretagmil, the sukkal of the god Nāru (deified river), delivers a message to Damkianna (Akkadian: Damkina); (4) Damkina releases her il-let-sa — the act precipitates the conflict's resolution; (5) Marduk captures 360 gods of Eshumesha all together, with Enlil among them; (6) the Neo-Babylonian copy's colophon classifies the contents as a secret of Marduk and warns future generations against repeating the transgressions.

Dating: Lambert dates to the Kassite or Isin II dynasty (mid-2nd millennium BCE) on the Marduk-king + Nabu-as-scribe configuration; Oshima dates to 'the first quarter of the first millennium' (c. 1000–750 BCE). Lambert proposes Malgium as place of origin. Composed in Akkadian with some Aramaic linguistic influence.

Three INFERENCE markers covering (i) the identification of the captured 'Anunnaki' as Marduk-side gods rather than the generic Anunnaki; (ii) the il-let-sa release as the narrative's hinge irrespective of Lambert / Oshima reading; (iii) the structural pairing with Enmešarra's Defeat as a Marduk-vs-elder-pantheon sub-cluster. One LACUNA marker (the two damaged manuscripts; partial overlap; no external in-tradition donor source); one RECONSTRUCTION marker (Lambert 2013's composite text; medium confidence due to two-witness collation + remaining philological disagreements); one VARIANT marker (the Lambert 'bond' vs. Oshima 'burden' reading of il-let-sa, articulated as a philological disagreement on a single Akkadian word, not exemplar-variation; chapter follows Lambert per locked source).

Four COMPARATIVE-HOOK comments — all internal Akkadian: (i) Enmešarra's Defeat (Chapter 6) as the closest comparandum; (ii) Enūma Eliš Tablet IV–V's Marduk-elevation theogony extended into the political-theological register of subordinating Nippur; (iii) the secret-of-Marduk colophon tradition (Livingstone 1989 SAA 3 nos. 34–35); (iv) the unresolved philological disagreement between Lambert and Oshima on il-let-sa. All hooks are forwarded to the comparative chapter; no EVIDENCE token routes through Hesiod, Hurro-Hittite, or Hebrew material.

Source IDs used: lambert-2013 (sole textual anchor, at corrected page range pp. 321–325 + p. 497 notes; pp. 1–277 for Enūma Eliš cross-reference; pp. 281–298 for Enmešarra's Defeat cross-reference; pp. 281–401 for the Part III dossier); black-green-1992 (s.v. Damkina, Eshumesha, Enlil, Anunnaki, number symbolism); rla (s.v. Damgalnuna / Damkina; s.v. Eshumesha); foster-2007 (passim); foster-2005 and dalley-2008 (negative attestation); bottero-2001 (Marduk-Enlil rivalry; Mesopotamian numerical-cosmological symbolism). All seven source IDs in EVIDENCE tokens resolve to existing entries in sources.yaml. Oshima 2010 is named in the source-overview footnote and in the VARIANT / INFERENCE markers but no EVIDENCE token routes through it (named-but-flagged pattern; sources.yaml addition recommended for inventory-audit). Streck 2014 (BSOAS 77, 371) — already named-but-flagged from chapter 8 — remains relevant for manuscript-base claims.

Glossary check: Marduk, Damkina, Ea, Enlil, Anunnaki, Apsû, Tablet of Destinies, Sebitti, akītu — all use locked glossary.yaml renderings. Damkina was glossed in chapter 7 ('Marduk's mother, consort of Ea'); first reminder gloss given in chapter 9. New first-mention glosses given inline for: Eshumesha (Ninurta's temple at Nippur), Neretagmil (sukkal of Nāru, the deified river), Nāru (deified river), il-let-sa (the contested term — Akkadian, not glossed in glossary.yaml; the contested-philology framing is the body's discussion). Nippur and Malgium: Nippur is named in body for the first time substantively in chapter 9 (referenced earlier in scope.md as a major site); Malgium is mentioned only as Lambert's proposed place of composition. New gloss-ledger entries needed for: Eshumesha (definitely), Neretagmil (possibly — if he reappears), Nippur (definitely — substantive first body mention)."
