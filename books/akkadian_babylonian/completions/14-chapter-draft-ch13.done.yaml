summary: |
  Chapter 13 (The Descent of Ishtar) narrative draft. Asimov-style prose drawn from chapters/13-descent-of-ishtar.claims.approved.adoc. Every claim represented; no factual additions; all six markers (3 INFERENCE + 1 LACUNA + 1 RECONSTRUCTION + 1 VARIANT) preserved byte-for-byte; all six COMPARATIVE-HOOK comments carried over verbatim; all 30 footnotes carried over unchanged. Chapter ID anchor [[ch-13-descent-of-ishtar]] (per toc.yaml).

  Source overview opening (4 paragraphs) introduces the composition's content (Ishtar's descent, seven gates, captivity, Aṣušu-namir retrieval, Tammuz substitution, closing Tammuz wailing-rite hook), its primary translations (Foster 2005, Dalley 2008), the modern critical edition (Lapinkivi 2010 SAACT 6, named-but-flagged), the eBL online text resource (named-but-flagged per audit A7), and the multi-witness manuscript transmission (K.162 + Neo-Assyrian fragments + Aššur duplicate from the chief singer's library). Body sections: (i) The underworld (Kurnugê, Ereškigal as queen, Namtar as vizier); (ii) Ishtar's descent and threat at the gate; (iii) Seven gates, progressive stripping (with rhetorical refrain pattern foregrounded; INFERENCE on ritual/loss-of-status readings); (iv) Captivity and the plague on earth (sixty diseases; cessation of fertility; Papsukkal reports to Ea); (v) Ea creates Aṣušu-namir (water-of-life stratagem; INFERENCE on binding-speech theology); (vi) Ereškigal's curse and the sprinkling of the water of life; (vii) The ascent (progressive restoration in reverse order); (viii) Tammuz substituted (Tammuz's neglect; Belili's mourning); (ix) Closing ritual: the Tammuz festival (etiological hook; INFERENCE on cult-context preservation); (x) Variants and witness; (xi) The poem's place in the corpus.

  Style: Asimov register throughout; short paragraphs; plain modern English. No forbidden-words violations. No "Long ago..." / "It is said that..." openings. The closing ritual prescription's partly-damaged status preserved per the LACUNA marker. Sumerian *Inanna's Descent* handled per scope.md as comparative material only — the chapter explicitly notes the Akkadian *Descent of Ishtar* is an INDEPENDENT composition, not a translation; ETCSL 1.4.1 referenced only in the [VARIANT:] marker, in COMPARATIVE-HOOK comments, and in source-overview footnotes.

