medium_findings_detail:
  - finding_id: F-1
    kind: FACTUAL-ERROR
    locations: [line 91 (parentage paragraph, body)]
    issue: "The chapter renders the legend's line about the hill-loving brothers as 'the mother's brothers — Sargon's maternal uncles' — but the standard scholarly translation across multiple translation mirrors (ANET/Speiser; World History Encyclopedia; mostlydeadlanguages CT 13 42-43; intertextual.bible) reads 'the brother(s) of MY FATHER' — i.e., PATERNAL uncles, NOT maternal. The chapter attributes the maternal reading to Westenholz 1997, but the mainstream rendering is paternal kinship. The highland-population framing can stand for either side; only the kinship-side needs correction. Verify Westenholz 1997's specific reading at human review; if Westenholz also reads 'father's brothers' (paternal), the chapter is in error and should be corrected; if Westenholz proposes a maternal-kin reinterpretation, the chapter should make clear this is Westenholz's specific reading against the older Speiser/ANET standard."
  - finding_id: F-2
    kind: UNVERIFIED
    locations: [line 50 (source overview), line 57 (paragraph 2), line 80 (LACUNA), line 82 (RECONSTRUCTION), line 216 (VARIANT)]
    issue: "The chapter's specific framing 'K.3401 (Neo-Assyrian) + at least two Neo-Babylonian duplicate manuscripts' is plausible but not directly verifiable from open-web triangulation. Wikipedia confirms 'three manuscripts' total (verbatim: 'only the beginning of the text (the first two columns) is known, from the fragments of three manuscripts'). The British Museum K-3401 catalogue confirms K.3401 as Neo-Assyrian from Aššurbanipal's library. But the NA-vs-NB breakdown of the duplicates is not specified in open-web sources, and one web-search summary reported 'three Neo-Assyrian and one Neo-Babylonian' (four total) — a different configuration. The chapter's framing may reflect Westenholz 1997's specific manuscript inventory and is plausible; needs direct verification against Westenholz 1997 pp. 36-37 at human review."

low_findings_detail:
  - finding_id: F-3
    kind: HEDGING-NEEDED
    locations: [line 50, line 62, line 187, line 232]
    issue: "The chapter's 'first-millennium literary composition' framing is defensible as a manuscript-attestation-floor framing but slightly overstates scholarly consensus on the composition-date question. Some scholars (e.g., Brian Lewis 1980 building on earlier proposals) date the underlying composition to the Neo-Assyrian period linked to Sargon II (722–705 BCE) as propaganda; others place the composition earlier (Old Babylonian roots) with first-millennium curation. The 'fully literary elaboration' framing at line 62 reads as if the composition itself is uncontroversially first-millennium. Optional refinement: add a brief hedge acknowledging the composition-date debate at line 187 or 232."

