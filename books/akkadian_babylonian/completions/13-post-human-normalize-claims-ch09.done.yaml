summary: |
  Post-factcheck normalization of chapter 9 claims after factcheck-round-1 returned REVISE (0 HIGH, 2 MEDIUM, 2 LOW + 2 NOTES). All four findings ACCEPTED and applied as edit-level fixes. The brief was preemptively revised before stage 10a (on the basis of chapter 8's factcheck-round-1 finding F-2 and additional secondary-source verification), so all four major upstream errors of the original chapter-9 brief — wrong page range pp. 326-333 → pp. 321-325 + p. 497, single-manuscript framing → two manuscripts (A 7882 NA + BM 27776 NB), gestures-only narrative summary → substantive Marduk-vs-Enlil conflict at Nippur, "feminine cosmogonic chthonic pairing" framing → Marduk-vs-elder-pantheon framing — were absorbed at the brief stage rather than the post-factcheck stage. The post-human-normalize fixes are therefore localized to philological / citation-routing tightenings rather than structural rewrites.

  - F-1 (MEDIUM, name lineage): Damkianna corrected from "older Sumerian-style form" to "late Akkadian variant spelling". The Sumerian form of the goddess's name is Damgalnuna; the standard Akkadian form is Damkina; Damkianna is a late Akkadian variant attested in some manuscripts of *Damkina's Bond* (per Beaulieu / Wikipedia s.v. Damgalnuna). Oshima 2010 uses the spelling Damkianna in his title and translation; Lambert 2013 uses Damkina. The chapter's body now correctly identifies all three forms with their lineage. One place updated: claim 10's parenthetical at line 92 — "(the older Sumerian-style form of the name; Akkadian Damkina)" → "(a late Akkadian variant spelling used in some manuscripts of this composition; the older Sumerian form is Damgalnuna and the standard Akkadian form is Damkina)".

  - F-2 (MEDIUM, astronomy): The 360-stars sky-list link is dropped. The Three Stars Each tradition has 36 stars (3 per month × 12 months); MUL.APIN has 71 stars and constellations; there is NO Mesopotamian sky-list of 360 stars. The 360-day schematic-year link is retained (correctly attested) and supplemented with the 360° zodiacal-scheme link (introduced ca. 5th century BCE). One place updated: claim 13 at line 124 — the parenthetical "and to the count of stars in the standard Mesopotamian sky-list (the *Three Stars Each* tradition, *MUL.APIN*-related compendia)" is replaced with "the standard 12 × 30-day year of the astrolabes and of *MUL.APIN* — and, by extension, to the 360° zodiacal scheme of later Babylonian astronomy". MUL.APIN is now correctly characterised as the schematic-year compendium, not the alleged 360-star sky-list. The Black & Green 1992 EVIDENCE token is retained (s.v. number symbolism is genre-appropriate for the schematic-year discussion).

  - F-3 (LOW, philology): The BM 27776 colophon's specific Akkadian word *pirištu* attribution is softened from a confident assertion ("a *pirištu*") to a genre-level claim ("the Akkadian term used in such colophons is typically *pirištu*"). The substantive secret-of-Marduk classification is fully corroborated by the secondary literature (Wikipedia s.v. Damgalnuna; Oshima 2010); only the specific Akkadian word's identification in BM 27776 is unverified in the accessible secondary sources. One place updated: claim 5 at line 49 — "describes the composition's contents as a secret of Marduk — a *pirištu* —" → "describes the composition's contents as a secret of Marduk — the Akkadian term used in such colophons is typically *pirištu* —".

  - F-4 (LOW, philology): The VARIANT marker's Lambert "bond" vs. Oshima "burden" opposition is tightened with a brief philological note. Per Oshima 2010, "burden" derives from *e'iltu* (obligation, bond, sin), so the underlying lexical landscape is shared between the two readings — they share the *e'iltu* / "obligation/bond" sense in the etymological genealogy. They differ in how the released object operates (positive displayable token in Lambert; catastrophic release of obligation in Oshima), not in the etymological starting point. Oshima rejects the alternative derivation from *illatu* ("horde"). One place updated: VARIANT marker after claim 11 — the alt= field now reads: "Oshima 2010's reading 'burden' — derived from *e'iltu* (obligation, bond, sin), so etymologically a binding obligation that Damkianna's release sends out as ill-fortune (a plague or natural / celestial disaster); Oshima rejects the alternative derivation from *illatu* ('horde')". The reason= field correspondingly tightened to note that "both readings are scholarly proposals on the same Akkadian word, sharing the *e'iltu* / 'obligation/bond' lexical landscape but differing in how the released object operates (a positive displayable token in Lambert vs. a catastrophic release of an obligation in Oshima)".

  Additional housekeeping: section anchor updated from `[[ch-09-damkina-bond-claims]]` to `[[ch-09-damkina-bond-claims-approved]]` (matching the chapters 7 / 8 approved-version convention); chapter title updated to "Damkina's Bond — Claims (post-factcheck approved)"; meta-header comment block expanded with the round-1 fix log (F-1 / F-2 / F-3 / F-4 dispositions inline). No changes to the substantive narrative content of the claims; all 14 claim paragraphs, 3 INFERENCE markers, 1 LACUNA marker, 1 RECONSTRUCTION marker, 1 VARIANT marker, and 4 COMPARATIVE-HOOK comments are preserved with the citation-routing and philological-tightening fixes applied.

