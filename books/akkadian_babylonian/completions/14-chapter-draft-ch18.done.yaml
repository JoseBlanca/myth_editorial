  one over the others; the three are treated as roughly co-equal in
  scholarly weight per the brief's variants.classification: co-equal,
  in contrast to ch17's composite-editorial / single-prevalent
  framing. The shared narrative spine (eagle-serpent oath; betrayal;
  serpent's appeal to Šamaš; eagle's punishment in the pit; Etana's
  parallel predicament of childlessness; Etana's prayer for the
  *šammu ša alādi*; Šamaš's direction to the pit; Etana's rescue of
  the eagle; the eagle's reciprocity; the heaven-flight; the lost
  conclusion) is narrated once in the dedicated §"The shared narrative
  spine" section, then traced through each recension in its own
  section (OB, MA, SB) and consolidated in the heaven-flight section
  for the SB-only seven-gate sequence.

