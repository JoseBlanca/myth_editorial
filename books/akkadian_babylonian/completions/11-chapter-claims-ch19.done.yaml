      - livius.org Sargon legend page (500 error);
      - livius.org Legend of Sargon of Akkad page (500 error);
      - philnel.com (former K-State NELP page) (404);
      - Wikipedia Sargon_Birth_Legend and Legend_of_Sargon (404 —
