    Open-web research was conducted via WebFetch to triangulate the
    Sargon Birth Legend's text and surviving content, since the
    Westenholz 1997 critical edition and Foster 2005 translation
    pages are not directly accessible in the conversation. The
    fetched sources confirmed:

    1. The autobiographical opening's standard translation
       ("Sargon, mighty king, king of Akkad, am I"; "my mother was a
       high priestess, my father I knew not");
    2. The Azupirānu / Saffron City birthplace on the Euphrates;
    3. The conception "in secret" and the basket of rushes / reeds
       sealed with bitumen;
    4. Akki (Aqqi) the water-drawer's rescue and the gardener
       apprenticeship;
    5. Ištar's grant of love and the kingship;
    6. The K.3401 manuscript from Aššurbanipal's library at Nineveh
       (Neo-Assyrian, 7th c. BCE) plus Neo-Babylonian duplicates;
       only the first two columns substantively preserved across
       three manuscript fragments;
    7. Westenholz 1997 (*Legends of the Kings of Akkade: The Texts*,
       pp. 36–49) as the definitive critical edition;
    8. The Otto Rank 1909 comparative-mythography framework
       (Sargon-Moses-Karna-Oedipus typology);
    9. The Moses / Exodus 2 parallel as the most-discussed cross-
       cultural comparandum.

    Sources successfully fetched:
      - en.wikipedia.org/wiki/Sargon_of_Akkad (queried twice; provided
        the autobiographical opening's standard English translation
        including the Azupirānu reference, the manuscript count
        (three fragments), the Aššurbanipal-library context, and the
        Otto Rank 1909 framework);
      - www.britannica.com/biography/Sargon (provided the historical
        Sargon's regnal context, the priestess-mother / Euphrates /
        gardener-rescue framing, the Sharru-kin etymology, and the
        Akkad city context);
      - en.wikipedia.org/wiki/Akkadian_literature (confirmed the
        Birth Legend's listing among notable Akkadian compositions).

    Sources attempted but unavailable (404, 500, redirect, or
