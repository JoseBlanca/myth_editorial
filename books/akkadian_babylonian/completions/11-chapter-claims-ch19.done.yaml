summary: |
  Chapter 19 (*The Birth Legend of Sargon*) claims document. Single-
  prevalent classification per the brief: the first-millennium
  Babylonian/Assyrian recension preserved on K.3401 (Neo-Assyrian, from
  Aššurbanipal's library at Nineveh, 7th c. BCE) and its Neo-Babylonian
  duplicates is the prevailing reading; Westenholz 1997 (*Legends of
  the Kings of Akkade: The Texts*, pp. 36–49) is the definitive
  critical edition; Foster 2005 (pp. 912–913) is the principal English
  translation; Foster 2007 (pp. 95–98) supplies the late-tradition
  commentary; Bottéro 2001 supplies the royal-legend / royal-
  legitimation context; Noegel 2005 (pp. 233–245) supplies the *narû*
  genre context; Black & Green 1992 supplies the Sargon / Akkad / Ištar
  triangulation; Kvanvig 2011 anchors the Babylonian-biblical
  intertextual cross-cultural parallel (Moses / Exodus 2).

  Sources used (seven total, all resolving to existing sources.yaml entries):
    - westenholz-1997 (primary; definitive critical edition; pp. 36-49)
    - foster-2005 (primary-translation; principal English translation; pp. 912-913)
    - foster-2007 (secondary; pp. 95-98; late tradition and *narû* genre)
    - black-green-1992 (secondary; s.v. Sargon, Akkad, Ištar)
    - bottero-2001 (secondary; passim on royal-legend / royal-legitimation tradition)
    - noegel-2005 (secondary; pp. 233-245; *narû* genre and Akkadian narrative corpus)
    - kvanvig-2011 (secondary; passim on Babylonian-biblical intertextual parallels; the Moses-Sargon cross-cultural anchor)
  Zero invented source IDs.

  Named-but-flagged (not anchored as EVIDENCE tokens):
    - Otto Rank 1909, *The Myth of the Birth of the Hero* — the foundational
      comparative-mythography treatment of the exposed-infant typology
      (Sargon-Moses-Karna-Oedipus); named in the cross-cultural section
      and in the Greek-Roman and Indic comparative hooks. Substantive
      comparative anchor routed through Westenholz 1997 and Kvanvig 2011.
    - Brian Lewis 1980, *The Sargon Legend: A Study of the Akkadian Text
      and the Tale of the Hero Who Was Exposed at Birth* — the principal
      monograph-length study of the exposed-infant motif in the Sargon
      legend. Named-but-flagged in the cross-cultural section. Substantive
      material routed through Westenholz 1997.

  Narrative structure: source overview (five claims) followed by
  thematic sections following the legend's narrative arc:
    - Source overview: K.3401 + Neo-Babylonian duplicates; the
      Westenholz 1997 critical edition; the historical Sargon
      ca. 2334–2279 BCE; the *narû* genre framing; the working
      translations.
    - The autobiographical opening: "Sargon, mighty king, king of
      Akkad, am I" — the first-person voice; the *enitu* (high-
      priestess) mother; the unknown father; the maternal kin in the
      hills; the city Azupirānu on the Euphrates; the conception "in
      secret".
    - The basket of reeds, the bitumen, and the river: the basket-and-
      bitumen image; the Euphrates setting; the river bearing the
      basket downstream.
    - Aqqi the water-drawer and the gardener apprenticeship: Aqqi
      (Akki) the *dāli* (drawer of water); the drawing-up of the
      basket; the adoption as son; the gardener (*nukaribbu*)
      apprenticeship; the structural framing of the social-stratum
      origin.
    - Ištar's love and the rise to kingship: Ištar's grant of love;
      the exercise of kingship; the partly-damaged years-of-reign
      figure; the self-made-king typology; the divine-election
      theology.
    - The conquest catalogue and the closing autobiographical address:
      the partial conquest catalogue; the *narû* peroration not
      preserved.
    - The historical Sargon and the legendary tradition: the historical
      reign ca. 2334–2279 BCE; the layered legendary tradition; Akkad
      / Agade as the unlocated literary referent.
    - The *narû* genre and the legend's literary function: the three
      functions (royal-legitimation, literary, didactic); the cycle
      with the *King of Battle* and the *Cuthaean Legend of Narām-Sîn*.
    - Variants and witness: the K.3401 + Neo-Babylonian duplicates
      dossier as the single-prevalent recension.
    - The legend's place in the corpus: the *narû* dossier; the first-
      millennium scribal context; the cross-cultural fame.

  Markers used (per the brief's lacunae and variants blocks):
    - 1 [LACUNA:] marker: closing autobiographical section — the
      completion of the conquest catalogue and the formal *narû*
      address to the future ruler — damaged across all surviving
      witnesses; scholarly_reconstruction: yes within the
      first-millennium recensional dossier (K.3401 + NB duplicates
      overlap and supply mutual coverage for the substantively
      preserved opening); no in-tradition fill for the lost closing.
    - 1 [RECONSTRUCTION:] marker: composite text of the autobiographical
      opening reconstructed across K.3401 and the Neo-Babylonian
      duplicates; in-tradition within the first-millennium scribal
      stream (Neo-Assyrian and Neo-Babylonian roughly contemporary;
      no cross-period or cross-dialect fill required for the
      substantively preserved opening); minor textual variants do
      not affect substance; confidence: high for the autobiographical
      opening, low-to-none for the lost closing.
    - 1 [VARIANT:] marker: primary = K.3401 (Neo-Assyrian, Aššurbanipal's
      library at Nineveh, 7th c. BCE); alt1 + alt2 = Neo-Babylonian
      duplicate manuscripts; chosen = the composite first-millennium
      recension per the brief's single-prevalent classification. The
      witnesses generally agree on the autobiographical opening;
      Westenholz 1997 establishes the composite.
    - 2 [INFERENCE:] markers:
      (i) The accession framing — divine love granting kingship to a
          foundling of humble origin — articulates a royal-legitimation
          theology in which the king's authority derives directly from
          divine election rather than from dynastic descent; the
          "self-made-king" typology as paradigmatic Mesopotamian
          framework. Risk flagged: the royal-legitimation reading is
          editorial framing, supported by the secondary literature but
          interpretive.
      (ii) The legend's structural shape articulates a coherent
           narrative typology that the composition presents as Sargon's
           biography but that has the literary form of a paradigmatic
           founder-king tale; the typology is widely attested in the
           wider Eurasian mythological tradition. Risk flagged: the
           "paradigmatic typology" reading is editorial framing,
           supported by the cross-cultural-parallel material but
           interpretive — the historical-vs-literary referent question
           is central to Sargon scholarship.

  Seven COMPARATIVE-HOOK comments at chapter foot:
    (i) Akkadian internal — the Sargon legendary cycle (Birth Legend,
        King of Battle, Cuthaean Legend) as a single Westenholz-edited
        dossier; the founder-king and his grandson as paired figures
        in the late tradition's literary memory of the Akkadian
        dynasty.
    (ii) Akkadian internal — the *narû* genre cross-link with the
         Cuthaean Legend of Narām-Sîn (chapter 24); structural
         complementarity: rise-from-obscurity narrative and fall-and-
         repentance narrative.
    (iii) Hebrew Bible (Exodus 2) — the Moses parallel; motif-by-motif
          correspondence (basket of bulrushes / *tebah*; bitumen /
          *ḥemar* + *zefet*; river; rescue by member of receiving
          social order; rise from foreign/humble household to
          leadership); the direction-of-dependence debate (direct
          borrowing vs shared Near Eastern motif; the consensus
          favours the shared-motif model); Kvanvig 2011 as the
          intertextual anchor; reserved for the comparative chapter.
    (iv) Greek-Roman — Romulus and Remus exposed-twins typology;
         the shared structural features and the typological (not
         transmission-historical) parallel; Otto Rank 1909 named-but-
         flagged.
    (v) Persian — Cyrus's birth legend in Herodotus 1.107–122;
        mountain rather than river exposure; the typological parallel.
    (vi) Egyptian — *Königsnovelle* (Royal Novella) genre; genre-level
         parallel rather than motif-level; the royal-legitimation
         framework shared.
    (vii) Indic — Karna's birth legend in the Mahābhārata; the divine
          conception, secret birth, river exposure, charioteer rescue,
          eventual royal revelation; Otto Rank 1909 named the Karna-
          Sargon-Moses-Oedipus cluster.

  Glossary compliance (locked forms used throughout body prose):
    - Sargon (universal anglicization; locked per glossary.yaml);
      first-mention gloss "Šarru-kīn — 'the king is true'" included
      per glossary's first_mention_gloss specification.
    - Ištar (š-háček; NEVER Ishtar in body prose). One occurrence of
      "Ishtar" appears in body prose only as a verbatim quotation of
      Foster 2005's published English translation ("Ishtar granted me
      her love") inside an explicit translator-citation framing; this
      follows the chapter 17 precedent of preserving Foster's
      published title-and-quotation usage verbatim while using the
      locked Ištar form for all other body-prose references.
    - Akkad (universal anglicization; locked per glossary.yaml); first-
      mention parenthetical gloss "Agade — the lost capital city of
      Sargon's empire" included per glossary's first_mention_gloss.
    - Aššurbanipal's library at Nineveh — Aššur locked form
      (š-háček); Nineveh locked English form per glossary.
    - Euphrates, Babylonian, Assyrian — universal English forms.
    - *narû* — italicised Akkadian genre term per glossary; paired
      with "genre", "composition", or "dossier" on first mention.
    - *enitu*, *dāli*, *nukaribbu*, *râmu* — composition-specific
      Akkadian terms italicised in body prose with English gloss
      ("high-priestess", "drawer of water", "gardener", "love");
      these are technical terms not in the glossary but used with
      explicit translation per scope.md's italicised-Akkadian
      convention.
    - Cuthaean Legend of Narām-Sîn — composition-specific entity;
      Narām-Sîn locked form per glossary (with macrons and
      circumflex). The legend's composition title preserved verbatim.
    - Azupirānu — composition-specific place-name in the legend
      preserved verbatim (with macron); no glossary entry. Translated
      as "Saffron City" per Westenholz 1997's commentary.
    - Aqqi (Akki) — composition-specific person-name preserved in
      both transliterations; the *dāli* / water-drawer.
  No glossary violations in body prose.

  No comparative-Part-II material crosses the line from comparative
  hook into body prose: the Hebrew Bible (Exodus 2 Moses), Greek-Roman
  (Romulus/Remus), Persian (Cyrus), Egyptian (Königsnovelle), and
  Indic (Karna) comparanda all appear only in COMPARATIVE-HOOK
