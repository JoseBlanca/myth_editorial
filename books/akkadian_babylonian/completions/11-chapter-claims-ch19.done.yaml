  caution_on_specific_attestations: |
    The chapter is conservative about specific page-by-page attestations
    within Westenholz 1997, pp. 36–49 and Foster 2005, pp. 912–913,
    since the writer has not directly accessed those pages. Page-range
    citations within Westenholz 1997 (pp. 38–39 for the opening; pp.
    38–40 for the basket-and-river; pp. 40–42 for Aqqi and the
    gardener; pp. 42–44 for Ištar's love and kingship; pp. 44–48 for
    the conquest catalogue; pp. 44–49 for the lost closing) are
    estimates within the brief's locked total range (pp. 36–49) and
    should be verified during fact-check against the actual Westenholz
    1997 volume.

    Round-1 factcheck should focus on whether:
      (a) the autobiographical opening's standard translation is
          correctly given ("Sargon, mighty king, king of Akkad, am I";
          "my mother was a high priestess, my father I knew not";
          Azupirānu the city; conception in secret; etc.);
      (b) the *enitu* term is correctly characterised as a high-
          priestess with ritual-celibacy office (vs alternative
          readings);
      (c) the historical Sargon's regnal dates (ca. 2334–2279 BCE)
          are correct per the standard middle-chronology and per
          Westenholz 1997's introduction;
      (d) the K.3401 manuscript identification (Neo-Assyrian, from
          Aššurbanipal's library at Nineveh, 7th c. BCE) is correct;
      (e) the Neo-Babylonian duplicate manuscripts count and
          characterisation is correct (the chapter says "at least two");
      (f) the gardener (*nukaribbu*) and water-drawer (*dāli*) Akkadian
          technical terms are correctly characterised;
      (g) the years-of-reign figure in the legend is partly damaged
          (vs preserved in full);
      (h) the *narû* genre's three principal Akkadian compositions
          (Birth Legend, King of Battle, Cuthaean Legend) are all
          edited by Westenholz 1997 in the same volume;
      (i) the cross-cultural Moses parallel is correctly characterised
          (motif-by-motif correspondence; the direction-of-dependence
          debate; the shared-Near-Eastern-motif consensus);
      (j) the Otto Rank 1909 and Brian Lewis 1980 named-but-flagged
          attestations are correctly handled.

  pattern_match_with_recent_chapters: |
    Following the chapter 14 / chapter 15 / chapter 16 / chapter 17 /
    chapter 18 pattern of conservative line-by-line claims when the
    writer does not have direct primary-source access; specific
    verbatim quotations are limited (only the iconic opening and the
    Foster 2005 translation of Ištar's love line); the chapter
    operates at the level of the composition's overall narrative
    structure and content with appropriate INFERENCE markers for
    interpretive readings (the royal-legitimation theology; the
    paradigmatic typology).

    Chapter 19 is structurally simpler than chapter 17 (which has 12
    tablets to cover) and chapter 18 (which has three co-equal
    recensions). The single-prevalent classification of the first-
    millennium recensional dossier (K.3401 + NB duplicates) gives a
    clean recensional baseline; the structural lacuna of the closing
    material is handled by the dedicated [LACUNA:] marker and is not
    extrapolated. The chapter's principal interpretive moves — the
    royal-legitimation theology INFERENCE marker and the paradigmatic
    typology INFERENCE marker — follow the chapter 17 wisdom-literature
    reading pattern of explicit risk flagging.

  decisions_on_ambiguous_points: |
    (i) Single-prevalent vs co-equal-recensions handling: the brief
    classifies the legend as single-prevalent (the first-millennium
    recension is the prevailing reading). The chapter follows this
    exactly — a single [VARIANT:] marker treats K.3401 and the
    Neo-Babylonian duplicates as the composite first-millennium
    recension, with the substantive narrative stable across the
    witnesses. The minor textual variants among the duplicates are
    noted but not enumerated, since the brief states the substance of
    the basket-on-the-river story is stable.

    (ii) Closing-material handling: the brief notes the closing lines
    are "partly damaged". The chapter foregrounds the structural fact
    that the closing autobiographical address — the formal *narû*
    challenge to a future ruler — is not substantively preserved; the
    parallel formal closing convention in the *Cuthaean Legend of
    Narām-Sîn* is named as the generic comparandum, but the *Birth
    Legend*'s closing is reconstructed in form only through its
    generic affiliation. The chapter does NOT extrapolate the closing's
    content; the [LACUNA:] marker flags scholarly_reconstruction as
    yes-within-the-opening-only, no-for-the-closing.

    (iii) Historical-vs-legendary handling: the brief's
    special_instructions direct including the historical context
    without conflating history with legend. The chapter handles this
    by giving the historical Sargon his own dedicated section,
    framing the legendary tradition as a layered development on the
    historical foundation, and explicitly noting the chronological
    depth (the first-millennium *Birth Legend* is roughly a
    millennium and a half after the historical reign). The second
    INFERENCE marker articulates the historical-vs-literary referent
    question as a central interpretive question with risk flagged.

    (iv) Moses-parallel handling: the brief identifies the biblical
    Moses parallel as the most-discussed cross-cultural anchor and
    cites Kvanvig 2011 as the intertextual study. The chapter
    handles this by giving the Hebrew-Bible Moses parallel its own
    detailed COMPARATIVE-HOOK comment with motif-by-motif
    correspondence (the basket of bulrushes / *tebah*; the bitumen
    / *ḥemar* + *zefet*; the river; the rescue; the rise from
    foreign household to leadership), routing the substantive
    comparative anchor through Westenholz 1997 (p. 37) and Kvanvig
    2011 (in sources.yaml). The direction-of-dependence question
    is articulated as a debate with the shared-Near-Eastern-motif
    consensus position foregrounded; the substantive comparative
    treatment is reserved for the comparative chapter per
    scope.md.

    (v) The *enitu* mother's social status: the brief specifies the
    mother as a "high priestess" without further detail. The chapter
    follows Westenholz 1997 and Foster 2005's standard reading of
    the *enitu* as a priestess of a type with ritual-celibacy
    obligations; the "in secret" framing is interpreted as the
    legend's narrative motivation for the exposure. The factcheck
    should verify the *enitu* characterisation against Westenholz
    1997's commentary; alternative readings of the lexeme as
    "changeling" or as a different priestly office are noted in some
    web research but the standard scholarly reading is the
    high-priestess interpretation.

    (vi) Otto Rank 1909 and Brian Lewis 1980 named-but-flagged: the
    chapter handles these as named-but-flagged in the cross-cultural
    footnote following the chapter 18 precedent (Saggs 1986;
    Kinnier Wilson 1985; Novotny 2001). The substantive comparative
    anchors route through Westenholz 1997 and Kvanvig 2011 (both
    in sources.yaml).

    (vii) The Aqqi (Akki) transliteration: both Aqqi and Akki appear
    in the scholarly literature. The chapter uses Aqqi as the primary
    transliteration (per the brief's entities_glossary) and notes
    Akki as the alternate transliteration on first mention. This
    follows the chapter 17 precedent of giving alternate
    transliterations on first mention with the locked form
    preferred in body prose.
