  Chapter 12 (The First Brick) narrative draft. Asimov-style prose drawn from chapters/12-first-brick.claims.approved.adoc; every claim represented; no factual additions; all six markers (3 INFERENCE + 1 LACUNA + 1 RECONSTRUCTION + 1 VARIANT) preserved byte-for-byte; all six COMPARATIVE-HOOK comments carried over verbatim. Chapter ID anchor [[ch-12-first-brick]] (per toc.yaml).

  Source overview opening (4 paragraphs) introduces the composition's content (Ea creates the freshwater deep, then fashions seventeen craft-pantheon deities + king + mankind for temple renovation; Marduk absent), its modern editorial title (after the *libittu maḫrītu*), its sole modern critical edition (Lambert 2013 pp. 376–383), and its multi-witness manuscript transmission (Late Babylonian tablets including WVDOG 4 plate 12 + a late Assyrian fragment). Body sections: (i) Renovation, not foundation — clarifies the libittu maḫrītu as the recovered/recycled brick rather than an inaugural new-building brick; (ii) Ea creates the freshwater deep — establishes the Ea-centred opening and the Ea-centred-minority-register placement within the late-Babylonian dossier; (iii) The clay-creation of the craft-pantheon — Kulla, the construction trio Ninildu/Ninsimug/Ninagal, the resource-supply cohort, Kusu the chief priest, plus king and mankind; (iv) The renovation as the divine archetype — closes the cosmogonic loop by tying the divine labour-force to the human ritual-present, with lexical commentary on libittu / libittu maḫrītu; (v) Variants and witness; (vi) The poem's place in the corpus; (vii) Closing reflection on the diversity of Babylonian creation thought (the cycle's closing chapter).

