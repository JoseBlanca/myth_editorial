summary: "Produced 15 chapter briefs for the Akkadian/Babylonian mythology book covering the four wisdom and popular-narrative cycles (chapters 27–41): four reflective-dialogue and complaint texts (Dialogue between a Man and his God, Ludlul bēl nēmeqi, Babylonian Theodicy, Dialogue of Pessimism), three practical-instruction texts (Counsels of Wisdom, Counsels of a Pessimist, Šimâ milka), six disputations and animal fables (Tamarisk and Date Palm, Ox and Horse, Nisaba and Wheat, Fable of the Willow, Series of the Fox, Fable of the Riding-Donkey), and the two visionary/popular narratives (Underworld Vision of an Assyrian Prince, Poor Man of Nippur). All briefs source-pinned exclusively to the approved registry (Lambert 1960, Oshima 2014, Cohen 2013, Kienast 2003, Lambert 2013 not used here, Livingstone 1989, Foster 2005, Dalley 2008, plus CAD/AHw/RlA/Black-Green/Bottéro/Foster 2007 as secondary). Variant classifications follow the sizing rubric: composite-editorial for Ludlul, Theodicy, Series of the Fox; co-equal for Šimâ milka (three peripheral recensions) and Tamarisk-Date Palm (OB/MA recensions); single-prevalent for the rest. Length sizing follows the skill: Ludlul at 9000 words, Theodicy at 7000, Series of the Fox at 6000, Šimâ milka and Dialogue of Pessimism at 4500, Underworld Vision and Poor Man of Nippur at 4000, Tamarisk-Date Palm at 3500, Dialogue between a Man and his God at 3000, Counsels of Wisdom at 2200, Counsels of a Pessimist and Ox-Horse at 1500, Nisaba-Wheat / Willow / Riding-Donkey at 1200. Cross-cultural parallels developed substantively for the central wisdom texts (Job, Ecclesiastes, Egyptian instructions, Aramaic Aḥiqar) and the comic and visionary genres (Aesop, Arabian Nights, Hellenistic katabasis); Sumerian disputation analogues handled as comparative-only background per scope. Special instructions flagged for: acrostic structure (Theodicy), recension synopsis (Šimâ milka), comic register (Poor Man of Nippur), iškaru terminology (Series of the Fox), the renaming of the Riding-Donkey from the non-standard Poor-Man-and-Donkey label, and the genealogical importance of the Dialogue between a Man and his God as the earliest Akkadian theodicy. Triangulation databases include ORACC, CDLI, ETCSL (for Sumerian disputation comparanda), and SEAL throughout."
