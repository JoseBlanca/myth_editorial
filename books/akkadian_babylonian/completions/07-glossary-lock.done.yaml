    detail: "Locking Ištar, Ereškigal, Šamaš, Sîn, Anzû, Ḫumbaba, Atra-ḫasīs etc. with full Assyriological diacritics matches scope.md's stated policy but is denser than the sumer book (which anglicised — Ereshkigal, Ningishzida, Geshtinanna). If at any later stage the user judges the diacritic density too high for general-reader prose, the glossary can be re-locked to anglicised forms in a single editing pass; the never_use rules and gloss content stay the same."
