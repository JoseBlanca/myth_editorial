summary: "41-entry locked glossary covering deities, heroes and named figures, places, and technical/ritual/genre terms. Run autonomously per the user's 'I'm busy' guidance, applying scope.md's Assyriological-standard policy (š, ṣ, ṭ, ḫ; macrons for vowel length; circumflex for contracted long vowels) and Akkadian-over-Sumerian for the cross-cultural deity pairs (Ištar, Ea, Anu, Sîn, Šamaš, Adad, Damkina, Apsû, Anzû, Ḫumbaba, Dumuzi). Sumerian forms are explicitly listed as `never_use` on each affected entry — Inanna, Enki, An, Nanna/Nanna-Suen, Utu, Iškur, Damgalnuna, abzu, Anzud, Huwawa, Dumuzid, Bilgames, Unug — so chapter-claims and prose factcheck stages will catch any drift back to companion-volume vocabulary. Five terms are reserved for italicised non-translation (*Apsû*, *akītu*, *narû*, *apkallu*, *iškaru*) per the same policy used in the sumer book for *me*, *abzu*, and *kur*. Common-English exceptions to strict transliteration: *Babylon* (rather than *Bābili*, noted parenthetically on first mention), *Nineveh*, *Akkad* (rather than *Agade*), *Cutha* (Latinised). One recension-specific lock: *Ningirsu* used only in chapter 15 (the OB *Anzû*), *Ninurta* everywhere else — the recensional difference is the central interpretive issue of that chapter and demands separate naming. Validation: schema clean (every entry has native, renderings_considered, chosen, rationale, first_mention_gloss, never_use); no purple-prose words in glosses (initial check caught three — 'ancient' in the Eridu gloss, 'great' in Uruk, 'sacred' in Cutha — all rewritten to functional descriptions). Brief-entity coverage: the briefs collectively name 166 unique entities; the glossary locks the 41 that recur across two or more chapters. Story-specific named figures (Saggil-kīnam-ubbib for the Theodicy, Šubši-mešrê-Šakkan for Ludlul, Kabti-ilāni-Marduk for Erra, Kalbanum for Dialogue between a Man and his God, Gimil-Ninurta for the Poor Man of Nippur, Kummâ for the Underworld Vision, etc.) are deliberately handled at the chapter-claims stage rather than locked here, since they appear in only one chapter each."
notable_decisions:
  - decision: "Use diacritics throughout (Ištar not Ishtar, Ereškigal not Ereshkigal, Šamaš not Shamash, Aššur not Ashur, Sîn not Sin, Anzû not Anzu, Ḫumbaba not Humbaba, Atra-ḫasīs not Atrahasis, Uta-napišti not Utnapishtim, Narām-Sîn not Naram-Sin)."
    rationale: "Mandated by scope.md's 'Book register' section: 'Akkadian transliteration uses the Assyriological standard (š, ṣ, ṭ, macrons for vowel length, circumflex for contracted long vowels, ḫ for /x/).'"
  - decision: "Lock Akkadian forms with Sumerian forms in `never_use` (Ea blocks Enki, Ištar blocks Inanna, Anu blocks An, Sîn blocks Nanna and Nanna-Suen, Šamaš blocks Utu, Adad blocks Iškur, Damkina blocks Damgalnuna, Apsû blocks abzu, Anzû blocks Anzud, Ḫumbaba blocks Huwawa, Dumuzi blocks Dumuzid, Gilgameš blocks Bilgames, Uruk blocks Unug)."
    rationale: "These are not contamination per the document-provenance test — same entities exist in both traditions. They are vocabulary drift that would make chapters read as if multiple translators with different conventions had written them. Locking the Akkadian-form-with-Sumerian-blocked pattern is the inverse of the sumer book's policy."
  - decision: "Common English exceptions: Babylon, Nineveh, Akkad, Cutha — anglicised rather than transliterated."
    rationale: "These are universally English in scholarly prose; the Akkadian forms (Bābili, Ninua, Agade, Kutê) are noted on first mention. Forcing transliteration here would be needless friction for the reader."
  - decision: "*Tammuz* not used; *Dumuzi* (Akkadian form) is the locked rendering for Ištar's consort."
    rationale: "*Tammuz* is the later Aramaic-biblical reflex, importing first-millennium-CE rather than first-millennium-BCE usage. *Dumuzi* is the standard Akkadian form across periods."
  - decision: "*Mami* locked as the mother-goddess's primary name in *Atra-ḫasīs*, with *Bēlet-ilī* noted as an interchangeable epithet on first mention."
    rationale: "*Atra-ḫasīs* itself uses both names; *Mami* is the proper-noun form in the creation-of-humans episode."
  - decision: "Five terms reserved for italicised non-translation: *Apsû*, *akītu*, *narû* (genre), *apkallu*, *iškaru*."
    rationale: "Each carries cultural-conceptual freight no English single-word renders. The pattern matches how the sumer book handled *me*, *kur*, *abzu*, *me-lam*, and *edubba*."
  - decision: "Recension-specific name locking: *Ningirsu* in chapter 15 (OB *Anzû*) only, *Ninurta* everywhere else."
    rationale: "The OB/SB hero change Ningirsu→Ninurta is the central interpretive issue of the *Anzû* chapter and is foregrounded in its variants field; using a single locked name across recensions would erase the point."
  - decision: "Story-specific named figures (Saggil-kīnam-ubbib, Šubši-mešrê-Šakkan, Kabti-ilāni-Marduk, Kalbanum, Gimil-Ninurta, Kummâ, Iphur-Kiš, Amar-Girid, Aqqi the water-drawer, etc.) NOT locked here."
    rationale: "Skill rule: lock terms appearing in 2+ chapters. These appear in one chapter each. Their first-mention treatment is handled at chapter-claims with the brief's entities_glossary as the source."
flags_for_human_review:
