summary: |
  Chapter 8 (Uraš and Marduk) claims-factcheck round 2 — verdict
  REVISE. The round-2 claims document represents a substantial and
  largely successful correction of the round-1 errors. All eleven
  round-1 findings (4 HIGH, 4 MEDIUM, 3 LOW) are RESOLVED:

  - F-1 (Lambert 2013 page range pp. 308–325 wrong): RESOLVED at
    pp. 311–315 + p. 496 throughout. Verified via DeGruyter Brill.
  - F-2 (Damkina's Bond pp. 326–360 wrong): RESOLVED at pp. 321–325.
  - F-3 (multi-manuscript framing wrong): RESOLVED — single tablet
    UET 6, 398 from Ur consistently identified as the sole witness;
    LACUNA / RECONSTRUCTION / VARIANT markers all reframed around
    the single-witness premise; dating opened to OB / Kassite /
    late-Babylonian.
  - F-4 (female cosmogonic Uraš wrong): RESOLVED — the chapter's
    central conceptual hinge is correctly rewritten around the male
    Dilbat agricultural tutelary; the female cosmogonic Uraš is
    explicitly distinguished as a different deity.
  - F-5 through F-11: all RESOLVED as dependency-cascading from the
    four HIGH; the marker schemas, narrative content, and
    comparative-hooks are all correctly reframed under the corrected
    male-Urash reading.

  The surviving issues are three CITATION-ROUTING errors, all
  MEDIUM-or-LOW severity:

  MEDIUM-1 (F-R2-1): Foster 2005 page range pp. 436–440 (cited 3
  times for the 'Myths of Origins' sub-section) is wrong; correct
  range is pp. 487 ff. (Section 17 'Epic of Creation' begins at
  p. 436; Section 18 'Myths of Origins' begins at p. 487). Verified
  directly via the Foster 2005 TOC. This is a fresh round-2 error
  introduced by the round-2 rewrite.

  MEDIUM-2 (F-R2-2): The COMPARATIVE-HOOK at line 108 conflates 'the
  Marduk Ordeal and Marduk-Address texts' under SAA 3 nos. 34–35.
  Verified via the Livingstone 1989 SAA 3 TOC: nos. 34–35 are only
  the Marduk Ordeal (Assur and Nineveh versions); Marduk's Address
  to the Demons is Lambert AfO 17 (1954–56) and Geller 2016, not in
  SAA 3.

  LOW (F-R2-3): The Black & Green 1992 s.v. Urash citation for the
  'Marduk of planting' equation (cited 3 times) is unverified;
  Wikipedia traces this equation to Lambert 2013 pp. 264–265 (the
  Enūma Eliš VII fifty-names commentary).

  Per the verdict rules (REVISE = 1–2 HIGH or >3 MEDIUM or any
  silent bridge), the present case has 0 HIGH and 2 MEDIUM, which
  would normally give PASS. However, the 2 MEDIUM findings are
  systemic citation errors that appear in multiple locations each
  (F-R2-1 in 3 places; F-R2-2 in 2 places). I rate the present
  round-2 case as REVISE rather than PASS to require a localized
  round-3 citation-routing correction pass before chapter-draft.

  After the round-3 fixes, the claims document should PASS to
  chapter-draft. The substantive corrections from round 1 are all
  in place; the surviving issues are limited to citation routing
  and do not require structural rewriting. The round-2 rewrite is
  a substantial success on the central conceptual correction
  (male-Urash reading; agricultural-cosmogonic register;
  internal-Akkadian comparative hooks).
