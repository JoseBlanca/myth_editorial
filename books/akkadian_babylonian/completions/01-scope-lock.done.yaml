summary: "Scope locked for the Akkadian-Babylonian-Assyrian literary tradition treated as one Akkadian-language stream across Babylonia and Assyria, ca. 2300 BCE – 100 BCE. Hard contamination boundary: language of composition. Excludes Sumerian (covered in companion *The Myths of Sumer*), Hurro-Hittite (Kumarbi cycle, Illuyanka), Ugaritic (Baal cycle), Elamite, Aramaic, Biblical Hebrew, royal annals/chronicles (genre exclusion except *Tukulti-Ninurta Epic*), and omen/ritual/lexical/astronomical material (genre exclusion except cosmogonic incantation prologues with substantial embedded narrative). In-scope corpus organised into seven genre groups: (I) cosmogony — *Enūma Eliš*, *Atra-ḫasīs*, *Adapa*, the creation dossier (*Theogony of Dunnu*, *Slaying of Labbu*, *Enmešarra's Defeat*, etc.), and the cosmogonic narratives embedded in incantation prologues (*enūma Anum ibnû šamê*, the bilingual *Creation of the World by Marduk*, *The Worm and the Toothache* CT 17 50); (II) divine conflict and underworld — *Descent of Ishtar*, *Nergal and Ereškigal*, *Anzû*, *Erra and Išum*; (III) heroic epic — SB *Gilgameš*, *Etana*; (IV) royal legend — *Birth Legend of Sargon*, *King of Battle*, *Cuthaean Legend of Narām-Sîn*, *Tukulti-Ninurta Epic*; (V) wisdom — V.A reflective dialogue (*Ludlul*, *Babylonian Theodicy*, *Dialogue of Pessimism*) and V.B practical instruction (*Counsels of Wisdom*, *Counsels of a Pessimist*, *Šimâ milka*); (VI) disputations and animal fables (*Tamarisk and Date Palm*, *Ox and Horse*, *Nisaba and Wheat*, *Fable of the Willow*, *Series of the Fox*, *Poor Man and the Donkey*); (VII) visionary and popular (*Underworld Vision*, *Poor Man of Nippur*). A dedicated influences chapter is reserved for the cultural streams that shaped Akkadian literature: the Sumerian substrate; Hurro-Hittite contact and Indo-European mediation (Mitanni IE-named deities, Boğazköy lingua franca); and Amorite/Kassite/Aramaean integration. Reconstruction policy: in-Akkadian only — Sumerian originals, Hurro-Hittite cycles, and Ugaritic parallels are comparative material, never silent fills. Source registry seeded with the standard critical editions (Lambert 2013 for creation; Lambert & Millard 1969 for *Atra-ḫasīs*; George 2003 for *Gilgameš*; Westenholz 1997 for royal legends; Annus 2001 / Vogelzang 1988 for *Anzû*; Cagni 1969 for *Erra*; Izre'el 2001 for *Adapa*; Lambert 1960 for the wisdom/disputation/fable corpus; Oshima 2014 for *Ludlul* and the *Theodicy*; Cohen 2013 for *Šimâ milka*; Kienast 2003 for the *Series of the Fox*; Machinist 1978 for *Tukulti-Ninurta*) plus Foster 2005 and Dalley 2008 as the scholar-grade translation anthologies, CAD/AHw/RlA as lexical-encyclopedic references, and ORACC/CDLI as the online corpora. Comparative sources for the influences chapter (Hoffner 1998 for Hittite myths, Black et al. 2004 + ETCSL for Sumerian, Smith 1994 for Ugaritic) are registered with `in_scope: false` so they appear in citations but cannot leak into primary retellings. The scope-lock and story-inventory skills (skills/01-scope-lock.md and skills/02-story-inventory.md) were also revised in this stage to add a 'genre breadth' principle that explicitly mandates the inclusion of disputations, animal fables, practical instruction literature, etiological narratives in incantation prologues, narrative hymns, and folktales — to prevent future books from collapsing the corpus to 'myth and heroic epic' by default."
