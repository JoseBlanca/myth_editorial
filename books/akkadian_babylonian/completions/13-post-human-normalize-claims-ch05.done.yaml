summary: "Post-factcheck normalization of chapter 5 claims after a REVISE verdict (2 HIGH, 4 MEDIUM, 1 LOW). All seven findings accepted and applied. The two HIGH findings are the most consequential. F-1 (HIGH UNVERIFIED): the original chapter (and the brief itself) said the hero's name was 'lost in the lacuna' and the Tišpak identification was conjectural. This is wrong: the surviving Neo-Assyrian text preserves the dispatch line 'Go, Tišpak, k[ill] Labbu! Save the broad land!' Tišpak is named in the surviving text. The chapter has been rewritten to report the dispatch line transparently and to relocate the conjectural element to its actual target — Wiggermann's cult-aetiological reading (that the myth justified Tišpak's installation as Ešnunna's tutelary god), which Lambert 2013 disputes. The INFERENCE marker at claim 11 is rewritten with this proper target. F-2 (HIGH CONTAMINATION): 'multiple heads in some readings' for Labbu was contamination from the Ugaritic seven-headed Lôtan; struck. The 'covered in scales' element was also unattested in the verifiable secondary sources; struck. Replaced with the actually-preserved description: fifty leagues long, one league wide, with a single composite head (lion or serpent), the horns of a horned viper, the front legs of a lion and the hind legs of a bird of prey. F-3 (MEDIUM): the existence of the Old Babylonian recension (in which Nergal is reportedly the hero) acknowledged in source-overview and in the VARIANT marker; the OB fragment is too broken to fill NA lacunae but its existence enriches the recensional history and weakens any single-deity cult-aetiology argument. F-4 (MEDIUM): storm and arrow added as preserved combat elements; Tišpak fires an arrow against Labbu with a storm rising. F-5 (MEDIUM): a creation/design scene added as a new claim before the divine council — Sea bears Labbu and Enlil in heaven designs his shape. This is load-bearing; it makes the Labbu narrative a creation poem, not just a combat poem, and structurally parallels the Atra-ḫasīs create-then-destroy arc. F-6 (MEDIUM MARKER-MISUSED): the INFERENCE marker rewritten per F-1's target relocation. F-7 (LOW): Foster 2005 page reference 581-582 retained as locked in sources.yaml; deferred for direct verification. The LACUNA marker is updated to specify which parts are lost (kill scene, post-combat outcome, strategy-advice scene with broken speaker) rather than the hero's name. Validation: schema clean, 22 footnotes (was 18), 30 EVIDENCE tokens (was 23), all source IDs resolve to sources.yaml, all markers at column 0, all 10 correction spot-checks PASS."
