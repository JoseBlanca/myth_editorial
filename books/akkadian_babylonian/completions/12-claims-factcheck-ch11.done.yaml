summary: |
  Chapter 11 (The Worm and the Toothache) claims-factcheck —
  verdict REVISE (1 HIGH, 2 MEDIUM, 2 LOW, 3 NOTES).

  The claims document represents a substantive and largely
  well-supported reading of the composition. The worm-Šamaš-Ea
  dialogue, the fig-and-apricot offer, the worm's defiance, Ea's
  third-person curse, the late-period manuscript dating with
  possibly earlier composition, the OB variant cosmogonic chain
  (YOS 11, 5a), and the tooth-worm theory's transmission to
  European medicine through Pierre Fauchard's 1728 refutation
  are all directly or cross-translation corroborated. CT 17 50 =
  R. Campbell Thompson 1903 is verified.

  Three substantive issues require revision:

  HIGH (F-1): The Hurro-Hittite COMPARATIVE-HOOK at line 119
  (and the brief at line 2136) attribute 'A Hurrian Ritual
  Against Toothache: A Reanalysis of Mari 5', *RA* 112 (2018),
  31–50, to **Cohen and Wasserman**. Per direct verification at
  shs.cairn.info, the actual authors are **Dennis R.M. Campbell
  and Sebastian Fischer**; page range is **31–47** (not 31–50).
  The genuine Cohen-Wasserman publication on OB worm/leech
  incantations is **Cohen and Wasserman 2008**, *RA* 102, 71–88,
  'On Leeches, Dogs, and Gods in Old Babylonian Medical
  Incantations' — a different article on a different tablet.
  The 2018 Mari 5 article must be re-attributed to Campbell
  and Fischer.

  MEDIUM (F-2): The seven-step cosmogonic chain (Anu → heavens
  → earth → rivers → canals → marshes → mud → worm) at claim 7
  is not directly attested in any accessible English
  translation. The Speiser ANET 1969 version has 5 steps
  (rivers → marsh → worm); the Foster / ETANA-reproduction
  version has 6 steps (rivers → ditches → mud → worm, NO
  marsh). Recommend committing to Foster's 6-step chain (the
  brief's locked anchor) and revising the parenthetical caveat
  and the 'seventh and final term' framing in claim 8 and the
  INFERENCE marker at line 57.

  MEDIUM (F-3): The YOS 11 5 OB variant attribution should be
  revised: publication is **van Dijk, Goetze, and Hussey 1985**
  (not 'Hussey-van Dijk'); siglum is **YOS 11, 5a** (the 'a'
  portion of YBC 4616); genre difference (OB
  anti-leech-against-infant vs. first-millennium anti-toothache)
  should be made explicit.

  Plus 2 LOW findings (F-4 Aššur duplicate under-verified;
  F-5 worm's defiance verbatim wording variant) and 3 NOTES
  (N-1 Cohen-Wasserman 2008 *RA* 102 as the genuine
  Cohen-Wasserman reference; N-2 Lambert 2013 pp. 399–402
  conservative handling; N-3 Foster 2005 pp. 995–996
  page-reference taken on trust).

  All 5 COMPARATIVE-HOOK markers are appropriately scoped per
  scope.md (one needs the F-1 fix). 2 INFERENCE markers PASS.
  1 LACUNA marker PASS-WITH-CAVEAT (per F-4). 1 RECONSTRUCTION
  marker PASS. 1 VARIANT marker REVISE (per F-3). Contamination
  scan returns clean. No silent bridges.

  Per the verdict rules (REVISE = 1–2 HIGH or >3 MEDIUM or any
  silent bridge), with 1 HIGH, 2 MEDIUM, 2 LOW, and 0 silent
  bridges, the verdict is REVISE. After REVISE corrections
  (F-1 Cohen-Wasserman → Campbell-Fischer; F-2 chain step-count;
  F-3 YOS 11 5 attribution and siglum), the chapter is ready
  to proceed to chapter-draft.
