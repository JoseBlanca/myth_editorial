findings_summary:
  - finding_id: F-1
    severity: HIGH
    kind: CITATION-WRONG
    description: "The Cohen-Wasserman 2018 *RA* 112 attribution for 'A Hurrian Ritual Against Toothache: A Reanalysis of Mari 5' (claims doc line 119, brief line 2136) is WRONG. Per direct verification at shs.cairn.info/revue-d-assyriologie-2018-1-page-31, the actual authors are **Dennis R.M. Campbell and Sebastian Fischer**, page range **31–47** (not 31–50). The genuine Cohen-Wasserman publication on OB worm/leech incantations (including YOS 11, 5) is Cohen and Wasserman 2008, *RA* 102, 71–88, 'On Leeches, Dogs, and Gods in Old Babylonian Medical Incantations' — a different article on a different tablet. REQUIRED: re-attribute to Campbell-Fischer 2018 in line 119 and brief line 2136."
  - finding_id: F-2
    severity: MEDIUM
    kind: INTERNAL-VARIANCE
    description: "The seven-step cosmogonic chain (Anu → heavens → earth → rivers → canals → marshes → mud → worm) at claim 7 (line 49) and claim 8 (line 53) is not directly attested in any accessible English translation. Speiser ANET 1969 (verified verbatim via mesopotamiangods.com) has 5 steps: Anu → heaven → earth → rivers → marsh → worm (NO canals, NO mud). The ETANA / Foster-reproduction snippet has 6 steps: Anum → heavens → earth → rivers → irrigation ditches → mud → maggot (NO marsh). The claims doc's seven-step chain appears to be an editorial conflation of multiple translations, with **canals + marshes + mud as three separate intermediates** unattested in any single source. REQUIRED: commit to Foster's 6-step chain (rivers → ditches → mud → worm) or to Speiser's 5-step chain (rivers → marsh → worm); revise the 'seventh and final term' framing in claim 8 and the INFERENCE marker at line 57 accordingly."
  - finding_id: F-3
    severity: MEDIUM
    kind: CITATION-WRONG
    description: "The YOS 11 5 OB variant publication attribution 'Hussey-van Dijk' (VARIANT marker line 97; footnote 17 line 99) is non-standard. Standard citation is **van Dijk, Goetze, and Hussey 1985** *Early Mesopotamian Incantations and Rituals* (Yale Oriental Series 11). The siglum is more precisely **YOS 11, 5a** (the 'a' portion of YBC 4616). The OB text is a worm/leech-against-infant incantation invoking Gula, NOT a toothache incantation per se. REQUIRED: correct the publication attribution; specify the siglum as YOS 11, 5a; clarify the genre-difference (OB anti-leech-against-infant vs. first-millennium anti-toothache)."
  - finding_id: F-4
    severity: LOW
    kind: UNDERVERIFIED
    description: "The Aššur duplicate(s) claim (claims 1, 4, 13; LACUNA marker line 33) is plausible-on-its-face given the wider Mesopotamian medical-magical corpus's standard Nineveh-Aššur dual-witness pattern (BAM series at Aššur, K-collection at Nineveh) but is not directly verified in open sources. The Nineveh K.2413 + parallel K-collection witnesses are well-attested. The Aššur duplicate is sourced through Foster 2005 pp. 995–996 (which I could not directly open). Optional: add a hedge 'duplicates are also known from Aššur (per Foster 2005's apparatus)' or defer to post-human-normalize."
  - finding_id: F-5
    severity: LOW
    kind: INTERNAL-VARIANCE
    description: "The worm's defiance verbatim quote at claim 11 (line 70) — 'Lift me up, and let me dwell between the teeth and the gums! I will suck the blood of the tooth, and I will gnaw on the bone of the jaw!' — varies from the canonical Speiser ANET 1969 wording 'Lift me up, and assign me to the teeth and the gums! I will suck the blood of the tooth, and I will gnaw its roots!' The variance is at the level of translation choice (Foster vs. Speiser), not factual error. The claims doc's wording is plausibly Foster's; verify at post-human-normalize."
notes:
  - note_id: N-1
    detail: "**Cohen and Wasserman 2008**, 'On Leeches, Dogs, and Gods in Old Babylonian Medical Incantations', *Revue d'Assyriologie* 102 (2008), 71–88, IS by Cohen and Wasserman and IS the standard modern philological reference for OB worm/leech incantations including YOS 11, 5a. This 2008 article is the genuine Cohen-Wasserman publication that has been confused with the 2018 Campbell-Fischer Mari 5 reanalysis. Recommend (optionally) adding Cohen and Wasserman 2008 *RA* 102 as a named-but-flagged comparative reference for the OB variant."
  - note_id: N-2
    detail: "Lambert 2013 pp. 399–402 ('Mythological Introductions on Creation' section) was directly verified at the section-heading level via the Lambert 2013 TOC PDF (in the chapter 10 factcheck — the TOC verbatim has 'Mythological Introductions on Creation 399'). Whether *The Worm and the Toothache* specifically is among the compositions Lambert collects in that section remains unverified at the open-source level (the PDF could not be rendered in this factcheck environment). The claims doc's conservative 'may include the composition... but unverified' framing is honest. Recommend direct verification at post-human-normalize."
  - note_id: N-3
    detail: "Foster 2005 pp. 995–996 page reference is taken on trust from the brief; could not be directly verified. The substantive content (cosmogonic chain, worm-Šamaš-Ea dialogue, fig-and-apricot offer, worm's defiance, Ea's curse) is corroborated via Speiser ANET 1969 (mesopotamiangods.com) and the ETANA-reproduction snippet. The page number is genre-consistent with Foster's 'Magic and Healing' / incantation section in the high-900s. No contradicting evidence."
