audit_a8_resolution_check: |
  Audit finding A8 (severity MEDIUM, kind SILENT-CONFLATION; the
  page-range discrepancy and possible First Brick / Founding of
  Eridu conflation in inventory-audit.yaml) is FULLY RESOLVED at
  the bibliographic level. The brief's preemptive correction (from
  the inventory's pp. 384–386 → pp. 376–383) is independently
  corroborated by THREE open sources: (i) the DeGruyter Brill
  chapter landing for "The First Brick"
  (doi:10.1515/9781575068619-028); (ii) the DeGruyter Brill volume
  table of contents which lists *Another Dragon-Slaying Episode*
  at p. 384 (the composition that occupies the original-but-wrong
  pp. 384–386 range); (iii) Streck 2014 BSOAS review which
  confirms *The First Brick* is in Lambert 2013 Part III with
  cuneiform publication WVDOG 4 plate 12. The two compositions
  *The First Brick* and *The Founding of Eridu* are confirmed as
  distinct compositions in adjacent sections of Lambert 2013 (with
  *Eridu* at chapter 32 / pp. 366–375 per the chapter 10 brief
  revision; *First Brick* at chapter 33 / pp. 376–383). The
  audit-A8 bibliographic concern is closed.
high_findings_summary: |
  F-1 (CONTAMINATION, HIGH): The chapter's central organising claim
  — "Marduk appears in the composition as the divine architect of
  the first brick" (section §"Marduk as divine architect") — is
  contradicted by three independent Wikipedia articles (s.v. Enki,
  Kusu, Ningishzida), all citing Lambert 2013 pp. 376–381.
  Lambert 2013 ch. 33's composition is **Ea-centred**: Ea creates
  the Abzû and then fashions from clay seventeen further deities
  (Kulla, Ninildu, Ninsimug, Ninagal, Arazu, Guškinbanda,
  Ninzadim, Ninkurra, Ašnan, Laḫar, Siris, Ningišzida, Ninšar,
  Adag, Umunmutamgu, Umunmutamnag, Kusu) plus a king and mankind,
  who together perform temple-renovation work. **Marduk is not
  named in any of the three Wikipedia summaries.** The brief's
  entities_glossary (which locks "Marduk: divine architect" at
  high confidence) is the upstream source of the contamination
  and must be revised at brief level.

  F-2 (CITATION-WRONG, HIGH): The chapter's repeated assertion of
  "a single late-Babylonian manuscript" with "no parallel
  manuscripts" is wrong. The composition is preserved on
  **multiple Late Babylonian tablets** (Streck 2014: "WVDOG 4
  plate 12, etc.") **plus a late Assyrian fragment** (Wikipedia
  s.v. Enki, citing Lambert 2013 p. 376). The LACUNA,
  RECONSTRUCTION, and VARIANT markers all inherit this wrong
  manuscript-count premise.

  F-3 (CITATION-WRONG, HIGH): The chapter's ritual-context framing
  as new-temple foundation is wrong; Lambert 2013 ch. 33 is a
  building incantation for **temple renovation** (recovering and
  recycling the libittu maḫrītu of the existing temple), per all
  three independent Wikipedia summaries and per Novotny's essay
  on the libittu maḫrītu rite.
medium_findings_summary: |
  F-4 (UNVERIFIED, MEDIUM): The *ušumgallu* attribute's appearance
  in *The First Brick* is not corroborated by any accessible
  independent source. The wider Marduk-centred reading that
  motivates the *ušumgallu* discussion is itself contradicted
  (F-1).

  F-5 (INFERENCE-OVER-EXTENDS, MEDIUM): The architectural-cosmogony
  sub-corpus framing (pairing *First Brick* with *Toil of Babylon*
  and *Founding of Eridu*) is more strained than the INFERENCE
  marker allows: the three compositions differ in principal divine
  actor (*First Brick* is Ea-centred, the other two are
  Marduk-centred).
low_findings_summary: |
  F-6 (PRECISION, LOW): The technical foundation/renovation-ritual
  lemma is *libittu maḫrītu* (not bare *libittu*); the chapter's
  CAD-L gloss is under-specified.

  F-7 (CITATION-PRECISION, LOW): WVDOG 4 plate 12 should be
  named-but-flagged as the principal cuneiform witness; not
  required, but improves manuscript transparency.
recommended_downstream_action: |
  BLOCK at stage 13 post-human-normalize. Escalate to human
