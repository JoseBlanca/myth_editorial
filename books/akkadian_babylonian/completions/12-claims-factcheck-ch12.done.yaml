summary: |
  Chapter 12 (The First Brick) round-1 factcheck: VERDICT BLOCK.
  The bibliographic anchor (Lambert 2013 ch. 33 / pp. 376–383 /
  *The First Brick*) is correct and the audit-A8 resolution is
  fully corroborated. However, three HIGH-severity structural
  findings BLOCK the chapter: F-1 (CONTAMINATION) — the chapter's
  central organising claim that Marduk is the divine architect of
  the first brick is contradicted by three independent Wikipedia
  articles citing specific Lambert 2013 pages; the composition is
  Ea-centred, with Ea creating seventeen craft-pantheon deities
  (Kulla and others) from clay to perform temple renovation; F-2
  (CITATION-WRONG) — the "single late-Babylonian manuscript"
  framing is wrong, the composition has multiple Late Babylonian
  witnesses plus a late Assyrian fragment; F-3 (CITATION-WRONG) —
  the new-temple-foundation ritual context is wrong, Lambert 2013
  ch. 33 is a temple-renovation incantation. Plus 2 MEDIUM
  findings (*ušumgallu* in foundation register unverified;
  architectural-cosmogony sub-corpus framing over-extends), 2 LOW
  findings (libittu maḫrītu precision; WVDOG 4 plate 12 citation
  precision), and 3 NOTES. The structural problem is upstream of
  the writer: the brief's entities_glossary locks Marduk as
  "divine architect" at high confidence, and the writer correctly
  executed the brief but the brief itself is wrong about the
  composition's principal divine actor. The writer's
  caution_on_specific_attestations field in the completion record
  explicitly asked round-1 factcheck to verify this claim,
  anticipating exactly this finding. Recommended action: BLOCK at
  stage 13; escalate to human reviewer for brief-level
  reauthorisation; run a fresh stage-11 rewrite once the brief is
  corrected.
