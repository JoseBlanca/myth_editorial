summary: |
  Post-factcheck normalization of chapter 8 claims after factcheck-round-2 returned REVISE (0 HIGH, 2 MEDIUM, 1 LOW + 2 NOTES). All three findings ACCEPTED and applied as localized citation-routing edits — the round-2 claims rewrite had already absorbed every round-1 finding (page range pp. 308–325 → 311–315 + 496 notes; Damkina's Bond pp. 326–360 → 321–325; multi-manuscript framing → single tablet UET 6, 398 from Ur per Streck 2014; female cosmogonic Uraš → male Dilbat agricultural tutelary; Greek Gaia–Ouranos and Hurro-Hittite Lelwani comparative hooks dropped). The post-human-normalize pass made these citation-routing fixes:

  - F-R2-1 (MEDIUM, CITATION-WRONG): Foster 2005's "Myths of Origins" sub-section page range corrected from "pp. 436–440" to "pp. 487 ff. (Marduk, Creator of the World p. 487; Myth of the Plow p. 489; Creation of Humankind p. 491; Providing for the Gods; Creation of Sun and Moon; Creation of the King)" — pp. 436 is the start of the Enūma Eliš section, NOT the cosmogonic sub-section. Three places updated: claim 9 footnote and EVIDENCE token; INFERENCE-marker basis after claim 9; second COMPARATIVE-HOOK at line 109. The substantive grouping argument stands; only the page range required revision. The phrase "cosmogonic incantation prologues" (which was imprecise — Foster 2005's Myths-of-Origins sub-section is mixed and not exclusively prologue-material) was loosened to "small Marduk-creation compositions" in the COMPARATIVE-HOOK and to "the broader Marduk-creation pattern" in the body footnote.

  - F-R2-2 (MEDIUM, CITATION-WRONG): The first COMPARATIVE-HOOK (line 108) and the claim-5 footnote previously conflated the *Marduk Ordeal* (Livingstone 1989, SAA 3 nos. 34–35 = the Assur and Nineveh Versions) with the *Marduk's Address to the Demons* (Lambert AfO 17, 1954–56; re-edited Geller 2016 as Udug-hul Tablet 11) — the Marduk Address is NOT in SAA 3. The conflation has been resolved by: (i) splitting the COMPARATIVE-HOOK so that only the *Marduk Ordeal* is cited via Livingstone 1989 SAA 3 nos. 34–35, while *Marduk's Address to the Demons* is named with its correct publication anchors (Lambert AfO 17 1954–56; Geller 2016 De Gruyter Udug-hul Tablet 11) and an explicit note that neither Lambert AfO 17 nor Geller 2016 is currently in sources.yaml — i.e., the named-but-flagged pattern; (ii) tightening claim 5's footnote to "Livingstone 1989 (Court Poetry and Literary Miscellanea, SAA 3 nos. 34–35, the Assur and Nineveh Versions of the Marduk Ordeal)" — dropping the ambiguous "Marduk-name-list compositions" phrase. Both changes preserve the substantive argument while correcting the citation routing.

  - F-R2-3 (LOW, UNVERIFIED): The "Marduk of planting" equation citation. Black & Green 1992, s.v. Urash retained as one anchor (genre-appropriate; their dictionary covers the male Dilbat tutelary). Lambert 2013, pp. 264–265 added as a parallel anchor — the *Enūma Eliš* Tablet VII fifty-names commentary where the equation is articulated, per Wikipedia's tracing of the citation chain. Both citations now appear in the three affected places: claim 6 footnote, INFERENCE-marker basis after claim 6, and claim 11 footnote. The substantive equation is independently corroborated by HandWiki and Wikipedia; the Lambert 2013 pp. 264–265 attribution gives the better anchor for the equation's articulation.

  Additional housekeeping changes: section anchor updated from `[[ch-08-uras-and-marduk-claims]]` to `[[ch-08-uras-and-marduk-claims-approved]]` (matching the chapter-7 approved-version convention); chapter title updated to "Uraš and Marduk — Claims (post-factcheck approved)"; meta-header comment block expanded to include the round-2 fix log (F-R2-1 / F-R2-2 / F-R2-3 dispositions inline). No changes to the substantive narrative content of the claims; all 14 claim paragraphs, 3 INFERENCE markers, 1 LACUNA marker, 1 RECONSTRUCTION marker, 1 VARIANT marker, and 3 COMPARATIVE-HOOK comments are preserved with the citation-routing fixes applied.

