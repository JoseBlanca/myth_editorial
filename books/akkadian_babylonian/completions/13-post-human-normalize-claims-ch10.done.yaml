        The brief's header note states "Lambert 2013's 'Notes on the Other Texts' for the 'Founding of Eridu' chapter is at p. ~497–498". Per the factcheck's direct verification of the Lambert 2013 TOC PDF, the correct location is p. 512 (alongside "The Slaying of Labbu 512" and "Another Dragon-Slaying Episode 513"). Pages 497–498 contain the Notes for *Damkina's Bond*, *The Defeat of Enutila, Enmesarra, and Qingu*, and *Enki and Ninmaḫ*. The misattribution does NOT propagate to the claims document (the claims cite only the principal pp. 366–375 range and do not reference the Notes pages). Flagged for brief-pass cleanup at inventory-audit; the brief's header note can be corrected at that point.
    - id: "N-2"
      kind: "NOTE — King 1902 / King 1901 sources.yaml addition recommendation"
      action: "FORWARDED to inventory-audit"
      applied: |
        Both King 1902 *The Seven Tablets of Creation* II (London: Luzac) and King 1901 *Cuneiform Texts from Babylonian Tablets in the British Museum*, Part XIII (London: British Museum) are recommended for sources.yaml addition. Both are foundational publications of BM 93014. King 1902 in particular is the standard secondary-literature reference for older bilingual-text scholarship on this composition. Currently named-but-flagged in the source-overview footnote.

