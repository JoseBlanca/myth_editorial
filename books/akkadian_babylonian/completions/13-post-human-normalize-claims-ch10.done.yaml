summary: |
  Post-factcheck normalization of chapter 10 claims after factcheck-round-1 returned PASS (0 HIGH, 0 MEDIUM, 1 LOW + 2 NOTES). The single LOW finding (F-1) is a wording tightening on the King 1901 / 1902 publication history; ACCEPTED and applied. The two NOTES (N-1 brief-internal misattribution about the Notes-on-Other-Texts page; N-2 King 1902 sources.yaml addition recommendation) are forwarded to inventory-audit; the N-1 misattribution does not propagate to the claims document and is flagged for brief-pass cleanup. The brief's preemptive corrections (page range pp. 376-383 → pp. 366-375; incipit corrected from enūma Anum ibnû šamê to the negative-cosmogonic 'holy house had not yet been made'; manuscript identified as BM 93014) all survived the factcheck unchanged.

  - F-1 (LOW, CITATION-WRONG): Footnote 1's attribution to King's *Seven Tablets of Creation* II (1902) tightened. Per the factcheck's verbatim verification of Three Things and Budge 1921, the cuneiform-only edition of BM 93014 was published by King in 1901 in *Cuneiform Texts from Babylonian Tablets in the British Museum*, Part XIII, pp. 35–38; the translation, transliteration, and commentary appeared in King's *The Seven Tablets of Creation*, vol. II (London: Luzac, 1902). The footnote at line 20 is updated from "L. W. King's *The Seven Tablets of Creation* II (1902)" to "L. W. King first published the cuneiform-only edition in *Cuneiform Texts from Babylonian Tablets in the British Museum*, Part XIII (1901), pp. 35–38; King's *The Seven Tablets of Creation*, vol. II (London: Luzac, 1902) added the English translation, transliteration, and commentary that became the standard reference until Lambert 2013." This wording tightening preserves the substantive King attribution while making the publication-history precise.

  Additional housekeeping: section anchor updated from `[[ch-10-founding-of-eridu-claims]]` to `[[ch-10-founding-of-eridu-claims-approved]]` (matching chapter-7/8/9 approved-version convention); chapter title updated to "The Founding of Eridu — Claims (post-factcheck approved)"; meta-header comment block expanded with the round-1 fix log (F-1 disposition + N-1 / N-2 notes inline). No changes to the substantive narrative content; all 14 claim paragraphs, 3 INFERENCE markers, 1 LACUNA marker, 1 RECONSTRUCTION marker, 1 VARIANT marker, and 4 COMPARATIVE-HOOK comments preserved.

