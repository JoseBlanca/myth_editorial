summary: "Post-factcheck normalization of chapter 3 claims after a MAJOR-REVISE verdict. The systemic problem was a fragment-letter scheme inversion: the original claims had Amarna = Fragment A and Nineveh = Fragments B/C/D (with K.8743 leading), but Izre'el 2001's actual scheme is Amarna = Fragment B (VAT 348 = EA 356) and Nineveh = Fragments A, A1, C, D, E (with MLC 1296 the principal Fragment A, K.15072 = A1, K.8743 = C). All four HIGH findings (F-1, F-2, F-3, F-4), all five MEDIUM findings (F-5, F-6, F-7, F-8, F-9, F-13), and all four LOW findings (F-10, F-11, F-12) applied. The chapter has been substantially rewritten across the source-overview, Amarna-recension, and Nineveh-recension sections to reflect the correct fragment scheme and to restore content the original claims missed. F-1/F-2/F-3 (HIGH systemic): every Fragment A reference to the Amarna copy renamed to Fragment B; the Nineveh fragments correctly enumerated as A, A1, C, D, E with their British Museum / Pierpont Morgan Library catalogue numbers; the south-wind episode and Ea's instructions correctly attributed to Fragment B (Amarna), not the Nineveh corpus. F-4 (HIGH FABRICATION): the 'sevenfold breaking of the south wind's wing' was an unattested back-formation from the seven-day duration of the wind's cessation; replaced with the singular event reading attested in all translations ('her wing is broken'). F-5: 'in parallel' framing softened to 'separately, with synoptic alignment where the Amarna and Nineveh witnesses parallel one another'. F-6 / F-12: the Adamu name variant was unverified in the standard scholarship; dropped from the variant list, leaving Adapa (standard) and U-an / U-anna (apkallu genealogy, where the first sage is named 'U-an Adapa'). F-7 / F-9: fragment-letter A→B propagated through Ea-instruction and gate-scene EVIDENCE locs. F-8: 'mourning their own absence from the world below' (which inverted the direction of the gatekeepers' seasonal absence) corrected to 'mourning their own seasonal absence from the land of the living'; the chapter now also says 'mourning their own exile from the world above' to align with the standard reading that Tammuz and Gizzida have descended to the underworld and are absent from the world they normally inhabit. F-10: Ea's instructions reframed as primarily negative warnings about what Adapa must refuse (bread and water); the oil and clothing acceptance follows by default rather than by explicit positive instruction. F-11: a paragraph added on Fragment D's alternate ending ('Anu set a decree to make glorious his lordship forever' — Adapa retained in heaven by Anu); the first VARIANT marker amended to record both endings as co-equal recensional variants. F-13 (MARKER-MISUSED): the RECONSTRUCTION marker, which had been routed through the wrong fragments to reconstruct a non-event (the sevenfold breaking), was relocated and reframed: it now properly attaches to Fragment A's cosmological/wisdom prologue, with gap_source = Fragment A (MLC 1296) damaged sections and fill_source = Fragment A1 (K.15072) which parallels the last extant section of Fragment A. The brief-alignment NOTE-1 is now resolved by the F-11 fix. NOTE-2 (Tammuz vs Dumuzi glossary): retained Tammuz body-form per the brief's entities_glossary (which lists 'Tammuz (Dumuzi)') and per the standard English translations of Adapa (Foster, Dalley both use Tammuz for the heaven-gate scene); flagged as a soft inconsistency with the locked Dumuzi for a possible glossary editorial decision. Validation: schema clean, 44 footnotes (was 41; gained from F-11 Fragment D paragraph and F-10 oil/clothing reframing), 61 EVIDENCE tokens (was 54), all source IDs resolve to sources.yaml, all markers at column 0, all four corrected-fact spot-checks PASS (Fragment B = Amarna; no sevenfold breaking; no Adamu; Fragment D alternate ending present; world-below phrasing replaced)."
