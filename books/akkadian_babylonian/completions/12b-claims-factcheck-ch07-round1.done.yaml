  The HIGH content-model finding rests on the eatthefruit.com transcription, which quotes
  Lambert/Boscawen/Smith but is not itself peer-reviewed. The independent verifications
  performed in the main conversation reproduced the same content reading from the same source.
  A human checker with print access to Lambert 2013 pp. 301–310 should spot-check the rewritten
