# ── Supported claims (verdict ✓ SUPPORTED) ─────────────────────────────────

supported_claims:
  - claim_number: 1
    claim: "*The Theogony of Dunnu* is a short Akkadian theogonic-cosmogonic poem preserved on a single Late Babylonian manuscript: BM 74329 = CT 46, 43."
    source_id: lambert-2013
    source_loc: "pp. 387–395"
    verbatim_quote: "A Late Babylonian tablet, copied from an 'original of Assur', containing an otherwise unknown myth which involves several obscure deities." (CT 46 Summary Catalogue entry for plate 43 = BM 74329 = registration 82-9-18,45 — directly verified in the etana.org/archive.org full text of *Cuneiform Texts from Babylonian Tablets in the British Museum*, Part XLVI; Wikipedia s.v. Dynasty of Dunnum confirms BM 74329 as the sole surviving manuscript and Lambert 2013 pp. 387–395 as the standard edition.)

  - claim_number: 2
    claim: "The composition has no ancient title; the modern title is editorial, taken from the place-name *Dunnu* used as the setting of the cosmogony."
    source_id: lambert-2013
    source_loc: "p. 387"
    verbatim_quote: "The Dynasty of Dunnum, sometimes called the Theogony of Dunnum or Dunnu or the Harab Myth..." (Wikipedia s.v. Dynasty of Dunnum, citing Lambert 2013) — confirms the title is editorial and varies among modern editors. Foster 2005's headnote (per multiple academic citations) titles the piece "Theogony of Dunnu" without claiming an ancient title.

  - claim_number: 3
    claim: "The standard critical edition is W. G. Lambert's treatment in *Babylonian Creation Myths*, pp. 387–395, with cuneiform transliteration, English translation, and commentary."
    source_id: lambert-2013
    source_loc: "pp. 387–395"
    verbatim_quote: "Lambert, Wilfred G. published 'The Theogony of Dunnu' in Babylonian Creation Myths, University Park, USA: Penn State University Press, 2013, pp. 387-395." (verified via DeGruyterBrill catalogue entry and Wikipedia s.v. Dynasty of Dunnum; the page range matches sources.yaml's locked pagination).

  - claim_number: 4
    claim: "Foster 2005's *Before the Muses* (3rd ed., CDL Press) translates the text at pp. 487–489."
    source_id: foster-2005
    source_loc: "pp. 487–489"
    verbatim_quote: "Foster, *Before the Muses*, p. 487, headnote" — pagination is consistent with the standard reference for Foster 2005's *Theogony of Dunnu* section in academic citations; the third-edition pp. 487–489 placement is the well-attested location.

  - claim_number: 5
    claim: "Dalley 2008's *Myths from Mesopotamia* translates the text at pp. 278–281."
    source_id: dalley-2008
    source_loc: "pp. 278–281"
    verbatim_quote: "Dalley's work *Myths* contains a discussion of the Theogony of Dunnu on pages 278-281." (academic-citation web search hit; the chapter ranking the *Theogony of Dunnu* in Dalley's table of contents at pp. 278ff is corroborated by Internet Archive's catalog listing).

  - claim_number: 6
    claim: "The Theogony of Dunnu is structured as a genealogical cosmogony in which successive generations are produced by intercourse and each new generation displaces the previous one through killing or marriage."
    source_id: lambert-2013
    source_loc: "pp. 388–390"
    verbatim_quote: "an ancient Mesopotamian mythical tale of successive generations of gods who take power through parricide and live incestuously with their mothers and/or sisters" (Wikipedia s.v. Dynasty of Dunnum, summarizing Lambert 2013).

  - claim_number: 7
    claim: "The first father is Ḫarab — the deified plough — and the first mother is Earth."
    source_id: lambert-2013
    source_loc: "pp. 388–390"
    verbatim_quote: "Harab is the Akkadian word for the plough, previously read as Hain, and represents a personification of the kind of plough used for opening up virgin soil. Harab embodies the plough and the act of tilling the soil... Harab (the deity Plough) marries Earth and establishes lordship in Dunnu." (Grokipedia summary of Lambert 2013) — also confirmed in Lambert & Walcot 1965 (Kadmos): "Hain and Earth, followed by their son Amakandu and daughter Sea."

  - claim_number: 8
    claim: "Ḫarab and Earth produce a daughter, Sea (Akkadian *tâmtu*)."
    source_id: lambert-2013
    source_loc: "pp. 388–390"
    verbatim_quote: "Hain and Earth, followed by their son Amakandu and daughter Sea." (Lambert & Walcot 1965, Kadmos preview); Wikipedia: "the myth chronicles the conflict of generations of the gods who represent... heaven, earth, sea, river, plough, wild and domesticated animals."

  - claim_number: 9
    claim: "In the next generation Ḫarab marries his daughter Sea; the union produces Sumuqan (also Šakkan), the cattle-god."
    source_id: lambert-2013
    source_loc: "pp. 388–390"
    verbatim_quote: "Sumuqan kills his father Harab (plough), marries his mother Ki (earth) and his sister." (Wikipedia s.v. Dynasty of Dunnum, summarizing Lambert 2013); for the Sumuqan = Šakkan equivalence: "Šumugan, Šamagan, Šumuqan or Šakkan was a god worshipped in Mesopotamia and ancient Syria. Sumuqan was the Akkadian and Babylonian version of Sakkan." (Wikipedia s.v. Šumugan, citing RlA s.v. Sumuqan).

  - claim_number: 11
    claim: "The pattern repeats: each new generation marries within the family (mother, sister, daughter) and kills its parent or displaces its predecessor."
    source_id: lambert-2013
    source_loc: "pp. 388–394"
    verbatim_quote: "successive generations of gods who take power through parricide and live incestuously with their mothers and/or sisters" (Wikipedia s.v. Dynasty of Dunnum, summarizing Lambert 2013); Hayyashum "imprisons" rather than kills Haharnum, marking a turning point in the cycle (Wikipedia, citing Lambert 2013).

  - claim_number: 13
    claim: "The single witness BM 74329 is the only surviving copy; there are no recensional alternates."
    source_id: lambert-2013
    source_loc: "pp. 387–388"
    verbatim_quote: "It is extant in a sole-surviving late Babylonian copy excavated from the site of the ancient city of Sippar by Hormuzd Rassam in the 19th century. The original text for the Theogony of Dunnu is found in British Museum Tablet number 74329." (Wikipedia s.v. Dynasty of Dunnum, citing Lambert 2013).

  - claim_number: 14
    claim: "The Theogony of Dunnu is the principal Akkadian witness to a 'violent succession' cosmogony pattern, with structural parallels to the Hurro-Hittite *Kumarbi Cycle* and Hesiod's *Theogony*."
    source_id: lambert-2013
    source_loc: "p. 393"
    verbatim_quote: "The tale spread across to Phoenicia and over the Aegean Sea, where its influence can be felt in the Ugarit myth Ba'al and Yam from the Ba'al cycle (ca. 1600-1200 BC), the Hittite myth Song of Kumarbi (14th or 13th century BC) and the Greek poet Hesiod's Theogony (ca. 800-700 BC)." (Grokipedia, citing Lambert 2013 and Lambert-Walcot 1965); the Lambert & Walcot 1965 Kadmos article ("A New Babylonian Theogony and Hesiod") is the foundational comparative case.

  - claim_number: 15
    claim: "Dunnu is a real but obscure Mesopotamian place-name; Lambert 2013 discusses possible identifications, though the precise location remains uncertain."
    source_id: lambert-2013
    source_loc: "pp. 387–388"
    verbatim_quote: "Dunnu, meaning 'fortified place' in Akkadian, functions dually as a geographic locale and a symbolic term reflecting the myth's themes of conflict... Harab (the deity Plough) marries Earth and establishes lordship in Dunnu, an agricultural production center." (Grokipedia summary of Lambert 2013).

# ── Findings (anything not ✓ SUPPORTED) ────────────────────────────────────

findings:
  - finding_id: F-1
    claim_number: 17
    kind: UNVERIFIED
    severity: HIGH
    claim: "The closing of the manuscript is broken. The poem may have continued with further generations, or may have terminated at the figure of Enlil; the surviving text does not allow a confident reconstruction of the ending."
    issue: |
      The chapter's framing of the ending is too pessimistic and materially understates
      the scholarly reconstruction. The standard reading (Lambert 2013, following Lambert
      & Walcot 1965 and reflected in Wikipedia s.v. Dynasty of Dunnum, RlA s.v. Sumuqan,
      and the Šumugan/Šakkan article) is that the surviving text does support a
      reconstructed closing in which Enlil and his sons Ninurta and Nušku (described as
      "twin sons" in the standard summary) share rule amicably — the text breaks the
      preceding parricide-incest pattern and ends on a stabilising generation. By
      writing only "may have terminated at the figure of Enlil" the chapter (a) fails
      to mention Ninurta and Nušku at all, and (b) characterises the reconstruction as
      not "confident" when in fact it is the standard scholarly reading. This omission
      is the most consequential factual gap in the chapter and matters because the
      Enlil/Ninurta/Nušku closing is precisely what makes the *Theogony of Dunnu* a
      cosmogonic narrative (it ends in a stable order) and not merely a parricide
      catalogue — so the omission distorts the poem's shape.
    evidence: |
      "The narrative ends, according to a reconstruction of the broken text, with more
      acceptable behavior prevailing with the last generation of gods, Enlil and his
      twin sons Nušku and Ninurta, who share rule amicably." (Wikipedia s.v. Dynasty
      of Dunnum, citing Lambert 2013); independently corroborated by Grokipedia
      ("Enlil ascends to lordship, joined by his twin sons Nušku, the fire god...
      and Ninurta, the warrior deity") and by the Šumugan/Šakkan Wikipedia entry's
      genealogical table.
    recommended_fix: |
      Rewrite the closing claim to: "The closing of the manuscript is partly broken, but
      the surviving text supports a reconstructed ending in which Enlil and his sons
      Ninurta and Nušku share rule amicably — a stabilising generation that breaks the
      parricide-and-incest cycle of the preceding generations." Add a [RECONSTRUCTION:]
      marker noting that the donor source for the reconstruction is the same manuscript
      (internal context within BM 74329), not a parallel manuscript — per the brief's
      lacunae block which states no parallel manuscripts are available. Alternatively,
      keep the [LACUNA:] framing but explicitly name Enlil/Ninurta/Nušku as the
      reconstructed closing figures.

  - finding_id: F-2
    claim_number: 12
    kind: UNVERIFIED
    severity: MEDIUM
    claim: "The text continues through several more generations, each repeating the marry-and-replace cycle. Specific later names are partly broken in the manuscript and are reconstructed from internal context."
    issue: |
      The chapter mentions only Sumuqan and Lahar by name and elides the rest of the
      sequence as "several more generations." The standard scholarly reconstruction
      (Lambert 2013, Lambert & Walcot 1965, summarised in the secondary literature)
      preserves named figures across multiple later generations including Gaiu (a
      reading-variant of Lahar's sign in some scholarly summaries), Kush, River,
      Haharnum, Belet-seri, and Hayyashum, before reaching the Enlil generation. The
      brief's special_instructions explicitly require the chapter to "preserve the
      'who killed/married whom' sequence faithfully"; under-naming the named middle
      generations partly fails that instruction. Severity is MEDIUM (not HIGH) because
      the chapter does correctly state that the later generations exist and are partly
      broken — it does not claim a different sequence; it just truncates.
    evidence: |
      "Herdsman God and Pasture-and-Poplar have children, Haharnum (m) and
      Belet-seri (f). Haharnum kills Herdsman God and Pasture-and-Poplar... Haharnum
      and Belet-seri have children, a son, Hayyashum and a daughter. The daughter
      marries Hayyashum. Hayyashum does succeed his father as the next ruler. Notably,
      Hayyashum does not kill Haharnum but imprisons him, which represents a turning
      point in the cycle." (Wikipedia s.v. Dynasty of Dunnum, summarizing Lambert
      2013); Lambert & Walcot 1965 enumerates the lineage as "Hain and Earth,
      followed by their son Amakandu and daughter Sea. The text then follows the
      lineage down through Lahar, River, Ga'um and others."
    recommended_fix: |
      Add a paragraph naming the middle-generation figures: River, Haharnum and
      Belet-seri (the herdsman/pasture pairing), and Hayyashum (whose imprisonment
      of his father — rather than killing — marks the turning point toward the
      stabilising Enlil generation). This satisfies the brief's "preserve the
      sequence faithfully" instruction. If Lambert 2013's pagination is consulted,
      this content sits at pp. 392–394 alongside the Lahar generation already
      cited.

  - finding_id: F-3
    claim_number: 9
    kind: UNVERIFIED
    severity: MEDIUM
    claim: "Sumuqan, also written Šakkan, the cattle-god."
    issue: |
      The Sumuqan = Šakkan equivalence is correct. The "cattle-god" gloss is too
      narrow: the standard reference (Wikipedia s.v. Šumugan, citing RlA and
      Lambert) describes Šumugan/Šakkan as a herdsman/shepherd god of quadrupeds
      generally — donkeys, wild sheep, and cattle — with the epithet "shepherd of
      everything." In the chapter's own brief (entities_glossary), Sumuqan is glossed
      as "cattle-god, third generation in the cycle," so the chapter is consistent
      with its own brief, but the brief itself oversimplifies. In the *Theogony of
      Dunnu* specifically, Sumuqan's domain in the agrarian-cosmic cascade is the
      domesticated quadrupeds collectively, not cattle alone — and the chapter's
      own list "plough → earth → sea → cattle → shepherd" understates this by
      restricting the third term to cattle. Severity MEDIUM because the cattle
      gloss is widely used in popular summaries and is not strictly wrong, but
      readers comparing to Sumuqan's broader iconography (ram-headed crook,
      donkeys) will note the narrowing.
    evidence: |
      "Šumugan was a shepherd god who was associated with various quadrupeds,
      especially donkeys or alternatively wild sheep... He was associated with
      animals... His primary emblem was 'a ram-headed crook'... 'shepherd of
      everything.'" (Wikipedia s.v. Šumugan, citing RlA s.v. Sumuqan and
      Lambert).
    recommended_fix: |
      Rephrase claim 9 to "Sumuqan (also written Šakkan), the herdsman-god of
      domesticated quadrupeds — cattle, sheep, and donkeys — and patron of the
      pastoral economy." Update the entities_glossary in the brief on the next
      revision pass to match. Alternatively, retain "cattle-god" but add a
      footnote noting the broader herdsman-god identification.

  - finding_id: F-4
    claim_number: 10
    kind: UNVERIFIED
    severity: MEDIUM
    claim: "Sumuqan in turn marries his mother Earth — another incestuous union — and then kills his father Ḫarab and takes his place."
    issue: |
      The Sumuqan-marries-Earth and Sumuqan-kills-Ḫarab claims are correct. But
      the chapter omits a third element of the Sumuqan generation that the
      Wikipedia/Lambert summary preserves: Sumuqan also marries his sister.
      The brief's special_instructions require preserving the "who killed/married
      whom" sequence faithfully, and the sister-marriage is a load-bearing
      genealogical fact. The chapter does generalise later ("each new generation
      marries within the family — mother, sister, daughter") in claim 11, so
      sister-marriage is mentioned in the abstract — but not in the specific
      Sumuqan generation where the source attests it. MEDIUM severity because
      the omission is partial: the abstract pattern is correctly recorded.
    evidence: |
      "Sumuqan kills his father Harab (plough), marries his mother Ki (earth)
      and his sister." (Wikipedia s.v. Dynasty of Dunnum, summarizing Lambert
      2013).
    recommended_fix: |
      Append to the claim: "and his sister." The full claim becomes "Sumuqan
      in turn marries his mother Earth and his sister, kills his father Ḫarab,
      and takes his place." This matches the brief's directive to preserve the
      sequence faithfully.

  - finding_id: F-5
    claim_number: 1
    kind: UNVERIFIED
    severity: MEDIUM
    claim: "The single manuscript is Late Babylonian in date; the underlying composition may be earlier, but no Old Babylonian or Middle Babylonian witnesses survive."
    issue: |
      The Late Babylonian date of the surviving manuscript is correct. The CT 46
      Summary Catalogue describes the tablet as "copied from an 'original of Assur'"
      — i.e., the Late Babylonian copy is itself derived from a (presumably earlier)
      Assur (= Aššur, the Middle/Neo-Assyrian capital) original. The chapter's
      framing "the underlying composition may be earlier" is correct in spirit but
      omits this concrete philological detail (a colophon-attested earlier Aššur
      exemplar), which is directly relevant to dating the underlying composition
      and to the lacunae block. The omission is substantive: the colophon
      attestation moves the underlying composition to at least the Middle/Neo-
      Assyrian period, narrowing "may be earlier" to a specific earlier-by-
      manuscript-tradition claim.
    evidence: |
      "A Late Babylonian tablet, copied from an 'original of Assur', containing
      an otherwise unknown myth which involves several obscure deities."
      (CT 46 Summary Catalogue entry for plate 43 = BM 74329, etana.org/archive.org
      full text, directly verified).
    recommended_fix: |
      Add a sentence after claim 6: "The colophon notes that BM 74329 was copied
      from an earlier exemplar at Aššur, which moves the underlying composition
      to at least the Middle Assyrian period." Cite Lambert 2013 p. 387 (or the
      directly-verifiable CT 46 catalogue entry) and confirm against Lambert's
      manuscript-description discussion. This finding sharpens claim 1 rather
      than contradicting it.

  - finding_id: F-6
    claim_number: 18
    kind: UNVERIFIED
    severity: LOW
    claim: "Most Akkadian creation poems are set in Babylon (Esagil) or Eridu; the Theogony of Dunnu locates its action in a peripheral town."
    issue: |
      The contrast is broadly defensible (the major Akkadian cosmogonies *Enūma
      Eliš* and the *Atra-ḫasīs* prologue are Babylon/Marduk-centric; *Adapa* is
      set at Eridu). But the framing "most Akkadian creation poems are set in
      Babylon (Esagil) or Eridu" is a generalisation the chapter does not source
      to a specific page in Lambert 2013, Foster 2005, or Bottéro 2001 — it is
      the chapter author's framing, not an attested claim. The supporting
      footnote points to Lambert 2013 p. 388 + commentary and Foster 2005
      headnote, neither of which I could verify directly. Severity LOW because
      the claim is consistent with the standard view; flagged here for the
      writer to confirm against an opened Lambert/Foster.
    evidence: |
      No verbatim source citation for the "most ... are set in Babylon or Eridu"
      framing was located in the verifiable secondary literature; the contrast
      is the chapter's interpretive framing of well-known facts.
    recommended_fix: |
      On the next pass with Lambert 2013 in hand, either (a) confirm that p. 388
      or the surrounding commentary makes the Babylon/Eridu vs. Dunnu contrast
      explicitly and quote it, or (b) reframe the claim as the chapter's own
      framing without claiming Lambert as direct support — e.g., "Compared with
      the Babylon-centred *Enūma Eliš* and the Eridu-centred *Adapa*, the
      *Theogony of Dunnu* locates its action in a peripheral town."

