  - claim_number: 6
    claim: "The dating of the composition is contested between the editors. Lambert 2013 dates it to the Kassite or Isin II dynasty — mid-second millennium BCE — on the basis that Marduk is already presented as king of the gods (a post-*Enūma Eliš* theological state) but Nabu is still his scribe rather than his son (a pre-late-Babylonian theological state, before Nabu's elevation). Oshima 2010 dates it to 'the first quarter of the first millennium' (i.e., c. 1000–750 BCE), making it later than Lambert's proposal but still squarely within the Marduk-king theological era."
