  - claim_number: 5
    claim: "The colophon of the Neo-Babylonian manuscript (BM 27776) describes the composition's contents as a secret of Marduk — a *pirištu* — and warns that revealing them to anyone outside the intended audience of ancient scholars was a taboo of Marduk. Future generations are warned not to repeat the transgressions the narrative recounts."
