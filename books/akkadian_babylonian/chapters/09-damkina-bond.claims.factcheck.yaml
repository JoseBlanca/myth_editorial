  - claim_number: 11
    claim: "Damkina releases an object the surviving Akkadian text refers to as her *il-let-sa*. The act precipitates the conflict's resolution: after the release, Marduk captures the gods of Eshumesha. But the nature of the *il-let-sa* is contested between the two modern editors."
    source_id: lambert-2013, oshima-2010 (named-but-flagged)
    source_loc: "Lambert 2013 pp. 321–325 (il-let-sa); Oshima 2010"
    verbatim_quote: |
      Wikipedia s.v. Damgalnuna verbatim: "an object referred to as a
      'bond' (il-let-sa)". Oshima 2010 verbatim: il-let-sa "as a later
      form of e'iltu meaning 'obligation, bond, sin' rather than
      illatu ('horde')"; on Oshima's reading "Damkianna 'set off some
      ill-fortune, e.g., plague or natural disaster'". The
      structural-placement claim (release immediately precedes
      Marduk's capture of Eshumesha gods) is fully corroborated. The
      philological disagreement is fully corroborated. NOTE per F-4
