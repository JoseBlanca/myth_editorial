supported_claims:
  - claim_number: 1
    claim: "*Damkina's Bond* is a short, partly fragmentary Akkadian composition that narrates a divine conflict between the pantheon of Marduk (Babylon) and the pantheon of Enlil (Nippur), resolved through Damkina's intervention. The composition is preserved on two manuscripts: a Neo-Assyrian tablet, A 7882 (Oriental Institute, University of Chicago), and a Neo-Babylonian tablet, BM 27776 (British Museum)."
    source_id: lambert-2013, oshima-2010 (named-but-flagged)
    source_loc: "Lambert 2013 pp. 321–325 (+ p. 497 notes); Oshima 2010 (academia.edu, Festschrift Westenholz pp. 145–162)"
    verbatim_quote: |
      Oshima 2010 (academia.edu, read via WebFetch): "A 7882 (Neo-
      Assyrian script from Oriental Institute, Chicago) and BM 27776
      (Neo-Babylonian script from British Museum)" — directly verifies
      both manuscript identifiers and their locations. Independent web
      search verbatim: "BM 27776 preserves 36 lines and recounts a
      previously unknown mythological episode about Marduk, Enlil,
      Damkianna, and the gods of Eshumesha". Wikipedia s.v. Damgalnuna:
      "the myth centers on a conflict between the pantheons of Babylon
      and Nippur, led respectively by Marduk and Enlil. The forces of
      Nippur lose, eventually resolved through Damgalnuna's
      intervention". DeGruyter Brill chapter landing
      doi:10.1515/9781575068619-021 confirms pp. 321–325. The single-
      composition / two-manuscript / Marduk-vs-Enlil-resolved-by-
      Damkina framing is fully corroborated.

  - claim_number: 2
    claim: "The composition has a preserved title or designation — modern scholarship uses Lambert's title *Damkina's Bond*, after the *il-let-sa* (variously read 'bond' or 'burden') that the goddess releases in the surviving narrative."
    source_id: lambert-2013, oshima-2010 (named-but-flagged)
    source_loc: "Lambert 2013 p. 321; Oshima 2010"
    verbatim_quote: |
      Wikipedia s.v. Damgalnuna: "an object referred to as a 'bond'
      (il-let-sa)" — directly verifies Lambert's "bond" reading.
      Oshima 2010 paper title verbatim: "Damkina shall not bring back
      her Burden in the future: A new Mythological Text of Marduk,
      Enlil, and Damkianna" — directly verifies Oshima's "burden"
