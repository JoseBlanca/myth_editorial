findings:
  - finding_id: F-1
    claim_number: 9
    kind: CITATION-WRONG
    severity: MEDIUM
    claim: |
      "Neretagmil... delivers a message to Damkianna (the older
      Sumerian-style form of the name; Akkadian Damkina) about the
      battle."
    issue: |
      The parenthetical gloss "Damkianna (the older Sumerian-style
      form of the name; Akkadian Damkina)" is WRONG. Per Wikipedia
      s.v. Damgalnuna name-forms section (citing Paul-Alain Beaulieu):
      "the second form of her name, Damkina, developed later. In late
      sources it could be spelled as Damkianna. This form is attested
      in Neo-Babylonian letters found in Uruk". Damkianna is therefore
      a LATE spelling of Damkina, NOT an "older Sumerian-style form".
      The actual Sumerian-style / older form is Damgalnuna ("the great
      wife of the prince"). The claims document inverts the
      chronological relationship: the older / Sumerian form is
      Damgalnuna, the Akkadian / standard form is Damkina, and the
      late spelling Damkianna is attested in Neo-Babylonian Uruk
      letters. Severity MEDIUM because: (a) the substance of
      Neretagmil's role and the message-to-Damkina narrative is fully
      supported; (b) but the parenthetical gloss wrong-foots the
      reader on the linguistic history; (c) the "Damkianna" spelling
      in this composition is consistent with Oshima's "first quarter
      of the first millennium" dating (a late-spelling form on a Neo-
      Assyrian / Neo-Babylonian tablet), reinforcing rather than
      undermining the dating discussion in claim 6 — but the gloss as
      written sends the reader the opposite way.
    evidence: |
      Wikipedia s.v. Damgalnuna name-forms section (verbatim, read via
      WebFetch): "It is agreed that the second form of her name,
      Damkina, developed later. In late sources it could be spelled
      as Damkianna. This form is attested in Neo-Babylonian letters
      found in Uruk, according to Paul-Alain Beaulieu originally sent
      from Eridu". Same article: "She first appears as a consort of
      Enlil in Sumerian mythology, and later becomes the Akkadian
      Damkina, consort of Enki/Ea and mother of the god Marduk. The
      theonym Damgalnuna can be translated as 'the great wife of the
      prince'". The Sumerian form is Damgalnuna; the Akkadian form is
      Damkina; the late-Akkadian variant spelling is Damkianna.
    recommended_fix: |
      Revise the parenthetical at line 73: "delivers a message to
      Damkianna (the older Sumerian-style form of the name; Akkadian
      Damkina)" → "delivers a message to Damkianna (a late-period
      Akkadian variant spelling of the name Damkina, attested in Neo-
      Babylonian letters; the Sumerian-style older form is
      Damgalnuna)". Optionally, footnote can cite Beaulieu via
      Wikipedia s.v. Damgalnuna for the Neo-Babylonian Uruk
      attestation. The substance of the claim (Neretagmil delivers a
      message to Damkina) is unaffected.

  - finding_id: F-2
    claim_number: 13
    kind: CITATION-WRONG
    severity: MEDIUM
    claim: |
      "The number 360 is theologically and astronomically loaded. It
      corresponds to the canonical count of days in the Mesopotamian
      schematic year and to the count of stars in the standard
      Mesopotamian sky-list (the *Three Stars Each* tradition,
      *MUL.APIN*-related compendia)."
    issue: |
      The claim that 360 "corresponds... to the count of stars in the
      standard Mesopotamian sky-list (the *Three Stars Each*
      tradition, *MUL.APIN*-related compendia)" is WRONG on the star-
      count. Per Wikipedia s.v. Babylonian star catalogues (verbatim):
      "The enumeration of stars in the Three Stars Each catalogues
      includes 36 stars, three for each month". MUL.APIN catalogs
      "71 stars and constellations". There is NO Mesopotamian sky-
      list of 360 stars. The 360 connection in Mesopotamian astronomy
      is to (a) the schematic year of 360 days (correctly stated in
      the chapter) and (b) the zodiac of 360 degrees (introduced
      around the 5th century BCE), but NOT to a 360-star sky-list.
      The Three Stars Each tradition has 36 stars (3 per month × 12
      months), and MUL.APIN — the larger compendium descending from
      it — has 71. Severity MEDIUM because: (a) the substantive
      argument that "360 is theologically and astronomically loaded"
      and that the 360-day schematic year is the proximate referent
      is correct and well-supported; (b) the star-list link is a
      factual error, not a framing error — the chapter is making a
      specific factual claim about the count of stars in the Three
      Stars Each / MUL.APIN tradition, and the count is wrong;
      (c) the EVIDENCE token "black-green-1992 ; loc=s.v. number
      symbolism" is the supposed source for the claim, and Black &
      Green 1992 is unlikely to attribute a 360-star catalog to the
      Three Stars Each tradition (the dictionary's number-symbolism
      entry is more likely to discuss the 360-day schematic year and
      the 360° zodiac); the citation is plausibly mis-attributed.
    evidence: |
      Wikipedia s.v. Babylonian star catalogues (verbatim, read via
      WebFetch): "The enumeration of stars in the Three Stars Each
      catalogues includes 36 stars, three for each month. ... MUL.APIN
      [catalogs] 71 stars and constellations of the 'Three Ways' of
      the Three Stars Each tradition". Independent web search:
      "Around the 5th century BCE, Babylonian astronomical texts
      began to describe the positions of the Sun, Moon, and planets
      in terms of 12 equally-spaced signs, each one associated with
      a zodiacal constellation, each divided into 30 degrees. This
      normalized zodiac totals 360 degrees" — confirming that the
      Mesopotamian 360 is the schematic year and the zodiac degrees,
      NOT a star count.
    recommended_fix: |
      Revise the claim at line 95: drop the star-count link, retain
      the schematic-year link. Suggested rewording: "The number 360
      is theologically and astronomically loaded. It corresponds to
      the canonical count of days in the Mesopotamian schematic year
      (the standard 12 × 30-day year of the astrolabes and of
      *MUL.APIN*) and, by extension, to the 360° zodiacal scheme of
      later Babylonian astronomy. The 360 gods of Eshumesha are not
      merely a round number; they index the schematic-year totality,
      and Marduk's capture of all of them at once is a totalising
      theological gesture." Drop "the count of stars in the standard
      Mesopotamian sky-list (the *Three Stars Each* tradition,
      *MUL.APIN*-related compendia)" entirely. The Black & Green
      1992 EVIDENCE token can be retained (s.v. number symbolism is
      genre-appropriate for the schematic-year discussion); the
      Three Stars Each / MUL.APIN reference should be either dropped
      or recharacterized as the schematic-year reference, not the
      star-count reference.

  - finding_id: F-3
    claim_number: 5
    kind: UNVERIFIED
    severity: LOW
    claim: |
      "The colophon of the Neo-Babylonian manuscript (BM 27776)
      describes the composition's contents as a secret of Marduk —
      a *pirištu* — and warns that revealing them..."
    issue: |
      The specific Akkadian term "pirištu" is asserted as the
      colophon's word for "secret", but the secondary sources I could
      verify do not directly confirm pirištu as the term in BM 27776.
      Wikipedia s.v. Damgalnuna says "the contents of the tablet were
      a secret"; Oshima 2010 quotes the colophon as "The one who
      knows shall reveal it to the one who knows, the one who does
      not know, shall not see it. The taboo of [Marduk?]" with the
      Marduk-attribution itself in broken brackets. The Akkadian word
      pirištu IS the standard Akkadian term for "secret" in
      scholarly-priestly contexts, and is genre-appropriate for the
      secret-of-Marduk colophon tradition (cf. the COMPARATIVE-HOOK
      at line 134 referencing Livingstone 1989 SAA 3 nos. 34–35
      Marduk Ordeal colophons), but the chapter's confident
      attribution of pirištu to BM 27776 specifically requires direct
      verification in Lambert 2013's transliteration of the colophon
      — which I could not access directly. Severity LOW because:
      (a) pirištu is the genre-appropriate term and the chapter's
      framing is consistent with the secondary literature on the
      secret-tablet tradition; (b) the substantive claim that the
      BM 27776 colophon classes the contents as a secret of Marduk
      is fully corroborated by Wikipedia and Oshima 2010; (c) only
      the specific Akkadian word identification is unverified.
    evidence: |
      Wikipedia s.v. Damgalnuna (verbatim): "The colophon of the
      Neo-Babylonian copy states that the contents of the tablet
      were a secret and revealing them to anyone from outside its
      intended audience of ancient scholars was considered a taboo
      of Marduk". The English word "secret" maps to the Akkadian
      pirištu in the standard Assyriological lexicon (CAD P, p.
      398–401), but Wikipedia does not specify the Akkadian word
      used in BM 27776. Oshima 2010 (read via WebFetch): "The one
      who knows shall reveal it to the one who knows, the one who
      does not know, shall not see it. The taboo of [Marduk?]" —
      the Akkadian word in the broken portion is not specified.
    recommended_fix: |
      Either: (a) verify the Akkadian word in Lambert 2013's
      transliteration of the BM 27776 colophon and retain "pirištu"
      if confirmed; or (b) tighten the wording at line 49 to "a
      secret of Marduk (the Akkadian term used in such colophons is
      typically *pirištu*)" — making the claim about the genre
      convention rather than about the specific BM 27776 word; or
      (c) drop "a *pirištu*" as a parenthetical and let "a secret
      of Marduk" stand on the substance. Option (b) is the lightest
      revision and preserves the connection to the wider secret-
      tablet tradition.

  - finding_id: F-4
    claim_number: 11 + VARIANT marker after claim 11
    kind: CITATION-WRONG
    severity: LOW
    claim: |
      "[VARIANT: primary=Lambert 2013's reading 'bond' (something
      displayable, perhaps a clay tablet); the il-let-sa is on
      Lambert's reading a positive theological gesture — a binding /
      pact / token that ends the conflict on Marduk's terms |
      alt=Oshima 2010's reading 'burden' (a potentially catastrophic
      plague or natural / celestial disaster); on Oshima's reading
      the il-let-sa release is more ominous — releasing a catastrophe
      that compels the resolution..."
    issue: |
      The opposition Lambert "bond" vs. Oshima "burden" is broadly
      correct in translation, but the underlying philological
      situation is more nuanced than the VARIANT marker indicates.
      Per Oshima 2010 (read via WebFetch): Oshima translates il-let-sa
      as "burden" but interprets it as "a later form of e'iltu meaning
      'obligation, bond, sin' rather than illatu ('horde')". The word
      e'iltu in Akkadian carries the semantic range of obligation /
      bond / debt / sin / liability, and Oshima's "burden" is
      specifically derived from this "obligation" sense — i.e., a
      burden in the sense of a binding obligation that, when
      "released" by Damkianna, has ill-fortune consequences (plague
      or natural disaster). The two readings are therefore both
      "bond / obligation"-flavored at the philological level; they
      differ in how the released object operates (positive
      displayable token in Lambert; catastrophic release of
      obligation in Oshima). The chapter's framing as a
      "binding / pact" register vs. "catastrophe-precipitation"
      register is essentially correct, but the sharp "bond vs.
      burden" opposition oversimplifies the philological situation.
      Severity LOW because: (a) the substantive disagreement IS
      between a positive-token reading and a catastrophe-release
      reading, exactly as the chapter describes; (b) the translations
      "bond" and "burden" are accurate to Lambert and Oshima
      respectively; (c) only the implied lexical opposition is
      slightly oversharpened — both readings are grounded in the
      e'iltu/illatu lexical landscape, and Oshima's "burden" carries
      the "obligation/bond" sense in its etymological genealogy.
    evidence: |
      Oshima 2010 academia.edu (verbatim, read via WebFetch): "Oshima
      translates il-let-sa (spelled el-let-sa in MS A) as 'burden'.
      He interprets it as a later form of e'iltu meaning 'obligation,
      bond, sin' rather than illatu ('horde'). He notes the word
      frequently appears with paṭāru ('to release'), though here the
      context differs — Damkianna 'set off some ill-fortune, e.g.,
      plague or natural disaster' rather than absolving sins."
    recommended_fix: |
      Tighten the VARIANT marker at line 87 by adding a brief
      philological note: "primary=Lambert 2013's reading 'bond'
      (something displayable, perhaps a clay tablet) | alt=Oshima
      2010's reading 'burden' — derived from e'iltu (obligation,
      bond, sin), so etymologically a 'binding obligation' that
      Damkianna's release sends out as ill-fortune (plague or
      natural / celestial disaster); Oshima rejects the alternative
      derivation from illatu 'horde'". This retains the chapter's
      structural opposition (positive-displayable-token vs.
      catastrophe-release) while making the philological underpinning
      more precise. Severity LOW; the fix is a wording tightening,
      not a substantive correction.

