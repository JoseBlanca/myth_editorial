findings:
  - finding_id: F-1
    claim_number: 9
    location: "lines 107-111 and [LACUNA: ...] at line 125"
    kind: INTERNAL-VARIANCE
    severity: NONE   # handled correctly via [LACUNA: ... | scholarly_reconstruction: yes]
    claim: "Sebitti order in Tablet I shows manuscript-level variation; Cagni 1969's apparatus records variants."
    issue: |
      The brief's variants block (line 45) flags "Manuscripts
      vary in the order of the Sebitti list (Erra's seven
      demonic agents) in Tablet I; Cagni 1969 records the
      variants." The chapter handles this correctly via the
      [LACUNA: ... | scholarly_reconstruction: yes] marker at
      line 125. No finding — internal variance is handled per
      the SINGLE-PREVALENT classification and the variant-
      marker pattern.
    evidence: |
      The chapter cites Cagni 1969's apparatus correctly; the
      marker schema is intact; the scholarly_reconstruction
      flag is yes; the brief's variant documentation matches.
    recommended_fix: NONE — handled correctly.

  - finding_id: F-2
    claim_number: 25 (COMPARATIVE-HOOK at line 241)
    location: "line 241, COMPARATIVE-HOOK: 'Akkadian internal — Marduk-leaving-his-throne and the historical reception of *Erra and Išum*'"
    kind: HEDGING-NEEDED
    severity: MEDIUM
    claim: "The 689 BCE Sennacherib sack of Babylon was read in the surviving Babylonian-side documentation through the *Erra and Išum* template (the god's absence as the precondition for the catastrophe; the eventual restoration of the cult and the return of the statue under Esarhaddon as the structural counterpart to the poem's Tablet V resolution)."
    issue: |
      The Sennacherib-reception reading is ONE proposal, not
      consensus. The composition itself is dated by different
      scholars to anywhere between the 11th and 7th centuries
      BCE; the Sennacherib-as-historical-context reading
      (whether as composition trigger or reception frame) is
      one of several competing readings. The chapter currently
      frames it as "the canonical theological frame within
      which Babylonian writers later read the catastrophes of
      their own history" — which is too strong. Foster 2007
      and Frahm's reception survey treat it as a plausible
      reading among others, not as the canonical frame. Note
      that this material is in COMPARATIVE-HOOK only (not
      body), which is GOOD practice — the hedge needed is in
      the comparative-chapter framing, not in the body.
    evidence: |
      Wikipedia s.v. Erra (god): scholars dispute composition
      date 11th–7th century BCE; "the historic events that
      inspired the poem" is open. Frahm reception survey:
      Erra-Išum as Babylonian counter-text to Enūma Eliš;
      multiple readings. Tadmor 2022 dissertation: restraint-
      and-psychoanalysis reading distinct from Sennacherib-
      historical reading. Scribd/displaceddynasties summary:
      "scholars disagree on when the events themselves took
      place."
    recommended_fix: |
      In the COMPARATIVE-HOOK (line 241), hedge the framing:
      replace "is the canonical theological frame within which
      Babylonian writers later read the catastrophes of their
      own history: most notably the sack of Babylon by
      Sennacherib in 689 BCE" with something like "is one of
      the theological frames through which some Babylonian
      writers read the catastrophes of their own history; the
      sack of Babylon by Sennacherib in 689 BCE is the
      most-cited reception-case in the scholarly tradition,
      though the reading is contested and the composition
      date itself is disputed (proposals span the 11th–7th
      centuries BCE)." Continue to reserve detailed treatment
      for the influences chapter. The fix is in the
      comparative-chapter framing, NOT a body claim.

  - finding_id: F-3
    claim_number: 14
    location: "line 136, paragraph: 'Marduk's reply is hesitant.'"
    kind: HEDGING-NEEDED
    severity: LOW
    claim: "Marduk recalls that the last time he left his throne — at the time of the great flood — the cosmos itself was thrown into disorder; the heavens shook, the underworld trembled, the gods feared the consequences."
    issue: |
      Three of the four elements are supported by the
      verbatim text (Tablet I.131–162):
      (i) Marduk left his throne at the flood: YES
          ("I got angry. I rose from my seat and contrived
          the deluge").
      (ii) Heavens shook: YES ("the positions of the
          heavenly bodies changed, nor did I restore them").
      (iii) Underworld trembled: YES ("the yield of the
          furrow diminished").
      (iv) The gods feared the consequences: NOT SUPPORTED
          as a textual feature. The actual recollection
          foregrounds Marduk's own dispatch of craftsmen/
          apkallu to Apsu ("I sent craftsmen down to Apsu,
          I ordered them not to come up") and the disrupted
          cosmos. The "gods feared" framing is a writer's
          paraphrase rather than a verbatim feature.
      Additionally, the recollection's most distinctive
      element — Marduk's dispatch of the seven apkallu/
      craftsmen to Apsu — is omitted from the chapter's
      summary. This is the LOAD-BEARING detail of the
      recollection (it bears on the cult-statue refurbishment
      pretext, since the original craftsmen who made the
      statue are no longer accessible). The chapter would be
      strengthened by adding the apkallu-in-Apsu detail.
    evidence: |
      gatewaystobabylon Tablet I verbatim translation;
      maniadelight verbatim. The apkallu-in-Apsu detail is
      preserved in I.147–162 of Foster 2005 and Dalley 2008
      translations; chapter omits it.
    recommended_fix: |
      Drop "the gods feared the consequences" or replace with
      a more accurate paraphrase. Consider adding a sentence
      naming the apkallu/craftsmen-in-Apsu element: "Marduk
      had at that earlier moment sent the apkallu — the seven
      antediluvian sages — down to the Apsû, ordering them not
      to come back up; the craftsmen who could now restore
      the cult statue are accordingly not within easy reach,
      which (in the poem's logic) is precisely why a fresh
      cleansing requires Marduk himself to step away." This
      strengthens the chapter on its load-bearing detail.

  - finding_id: F-4
    claim_number: 10
    location: "line 107, paragraph: 'The Sebitti are presented as the offspring of Anu...'"
    kind: HEDGING-NEEDED
    severity: MEDIUM
    claim: "The seven are differentiated within the catalogue: each carries a specific destructive remit, and each is given by Anu his own commission, so that Erra disposes of a war-band whose members are functionally distinct rather than identical."
    issue: |
      The differentiation is real and well-attested in the
      catalogue (Tablet I, column ii–iii; in Foster 2005 the
      passage is roughly pp. 882–884). The chapter would be
      strengthened by naming at least 2–3 of the
      differentiated destinies (e.g., the first spreads
      terror, the second burns like fire, the third
      annihilates like a lion, etc.) rather than the abstract
      "differentiated within the catalogue" formulation.
      Without specifics, the differentiation claim risks being
      read as a writer's gloss rather than a textual feature.
    evidence: |
      Wikipedia/grokipedia/darkchamberz summary of Sebitti
      destinies. Foster 2005 (per multiple translation
      mirrors) lists the individuated commissions in
      Tablet I, column ii.
    recommended_fix: |
      Append a sentence at line 107: "Foster 2005 (pp.
      882–884) lists the seven commissions: the first
      assigned to spread terror, the second to burn like
      fire, the third to annihilate like a lion, the fourth
      to fell mountains, the fifth to encircle like wind,
      the sixth to spare no one, the seventh to slay with
      venom — seven distinct destructive functions
      catalogued in the order Cagni 1969's critical text
      preserves." This converts an abstract claim into a
      catalogue-grounded claim and strengthens the
      Sebitti-differentiation argument that the writer
      flagged for scrutiny.

