  - claim_number: 16
    claim: "Tablet III narrates the destruction; Babylon as central target; indiscriminate."
    source_id: foster-2005
    source_loc: "pp. 898-904"
    verbatim_quote: |
      gatewaystobabylon Tablet III: "Whoever has not died in
