      (b) **Wikipedia s.v. Sebitti** (WebFetch). Confirmed
          multiple parentage traditions; in the Erra Epic the
          Sebitti are "creations of Anu and follow the god into
          battle as his weapons" (citing Wiggermann 2011,
          Lambert 2013, George 2013). Anu both creates them
          (paternal-creator function) and gives them to Erra as
          weapons. The chapter's "fathered them and gave them to
          Erra" framing is supported at the Erra-epic level
