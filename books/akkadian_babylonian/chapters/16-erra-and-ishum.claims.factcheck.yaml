  - claim_number: 19
    claim: "Tablet IV — destruction of Babylon, Esagil profaned, urban-lament register."
    source_id: foster-2005
    source_loc: "pp. 904-908"
    verbatim_quote: |
      gatewaystobabylon Tablet IV: "Babylon, which I made
