  - claim_number: 21
    claim: "Tablet V — Išum persuades; Erra relents; restoration decree."
    source_id: foster-2005
    source_loc: "pp. 908-911"
    verbatim_quote: |
      gatewaystobabylon Tablet V verbatim:
      "Whoever pays heed to this tablet of mine,
