  - claim_number: 20
    claim: "Tablet IV's urban lament inherits the older Sumerian-Akkadian city-lament tradition."
    source_id: foster-2007
    source_loc: "pp. 39-43"
    verbatim_quote: |
      Foster 2007 frames the Tablet IV register as
