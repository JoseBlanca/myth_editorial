      Plus Erra's decree to rebuild Babylon. Supported.

  - claim_number: 22
    claim: "Apotropaic colophon: any house holding the tablet shall be safe; any person carrying it shall be spared."
    source_id: foster-2005
    source_loc: "pp. 909-911"
    verbatim_quote: |
      gatewaystobabylon verbatim: "Whoever shall reverence
      this tablet ... in his house this poem shall be set
      up." Supported.

  - claim_number: 23
