          "the regulation of heaven and earth disintegrated."
          The chapter's "heavens shook, the underworld
          trembled" claim is supported. The chapter's "the
          gods feared the consequences" is a hedged paraphrase
          rather than a verbatim feature — the actual
          recollection foregrounds heaven-stations-altered,
          netherworld-yield-diminished, and Marduk's own
          dispatch of craftsmen/apkallu to Apsu (I.147–162),
          not specifically "the gods feared." LOW-severity
          hedge needed (F-3).
      (d) **maniadelight.com — Poem of Erra detail** (WebFetch).
          Confirmed Marduk "got angry. I rose from my seat and
          contrived the deluge"; "And the sky, lo!, it shook.
          The stations of the stars in the sky were altered,
          and I did not bring them back to their positions."
          Confirmed cult-statue pretext: Marduk's statue is
          tarnished, jewelry dirtied, regalia lost lustre.
      (e) **mostlydeadlanguages.tumblr.com — Erra I.1–123
          translation** (WebFetch). Confirmed opening
