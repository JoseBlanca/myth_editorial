  - claim_number: 17
    claim: "Tablet III extended catalogue: cities, kings, rivers, social order inverted."
    source_id: foster-2005
    source_loc: "pp. 900-906"
    verbatim_quote: |
      gatewaystobabylon Tablet III: "I will turn day into
