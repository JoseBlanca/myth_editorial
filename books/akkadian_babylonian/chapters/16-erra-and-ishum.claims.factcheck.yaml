  - claim_number: 14
    claim: "Erra's guarantee: he will maintain cosmic order during Marduk's absence."
    source_id: foster-2005
    source_loc: "pp. 894-898"
    verbatim_quote: |
      maniadelight verbatim: "Erra offered to obtain
      [materials]. Marduk said chaos would occur if he left
      his chair to purify his garments, but Erra offered to
      rule during this time and keep everything under
      control." Supported.

  - claim_number: 15
    claim: "Marduk leaves throne; cult statue taken for cleansing; Babylon ritually exposed."
    source_id: foster-2005
    source_loc: "pp. 896-900"
    verbatim_quote: |
      Britannica s.v. Erra (verbatim above) and
      maniadelight Tablet I translation confirm Marduk's
