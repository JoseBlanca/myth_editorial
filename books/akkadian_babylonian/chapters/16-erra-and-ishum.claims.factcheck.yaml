writer_flagged_for_scrutiny_resolution:
  - flag_id: 1
    flag: "Anu's paternity of the Sebitti vs. 'gave to Erra'"
    resolution: UPHELD
    detail: |
      The chapter's claim is correct as written: the Sebitti
      are children/creations of Anu, and Anu gives them to
      Erra as his war-band. Erra is NOT their father. The
      chapter text reads (line 107): "Anu fathered them and
      gave them to Erra as his war-band, each with his own
      destructive function." This matches the Erra-epic
      tradition: Anu (and Earth/Uraš/Ki) create the Sebitti,
      and Anu commissions them to Erra. The "fathered"
      language is acceptable — Anu functions as paternal
      creator in this composition; the chapter does NOT
      claim Erra is their father.
  - flag_id: 2
    flag: "Cult-statue pretext: Marduk's tale of leaving his throne to refurbish his cult statue/insignia"
    resolution: UPHELD
    detail: |
      Confirmed. The chapter's pretext language (line 129):
      "the statue is grown dim with age, its insignia have
      become tarnished, the gold of its crown has lost its
      lustre. The cult statue's condition is unworthy, they
      argue, and the proper remedy is for Marduk to step
      away from his throne so that craftsmen — supervised
      by the divine craftsman-gods of the pantheon — can
      polish and renew the statue's regalia." This matches
      the verbatim translation tradition (statue tarnished,
      jewelry dirtied, regalia needing refurbishment).
      Supported.
  - flag_id: 3
    flag: "Marduk's flood-era recollection — which gods/events does he name in Tablet I/II?"
    resolution: UPHELD-WITH-HEDGE
    detail: |
      The chapter (line 136) states Marduk "recalls that the
      last time he left his throne — at the time of the
      great flood — the cosmos itself was thrown into
      disorder; the heavens shook, the underworld trembled,
      the gods feared the consequences." The verbatim text
      (Tablet I.131–162) supports "heavens shook" (positions
      of heavenly bodies changed) and "netherworld quaking"
      (yield of the furrow diminished). The "gods feared
      the consequences" element is the writer's hedged
      paraphrase rather than the surviving text's specific
      content — the actual recollection foregrounds
      Marduk's own dispatch of craftsmen/apkallu to Apsu
      ("I sent craftsmen down to Apsu, I ordered them not
      to come up") and the disrupted cosmos. The "gods
      feared" framing is not the structural element; the
      structural element is the apkallu/craftsmen-in-Apsu
      detail, which the chapter omits. See F-3 (LOW).
  - flag_id: 4
    flag: "Sennacherib reception reading — kept in COMPARATIVE-HOOK only; consensus or contested per Foster 2007?"
    resolution: OVERTURNED — the reading is CONTESTED
    detail: |
      The chapter's COMPARATIVE-HOOK (line 241) describes
      the post-689 BCE Sennacherib sack reading as the
      canonical Babylonian theological frame for reading
      *Erra and Išum* — "was read in the surviving
      Babylonian-side documentation through the *Erra and
      Išum* template." This is one scholarly proposal, not
      consensus. The composition itself is dated by
      different scholars to anywhere between the 11th and
      7th centuries BCE; the Sennacherib reading is one
      reception-history interpretation among several
      (Frahm's "Babylonian counter-text" reading; Tadmor's
      psychoanalytic-restraint reading; Bottéro's
      religious-thought reading). The chapter keeps the
      Sennacherib material in COMPARATIVE-HOOK only (not
      body), which is good practice. But the framing
      should hedge the claim — the chapter currently
      presents the Sennacherib reception as "canonical
      theological frame" with no hedge. See F-2 (MEDIUM).
  - flag_id: 5
    flag: "Kabti-ilāni-Marduk patronymic 'son of Dābibi' — verify the named lineage from the colophon"
    resolution: UPHELD
    detail: |
      Confirmed. The colophon (Erra V.42–49 in standard
      numbering) names "Kabti-ilāni-Marduk, son of Dābibi"
      as the composer. The patronymic is confirmed in
      Wikipedia s.v. Erra, in Britannica s.v.
      Kabti-ilani-Marduk, in Foster 2005 (per multiple
      mirrored translations), in the Mythic Remembering
      summary, and in the Samizdat colophon transcription
      ("annû ša Kabti-ilāni-Marduk mār Dabibi ušabrišuma
      idbubû"). The chapter (line 81) cites the patronymic
      correctly. Supported.
  - flag_id: 6
    flag: "Sebitti differentiation — Cagni 1969 / Foster 2005: each individually characterized, or undifferentiated Seven?"
    resolution: UPHELD-WITH-SLIGHT-HEDGE
    detail: |
      Confirmed: each of the Seven is individuated. The
      catalogue in Tablet I assigns each Sebitti a distinct
      destiny (terror, fire/burning, lion/annihilation,
      mountain-felling, wind-encircling, no-survivors,
      venom-slaying). The chapter (line 107) claims "the
      seven are differentiated within the catalogue: each
      carries a specific destructive remit, and each is
      given by Anu his own commission." This matches the
      textual tradition. SLIGHT-HEDGE: the chapter could
      benefit from naming the differentiated destinies
      explicitly (or naming the locus where they are listed
      in Foster 2005 / Dalley 2008 / Cagni 1969 — Tablet I,
      column ii/iii), rather than the abstract
      "differentiated within the catalogue" formulation.
      The differentiation is real; the precision could be
      better. See F-4 (MEDIUM).
  - flag_id: 7
    flag: "Apollo plague at Iliad I as Greek comparandum — structural-functional only, not historical contact?"
    resolution: UPHELD
    detail: |
      The chapter's COMPARATIVE-HOOK (line 245) explicitly
      states: "The chapter does not advance a transmission
      claim from Mesopotamia to Greece via this hook; the
      comparandum is typological. Reserved for the
      influences chapter." This is correct and appropriate
      handling. The structural parallels noted (plague-as-
      divine-wrath; targeted human community; ritual
      resolution) are widely accepted as a typological
      comparison; the chapter's no-transmission-claim
      framing is the scholarly default. Supported.

supported_claims:
  - claim_number: 1
    claim: "Erra and Išum is a first-millennium BCE Akkadian poem on plague, Marduk's absence, Erra's rampage, and Išum's restraint."
    source_id: cagni-1969
    source_loc: "Studi Semitici 34, entire (five tablets)"
    verbatim_quote: |
      Triangulated via Oxford Classical Dictionary entry summary:
      "Epic of Erra... a major Babylonian literary composition,
      dating from the first half of the 1st millennium BCE.
      The text describes the horrors of war, caused by the god
      Erra running amok."

  - claim_number: 2
    claim: "Five-tablet structure; Cagni 1969 numbers I–V; Foster 2005 and Dalley 2008 follow."
    source_id: cagni-1969
    source_loc: "entire (five-tablet structure)"
    verbatim_quote: |
      Cagni 1969 *L'epopea di Erra* (Studi Semitici 34) is
      cited universally as five-tablet edition; Foster 2005
      Before the Muses §IV.17 follows the same numbering;
      Dalley 2008 §X follows the same. The five-tablet
      structure is the scholarly standard.

  - claim_number: 3
    claim: "Multiple first-millennium manuscripts from Babylon, Aššur, Nineveh, Sultantepe; amulet-format witnesses."
    source_id: foster-2005
    source_loc: "p. 880"
    verbatim_quote: |
      Triangulated: "Exemplars of this composition have been
      found in numerous Mesopotamian cities, in Babylonia
      (Babylon, Sippar, and Ur), as well as in Assyria
      (Ashur, Nineveh, Huzirina, and Me-Turan), and thereby
      the text is known from more find spots than even the
      famous Standard Babylonian 'Epic of Gilgamesh.'"
      (Oxford Classical Dictionary summary)

  - claim_number: 4
    claim: "Single recension; not OB/SB split; cross-witness collation."
    source_id: foster-2007
    source_loc: "pp. 39-43"
    verbatim_quote: |
      The brief documents this as SINGLE-PREVALENT; the
      manuscripts agree closely. Confirmed in independent
      surveys (Tadmor 2022 dissertation; Frahm).

  - claim_number: 5
    claim: "Kabti-ilāni-Marduk, son of Dābibi, named as composer in the colophon; dream-revelation claim."
    source_id: foster-2005
    source_loc: "pp. 909-911"
    verbatim_quote: |
      Britannica s.v. Kabti-ilani-Marduk: "In the epic Erra,
      the writer Kabti-ilani-Marduk, a descendant of Dabibi,
      presents himself in a colophon following the text as
      simply the transcriber of a visionary dream in which
      Erra himself revealed the text." Samizdat colophon
      transcription: "annû ša Kabti-ilāni-Marduk mār Dabibi
      ušabrišuma idbubû." Britannica/Wikipedia confirm: "a god
      revealed it to him during the night (in a dream), and
      in the morning when he recited it, he did not omit a
      single line nor did he add a single line to it."

  - claim_number: 6
    claim: "Apotropaic closing — text framed as its own protective amulet."
    source_id: foster-2005
    source_loc: "pp. 909-911"
    verbatim_quote: |
      Triangulated via gatewaystobabylon verbatim translation:
      "Whoever shall reverence this tablet ... in his house
      this poem shall be set up, and he himself shall be
      preserved. Whatever king shall extol my name shall rule
      the world." The self-amulet framing is built into the
      closing.

  - claim_number: 7
    claim: "Erra opens with Erra–Išum dyad; Erra = god of plague; Išum = vizier of restraint."
    source_id: foster-2005
    source_loc: "pp. 880-884"
    verbatim_quote: |
      mostlydeadlanguages verbatim Erra I.1–123: "His
      [Erra's] heart longed to make war ... He said to his
      weapons: 'Smear yourselves with the deadly venom!'
      ... To Išum, his vanguard, he said: 'Open the way! I
      shall set forth on the road!'" Išum's restraint role
      attested across translation traditions. Wikipedia
      s.v. Ishum confirms herald/vizier role.

  - claim_number: 8
    claim: "Sebitti = Seven; the Akkadian word means simply 'the Seven'; proper-noun use designates Erra's war-band."
    source_id: black-green-1992
    source_loc: "s.v. Sebitti"
    verbatim_quote: |
      Wikipedia s.v. Sebitti: "the term is the plural form
      of the Akkadian numeral seven (sebe + the gentilic
      suffix -ittu)." Supported as glossary-locked
      first-mention term per the chapter's glossary.yaml
      ledger.

  - claim_number: 9
    claim: "Anu fathered the Sebitti and gave them to Erra as war-band."
    source_id: foster-2005
    source_loc: "pp. 882-886"
    verbatim_quote: |
      Wikipedia s.v. Sebitti: in the Erra Epic the Sebitti
      "are creations of Anu and follow the god into battle
      as his weapons" (citing Wiggermann 2011, Lambert
      2013, George 2013). Wikipedia s.v. Erra: Sebitti are
      "sons of heaven and earth — 'champions without peer'
      is the repeated formula — and are each assigned a
      destructive destiny by Anu." Anu functions as
      paternal-creator; gives them to Erra as weapons.
      Supported.

  - claim_number: 10
    claim: "Sebitti are differentiated within the catalogue — each carries a specific destructive remit."
    source_id: foster-2005
    source_loc: "pp. 882-886"
    verbatim_quote: |
      Wikipedia/grokipedia/darkchamberz summary of Tablet I
      catalogue: "the first spreads terror, the second
      burns like fire, the third annihilates like a lion,
      the fourth fells mountains, the fifth encircles like
      wind, the sixth spares none, and the seventh slays
      with venom." Differentiation supported; see F-4 for
      precision-hedge recommendation.

  - claim_number: 11
    claim: "Sebitti urge Erra to action; weapons-growing-slack rhetoric."
    source_id: foster-2005
    source_loc: "pp. 884-888"
    verbatim_quote: |
      mostlydeadlanguages Erra I.45-90: "His weapons stayed
      put. ... Stand up like a man! ... Why do you stay in
      the city like a feeble old man? ... Get up, set forth
      on the road, do not idle in the city!" Supported.

  - claim_number: 12
    claim: "Išum counsels restraint in closing exchanges of Tablet I."
    source_id: foster-2005
    source_loc: "pp. 886-890"
    verbatim_quote: |
      Wikipedia s.v. Ishum / gatewaystobabylon: Išum
      throughout the poem is the figure of restraint, the
      "minister of fair words," repeatedly trying to dissuade
      Erra. Supported.

  - claim_number: 13
    claim: "Marduk's cult-statue pretext: statue grown dim, insignia tarnished, crown lost lustre."
    source_id: foster-2005
    source_loc: "pp. 890-894"
    verbatim_quote: |
      maniadelight.com verbatim: "His appearance is faded ...
      Lord of all the lands, your jewelry, like the stars of
      heaven, has gotten dirty." Britannica s.v. Erra:
      "Erra... persuaded Marduk to turn over the rule of the
      world to him while Marduk was having his royal
