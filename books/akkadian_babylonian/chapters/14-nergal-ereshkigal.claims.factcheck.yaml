        recognition" is not supported by this surviving text.
      - **Wikipedia ending (verbatim)**: "they impetuously
        entered the bedchamber" — the actual closing line of
        the Sultantepe recension as preserved.
      - **Ea's prohibitions (gatewaystobabylon, verbatim)**:
