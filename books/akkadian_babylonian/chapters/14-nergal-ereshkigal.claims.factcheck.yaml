findings:
  - finding_id: F-1
    claim_number: "claim 2 (line 33), claim 16 (line 152), and COMPARATIVE-HOOK at line 183 — the Late Bronze Amarna cluster"
    kind: FACTUAL-FABRICATION
    severity: HIGH
    claim: |
      "EA 357 was found alongside other Akkadian literary tablets
      in the Amarna archive — fragments of *Adapa*, *Etana*, the
      *King of Battle*, and miscellaneous lexical and educational
      material — and the cluster is itself an important witness
      to Akkadian's Late Bronze Age international circulation as
      a learned and diplomatic language." (line 33)
      Repeated at line 152: "*Nergal and Ereškigal*'s presence at
      Amarna — together with *Adapa*, *Etana*, the *King of
      Battle*, and lexical material..."
      Repeated at line 183 (COMPARATIVE-HOOK): "the Amarna
      recension of *Nergal and Ereškigal* is one of a cluster of
      Akkadian literary tablets preserved in Egypt's Amarna
      archive, alongside *Adapa*, *Etana*, the *King of Battle*,
      and miscellaneous lexical and educational material."
    issue: |
      *Etana* is NOT among the Amarna literary tablets. The
      attested Amarna mythological-literary cluster is:
      - EA 356: *Adapa and the South Wind*
      - EA 357: *Nergal and Ereshkigal*
      - EA 359: *Šar tamḫāri* / *King of Battle*
      Other miscellaneous lexical/literary fragments at Amarna
      (e.g., EA 340, EA 358, EA 375) do NOT include the Etana
      epic. *Etana* is preserved at Susa (OB version), Aššur,
      and Nineveh — but NOT at Amarna.
      This is a verifiable factual error repeated three times
      in the chapter as load-bearing context for the Late
      Bronze international-circulation argument.
      Severity HIGH because:
      (a) the claim is reproduced three times across the chapter
          as a structural anchor for the Late Bronze argument;
      (b) the claim is verifiably wrong against Wikipedia s.v.
          Amarna letters and against the Brill *Amarna Scholarly
          Tablets* edition's table of contents (EA 356/357/358/
          359 are the listed mythological-literary EA numbers,
          and Etana is not among them);
      (c) the error propagates into the COMPARATIVE-HOOK reserved
          for the influences chapter, where it would be carried
          forward into a downstream chapter unless caught here.
    evidence: |
      Wikipedia s.v. Amarna letters (read via WebFetch): EA 356
      = Adapa; EA 357 = Nergal and Ereshkigal; EA 359 = King of
      Battle. Etana is NOT listed.
      Brill's *The Amarna Scholarly Tablets* edition lists the
      mythological tablets as EA 356 (Adapa) and adjacent
      numbers; Etana is not among them.
      Independent confirmation: search for "Amarna Etana
      fragment" returns no scholarly attestation; Etana's
      attested manuscript witnesses are Susa (OB), Aššur, and
      Nineveh.
    recommended_fix: |
      REVISE at stage 13. Replace all three occurrences of
      "Adapa, Etana, the King of Battle" with "Adapa
      (EA 356), the King of Battle (Šar tamḫāri, EA 359), and
      miscellaneous lexical and educational material." Optionally
      cite the Brill edition (Izre'el 1997 *The Amarna Scholarly
      Tablets* — note: izreel-2001 is in sources.yaml; check
      whether that is the correct Izre'el or a different work)
      as the named-but-flagged authority for the Amarna
      literary cluster. The Late Bronze international-circulation
      argument is preserved with the corrected cluster (EA
      356/357/359 is itself sufficient evidence for the claim).

  - finding_id: F-2
    claim_number: "claim 12 (line 106) and the Sultantepe-recension narrative through the union scene"
    kind: FACTUAL-ERROR
    severity: HIGH
    claim: |
      "The two come together in passionate union for seven days
      and seven nights." (line 106)
      Echoed at line 113: "After seven days and seven nights of
      union with Ereškigal, Nergal escapes back to the upper
      world."
    issue: |
      The duration of Nergal and Ereškigal's union in the
      Sultantepe recension is **six days and six nights**, not
      seven. On the seventh day Anu intervenes (in the Sultantepe
      recension; in the Amarna ending the seventh day is when
      Nergal escapes while Ereškigal sleeps).
      Independently triangulated across four sources:
      - gatewaystobabylon (verbatim): "They lay there, queen
        Ereshkigal and Erra, for a first day and a second day"
        through "a sixth day. On the seventh day..." (Anu
        intervenes, in SB; Nergal escapes, in Amarna).
      - spokenpast: "six days and six nights" of union.
      - Wikipedia s.v. Nergal: "After six days he decides to
        leave while Ereshkigal is asleep."
      - encyclopedia.com s.v. Nergal: "lies with her for six
        days."
      The chapter's "seven days and seven nights" is a
      verifiable factual error. The number seven is the count
      of days at which the action turns (Anu's decree / Nergal's
      escape), but the union itself is six days and six nights.
      Severity HIGH because:
      (a) the union duration is a load-bearing narrative beat;
      (b) the "seven and seven" formula is a stock Mesopotamian
          unit-of-time and easily slips in by analogy to other
          compositions (e.g., the seven-day flood in Atra-ḫasīs/
          Gilgameš XI), but it is verifiably wrong here;
      (c) the error is repeated in the chapter (lines 106 and
          113), so it is a systematic error not a typo.
    evidence: |
      gatewaystobabylon (verbatim): "They lay there, queen
      Ereshkigal and Erra, for a first day and a second day...
      a sixth day. On the seventh day..." (the seventh day is
      when the action turns, not when the union continues).
      spokenpast: "Six days and six nights" of union; "On the
      seventh day, while she sleeps, he escapes back through
      the gates." Wikipedia: "After six days he decides to
      leave while Ereshkigal is asleep." encyclopedia.com:
      "lies with her for six days."
    recommended_fix: |
      REVISE at stage 13. Change both occurrences ("seven days
      and seven nights of union" at line 106; "After seven days
      and seven nights of union" at line 113) to "six days and
      six nights of union" / "After six days and six nights of
      union." The narrative function (extended union followed
      by Nergal's flight while Ereškigal sleeps; the action
      turns on the seventh day) is preserved with the correct
      numbers.

  - finding_id: F-3
    claim_number: "claim 14 (line 128) and the Amarna section (lines 73–74) — the hair-seizing motif's distribution"
    kind: INCOMPLETE-FRAMING
    severity: MEDIUM
    claim: |
      The chapter (line 128, in the Sultantepe second-descent
      section) states: "Nergal seizes Ereškigal by the hair,
      draws her down from her throne, and the two are reunited."
      The Amarna section (lines 73–75) says only that "the two
      gods come together, and Nergal is established as the
      underworld's co-ruler alongside Ereškigal" — no mention
      of the hair-seizing in the Amarna recension.
    issue: |
      The hair-seizing motif is verbatim-attested in BOTH
      recensions, not only in the Sultantepe second descent.
      gatewaystobabylon (verbatim Amarna): "Inside the house,
      he seized Ereshkigal / By her hair, pulled her from the
      throne / To the ground."
      spokenpast (verbatim, Amarna ending): "In the Amarna
      version, he returns prepared to kill her, seizes her by
      the hair and drags her from the throne, but she saves
      herself by offering him joint kingship over the
      underworld."
      The chapter's Amarna section (lines 73–75) elides this:
      it skips from "Nergal descends to the underworld" to "the
      two gods come together" and the etiological resolution.
      The dramatic moment at the heart of the Amarna recension
      — Nergal's violence, Ereškigal's plea for joint rule, and
      the conversion of conquest into marriage — is missing.
      This is the moment Wikipedia singles out as Amarna-
      distinctive ("Amarna includes Nergal's threat to kill
      Ereshkigal, which is absent from the other two copies");
      gatewaystobabylon attests the hair-seizing in both. The
      contestable claim is whether the hair-seizing is
      Amarna-distinctive or shared. Either way, the chapter's
      Amarna treatment is incomplete: the violence-and-plea
      moment is the recension's narrative climax and should
      be present.
      Severity MEDIUM because:
      (a) the chapter's Sultantepe SB framing is correct (the
          hair-seizing IS in the SB second descent);
      (b) but the Amarna recension's narrative is reduced to
          a vague "the two gods come together" gloss that
          omits its dramatic core;
      (c) Bottéro's well-known observation (cited at
          historyandmyths.com) that the Amarna resolves through
          violence and the Sultantepe through love-affair would
          be invisible from the chapter as written.
    evidence: |
      gatewaystobabylon Amarna (verbatim): "Inside the house, he
      seized Ereshkigal / By her hair, pulled her from the
      throne / To the ground." spokenpast Amarna (verbatim):
      "he returns prepared to kill her, seizes her by the hair
      and drags her from the throne, but she saves herself by
      offering him joint kingship over the underworld." Wikipedia
      s.v. Nergal: the Amarna version "includes Nergal's threat
      to kill Ereshkigal."
    recommended_fix: |
      REVISE at stage 13. Expand the Amarna recension paragraph
      (currently lines 73–75) to include the hair-seizing
      moment and Ereškigal's plea for joint rule as the Amarna
      recension's narrative climax. Suggested expansion: "In the
      Amarna recension, Nergal descends to the underworld and
      confronts Ereškigal directly. He seizes her by the hair,
      pulls her from her throne, and is on the point of killing
      her when she pleads for her life by offering him joint
      kingship of the underworld. He accepts; the two are
      married, and Nergal is established as the underworld's
      co-ruler alongside Ereškigal."
      Also revise the Sultantepe section (line 128) to clarify
      that the hair-seizing in the SB second descent parallels
      the Amarna ending but in the SB is followed by reunion
      rather than by an existential confrontation.

  - finding_id: F-4
    claim_number: "claim 15 (line 132) — the Sultantepe ending"
    kind: FACTUAL-FABRICATION
    severity: HIGH
    claim: |
      "The Sultantepe recension closes with a formal royal
      wedding and coronation. Nergal is established as
      Ereškigal's husband and co-ruler of the underworld; the
      divine assembly ratifies the union; Ereškigal addresses
      Nergal in formulae of formal recognition. The
      court-romantic register of the Sultantepe text closes with
      the ceremony of permanent installation: the war-god of the
      upper world has become the queen-of-the-underworld's
      consort by formal cosmic act." (line 132)
    issue: |
      The Sultantepe recension does NOT close with a "formal
      royal wedding and coronation." The surviving SB ending,
      as preserved on STT 28 + joins, consists of:
      - Anu's decree (most of which is broken / damaged on the
        tablet) containing the word "forever," establishing
        that Nergal is to remain forever in the Land of No
        Return to rule alongside Ereškigal;
      - the closing line "they impetuously entered the
        bedchamber" (Wikipedia's rendering of the
        immediate-narrative-closing image).
      There is NO formal wedding ceremony, NO coronation
      sequence, NO divine-assembly ratification scene, NO
      formulaic-recognition speech by Ereškigal. The chapter's
      claim is a FABRICATION at the level of recensional
      content.
      Severity HIGH because:
      (a) the "formal royal wedding and coronation" framing is
          load-bearing for the chapter's "Sultantepe court-
          romantic register" thesis;
      (b) the framing is verifiably wrong against the actual
          surviving SB ending;
      (c) the brief itself contains a less specific but still
          misleading framing ("the formal royal-wedding-and-
          coronation" in the brief's `alternates` field for the
          Sultantepe recension); see Recommendation below.
    evidence: |
      gatewaystobabylon (verbatim, on the SB ending): "No
      formal wedding ceremony is described. Instead, Anu 'made
      his voice heard' to his vizier with a message containing
      'Forever' and largely missing lines, establishing that
      Nergal 'is to remain forever in the Land of No Return to
      rule over it with Ereshkigal beside him.'"
      Wikipedia s.v. Nergal (verbatim): the non-Amarna versions
      "have a happy ending where the two deities seem to reunite
      and live happily ever after," concluding with "they
      impetuously entered the bedchamber."
      Independent confirmation in spokenpast and historyandmyths
      sources: the SB ending is Anu's decree of "forever" plus
      the bedchamber line; no formal-wedding ceremony.
    recommended_fix: |
      REVISE at stage 13. Replace the claim 15 paragraph (line
      132) with a paragraph that accurately reflects the
      surviving SB ending: "The Sultantepe recension closes
      with Anu's decree — much of which is damaged on the
      tablet — establishing that Nergal is to remain forever
      with Ereškigal as co-ruler of the underworld. The poem's
      final preserved line shows Nergal and Ereškigal entering
      the bedchamber together. There is no separate wedding-
      ceremony or coronation sequence in the surviving text;
      Anu's decree IS the ratification, and the bedchamber
      reunion IS the resolution." This preserves the
      court-romantic register thesis at line 137 while
      removing the fabrication.
      ALSO: flag the brief's `alternates` field at line 42
      (which says "the formal royal-wedding-and-coronation")
      as a brief-writer's framing the round-1 fact-check
      contradicts; recommend the brief be updated at stage 13
      or stage 14 to remove the "royal-wedding-and-
      coronation" language.

  - finding_id: F-5
    claim_number: "claim 9 (line 96) — Ea's prohibitions catalogue, the 'looking' item"
    kind: TRANSLATION-VARIANCE
    severity: LOW-MEDIUM
    claim: |
      "Foremost among Ea's instructions is a warning against
      accepting any of the underworld's offerings: he is not to
      sit on the chair offered to him, not to eat the food, not
      to drink the beer, not to wash his feet in the water, not
      to look upon the bathing Ereškigal — for any of these will
      bind him to the underworld permanently."
    issue: |
      The first four prohibitions (chair / food / beer / water)
      are verbatim-attested in the Sultantepe recension across
      all consulted sources. The fifth prohibition is variously
      rendered:
      - encyclopedia.com s.v. Nergal: "not to look lustfully
        upon Ereshkigal" — supports the chapter's "looking"
        rendering.
      - gatewaystobabylon (verbatim Sultantepe): "When she
        (Ereshkigal) has been to the bath, / And dressed
        herself in a fine dress... / You must not [do] that
        which men and women do" — the prohibition is on sex,
        with the bathing as the moment of vulnerability.
      - spokenpast: "not to sleep with the queen" — supports
        the gatewaystobabylon reading.
      The chapter follows what is presumably Foster's
      "looking" rendering, which collapses the bathing-prelude-
      then-sex-prohibition into a single "looking-upon-the-
      bathing" prohibition. This is a defensible translator's
      gloss (the bathing scene is the moment the prohibition
      breaks; whether the breaking-act is "looking" or
      "doing-what-men-and-women-do" depends on translation
      tradition); but the chapter does not hedge or alert the
      reader to the variance.
      Severity LOW-MEDIUM because:
      (a) the bathing-scene-as-the-failure-point is verbatim-
          attested and the chapter's narrative function
          (Nergal's stratagem fails when the bathing prohibition
          breaks) is correct;
      (b) the precise lemma of the prohibition (looking vs.
          sexual congress) is genuinely contested across
          translations;
      (c) Foster's "looking" reading is genre-standard in the
          dossier and the chapter is on defensible ground;
      (d) but the silence on the variance is a small honesty
          gap.
    evidence: |
      encyclopedia.com (verbatim): "no throne, no food, and no
      drink, but above all not to look lustfully upon
      Ereshkigal." gatewaystobabylon (verbatim Sultantepe): "You
      must not [do] that which men and women do." Both
      readings are independently attested; the chapter follows
      one without acknowledging the other.
    recommended_fix: |
      LIGHT-FIX at stage 13. Either (a) hedge the chapter's
      "looking" reading: "not to look upon the bathing
      Ereškigal (or, in some translations, not to lie with
      her after she has bathed) — for any of these will bind
      him to the underworld permanently"; or (b) cite Foster
      2005's translator's note explicitly for the "looking"
      rendering. The narrative function is preserved either
      way; only the lemma needs cite-tightening.

