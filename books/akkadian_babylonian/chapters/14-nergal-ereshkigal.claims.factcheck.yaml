      encyclopedia.com ("lies with her for six days").
      Independently triangulated across four sources. The
      chapter's "seven days and seven nights" (line 106) is a
      VERIFIABLE FACTUAL ERROR. See Finding F-2 (HIGH).
      (9) **No formal royal wedding and coronation in the
      Sultantepe ending** — confirmed via gatewaystobabylon
