      hair-seizing is also present in the Amarna recension,
      where Wikipedia and other sources identify it as the
      Amarna-specific climactic moment that "is absent from the
      other two copies" (per Wikipedia). The Wikipedia reading
      is contestable against the gatewaystobabylon reading
      (which finds the motif in both). The chapter's silence
      on this in the Amarna section is a misalignment with the
      Amarna-specific reading reported by Wikipedia. See
      Finding F-3 (MEDIUM).
      (8) **Six days and six nights of union (NOT seven)** —
      confirmed via gatewaystobabylon (verbatim: "for a first
      day and a second day...a sixth day. On the seventh day,
      Anu intervenes"); spokenpast ("six days and six nights");
