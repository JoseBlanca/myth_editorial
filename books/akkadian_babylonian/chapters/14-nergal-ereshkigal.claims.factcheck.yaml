      article extract, gatewaystobabylon, and Wikipedia s.v.
      Nergal. The chapter's "fourteen apotropaic demons" is
      SUPPORTED. The chapter's "seven gates as entry points,
      not stripping points" is SUPPORTED (contrast with the
      Descent-of-Ishtar stripping-points is correct).
      (7) **Hair-seizing motif** — verbatim attestations in
      BOTH Amarna and Sultantepe at gatewaystobabylon. The
      chapter's framing locates this motif specifically in the
      "Sultantepe second descent" and contrasts the
      "cautious/equipped first descent" with the "impassioned
