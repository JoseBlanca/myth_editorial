      'made his voice heard'... establishing that Nergal 'is to
      remain forever in the Land of No Return to rule over it
      with Ereshkigal beside him'") and via Wikipedia ("the two
      deities seem to reunite and live happily ever after,
      concluding with 'they impetuously entered the
      bedchamber'"). The Sultantepe ending is preserved at the
      level of Anu's decree (much of which is broken) and the
      bedchamber line. The chapter's claim that "the
      Sultantepe recension closes with a formal royal wedding
      and coronation. Nergal is established as Ereškigal's
