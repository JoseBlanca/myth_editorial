        Ereshkigal / By her hair, pulled her from the throne /
        To the ground."
      - The Sultantepe version repeats this in nearly identical
        language: "He seized her by her hairdo, / And pulled her
        from the throne." — i.e., the hair-seizing motif is
        present in BOTH recensions, NOT only in the SB second
        descent.
      - "They lay there, queen Ereshkigal and Erra, for a first
