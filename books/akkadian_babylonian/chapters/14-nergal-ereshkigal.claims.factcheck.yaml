# ── Verdict and recommended action ─────────────────────────────────────────

verdict_summary:
  verdict: BLOCK
  rationale: |
    Chapter 14 (Nergal and Ereškigal) round-1 factcheck:
    VERDICT BLOCK.

    Of 19 prose claims and 65 EVIDENCE tokens audited, 14
    claims are SUPPORTED, but FIVE findings issue: 3 HIGH,
    1 MEDIUM, 1 LOW-MEDIUM. The three HIGH-severity findings
    are independent of one another and each affects a
    load-bearing element of the chapter's narrative spine:

    - F-1 (FACTUAL-FABRICATION, HIGH): the Amarna literary
      cluster is given as "*Adapa*, *Etana*, the *King of
      Battle*, and miscellaneous lexical and educational
      material" THREE times in the chapter (lines 33, 152,
      and the COMPARATIVE-HOOK at line 183). *Etana* is NOT
      among the Amarna literary tablets — the attested cluster
      is EA 356 (Adapa), EA 357 (Nergal), EA 359 (King of
      Battle), and miscellaneous fragments without Etana.
      Etana's witnesses are Susa, Aššur, and Nineveh — never
      Amarna. Verifiable error, repeated three times.

    - F-2 (FACTUAL-ERROR, HIGH): the duration of Nergal and
      Ereškigal's union is given as "seven days and seven
      nights" (lines 106 and 113). The actual surviving SB
      text reports six days and six nights of union, with
      the action turning on the seventh day (when Anu
      intervenes / Nergal escapes). Independently triangulated
      across four sources (gatewaystobabylon verbatim;
      spokenpast; Wikipedia; encyclopedia.com).

    - F-4 (FACTUAL-FABRICATION, HIGH): the Sultantepe ending
      is described as "a formal royal wedding and coronation"
      with "the divine assembly ratif[ying] the union" and
      "Ereškigal address[ing] Nergal in formulae of formal
      recognition" (line 132). The actual surviving SB ending
      consists of Anu's decree (much of which is damaged on
      the tablet) containing the word "forever" plus the
      closing line about Nergal and Ereškigal entering the
      bedchamber. No formal wedding ceremony, no coronation
      sequence, no divine-assembly ratification scene, no
      formal-recognition speech are preserved. The "royal
      wedding and coronation" framing is a fabrication at
      the recensional-content level, and it is reproduced
      from a misleading framing in the brief's `alternates`
      field (see Note N-2).

    - F-3 (INCOMPLETE-FRAMING, MEDIUM): the hair-seizing
      motif is verbatim-attested in BOTH recensions; the
      chapter's Amarna section omits the recension's
      narrative climax (the Nergal-violence / Ereškigal-plea-
      for-joint-rule moment) and the Sultantepe section
      treats the hair-seizing as if it were SB-distinctive.
      Bottéro's well-known violence-vs-love-affair contrast
      between the two recensions would be invisible from the
      chapter as written.

    - F-5 (TRANSLATION-VARIANCE, LOW-MEDIUM): the "not to
      look upon the bathing Ereškigal" prohibition follows
      Foster's translator's gloss but is contested in the
      verbatim Sultantepe text (which reads "you must not
      [do] that which men and women do"). The chapter is on
      defensible ground but should hedge.

    No contamination from the Sumerian *Inanna's Descent*
    detected. No glossary violations. No silent bridges. The
    INFERENCE / LACUNA / RECONSTRUCTION / VARIANT /
    COMPARATIVE-HOOK marker discipline is correct. The
    audit-A9 correction (STT 28 + joins) is appropriately
    incorporated. The named-but-flagged citation policy for
    Gurney 1960 is correctly applied.

    HOWEVER: the combination of F-1 (Etana fabrication
    repeated three times in load-bearing context), F-2 (a
    verifiably wrong number for the union duration that is
    repeated twice), and F-4 (a fabricated royal-wedding-and-
    coronation closing scene) means the chapter cannot proceed
    to stage 13 with light fixes. Two of these are
    fabrications, not framings. The chapter requires a
    targeted revision (round-2 rewrite of three paragraphs
    and the COMPARATIVE-HOOK) and a brief-update (Note N-2)
    before the chapter-draft stage. The brief itself contains
    a misleading "formal royal-wedding-and-coronation"
    framing at line 42 that should be corrected as part of
    the same revision pass.

  recommended_downstream_action: |
    BLOCK and route to BRIEF UPDATE + ROUND-2 REWRITE.
    Specifically:

    (1) Update the brief at /workspace/books/akkadian_babylonian/
        briefs/14-nergal-ereshkigal.yaml: change line 42's
        `alternates` field "the formal royal-wedding-and-
        coronation" to "the formal closing scene of Anu's decree
        of permanent installation followed by the deities
        entering the bedchamber together" (or a similarly
        accurate framing).

    (2) Round-2 rewrite of three paragraphs and one
        COMPARATIVE-HOOK in the claims document:
        - Lines 33 and 152: remove "*Etana*" from the Amarna
          cluster list; keep "*Adapa* (EA 356), *King of Battle*
          (EA 359), and miscellaneous lexical and educational
          material."
        - Line 183 (COMPARATIVE-HOOK): same correction.
        - Lines 106 and 113: change "seven days and seven
          nights" to "six days and six nights." The action
          still turns on the seventh day (Anu's intervention
          in SB; Nergal's flight in Amarna).
        - Line 132: rewrite the Sultantepe ending paragraph
          to reflect the actual surviving ending (Anu's decree
          of "forever" plus the bedchamber line). Remove the
          "formal royal wedding and coronation," "divine
          assembly ratifies the union," and "Ereškigal addresses
          Nergal in formulae of formal recognition" claims.
        - Lines 73–75 (Amarna section): expand to include the
