          as the Amarna recension's narrative climax. Address
          F-3.
        - Line 96: hedge the "looking" prohibition or cite
          Foster's translator's note (F-5).

    (3) After the brief update and the rewrite, re-run a
        focused round-2 fact-check on the corrected paragraphs
        (the chapter-7 / chapter-12 pattern) before proceeding
        to stage 13 (post-human-normalize).

    The chapter's overall structure, source coverage, marker
    discipline, audit-A9 incorporation, and glossary
    compliance are sound. The five findings are localised
    to specific narrative beats, not to the chapter's
    organising framework. A targeted revision can address
