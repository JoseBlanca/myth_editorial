    q2_every_paragraph_checked_for_additions: |
      Yes — every body paragraph (draft lines 4, 7, 12, 15, 25, 29, 38, 41,
      46, 53, 58, 65, 69, 79, 85, 89) and every marker block (lines 19, 21,
      34, 49, 73, 77) was checked against the claims document. Two minor
