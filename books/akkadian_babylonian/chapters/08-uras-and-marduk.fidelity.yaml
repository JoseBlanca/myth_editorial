      creates plant life for Urash" narrative shape is preserved without
      elaboration — the draft does not invent specific plants, sequences, or
      cultic purposes beyond what the claims (and Lambert 2013) preserve.
      All three INFERENCE blocks remain INFERENCE-marked in the draft (lines
      34, 49, 73), with basis and risk fields preserved verbatim. The
      LACUNA (line 19), RECONSTRUCTION (line 21), and VARIANT (line 77)
      markers preserve their subfield structure (source/scholarly_recon-
      struction; gap_source/fill_source/confidence; primary/alt/chosen/
