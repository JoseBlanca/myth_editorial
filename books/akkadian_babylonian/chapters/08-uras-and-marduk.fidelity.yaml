round_2_factcheck_corrections:
  - correction_id: F-R2-1
    description: "Foster 2005 page range corrected from 'pp. 436–440' to 'pp. 487 ff. (Myths of Origins)' — the original range pointed to start of Enūma Eliš section, not the cosmogonic sub-section."
    narrative_status: APPLIED
    detail: |
      All Foster 2005 references in the draft cite "pp. 487 ff." with the
      sub-section "Myths of Origins" identifier:
      — draft line 41 (footnote): "Foster 2005, pp. 487 ff. (the 'Myths of Origins' sub-section, including 'Marduk, Creator of the World', 'The Myth of the Plow', 'Creation of Humankind', 'Providing for the Gods')."
      — draft line 44 (EVIDENCE): "source_id=foster-2005 ; loc=pp. 487 ff. ('Myths of Origins')"
      — draft line 49 (INFERENCE basis): "Foster 2005 pp. 487 ff. ('Myths of Origins') collects 'Marduk, Creator of the World' (p. 487), 'The Myth of the Plow' (p. 489), 'Creation of Humankind' (p. 491), 'Providing for the Gods', 'Creation of Sun and Moon', 'Creation of the King'"
      — draft line 94 (COMPARATIVE-HOOK): same page-range in body of the hook.
      No "pp. 436–440" appears anywhere in the draft.
  - correction_id: F-R2-2
    description: "Marduk Ordeal (Livingstone 1989, SAA 3 nos. 34–35) and Marduk's Address to the Demons (Lambert AfO 17 1954–56; Geller 2016 Udug-hul Tablet 11) are different compositions; the conflation has been resolved."
    narrative_status: APPLIED
    detail: |
      Draft line 53 (body) cites only the Marduk Ordeal: "the *Marduk Ordeal* (Livingstone 1989, SAA 3 nos. 34–35) develops the syncretism further within the cultic-narrative register". The Marduk's Address is mentioned only in COMPARATIVE-HOOK 1 (draft line 93), where it is explicitly identified as "a separate composition originally published by W. G. Lambert in *Archiv für Orientforschung* 17 (1954–56) and re-edited by M. J. Geller as Udug-hul Tablet 11 in *Healing Magic and Evil Demons* (De Gruyter, 2016)" and flagged as "outside SAA 3 and is not currently in this book's `sources.yaml`". No conflation.
  - correction_id: F-R2-3
    description: "'Marduk of planting' equation: Black & Green 1992 s.v. Urash retained, supplemented with Lambert 2013 pp. 264–265 (Enūma Eliš Tablet VII fifty-names commentary)."
    narrative_status: APPLIED
    detail: |
      Lambert 2013 pp. 264–265 cited as the locus of the equation in:
      — INFERENCE-1 basis (draft line 34): "the late-Babylonian commentary equation 'Urash = Marduk of planting' is articulated within the *Enūma Eliš* Tablet VII fifty-names commentary at Lambert 2013, pp. 264–265"
      — body footnote draft line 53: "Lambert 2013, pp. 1–277 (*Enūma Eliš* Tablet VII fifty-names sequence and commentary; the 'Marduk of planting' equation is articulated at pp. 264–265)"
      — body footnote draft line 58: "the underlying 'Marduk of planting' equation articulated in the *Enūma Eliš* Tablet VII fifty-names commentary at Lambert 2013 pp. 264–265"
      — COMPARATIVE-HOOK 1 (draft line 93): "with the Urash equation at pp. 264–265".

