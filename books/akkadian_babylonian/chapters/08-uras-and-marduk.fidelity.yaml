      factcheck citation-routing fixes (Foster 2005 pp. 487 ff.; Marduk
      Ordeal vs. Marduk's Address resolution; "Marduk of planting" Lambert
      2013 pp. 264–265 supplementation) are all preserved in the draft's
      footnotes and COMPARATIVE-HOOK comments verbatim.
