      creation legend, describes the creation of man and animals
      (by Marduk with the aid of Aruru), as well as the creation
      of the rivers Tigris and Euphrates, of land and plants, as
      well as the first houses and cities". British Museum
      collection database verbatim: BM 1882,0522.1048 = BM 93014,
      "fragment of a clay tablet, bilingual creation story, Late
      Babylonian period". The single-manuscript / bilingual /
      late-Babylonian / city-river-mankind cosmogony framing is
      fully corroborated.

  - claim_number: 2
