    claim: |
      "*The Founding of Eridu* is a short bilingual Sumerian-Akkadian
      incantation prologue that narrates Marduk's creation of the
      primordial cities, the rivers, and humankind. The composition is
      preserved on a single manuscript, BM 93014 (British Museum), in
      the bilingual scribal tradition of late-Babylonian temple-
      scholarly compositions."
    source_id: lambert-2013
    source_loc: "Lambert 2013 pp. 366–375"
    verbatim_quote: |
      Lambert 2013 TOC PDF (verbatim): "The Founding of Eridu 366;
      The First Brick 376" — directly confirms pp. 366–375 as the
      page span for "The Founding of Eridu", validating the brief's
      preemptive correction from the wrong pp. 376–383.
