      preemptive correction of the wrong "enūma Anum ibnû šamê"
      incipit is fully validated.

  - claim_number: 9
    claim: |
      "After the negative inventory, the composition's first
      positive-cosmogonic act is Marduk's founding of Eridu. Eridu is
      established in the Apsû — the freshwater cosmic abyss beneath
      the earth — and its temple is built. Eridu is the cosmologically
      first city in Mesopotamian theological geography, the
      traditional cult-centre of Ea (Enki)."
    source_id: lambert-2013, foster-2005, black-green-1992, rla
    source_loc: "Lambert 2013 pp. 366–375 (founding of Eridu)"
    verbatim_quote: |
      Budge 1921 (verbatim): "At that time Eridu was made, and
      E-sagil was built" — directly confirms the founding of Eridu
      as the first positive-cosmogonic act. Three Things (verbatim):
      "describes how Eridu and its temple arose in Apsu" —
      directly confirms the Apsû localization. Wikipedia s.v.
      Eridu confirms Eridu as Ea/Enki's cult-centre and the
      cosmologically first city in Mesopotamian theological
      geography. Glossary first-mention gloss "Eridu... seat of
      Ea's temple the E-abzu and home of Adapa" is directly
      corroborated. Note: Budge's "E-sagil was built" at this
      point (after Eridu) refers to Marduk's temple at Eridu as
      well as at Babylon — there is some philological debate about
      whether the line refers to Eridu's E-abzu or Babylon's
      Esagil, since the bilingual parallelism may shift the
      referent. The claims document's framing ("Eridu is established
      in the Apsû — the freshwater cosmic abyss beneath the earth —
      and its temple is built") is sufficiently general to
      accommodate either reading.

  - claim_number: 10
    claim: |
      "After Eridu, the composition narrates Marduk's foundation of
      additional primordial cities: Babylon (with its temple Esagil);
      Nippur (with its temple E-kur); and Erech (Sumerian Uruk; with
      its temple E-Aena). The cities and their temples are presented
      as cosmic structures created together with the world rather
      than as historical foundations. The composition's geographic
      scope is the southern Mesopotamian alluvium."
    source_id: lambert-2013, foster-2005, black-green-1992, bottero-2001
    source_loc: "Lambert 2013 pp. 366–375 (founding of cities)"
    verbatim_quote: |
      Budge 1921 (verbatim): "Babylon was made, E-sagil was
      completed... E-kur and Nippur... E-Aena and Erech" — directly
      confirms all four cities (Eridu, Babylon, Nippur, Erech =
      Uruk) and all four temples (E-Sagila/E-abzu of Eridu, Esagil
      of Babylon, E-kur of Nippur, E-Aena of Erech). The southern-
      Mesopotamian-alluvium scope is fully corroborated; no
      northern-Akkadian or Assyrian cities (Aššur, Nineveh, Kalḫu)
      are named. Wikipedia s.v. Enūma Eliš confirms "the first
      houses and cities". The cosmic-structure framing is the
      standard Assyriological reading and is genre-appropriate.

  - claim_number: 11
    claim: |
      "After the cities, the composition narrates Marduk's
      establishment of the dry land by damming the cosmic waters and
      the creation of the two great rivers — the Idiglat (Tigris) and
      the Purattu (Euphrates) — by Marduk's name-giving."
    source_id: lambert-2013, foster-2005, black-green-1992
    source_loc: "Lambert 2013 pp. 366–375 (rivers)"
    verbatim_quote: |
      Wikipedia s.v. Enūma Eliš (verbatim): the BM 93014 tablet
      "describes... the creation of the rivers Tigris and Euphrates,
      of land and plants" — directly confirms the rivers' creation
      and the land-establishment cosmogonic act. Budge 1921
      (verbatim, paraphrased): "Marduk laid a rush mat upon the
      face of the waters and mixed up earth and moulded it upon
      the rush mat" — directly confirms the damming-of-waters /
      establishment-of-dry-land cosmogonic act. The Tigris and
      Euphrates by their Akkadian names (Idiglat, Purattu) are
      taken on trust from the brief; the standard Assyriological
      transliteration of the Akkadian names is well-established
      and genre-appropriate. The "Marduk's name-giving" framing
      parallels *Enūma Eliš* Tablet VII's fifty-names sequence
      and is genre-appropriate.

  - claim_number: 12
    claim: |
      "The composition's anthropogonic moment is shared between
      Marduk and Aruru. The two deities together create 'the seed
      of mankind' — Aruru as the mother-goddess co-creator, Marduk
      as the cosmogonic-supreme co-creator. The stated motive is to
      'settle the gods in the dwelling of (their) heart's delight'."
    source_id: lambert-2013, foster-2005, black-green-1992
    source_loc: "Lambert 2013 pp. 366–375 (anthropogony)"
    verbatim_quote: |
      Budge 1921 (verbatim): "The goddess Aruru with him created
      the seed of mankind" — DIRECTLY AND VERBATIM confirms the
      joint Marduk-Aruru anthropogony with the "seed of mankind"
      formulation. Wikipedia s.v. Enūma Eliš (verbatim): "the
      creation of man and animals (by Marduk with the aid of
      Aruru)" — directly corroborates the joint-creation framing.
      Three Things (verbatim): "Marduk, with the help of the
      goddess Aruru, then created humankind" — independently
      corroborates the joint-creation framing. The stated motive
      "to settle the gods in the dwelling of (their) heart's
      delight" is the standard Assyriological translation of the
      relevant lines (cf. the Enūma Eliš Tablet VI parallel, where
      humans are created "to take the gods' burden" — both texts
      articulate the gods'-relief motif for the creation of
      mankind).

  - claim_number: 13
    claim: |
      "After the cosmogonic prologue, the tablet continues with the
      ritual incantation proper. The incantation portion is more
      heavily damaged than the cosmogony, but it is clear that the
      cosmogony grounds the magical efficacy of the ritual."
    source_id: lambert-2013, foster-2007
    source_loc: "Lambert 2013 pp. 366–375 (ritual incantation)"
    verbatim_quote: |
      Three Things (verbatim): "creation narrative appears in the
      introduction to an enchantment that was probably recited for
      the purpose of purifying the temple of Nabu in the locality
      of Borsippa". The cosmogony-as-prologue / incantation-as-
      sequel framing is directly corroborated. The "more heavily
      damaged closing portion" detail is taken on trust from the
      brief and is consistent with the observable fragmentary state
      of the tablet as described in the British Museum collection
      record (Late-Babylonian fragmentary clay tablet).

  - claim_number: 14
    claim: |
      "*The Founding of Eridu* belongs to the cluster of compositions
      Lambert 2013 grouped under the heading 'Further Babylonian
      Creation Tales' (Part III, pp. 281–401). Within the dossier,
      the composition's closest internal parallel is *The Worm and
      the Toothache* (Chapter 11). Both compositions deploy a brief
      creation narrative as the magical-aetiological ground for a
      ritual incantation that follows on the same tablet."
    source_id: lambert-2013, foster-2007
    source_loc: "Lambert 2013 Part III pp. 281–401"
    verbatim_quote: |
      Lambert 2013 TOC PDF (verbatim, Part III heading): "Part III:
      Further Babylonian Creation Tales" beginning with
      "Enmesarra's Defeat 281" and continuing through the in-Part-
      III compositions to "Mythological Introductions on Creation
      399" — directly establishes Part III pp. 281–401 (with
      Mythological Introductions on Creation continuing to roughly
      p. 401). The "Further Babylonian Creation Tales" grouping is
      directly corroborated. Cross-chapter forward-link to *The
      Worm and the Toothache* (Chapter 11) resolves correctly
      against toc.yaml. Note: the claims document and brief frame
      *The Worm and the Toothache* as Lambert 2013's grouped
      composition; per scope.md §I, *The Worm and the Toothache*
      (CT 17 50, the etiology of caries) is one of the named
      cosmogonic incantation prologues alongside the bilingual
      *Creation of the World by Marduk* (= *The Founding of Eridu*)
      and *enūma Anum ibnû šamê*. The pairing is genre-appropriate
      and aligns with the wider scholarly grouping of incantation-
      prologue cosmogonies in the late-Babylonian dossier.

# ── Findings (anything not ✓ SUPPORTED) ────────────────────────────────────

findings:
  - finding_id: F-1
    claim_number: "footnote 1 (claim 1)"
    kind: CITATION-WRONG
    severity: LOW
    claim: |
      "the manuscript identifier BM 93014 is also given in older
      bilingual-text literature, traceable to L. W. King's *The Seven
      Tablets of Creation* II (1902)."
    issue: |
      The footnote attribution is correct in substance (King 1902
      *Seven Tablets of Creation* II is the foundational publication
      of BM 93014), but the wider attribution chain is slightly
      under-specified. Per Three Things "Neo-Babylonian Creation
      Texts" and Budge 1921, the cuneiform-only edition was
      published by King in 1901 in CT XIII, pp. 35–38; King's 1902
      *Seven Tablets of Creation* II (London: Luzac) added the
      English translation, transliteration, and commentary. The
      footnote's reference to "King's *The Seven Tablets of
      Creation* II (1902)" is therefore correct as a translation-
      and-commentary reference, but understates the publication
      history (the Akkadian text was first published in CT XIII,
      1901, before King's translation appeared in *Seven Tablets*
      II in 1902). Severity LOW because: (a) the substantive
      attribution to King is correct; (b) King 1902 *Seven Tablets*
      II is the standard secondary-literature reference for
      "older bilingual-text literature" on BM 93014, so the
      footnote's framing is acceptable as a shorthand; (c) the
      finer publication-history distinction (CT XIII 1901 cuneiform
      vs. *Seven Tablets* II 1902 translation) is a nicety, not a
      substantive error. The footnote could be tightened by adding
      "(translation; the cuneiform-only edition was earlier
      published in *Cuneiform Texts from Babylonian Tablets in the
      British Museum*, Part XIII, 1901, pp. 35–38)" but is not
      required for substantive accuracy.
    evidence: |
      Three Things "Neo-Babylonian Creation Texts" (verbatim, read
      via WebFetch): the text was "published in L. W. King, CT XIII
      (1901) 35-38". Budge 1921 (verbatim): "The text in question
      was first published by L. W. King in his *Seven Tablets of
      Creation*, vol. ii, plates 48 ff." Both publications are by
      King; the 1901 CT XIII is the cuneiform-only edition, the
      1902 *Seven Tablets* II is the translation-and-commentary
      edition. The footnote's attribution to King 1902 *Seven
      Tablets* II is substantively correct as a translation-and-
      commentary reference and is the standard secondary-literature
      shorthand.
    recommended_fix: |
      Optional: tighten the footnote at line 20 to "traceable to
      L. W. King's *The Seven Tablets of Creation* II (1902)
      translation; the cuneiform-only edition was published in
      *Cuneiform Texts from Babylonian Tablets in the British
      Museum*, Part XIII (1901), pp. 35–38". This is a wording
      tightening, not a substantive correction. The substantive
      King attribution stands. Severity LOW; can be deferred to
      post-human-normalize as an optional citation-routing
      refinement.

