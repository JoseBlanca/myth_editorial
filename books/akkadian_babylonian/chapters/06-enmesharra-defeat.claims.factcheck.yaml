supported_claims:
  - claim_number: 1
    claim: "*Enmešarra's Defeat* is a fragmentary first-millennium Babylonian theogonic-cosmogonic composition that narrates Marduk's defeat of the chthonic god Enmešarra and his seven sons."
    source_id: lambert-2013
    source_loc: "pp. 281–298"
    verbatim_quote: |
      "The myth Enmesharra's Defeat... describes a conflict between
      Enmesharra and Marduk... [it] casts Nergal as the warden of the
      eponymous antagonist and his seven sons, the Sebitti, presumably
      imprisoned in the underworld" (Wikipedia s.v. Enmesharra, citing
      Lambert 2013). The Marduk Wikipedia article: "Enmesharra and his
      seven sons going against Marduk, who subsequently defeated them
      and threw them into jail." The fragmentary, theogonic-cosmogonic,
      and Marduk-vs-Enmešarra-and-sons elements are all directly
      attested. NOTE per F-1: the "first-millennium Babylonian" date
      framing is broadly correct but the standard secondary literature
      reports the surviving tablet as Seleucid or Parthian (i.e., late
      first-millennium / early Hellenistic), which is more specific
      than "first-millennium Babylonian" and is not what the brief and
      chapter assert about manuscript groups.

