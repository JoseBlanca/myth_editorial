# ── Pass 3: Document-provenance contamination scan ─────────────────────────

contamination_scan:
  result: "no contamination found"
  rationale: |
    All factual details about *Enmešarra's Defeat* and Enmešarra
    himself trace to Akkadian-language sources within the scope's
    date range (Akkadian cuneiform tradition, ca. 2300 BCE – 100 BCE).
    Specifically:
    - The single-tablet attestation (per F-1's secondary-source
      consensus) is Seleucid/Parthian-period Akkadian — within scope.
    - The earlier god-list and incantation attestations of Enmešarra
      are Akkadian and within scope.
    - KAR 143 + 219 (the Marduk Ordeal text, claim 14) are Neo-
      Assyrian Akkadian tablets from Aššur — in scope as Akkadian-
      language compositions, though the genre-exclusion question
      (Marduk Ordeal as a cultic commentary) is borderline. Per
      scope.md, "Omen series, rituals, incantations, lexical texts,
      and astronomical/astrological compendia... excluded unless
      an individual composition contains substantial embedded
      narrative." The Marduk Ordeal is cultic commentary in form
      but contains substantial embedded passion-narrative about
      Marduk; its citation here is comparative (it is brought in
      to illuminate the ritual context of Enmešarra's Defeat,
      not retold as a primary source), so the genre boundary is
      respected.
    - The Hurro-Hittite Kumarbi-cycle and Greek Titanomachy
      parallels appear ONLY as COMPARATIVE-HOOK comments at the
      foot of the chapter and are forwarded to the influences
      chapter. No EVIDENCE token routes through Hoffner 1998;
      no out-of-scope content is retold. Correct.
    - The seven-sons motif and the Sebitti/apkallu cross-
      references are all internal to the Akkadian tradition
