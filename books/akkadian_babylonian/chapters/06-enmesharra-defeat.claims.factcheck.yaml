# ── Verdict reasoning ──────────────────────────────────────────────────────

verdict_reasoning: |
  Verdict rules from the skill: MAJOR-REVISE = ≥3 HIGH or any
  contamination or fabricated references; REVISE = 1–2 HIGH or >3
  MEDIUM or any silent bridge; PASS = 0 HIGH and 0 silent bridges
  and ≤3 MEDIUM. This audit finds 1 HIGH finding (F-1: the
  manuscript-count framing — multiple manuscript groups vs. single
  Seleucid/Parthian tablet), 5 MEDIUM (F-2: KAR 143/219 connection
  to Enmešarra's Defeat needs direct verification; F-3: Tablet of
  Destinies transfer not attested in surviving text per secondary
  consensus; F-4: combat narrative is not preserved, only judgment
  and execution; F-5: collective-antagonist framing correct but
  combat framing wrong; F-6: parallel-composition INFERENCE marker
  presupposes combat narrative that is not preserved), and 3 LOW
  (F-7: Foster 2005 table of contents not directly verified; F-8:
  claim 19 should be marked inferential).

  Per the verdict rules, 1 HIGH + 5 MEDIUM = REVISE (the threshold
  for MAJOR-REVISE is ≥3 HIGH or any contamination or fabricated
  references; none of these triggers fire). Verdict: REVISE.

  The findings cluster around two structural issues that are
  upstream-traceable to the brief: (1) the manuscript-count framing
  (F-1, with downstream effects on F-6, the LACUNA / RECONSTRUCTION
  / VARIANT marker integrity, and several of the supporting claims);
  (2) the combat-vs-aftermath framing (F-4, F-5, F-6, with
  downstream effects on the central narrative claims and the
  parallel-composition inference). Both issues require direct
  verification against Lambert 2013 pp. 281–298 to resolve. The
  chapter writer faithfully implemented the brief — the failures
  are not in the writing but in the brief's underlying claims about
  manuscript count and surviving narrative content.

  Recommendation for the human review pass: open Lambert 2013
  pp. 281–298 directly and answer four questions: (a) how many
  manuscripts/tablets does Lambert score? Are they Babylonian +
  Assyrian, or a single Seleucid/Parthian tablet? (b) Does the
  surviving text preserve the combat scene, or only the
  judgment-execution-redistribution aftermath? (c) Does the surviving
  text mention the Tablet of Destinies transfer, or only the
  radiance transfer to Šamaš and the office redistribution? (d) Does
  Lambert 2013 explicitly connect the composition to KAR 143 + 219
  (the Marduk Ordeal), or to the Akītu more generally? The answers
  to these four questions will determine whether the chapter
  requires structural rewriting (manuscript-count + combat-framing
  reframes) or only local edits (terminology around radiance vs.
  Tablet of Destinies; KAR 143/219 framing as Marduk Ordeal text
  vs. commentary).

  If subsequent direct verification confirms that (a) the
  composition is on a single Seleucid/Parthian tablet, (b) the
  combat is not preserved, and (c) the Tablet of Destinies transfer
  is not attested, the verdict escalates to MAJOR-REVISE because
  the chapter's claims would then materially mis-represent the
  surviving text on multiple central points. Conversely, if Lambert
  2013 attests multiple manuscript groups + the combat narrative +
  the Tablet of Destinies transfer (i.e., if the secondary
  literature has under-reported these elements), the verdict can
  be downgraded to PASS-with-notes. The REVISE verdict is the
  middle path that flags the discrepancies for direct verification
  without committing to either resolution.
