findings:
  - finding_id: F-1
    claim_number: 4
    kind: UNVERIFIED
    severity: HIGH
    claim: |
      "The manuscripts are first-millennium Babylonian and Neo-Assyrian
      copies. They form several manuscript groups that largely agree on
      the composition's narrative but differ in detail — particularly
      in the order of Enmešarra's seven sons and the precise division
      of cosmic offices among them after their father's defeat."
      [+ associated LACUNA marker referring to "multiple manuscript
      groups; reconstruction provisional throughout"; + claim 6's
      "internal joins among the Babylonian and Assyrian manuscripts;
      Lambert 2013 collates them"; + claim 18's VARIANT marker citing
      "multiple Babylonian and Assyrian manuscript groups"; + claim
      19's "the manuscript groups largely agree on the central
      narrative... the variation is local to the seven-sons enumeration".]
    issue: |
      The claim that *Enmešarra's Defeat* is preserved on "multiple
      manuscript groups" of "first-millennium Babylonian and Neo-Assyrian"
      copies is at variance with the standard secondary consensus, which
      describes the composition as preserved on a SINGLE, heavily damaged
      tablet from the Seleucid or Parthian period (i.e., late first-
      millennium BCE / early Hellenistic, not Neo-Assyrian or earlier
      Babylonian). Wikipedia s.v. Enmesharra, citing Lambert 2013
      directly: "The myth Enmesharra's Defeat, only known from a single,
      heavily damaged tablet from the Seleucid or Parthian period, based
      on the colophon assumed to only be the ending of the narrative."
      The Marduk Wikipedia article (also citing Lambert 2013): the text
      is "likely composed in the Seleucid or Parthian era." mythsandsagas.com,
      similarly: "only known from a single, heavily damaged copy from
      the Seleucid or Parthian period." The brief's lacunae block
      ("Multiple manuscript groups; reconstruction provisional throughout")
      is the source of this framing in the chapter; the chapter has
      followed the brief faithfully but the brief itself appears to
      mis-state the manuscript situation. Severity HIGH because this
      framing controls the chapter's treatment of the LACUNA marker,
      the RECONSTRUCTION marker, the VARIANT marker, and the manuscript-
      variation claim about the seven sons' order — i.e., it underwrites
      a substantial fraction of the chapter's structural infrastructure.
      The fix is non-trivial: if Lambert 2013's apparatus does NOT
      attest multiple Babylonian and Assyrian manuscript groups, the
      LACUNA, RECONSTRUCTION, and VARIANT markers must all be reframed
      around a single damaged tablet whose breaks Lambert restores
      from internal context (or from parallel readings in Lambert's
      OTHER editions of related compositions, which would then need
      to be acknowledged as in-tradition donor sources). That said,
      the brief was locked through chapter-briefs and the chapter
      writer faithfully implemented the brief — so the failure is
      upstream at the brief stage, not the claims stage. The claims
      stage cannot resolve this without direct access to Lambert 2013;
      what it can do is flag the discrepancy and route it to human
      review.
    evidence: |
      "The myth Enmesharra's Defeat, only known from a single, heavily
      damaged tablet from the Seleucid or Parthian period, based on
      the colophon assumed to only be the ending of the narrative,
      describes a conflict between Enmesharra and Marduk" (Wikipedia
      s.v. Enmesharra, with footnote citation to Lambert 2013); "It
      is known from only one copy and with a badly damaged top half,
      and is likely composed in the Seleucid or Parthian era"
      (Wikipedia s.v. Marduk, again citing Lambert 2013);
      "[Enmesharra's Defeat is] only known from a single, heavily
      damaged copy from the Seleucid or Parthian period"
      (mythsandsagas.com, citing Lambert 2013).
    recommended_fix: |
      The chapter writer (and the brief's author at the chapter-briefs
      stage) must open Lambert 2013 pp. 281–298 directly and verify:
      (a) how many manuscripts/exemplars Lambert lists in the
      manuscript score; (b) whether they are dated Neo-Assyrian / first-
      millennium Babylonian / Seleucid / Parthian; (c) whether the
      seven-sons-order variation is between distinct exemplars or
      between Lambert's possible restorations of breaks within a single
      tablet. If the standard secondary description is correct (single
      Seleucid/Parthian tablet), the chapter must be rewritten as
      follows: (i) claim 4 → "The composition is preserved on a single,
      heavily damaged tablet from the Seleucid or Parthian period
      (late 4th c. BCE – 1st c. CE), with extensive breaks throughout
      the surviving column; the upper portion of the tablet is
      especially damaged. Based on the colophon, the surviving text
      is assumed to be the ending of the narrative."; (ii) the LACUNA
      marker in claim 6 → "single damaged Seleucid/Parthian tablet;
      reconstruction provisional throughout. Several breaks; Lambert
      2013 reconstructs the surviving narrative from internal context";
      scholarly_reconstruction: "limited — no parallel manuscripts
      are available for fill; reconstructions in Lambert 2013 are
      educated restorations within the surviving lines"; (iii) the
      RECONSTRUCTION marker → fill_source must be revised: "limited;
      no parallel Akkadian witnesses for fill; the running text is
      Lambert's restoration of breaks within a single tablet";
      confidence: low rather than medium; (iv) the VARIANT marker →
      primary=Lambert 2013 reading of the single tablet, alt=alternative
      restorations Lambert proposes for the seven-sons enumeration
      and the office-division (which are matters of Lambert's
      philological judgement on a single damaged witness, not of
      manuscript variation between exemplars); (v) claim 19 → "Manuscript
      variation" should be replaced with "Restoration variation":
      Lambert 2013's apparatus identifies multiple possible orders
      for the seven sons' enumeration in the broken lines, but these
      are alternative restorations of the same single tablet, not
      variants between exemplars. If Lambert's edition DOES attest
      multiple exemplars, this finding collapses and the brief's
      framing is correct as stated; the fact-check has flagged the
      question and routed it to human review for direct verification
      against the locked critical edition.

  - finding_id: F-2
    claim_number: 14
    kind: UNVERIFIED
    severity: MEDIUM
    claim: |
      "Enmešarra's Defeat is connected to the Akītu festival cosmology.
      Late-Babylonian commentary literature — particularly the Marduk
      Ordeal commentaries (KAR 143 and KAR 219) — interprets Enmešarra's
      defeat as part of the annual Akītu liturgical cycle."
    issue: |
      Two distinct claims need separate verification: (a) KAR 143 + KAR
      219 ARE the Marduk Ordeal text (not "commentaries on Enmešarra's
      Defeat" — they ARE the Marduk Ordeal itself, which is itself
      cast in the form of a cultic commentary on Akītu ritual elements
      reinterpreted as Marduk's tribulations); (b) whether the Marduk
      Ordeal explicitly invokes or interprets Enmešarra's defeat.
      Verification status: (a) is firmly attested — Frymer-Kensky 1983
      (JAOS 103, 131–141) is the standard edition, and KAR 143 + 219
      are the Assyrian "La Passion de Marduk" duplicates from Aššur,
      with British Museum fragments BM 134503 and BM 134504 as Nineveh
      duplicates. The chapter's framing of KAR 143 + 219 as "the
      Marduk Ordeal commentaries" is broadly correct (they are commentaries
      ON Akītu ritual, in the form of a passion-narrative about
      Marduk), though strictly speaking they ARE the Marduk Ordeal
      text rather than commentaries upon it. (b) The connection between
      the Marduk Ordeal text and Enmešarra's defeat is more interpretive:
      the Marduk Ordeal does treat Marduk's punishment, imprisonment,
      and the gods' efforts to free him; it does interpret Akītu
      ritual elements; whether it specifically invokes Enmešarra's
      defeat as part of the cycle is a claim I could not directly
      verify. The Frymer-Kensky 1983 summary I located does not
      mention Enmešarra. The Wikipedia Marduk article links the two
      texts thematically (both treat Marduk's enemies and the Akītu
      cycle) but does not assert that the Marduk Ordeal cites
      Enmešarra's Defeat. Severity MEDIUM because the broader Akītu-
      connection framing is well-attested in the secondary literature
      (Bottéro 2001, the Marduk Wikipedia article), but the specific
      claim that KAR 143/219 "interprets Enmešarra's defeat as part
      of the annual Akītu liturgical cycle" requires direct
      verification against Lambert 2013's commentary (pp. 296–298)
      and against Frymer-Kensky 1983's edition of KAR 143 + 219.
    evidence: |
      "KAR 143 + 219 constitute the critical edition of the Assyrian
      version of the text known as 'La Passion de Marduk' (the Marduk
      Ordeal text). The Marduk Ordeal contained cultic commentaries
      on the Akitu festival reinterpreted to refer to Marduk's
      punishment" (Frymer-Kensky 1983 summary). "The text [Marduk
      Ordeal] is best preserved on a tablet from Assur, published by
      Zimmern in Keilschrifttexte aus Assur religiosen Inhalts #143,
      with duplicate fragments from Nineveh, including some in the
      British Museum (BM 134503 and 134504)." None of the secondary
      summaries I located explicitly assert that the Marduk Ordeal
