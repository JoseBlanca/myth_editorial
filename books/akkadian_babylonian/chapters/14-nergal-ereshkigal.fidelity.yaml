f1_through_f5_resolution_check:
  status: PASS
  notes: |
    All five round-1-BLOCK / round-2-PASS findings from the
    factcheck cycle carry through into the chapter-draft body prose
    correctly:
    - F-1 (Etana NOT in the Amarna cluster). Body prose at draft
      lines 9, 56 (INFERENCE basis), 126 lists the Amarna cluster
      correctly as *Adapa* (EA 356), *Nergal* (EA 357 — this
      composition itself), *Šar tamḫāri* / *King of Battle*
      (EA 359), plus miscellaneous lexical / educational material;
      Etana is NOT named at any of the three locations. The Late-
      Bronze COMPARATIVE-HOOK at draft line 157 explicitly notes
      Etana's actual provenance: "*Etana*'s witnesses are at Susa,
      Aššur, and Nineveh, not at Amarna." All three F-1 sites
      confirmed.
    - F-2 (six days and six nights of union; the action turns on
      the seventh day with Nergal's escape, not Anu's intervention).
      Draft line 80: "passionate union for six days and six nights".
      Draft line 88: "After six days and six nights of union with
      Ereškigal, on the seventh day Nergal escapes back to the upper
      world while she sleeps." Both occurrences carry the "six days
      / seventh-day-escape" pattern. The footnote at draft line 80
      uses the corrected "the six-day union" tag (R2-F-1 housekeeping
      edit applied at post-human-normalize and carried through to
      draft).
    - F-3 (Amarna recension paragraph includes the hair-seizing
      scene, Nergal's threat, Ereškigal's plea for joint rule; SB
      second-descent paragraph notes the hair-seizing parallel
      between recensions). Draft line 47 (Amarna): "Inside
      Ereškigal's house, Nergal seizes her by the hair and pulls
      her from her throne. He is on the point of killing her when
      she pleads for her life — offering him joint kingship of the
      underworld in exchange. Nergal accepts; the two are married,
      and he is established as the underworld's co-ruler alongside
      Ereškigal." Draft line 102 (SB second descent): "Nergal
      seizes Ereškigal by the hair and draws her down from her
      throne — the same hair-seizing motif preserved in the Amarna
      recension's climactic confrontation, but here the gesture is
      one of reunion rather than existential threat. The
      Sultantepe seizure resolves in embrace; the Amarna seizure
      ends in Ereškigal's plea for life." Both sites confirmed.
    - F-4 (§-heading is "Nergal's second descent and Anu's decree";
      SB closure is Anu's decree much-damaged + closing bedchamber
      line; NO wedding ceremony, NO coronation). Draft line 100
      heading: "=== Nergal's second descent and Anu's decree".
      Draft line 106: "The Sultantepe recension closes with Anu's
      decree. Much of the decree is damaged on the tablet, but the
      surviving lines establish that Nergal is to remain forever
      with Ereškigal as co-ruler of the underworld. The poem's
      final preserved line shows Nergal and Ereškigal entering the
      bedchamber together. There is no separate wedding ceremony
      or coronation sequence in the surviving text: Anu's decree
      IS the ratification, and the bedchamber reunion IS the
      resolution." The wording explicitly negates wedding /
      coronation. Confirmed.
    - F-5 (prohibitions catalogue's fifth item hedged with both
      Foster's "looking" rendering and the literal "what men and
      women do" rendering). Draft line 70: "when Ereškigal removes
      her clothes to bathe — he is not to lie with her (Foster's
      translation glosses this last prohibition as a warning
      against looking upon the bathing queen, while more literal
      translations render the underlying Akkadian phrase as a
      prohibition on doing 'what men and women do')". Both
      renderings preserved verbatim. Confirmed.

