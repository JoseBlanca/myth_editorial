  - correction_id: F-2
    description: "KAR 143 + 219 are the Marduk Ordeal TEXT (Frymer-Kensky 1983), not commentaries on Enmešarra's Defeat"
    narrative_status: APPLIED
    detail: "Line 59: 'preserved on KAR 143 + KAR 219, edited by Frymer-Kensky 1983 — is a thematically related composition…KAR 143 + 219 are the Marduk Ordeal text itself, a cultic-commentary genre composition, rather than commentaries on a separate base text.'"
  - correction_id: F-3
    description: "No Tablet of Destinies transfer (Qingu contamination); melammu transfer to Šamaš plus office redistribution"
    narrative_status: APPLIED
    detail: "Line 44 explicitly negates: 'The transfer — not of the Tablet of Destinies but of the _melammu_'. Office redistribution at line 47: 'Nabû receives the powers of Ninurta; Nergal receives the powers of Erra; Marduk takes the powers of Enlil.' No Tablet-of-Destinies-transfer assertion appears anywhere."
  - correction_id: F-4
    description: "Surviving text is the ENDING per the colophon; combat is lost"
    narrative_status: APPLIED
    detail: "Line 13: 'Based on the colophon, the surviving text is taken to be only the ending of the narrative.' Reinforced at line 33: 'The combat itself…is not preserved in the surviving tablet — it stood in the lost upper portion.' Section heading at line 31 reads 'The aftermath of the combat: judgment, execution, redistribution'."
  - correction_id: F-5
    description: "Seven sons EXECUTED (beheaded), not subdued in combat"
    narrative_status: APPLIED
    detail: "Line 41: 'Marduk executes the seven sons by beheading. The collective execution is the first decisive action of the surviving text — the seven sons are despatched together, not one at a time.' No 'combat with the sons' framing anywhere."
  - correction_id: F-6
    description: "INFERENCE on Enūma Eliš parallel rewritten as STRUCTURAL parallel (Marduk-displaces-elder-order), not both-narrate-combats"
    narrative_status: APPLIED
    detail: "Line 73 INFERENCE: 'best read as a structural parallel…both compositions ground Marduk's kingship in the displacement of an elder cosmic order, but they target different elders.' Explicitly notes Enmešarra's Defeat as preserved is aftermath-only. risk field flags scholars who emphasise differences over similarities."
