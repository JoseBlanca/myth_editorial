  F3_marduk_flood_apkallu_apsu_detail:
    location_in_prose: "prose line 97 (Marduk's reply paragraph in Tablet II)"
    fix_preserved: true
    details: |
      The "gods feared the consequences" paraphrase is absent
      from the prose (grep returns zero hits). The apkallū-in-
      Apsû recollection is present: "Marduk further recalls
      that at that earlier moment he had sent the _apkallū_ —
      the seven antediluvian sages who brought civilization to
      humanity, the original craftsmen of the cult statue and
