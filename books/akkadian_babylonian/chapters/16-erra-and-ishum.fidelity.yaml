# ─────────────────────────────────────────────────────────────────────────
# Findings for record
# ─────────────────────────────────────────────────────────────────────────
findings_for_record:
  - finding_id: G-1
    severity: ADVISORY
    kind: LICENSED_GLOSS_RELOCATION
    summary: |
      The claims-document Tablet I opening paragraph (claims
      line 95) introduces Erra and Išum with the chapter's
      reminder glosses inline ("Erra — the god of plague and
      violent destruction, sometimes identified with Nergal in
      the wider Akkadian tradition (chapter 14) — and of his
      vizier Išum, the herald of the gods, who in this
      composition is the figure of restraint, the calming
      counterweight to Erra's rage"). The prose chapter has
      relocated this reminder-gloss content to the chapter's
      first paragraph (prose line 4), where Erra is glossed
      as "the god of plague and violent destruction, sometimes
      identified with Nergal" and Išum as "his vizier and
      herald, the calming counterweight to Erra's rage". In
      the relocation, the parenthetical cross-reference
      "(chapter 14)" was dropped — the Erra–Nergal identification
      is still explicit, but the explicit pointer to chapter 14
      (which is where Erra–Nergal syncretism is fully treated)
      is absent.

      Licensed by gloss-ledger policy per the writer's
      completion record: Erra and Išum's gloss_decisions are
      both REMINDER_GLOSS with the reminder applied "in the
      opening paragraph". The relocation is the writer's
      structural choice to front-load the reminder glosses
      rather than placing them at the first body-prose mention.
      Substantive content (Erra-Nergal identification; Išum's
      vizier-and-restraint role) preserved. The Tablet I
      opening paragraph in the prose ("The first tablet opens
      with an invocation of Erra and of Išum") is consequently
      simpler than the corresponding claims paragraph; no
      factual content is lost.
    impact: |
      ADVISORY only. Does not affect the fidelity verdict. The
      "(chapter 14)" cross-reference clause is a navigational
