  F4_sebitti_seven_named_commissions:
    location_in_prose: "prose line 68 (Sebitti catalogue paragraph in Tablet I)"
    fix_preserved: true
    details: |
      The seven commissions are catalogued in order — terror,
      burn like fire, annihilate like a lion, fell mountains,
      encircle like the wind, spare no one, slay with venom —
      anchored to Cagni 1969 I.31–44 and Foster 2005 pp. 882-884.
      The catalogue grounds the differentiation claim per the
      F-4 fix; the paragraph reads as catalogue-grounded rather
      than abstract. Footnote cites the same line range and
