# ── Findings (anything not ✓ SUPPORTED) ────────────────────────────────────

findings:
  - finding_id: F-1
    claim_number: "claim 14 (line 108) and the LACUNA marker (line 37); narrative gloss of the *halziqu* technical term as 'water-skin or container holding the water of life'"
    kind: UNVERIFIED-LEXEME
    severity: MEDIUM
    claim: |
      "Ea instructs Aṣušu-namir to descend to *Kurnugê*, to win
      Ereškigal's favour by demanding to drink water from the
      *halziqu* — the water-skin or container holding the water
      of life — and then to ask, in passing, for 'the water-skin'
      itself."
    issue: |
      The narrative claim — that Aṣušu-namir requests the water-
      of-life container, that this is the stratagem-vehicle for
      extracting Ereškigal's binding promise, and that Ereškigal
      is bound by her own oath — is **fully supported** at the
      narrative level (search extracts attest the "life-water bag"
      formulation; the stratagem mechanism is genre-standard).
      However, the **technical Akkadian transliteration
      "*halziqu*"** and its specific gloss as "water-skin or
      container holding the water of life" could not be
      independently verified at the lemma level in this audit:
      - CAD lookup for "halziqu" / "ḫalziqqu" was not directly
        retrievable in the open in this audit.
      - Lapinkivi 2010 (the modern critical edition with full
        Akkadian glossary) was not directly readable.
      - Foster 2005's gloss for the term was not directly
        retrievable (paywalled).
      - Sacred-Texts (Speiser ANET) preserves "water of life"
        but does not preserve the technical lexeme.
      - The Akkadian word is sometimes spelled *ḫalziqqu* in
        transliteration; the chapter's *halziqu* spelling
        (without the *ḫ* and with single *q*) is plausible but
        unverified.
      Severity MEDIUM rather than HIGH because:
      (a) the writer's `caution_on_specific_attestations` flag
          explicitly anticipated this verification gap;
      (b) the narrative claim it underwrites is fully supported;
      (c) the lexeme itself is genuine Akkadian and is the
          standard technical term for the stratagem-vehicle in
          the modern philological tradition;
      (d) the gloss "water-skin or container holding the water
          of life" is a defensible semantic-field rendering;
      (e) the chapter's own framing ("the *halziqu* — the water-
          skin or container holding the water of life") is
          appropriately hedged with the disjunction "water-skin
          OR container".
    evidence: |
      Independent search-result extracts attest the narrative
      mechanism: "Asushunamir is instructed to request from
      Ereshkigal the life-water bag so that water from it may
      be drunk" (multiple sources). Sacred-Texts (Speiser ANET,
      verbatim): "Sprinkle Ishtar with the water of life" — the
      "water of life" itself is verbatim attested but the
      stratagem-vehicle ("life-water bag" / "halziqu" / "water-
      skin") is not preserved in this English rendering.
      The CAD entry for the lexeme could not be retrieved in
      this audit; Lapinkivi 2010's glossary was not directly
      readable; Foster 2005's translator's note was not directly
      retrievable.
    recommended_fix: |
      LIGHT-FIX at stage 13. Either:
      (a) hedge the lexeme more explicitly: "the *halziqu*
          (variantly transliterated *ḫalziqqu*) — a water-skin
          or container holding the water of life, per Foster's
          translator's note"; or
      (b) cite the specific Foster-2005 page where the lexeme
          and gloss appear (likely p. 503 per the chapter's own
          page-attribution; verify against Foster's translator's
          note before final draft);
      (c) optionally, name-but-flag Lapinkivi 2010's glossary
          entry for the lexeme as the modern philological
          authority (Lapinkivi 2010 is not in sources.yaml; the
          named-but-flagged citation policy applies).
      The narrative claim does not need revision; only the
      lemma-level transliteration and gloss need cite-tightening.

  - finding_id: F-2
    claim_number: "claim 4 (line 29) and the chapter's framing of Lapinkivi 2010 / 'no recent single-volume critical edition'"
    kind: SCHOLARSHIP-CURRENCY
    severity: LOW
    claim: |
      "There is no recent single-volume critical edition in the
      Lambert/George sense; a modern text edition has been made
      available in the electronic Babylonian Library (eBL...)
      at the Ludwig-Maximilians-Universität München, post-dating
      the inventory's earlier 'Borger 1979 *Babylonisch-assyrische
      Lesestücke* II' note."
    issue: |
      The claim that "there is no recent single-volume critical
      edition in the Lambert/George sense" is contestable.
      Pirjo Lapinkivi, *The Neo-Assyrian Myth of Ištar's Descent
      and Resurrection* (State Archives of Assyria Cuneiform
      Texts 6 / Publications of the Foundation for Finnish
      Assyriological Research 1, Helsinki: Neo-Assyrian Text
      Corpus Project, 2010) is in fact a single-volume critical
      edition: it contains an introduction, the cuneiform text,
      transliteration with translation, glossary, and extensive
      commentary — i.e. the components of a Lambert/George-style
      critical edition. The eBL electronic edition at LMU
      München draws on Lapinkivi's text.
      The chapter and brief do not cite Lapinkivi 2010, which
      is a notable scholarship-currency omission. Both Foster
      2005 and Dalley 2008 predate Lapinkivi 2010, so the
      brief's choice of the two anthology translations as
      "principal anchors" is workable for narrative purposes
      (anthology translations are more accessible than the
      Helsinki critical edition); but the statement that no
      such critical edition exists is, strictly speaking,
      out of date.
      Severity LOW because:
      (a) this is a scholarship-currency claim, not a
          composition-content claim;
      (b) the brief and chapter correctly use the anthology
          translations as the cited principal anchors, which
          is appropriate for the book's accessible-translation
          tier;
      (c) the eBL electronic edition reference (audit-A7
          resolution) is correctly named-and-flagged;
      (d) the omission can be remedied with a single
          named-but-flagged citation in the source-overview
          paragraph.
    evidence: |
      Eisenbrauns title page, AbeBooks, and the University of
      Helsinki research portal confirm Lapinkivi 2010 as the
      modern single-volume critical edition. Search-result
      extract: "This work (SAACT 6) amounts to a full critical
      edition of the myth, including cuneiform text with
      transliteration and translation, a full critical
      apparatus, a scored transliteration of all known sources,
      and all textual variants in the glossary."
    recommended_fix: |
      LIGHT-FIX at stage 13. Add a single named-but-flagged
      citation to the source-overview paragraph (claim 4):
      "...A modern single-volume critical edition exists in
      Pirjo Lapinkivi, *The Neo-Assyrian Myth of Ištar's
      Descent and Resurrection* (SAACT 6, Helsinki 2010); the
      electronic Babylonian Library edition at LMU München
      consolidates and extends Lapinkivi's text. Foster 2005
      and Dalley 2008 remain the principal cited anthology
      translations." Lapinkivi 2010 is not in sources.yaml;
      named-but-flagged citation policy applies.

  - finding_id: F-3
    claim_number: "claim 9 (lines 75–76, the seven-gate stripping) — the ascent-order verification"
    kind: VERBATIM-INCOMPLETE
    severity: LOW
    claim: |
      "Ishtar's ascent reverses the descent, gate by gate. At
      each gate, the gatekeeper returns to her one item of the
      clothing and jewelry that was stripped from her on the way
      down: at the first gate her proud garment, at the second
      the bangles, at the third the girdle of birthstones, at the
      fourth the ornaments of her breast, at the fifth the chains
      of her neck, at the sixth the rings of her ears, at the
      seventh the great crown."
    issue: |
      The chapter's ascent order (gate 1 = proud garment, gate 7
      = great crown) is the chiastic reversal of the descent
      order, which is structurally correct and matches the
      composition's standard schema. However: verbatim quotation
      of the ascent-list from Foster 2005 was not directly
      retrievable in this audit (Foster's text is paywalled;
      Sacred-Texts/ANET preserves only the descent list in full
      detail and gives the ascent in summary form). The ascent
      list is therefore SUPPORTED on the structural-reversal
      argument and on the genre-standard expectation, but is
      NOT directly verbatim-confirmed in this audit.
      Severity LOW because:
      (a) the chiastic restoration is the standard schema and
          is independently attested (Wikipedia s.v. Descent of
          Inanna; Britannica; Lapinkivi 2010's edition would
          confirm but was not directly readable);
      (b) the Akkadian text demonstrably preserves the ascent
          gate-by-gate as a structural mirror of the descent
          (not in dispute);
      (c) the only risk is a translator's gloss-difference
          between Foster's wording and the chapter's, not a
          factual error.
    evidence: |
      Sacred-Texts (Speiser ANET): the descent list is given in
      full; the ascent passage refers to the gates returning the
      items "as they had been removed". The chiastic structure
      is standard. Direct verbatim quotation of Foster's ascent
      list was not retrievable in this audit.
    recommended_fix: |
      OPTIONAL at stage 13. If the human normaliser has access
      to Foster 2005 p. 504, verify that the chapter's specific
      ascent-list diction matches Foster's; if not, leave as-is
      (the structural-reversal claim is independently
      well-supported). No revision required for accuracy; the
      claim is SUPPORTED at the structural level.

