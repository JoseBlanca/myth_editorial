      individual page anchors were independently verified in this
      audit (Foster 2005 was paywalled; Dalley 2008 access-
      restricted). The overall page-range bracket (498–505 for
      Foster; 154–162 for Dalley) is consistent with the brief
      and with anthology-translation conventions; the per-
      paragraph page allocation is taken on trust as a writer-
      imposed structural convention. If the human normaliser has
      access to the actual books, a quick cross-check against
      the page-by-page anchors is recommended; no revision
      required if the writer's allocation is reasonable.

  - note_id: N-2
    note: |
      The "Mistress of Earth" rendering of the gatekeeper's
      refrain (line 80) is the modern translation tradition for
      the Akkadian *bēlet erṣeti* (literally "Lady of the Earth/
      Netherworld"; *erṣetu* covers both the "earth/land"
      and "netherworld" semantic ranges). Older translations
      (Speiser ANET) render "Mistress of the Underworld";
      Foster's translation tradition uses "Mistress of Earth".
      The chapter's hedge ("or the close equivalent in Foster's
      translation") is appropriate. No revision required. The
      refrain's load-bearing function (refrain across all seven
      gates) is independently confirmed.

  - note_id: N-3
    note: |
      The chapter's framing of Belili's mourning ("wearing her
      own ornaments, lapis lazuli on her arm... casting them
      aside in grief") is faithful to the Akkadian text but
      involves a translator's gloss-choice: the underlying
      Akkadian *uqnû* is sometimes rendered "lapis lazuli"
      (the chapter's choice; Foster's diction) and sometimes
      "eyestones" (an alternate rendering attested in some
      translations). Both are defensible. No revision required.

  - note_id: N-4
    note: |
      The chapter's Sumerian-Akkadian comparative framing —
      that the Akkadian Descent of Ishtar is an INDEPENDENT
      composition not a translation of the Sumerian Inanna's
      Descent — is correctly executed per scope.md and per the
      brief's special_instructions. The Sumerian original is
      treated only in COMPARATIVE-HOOK comments (lines
      173–178) and in one explicit "comparative reference"
      EVIDENCE token at line 161 (which routes through ETCSL
      as a comparative-tier source per sources.yaml). No
      contamination detected; the named-but-flagged policy is
      correctly applied. The 412-line figure for the Sumerian
      original is corroborated against ETCSL itself.

