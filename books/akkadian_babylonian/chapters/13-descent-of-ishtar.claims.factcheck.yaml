    q4_distinguished_variance_from_contamination: |
      No contamination from the Sumerian *Inanna's Descent*
      (ETCSL 1.4.1) into the Akkadian narrative was detected.
      The chapter explicitly and repeatedly distinguishes the
      two compositions:
      - The opening "Source overview" paragraph (lines 21–22) and
        the explanatory comment block (lines 8–17) state directly
        that the Akkadian *Descent of Ishtar* is "an INDEPENDENT
        composition NOT a translation of the Sumerian *Inanna's
        Descent* (ETCSL 1.4.1)".
      - The narrative is constructed with reference only to the
        Akkadian content: Aṣušu-namir (NOT the Sumerian *galla*
        demons), Tammuz substitution (NOT Dumuzi-and-Geštinanna
        co-substitution), and Belili-as-Tammuz's-sister-in-grief
        (NOT the Sumerian Geštinanna-as-substitute mechanism).
      - The Sumerian original is treated only in COMPARATIVE-HOOK
        comments at the foot of the chapter (lines 173–178), per
        scope.md.
      - The single in-prose EVIDENCE token routing through ETCSL
        (line 161, "ETCSL 1.4.1 (comparative reference)") is
        explicitly framed as "named-but-flagged for comparative
        reference; ETCSL is in sources.yaml as a comparative-tier
        source" — this is consistent with sources.yaml's
        comparative-tier policy and does not constitute
        contamination of the Akkadian narrative with Sumerian
        material. The footnote does not borrow Sumerian text; it
        only invokes the Sumerian as a comparative reference.
      - The 412-line figure for the Sumerian original (line 158)
        is corroborated against ETCSL itself (verbatim verified;
        see q2 (4) above).
      Glossary compliance: the glossary-locked renderings are
      preserved throughout — Ishtar (not Inanna), Ereškigal (with
      š), Tammuz (not Dumuzi, except where explicitly cross-
      glossed), Ea (not Enki), Apsû (not the Sumerian Abzu).
      Aṣušu-namir is rendered with its Akkadian ṣ; the brief's
      glossary entry "Aṣušu-namir / Aṣnamir" allows either
      rendering, and the chapter uses the longer form
      consistently. Kurnugê (with the ê closing-vowel mark) is
      preserved, matching the standard Akkadian transliteration.
      No silent bridges detected: every footnote anchors to an
      EVIDENCE token, every EVIDENCE token's source_id resolves
      to sources.yaml. The single named-but-flagged citation
      (eBL https://www.ebl.lmu.de/corpus/L/1/8) is correctly
