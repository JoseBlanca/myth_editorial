    note: |
      The chapter assigns specific Foster-2005 and Dalley-2008
      page numbers to individual narrative beats (e.g., Foster
      2005 p. 499 for the opening Kurnugê description; p. 500
      for Ereškigal's response; pp. 500–501 for the seven-gate
