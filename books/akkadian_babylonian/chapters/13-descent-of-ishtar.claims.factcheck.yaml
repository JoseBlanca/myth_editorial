      SUPPORTED.
      (5) **Seven-gate stripping ornament list and ORDER (descent
      sequence: crown → earrings → neck-chains → breast-ornaments
      → girdle of birthstones → bangles of hands and feet →
      proud garment)** — verbatim confirmed via Sacred-Texts
      (Speiser ANET): great crown / pendants on ears / chains
      round neck / ornaments on breast / girdle of birthstones
      on hips / clasps round hands and feet / breechcloth round
      body. The chapter's order ("at the first gate her great
      crown is taken; at the second, the rings of her ears; at
      the third, the chains of her neck; at the fourth, the
      ornaments of her breast; at the fifth, the girdle of
      birthstones at her waist; at the sixth, the bangles of her
      hands and feet; at the seventh, the proud garment of her
      body") matches the ANET-tradition order exactly.
      SUPPORTED. Minor terminological note: the chapter's
      "proud garment" matches Foster's translation tradition;
      ANET/Speiser has "breechcloth round her body" (a
      translator's license — the underlying Akkadian *ṣubātu* /
      "garment" is standardly rendered "garment" in Foster).
      The chapter's "rings of her ears" / "chains of her neck"
      diction is closer to Foster than Speiser. The descent-order
      is correct.
      (6) **Ascent-order restoration (proud garment → bangles →
      girdle → breast-ornaments → neck-chains → earrings →
      crown)** — the chapter explicitly reverses the descent
      order; this is structurally correct and matches the
      composition's standard schema (cf. Wikipedia s.v. Descent
      of Inanna; sacred-texts; the Akkadian text reproduces the
      sequence as a chiastic structure). Independent verbatim
      attestation of the ascent gate-by-gate sequence was not
      directly secured in the open, but the chiastic restoration
      is genre-standard for the Akkadian-tradition descent
      narrative and is supported by the ANET-tradition
      translations. SUPPORTED-WITH-CAVEAT (the structural reversal
      is well-attested; verbatim ascent-list quotation from
      Foster 2005 was not directly retrievable in the open).
      (7) **The gatekeeper's refrain "Enter, my lady, thus are
      the rites of the Mistress of Earth"** — partially
      confirmed: ANET/Speiser has "Enter, my lady, thus are the
