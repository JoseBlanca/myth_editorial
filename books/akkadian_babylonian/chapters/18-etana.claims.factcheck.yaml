    source_loc: "pp. 533-554"
    verbatim_quote: |
      Verified across Wikipedia, Britannica, World History
      Encyclopedia. The plant-of-birth motif and Etana's quest are
      consistent across all summaries.

  - claim_number: 2
    claim: "The composition embeds a self-contained eagle-and-serpent beast-fable; one of the rare Mesopotamian fables to survive in full narrative context."
    source_id: foster-2005
    source_loc: "pp. 533-554"
    verbatim_quote: |
      Verified across multiple summaries. The eagle-and-serpent
      narrative is the defining embedded fable of the Akkadian
      mythological corpus.

  - claim_number: 3
    claim: "Three substantively distinct recensions: OB, MA, SB."
    source_id: foster-2005
    source_loc: "pp. 533-554"
    verbatim_quote: |
      Verified. Wikipedia, Hejon07, multiple summaries confirm the
      three-recension structure. Note F-1 on OB provenance error.

  - claim_number: 4
    claim: "OB recension: ca. 1700 BCE; earliest attested form."
    source_id: foster-2005
    source_loc: "pp. 533-540"
    verbatim_quote: |
      Dating verified (ca. 18th century BCE / OB period). PROVENANCE
      WRONG — see F-1 (HIGH): OB is from Susa and Tell Harmal, NOT
      Sippar.

  - claim_number: 5
    claim: "MA recension: Aššur tablets, mid-2nd millennium BCE; fragmentary intermediate witness."
    source_id: foster-2005
    source_loc: "pp. 540-544"
    verbatim_quote: |
      Verified. Four tablets from Aššur, 14th-11th c. BCE, two
