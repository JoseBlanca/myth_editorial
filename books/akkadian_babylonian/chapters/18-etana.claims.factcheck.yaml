summary: |
  Round-1 fact-check VERDICT: PASS-WITH-LIGHT-FIXES.

  One HIGH-severity finding: F-1 (FACTUAL-ERROR — the Old
  Babylonian recension of Etana is from **Susa and Tell Harmal**,
  NOT from Sippar; the chapter's "OB Sippar" attribution is
  pervasive across approximately 10–12 instances and is factually
  wrong in every case). This is a load-bearing manuscript-
  provenance error: the entire OB-recension paragraph network and
  its EVIDENCE tokens rest on the wrong provenance. The fix is
  mechanical (global find-and-replace), but the error must be
  corrected before the chapter proceeds to chapter-draft. Despite
  this being a HIGH-severity factual error, it is localised to a
  single attribute (the OB provenance) and can be corrected
  without a round-2 rewrite — hence PASS-WITH-LIGHT-FIXES rather
  than BLOCK.

  Two MEDIUM-severity findings: F-2 (HEDGING-NEEDED — the heaven-
  flight gates citation mentions only Ištar and Anu when the
  surviving SB lines preserve seven gates: Anu/Enlil/Ea AND
  Sin/Šamaš/Adad/Ištar; recommended augmentation at lines 107,
  213, 219) and F-3 (CITATION-WRONG / UNVERIFIED — the "Saggs
  1986 join" is not located in any open-web source; H.W.F. Saggs's
  bibliography does not include a 1986 Etana publication; the
  actual modern editions are Kinnier Wilson 1985 *The Legend of
  Etana* and Novotny 2001 *The Standard Babylonian Etana Epic*
  SAACT 2; recommended substitution at lines 32, 69, 92, 176, 258).

  Zero LOW findings. One note: N-1 (BRIEF-INCONSISTENCY — the
  brief's sources.secondary loc-note for bottero-2001 describes
  Etana as "antediluvian king", which is inconsistent with the
  brief's own cross_cultural_parallels block, with the scholarly
  consensus per the SKL, and with the chapter's correct
  postdiluvian framing; the brief should be revised at line 20).

  All seven writer-flagged-for-scrutiny items resolved:
  (1) Antediluvian vs postdiluvian = **UPHELD** (chapter is
      correct; brief was wrong — Etana is postdiluvian per the
      SKL's first Kish dynasty placement; W-B 444 confirms this).
  (2) Saggs 1986 join = **UNVERIFIED-RECOMMEND-REPLACE** (no
      open-web trace; likely confused with Kinnier Wilson 1985
      or Novotny 2001).
  (3) Three recensions (OB Sippar, MA Aššur, SB Nineveh K.2606) =
      **PARTIAL-FACTUAL-ERROR** (OB is from Susa+Tell Harmal, not
      Sippar — F-1 HIGH; MA and SB are correct).
  (4) Lost-ending claim across all three recensions = **UPHELD**
      (scholarly consensus; all witnesses break before the
      resolution; SKL's "ascended to heaven" tells us he reached
      heaven but is silent on the plant's recovery).
  (5) Šammu ša alādi (plant of birth) = **UPHELD** (Akkadian
      lexeme correct; fertility/conception function is the standard
      reading; distinct from Gilgameš XI's *šammu ša balāṭi*).
  (6) Eagle-and-serpent fable as structural prologue = **UPHELD-
      AS-INFERENCE** (the [INFERENCE:] marker at line 237 hedges
      appropriately; the structural-prologue reading is the
      consensus but is interpretive).
  (7) Ištar's gate and Anu's gate in heaven-flight = **PARTIAL-
      INCOMPLETE** (both gates are named in the surviving text,
      not extrapolated; but five additional gates — Enlil, Ea, Sin,
      Šamaš, Adad — are also preserved; chapter understates the
      documentary record — F-2 MEDIUM).

  Zero fabrications, zero contamination, zero silent bridges,
  zero glossary violations, zero marker-schema failures. The
  chapter's core narrative spine — the three-recension format,
  the eagle-and-serpent fable's three-part shape, Etana's
  predicament, Šamaš's recursive role, the rescue-and-reciprocity
  pivot, the staged heaven-flight, the receding-earth imagery,
  the structural lost ending — is sound. The principal corrections
  are at the manuscript-provenance and editorial-history level
  (F-1, F-3), with one documentary-completeness augmentation
  (F-2).

  Recommendation: route to stage 13 (post-human-normalize) with
  the three localised fixes applied at human review. The OB-
  provenance correction (F-1 HIGH) is the most important and
  most pervasive but is also the simplest to fix (global find-
  and-replace). The Saggs 1986 substitution (F-3) is a citation
  fix. The gates augmentation (F-2) is a precision improvement.
  The brief revision (N-1) is a one-line correction. No round-2
  chapter-claims rewrite required.
