findings:
  - finding_id: F-1
    claim_number: 4
    location: "lines 9, 51, 57, 64, 88, 96, 258, 280 and elsewhere — pervasive throughout the chapter"
    kind: FACTUAL-ERROR
    severity: HIGH
    claim: "The Old Babylonian recension of Etana is preserved on tablets recovered from Sippar."
    issue: |
      The OB recension of Etana is NOT from Sippar. It is from
      **Susa** (the Elamite capital, modern Shush in Iran) and
      **Tell Harmal** (Šaduppum, near Baghdad). This is the
      scholarly consensus per:
      - J.V. Kinnier Wilson, *The Legend of Etana* (1985);
      - Jamie Novotny, *The Standard Babylonian Etana Epic*
        (SAACT 2, 2001);
      - Wikipedia s.v. Etana ("The Old Babylonian version comes
        from Susa and Tell Harmal");
      - Hejon07 Substack ("the Old Babylonian version from Susa
        and Tell Harmal");
      - multiple translation mirror summaries.

      The chapter's "OB Sippar" attribution is pervasive: it
      appears in the comment block (line 9: "an Old Babylonian
      recension from Sippar (ca. 1700 BCE)"), in the source-
      overview paragraph (line 51: "Old Babylonian recension from
      Sippar"), in the OB-recension dedicated paragraph (lines 57,
      58 EVIDENCE token: "loc=pp. 533-540 (OB Sippar)"), in the
      MA-recension paragraph (line 64: "older OB Sippar version"),
      in the LACUNA marker (line 88: "Old Babylonian recension —
      Sippar tablets, ca. 1700 BCE"), in the RECONSTRUCTION marker
      (line 96: "damaged columns of the OB Sippar tablets"), in
      the OB-recension section heading paragraph (line 113: "The
      OB Sippar recension opens..."), in the OB-recension closing
      paragraph (line 151: "The OB Sippar tablets break off..."),
      in the Variants block (line 258: "OB Sippar recension
      (Foster 2005, pp. 533–540): ca. 1700 BCE; Sippar tablets"),
      and in the chronological-spread paragraph (line 280: "OB
      Sippar (ca. 1700 BCE)"). Approximately 10–12 explicit
      "Sippar" references across the chapter; every one is wrong.

      This is a load-bearing factual error: the entire OB-recension
      paragraph and its EVIDENCE token network rest on a wrong
      provenance. Foster 2005's introductory matter (pp. 533–537)
      should correctly identify Susa and Tell Harmal as the OB
      provenances. The error appears to have been introduced by
      pattern-matching from other OB Akkadian compositions where
      Sippar IS the principal OB provenance (Atra-ḫasīs MS B; OB
      Anzû; OB Gilgameš Sippar tablet).

      This is a HIGH-severity finding. The chapter cannot proceed
      to chapter-draft without correcting this.
    evidence: |
      Wikipedia s.v. Etana (WebFetch): "The Old Babylonian version
      comes from Susa and Tell Harmal, the Middle Assyrian version
      comes from Assur, and the Standard version is from Nineveh."
      Hejon07 Substack: identical phrasing.
      WebSearch summaries (multiple): consistent OB Susa + Tell
      Harmal attribution.
      Kinnier Wilson 1985 catalogue (per book description): "one
      Old Babylonian manuscript from Susa and another of unknown
      provenance" (the "unknown provenance" being the second OB
      tablet, Tell Harmal not always explicitly named in popular
      summaries but consistent with the Tell Harmal attribution
      in Wikipedia and the Hejon07 summary).
    recommended_fix: |
      Global find-and-replace across the chapter:
      - "OB Sippar recension" → "OB Susa+Tell Harmal recension"
        (or simply "OB recension" where Sippar is the only
        provenance specifier)
      - "Sippar tablets" → "Susa and Tell Harmal tablets"
      - "OB Sippar (ca. 1700 BCE)" → "OB (Susa and Tell Harmal,
        ca. 1700 BCE)"
      - "the OB Sippar tablets" → "the OB tablets from Susa and
        Tell Harmal"

      Specific lines to revise: 9, 51, 57, 58 (EVIDENCE token), 64,
      88 (LACUNA marker), 96 (RECONSTRUCTION marker), 113, 116
      (EVIDENCE token), 151, 152 (EVIDENCE token), 258 (Variants
      block), 280.

      The brief at line 9 ("primary: foster-2005, loc: 'Before the
      Muses, pp. 533–554 (OB, MA, and SB recensions)'") does not
      itself name Sippar; the error was introduced by the writer.
      The brief at line 41 ("OB recension (Sippar, ca. 1700 BCE):
      earliest; eagle-and-serpent fable framing more compact") DOES
      contain the same error; this should also be corrected in the
      brief.

      After correction, the recension-history paragraphs are sound.

  - finding_id: F-2
    claim_number: 14
    location: "lines 107 (shared spine), 213 (Ištar's gate paragraph), 219 (Anu's gate paragraph)"
    kind: HEDGING-NEEDED
    severity: MEDIUM
    claim: "The heaven-flight passes through 'the gates of Ištar and Anu'."
    issue: |
      The chapter's selective citation of only Ištar's gate and
      Anu's gate during the heaven-flight is incomplete. The
      surviving SB lines preserve a more extensive seven-gate
      sequence:
      - "the gates of Anu, Enlil, and Ea" (the upper-triad gates)
      - "the gates of Sin, Shamash, Adad, and Ishtar" (the astral
        / weather-deity gates)

      Seven deities at gates, not two. The chapter's foregrounding
      of Ištar (as the keeper of the plant of birth in some
      readings) and Anu (as the head of the heavenly hierarchy) is
      defensible as narrative emphasis, but the text-record claim
      is incomplete. A reader of the chapter would conclude that
      only two gates are preserved in the surviving lines, when in
      fact seven are named.

      Note: the surviving SB lines preserve two heaven-flight
      episodes (a first ascent that is abandoned or fails, and a
      second ascent where Etana approaches the gate of Ishtar and
      receives the plant in some readings). The chapter does not
      distinguish these — this is not a finding per se but a
      framing simplification.
    evidence: |
      World History Encyclopedia, The Myth of Etana (WebFetch):
      "they passed through the gates of Anu, Enlil and Ea, and
      then through the gates of Sin, Shamash, Adad and Ishtar".
      WebSearch summary (Tree of Visions / GatewaysToBabylon
      translation mirrors): consistent seven-gate sequence;
      Etana's "second flight" approaches Ishtar's gate after
      passing through the prior six.
    recommended_fix: |
      At line 107 (shared spine paragraph), augment "the gates of
      the gods (Ištar's heaven, Anu's heaven)" to "the gates of
      the gods (Anu, Enlil, Ea, Sin, Šamaš, Adad, Ištar — the
      seven gates of the surviving SB heaven-flight episodes)" or
      similar.
      At lines 213 and 219 (Ištar's gate and Anu's gate
      paragraphs), retain the existing focus on Ištar and Anu as
      the load-bearing foci, but add a brief mention of the wider
      seven-gate sequence so the reader understands the full text-
      record.

      This is a precision improvement, not a factual error. The
      chapter can stand without this fix if the writer prefers
      narrative emphasis over documentary completeness, but the
      MEDIUM hedge-needed flag is appropriate.

  - finding_id: F-3
    claim_number: 6
    location: "lines 32 (comment block), 69 (source-overview SB-recension paragraph), 92 (LACUNA marker), 176 (SB-recension section paragraph), 258 (Variants block)"
    kind: CITATION-WRONG / UNVERIFIED
    severity: MEDIUM
    claim: "An important join of SB Etana fragments was published by H.W.F. Saggs in 1986."
    issue: |
      I cannot verify a 1986 H.W.F. Saggs publication on the SB
      Etana epic. H.W.F. Saggs's bibliography (per Wikipedia s.v.
      H.W.F. Saggs and CDLI Wiki) does not list any Etana
      publication in 1986 or in any other year. The closest 1980s
      Saggs publication is *The Might That Was Assyria* (1984),
      which is a popular history, not an Etana edition.

      The actual modern scholarly editions of the SB Etana that
      consolidate and extend the manuscript dossier are:
      - **J.V. Kinnier Wilson, *The Legend of Etana*** (Aris &
        Phillips, 1985);
      - **J.V. Kinnier Wilson, *Studia Etanaica: New Texts and
        Discussions*** (Ugarit-Verlag, 2007);
      - **Jamie R. Novotny, *The Standard Babylonian Etana Epic***
        (SAACT 2, Helsinki, 2001).

      The "Saggs 1986" attribution appears to be a misremembering
      or a confusion with Kinnier Wilson 1985 (right year-region,
      wrong author) or with some other Saggs publication. The
      named-but-flagged framing is appropriate (the claim is not
      anchored as an EVIDENCE token; Saggs 1986 is not in
      sources.yaml), but the underlying claim is unverified and
      probably wrong.
    evidence: |
      Wikipedia s.v. H.W.F. Saggs (WebSearch): no Etana 1986
      publication listed.
      CDLI Wiki Saggs entry (WebSearch): no Etana publication.
      Multiple Etana editions discussed in WebSearch results:
      Kinnier Wilson 1985 and Novotny 2001 are the editions that
      consolidate and extend the SB manuscript dossier; no Saggs
      1986 referenced in any source.
    recommended_fix: |
      Two options:
      (a) **Replace** "Saggs 1986 join" with reference to Kinnier
          Wilson 1985 (the actual modern edition that consolidates
          all three recensions) and Novotny 2001 (the SAACT
          cuneiform/transliteration edition). Both are verifiable
          and can be cited as named-but-flagged anchors since
          neither is in sources.yaml.
      (b) **Verify** the Saggs 1986 claim against a specific
          journal/volume/page reference. If the writer was thinking
          of a specific Saggs publication, it should be cited with
          a verifiable bibliographic anchor. If no such publication
          can be located, the claim should be removed or
          rephrased.

      Specific lines to revise: 32, 69, 92, 176, 258 — each of
      which references "Saggs 1986" in the named-but-flagged
      pattern.

      The substantive SB-recension claims (manuscript dossier,
      most-fully-preserved status, the role of Aššurbanipal's
      library) are unaffected by this fix; only the specific
      attribution of the "important join" needs correction.

