    q4_internal_variance_vs_contamination: |
      Yes. The chapter is CO-EQUAL per the brief; OB / MA / SB
      recensions are presented in sequence with each attributed.
      The structural lost ending is flagged at [LACUNA:] marker
      (line 94) with scholarly_reconstruction: no, per the brief's
      lacunae block. No cross-recensional extrapolation. The
      eagle-and-serpent fable's structural-prologue reading is
      flagged at [INFERENCE:] (line 237) with explicit risk
      statement. No contamination from outside the Akkadian
      tradition: Bellerophon and RV Trita Āptya are explicitly
      typological-only at COMPARATIVE-HOOK (line 288); Hebrew-Bible
      childlessness parallels (Sarah/Isaac, Hannah/Samuel) are
      reserved for the comparative chapter; Sumerian King List is
      noted as the source of Etana's documentary anchor but the
      SKL itself is not retold (per brief's special_instructions).

    q5_same_model_invalidating_audit: |
      No — this audit is in a fresh conversation. The same model
