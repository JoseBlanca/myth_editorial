writer_flagged_for_scrutiny_resolution:
  - flag_id: 1
    flag: "Antediluvian vs postdiluvian king — writer chose POSTDILUVIAN per the SKL's placement of Kish as the first postdiluvian city. The task brief described Etana as antediluvian."
    resolution: UPHELD (chapter correct; brief was wrong)
    detail: |
      The chapter is CORRECT to place Etana as a postdiluvian king
      per the Sumerian King List. Multiple open-web sources
      (Wikipedia s.v. Etana; Wikipedia s.v. Sumerian King List;
      World History Encyclopedia; Mythicscribes; Britannica)
      confirm: in the SKL's well-preserved form (Weld-Blundell
      Prism W-B 444 and parallel copies), kingship descends to
      Kish AFTER the flood; the first Kish dynasty is the FIRST
      POSTDILUVIAN dynasty; Etana is the thirteenth king of that
      dynasty (per W-B 444; some manuscripts vary).

      The brief's secondary-source loc-note (line 20: "bottero-2001,
      loc: passim — Etana as antediluvian king") is INTERNALLY
      INCONSISTENT with (i) the brief's own cross_cultural_parallels
      block (line 86: Etana "integrated into the antediluvian-
      postdiluvian royal sequence" — i.e. straddling or after the
      flood-divide, not before it) and (ii) standard scholarly
      consensus. The chapter at line 115 ("the first city of
      postdiluvian kingship"), at line 285 (COMPARATIVE-HOOK: "the
      postdiluvian royal sequence"), and at line 287 (COMPARATIVE-
      HOOK: "the early king's negotiation within that settlement")
      correctly places Etana on the postdiluvian side.

      Note that some popular sources (e.g. mythicscribes.com)
      loosely call Etana "antediluvian" by virtue of his great
      age in the SKL (1,500-year reign in some copies); this is
      not the scholarly classification. The chapter's postdiluvian
      framing is correct.

      Brief revision required: the sources.secondary loc-note for
      bottero-2001 should be changed from "passim — Etana as
      antediluvian king" to "passim — royal-divine relations
      and the antediluvian/postdiluvian royal sequence". See N-1.

  - flag_id: 2
    flag: "Saggs 1986 join — writer named-but-flagged this; verify whether it's a real SB-recension manuscript join or apocryphal."
    resolution: UNVERIFIED-RECOMMEND-REPLACE
    detail: |
      I could NOT verify a "Saggs 1986" Etana publication in any
      open-web source. H.W.F. Saggs's bibliography (per Wikipedia
      s.v. H.W.F. Saggs and CDLI Wiki Saggs entry) does not list
      a 1986 Etana edition, transliteration, or Nineveh-join
      paper. The publication of *The Might That Was Assyria*
      (1984) is the closest 1980s Saggs publication, and it is
      a popular history not an Etana edition.

      The actual modern scholarly editions of the SB Etana that
      consolidated and substantially extended the manuscript
      dossier are:
      - **J.V. Kinnier Wilson, *The Legend of Etana*** (Aris &
        Phillips, Warminster, 1985) — the edition that reconstructs
        all three recensions and presents each separately in
        transliteration and translation.
      - **J.V. Kinnier Wilson, *Studia Etanaica: New Texts and
        Discussions*** (Ugarit-Verlag, 2007) — a follow-up volume
        with additional manuscripts and discussions.
      - **Jamie R. Novotny, *The Standard Babylonian Etana Epic***
        (SAACT 2, Helsinki, 2001) — the modern critical edition
        with cuneiform text, transliteration, score, glossary,
        indices, and sign list.

      The chapter's "important join published by H.W.F. Saggs in
      1986" appears to be a misattribution. The writer's named-
      but-flagged pattern is correctly applied (the claim is not
      anchored as an EVIDENCE token; Saggs 1986 is not in
      sources.yaml), but the underlying claim is unverified and
      likely a confusion with Kinnier Wilson 1985 / Novotny 2001.

      Recommended remediation: in the chapter (lines 32, 69, 92,
      176, 258), replace the "Saggs 1986 join" references with
      "Kinnier Wilson 1985 (the standard scholarly edition that
      consolidates all three recensions) and Novotny 2001 (the
      modern SAACT critical edition of the SB recension)" — both
      verifiable, both well-attested, and both correctly framed
      as named-but-flagged anchors since they are not in
      sources.yaml.

      Alternatively, if the writer was actually thinking of a
      specific Saggs 1986 publication, the chapter should locate
      a verifiable citation (journal, volume, page). The chapter
      as currently drafted does not provide a citation — only the
      name and year — which is insufficient for a named-but-
      flagged anchor. See F-3 (MEDIUM).

  - flag_id: 3
    flag: "The three recensions — OB Sippar, MA Aššur, SB Nineveh K.2606. Verify these provenances, especially the MA witness."
    resolution: PARTIAL-FACTUAL-ERROR (OB provenance wrong)
    detail: |
      **OB recension**: FACTUAL ERROR. The OB recension is from
      **Susa and Tell Harmal**, NOT from Sippar. Multiple open-web
      sources confirm this (Wikipedia s.v. Etana; Hejon07 Substack;
      Kinnier Wilson 1985 catalogue; Novotny 2001). The chapter's
      "Sippar" attribution is pervasive: comment block (line 9),
      source-overview paragraph (line 51), OB-recension paragraph
      (line 57), MA-recension paragraph (line 64, "intermediate
      position between the older OB Sippar version"), LACUNA
      marker (line 88), RECONSTRUCTION marker (line 96), Variants
      block (line 258), and elsewhere — approximately 8–10
      instances throughout. Every "OB Sippar" or "OB tablets from
      Sippar" reference is incorrect.

      The OB Sippar attribution may have been pattern-matched
      from other OB Akkadian compositions (Atra-ḫasīs OB MS at
      Sippar; OB Anzû tablets at Sippar; OB Gilgameš at
      Pennsylvania/Yale, with Sippar OB also attested). The Etana
      OB tradition, however, is specifically Susa + Tell Harmal,
      both eastern/central Mesopotamian sites with no Sippar
      attestation. The original Foster 2005 introductory matter
      (pp. 533–537) should correctly identify Susa and Tell Harmal
      as the OB provenance; this is the standard scholarly
      consensus per Kinnier Wilson 1985 and Novotny 2001.

      **MA recension**: SUPPORTED. The MA Aššur attribution is
      correct per multiple open-web sources. Four tablets from
      Assur, two distinct manuscripts, 14th–11th c. BCE — all
      consistent with the chapter's framing.

      **SB recension**: SUPPORTED. The SB Nineveh K.2606 +
      duplicates dossier is correct per Novotny 2001 (SAACT 2)
      and multiple summaries. K.2606 is the principal SB
      manuscript; duplicates are also from Nineveh / Aššurbanipal's
      library. (Note: the SB dossier was substantially extended
      by Kinnier Wilson 1985, not by a Saggs 1986 publication —
      see F-3.)

      This is the principal HIGH-severity finding (F-1).

  - flag_id: 4
    flag: "Lost-ending claim — writer asserts the conclusion is lost in ALL THREE recensions. Verify this is the scholarly consensus and not 'lost in some but partly preserved in others'."
    resolution: UPHELD
    detail: |
      Confirmed across multiple open-web sources (Wikipedia s.v.
      Etana; Britannica s.v. Etana Epic; World History Encyclopedia;
      Hejon07; Selz / Samizdat). The conclusion of the heaven-flight
      — whether Etana brings back the plant of birth, whether his
      wife conceives — is LOST in all three recensions. No witness
      preserves the resolution.

      The chapter handles this correctly:
      - [LACUNA:] marker at line 94 ("the loss is structural") is
        sound;
      - Multiple paragraphs (lines 88, 92, 94, 151, 231) consistently
        note the lost ending;
      - The chapter explicitly refuses to extrapolate a resolution;
      - The chapter notes (line 94) that the SKL's "ascended to
        heaven" tells us he REACHED heaven but is silent on whether
        he returned with the plant.

      Britannica notes two possible outcomes ("either he reached
      heaven, or lost his nerve and crashed") — the chapter's
      refusal to choose between these is the appropriate scholarly
      handling.

      Some sources (including the Selz summary and the Hejon07
      blog) note that since the SKL records Etana's son Balih /
      Balikh succeeding him, the legend likely concluded with
      successful recovery of the plant; but this is INFERENCE from
      the SKL, not from the surviving Etana lines themselves. The
      chapter correctly handles this at line 94 (note about the
      SKL's "ascended to heaven" being silent on the plant).

      Supported.

  - flag_id: 5
    flag: "Šammu ša alādi (plant of birth) — verify the Akkadian lexeme and its function (fertility/childbirth plant) as the object of the heaven-flight."
    resolution: UPHELD
    detail: |
      Confirmed. The Akkadian term *šammu ša alādi* ("plant of
      [or 'of giving'] birth") is the correct lexeme for the
      heavenly plant Etana seeks. Verified via:
      - eBL (electronic Babylonian Library) dictionary entry s.v.
        *šammu* I (birth plant as medicinal herb);
      - Selz's "Plant of Birth or Plant of Life in the Etana
        Legend" article (the standard reference on the question);
      - multiple translation mirrors of Foster 2005's Etana
        rendering.

      The chapter correctly identifies the plant's function:
      fertility / conception, the means by which Etana's wife will
      bear a son and the dynastic line will continue. This is
      distinct from the *šammu ša balāṭi* ("plant of life" /
      rejuvenation) sought by Gilgameš in Tablet XI — the chapter
      correctly preserves the lexical and functional distinction
      between the two compositions' heavenly plants.

      Selz raised questions about whether the Etana plant might
      originally have been a "plant of life" (rejuvenation) rather
      than a "plant of birth"; the chapter does not engage this
      scholarly debate but its primary identification with the
      birth-plant reading is the standard consensus.

      Supported.

  - flag_id: 6
    flag: "Eagle-serpent fable as structural prologue — INFERENCE marker; verify the fable IS embedded as a prologue or whether it's a separate composition incorporated."
    resolution: UPHELD-AS-INFERENCE
    detail: |
      The chapter handles this correctly at the [INFERENCE:] marker
      (line 237). The framing of the eagle-and-serpent fable as a
      "structural prologue" rather than a "digressive embedded tale"
      is interpretive: the fable IS embedded into the OB recension
      from its first preserved column, and the structural alignment
      with Etana's predicament (both adjudicated by Šamaš, both
      centring on a lost good) is reliably attested across all three
      recensions. But the cuneiform text does not announce the
      structural alignment, and an alternative reading — the fable
      as a pre-existing standalone composition absorbed into the
      Etana narrative — cannot be definitively ruled out.

      The chapter's [INFERENCE:] marker (line 237) hedges
      appropriately with explicit risk statement ("the structural
      reading is well-supported by the surviving lines but is
      interpretive"). This is the right marker discipline.

      Open-web triangulation does not contradict the chapter's
      framing: multiple summaries treat the fable as integral to
      the Etana composition rather than as a separable independent
      tale. The Selz / Samizdat summary, Wikipedia s.v. Etana,
      and the Hejon07 Substack all present the fable as embedded
      in the Etana narrative.

      Note: there IS a scholarly question about the relationship
      between the Etana eagle-and-serpent fable and the Anzû /
      Bašmu mythological complex (cf. Valk 2020, JAOS 140.4,
      "The Eagle and the Snake, or Anzû and Bašmu? Another
      Mythological Dimension in the Epic of Etana"); the chapter
      does not engage this comparative-mythological question, but
      its primary structural-prologue reading is sound.

      Supported (as inference with appropriate hedge).

  - flag_id: 7
    flag: "Ištar's gate and Anu's gate during heaven-flight — verify these are named in the surviving text, not extrapolated."
    resolution: PARTIAL-INCOMPLETE
    detail: |
      The chapter cites two gates — Ištar's gate (line 213) and
      Anu's gate (line 219) — during the surviving SB heaven-flight
      episodes. Both are named in the surviving text and are not
      extrapolated; this much is correct.

      HOWEVER, the surviving SB lines preserve a more extensive
      sequence of gates than the chapter implies. Per multiple
      open-web summaries (translation mirrors of Foster 2005, the
      Tree of Visions blog summary, the GatewaysToBabylon retelling,
      and the World History Encyclopedia article), the heaven-flight
      preserves Etana passing through:
      - the gates of **Anu, Enlil, and Ea** (the three great gods
        of the upper triad);
      - the gates of **Sin, Shamash, Adad, and Ishtar** (the four
        astral / weather deities).

      Seven gates / seven deities are named in the surviving text,
      not just two. The chapter's selective citation of only Ištar
      and Anu is defensible as foregrounding the two most
      load-bearing for the narrative (Ištar as the keeper of the
      plant of birth in some readings; Anu as the head of the
      heavenly hierarchy), but it understates the documentary
      record. The reader is left with a partial picture.

      Recommended remediation: at lines 107, 213, and 219, augment
      the gates citation to mention the full Anu/Enlil/Ea AND
      Sin/Shamash/Adad/Ishtar sequence, with the chapter's existing
      treatment of Ištar's and Anu's gates preserved as the
      foregrounded foci. This is a MEDIUM finding (F-2): the
      chapter is not factually wrong but is incomplete.

      Note: there are TWO heaven-flight episodes in the SB recension
      — a FIRST flight (which breaks off or is abandoned) and a
      SECOND flight (where Etana receives the plant from Ishtar
      according to some interpretations of the surviving lines).
      The chapter does not distinguish these. This is a minor
      framing issue but does not rise to a finding given the
      chapter's emphasis on the lost ending.

