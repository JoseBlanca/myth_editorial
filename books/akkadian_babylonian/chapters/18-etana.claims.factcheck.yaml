  honesty_self_check:
    q1_opened_or_skimmed: |
      I did NOT have direct access to the brief's locked principal
      anchors:
      - Foster 2005, *Before the Muses*, 3rd ed., pp. 533–554 (the
        principal English working translation of all three Etana
        recensions): CDL Press paywalled; no readable in-text
        preview retrievable in this audit window. This is the
        load-bearing primary anchor for nearly every chapter claim.
      - Dalley 2008, *Myths from Mesopotamia*, rev. ed., pp. 189–202:
        OUP World's Classics; not directly opened.
      - Foster 2007, *Akkadian Literature of the Late Period*,
        pp. 43–46: print-only; not directly opened.
      - Noegel 2005, pp. 233–245: print-only; not directly opened.
      - Bottéro 2001, *Religion in Ancient Mesopotamia*: print-only;
        not directly opened.
      - Black & Green 1992, *Gods, Demons and Symbols*, s.v. Etana /
        eagle / serpent: paywalled; not directly opened.

      I DID independently verify the following via open web:
      (a) **Wikipedia s.v. Etana** (WebFetch). Confirmed:
          - Etana is the thirteenth king of the first Kish dynasty
            of the Sumerian King List; the SKL calls him "the
            shepherd, who ascended to heaven";
          - Etana is POSTDILUVIAN in the SKL (kingship descends to
            Kish after the flood; the first Kish dynasty is the
            first POSTDILUVIAN dynasty);
          - **CRITICAL FINDING**: "The Old Babylonian version comes
            from **Susa and Tell Harmal**, the Middle Assyrian
            version comes from Assur, and the Standard version is
            from Nineveh." The chapter's "OB Sippar" attribution
            (lines 9, 51, 57, 64 etc. — pervasive throughout the
            chapter) is FACTUALLY INCORRECT. See F-1 (HIGH).
      (b) **World History Encyclopedia: The Myth of Etana** (WebFetch).
          Confirmed:
          - The lost ending: "a gap of uncertain length" with the
            final complete lines missing;
          - The heaven-flight gates: Etana passes through "the gates
            of Anu, Enlil and Ea" AND "the gates of Sin, Shamash,
            Adad and Ishtar" — i.e. SEVEN named deities at gates,
            not just Ištar and Anu as the chapter implies (lines
            107, 213–219). The chapter's narrower citation of "Ištar's
            gate and Anu's gate" is incomplete; see F-2 (MEDIUM).
      (c) **Britannica s.v. Etana Epic** (WebFetch). Confirmed:
          - The lost ending: "The result of Etana's quest is
            uncertain because of the incomplete state of the texts."
          - Two possible outcomes per Britannica: either successful
            return, or losing nerve and falling back to earth — the
            chapter's refusal to extrapolate is appropriate.
      (d) **Selz / Samizdat blog summary** (WebFetch). Confirmed:
          - The Akkadian term *šammu ša alādi* ("plant of birth")
            is correctly used; the term is distinct from
            *šammu ša balāṭi* ("plant of life") in the Gilgameš
            tradition;
          - The Selz article discusses the "plant of birth vs plant
            of life" question — the chapter's identification of the
            Etana plant as the birth-plant (fertility/conception) is
            the standard reading, but Selz raised questions about
            whether the Etana plant might originally have been a
            "plant of life" (the chapter does not engage this debate
            but its primary identification is correct).
      (e) **Hejon07 / Substack: "The Memory Beneath the Memory"**
          (WebFetch). Confirmed:
          - "Three versions have been found so far: the Old Babylonian
            version from **Susa and Tell Harmal**, the Middle Assyrian
            version from Assur, and the Standard version from
            Nineveh."
          - Independent confirmation that OB ≠ Sippar.
      (f) **Multiple search-result summaries (worldhistory, britannica,
          ezine.mythicscribes)**. Confirmed:
          - Etana is postdiluvian per the SKL; the brief's
            "antediluvian" note at sources.secondary (line 20:
            "bottero-2001, loc: passim — Etana as antediluvian king")
            is INTERNALLY INCONSISTENT with the brief's own
            cross_cultural_parallels (line 86: "Etana appears in the
            Sumerian King List as 'the shepherd, who ascended to
            heaven'; integrated into the antediluvian-postdiluvian
            royal sequence" — i.e. acknowledging the postdiluvian
            placement) and with the chapter (line 115: "the first
            city of postdiluvian kingship"). The CHAPTER is correct
            on this point; the BRIEF's secondary-source loc-note is
            wrong. See N-1.
      (g) **Search results on Kinnier Wilson 1985 / Novotny 2001
          editions** (WebSearch). Found:
          - The modern scholarly editions of the SB Etana are
            J.V. Kinnier Wilson, *The Legend of Etana* (Aris &
            Phillips, 1985) — reconstructs the story on the basis of
            its three versions — and Kinnier Wilson's later
            *Studia Etanaica* (2007) follow-up; and the Novotny
            2001 *Standard Babylonian Etana Epic* (SAACT 2)
            cuneiform / transliteration / score edition.
          - **NO trace of a "Saggs 1986" Etana publication**. H.W.F.
            Saggs's bibliography (per Wikipedia and CDLI Wiki) does
            not list a 1986 Etana edition or Nineveh-join paper. The
            chapter's "important join published by H.W.F. Saggs in
            1986" (lines 32, 69, 92, 176, 258, etc.) is not verified
            by any open-web source. The named-but-flagged framing in
            the chapter is appropriate, but the chapter would do
            better to cite **Kinnier Wilson 1985** (the actual
            edition that consolidates the three recensions) instead
            of "Saggs 1986". See F-3 (MEDIUM).
      (h) **Search results on the eagle-and-serpent fable**
          (WebSearch). Confirmed:
          - The eagle-and-serpent fable is integrated into the OB
            recension from its first preserved column; it is not a
            separate pre-existing fable absorbed into Etana but a
            structural component of the composition's opening.
          - The chapter's [INFERENCE:] marker (line 237) framing the
            fable as a "structural prologue" (not a "digressive
            embedded tale") is the consensus reading and is
            appropriately hedged.

    q2_triangulated_or_assumed: |
      Open-web triangulation performed on:
      - OB recension provenance (CRITICAL FINDING — Susa + Tell
        Harmal, NOT Sippar; the chapter's "OB Sippar" attribution is
        factually incorrect throughout);
      - Etana's postdiluvian position in the SKL (the chapter is
        correct on this; the brief's secondary-source loc-note is
        wrong);
      - The Akkadian term *šammu ša alādi* ("plant of birth")
        verified;
      - The lost-ending claim across all three recensions verified;
      - The heaven-flight gates (Anu/Enlil/Ea AND Sin/Shamash/Adad/
        Ishtar — seven deities, not just two);
      - Kinnier Wilson 1985 / Novotny 2001 as the actual modern
        scholarly editions of the SB Etana; "Saggs 1986" not located
        in any open-web source;
      - The eagle-and-serpent fable's structural integration into
        the OB recension verified.

      Taken on trust (no direct primary access in this audit, but
      consistent with the secondary triangulation):
      - Exact page-anchors in Foster 2005 (pp. 533–554), Dalley 2008
        (pp. 189–202), Foster 2007 (pp. 43–46), Noegel 2005 (pp.
        233–245). The page-ranges are consistent with the chapter's
        coverage.
      - Black & Green 1992's specific s.v. entries on Etana, eagle,
        serpent, Šamaš, Anu, Ištar.
      - Bottéro 2001's commentary on royal-divine relations and the
        SKL framing. (Note: the brief's loc-note "passim — Etana as
        antediluvian king" is incorrect per the SKL evidence; the
        chapter body does not repeat this error.)
      - The MA Aššur recension's chronology (mid-2nd millennium BCE,
        14th–11th c. per multiple summaries) and its fragmentary
        preservation across four tablets / two manuscripts.
      - The SB Nineveh dossier (K.2606 plus duplicates) — confirmed
        in multiple summaries.

    q3_real_quote_or_pattern_match: |
      For SUPPORTED verdicts: pattern-matched against Wikipedia
      s.v. Etana; World History Encyclopedia; Britannica s.v. Etana
      Epic; the Selz / Samizdat blog summary; Hejon07 Substack;
      Mythicscribes.com summary; multiple WebSearch summaries.
      No verbatim primary quotations of Foster 2005's translation
      are introduced by the chapter beyond the Akkadian phrase
      *šammu ša alādi* (verified across multiple open-web sources)
      and standard structural references. Verbatim-fabrication risk
