  - claim_number: 51
    kind: UNVERIFIED
    severity: LOW
    claim: "Marduk creates seven additional winds — the dust-devil, whirlwind, hurricane, the ruinous, the four-, the seven- and the matchless — adding to the four cardinal winds for a total of eleven."
    issue: |
      The seven-additional-winds count and the names list are claimed
      from Lambert 2013 p. 90 (Tablet IV 41–48), with Dalley 2008 pp.
      251–253 as triangulation. The total-of-eleven is suggestive (and
      matches Tiamat's eleven monsters) but I could not confirm the
      11-total claim or the specific wind-name list verbatim from a
      web-accessible source. Foster 2005 lists seven winds but the
      naming and counting conventions vary. Marked UNVERIFIED pending
      print-copy verification of Lambert and Foster.
    evidence: |
      Wind-creation in Tablet IV is universally attested; the specific
      seven names and the count-of-eleven matching Tiamat's eleven
      monsters could not be triangulated against any web-accessible
      translation.
    recommended_fix: |
      Verify the seven wind-names against Lambert 2013 p. 90 and Foster
      2005 p. 457 during human review; note that "for a total of eleven"
      is an authorial gloss, not a textual statement, and may belong
      under [INFERENCE:].

  - claim_number: 76
    kind: UNVERIFIED
    severity: LOW
    claim: "The construction takes the gods two years; on completion, they hold a banquet at the new temple."
    issue: |
      The two-year construction figure is cited from Lambert 2013 p. 120
      (Tablet VI 60–80). I could not confirm the two-year specific figure
      from a web-accessible translation; Foster 2005 generally has "in
      one year" or "two years" depending on the line; the specific figure
      should be verified.
    evidence: |
      Construction-of-Esagil banquet is universally attested; the year
      count is a translation choice that varies. Marked UNVERIFIED.
    recommended_fix: |
      Verify "two years" against Lambert 2013 p. 120 line-by-line during
      human review.

  - claim_number: 88
    kind: UNVERIFIED
    severity: LOW
    claim: "Marduk mounts the storm-chariot drawn by four named horses: Killer, Pitiless, Trampler, and Fleet."
    issue: |
      The four horses are universally attested. The naming "Killer,
      Pitiless, Trampler, Fleet" matches Foster 2005's English rendering;
      Lambert 2013 gives "the Killer, the Relentless, the Trampler, the
      Swift" in some passages of his translation. Web-accessible
      summaries vary among "Killer, Pitiless, Trampler, Haste,"
      "Destroyer, Merciless, Trampler, Fleet," and other combinations.
      The chapter's "Killer, Pitiless, Trampler, Fleet" is plausibly
      Foster 2005's rendering and is cited from Lambert 2013 p. 90 +
      Foster 2005 p. 457; the discrepancy between Lambert's and Foster's
      English equivalents matters for the verbatim verification. Marked
      UNVERIFIED on the verbatim-quote rule pending print-copy access.
    evidence: |
      Web search returns multiple translation variants — e.g., "the
      Killer, the Relentless, the Trampler, the Swift" (Lambert) and
      "the Killer, the Pitiless, Trampler, Haste" (other). "Fleet" is
      attested as one rendering but is not Lambert's preferred word;
      Foster 2005 may use it. The footnote cites both Lambert and
      Foster, so a meaningful divergence in wording should be noted.
    recommended_fix: |
      Either drop the named list and say "four named horses (Lambert:
      'the Killer, the Relentless, the Trampler, the Swift'; Foster:
      'Killer, Pitiless, Trampler, Fleet')" — or pick one translation
      and cite that single source. The current footnote claims both
      translations agree on the four English names, which appears not
      to be the case.

  - claim_number: 100
    kind: MARKER-MISUSED
    severity: LOW
    claim: "[INFERENCE: The choice of fifty as the count is therefore not arbitrary but signals Marduk's displacement of Enlil at the head of the active cosmic hierarchy. | basis: Enlil's cult-number was fifty; Marduk receives fifty names; Lambert and Jacobsen both note the convergence. | risk: Lambert presents this as a strong scholarly reading rather than a textually explicit claim; the poem itself does not state the connection.]"
    issue: |
      This is borderline. The fifty=Enlil's-number / Marduk-displaces-Enlil
      reading is well-established in mainstream scholarship — it is in
      Lambert's commentary, in Jacobsen 1976, in the ORACC Marduk page,
      and in the An=Anum god-list itself (which assigns Enlil's number 50
      to Marduk). It is not really "inferential" in the sense of going
      beyond what the sources say; the writer's own basis-field cites
      Lambert and Jacobsen both noting the convergence. By the marker's
      own rules ("If a source directly attests it, flag MARKER-MISUSED"),
      this should arguably be a footnoted body claim rather than an
      INFERENCE marker. However, the writer's own risk-field correctly
      observes that "the poem itself does not state the connection,"
      which is a real interpretive gap and supports keeping the marker.
      Severity LOW: arguably correct as marker-handling, marginally
      arguable as marker-misuse.
    evidence: |
      ORACC Marduk page: "In the god list An = Anum, the number 50,
      Enlil's number, was assigned to Marduk instead." This is a direct
      textual attestation in An=Anum, so the absorption-claim is
      directly supported in a primary source — pushing the marker
      toward MARKER-MISUSED.
    recommended_fix: |
      Either downgrade the marker to a footnoted body claim (since
      An=Anum directly attests the equation), or retain the marker
      and tighten the risk-field to specify "the poem of Enūma Eliš
      does not itself state the equation; the equation is established
      from the An=Anum god-list and Lambert's commentary p. 482."

  - claim_number: 64
    kind: GLOSSARY-VIOLATION
    severity: LOW
    claim: "Marduk establishes the moon-god Sîn (Akkadian moon-god, *Nannar* in some passages) and assigns him the night."
    issue: |
      The glossary's locked entry for Sîn lists never-use forms "Nanna"
      and "Nanna-Suen" (the Sumerian forms). The chapter introduces
      "Nannar" parenthetically as an alternative form — "Nannar" with
      a final -r is the Old Babylonian Akkadian form (a reading of the
      moon-god name occasionally found in Akkadian contexts), distinct
      from Sumerian Nanna. The glossary does not list Nannar as
      forbidden, but it does not list it as approved either. Strict
      reading: Nannar is borderline-Sumerian (the Akkadian-Sumerian
      distinction is subtle) and the chapter introduces it without
      gloss. The chapter parenthetical "(Akkadian moon-god, *Nannar*
      in some passages)" is somewhat circular ("Akkadian moon-god,
      *Nannar*") and may confuse readers who do not know Nannar is a
      variant Akkadian rendering rather than a different deity.
    evidence: |
      Glossary entry for Sîn: never_use: ["Nanna", "Nanna-Suen"]. The
      glossary does NOT list Nannar; the chapter's use of Nannar is
      not strictly forbidden but is unglossed.
    recommended_fix: |
      Either drop the parenthetical "(Akkadian moon-god, *Nannar* in
      some passages)" — the locked rendering Sîn alone is sufficient —
      or expand to "(*Nannar* is an alternate Akkadian rendering of
      the same moon-god, attested in some Tablet V passages)". Verify
      the gloss against the glossary lock during human review.

