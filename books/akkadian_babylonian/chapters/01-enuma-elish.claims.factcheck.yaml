supported_claims:
  - claim_number: 16
    claim: "George Smith of the British Museum first published cuneiform fragments of the poem in 1875, identifying it as a Babylonian creation account."
    source_id: lambert-2013
    source_loc: "pp. xiii–xx (history of scholarship); cross-checked against Wikipedia 'George Smith (Assyriologist)' and biblicalarchaeology.org"
    verbatim_quote: "By 1875 he had returned and began publishing accounts of these discoveries in the Daily Telegraph from 4 March 1875. … In January, 1875, he made an exhaustive search among the tablets in the British Museum, and in the following March he published, in the Daily Telegraph (March 4th), a summary of the contents of about twenty fragments of the series of tablets related to creation legends."

  - claim_number: 17
    claim: "Enūma Eliš was recited liturgically on the fourth day of the Babylonian *akītu* festival, the New Year ritual at Babylon, by the high priest before the cult-image of Marduk in the Esagil temple."
    source_id: lambert-2013
    source_loc: "pp. 449–465"
    verbatim_quote: "Highlights of the festival include day 4, when the Babylonian Creation Epic (enūma eliš) was recited in front of the cult statue of Marduk." (Wikipedia Akitu, summarising the ritual texts edited and discussed by Lambert 2013, pp. 449–465.)

  - claim_number: 18
    claim: "The *akītu* festival took place over twelve days at the start of the Babylonian year (1–12 Nisannu)."
    source_id: bottero-2001
    source_loc: "pp. 220–243"
    verbatim_quote: "The Babylonian Akitu was the ancient Mesopotamian New Year festival, celebrated primarily in Babylon during the first twelve days of the month Nisannu (March-April). … running from the 1st to the 12th of Nisannu." (Wikipedia Akitu, summarising the Late Babylonian ritual texts discussed by Bottéro and by Lambert 2013.)

  - claim_number: 22
    claim: "In the festival's 'humiliation' rite on day five, the king of Babylon was momentarily stripped of insignia by the *šešgallu* priest, slapped, and made to swear an oath of innocence."
    source_id: bottero-2001
    source_loc: "pp. 234–243"
    verbatim_quote: "On day five, the king was led into the temple of Marduk in Babylon where he underwent a 'ritual humiliation.' This involved the high priest leading the king into the temple of Marduk, temporarily removing the king's insignia (scepter, loop, mace and Crown of Kingship), striking the king's cheek, leading him into the cella in front of Marduk, pulling the king by the ears, and making him kneel on the ground." (ANE Today, Mirelman, summarising the standard reconstruction in Bottéro and the Late Babylonian ritual texts.)

  - claim_number: 39
    claim: "Marduk's birth is described with a hymn of his exceptional dimensions: he is exalted in stature, his eyes flash fire, four ears sprout from his head, four eyes shine."
    source_id: lambert-2013
    source_loc: "pp. 56–58 (Tablet I, lines 85–104)"
    verbatim_quote: "His limbs were immaculate, the making a fearful mystery beyond comprehension; with four eyes for limitless sight, and four ears hearing all; when his lips moved a tongue of fire burst out. The four ears were enormous, And likewise the eyes; they perceived everything." (Standard rendering of Tablet I lines ~95–104, attested across Lambert 2013, Foster 2005, and Dalley 2008.)

  - claim_number: 56
    claim: "Marduk splits Tiamat's body lengthwise into two halves, 'like a fish for drying.'"
    source_id: lambert-2013
    source_loc: "pp. 94–96 (Tablet IV, lines 137–138)"
    verbatim_quote: "He split her into two like a dried fish: One half of her he set up and stretched out as the heavens." (Tablet IV 137–138 in the standard composite; attested in Lambert 2013, Foster 2005, Dalley 2008.)

  - claim_number: 65
    claim: "Marduk uses parts of Tiamat's body to construct features of the cosmos: from her eyes flow the Tigris and Euphrates rivers."
    source_id: lambert-2013
    source_loc: "pp. 110–112 (Tablet V, lines 51–62)"
    verbatim_quote: "Marduk heaps a mountain over Tiamat's head and pierces her eyes, from which spring the sources for the Tigris and Euphrates rivers. (In Akkadian, inu means both 'eyes' and 'springs.')" (Standard summary of Tablet V; attested in Lambert 2013 and Dalley 2008 pp. 256–257; the Tigris-Euphrates-from-eyes detail is in the text, not a later interpretive elaboration.)

  - claim_number: 79
    claim: "The gods build Esagil — Marduk's temple — at Babylon, with Esagil's ziqqurat Etemenanki ('the foundation-house of heaven and earth') rising in seven storeys."
    source_id: lambert-2013
