findings:
  - claim_number: 53
    kind: CITATION-WRONG
    severity: MEDIUM
    claim: "Tiamat creates eleven monsters as her army: serpent, dragon, sphinx, lion, mad-dog, scorpion-man, demon, fish-man, bull-man, and others."
    issue: |
      The named-list within this claim is wrong on two species. The canonical
      eleven of Tiamat's army (Tablet I lines ~134–146 in Lambert 2013, also
      Foster 2005, Dalley 2008, and Black & Green 1992 s.v. Tiamat) are:
      Bašmu (Venomous Snake / Hydra), Ušumgallu (Great Dragon), Mušmaḫḫū
      (Exalted Serpent), Mušḫuššu (Furious Snake), Laḫmu (Hairy One/Hairy
      Hero), Ugallu (Big Weather-Beast / Great Demon), Uridimmu (Mad Hound
      / Savage Dog), Girtablullû (Scorpion-man), Umū dabrūtu (Violent Storms
      / Fierce Demons), Kulullû (Fish-man), and Kusarikku (Bull-man).
      "Sphinx" appears in NO standard translation of the eleven; it is not a
      canonical member of Tiamat's army. "Lion" is also not standard —
      Ugallu is rendered "Great Demon" or "Big Weather-Beast," and Uridimmu
      is rendered "Mad Hound" or "Savage Dog," neither a lion. "Mad-dog" in
      the chapter is closer to Uridimmu but elides the species. "And others"
      is awkward for a list whose total is exactly eleven and whose members
      are individually named in the text.
    evidence: |
      Wikipedia "Tiamat" article: "The eleven monsters … included: Bašmu
      ('Venomous Snake'), Ušumgallu ('Great Dragon'), Mušmaḫḫū ('Exalted
      Serpent'), Mušḫuššu ('Furious Snake'), Laḫmu (the 'Hairy One'),
      Ugallu (the 'Big Weather-Beast'), Uridimmu ('Mad Hound'), Girtablullû
      ('Scorpion-Man'), Umū dabrūtu ('Violent Storms'), Kulullû ('Fish-Man'),
      and Kusarikku ('Bull-Man')." Black & Green 1992 s.v. Tiamat gives the
      same list. No "sphinx" or "lion" appears in any scholarly translation.
    recommended_fix: |
      Replace the species list with the standard eleven (in the order
      Lambert prints them on p. 62 / Tablet I 134–146): Hydra (Bašmu),
      Dragon (Ušumgallu), Sphinx-Dragon — NO, drop sphinx — use Hairy
      Hero (Laḫmu), Great Demon (Ugallu), Mad Dog / Savage Dog (Uridimmu),
      Scorpion-Man (Girtablullû), Storm-Demon (Umū dabrūtu), Fish-Man
      (Kulullû), Bull-Man (Kusarikku), plus the Furious Snake (Mušḫuššu)
      and Exalted Serpent (Mušmaḫḫū). Drop "and others" — the eleven are
      individually named in the text.

  - claim_number: 16
    kind: CITATION-WRONG
    severity: LOW
    claim: "George Smith of the British Museum first published cuneiform fragments of the poem in 1875."
    issue: |
      The 1875 date is technically defensible (Smith's first newspaper
      announcement of the creation tablets appeared in the Daily Telegraph
      on 4 March 1875, after his January 1875 examination of the British
      Museum tablets), but the formal scholarly publication came in 1876
      with The Chaldean Account of Genesis. The chapter says "first
      published cuneiform fragments … in 1875" — defensible if the Daily
      Telegraph March 1875 summary counts as "publication of fragments,"
      but most modern reference works (incl. Wikipedia Enūma Eliš) cite
      "1876" as the first publication. Lambert 2013 pp. xiii–xx is the
      claim's source; without opening Lambert directly I cannot confirm
      whether Lambert says 1875 or 1876. Note that this is consistent
      with the chapter's earlier-claimed distinction between 1872 (the
      flood-tablet announcement) and 1875 (the creation-tablets fragments)
      — those ARE separate events.
    evidence: |
      Wikipedia "George Smith (Assyriologist)": "By 1875 he had returned
      and began publishing accounts of these discoveries in the Daily
      Telegraph from 4 March 1875." Wikipedia "Enūma Eliš" and most
      reference works cite "A form of the myth was first published by
      English Assyriologist George Smith in 1876."
    recommended_fix: |
      Either retain "1875" with a parenthetical clarifying "in the Daily
      Telegraph; the formal scholarly edition followed in The Chaldean
      Account of Genesis, 1876", or amend to "first published cuneiform
      fragments of the poem in 1875–76 (Daily Telegraph announcement
      March 1875; Chaldean Account of Genesis, 1876)". Verify which date
      Lambert 2013 actually uses on pp. xiii–xx during human review.

  - claim_number: 1
    kind: UNVERIFIED
    severity: LOW
    claim: "Enūma Eliš is a seven-tablet Akkadian poem composed in the late second millennium BCE, conventionally taken as the canonical Babylonian creation epic."
    issue: |
      The seven-tablet structure, Akkadian language, and canonical-creation-
      epic status are all well-established (verified independently). The
      "late second millennium BCE" dating is the prevailing view (chapter
      claim 11 acknowledges this is "debated"). The bundling of these
      claims into one paragraph is fine, but I could not paste a verbatim
      quote from Lambert 2013 confirming all four assertions in a single
      passage. Marked UNVERIFIED on quote-rule grounds, not on substance.
    evidence: |
      All four sub-claims independently confirmed by Wikipedia Enūma Eliš,
      Britannica, and the SOAS review of Lambert 2013; no verbatim Lambert
      quote available for the bundle.
    recommended_fix: |
      No fix needed; this is the writer's quote-rule downgrade, not a
      substantive error.

  - claim_number: 11
    kind: UNVERIFIED
    severity: LOW
    claim: "The composition's date of authorship is debated, with the prevailing view placing it in the late second millennium BCE, most commonly under Nebuchadnezzar I of the Second Dynasty of Isin (reigned ca. 1125–1104 BCE)."
    issue: |
      The Nebuchadnezzar I commissioning hypothesis is the prevailing
      scholarly view (associated with W.G. Lambert himself), but no
      verbatim quote from Lambert 2013's introduction was accessible
      via web tools. The reign-dates 1125–1104 BCE are the standard
      regnal range. Mark UNVERIFIED on quote-rule grounds.
    evidence: |
      Standard scholarly view; verifiable via SOAS review of Lambert
      2013 and ORACC Marduk page. No Lambert verbatim available.
    recommended_fix: |
      No fix needed; reverify on print-copy access during human review.

  - claim_number: 12
    kind: UNVERIFIED
    severity: LOW
    claim: "The Nebuchadnezzar I commissioning hypothesis ties the composition to that king's recovery of Marduk's cult-statue from Elam and to a wider programme of Babylonian theological assertion."
    issue: |
      Cult-statue-recovery hypothesis is mainstream scholarship and is the
