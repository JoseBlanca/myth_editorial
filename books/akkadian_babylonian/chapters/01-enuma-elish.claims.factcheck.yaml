      prevalent classification, and the VARIANT marker correctly
      records the alternate as "chosen: Lambert composite (Babylonian)"
      with the Aššur reading flagged for the apparatus. This is a
      borderline brief-instruction-mismatch; severity LOW. Consider
      recasting as a footnote in the prose draft rather than carrying
      the VARIANT marker into final prose.
    lacunae_flagged: |
      PASS. Both brief-specified Tablet V lacunae (lines 1–22 and lines
      50–86) are flagged with [LACUNA:] markers (lines 322 and 339),
      each with source: and scholarly_reconstruction: subfields populated.
