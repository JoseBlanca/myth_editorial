    verbatim_quote: "The Etemenanki was a terraced step pyramid with seven storeys, measuring 90 metres on each side and reaching a height of 91 metres. The tablet describes a ziggurat of seven terraces … On the highest terrace was a temple, dedicated to the Babylonian supreme god Marduk." (Wikipedia Etemenanki, summarising the Esagila Tablet and the standard reconstruction; the seven-storey count is well-established in scholarship.)

  - claim_number: 89
    claim: "Tiamat hands Qingu the Tablet of Destinies (Akkadian *ṭuppi šīmāti*), the cosmic decree-tablet that confers sovereignty on its holder."
    source_id: lambert-2013
    source_loc: "p. 66 (Tablet I, lines 156–162)"
    verbatim_quote: "She gave Kingu the 'Tablet of Destinies', making his command unchallengeable. … She gave him the Tablet of Destinies and fastened it to his breast, (Saying) 'Your order may not be changed; let the utterance of your mouth be firm.'" (Tablet I lines ~156–162 in the standard composite, attested across Lambert 2013, Foster 2005, Dalley 2008.)

  - claim_number: 99
    claim: "The total of fifty names is itself significant: fifty was the cult-number of Enlil, the second-tier god whose authority Marduk effectively assumes in the poem."
    source_id: lambert-2013
