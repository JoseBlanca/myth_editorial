  # === LOW-severity findings, NOTEs, and informational items ===============

  - claim_number: 24
    finding_id: F-10
    kind: UNVERIFIED
    severity: LOW
    claim: |
      "Ea further instructs Adapa to accept the oil and the clothing Anu will
      also offer; these will be safe."
    issue: |
      The oil-and-clothing acceptance is well-attested at the heaven-audience
      stage (Anu offers, Adapa accepts), but the Ea-instruction-prediction
      that Adapa SHOULD accept oil and clothing (as a positive instruction,
      not just a permitted-not-prohibited pair) is less directly attested in
      the translations I verified. Foster and Dalley summaries focus on Ea's
      negative instructions (don't eat, don't drink); the positive
      instructions about oil and clothing may be inference from the audience-
      scene parallel rather than direct textual instruction. UNVERIFIED until
      the Izre'el 2001 Fragment B Ea-instruction passage can be checked
      directly.
    evidence: |
      Dalley translation excerpts (teaching site) preserve only Ea's negative
      instructions ("Do not eat... Do not drink"); the positive oil-and-
      clothing instruction is not in the quoted excerpt.
    recommended_fix: |
      Either secure a direct quote from Izre'el 2001 Fragment B (or Foster
      2005 p. 527) for the positive oil/clothing instruction, or rephrase to
      reflect that Ea's instructions are PRIMARILY negative (regarding the
      bread and water) and that the oil-and-clothing acceptance follows by
      default rather than by explicit positive instruction.

  - claim_number: 31
    finding_id: F-11
    kind: UNVERIFIED
    severity: LOW
    claim: |
      "Adapa is sent back down to the earth without the immortality he was
      offered. The opportunity is foreclosed; humanity will remain mortal."
    issue: |
      This is the Fragment B ending. The chapter does NOT mention Fragment D's
      alternate ending, in which Anu honours Adapa and "set a decree to make
      glorious his lordship forever" (Samizdat summary of Izre'el 2001 on
      Fragment D), with Adapa apparently retained in heaven rather than sent
      back. This is a substantive variant attested in the Nineveh recension,
      and given the chapter's brief classification as "co-equal recensions
      presented in parallel", omitting Fragment D's alternate fate is a
      structural lacuna in the chapter's variant handling.
    evidence: |
      Samizdat summary of Izre'el 2001 on Fragment D: "Anu set a decree to
      make glorious his lordship forever. The outcome in Fragment D is the
      opposite of Fragment B: Adapa will remain in heaven as the chosen of
      Anu."
    recommended_fix: |
      Add a paragraph (or amend the Variants section / VARIANT marker 1) noting
      that Fragment D preserves an alternate ending in which Adapa is honoured
      by Anu and apparently retained, contrasting with Fragment B's ending in
      which he is sent back. The brief explicitly calls for co-equal-recension
      side-by-side presentation, and the chapter currently presents only the
      Fragment B ending as if it were the only outcome of the heaven-audience
      scene.

  - claim_number: 33
    finding_id: F-12
    kind: UNVERIFIED
    severity: LOW
    claim: |
      "Adapa's name itself appears in variant readings across the recensions:
      Adapa (the standard), Adamu in some late lists, Uan in the apkallu
      genealogy."
    issue: |
      Cross-reference to F-6 (same claim, listed here under VARIANT marker 2's
