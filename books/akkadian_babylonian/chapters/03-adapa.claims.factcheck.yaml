  - claim_number: 0
    finding_id: NOTE-2
    kind: NOTE
    severity: LOW
    claim: |
      Glossary discipline check.
    issue: |
      No "never_use" Sumerian forms appear in the chapter. Specifically:
        - "Ningišzida" is used once (claim 22) in an explicit etymological
          gloss "Akkadian for the Sumerian Ningišzida — an underworld-vegetation
          god"; this is the comparative-etymological context the brief
          permits, not a substitute body name. The Akkadian form Gizzida is
          used as the body name throughout. Compliant.
        - "Tammuz" appears with "(also called Dumuzi in the Akkadian
          tradition)" at first mention (claim 22). The glossary's locked
          form for the deity is "Dumuzi" (Tammuz is the Aramaic-biblical
          reflex). The chapter's use of Tammuz as the body-prose form is
          arguably out of glossary alignment, BUT the brief explicitly names
          the gatekeepers as "Tammuz (Dumuzi)" and "Gizzida (Ningišzida)" in
          the entities_glossary. Recommend a short editorial decision: either
          align the chapter to the glossary's "Dumuzi" body-form, or update
          the glossary (Dumuzi entry) to allow Tammuz as the variant used
          specifically in the Adapa heaven-gate scene where Tammuz is the
          form preserved in the standard translations (Foster and Dalley both
          use "Tammuz" for this scene). I lean toward the glossary update,
          since the standard English translations of Adapa use Tammuz, and
          the Adapa glossary already permits "Tammuz" via the brief.
        - "Anzu" / "Anzud", "Inanna", "An" not used. "Apsû" used correctly
          (claim 16). "Eridu" used correctly (claims 11, footnote and body
          throughout). Compliant.
    evidence: ~
    recommended_fix: |
