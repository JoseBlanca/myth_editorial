    evidence: |
      See F-6.
    recommended_fix: |
      See F-6.

  - claim_number: 26
    finding_id: F-13
    kind: MARKER-MISUSED
    severity: MEDIUM
    claim: |
      "[RECONSTRUCTION: The opening of the Nineveh recension — including the
      seven-fold breaking of the south wind's wing — is reconstructed from
      cross-fragment readings within the Neo-Assyrian witnesses. | gap_source:
      Fragments B, C, D opening | fill_source: internal cross-fragment joins
      among the Nineveh manuscripts (K.8743 + duplicates), collated by Izre'el
      2001 | confidence: medium]"
    issue: |
      Three problems compound here:
        (1) Fragment-letter inversion as F-1 (Nineveh fragments are A, A1, C,
            D, E — not B, C, D).
        (2) The reconstruction is allegedly of "the seven-fold breaking of the
            south wind's wing", but that detail is not attested in any source
            I verified (cf. F-4) and is not the kind of detail that is
            recoverable by cross-fragment internal joins (it is either in the
            text or it is not).
        (3) The south-wind episode is preserved in the Amarna fragment
            (Fragment B in Izre'el's scheme), not reconstructed from Nineveh
            joins. The reconstruction marker therefore refers to a non-event
            (a non-attested sevenfold breaking) and routes through the wrong
            fragments.
    evidence: |
      See F-1 and F-4 evidence blocks.
    recommended_fix: |
      Strike the RECONSTRUCTION marker entirely, OR replace it with a properly
      framed reconstruction. A defensible RECONSTRUCTION marker for this
      chapter would address the cosmological/wisdom prologue of the Nineveh
      recension (Fragment A's "He perfected him with great intelligence...
      to him he gave wisdom, he did not give him eternal life"), where the
      Nineveh fragments together with their parallels in apkallu lists supply
      framing material absent from the Amarna copy. The fill_source should
      name Fragment A and Fragment A1 (Nineveh, MLC 1296 + K 15072) explicitly,
      not "K.8743 + duplicates".

