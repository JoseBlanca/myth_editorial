claim_coverage:
  total_claims: 18
  mapped: 18
  unmapped: 0
  claim_mapping:
    - claim_number: 1
      claim_text: "Source overview: *The First Brick* is a short late-Babylonian Akkadian building incantation that grounds the temple-renovation ritual in a cosmogonic narrative: Ea creates the cosmic freshwater deep and then fashions from clay a divine craft-pantheon — the labour-force whose human counterparts later perform temple-renovation work."
      claims_line: 41
      narrative_line: 4
      status: MAPPED
      note: "Reformulated as an opening 'establishing shot' first paragraph that compresses the source-overview content into a synoptic forecast (Lambert as editor + Ea fashions the freshwater deep + seventeen craft-pantheon deities + king + mankind + Marduk-absent + Ea-centred-minority-register + cosmogonic-genealogy-of-renovation). The opening footnote at draft line 4 is byte-identical to the claims-line-41 footnote (Lambert 2013, pp. 376–383)."
    - claim_number: 2
      claim_text: "The composition has no preserved ancient title. *The First Brick* is editorial — taken from the surviving content's foregrounding of the *libittu maḫrītu* in the temple-renovation ritual. Lambert 2013 establishes the editorial title and the chapter's place in the late-Babylonian creation dossier; Streck 2014's review independently confirms title and Part-III placement."
      claims_line: 44
      narrative_line: 7
      status: MAPPED
      note: "Verbatim. Footnote byte-identical including the Streck 2014 named-but-flagged citation."
    - claim_number: 3
      claim_text: "The standard critical edition — and the only modern critical edition — is Lambert 2013, pp. 376–383. There is no widely-used English-language anthology translation in either Foster's *Before the Muses* (3rd ed., 2005) or Dalley's *Myths from Mesopotamia* (rev. ed., 2008); Lambert 2013 stands alone as the modern reference."
      claims_line: 47
      narrative_line: 10
      status: MAPPED
      note: "Verbatim apart from minor de-duplication: claims 'There is no widely-used English-language anthology translation of *The First Brick* in either Foster's *Before the Muses* (3rd ed., CDL Press 2005) or Dalley's *Myths from Mesopotamia* (rev. ed., Oxford World's Classics 2008)' → draft 'There is no widely-used English-language anthology translation: neither Foster's *Before the Muses* (3rd ed., 2005) nor Dalley's *Myths from Mesopotamia* (rev. ed., 2008) includes *The First Brick*.' Publisher names dropped from body prose; full bibliographic data retained in footnote. No factual loss."
    - claim_number: 4
      claim_text: "Manuscript witnesses: multiple Late Babylonian copies, principally WVDOG 4 plate 12 (early-twentieth-century Berlin excavation publication), with additional Late Babylonian tablets that Streck 2014 records as 'etc.', plus a late Assyrian fragment. Witnesses function as duplicates of a single recension rather than recensional variants."
      claims_line: 51
      narrative_line: 14
      status: MAPPED
      note: "Verbatim. The round-1 F-2 (CITATION-WRONG) fix to multi-witness framing is preserved byte-identical; no slippage to single-witness framing. Footnote preserves Streck 2014, *BSOAS* 77, 371–372 named-but-flagged citation byte-identical."
    - claim_number: 5
      claim_text: "Setting: composition's ritual setting is Babylonian temple **renovation**, not new-temple foundation. Babylonian and Assyrian temple-renovation rites required the recovery of the *libittu maḫrītu* from the existing temple before its rebuilding. The recovered brick was preserved through rebuilding and reset into the new structure as a continuity-marker."
      claims_line: 60
      narrative_line: 23
      status: MAPPED
      note: "Verbatim apart from one prose addition: draft adds 'Jamie Novotny's study of the libittu maḫrītu rite in the royal inscriptions of Esarhaddon and Assurbanipal documents the practice in operation in seventh-century BCE Assyria.' This is a body-prose surfacing of the Novotny named-but-flagged citation that is fully present in the corresponding claims footnote — not a new factual claim, just a prose attribution of content already in the citation. The round-1 F-3 (CITATION-WRONG) fix to renovation-not-foundation framing is preserved byte-identical; the bold ** emphasis on 'renovation' from the claims is rendered as italic-via-context in the draft section heading 'Renovation, not foundation' (heading reframing)."
    - claim_number: 6
      claim_text: "*The First Brick* gives the renovation rite a cosmogonic genealogy: practitioners who recover and reset the *libittu maḫrītu* recapitulate, on the ritual scale, the divine creation of the craft-pantheon that Ea performed at the beginning. The composition frames renovation labour as the human echo of an originating divine labour-force."
      claims_line: 63
      narrative_line: 26
      status: MAPPED
      note: "Verbatim apart from one minor lexical change: claims 'recapitulate, on the ritual scale' → draft 'are doing on the human scale what Ea did on the divine scale at the beginning'. Semantic equivalent (ritual-scale-recapitulation vs human-scale-vs-divine-scale framing). No factual change."
    - claim_number: 7
      claim_text: "Manuscript form is late Babylonian (first millennium BCE), but the temple-renovation ritual context is older — the *libittu maḫrītu* is attested in Assyrian royal-inscription practice from the seventh century BCE (Esarhaddon and Assurbanipal) and likely deeper into Mesopotamian temple-building cult."
      claims_line: 67
      narrative_line: 30
      status: MAPPED
      note: "Verbatim. Black & Green 1992 + Bottéro 2001 footnote citations preserved byte-identical."
    - claim_number: 8
      claim_text: "Ea — god of wisdom, the freshwater *Apsû*, and incantation, patron of craft and cunning, father of Marduk — is the principal creator deity. The narrative opens with Ea's creation of the freshwater deep (*Apsû*; Sumerian *Abzû* in late-Babylonian Akkadian-Sumerian register that Lambert's translation preserves). The *Apsû* is Ea's own dwelling and the cosmic water-source from which the materials of subsequent creation will be drawn."
      claims_line: 73
      narrative_line: 36
      status: MAPPED
      note: "Verbatim. The locked first-mention Ea gloss from glossary.yaml ('god of wisdom, the freshwater *Apsû*, and incantation, patron of craft and cunning, father of Marduk') is preserved byte-identical. Apsû/Abzû dual-rendering preserved per glossary.yaml's never_use carve-out for explicit Sumerian-tradition citations (Lambert's Akkadian-Sumerian register). Reminder gloss ('the cosmic freshwater deep beneath the earth, his own dwelling') added in body prose, consistent with gloss-ledger.yaml entry for Apsû (last full mention chapter 07)."
    - claim_number: 9
      claim_text: "The Ea-centred framing is distinctive within the late-Babylonian creation dossier. Where *Enūma Eliš* (ch 1), *Enmešarra's Defeat* (ch 6), *The Toil of Babylon* (ch 7), *Uraš and Marduk* (ch 8), *Damkina's Bond* (ch 9), and *The Founding of Eridu* (ch 10) are Marduk-centred, *The First Brick* foregrounds Ea. Marduk is not named in the surviving narrative; the composition belongs to the dossier's Ea-centred minority register."
      claims_line: 78
      narrative_line: 41
      status: MAPPED
      note: "Verbatim. Chapter-cross-reference list (chapters 1, 6, 7, 8, 9, 10 as Marduk-centred) preserved; the explicit-absence statement 'Marduk is not named in the surviving narrative' preserved byte-identical. The round-1 F-1 (CONTAMINATION) fix is preserved: Marduk appears in the body only in the explicit-absence statement, the Ea first-mention gloss, and dossier cross-references."
    - claim_number: 10
      claim_text: "After the creation of the *Apsû*, Ea fashions from clay a series of named deities, each tasked with a specific role in the temple-renovation labour. The clay-creation is the foundational divine act behind the human craft-pantheon: every Mesopotamian artisan whose human work maintains the temples has a divine archetype in the cohort Ea creates here."
      claims_line: 87
      narrative_line: 50
      status: MAPPED
      note: "Verbatim. Foster 2007 footnote citation on the late-Babylonian incantation-cosmogony genre preserved byte-identical."
    - claim_number: 11
      claim_text: "The first deity created is Kulla, the brick-god — the divine artisan responsible for renovating the *libittu maḫrītu*. Kulla's creation is the cosmogonic centre of the composition's narrative: the brick-god, fashioned from the same clay he will subsequently work, is the divine archetype of the brick-laying artisan whose human counterparts perform the temple-renovation rite."
      claims_line: 91
      narrative_line: 54
      status: MAPPED
      note: "Verbatim. Black & Green 1992 s.v. Kulla footnote preserved (named-but-flagged qualifier in claims slightly tightened in draft footnote: 'Black & Green 1992, s.v. Kulla' without the parenthetical 'named-but-flagged: Black & Green 1992 includes a Kulla entry; consult'; minor stylistic compression with no factual change since the Black & Green entry is a confirmed source-id in sources.yaml)."
    - claim_number: 12
      claim_text: "After Kulla, Ea creates Ninildu, Ninsimug, and Ninagal — three further craft-deities tasked with assisting in the construction work: the divine carpenter (Ninildu), the divine smith (Ninsimug), and the divine metalworker (Ninagal), each named in the surviving lines as a participant in the temple-renovation labour."
      claims_line: 95
      narrative_line: 58
      status: MAPPED
      note: "Verbatim. Three-deity construction trio with role-assignments (carpenter / smith / metalworker) preserved byte-identical."
    - claim_number: 13
      claim_text: "Ea then creates a further cohort: Arazu, Guškinbanda, Ninzadim, Ninkurra, Ašnan, Laḫar, Siris, Ningišzida, Ninšar, Adag, Umunmutamgu, and Umunmutamnag — tasked variously with supplying resources to mankind for regular offerings (grain, beer, wool, vegetables, etc.). The composition extends its cosmogonic framework outward from the renovation itself to the full economy of cult provisioning."
      claims_line: 99
      narrative_line: 62
      status: MAPPED
      note: "Verbatim. All twelve deity names preserved byte-identical with diacritics intact (Arazu, Guškinbanda, Ninzadim, Ninkurra, Ašnan, Laḫar, Siris, Ningišzida, Ninšar, Adag, Umunmutamgu, Umunmutamnag). Resource-supply offerings list (grain, beer, wool, vegetables) preserved with 'etc.' parenthetical dropped to em-dash list — semantic equivalent."
    - claim_number: 14
      claim_text: "The final deity Ea creates is Kusu, addressed as 'chief priest of the great gods.' Kusu is tasked with performing the rites of the temple — the priestly counterpart to the artisanal Kulla. Together, Kulla and Kusu cover the full sacerdotal-and-artisanal economy of the temple-renovation ritual."
      claims_line: 103
      narrative_line: 66
      status: MAPPED
      note: "Verbatim. The 'chief priest of the great gods' direct quote preserved byte-identical. Kulla / Kusu pairing as artisanal / priestly archetypes preserved verbatim. Black & Green 1992 s.v. Kusu footnote preserved with the same minor named-but-flagged-parenthetical stylistic compression as for Kulla."
    - claim_number: 15
      claim_text: "In addition to the seventeen named craft-pantheon deities, Ea creates a king and mankind — the institutional and human counterparts to the divine labour-force. The king commissions the renovation work; mankind provides the regular offerings that the maintained temples require; the divine craftsmen and priest provide the divine archetypes that authorise both."
      claims_line: 107
      narrative_line: 70
      status: MAPPED
      note: "Verbatim. King-and-mankind co-creation preserved; 'seventeen named craft-pantheon deities' anchor preserved byte-identical."
    - claim_number: 16
      claim_text: "The composition concludes by tying the cosmogonic narrative back to the ritual present. Each renovation of each Babylonian temple is, in the composition's theology, a recapitulation of the divine labour-force's foundational work; each *libittu maḫrītu* recovered and reset is a continuity-marker not only between the old and new temple but between the human renovation and the divine creation that authorises it."
      claims_line: 115
      narrative_line: 78
      status: MAPPED
      note: "Verbatim. The 'continuity-marker' double-function (old-vs-new temple AND human-vs-divine renovation) preserved byte-identical."
    - claim_number: 17
      claim_text: "The Akkadian common noun *libittu* — 'brick' — is the underlying lexical term; the technical phrase used in the composition and parallel royal-inscription rites is *libittu maḫrītu* ('first/former brick'). The qualifier *maḫrītu* (from *maḫrû* 'first, former, prior') marks the brick as the original brick of the existing temple, recovered for reuse rather than as a brand-new inaugural brick."
      claims_line: 120
      narrative_line: 83
      status: MAPPED
      note: "Verbatim. CAD L s.v. libittu and CAD M/I s.v. maḫrû footnote citations preserved byte-identical. The temporal-logic explanation ('first' because original of old building, not because inaugural of new) preserved verbatim."
    - claim_number: 18
      claim_text: "Variants and witness: multiple Late Babylonian witnesses (principally WVDOG 4 plate 12, with additional Late Babylonian tablets per Streck 2014's 'etc.') plus a late Assyrian fragment. Textual history of modern scholarship is confined to Lambert 2013's critical edition; there is no earlier critical edition or anthology translation that supersedes it."
      claims_line: 128
      narrative_line: 91
      status: MAPPED
      note: "Verbatim. Streck 2014 named-but-flagged citation preserved byte-identical."

  body_paragraph_claims_beyond_numbered_18:
    description: |
      The numbered 18 claims above cover the body-narrative claim
      paragraphs. The claims document also has body paragraphs in the
      "The poem's place in the corpus" section and the "Closing
      reflection: the diversity of Babylonian creation thought"
      section that are not separately numbered above but are
      footnoted EVIDENCE claims and therefore audited here for
      completeness.
    additional_claims:
      - claims_line: 133
        narrative_line: 96
        topic: "*The First Brick* is marginal in attestation. Modest manuscript footprint (a few Late Babylonian tablets and a late Assyrian fragment) places it well below the canonical-recension distribution of *Enūma Eliš* or *Atra-ḫasīs*. Scholarly significance lies less in liturgical breadth than in its position within the late-Babylonian creation dossier as one of the dossier's Ea-centred minority compositions, alongside the cosmogonic incantation prologues and certain bilingual creation accounts."
        status: MAPPED
        note: "Verbatim. Foster 2007 footnote citation preserved byte-identical."
      - claims_line: 137
        narrative_line: 100
        topic: "Within the dossier, *The First Brick* contributes the polytheistic / craft-pantheon-creation register: cosmogony staged as the divine creation of a labour-force. One of the clearest Akkadian witnesses to the theology in which divine creation is itself a labour of crafts — Ea fashioning artisans from clay rather than (as in *Enūma Eliš*) Marduk splitting a primordial body, or (as in *Atra-ḫasīs*) the lower gods rebelling against forced labour."
        status: MAPPED
        note: "Verbatim. The substantive 'primordial' use ('Marduk splitting a primordial body', referring to Tiamat in *Enūma Eliš*) is the single occurrence in the chapter, preserved byte-identical from claims and used as a substantive comparator rather than as ornament. The contrast triple (*The First Brick* / *Enūma Eliš* / *Atra-ḫasīs*) preserved byte-identical."
      - claims_line: 144
        narrative_line: 107
        topic: "Closing reflection on the diversity of Babylonian creation thought: this chapter is the closing piece of the cosmogonic cycle in the book (chapters 1–12). The cycle has moved from *Enūma Eliš* — the dominant Babylonian cosmogony, the *akītu*-festival recitation that frames Marduk's kingship in cosmic-combat terms — through ten further compositions that together register the diversity of Babylonian creation thought beyond the dominant epic."
        status: MAPPED
        note: "Verbatim apart from minor connective: claims 'This chapter is the closing piece of the cosmogonic cycle in the book (chapters 1–12)' → draft 'This is the closing chapter of the cosmogonic cycle of the book' (slight prose tightening; no factual change). The *akītu* gloss-ledger BARE-cross-reference handling preserved (last full gloss in chapter 01)."
      - claims_line: 148
        narrative_line: 111
        topic: "The cosmogonic dossier, taken as a whole, has shown that Babylonian creation thought is not monolithic. Cosmogony is staged as combat (*Enūma Eliš* ch1, *The Slaying of Labbu* ch5, *Enmešarra's Defeat* ch6); flood-survival and human-creation (*Atra-ḫasīs* ch2); failure-narrative of human-divine boundary (*Adapa* ch3); theogonic genealogy and violent succession (*The Theogony of Dunnu* ch4); labour-rebellion and divine alienation (*The Toil of Babylon* ch7); boundary-disputes between gods (*Uraš and Marduk* ch8); marital bond and cosmic order (*Damkina's Bond* ch9); city-and-rivers foundation (*The Founding of Eridu* ch10); etiological incantation against affliction (*The Worm and the Toothache* ch11); and divine creation of a craft-pantheon for temple renovation (*The First Brick* ch12)."
        status: MAPPED
        note: "Verbatim apart from one minor stylistic change at the close: claims 'and, in this final chapter, as the divine creation of a craft-pantheon for temple renovation (*The First Brick*)' → draft 'and, in this final chapter, as the divine creation of a craft-pantheon for temple renovation' (the parenthetical title '*The First Brick*' dropped because the chapter title is implicit in 'this final chapter'). No factual change. All eleven cross-chapter cross-references preserved byte-identical."

