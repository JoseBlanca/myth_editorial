      topic: "Multiple Late Babylonian witnesses (principally WVDOG 4 plate 12, with additional Late Babylonian tablets per Streck 2014's 'etc.') plus a late Assyrian fragment. Several lines damaged across witnesses; precise sequence of Ea's clay-creation of named craft-pantheon deities and assignment of renovation labour partly reconstructed. Late Assyrian fragment provides limited cross-witness control but does not eliminate need for philological reconstruction."
