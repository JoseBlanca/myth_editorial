      status: PRESERVED_VERBATIM
      note: "basis cites Black & Green 1992 s.v. Ea (Ea as patron of *kullatu* / craftsmen's pantheon) + the seventeen named deities are precisely the craft-pantheon + the cosmogonic narrative is the etiology of the divine craft-corps; risk acknowledges interpretive status of the structural reading; byte-identical to claims line 83."
    - kind: INFERENCE
