  - finding_id: F-5
    claim_number: "INFERENCE marker line 56 (architectural-cosmogony sub-corpus framing); COMPARATIVE-HOOK marker line 131"
    kind: INFERENCE-OVER-EXTENDS
    severity: MEDIUM
    claim: |
      "*The First Brick* belongs to the Akkadian sub-corpus of
      architectural-cosmogony texts: short compositions in which
      cosmogony is staged as construction. The closest
      Akkadian-internal parallels are *The Toil of Babylon*
      (chapter 7) and *The Founding of Eridu* (chapter 10); together
      these three compositions represent the late-Babylonian
      theology of construction-as-cosmogony, in which the
      foundational acts of temple-building are framed as the
      earthly recapitulation of cosmogonic action."
    issue: |
      The architectural-cosmogony sub-corpus framing is more
      strained than the INFERENCE marker allows. *The Founding of
      Eridu* (per chapter 10) is a Marduk-centred city-foundation
      cosmogony; *The Toil of Babylon* (per chapter 7) is a
      labour-rebellion / Marduk-cosmogonic composition; *The First
      Brick* is principally an Ea-centred craft-pantheon-creation
      composition for temple renovation. The common thread
      "construction" is real; the common thread
      "cosmogony-framed-as-Marduk-centred-construction" is not
      (since *First Brick* is Ea-centred, not Marduk-centred — see
      Finding F-1). The INFERENCE marker correctly hedges the
      grouping as a "modern editorial reading", but this hedge
      does not adequately reflect the divine-actor mismatch
      between the three compositions.
      Severity MEDIUM because the marker does correctly identify
      itself as a modern editorial reading and acknowledges its
      interpretive risk; but the hedge does not flag the specific
      problem that the three compositions have different
      principal divine actors.
    evidence: |
      Per Finding F-1, *The First Brick*'s principal divine actor
      is Ea (with a craft pantheon of seventeen created deities),
      not Marduk. Per the chapter 10 brief, *The Founding of
      Eridu*'s principal divine actor is Marduk. Per the chapter 7
      brief, *The Toil of Babylon*'s principal narrative engine is
      the labour-rebellion Marduk-cosmogonic frame. The three
      compositions differ in principal divine actor, ritual
      context (Eridu = city-foundation cosmogony; Toil = labour
      narrative; First Brick = temple-renovation incantation), and
      cosmogonic register.
    recommended_fix: |
      The INFERENCE marker at line 56 should be revised to
      explicitly note: (i) the three compositions differ in
      principal divine actor (*Founding of Eridu* and *Toil of
      Babylon* are Marduk-centred; *First Brick* is Ea-centred);
      (ii) the unifying thread is "construction-as-cosmogony" only
      at the broadest typological level; (iii) the editorial
      grouping reflects modern thematic categorisation, not ancient
      compositional intent or divine-actor coherence. The
      COMPARATIVE-HOOK at line 131 should be similarly revised.

  - finding_id: F-6
    claim_number: "footnote at line 89 (CAD L, s.v. libittu); footnote at line 91"
    kind: PRECISION
    severity: LOW
    claim: |
      "The Akkadian common noun *libittu* — 'brick' — is rendered
      in Foster's English-translation conventions as 'brick' without
      specialised gloss; in this chapter it is the
      cosmogonic-typological object, but the underlying lexeme is
      ordinary masonry vocabulary."
    issue: |
      The technical Akkadian phrase used in foundation/renovation
      ritual is **libittu maḫrītu** ("first/former brick"; CAD M/I
      s.v. maḫrû), not the bare *libittu*. Novotny "Temple Building
      in Assyria" gives the phrase libittu maḫrītu (variant
      transliteration libittu mañrîtu) consistently throughout. The
      claims document's lexical reading of bare *libittu* is
      under-specified; the brief and chapter would be more accurate
      to flag the libittu maḫrītu phrase as the technical term and
      *libittu* as the underlying brick-noun. CAD reference would
      be CAD M/I (mahru-related entries) in addition to CAD L
      (libittu).
      Severity LOW because the claim is technically correct as a
      lexical observation about the bare *libittu* noun; the
      precision issue is whether the chapter should cite the
      foundation-ritual lemma (libittu maḫrītu) rather than the
      bare lexeme.
    evidence: |
      Novotny "Temple Building in Assyria" p. 117 (verbatim, via
      local pypdf parse): "the libittu mañrîtu (here 'former
      brick')". The phrase recurs throughout pp. 117–120 and
      227–228 of the volume.
    recommended_fix: |
      Optional: replace the bare *libittu* gloss with the technical
      foundation-ritual lemma *libittu maḫrītu* ("the first/former
      brick"), with the bare *libittu* as the underlying brick-noun.
      Adjust the CAD reference in footnote at line 91 accordingly.

