  - finding_id: F-3
    claim_number: "section §'Setting: foundation ritual and the divine archetype' (lines 46–54); section §'The first brick as cosmic prototype' (lines 79–91)"
    kind: CITATION-WRONG
    severity: HIGH
    claim: |
      "Babylonian temple-foundation rites required the formal laying
      of a first brick — the inaugural brick of the building,
      deposited with attendant ritual that consecrated the
      construction. *The First Brick* gives this ritual act a
      cosmogonic genealogy: the first brick laid by a temple-builder
      is a recapitulation of the original brick laid by the gods at
      the founding of the cosmic order."
    issue: |
      The ritual scenario of *The First Brick* (Lambert 2013 ch.
      33) is **temple renovation** (recovering and recycling the
      libittu maḫrītu of an existing temple), NOT new-temple
      foundation as framed in the claims document. Three
      independent Wikipedia articles (s.v. Enki, Kusu,
      Ningishzida) describe the composition as concerning "the
      renovation of temples" / "temple renovation rituals" / "an
      incantation most likely recited during temple renovations".
      Novotny's essay independently confirms the libittu maḫrītu
      ("former brick") is the brick recovered from the existing
      temple, removed during the renovation process, and reset in
      the new structure as a bridge between old and new temples.
      The claims document's "inaugural brick of the building"
      framing — the brick that *initiates* a wholly-new
      construction — is the wrong scenario.
      The wider statement that "Babylonian temple-foundation rites
      required the formal laying of a first brick" is correct as a
      general statement about Mesopotamian foundation cult, but the
      specific way *The First Brick* engages that cult is via the
      renovation cycle (the libittu maḫrītu recovered from the
      previous temple), not via the new-foundation cycle.
      Severity HIGH because: (a) the new-foundation reading
      controls the chapter's central thematic framing — section
      §"The first brick as cosmic prototype" presents the brick as
      "the primal brick" inaugurating temple foundation, which is
      wrong about the composition's actual scenario; (b) the
      cosmogonic-microcosm claim ("the establishment of cosmic
      order at the scale of the building" / "the temple, on this
      reading, is itself a cosmos in microcosm; its foundation
      re-enacts the foundation of the cosmos") is a homiletic
      reading of a wrong premise; the composition's own theology
      foregrounds Ea creating crafts-deities to perform renovation
      labour, not a microcosmic-foundation cosmogony; (c) the
      architectural-cosmogony sub-corpus framing (paired with
      *Toil of Babylon* and *Founding of Eridu*) is built on this
      premise.
    evidence: |
      Wikipedia s.v. Enki (verbatim; footnoted to Lambert 2013 pp.
      376–379): "...a building incantation concerned with the
      renovation of temples..."
      Wikipedia s.v. Kusu (verbatim; footnoted to Lambert 2013 p.
      376): "...an incantation most likely recited during temple
      renovations..."
      Wikipedia s.v. Ningishzida (verbatim; footnoted to Lambert
      2013 p. 376): "...an incantation which served as a part of
      temple renovation rituals..."
      Novotny "Temple Building in Assyria" p. 117 (verbatim, via
      local pypdf parse): "during these careful surveys that
      specialists sought out a/the libittu mañrîtu (here 'former
      brick'). The removal of this brick initiated the rebuilding
      process and served as a bridge between the old and new
      temples."
    recommended_fix: |
      REQUIRED at the brief and claims-document level. The brief's
      cultural_relevance section and special_instructions must be
      corrected to make the temple-renovation context the primary
      framing. The chapter draft must reframe sections §"Setting"
      and §"The first brick as cosmic prototype" to: (i) describe
      the libittu maḫrītu as the brick recovered from the existing
      temple's structure during renovation, recycled into the new
      structure as a continuity-marker between old and new
      temples; (ii) describe the cosmogonic genealogy as the
      genealogy of the renovation labour-force (Ea creates the
      crafts-deities who renovate), not as a new-foundation
      cosmogony; (iii) the cosmogonic-microcosm reading should be
      either removed or substantially hedged. The
      architectural-cosmogony sub-corpus framing should be
      revisited in light of the renovation-not-new-foundation
      reading.

