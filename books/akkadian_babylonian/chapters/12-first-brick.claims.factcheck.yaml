    q2_triangulated_or_assumed: |
      Triangulated for: (1) the Lambert 2013 chapter 33 / page
      range 376–383 / chapter title "The First Brick" — verified
      via DeGruyter Brill chapter landing, DeGruyter Brill volume
      landing, and Streck 2014 BSOAS review (PDF), three independent
      open sources; the brief's preemptive A8-resolution correction
      (from pp. 384–386 → pp. 376–383) is fully corroborated.
      (2) the manuscript count and witness composition — verified
      via Streck 2014 BSOAS review ("WVDOG 4, pl. 12, etc.") and
      Wikipedia s.v. Enki ("Late Babylonian tablets and a late
      Assyrian fragment") that the composition is preserved on
      multiple witnesses (plural Late Babylonian tablets PLUS a
      Neo-Assyrian fragment). The claims document's repeated
      assertion that the composition is preserved on a "single
      late-Babylonian manuscript" with "no parallel manuscripts of
      the composition in any period or dialect" (lines 39, 42, 105)
      is directly contradicted by both independent sources.
      (3) the principal divine actor — independently confirmed via
      THREE Wikipedia articles (s.v. Enki, s.v. Kusu, s.v.
      Ningishzida) that the principal creator-deity in the
      composition is **Ea**, who fashions a series of deities from
      clay, who in turn perform the temple-renovation work. **Marduk
      is not named in any of the three Wikipedia summaries of
      Lambert 2013 ch. 33.** The claims document's central
      organising claim — "Marduk appears in the composition as the
      divine architect of the first brick" (line 60), with section
      §"Marduk as divine architect" being the chapter's principal
      narrative-structural section — is directly contradicted.
      (4) the ritual context — independently confirmed via the
      Wikipedia summaries that the composition is a building
      incantation for **temple renovation** (not new-temple
      foundation), with the libittu maḫrītu being the "first/former
      brick" recovered from existing temple walls and recycled into
      the new structure (Novotny on the Assyrian-royal-inscription
      first-brick ritual; Wikipedia s.v. Enki's description of "the
      renovation of temples"). The claims document frames the
      composition as a NEW-foundation ritual (lines 47–48, "the
      formal laying of a first brick — the inaugural brick of the
      building, deposited with attendant ritual that consecrated
      the construction") — partially correct in that the
      first-brick rite is foundation-ritual context, but the
      specific scenario of *The First Brick* / Lambert 2013 ch. 33
      is temple RENOVATION, not new-temple foundation.
      (5) the wider cast of created deities — independently
      confirmed via Wikipedia s.v. Enki, Kusu, and Ningishzida that
      *The First Brick* features Ea creating Kulla (the brick-god),
      Ninildu, Ninsimug, Ninagal, Arazu, Guškinbanda, Ninzadim,
      Ninkurra, Ašnan, Laḫar, Siris, Ningišzida, Ninšar, Adag,
      Umunmutamgu, Umunmutamnag, and Kusu. The composition is a
      polytheistic / craft-pantheon-creation cosmogony, not a
      Marduk-and-Ea two-actor cosmogony. The brief's
      entities_glossary (limiting the principal divine actors to
      Marduk and Ea) and the claims document's narrative structure
      (sections "Marduk as divine architect" and "Ea and foundational
      construction") are both substantively wrong about the
      composition's actual divine cast.
      (6) the libittu term — verified via Novotny that the technical
      foundation-ritual lexeme is **libittu maḫrītu** ("first/former
      brick"), not the bare *libittu*. The claims document's
      footnote at line 89 ("the Akkadian common noun *libittu* —
      'brick' — is rendered in Foster's English-translation
      conventions...") refers to the bare *libittu*; this is
      under-specified relative to the actual Akkadian phrase used
      in foundation ritual (libittu maḫrītu). Probably acceptable
      at the writer's chosen level of generality, but worth flagging.
      (7) the *ušumgallu* attribute — NOT verified as appearing in
      *The First Brick*. Ušumgallu is well-attested as a Marduk
      epithet in standard Babylonian theology, but no accessible
      independent source confirms its presence in Lambert 2013 ch.
      33. The brief's entities_glossary lists "ušumgallu" as a
      ritual-term in the composition's glossary at high confidence;
      the claims document's section §"The *ušumgallu* attribute and
      the foundation register" (lines 93–99) and the associated
      INFERENCE marker (lines 99) treat the *ušumgallu*'s
      appearance as established. Given that Marduk himself appears
      to be absent from the composition (per the Wikipedia
      summaries), the *ušumgallu* attribute's presence is
      doubly-doubtful: not only is direct attestation unverified,
      but the wider Marduk-centred reading that motivates it is
      itself contradicted by independent sources.
      (8) the cuneiform publication number — verified via Streck
      2014 BSOAS review that the principal cuneiform witness is
      **WVDOG 4 plate 12 (and other manuscripts; "etc.")**. The
      claims document does not cite WVDOG 4 plate 12; it cites only
      Lambert 2013 pp. 376–383 as the loc for all manuscript-related
