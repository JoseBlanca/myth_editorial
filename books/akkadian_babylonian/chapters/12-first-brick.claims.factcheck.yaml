# ── Verdict reasoning ──────────────────────────────────────────────────────

verdict_reasoning: |
  Verdict rules from the skill: BLOCK = ≥3 HIGH or any
  contamination of structural-organising claims or fabricated
  references; MAJOR-REVISE = 1–2 HIGH plus serious structural
  issues; REVISE = 1–2 HIGH or >3 MEDIUM or any silent bridge;
  PASS = 0 HIGH and 0 silent bridges and ≤3 MEDIUM. This audit
  finds:
    HIGH: 3 (F-1 Marduk-as-divine-architect contamination — the
              chapter's central organising claim is wrong, the
              composition is Ea-centred not Marduk-centred;
              F-2 single-late-Babylonian-manuscript framing is
              wrong, the composition has multiple Late Babylonian
              witnesses plus a late Assyrian fragment;
              F-3 new-temple-foundation framing is wrong, the
              composition is a temple-renovation incantation)
    MEDIUM: 2 (F-4 ušumgallu in foundation register unverified;
                F-5 architectural-cosmogony sub-corpus framing
                over-extends given the divine-actor mismatch
                between the three compositions)
    LOW: 2 (F-6 libittu vs. libittu maḫrītu lexical precision;
                F-7 WVDOG 4 plate 12 cuneiform publication
                citation precision)
    NOTES: 3 (N-1 brief-revision audit-A8 fully resolved at
                bibliographic level; N-2 Streck 2014 BSOAS
                review summary; N-3 Wikipedia-Lambert-citation
                chain as round-1 factcheck evidence)

  Per the verdict rules, 3 HIGH findings — and crucially a
  CONTAMINATION finding on the chapter's central organising claim
  (F-1: Marduk-centred reading of an Ea-centred composition) —
  trigger BLOCK. The chapter cannot proceed to chapter-draft
  without a brief-level revision of the entities_glossary,
  cultural_relevance, and special_instructions to correctly
  identify Ea (not Marduk) as the principal divine actor and the
  temple-renovation (not new-foundation) ritual context.

  The structural problem is upstream of the writer: the brief's
  entities_glossary locks "Marduk: divine architect of the first
  brick" at high confidence, and the writer correctly executed
  that brief. The brief itself appears to have been written
  without direct access to Lambert 2013's content; the
  Marduk-and-Ea two-actor framing is a plausible-seeming
  retrofitting of the composition into the wider late-Babylonian
  Marduk-cosmogonic dossier, but it is not what the composition
  actually contains.

  The writer's `caution_on_specific_attestations` field in the
  completion record (`completions/11-chapter-claims-ch12.done.yaml`,
  line 53) explicitly anticipated this audit's main finding: "the
  writer did not have direct access to the primary text — only the
  brief's summary of the composition... Round-1 factcheck should
  focus on whether the structural claims are correctly framed
  against the actual content of Lambert 2013 pp. 376–383 —
  particularly: (a) whether Marduk is the principal divine actor
  (the brief locks 'Marduk: divine architect of the first brick'
  at high confidence; this is the chapter's organising claim);
  (b) whether Ea is the secondary divine actor". This audit's
  answer to (a) is NO — Marduk is not corroborated as a participant
  at all in any independent secondary source citing Lambert 2013
  pp. 376–383. This audit's answer to (b) is YES, but with the
  important inversion that Ea is the **principal** (not secondary)
  divine actor, with a wider craft-pantheon cast of seventeen
  created deities.

  Recommended sequencing for downstream stages:
  (1) BLOCK round-1 factcheck → escalate to human reviewer for
      brief-level reauthorisation BEFORE stage 13 proceeds.
  (2) Brief revision (under human review): rewrite
      entities_glossary, cultural_relevance, and
      special_instructions to reflect the Ea-centred,
      temple-renovation framing with the seventeen-deity craft
      pantheon. Confirm or remove the *ušumgallu* claim (F-4).
      Audit the brief's lacunae and variants sections to reflect
      the multi-witness manuscript history (F-2).
  (3) Once the brief is revised and reauthorised, run a fresh
      stage-11 chapter-claims rewrite (not just a stage-13
      post-human-normalize patch) — the structural problems
      identified here are too deep for line-edit-style
      normalisation; the chapter needs to be rewritten with the
      corrected brief.
  (4) Optional: where direct access to Lambert 2013 chapter 33
      can be obtained (interlibrary loan, an Assyriologist
      consultant, or the Penn State Project MUSE subscription),
      a verbatim verification of (a) the seventeen-deity cast,
      (b) the libittu maḫrītu / temple-renovation framing, (c)
      whether *ušumgallu* appears in the composition, would
      improve confidence.

  Verdict: **BLOCK**.

summary: |
  *The First Brick* (chapter 12 claims) — FACTCHECK VERDICT: BLOCK.

  The bibliographic anchor is correct: Lambert 2013 chapter 33,
  "The First Brick", pp. 376–383, in *Babylonian Creation Myths*
  (Eisenbrauns 2013), Part III "Further Babylonian Creation
  Tales", with cuneiform publication WVDOG 4 plate 12 etc. The
  audit-A8 brief revision (from pp. 384–386 → pp. 376–383) is
  fully corroborated by three independent open sources (DeGruyter
  Brill chapter landing, DeGruyter Brill volume ToC, Streck 2014
  BSOAS review).

  However, three HIGH-severity structural findings BLOCK the
  chapter:

  HIGH (F-1, CONTAMINATION): The chapter's central organising
  claim — "Marduk appears in the composition as the divine
  architect of the first brick" (section §"Marduk as divine
  architect") — is contradicted by three independent Wikipedia
  articles (s.v. Enki, Kusu, Ningishzida), all citing specific
  Lambert 2013 pages within pp. 376–381. Lambert 2013 ch. 33's
  composition is **Ea-centred**, not Marduk-centred. Ea creates
  the Abzû and then fashions from clay seventeen further deities
  (Kulla, Ninildu, Ninsimug, Ninagal, Arazu, Guškinbanda,
  Ninzadim, Ninkurra, Ašnan, Laḫar, Siris, Ningišzida, Ninšar,
  Adag, Umunmutamgu, Umunmutamnag, Kusu) plus a king and mankind,
  who together perform temple-renovation work. **Marduk does not
  appear in any of the three Wikipedia summaries.** The brief's
  entities_glossary (which locks "Marduk: divine architect" at
  high confidence) is the upstream source of the contamination
  and must be revised at brief level.

  HIGH (F-2, CITATION-WRONG): The chapter's repeated assertion of
  "a single late-Babylonian manuscript" with "no parallel
  manuscripts of the composition in any period or dialect" is
  wrong. The composition is preserved on **multiple Late
  Babylonian tablets** (Streck 2014: "WVDOG 4 plate 12, etc.";
  Wikipedia s.v. Enki: "Late Babylonian tablets" plural) **plus a
  late Assyrian fragment** (Wikipedia s.v. Enki, citing Lambert
  2013 p. 376). The LACUNA, RECONSTRUCTION, and VARIANT markers
  all inherit this wrong manuscript-count premise.

  HIGH (F-3, CITATION-WRONG): The chapter's framing of the ritual
  context as **new-temple foundation** ("the inaugural brick of
  the building... that consecrated the construction") is wrong;
  Lambert 2013 ch. 33 is a building incantation for **temple
  renovation** (recovering and recycling the libittu maḫrītu of
  the existing temple), per all three independent Wikipedia
  summaries and per Novotny's essay on the libittu maḫrītu rite.

  Plus 2 MEDIUM findings (F-4 *ušumgallu* in foundation register
  unverified — not corroborated by any open source as appearing
  in *The First Brick*; F-5 architectural-cosmogony sub-corpus
  framing over-extends given the divine-actor mismatch); 2 LOW
  findings (F-6 libittu vs. libittu maḫrītu precision; F-7 WVDOG
  4 plate 12 citation precision); and 3 NOTES.

  Per the verdict rules, 3 HIGH findings plus a CONTAMINATION
  finding on the chapter's central organising claim (F-1) trigger
  **BLOCK**. The chapter cannot proceed to chapter-draft without
  a brief-level revision of entities_glossary, cultural_relevance,
  and special_instructions to correctly identify (i) Ea as the
  principal divine actor, with the seventeen-deity craft pantheon
  as the wider divine cast; (ii) temple-renovation (not
  new-foundation) as the specific ritual context; (iii) the
  multi-witness manuscript history (Late Babylonian tablets plus
  late Assyrian fragment). The writer's
  `caution_on_specific_attestations` field in the completion
  record explicitly anticipated this audit's main finding and
  asked round-1 factcheck to verify the Marduk-as-principal-actor
  claim; the answer is no, the claim is not supported, and the
  chapter requires substantial structural revision (not just
  line-edit normalisation) before advancing.

  Recommended action: BLOCK the chapter at stage 13
  post-human-normalize; escalate to human reviewer for brief-level
  reauthorisation; once the brief is corrected, run a fresh
  stage-11 chapter-claims rewrite. The bibliographic anchor (pp.
  376–383, ch. 33, *The First Brick*) is correct and may be
  preserved as-is.
