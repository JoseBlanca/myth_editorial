notes:
  - note_id: N-1
    note: |
      Lambert 2013 chapter 33 / The First Brick / pp. 376–383 is
      the brief's locked principal anchor. The audit-A8-resolution
      brief revision (from pp. 384–386 → pp. 376–383) is
      independently corroborated by THREE open sources: (i) the
      DeGruyter Brill chapter landing
      (doi:10.1515/9781575068619-028); (ii) the DeGruyter Brill
      volume table of contents
      (doi:10.1515/9781575068619); (iii) Streck 2014 BSOAS review
      of the volume. The corrected page range 376–383 is correct
      and the audit-A8 finding is fully resolved at the
      bibliographic level. (The structural finding F-1 is a
      separate, deeper issue.)

  - note_id: N-2
    note: |
      Streck 2014 BSOAS review (Bulletin of the School of Oriental
      and African Studies 77 [2014] 371–372) is a useful
      independent witness for any Lambert 2013 reference; the
      review survives in open access at the University of Leipzig
      institutional repository
      (gkr.uni-leipzig.de/.../Streck_2014_ReviewLambert.pdf). The
      review distinguishes 16 texts in Part III "Further Babylonian
      Creation Tales" — *Enmešarra's Defeat*, *The Town of
      Zarpānītum*, *The Toil of Babylon*, *Uraš and Marduk*, *The
      Murder of Anšar*, *Damkina's Bond*, *The Defeat of Enutila,
      Enmešarra, and Qingu*, *Enki and Ninmaḫ*, *The Exaltation of
      Nabû*, *A Unilingual/Bilingual Account of Creation*, *The
      Slaying of Labbu*, *The Founding of Eridu* (with cuneiform
      publication BM 93014; last edition by C. Ambos,
      *Mesopotamische Baurituale*, Dresden 2004, pp. 200–207),
      *The First Brick* (WVDOG 4 plate 12 etc.), *Another
      Dragon-Slaying Episode* (KAR 6), *The Theogony of Dunnu* (CT
      46, 43), and *The River Incantation*. The review also notes
      that Lambert 2013's notes on these editions are at pp.
      493–526 and the hand-copies/photos are at pp. 573–605
      (plates 39–71). For chapter 12 specifically, the WVDOG 4
      plate 12 attribution is the principal cuneiform-publication
