      be a useful precision-boost but is not strictly required by
      the skill (Lambert 2013's edition is the brief's locked
      anchor, and Lambert 2013 internally cites WVDOG 4).
      (9) the architectural-cosmogony sub-corpus framing — the
      claims doc's INFERENCE marker (lines 56) groups *First Brick*
      with *Toil of Babylon* (chapter 7) and *Founding of Eridu*
      (chapter 10) as an architectural-cosmogony sub-corpus. This
      framing is a structural reading; the INFERENCE marker
      acknowledges this ("the structural reading is supported by
      their thematic content but not by ancient evidence of
      grouping"). However: given that *The First Brick* is
      principally a polytheistic / craft-pantheon-creation
      cosmogony (Ea's clay-creation of seventeen deities to perform
      temple renovation), its grouping with *The Toil of Babylon*
      and *The Founding of Eridu* as a "construction-as-cosmogony"
      sub-corpus is more strained than the claims document allows.
      The Founding of Eridu (per chapter 10) features Marduk
      establishing cities and rivers; *Toil of Babylon* features
      forced-labour construction; *First Brick* features Ea
      creating crafts-deities for temple renovation. Common thread
      "construction" is real; common thread "cosmogony framed as
      Marduk-centred construction" is not (since *First Brick* is
      Ea-centred, not Marduk-centred). The INFERENCE marker should
      be revised to reflect this nuance.
      Assumed and NOT independently triangulated: Foster 2007
      *Akkadian Literature of the Late Period* placement of the
      composition in the late-period dossier (taken on trust;
      Foster does not edit *First Brick* but may discuss it
      generically; the brief and claims doc cite "passim", which is
      acceptable hedge); Bottéro 2001's general framings on
      foundation-ritual typology and the temple-as-cosmos register
