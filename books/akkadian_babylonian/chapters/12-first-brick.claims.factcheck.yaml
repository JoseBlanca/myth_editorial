    q4_distinguished_variance_from_contamination: |
      The most serious issue is contamination of *The First Brick*
      with the wider late-Babylonian Marduk-cosmogonic dossier:
      the claims document is structurally organised around "Marduk
      as divine architect" (section heading at line 58) when the
      composition is in fact Ea-centred. The contamination appears
      to flow from the brief's entities_glossary (which locks
      "Marduk: divine architect of the first brick" at high
      confidence) and from the broader rhetorical pull of the
      late-Babylonian Marduk-cosmogonic dossier framing — into
      which the composition has been retrofitted. This is a
      brief-level contamination (the brief is wrong about the
      principal divine actor); the writer correctly executed the
      brief but the brief itself is structurally misaligned with
      the composition's actual content. The
      "caution_on_specific_attestations" field in the writer's
      completion record (`completions/11-chapter-claims-ch12.done.yaml`,
      line 53) explicitly flagged that the writer did not have
      direct access to Lambert 2013 and asked the round-1 factcheck
      to verify whether Marduk is the principal divine actor; this
      audit's finding is that he is NOT — Ea is the principal
      creator deity, with a wider polytheistic / craft-pantheon
      cast.
      The COMPARATIVE-HOOK markers are correctly scoped per
      scope.md: the Hebrew Bible (Job 38:6) and Egyptian
      foundation-deposit comparisons appear ONLY in COMPARATIVE-HOOK
      comments at the foot of the chapter, and no EVIDENCE token
      routes through them. The Akkadian-internal cross-references
      (chapters 1–11) are in-scope and supported by Lambert 2013.
      No silent bridges detected: every footnote anchors to an
      EVIDENCE token, every EVIDENCE token's source_id resolves to
      sources.yaml.
      No fabricated references detected: lambert-2013, foster-2007,
      black-green-1992, bottero-2001, cad all resolve to existing
      registry entries. The Lambert 2013 pp. 376–383 / chapter 33
      page-range / chapter-number anchor is independently verified.
      Marker discipline: 3 INFERENCE markers (PASS structurally,
      but at least one — the *ušumgallu*-foundation-register
      inference — is built on doubtful premises since *ušumgallu*'s
      presence in the composition is unverified and the
      Marduk-centred reading underpinning it is contradicted); 1
