      (b) **DeGruyter Brill volume landing
      (doi:10.1515/9781575068619)** — read via WebFetch; directly
      confirmed the full table of contents, including:
      - "The First Brick (p. 376)"
      - "Another Dragon-Slaying Episode (p. 384)" (this is the
        composition that occupies the brief's original-but-corrected
        pp. 384–386, confirming that the original brief's pp. 384–386
        for "First Brick" was indeed wrong; the audit-A8 resolution
