# ── Supported claims (verdict ✓ SUPPORTED) ─────────────────────────────────

supported_claims:
  - claim_number: 1
    claim: |
      "*The First Brick* is a short late-Babylonian Akkadian
      composition... preserved on a single late-Babylonian manuscript
      with several damaged passages. The standard critical edition is
      W. G. Lambert's treatment in *Babylonian Creation Myths*, pp.
      376–383 (chapter 33 in the volume's 'Further Babylonian
      Creation Tales' section)."
    source_id: lambert-2013
    source_loc: "pp. 376–383"
    verdict: SUPPORTED-WITH-CAVEAT
    verbatim_quote: |
      DeGruyter Brill chapter landing (verbatim): chapter "The First
      Brick" by Wilfred G. Lambert, page range 376–383, chapter 33,
      Part III "Further Babylonian Creation Tales". The page range,
      chapter number, chapter title, volume, and Part-III placement
      are directly verified. The "single late-Babylonian manuscript
      with several damaged passages" sub-claim is NOT supported (see
      Finding F-2: Streck 2014 BSOAS review and Wikipedia s.v. Enki
      independently attest multiple Late Babylonian witnesses plus a
      late Assyrian fragment). Treating this claim as
      SUPPORTED-WITH-CAVEAT for the bibliographic anchor and as
      contributing to F-2 for the manuscript-count sub-claim.

  - claim_number: 2
    claim: |
      "There is no widely-used English-language anthology translation
      of *The First Brick* in either Foster's *Before the Muses* (3rd
      ed., CDL Press 2005) or Dalley's *Myths from Mesopotamia* (rev.
      ed., Oxford World's Classics 2008); Lambert 2013 stands alone
      as the modern reference for the composition."
    source_id: lambert-2013, foster-2007
    source_loc: "Lambert 2013, pp. 376–383; Foster 2007, passim"
    verdict: SUPPORTED
    verbatim_quote: |
      Negative attestation. Standard ToCs of Foster 2005 *Before the
      Muses* (3rd ed.) and Dalley 2008 *Myths from Mesopotamia* (rev.
      ed.) do not include *The First Brick*. Foster 2007 covers the
      late-period Akkadian dossier but does not give a full
      translation of this composition. Streck 2014 BSOAS review
      independently confirms Lambert 2013 as a standalone modern
      critical edition for the Part-III "Further Babylonian Creation
      Tales" texts including *The First Brick*. Negative-attestation
      claim correctly stated.

  - claim_number: 3
    claim: |
      "The composition's setting is the foundation-ritual context of
      Babylonian temple-construction. Babylonian temple-foundation
      rites required the formal laying of a first brick — the
      inaugural brick of the building..."
    source_id: lambert-2013, bottero-2001
    source_loc: "Lambert 2013 pp. 376–383; Bottéro 2001 passim"
    verdict: SUPPORTED-WITH-CAVEAT
    verbatim_quote: |
      The general claim that Babylonian temple-foundation rites
      involved the laying of a first brick (Akkadian *libittu
      maḫrītu*) is well-supported by Novotny "Temple Building in
      Assyria" (Esarhaddon and Assurbanipal royal inscriptions
      attest the libittu maḫrītu rite). However: the specific
      ritual scenario of *The First Brick* / Lambert 2013 ch. 33 is
      temple **renovation** (recovering and recycling the libittu
      maḫrītu of an existing temple), not new-temple foundation as
      framed in the chapter (lines 47–48). Wikipedia s.v. Enki, Kusu,
      and Ningishzida all describe *The First Brick* as "the
      renovation of temples" / "temple renovation rituals". The
      foundation-ritual claim in this paragraph is therefore
      partially correct (temple-foundation ritual is the broad
      genre) but partially wrong (the specific ritual is renovation,
      not new-foundation). See Finding F-3 (MEDIUM).

  - claim_number: 4
    claim: |
      "The composition's manuscript form is late Babylonian — first
      millennium BCE — but the foundation-ritual context it
      presupposes is much older, going back to third-millennium
      Mesopotamian temple-construction practice. Royal foundation
      inscriptions, foundation deposits, and the ritual deposit of
      the first brick are attested across the long history of
      Mesopotamian temple-building."
    source_id: black-green-1992, bottero-2001
    source_loc: "Black & Green 1992 s.v. brick, foundation rituals; Bottéro 2001 passim"
    verdict: SUPPORTED
    verbatim_quote: |
      The continuity of Mesopotamian temple-foundation ritual from
      the third millennium through the first millennium is standard
      handbook material, well-attested in Ellis, *Foundation
      Deposits* and in Black & Green 1992 (s.v. brick, foundation
      rituals). The Novotny essay independently corroborates the
      Sargonid-period continuation of older foundation practice.
      The general claim is supported.

  - claim_number: 11
    claim: |
