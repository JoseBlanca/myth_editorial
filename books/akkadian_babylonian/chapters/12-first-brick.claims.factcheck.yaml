# ── Findings (anything not ✓ SUPPORTED) ────────────────────────────────────

findings:
  - finding_id: F-1
    claim_number: "section §'Marduk as divine architect' (lines 58–66); brief entities_glossary (Marduk first); INFERENCE marker line 99"
    kind: CONTAMINATION
    severity: HIGH
    claim: |
      "Marduk appears in the composition as the divine architect of
      the first brick. The cosmogonic act of laying the first brick
      is attributed to him, in keeping with the late-Babylonian
      theology that places Marduk at the centre of cosmogonic and
      architectural-foundational events alike. The composition's
      brick-laying is thus a Marduk-centred cosmogony: the city,
      the temple, and the cosmos itself originate in his founding
      act."
    issue: |
      The principal divine actor in *The First Brick* (Lambert 2013
      ch. 33) is **Ea**, NOT Marduk. Three independent Wikipedia
      articles (s.v. Enki, s.v. Kusu, s.v. Ningishzida), all
      citing Lambert 2013 with specific page numbers within pp.
      376–381, describe the composition as featuring **Ea** as the
      creator deity who fashions the Abzû and then creates from
      clay seventeen further deities (Kulla, Ninildu, Ninsimug,
      Ninagal, Arazu, Guškinbanda, Ninzadim, Ninkurra, Ašnan,
      Laḫar, Siris, Ningišzida, Ninšar, Adag, Umunmutamgu,
      Umunmutamnag, Kusu) plus a king and mankind, who together
      perform the temple-renovation ritual. **Marduk is not named
      in any of the three Wikipedia summaries of Lambert 2013 ch.
      33.** The s.v. Kulla entry separately names **Mušdam** (not
      Marduk) as the divine architect alongside Kulla in
      foundation-cult texts.
      The chapter's central organising claim — section
      §"Marduk as divine architect" — is therefore directly
      contradicted by the independent secondary literature. The
      claims document has retrofitted *The First Brick* into the
      late-Babylonian Marduk-cosmogonic dossier framing under
      which it is not in fact a Marduk composition. This is
      contamination from the wider dossier into a composition that
      is in fact Ea-centred.
      The brief's entities_glossary (which lists Marduk first as
      "the divine architect of the first brick" at high confidence,
      with Ea second as "associated with foundational construction"
      at high confidence) is itself the upstream source of the
      contamination. The writer correctly executed the brief but
      the brief is structurally wrong about the composition's
      principal divine actor.
      Severity HIGH because: (a) the Marduk-centred reading is the
      chapter's organising structural claim, controlling the
      narrative architecture from the source-overview through the
      closing reflection; (b) the brief's entities_glossary is the
      upstream source and propagates the error to the chapter-draft
      stage if not corrected; (c) the writer's
      `caution_on_specific_attestations` flag in the completion
      record explicitly asked round-1 factcheck to verify this
      claim, anticipating exactly this finding.
    evidence: |
      Wikipedia s.v. Enki, section "The First Brick" (verbatim, via
      MediaWiki API; footnoted to Lambert 2013 pp. 376–379, 377,
      381): "Ea appears in his role as a creator deity in a
      building incantation concerned with the renovation of temples
      known from Late Babylonian tablets and a late Assyrian
      fragment, dubbed 'The First Brick'. It contains a creation
      myth in which Ea creates the Abzû and then fashions from
      clay various deities, as well as a king and mankind, which
      all participate in the temple renovation process. The deities
      created are Kulla, tasked to renovate the first brick, the
      deities Ninildu, Ninsimug and Ninagal, tasked to help with
      the construction, the deities Arazu, Guškinbanda, Ninzadim,
      Ninkurra, Ašnan, Laḫar, Siris, Ningišzida, Ninšar, Adag,
      Umunmutamgu, and Umunmutamnag, the last eight of which are
      instructed to supply resources to mankind for their regular
      offerings, and finally Kusu, tasked to perform the rites of
      the temple."
      Wikipedia s.v. Kusu (goddess) (verbatim; footnoted to Lambert
      2013 pp. 376, 381): "In the text *The First Brick*, an
      incantation most likely recited during temple renovations,
      Kusu, addressed as the 'chief priest of the great gods,' is
      listed as one of the deities created by Ea from clay."
      Wikipedia s.v. Ningishzida (verbatim; footnoted to Lambert
      2013 pp. 376, 381): "In a later incantation which served as
      a part of temple renovation rituals, referred to as *The
      First Brick* by Wilfred G. Lambert, Ningishzida is mentioned
      in a similar context alongside many other deities, such as
      Lisin, Gukishbanda, Kulla, Lahar and Ninshar."
      Three independent secondary sources, all footnoted to
      specific Lambert 2013 pages within the chapter's pp. 376–383
      range, converge on Ea as the principal creator deity and on
      a polytheistic / craft-pantheon-creation cosmogony with
      seventeen named deities. Marduk is conspicuously absent.
    recommended_fix: |
      REQUIRED at the brief and claims-document level. The brief's
      entities_glossary must be corrected to:
      (1) Ea — principal creator deity; fashions the Abzû and
      creates from clay the seventeen craft-pantheon deities, the
      king, and mankind; the central divine actor.
      (2) Kulla — brick-god created by Ea; tasked to renovate the
      first brick (libittu maḫrītu).
      (3) Mušdam (if attested in the composition; if not, omit) —
      divine architect.
      (4) The wider craft pantheon: Ninildu, Ninsimug, Ninagal,
      Arazu, Guškinbanda, Ninzadim, Ninkurra, Ašnan, Laḫar, Siris,
      Ningišzida, Ninšar, Adag, Umunmutamgu, Umunmutamnag, Kusu.
      (5) Marduk should be removed entirely from the
      entities_glossary unless an Assyriologist with direct access
      to Lambert 2013 ch. 33 confirms Marduk's appearance in the
      composition. The default position should be that Marduk is
      NOT in *The First Brick*.
      The chapter draft must be substantially restructured: the
      section §"Marduk as divine architect" must be removed or
      replaced with a section §"Ea as creator deity"; the
      section §"Ea and foundational construction" must be revised
      to make Ea the central actor; new sections on Kulla and the
      craft-pantheon must be added; the Marduk-centred framing of
      the closing reflection must be revised. This is a major
      structural revision; the post-human-normalize stage will
      need to coordinate with the brief revision. Recommend
      escalating to the human reviewer for brief-level
      reauthorisation before stage 13 proceeds.

