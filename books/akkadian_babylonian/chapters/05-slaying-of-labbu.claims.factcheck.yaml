# ── Supported claims (verdict ✓ SUPPORTED) ─────────────────────────────────

supported_claims:
  - claim_number: 1
    claim: "*The Slaying of Labbu* is a short, heavily fragmentary Akkadian combat-myth preserved on a single Neo-Assyrian tablet, published as CT 13, plates 33–34 (British Museum)."
    source_id: lambert-2013
    source_loc: "pp. 361–365"
    verbatim_quote: |
      "CT 13, pl. 33-34, Rm 0282 (P385885)... Neo-Assyrian (ca. 911-612 BC)...
      excavated in Nineveh (mod. Kuyunjik)... currently housed in the British
      Museum, London, UK... Genre: Literary... Language: Akkadian"
      (CDLI artifact catalogue, cdli.earth/artifacts/385885 — directly
      verified). The CT-volume publication is L.W. King's *Cuneiform Texts
      from Babylonian Tablets*, Part XIII (1901). Wikipedia s.v. Labbu, in
      its Further Reading, confirms King's 1901 publication of the tablet
      Rm 282 in CT 13. Note: some sources (Wikipedia, Heidel) cite the plates
      as "34-35," and one cites "33f."; the brief's "33-34" is one of the
      attested conventions and matches the CDLI publication record.

  - claim_number: 2
    claim: "The composition has no preserved ancient title; the modern title is editorial, taken from the name of the antagonist Labbu — Akkadian for 'raging' or 'lion-like'."
    source_id: lambert-2013
    source_loc: "p. 361"
    verbatim_quote: |
      "Labbu — meaning 'Raging One' or 'lion'... derived from the root
      labābu meaning 'to rage' or 'to be fierce.'... The verb 'to rage' was
      connected with the lion, the animal best known for raging." (Wikipedia
      s.v. Labbu, summarising the standard etymological discussion).
      Wiggermann (cited in Wikipedia s.v. Labbu): "labbu is an epithet
      ('the raging one')." The "lion" sense is the primary CAD meaning of
      *labbu*; the chapter's "lion-like" is a slight gloss but acceptable.

  - claim_number: 3
    claim: "The standard critical edition is W. G. Lambert's treatment in *Babylonian Creation Myths*, pp. 361–365."
    source_id: lambert-2013
    source_loc: "pp. 361–365"
    verbatim_quote: |
      "Lambert, W.G., *Babylonian Creation Myths* (Eisenbrauns, 2013)" —
      includes a chapter "The Slaying of Labbu" at pp. 361–365 (DeGruyter
      catalogue entry doi:10.1515/9781575068619-026 confirms the chapter
      title and 361–365 pagination; a second chapter on the same myth at
      pp. 366–375 is a parallel treatment, doi:10.1515/9781575068619-027).
      The brief locks 361–365 as the primary pagination.

  - claim_number: 5
    claim: "The single manuscript is Neo-Assyrian in date; no Old Babylonian, Middle Babylonian, or other parallel manuscripts are known [to be available for fill]; the composition cannot be cross-checked against any other witness in the same manuscript-tradition."
    source_id: lambert-2013
    source_loc: "pp. 361–362"
    verbatim_quote: |
      "Neo-Assyrian (ca. 911-612 BC)" — CDLI P385885, directly verified.
      Wikipedia s.v. Labbu and HandWiki s.v. Labbu note an "Old Babylonian"
      version is also attested but in even more fragmentary state — see F-3
      below: this means the "no other manuscripts" claim is partly correct
      (the Neo-Assyrian Rm 282 is the only continuous witness) but the
      chapter omits the existence of a separate, badly broken OB fragment
      that some scholars treat as an earlier recension. The brief's
      lacunae block ("no parallel Akkadian witnesses for fill") is true in
      the practical sense (no parallel covers the lacunae) but the OB
      fragment's existence is a non-trivial omission.

  - claim_number: 6
    claim: "[LACUNA: CT 13, 33–34 — extensive breaks throughout the surviving column; the hero's name, the kill scene, and the post-combat outcome are all lost.] / The surviving fragment preserves only a portion of the narrative: the divine planning council and the start of the combat. The kill itself is broken away, and the post-combat aftermath is not recoverable."
    source_id: lambert-2013
    source_loc: "pp. 361–362"
    verbatim_quote: |
      "imperfectly preserved on a tablet from the library of Assurbanipal,
      Rm. 282" (Wikipedia s.v. Labbu, citing Heidel and Lambert); HandWiki
      s.v. Labbu describes the fragmentary state including "after a gap in
      the narrative, a god whose name is not preserved provides guidance
      on military strategy" and notes the kill itself is lost. The "divine
