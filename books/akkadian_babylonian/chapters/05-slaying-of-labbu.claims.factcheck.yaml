  - claim_number: 18
    claim: "*The Slaying of Labbu* is marginal in attestation but significant as one node in the broader Akkadian combat-myth dossier — alongside Marduk vs. Tiamat, Ninurta vs. Anzû, Erra and Išum's plague-combat, and the Cuthaean Legend's monstrous adversaries — and Labbu sits among them as an alternative combat-cosmogony."
    source_id: lambert-2013
    source_loc: "pp. 364–365"
