# ── Findings (anything not ✓ SUPPORTED) ────────────────────────────────────

findings:
  - finding_id: F-1
    claim_number: 11
    kind: UNVERIFIED
    severity: HIGH
    claim: |
      "A divine champion is dispatched against Labbu. The champion's name,
      however, is broken in the surviving manuscript and cannot be
      recovered with certainty." [+ INFERENCE marker stating "the lost
      hero is most commonly identified by scholars as Tišpak... the
      hero's name is lost in the manuscript and the Tišpak identification
      is conjectural rather than textually preserved."]
    issue: |
      The chapter's claim that the hero's name is broken in the manuscript
      and is recoverable only by conjecture appears to be FALSE in the
      strong form the chapter (and brief) commit to. Multiple secondary
      sources translating the surviving lines preserve the explicit
      vocative line "Go, Tišpak, k[ill] Labbu!" (or "Go, Tishpak, [slay]
      the Labbu") as a direct command from the gods to the named champion
      Tišpak in the preserved text. Tišpak's name is therefore PRESERVED
      in the surviving manuscript at the moment of the dispatch — not
      lost. What IS lost is (a) a separate later passage in which "a
      god whose name is not preserved provides guidance on military
      strategy" (HandWiki) and (b) the kill scene itself. The chapter's
      framing collapses these two distinct facts and treats the entire
      Tišpak identification as conjectural; the more accurate reading
      is that Tišpak is named in the surviving dispatch line and that
      the question is whether other parts of the broken text named or
      identified him further. Lambert 2013 (which I did not directly
      open) is the locked critical edition; if Lambert's reading rejects
      the Tišpak attestation in the dispatch line on philological grounds
      (e.g., as a restored/reconstructed reading rather than fully
      preserved), this finding may be downgraded — but the brief's and
      chapter's framing as "the hero's name is LOST" is at minimum
      inconsistent with Wikipedia/HandWiki/eatthefruit.com translations
      and with the standard scholarly summary that "the later version
      seems to feature the god Tišpak as its protagonist." This is a
      HIGH-severity finding because it is the chapter's central narrative
      hinge: if Tišpak is named, then the INFERENCE marker should be
      reframed (the conjecture is about the cult-aetiology / Eshnunna-
      installation reading, not about the name itself), and the chapter
      should report the dispatch line transparently rather than hiding
      the named hero behind a "lost" framing.
    evidence: |
      "Go, Tišpak, k[ill] Labbu! Save the broad land [...]!" (Wikipedia
      s.v. Labbu, quoting the preserved translated text); "Go, Tishpak,
      [slay] the Labbu (?)" (eatthefruit.com, translating the same
      passage, with a question mark indicating philological uncertainty
      about the verb "slay" but NOT about the name Tišpak); "the later
      Assyrian version" features Tišpak as the named champion (HandWiki
      s.v. Labbu); "The later version seems to feature the god Tišpak
      as its protagonist" (Wikipedia s.v. Labbu). The Tišpak Wikipedia
      article does separately note that "Lambert expresses skepticism"
      about Wiggermann's cult-aetiology reading, which is the underlying
      conjecture — but the skepticism is about the *significance* of
      Tišpak's role in the myth (cult origin?), not about whether his
      name appears in the surviving text.
    recommended_fix: |
      The chapter must be reframed to (a) report the preserved dispatch
      line "Go, Tišpak, k[ill] Labbu!" transparently as part of the
      surviving narrative; (b) preserve the brief's distinction between
      what is textually attested and what is conjectural by relocating
      the conjecture to its proper object — namely, the cult-aetiological
      interpretation that Wiggermann advances and Lambert disputes (was
      the myth composed to justify Tišpak's installation as Eshnunna's
      tutelary god? — that is the genuine open question), not the name
      itself; (c) rewrite the LACUNA marker to specify which parts of
      the text are lost — the kill scene, the post-combat outcome, and
      the strategy-advice scene where a separate god's name is broken —
      rather than the hero's name; (d) rewrite the INFERENCE marker so
      its claim is the cult-aetiology reading, with basis (Wiggermann's
      seal-and-mušḫuššu argument) and risk (Lambert's skepticism). On
      the next pass, Lambert 2013 pp. 361–365 must be opened directly
      to confirm which line(s) preserve Tišpak's name and what
      restoration brackets Lambert's edition assigns. If Lambert reads
      the dispatch line as fully restored rather than preserved, the
      chapter's framing can be retained but with explicit acknowledgement
      of the wider scholarly consensus that the line attests Tišpak.

  - finding_id: F-2
    claim_number: 7
    kind: CONTAMINATION
    severity: HIGH
    claim: |
      "The text describes Labbu's monstrous form in some detail: the
      dragon is enormous, covered in scales, with multiple heads in some
      readings, and emerges from the saltwater Sea rather than the
      freshwater Apsû."
    issue: |
      The "multiple heads in some readings" descriptor for Labbu is not
      attested in any secondary source I located. Across Wikipedia s.v.
      Labbu, HandWiki s.v. Labbu, eatthefruit.com's translation, and
      Wiggermann's discussion, Labbu's preserved physical description
      consists of: length (50 bēru), width (1 bēru), mouth (half a
      nindanu), ear-span (one nindanu), tail, and serpentine + leonine
      composite features — "lion, bird and snake features, possessing
      the head of a lion or snake, the horns of a horned viper, the front
      legs of a lion and the hind legs of a bird of prey" (Wikipedia s.v.
      Labbu, citing Wiggermann). The emphasis throughout is "head" in
      the singular — leonine OR serpentine, not multiple. The only
      seven-headed dragon in the comparative dossier is the UGARITIC
      Lôtan (Litan) of the Baal Cycle, which the chapter itself flags
      as a COMPARATIVE-HOOK forward-link to the influences chapter.
      Inserting "multiple heads in some readings" into the Akkadian
      description appears to be a contamination from the Ugaritic
      parallel — exactly the kind of cross-tradition smuggling the
      scope's contamination boundary forbids. The "covered in scales"
      element is also not preserved in the lines I could verify (the
      preserved lines focus on dimensions and limbs, not skin); it may
      be inferred from the serpentine identity but is not directly
      attested in the translations I located. Severity HIGH because
      contamination is a categorical violation per scope.md and per the
      verdict-rules ("any contamination = MAJOR-REVISE" trigger).
    evidence: |
      "The Labbu Myth relates the tale of a possibly leonine but certainly
      serpentine monster: a fifty-league long Bašmu (mušba-aš-ma) or
      sixty-league long Mušḫuššu (MUŠ-ḪUŠ), depending on the version and
      reconstruction" (Wikipedia s.v. Labbu); "the head of a lion or
      snake, the horns of a horned viper, the front legs of a lion and
      the hind legs of a bird of prey" (Wiggermann via Wikipedia — note
      "head" is singular throughout). The seven-headed Lôtan is the
      Ugaritic comparandum (KTU 1.5 I 1–3), correctly placed in the
      chapter's Ugaritic COMPARATIVE-HOOK — and is the most likely
      source of the "multiple heads" smuggling.
    recommended_fix: |
      Strike "with multiple heads in some readings" from claim 7. Replace
      the physical description with one anchored in the preserved text:
      "Labbu is described as enormous (fifty leagues in length, one
      league in width), with serpentine and leonine features — its mouth
      half a nindanu wide, its tail raised; the surviving lines emphasise
      its single composite head (lion or serpent) rather than multiple
      heads." Also strike "covered in scales" unless Lambert 2013 pp.
      362–363 directly attest scales (which I could not verify in the
      translations I have). If a multi-headed reading is genuinely in
      Lambert's commentary as a minority position, the claim can be
      restored with a Lambert page reference and the explicit caveat
      "minority reading"; in the absence of such a citation, strike.

  - finding_id: F-3
    claim_number: 5
    kind: UNVERIFIED
    severity: MEDIUM
    claim: |
      "The single manuscript is Neo-Assyrian in date; no Old Babylonian,
      Middle Babylonian, or other parallel manuscripts are known."
    issue: |
      The Neo-Assyrian dating of CT 13, pl. 33–34 (Rm 282 = P385885) is
      correct and verified at CDLI. The blanket claim that "no Old
      Babylonian, Middle Babylonian, or other parallel manuscripts are
      known" is, however, overstated. Wikipedia s.v. Labbu reports
      explicitly: "extant in two very fragmentary copies: an Old
      Babylonian one and a later Assyrian version from the Library of
      Ashurbanipal, which have no complete surviving lines." HandWiki
      similarly distinguishes the OB version (in which Nergal is the
      hero) from the later Assyrian version (Tišpak). The OB fragment
      is too broken to fill any of the NA lacunae, so the brief's
      lacunae block phrasing ("no parallel Akkadian witnesses for fill")
      is technically true — but the chapter's flat denial of ANY parallel
      manuscript is wrong, and the OB fragment is a significant philological
      detail that bears on the chapter's special-instructions framing
      ("alternative combat-cosmogony dossier"). Severity MEDIUM because
      the lacunae practical conclusion is unchanged but the claim of
      single-manuscript transmission is too strong.
    evidence: |
      "extant in two very fragmentary copies: an Old Babylonian one and
      a later Assyrian version from the Library of Ashurbanipal, which
      have no complete surviving lines" (Wikipedia s.v. Labbu). HandWiki
      s.v. Labbu: "this is the later Assyrian version; in the earlier
      iteration, Nergal filled this role instead." Foster 2007 (per
      sources.yaml notes) is the standard guide to first-millennium
      Akkadian recensional history; if Foster 2007 (not in this chapter's
      registry) confirms the OB fragment, that is the trail to follow on
      the next pass.
    recommended_fix: |
      Rewrite claim 5 to: "The Neo-Assyrian manuscript (CT 13, pl. 33–34)
      is the only continuous witness to the composition. A more
      fragmentary Old Babylonian copy is also attested but is too broken
      to supply parallel readings, and no Middle Babylonian or later
      manuscripts are known." Update the lacunae block in the brief on
      the next revision pass to acknowledge the OB fragment's existence.
      The brief's "single-prevalent" classification stands — there is one
      prevalent (NA) manuscript, but two recensions are attested in
      principle.

  - finding_id: F-4
    claim_number: 14
    kind: UNVERIFIED
    severity: MEDIUM
    claim: |
      "The kill scene is not preserved. Whether the champion uses a
      particular weapon, addresses Labbu in speech, or relies on cunning
      rather than force is unrecoverable."
    issue: |
      The "kill scene is not preserved" claim is correct in the strong
      sense (the actual moment of slaying breaks off). But the chapter's
      "weapon, speech, or cunning is unrecoverable" framing under-states
      what IS preserved: secondary sources report that the surviving
      lines mention a STORM and an ARROW as the champion's instruments
      (HandWiki: "fires an arrow"; Wikipedia: lunar-eclipse imagery
      attached to Sin's role and a storm associated with the combat).
      If these elements are present in Lambert's edition, the chapter
      should report them as partially preserved rather than treating
      the entire weapon-and-method question as opaque. Severity MEDIUM
      because the chapter's lacuna handling is honest but materially
      under-reports the surviving details.
    evidence: |
      "a storm erupts and the victor... in accordance with the advice
      given, fires an arrow to slay the beast" (HandWiki s.v. Labbu);
      "in the poorly preserved Labbu myth Tishpak's divine weapon is a
      seal, and he is described as capable of causing storms" (Wikipedia
      s.v. Tishpak, citing Wiggermann).
    recommended_fix: |
      Append to claim 14: "The surviving lines do, however, mention a
      storm and an arrow in association with the combat, suggesting the
      champion deployed both meteorological and missile weapons; the
      decisive blow itself is not preserved." Cross-check against Lambert
      2013 p. 364 on the next pass. If Tišpak's seal is also attested
      as a weapon (per Wiggermann), that detail can be added with a
      footnote.

  - finding_id: F-5
    claim_number: 6
    kind: UNVERIFIED
    severity: MEDIUM
    claim: |
      "The surviving fragment preserves only a portion of the narrative:
      the divine planning council and the start of the combat."
    issue: |
      The chapter's two-part division ("planning council + start of
      combat") omits a major preserved element: the sources explicitly
      attest a CREATION OR DESIGN scene in which the SEA bears Labbu and
      ENLIL/Ellil designs his shape ("Sea [created] the serpent, /
      Enlil in heaven designed [his shape]"). This is preserved in the
      opening lines, before the divine fear and the Sin council. The
      chapter does mention that Labbu emerges from the Sea (claim 8)
      but never mentions Enlil's role as designer — a load-bearing
      cosmogonic detail since it is what makes the myth a "creation"
      narrative rather than just a combat. Severity MEDIUM because the
      omission is a content gap rather than a factual error; the chapter
      remains structurally sound but is missing an attested narrative
      element.
    evidence: |
      "Sea [created] the serpent, / Enlil in heaven designed [his shape]"
      (translation preserved in Wikipedia s.v. Labbu, HandWiki, and
      eatthefruit.com); "Labbu was thought to be created by the chief
      deity Enlil, to eliminate humanity which had become a nuisance to
      him" (Wikipedia s.v. Labbu — note this is the LATER version's
      framing, in which Enlil's motive parallels Atra-ḫasīs's
      noise-and-flood pattern).
    recommended_fix: |
      Insert a new claim between current claims 7 and 8: "Before the
      divine council, the surviving text preserves a creation/design
      scene in which the Sea (*tâmtu*) bears Labbu and Enlil shapes him
      from heaven." Footnote: Lambert 2013 pp. 361–362 (opening lines);
      Foster 2005 p. 581. This ties the chapter to its cosmogonic-cycle
      placement: Labbu is created by the gods (Sea + Enlil) before he
      is opposed by them — a self-undoing design, paralleling the
      Atra-ḫasīs creation-then-destroy-humanity arc.

  - finding_id: F-6
    claim_number: 11
    kind: MARKER-MISUSED
    severity: MEDIUM
    claim: |
      "[INFERENCE: The lost hero is most commonly identified by scholars
      as Tišpak... the hero's name is lost in the manuscript and the
      Tišpak identification is conjectural rather than textually
      preserved.]"
    issue: |
      The INFERENCE marker's content is partly mis-targeted. The marker
      schema is "[INFERENCE: <claim> | basis: ... | risk: ...]" — the
      <claim> should be a genuinely inferential proposition that the
      writer is offering, not a factual claim that contradicts the
      preserved text. Per F-1, Tišpak's name DOES appear in the surviving
      dispatch line ("Go, Tišpak, k[ill] Labbu!"), so the marker's
      framing of the identification as "conjectural rather than textually
      preserved" is itself inaccurate. The genuine inference here is
      different: it is the cult-aetiological reading (Wiggermann's
      proposal that the myth was composed to justify Tišpak's
      installation as Eshnunna's tutelary god, which Lambert rejects).
      That IS an interpretive inference; the name is not. The brief's
      special_instructions specify "[CONJECTURE: hero's name lost...]"
      as the example marker — the chapter has correctly used INFERENCE
      with conjecture content per the locked schema, but the conjecture
      content itself is mis-targeted. Severity MEDIUM because the
      marker schema is correctly used (basis/risk fields are
      well-formed) and the writer is honestly flagging interpretive
      content; the issue is the underlying factual premise.
    evidence: |
      See F-1 evidence above. Wikipedia s.v. Tishpak: "Wiggermann proposes
      that the Labbu myth served as an explanation for Tishpak's
      associations with serpentine creatures such as mushussu, and as a
      justification for his installation as the tutelary god of Eshnunna.
      However, Wilfred G. Lambert expresses skepticism, calling such
      theories 'speculations' given the myth's poor preservation." This
      is the genuine open question — and the right target for the
      INFERENCE marker.
    recommended_fix: |
      Rewrite the INFERENCE marker to: "[INFERENCE: The Labbu myth was
      probably composed to justify Tišpak's installation as the tutelary
      god of Eshnunna (replacing Ninazu) — Wiggermann's reading. | basis:
      Tišpak's known association with the dragon mušḫuššu on Diyala-region
      cylinder seals; the structural fit between the myth's dragon-
      slaying and Tišpak's iconographic profile; Wiggermann 1997 (in
      'Tišpak, his seal, and the dragon mušḫuššu'). | risk: Lambert 2013
      explicitly rejects this cult-aetiological reading as 'speculation'
      given the poor preservation; the alternative is that the myth
      circulated more widely and Tišpak is one of several attested
      protagonists (the Old Babylonian fragment may name Nergal instead;
      see F-3).]" This relocates the inference to its genuine target
      and brings the chapter into line with both the preserved text and
      the actual scholarly disagreement. Do NOT add Wiggermann 1997 to
      sources.yaml unless an EVIDENCE token is needed; named-but-flagged
      pattern is acceptable here since the chapter's body prose can name
      Wiggermann without an EVIDENCE token routing through his work.

  - finding_id: F-7
    claim_number: 4
    kind: UNVERIFIED
    severity: LOW
    claim: |
      "The accessible English translation cited throughout for narrative
      passages is Benjamin Foster's 'The Slaying of Labbu,' in *Before
      the Muses*, third edition (CDL Press 2005), pp. 581–582."
    issue: |
      Foster 2005 pp. 581–582 is the page reference locked in
      sources.yaml and the brief, used throughout the chapter's
      footnotes. I was unable to independently triangulate this page
      number — Foster 2005's table of contents is not openly available
      online, and one secondary citation (a search-result summary)
      mentioned p. 488 for Foster's Labbu treatment. This may be a
      stale citation referring to the 1996 second edition or to the
      single-volume 1993 first edition (Foster 2005 is the third
      edition, with substantially expanded pagination). Severity LOW
      because the page number is plausible for the third edition's
      placement of short fragmentary creation poems and the brief locks
      it; flagged for the writer to confirm against an opened Foster
      2005 in the next pass.
    evidence: |
      One web-search snippet attributes Foster's "lion-serpent"
      description of Labbu to "Before the Muses (488)"; the locked
      reference in sources.yaml is "Foster 2005, pp. 581–582." The
      discrepancy may be (a) different editions, (b) stale citation
      transmitted across secondary literature, or (c) my source's
      error. CDL Press's third-edition-only printing run for Foster
      2005 means pp. 581–582 is the contemporary reference — but I
      have not directly verified.
    recommended_fix: |
      On the next pass, open Foster 2005 directly and verify that "The
      Slaying of Labbu" appears at pp. 581–582 (not 488 or another
      page). If the actual page is different, update sources.yaml and
      all footnotes. If 581–582 is confirmed, no change needed.

