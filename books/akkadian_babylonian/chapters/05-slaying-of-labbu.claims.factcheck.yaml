  - claim_number: 16
    claim: "The Slaying of Labbu has no parallel manuscripts; CT 13, 33–34 is the [primary continuous] surviving copy of the composition."
    source_id: lambert-2013
    source_loc: "pp. 361–362"
    verbatim_quote: |
      "an ancient Mesopotamian creation epic known only from one copy
