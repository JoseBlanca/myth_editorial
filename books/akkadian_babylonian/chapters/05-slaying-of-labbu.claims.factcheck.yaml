  - claim_number: 8
    claim: "The dragon emerges from the saltwater Sea (Akkadian *tâmtu*), not the freshwater Apsû."
    source_id: lambert-2013
    source_loc: "pp. 362–363"
    verbatim_quote: |
      "The sea (tāmtu) has given birth to the dragon... 'Sea [created] the
