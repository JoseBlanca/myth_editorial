light_fixes_carry_through:
  F1_catalogue_dating:
    location_in_prose: "prose line 15 (Sîn-lēqi-unninni attribution paragraph)"
    fix_preserved: true
    details: |
      The "Late Babylonian … ca. 1200 BCE" framing has been
      replaced throughout. The catalogue is correctly described
      as "preserved on Neo-Assyrian Nineveh manuscripts (seventh
      century BCE, from Ashurbanipal's library) and on Late
      Babylonian witnesses from Babylon; its compositional date
      is conventionally placed in the tenth to seventh centuries
      BCE, since the latest works it names belong to the tenth
      century and the earliest surviving manuscripts are
      seventh-century." The redactor Sîn-lēqi-unninni is
      separately dated "in the late second millennium BCE, in
      the Kassite period (ca. 1300–1000 BCE)". The two dates
      are explicitly distinguished in body prose and in the
      INFERENCE marker basis (preserved verbatim from claims).
  F3_SB_colophon_evidence:
    location_in_prose: "prose line 15 (attribution paragraph) and line 60 (INFERENCE marker)"
    fix_preserved: true
    details: |
      The body paragraph at line 15 names the colophons
      explicitly: "The attribution is named not only in the
      catalogue but also in colophons of SB Gilgameš manuscripts
      at Nineveh and other centres, where later scribal families
      traced their scholarly lineage to Sîn-lēqi-unninni." The
      INFERENCE marker at line 60 augments the basis-clause with
      the corresponding manuscript-level evidence: "the
      SB-Gilgameš-manuscript colophons supply an additional,
      manuscript-level attribution trace that anchors the
      catalogue notice to the SB textual dossier." Both
      occurrences are preserved byte-identical from the
      approved claims.
  F2_third_snort_hedge:
    location_in_prose: "prose line 181 (Bull of Heaven sequence)"
    fix_preserved: true
    details: |
      The first two snort-pit stages are directly attested
      ("with its first snort it opens a pit that swallows a
      hundred men, with its second snort two hundred"). The
      third stage is correctly hedged as escalation without
      a fixed figure: "the snort-pit sequence escalates in
      continuing stages across the SB recension's
      pit-enumeration". No "third snort three hundred" claim
      appears in body prose.
  F4_tablet_XII_literal_word_for_word_framing:
    location_in_prose: "prose lines 10, 303, 316 (VARIANT marker), 342 (COMPARATIVE-HOOK)"
    fix_preserved: true
    details: |
      All four occurrences carry the F-4 sharpened framing:
      (a) line 10 (source overview): "a literal Akkadian
          translation of the second half of the Sumerian
          _Gilgameš, Enkidu, and the Netherworld_ — literal
          in technique (near-verbatim, word-for-word) and
          partial only in scope (covering the Sumerian
          source's second half)";
      (b) line 303 (Tablet XII section): "a literal Akkadian
          translation of the second half of the Sumerian
          poem _Gilgameš, Enkidu, and the Netherworld_
          (ETCSL 1.8.1.4) — literal in technique,
          near-verbatim and word-for-word where it appears,
          and partial only in that it covers the second
          half of the Sumerian source rather than the whole";
      (c) line 316 (VARIANT marker): "literal Akkadian
          translation of the second half … literal in
          technique, partial only in scope";
      (d) line 342 (COMPARATIVE-HOOK): "a literal
          (near-verbatim, word-for-word) Akkadian
          translation of the second half … literal in
          technique and partial only in scope".
      The "partial Akkadian translation" framing flagged in
      F-4 nowhere appears in the prose.

