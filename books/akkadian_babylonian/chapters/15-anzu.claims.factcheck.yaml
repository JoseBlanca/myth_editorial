    q4_distinguished_variance_from_contamination: |
      Sumerian *Lugal-e* contamination boundary properly observed.
      The writer's COMPARATIVE-HOOK at line 243 explicitly
      preserves *Lugal-e* as "comparative only" and "NOT a
      Sumerian original of which the Akkadian Anzu would be a
      translation," consistent with scope.md's hard contamination
      boundary on Sumerian-language compositions. The comparative
      framing of Sharur (more prominent in Lugal-e than in the
      Akkadian Anzu) is not noted by the writer; this is a
      missed comparative observation, not a contamination, but
      could be foregrounded for the influences-chapter
      hand-off. See Finding F-7 (LOW).
      Hurro-Hittite Illuyanka boundary properly observed (line
      245).
      No biblical/Hebrew, Ugaritic, or Aramaic contamination
      detected.
      Glossary compliance: the glossary-locked renderings are
      preserved throughout — Ningirsu (with subscript-i diacritic
      not used, but the glossary entry permits "Ningirsu" plain
      for the OB hero); Ninurta; Enlil; Anu; Adad; Šara (with š-
      háček); Sharur / Šaruru (with š-háček in parens); Ea (not
      Enki); Anzû (with â). The third SB refuser is missing from
      both the brief's entities_glossary (which names only Adad
      and Šara) and from the claims doc itself, where it is
      flagged generically as "a third candidate." This is the
      finding chain at F-2.
      Marker discipline:
      - 2 INFERENCE markers (lines 160 — Sharur older tradition;
        196 — fifty-names parallel to Enūma Eliš). Both
        properly framed with basis and risk. PASS for marker
        schema; the underlying claims are interpretive reads
        well-supported by Akkadian-internal comparanda.
      - 2 LACUNA markers (lines 53 — OB recension breaks; 55 — SB
        Tablet III damage at climax). Both correctly identify
        manuscript damage; PASS.
      - 2 RECONSTRUCTION markers (lines 57 — Foster's parallel
        reconstructions; 105 — OB combat-climax filled from SB).
        Both correctly name fill source and confidence; both are
        in-tradition Akkadian fills per scope.md (OB→SB cross-
        recension fill with dialect/period flagged). PASS for
        marker schema. The OB→SB cross-recension fill is the
        specific worry flagged by the writer in handoff; the
        scope.md reconstruction policy explicitly permits "a
        different Akkadian composition within the same dialect
        and period... or earlier or later Akkadian recensions of
        the same composition (e.g., OB Gilgameš filling a
        Standard Babylonian gap) — permitted when no better
        source exists; the period gap must be named." The OB
        Anzu→SB Anzu fill is the inverse (later filling earlier)
        but the scope.md language is symmetric on this point. The
        writer's marker correctly names the donor recension and
        the dialect/period gap. SUPPORTED.
      - 1 VARIANT marker (line 213) — documents the co-equal
        recensional structure; PASS for marker schema.
      - 5 COMPARATIVE-HOOK comments (lines 241–245) — all
        comparative-hook material is properly reserved for the
        influences chapter. Watkins 1995 named-but-flagged usage
        per (12) above; PASS.
      Silent bridges: None detected; every claim paragraph
      carries an EVIDENCE token line.
      Source IDs all resolve to sources.yaml: annus-2001,
      vogelzang-1988, foster-2005, dalley-2008, black-green-1992,
      bottero-2001, foster-2007, lambert-2013. Watkins 1995 and
      Hoffner 1998 (Illuyanka) are named-but-flagged in
      COMPARATIVE-HOOK comments only; acceptable per the skill.
    q5_same_model_as_writer: |
      Same model family (claude-opus-4-7[1m]) as the writer of
      the claims document, run in a fresh conversation per the
      skill's hard-rule allowance. I have no memory of producing
      the input — the fresh-context requirement is satisfied.
      The writer's flagged-for-scrutiny items resolve as follows:
      (a) **Third refusing candidate in the SB candidate-search**
          — UPHELD as a finding. The writer named only Adad
          (first) and Šara (next) and presented "a third
          candidate" generically without naming. The standard
          SB list is **Adad → Gerra/Gibil → Šara** (in that
          order). The writer is WRONG in TWO ways: Šara is the
          THIRD (not the second), and the second refuser
          (Gerra/Gibil) goes unnamed. The brief's
          entities_glossary itself names only Adad and Šara —
          this is a brief-derived gap that surfaces in the chapter
          as Finding F-2 (HIGH).
      (b) **Ningirsu→Ninurta substitution** — UPHELD with a twist.
          The OB→SB recensional substitution itself is firmly
          attested. The writer's framing that the two are "the
          same warrior-god under different local names" (lines
          67, 221) is a CONTESTED reading; Black & Green 1992
          (the writer's cited support) appears to treat the two
          as originally distinct deities. The "syncretism" /
          "local hypostasis" reading is closer to the actual
          Black & Green position. This is Finding F-5 (HIGH —
          evidence-misattribution).
      (c) **Watkins 1995 IE COMPARATIVE-HOOK without EVIDENCE
          token** — UPHELD as acceptable. The named-but-flagged
          pattern is per-skill permitted when no EVIDENCE token
          routes through the named scholar's work. No EVIDENCE
          token references watkins-1995 (only lambert-2013 is
          referenced for the fifty-names-Enūma-Eliš parallel).
          The writer's flag is appropriate; the practice is
          ACCEPTABLE. Captured as NOTE for inventory-audit. The
          recommendation is to consider adding Watkins 1995 to
          sources.yaml at the next inventory-audit round if the
          influences chapter will route an EVIDENCE token
          through it.
      (d) **OB Tablet III climax RECONSTRUCTION from SB recension
          across dialect/period gap** — UPHELD as compliant with
          scope.md. The reconstruction policy permits "earlier or
          later Akkadian recensions of the same composition" as
          fill source; the OB Anzu and SB Anzu are recensions of
          the same composition (one earlier, one later); the
          dialect/period gap is explicitly named in the marker.
          The marker is well-formed and the fill source is in-
          tradition. SUPPORTED.
      Beyond the writer's flagged items, this audit surfaced
      THREE additional HIGH findings the writer did not flag:
      - F-1 (HIGH): "SB recension is structured in two tablets"
        is FACTUALLY WRONG; the SB recension has THREE tablets
        per Annus 2001 SAACT 3. The writer's own EVIDENCE tokens
        cite "SB Tablet III" (lines 184–187, 191), which is
        internally inconsistent.
      - F-4 (HIGH): "Susa and Tell Asmar tablets" for the OB
        recension is FACTUALLY WRONG; both OB Anzu II and OB
        Anzu III are from Susa only (SEAL HUJI Sb 9470 and Sb
        14683). The Tell Asmar reference appears to be the
        writer's confusion with the Tell Asmar Hoard iconographic
        statue.
      - F-5 (HIGH): The "same warrior-god under different local
        names" framing is misattributed to Black & Green 1992,
        whose actual reading per Wikipedia s.v. Ningirsu treats
        the two as originally distinct cult-center deities.
      The combination of FIVE HIGH findings — three independent
      factual errors (F-1 SB tablet count; F-2 third refuser
      identity and order; F-4 OB manuscript provenance) and two
      evidence-misattribution / contested-framing issues (F-5
      Black & Green reading) — affecting the narrative spine of
      the chapter makes the verdict BLOCK rather than PASS-WITH-
      LIGHT-FIXES.

