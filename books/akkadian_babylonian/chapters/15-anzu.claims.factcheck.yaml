  honesty_self_check:
    q1_opened_or_skimmed: |
      I did NOT have direct access to the brief's locked principal
      anchors:
      - Annus 2001, *The Standard Babylonian Epic of Anzu*, SAACT 3
        (Helsinki, Neo-Assyrian Text Corpus Project): the
        Eisenbrauns/SAACT page was readable at the ToC level only;
        the ResearchGate full-PDF mirror returned HTTP 403. I could
        NOT directly read Annus's transliteration, translation, or
        commentary.
      - Vogelzang 1988, *Bin šar dadme: Edition and Analysis of the
        Akkadian Anzu Poem* (Groningen: Styx): no readable preview
        was retrievable in this audit. I could NOT directly read
        Vogelzang's edition.
      - Foster 2005, *Before the Muses*, pp. 555–578: CDL Press is
        paywalled; no readable preview of these pages was
        accessible. I could NOT directly read Foster's translations
        of the OB and SB recensions.
      - Dalley 2008, *Myths from Mesopotamia*, pp. 203–227: OUP
        World's Classics ToC-stub only; no readable preview of the
        Anzu chapter was accessible.
      I DID directly verify the following independent sources:
      (a) **Eisenbrauns ToC for Annus 2001 SAACT 3** (WebFetch on
          the Eisenbrauns book page). Confirmed verbatim: the
          Standard Babylonian Epic of Anzu comprises **three
          tablets** — "Tablet 1", "Tablet 2", "Tablet 3" — each
          with cuneiform text, transliteration, and score
          (synopsis of OB and SB versions). This DIRECTLY
          contradicts the writer's repeated claim that the SB
          recension is "structured in two tablets" (lines 29, 41,
          213, 215).
      (b) **Wikipedia s.v. Ningirsu** (WebFetch). Confirmed: "Black
          & Green (1992) are cited as interpreting Ningirsu and
          Ninurta as 'two gods from different cult centers in
          origin'" — i.e., Black & Green treat the two as
          originally distinct deities, NOT as "the same warrior-god
          under different local names" (writer's framing at lines
          67, 221, 241).
      (c) **Wikipedia s.v. Ninurta** (WebFetch). Confirmed: "Ninĝirsu
          was identified as a local hypostasis of Ninurta in a
          syncretism that is documented at the latest by the time
          of Gudea in the late third millennium BC. However,
          Assyriologists are divided on the question of whether
          they were originally two manifestations of the same god,
          or two separate deities." Confirmed also: "Ninĝirsu is
          substituted by Ninurta in the first millennium versions
          of the myths Lugale and the Epic of Anzu."
      (d) **gatewaystobabylon — Myth of Anzu** (WebFetch).
          Confirmed verbatim:
          - **Three tablets in SB** ("Tablet 1," "Tablet 2,"
            "Tablet 3").
          - **Order of refusing gods**: "Adad (canal-controller),
            Gerra, and Shara (Ishtar's son)" — i.e., the three
            refusers are **Adad → Gerra → Šara**, with **Gerra**
            (not unnamed) as the second refuser and **Šara** as
            the THIRD, not the second.
          - **Sharur** in SB Anzu: "Sharur does speak extensively
            as Ninurta's messenger." SUPPORTED for SB.
      (e) **Encyclopedia.com s.v. Ninurta** (WebFetch). Confirmed:
          - **Order of refusal**: "Adad sent first... unsuccessful";
            "Girru and Shara — chosen next with the same results";
            then Ninurta. Three refusers are **Adad, Girru/Gerra,
            Shara**, with Girru/Gerra second.
          - "Three tablets" referenced for the Anzu myth.
          - "Sharur": "When initial combat fails, Ninurta sends his
            powerful weapon Sharur to Ea to ask for help."
            SUPPORTED.
          - "Called Ningirsu in the earliest version" — supports
            the OB→SB renaming.
      (f) **altorientale-mythologie.blogspot.com — Anzu-Mythos**
          (WebFetch). Confirmed (Neo-Assyrian SB order): "Adad (the
          Canal Inspector, son of Anu) → Gibil (son of Annunitu) →
          Šara (son of Ištar)" — three named refusers, second
          identified as **Gibil/Gerra**, not unnamed.
      (g) **SEAL HUJI s.v. Anzu OB II** (WebFetch). Confirmed: the
          Anzu OB II manuscript is **Sb 9470**, provenance
          "**Susa** (mod. Shush)" — Louvre, Paris. **NOT** Tell
          Asmar.
      (h) **SEAL HUJI s.v. Anzu OB III** (WebFetch). Confirmed:
          Anzu OB III is **Sb 14683**, provenance "**Susa** (mod.
          Shush)" — Louvre, Paris. **NOT** Tell Asmar. Tablet has
          77 lines; conclusion damaged with extensive lacunae;
          killing-blow does NOT appear in preserved portion;
          Ningirsu confirmed as hero.
      (i) **handwiki.org s.v. Anzû** (WebFetch). Confirmed: "OB...
          found at Susa"; SB "Late Assyrian version from Nineveh."
          Tell Asmar is mentioned in the Anzu *iconographic*
          dossier (statue from the Tell Asmar Hoard with Anzu
          carved on a base) — NOT as a literary-tablet source for
          the epic itself.
      (j) **bildungblocks.com — Anzu** (WebFetch). Multiple
          Mesopotamian sites referenced for SB ("Assur, Nineveh,
          Sultantepe, and Tarbişu") and OB ("Susa"). Confirms the
          writer's SB witness list but contradicts the OB "Susa
          and Tell Asmar" claim.
      (k) **mythlok.com s.v. Sharur** (WebFetch). Sharur appears
          prominently in **Sumerian** *Lugal-e* and in the
          Akkadian Anzu epic; in Anzu, Sharur "is sent by Ninurta
          to Ea to ask for help during his battle with Anzu, and
          Sharur returns with Ea's advice." SUPPORTED for SB Anzu.
      (l) **Wikipedia s.v. How to Kill a Dragon (Watkins 1995)**
          (WebSearch + search-result extract). Confirmed: Watkins
          1995, *How to Kill a Dragon: Aspects of Indo-European
          Poetics* (Oxford University Press, 16 November 1995);
          reconstructs the Proto-Indo-European *HERO SLAY SERPENT*
          formula across Old/Middle Iranian, Greek epic, Celtic,
          Germanic, Armenian. The formula attribution to Watkins
          is correctly named in the COMPARATIVE-HOOK at line 244.
      Did NOT directly verify (taken on trust as genre-appropriate):
      - Black & Green 1992 specific entries (s.v. Ninurta, Ningirsu,
        Ea, Anzû, Tablet of Destinies) — taken on trust as standard
        handbook material; note that the writer's "same warrior-god"
        framing partially conflicts with Black & Green's own
        reading per Wikipedia s.v. Ningirsu (see Finding F-3).
      - Bottéro 2001 passim — taken on trust.
      - Foster 2007 pp. 35–39 — taken on trust.
      - Lambert 2013 on Enūma Eliš fifty-names structure — taken
        on trust as standard reference material.
    q2_triangulated_or_assumed: |
      Triangulated for:
      (1) **SB tablet count** — confirmed THREE tablets across
          Eisenbrauns Annus 2001 ToC, gatewaystobabylon,
          encyclopedia.com. The writer's repeated "two-tablet
          structure" (lines 29, 41, 213, 215) is INCORRECT. The
          writer's own EVIDENCE tokens cite "Annus 2001, SAACT 3,
          **SB Tablet III**" (lines 184–187, 191), which is
          internally inconsistent with the two-tablet claim. See
          Finding F-1 (HIGH).
      (2) **Order and identity of SB candidate-refusers** —
          confirmed **Adad → Gerra/Gibil/Girru → Šara** as the
          canonical three-refuser sequence across
          gatewaystobabylon, encyclopedia.com,
          altorientale-mythologie, and the writer's own brief
          (which names "Adad" and "Šara" but is silent on the
          second/third in the entities_glossary). The writer's
          presentation (line 119: Adad first; line 124: Šara
          "next"; line 129: "a third candidate"
          unnamed/structurally amplifying) is WRONG in TWO ways:
          (a) Šara is the **third** in the canonical sequence, not
          the second; (b) the second candidate is **Gerra/Gibil**,
          who is the unnamed god in the writer's presentation. The
          writer's brief is itself thin here (entities_glossary
          omits Gerra), so this is a brief-derived gap surfaced as
          a chapter-level finding. See Finding F-2 (HIGH).
      (3) **OB manuscript provenance** — confirmed via SEAL HUJI
          that BOTH OB Anzu II (Sb 9470) and OB Anzu III (Sb 14683)
          are from **Susa only**, not Susa AND Tell Asmar. The
          Tell Asmar reference appears to be the writer's
          confusion with the Tell Asmar Hoard *statue* (an
          iconographic artifact featuring an Anzu bird on a
          statue base — NOT a literary tablet of the epic). The
          writer's repeated claim "Susa and Tell Asmar tablets"
          (lines 29, 35, 53, 213) is INCORRECT. See Finding F-4
          (HIGH).
      (4) **Ningirsu↔Ninurta substitution and identity** —
          confirmed as a real OB→SB recensional substitution
          (Wikipedia s.v. Ningirsu, Ninurta; encyclopedia.com;
          mesopotamiangods.com; multiple sources). However, the
          writer's framing that the two are "the same warrior-god
          under different local names" (line 67, repeated line 221:
          "the two figures are the same warrior-god under
          different local names") is a CONTESTED reading.
          Wikipedia s.v. Ningirsu, citing Black & Green 1992
          directly, presents Black & Green as treating Ningirsu
          and Ninurta as "two gods from different cult centers in
          origin"; and Wikipedia s.v. Ninurta states
          "Assyriologists are divided on the question of whether
          they were originally two manifestations of the same god,
          or two separate deities." The writer's framing collapses
          this scholarly division into a single identification
          claim. Since the writer cites Black & Green 1992 s.v.
          Ningirsu, Ninurta as the support for this framing, and
          Black & Green's own reading appears to go the OTHER way,
          this is an EVIDENCE-misattribution issue. See Finding F-5
          (HIGH).
      (5) **OB Tablet III conclusion damaged at the climax** —
          confirmed via SEAL HUJI s.v. Anzu OB III: "killing blow
          does not appear in the preserved portions. The narrative
          breaks off during the battle sequence." The
          [RECONSTRUCTION:] marker at line 105 filling the OB
          combat-climax from SB recension is justified by the
          documented OB damage and is in-tradition per scope.md
          (cross-recensional Akkadian fill with dialect/period
          flagged). The [RECONSTRUCTION:] marker is well-formed.
          SUPPORTED.
      (6) **Sharur as sentient mace in SB Anzu** — confirmed via
          gatewaystobabylon, encyclopedia.com, mythlok.com,
          worldhistory.org/Ninurta. Sharur as Ninurta's
          messenger-to-Ea is firmly attested in the SB Anzu
          dossier. Note: Sharur is even more prominent in the
          **Sumerian** *Lugal-e*, where the mace's role is
          foregrounded; the writer's claim that the OB Anzu also
          attests Sharur "in fragmentary form" (line 148) is
          plausible but I could not independently verify the OB
          Sharur attestation outside the writer's own claim
          (Vogelzang 1988 not directly accessible). SUPPORTED for
          SB; PARTIALLY SUPPORTED for OB (taken on trust).
      (7) **Decree-reversal scene: arrow-to-reed-bed,
          bowstring-to-sheep, bow-to-tree, bronze-to-mountain** —
          consistent with secondary-source summaries of Anzu's
          weapon-dissolving counter-decree. Independent
          triangulation against gatewaystobabylon and
          encyclopedia.com supports the south-wind + pinion-
          plucking strategy and the killing-blow sequence.
          SUPPORTED for SB; the OB parallel is claimed by the
          writer as "partly damaged" (line 164) which is
          consistent with the SEAL HUJI assessment of OB III as
          fragmentary.
      (8) **South wind + pinion-plucking + killing-blow strategy
          from Ea** — confirmed across gatewaystobabylon,
          encyclopedia.com, secondary summaries. The strategy is
          firmly attested in the SB recension. SUPPORTED.
      (9) **Fifty-names hymn closing the SB Anzu** — PARTIALLY
          SUPPORTED. gatewaystobabylon attests "multiple divine
          names and epithets for Ninurta across various
          locations" but does not explicitly enumerate fifty.
          The parallel to Enūma Eliš fifty-names (Lambert 2013)
          is structurally well-supported in the secondary
          literature, and the writer's INFERENCE marker at line
          196 properly frames this as an interpretive reading
          with stated risk. The bare "fifty names" claim itself
          (lines 190, 215) needs hedging — the count "fifty" is
          a structural feature carried over from Enūma Eliš VI–
          VII and applied to Anzu by analogy; whether the SB
          Anzu's closing hymn formally enumerates fifty is not
          independently triangulated in this audit. See Finding
          F-6 (MEDIUM).
      (10) **Maternal commission by Bēlet-ilī/Mami** — confirmed
           via the SOAS / Slightly Alive translation extract for
           SB Tablet II (Belet-Ili instructing Ninurta to attack
           Anzu, opening the second tablet). SUPPORTED.
      (11) **Bath-theft motif** — confirmed via secondary
           summaries (gatewaystobabylon, encyclopedia.com,
           Wikipedia s.v. Anzû). Anzu seizes the Tablet of
           Destinies while Enlil bathes. SUPPORTED.
      (12) **Watkins 1995 named-but-flagged usage** — confirmed
           that the COMPARATIVE-HOOK at line 244 names Watkins
           and the Watkins formula but **no EVIDENCE token routes
           through watkins-1995** (only one token references
           lambert-2013, at line 231). The named-but-flagged
           pattern is per-skill ACCEPTABLE here: the IE typology
           claim is comparative-hook material reserved for the
           influences chapter, and the skill explicitly permits
           naming-but-flagging scholars whose work is not in
           sources.yaml so long as no EVIDENCE token loads
           through them. The writer flagged this concern in
           handoff; the verdict is UPHELD as acceptable. This is
           a NOTE for inventory-audit, not a finding. The
           Watkins-1995-as-future-source-addition recommendation
           is captured below.
      (13) **Foster 2005 / Dalley 2008 page ranges** — taken on
           trust at the page-range level. The overall pp.
           555–578 (Foster) and pp. 203–227 (Dalley) brackets are
           consistent with the brief. The per-paragraph
           allocation is plausible but not independently
           triangulated.
      (14) **Lambert 2013 on Enūma Eliš fifty-names structure**
           — taken on trust as standard reference material; the
           Tablet VI–VII fifty-names structure is well-attested
           in the Enūma Eliš secondary literature.
      Assumed and NOT independently triangulated:
      - Foster 2007 pp. 35–39 on the late-tradition Anzu and the
        royal-legitimation framing.
      - Bottéro 2001 on divine kingship and the Tablet of
        Destinies.
      - The specific OB Sharur attestation (only the writer's
        Vogelzang 1988 citation supports this; Vogelzang not
        directly accessible).
