# ── Findings (rated HIGH/MEDIUM/LOW) ───────────────────────────────────────

findings:
  - id: F-1
    claim_number: 2, 8, 9 (multi-paragraph; affects claims that describe SB recension structure)
    kind: FACTUAL-ERROR
    severity: HIGH
    claim: |
      "The Standard Babylonian recension survives on multiple 1st-
      millennium manuscripts from Nineveh (Aššurbanipal's library),
      Sultantepe, Tarbiṣu, and Aššur. The SB recension is structured
      in two tablets, more compact than the OB three-tablet form."
      (Lines 29, 41, 213, 215 — repeated across the document.)
    issue: |
      The Standard Babylonian Epic of Anzu in Annus 2001 SAACT 3 is
      structured in THREE tablets, not two. Eisenbrauns' Annus 2001
      ToC explicitly lists "Tablet 1," "Tablet 2," "Tablet 3." The
      writer's own EVIDENCE tokens at lines 184–187 and 191 cite
      "Annus 2001, SAACT 3, SB Tablet III" — internally
      contradicting the "two-tablet structure" claim elsewhere in
      the document. Independent triangulation against
      gatewaystobabylon, encyclopedia.com, and bildungblocks all
      confirm three tablets in SB.
    evidence: |
      Eisenbrauns ToC for Annus 2001 (WebFetch verbatim): "Tablet
      1," "Tablet 2," "Tablet 3."
      gatewaystobabylon (WebFetch verbatim): the SB text contains
      "three tablets ('Tablet 1,' 'Tablet 2,' 'Tablet 3'
      divisions)."
      encyclopedia.com (WebFetch verbatim): "Three tablets are
      referenced for the Anzu myth."
      Writer's own EVIDENCE tokens at lines 184, 186, 191: "SB
      Tablet III" — proves the writer knew of a third SB tablet
      but redacted it inconsistently elsewhere.
    recommended_fix: |
      Replace all instances of "structured in two tablets" or
      "two-tablet form" or "two-tablet structure" (SB context)
      with "structured in three tablets" or "three-tablet form."
      Specifically rewrite lines 29, 41, 213, and 215.
      Also rewrite line 29's "OB three-tablet form" / "more
      compact than the OB three-tablet form" — this comparison
      collapses if both OB and SB are three tablets. The OB
      structure should be retained as three tablets (per SEAL
      HUJI OB I, II, III) but the SB-vs-OB comparison should
      reframe in terms of LENGTH (SB longer; OB shorter), not
      tablet count. The brief's "OB Anzu (3 tablets, Ningirsu
      hero, ca. 1700 BCE) and SB Anzu (2 tablets, Ninurta hero,
      1st millennium)" framing — variants block, line 47 of brief
      — is the SOURCE of this error and should be corrected at
      the brief level before re-running chapter-claims.

  - id: F-2
    claim_number: 8 (claim block at lines 119–132 in claims doc — the SB candidate-search sequence)
    kind: FACTUAL-ERROR
    severity: HIGH
    claim: |
      "Adad — the storm-god, lord of thunder and the rains that
      bring or break the harvest — is approached first and declines
      the task..." (line 119). "Šara — a warrior-god of the
      pantheon — is approached next and likewise declines..."
      (line 124). "A third candidate is approached and likewise
      refuses..." (line 129).
    issue: |
      The canonical SB Anzu candidate-search sequence is **Adad →
      Gerra/Gibil → Šara** (in that order), NOT Adad → Šara →
      unnamed third. The writer has Šara as the SECOND refuser
      (it is the THIRD), and the writer leaves the SECOND refuser
      (Gerra/Gibil) entirely unnamed. This is a substantive
      narrative-order error and a missing entity-identification.
      The writer's brief itself omits Gerra from the
      entities_glossary (which names only Adad and Šara), so the
      gap originates upstream of the chapter-claims step; this
      finding is the chapter-level surface of a brief-derived
      omission.
    evidence: |
      gatewaystobabylon (WebFetch verbatim): "Adad (canal-
      controller), Gerra, and Shara (Ishtar's son). Each declines
      with similar reasoning about Anzu's inaccessibility and
      power."
      encyclopedia.com s.v. Ninurta (WebFetch verbatim): "Adad —
      sent first but his attempt is unsuccessful... Girru and
      Shara — chosen next with the same results."
      altorientale-mythologie (WebFetch summary of Neo-Assyrian
      SB sequence): "Adad (the Canal Inspector, son of Anu) →
      Gibil (son of Annunitu) → Šara (son of Ištar)."
    recommended_fix: |
      Rewrite lines 119–132 to follow the canonical sequence:
      "Adad — the storm-god — is approached first and declines
      the task" (KEEP). Insert a new claim paragraph naming
      "Gerra (also spelled Girra or Gibil) — the fire-god — is
      approached next and likewise declines, citing the same
      impossibility." Then Šara as the THIRD: "Šara — a warrior-
      god of the pantheon, son of Ištar — is approached third and
      likewise declines."
      Also update the brief's entities_glossary (briefs/15-
      anzu.yaml) to include "Gerra (Girra, Gibil)" as a deity
      among the candidate-heroes. This is an upstream-brief fix
      that surfaces here as a chapter-claims finding.

  - id: F-3
    claim_number: 7, 16 (claims at lines 95, 100 — OB recension narrative; line 213 — VARIANT block; line 235 — geographic spread)
    kind: FACTUAL-ERROR
    severity: HIGH
    claim: |
      "The Old Babylonian recension survives on Susa and Tell
      Asmar tablets, dated to roughly 1700 BCE." (Lines 35, 53,
      213, 215, 235.)
    issue: |
      The OB Anzu recension's literary tablets are from Susa only
      (Sb 9470 = OB Anzu II; Sb 14683 = OB Anzu III, both in the
      Louvre per SEAL HUJI). There is no Tell Asmar tablet
      attesting the OB Anzu epic. The Tell Asmar reference is
      most likely a confusion with the Tell Asmar Hoard *statue*
      (early-dynastic eye-statue from Eshnunna featuring an Anzu
      bird carved on a statue base — an iconographic artifact,
      not a literary tablet of the epic). Independent
      triangulation against multiple sources (handwiki,
      bildungblocks, Wikipedia s.v. Anzû, SEAL HUJI Anzu OB II
      and OB III) all give Susa as the sole OB literary
      provenance.
    evidence: |
      SEAL HUJI s.v. Anzu OB II (WebFetch verbatim): Sb 9470,
      "Provenance: Susa (mod. Shush)." NOT Tell Asmar.
      SEAL HUJI s.v. Anzu OB III (WebFetch verbatim): Sb 14683,
      "Provenance: Susa (mod. Shush)." NOT Tell Asmar.
      handwiki s.v. Anzû (WebFetch verbatim): "OB... found at
      Susa." (No mention of Tell Asmar as a literary source.)
      bildungblocks (WebSearch result): "copies of the epic were
      found at many Mesopotamian sites (Assur, Nineveh,
      Sultantepe, and Tarbişu; the Old Babylonian version was
      found in Susa)." (Tell Asmar is absent.)
      Wikipedia s.v. Anzû (WebFetch): "A statue found in the Tell
      Asmar Hoard depicts a human figure with large eyes, with an
      Anzu bird carved on the base." (Tell Asmar = iconographic
      artifact, not literary tablet.)
    recommended_fix: |
      Remove all references to "Tell Asmar tablets" for the OB
      Anzu recension. Replace "Susa and Tell Asmar tablets" with
      "Susa manuscripts (Sb 9470 = OB Anzu II; Sb 14683 = OB Anzu
      III, both Louvre)" at lines 29, 35, 213, and 235. Update the
      brief at briefs/15-anzu.yaml accordingly. The Tell Asmar
      Hoard iconographic Anzu may be mentioned separately in the
      iconography paragraph at line 206 (Black & Green s.v. Anzû)
      as an Early Dynastic iconographic precursor of the storm-
      bird, not as a literary witness.

  - id: F-4
    claim_number: 9, 10 (claims at lines 67 — co-equal note paragraph; 221 — Variants block)
    kind: EVIDENCE-MISATTRIBUTION
    severity: HIGH
    claim: |
      "The OB→SB recensional substitution of the hero — Ningirsu
      → Ninurta — corresponds to a wider theological consolidation
      within the Akkadian tradition... the warrior-son of Enlil...
      was increasingly identified under the single name Ninurta
      in the 1st-millennium tradition. The two figures are the
      same warrior-god under different local names." (Lines 67,
      221.)
    issue: |
      The writer's framing of Ningirsu and Ninurta as "the same
      warrior-god under different local names" is a CONTESTED
      reading. The writer cites Black & Green 1992 s.v. Ninurta,
      Ningirsu as the support — but Black & Green 1992 (per the
      Wikipedia s.v. Ningirsu citation) actually treat the two as
      "two gods from different cult centers in origin." The
      scholarly consensus (per Wikipedia s.v. Ninurta) is that
      "Ninĝirsu was identified as a local hypostasis of Ninurta
      in a syncretism that is documented at the latest by the
      time of Gudea... However, Assyriologists are divided on
      the question of whether they were originally two
      manifestations of the same god, or two separate deities."
      The "same warrior-god" claim is too strong; the supported
      claim is "Ningirsu was identified with Ninurta in a
      syncretism by the time of Gudea, though the underlying
      identity question remains contested."
    evidence: |
      Wikipedia s.v. Ningirsu (WebFetch verbatim): "Black & Green
      (1992) are cited as interpreting Ningirsu and Ninurta as
      'two gods from different cult centers in origin,'
      supporting the theory that they were originally distinct
      deities rather than different names for the same god."
      Wikipedia s.v. Ninurta (WebFetch verbatim): "Ninĝirsu was
      identified as a local hypostasis of Ninurta in a
      syncretism that is documented at the latest by the time of
      Gudea in the late third millennium BC. However,
      Assyriologists are divided on the question of whether they
      were originally two manifestations of the same god, or two
      separate deities."
    recommended_fix: |
      Rewrite the framing at lines 67 and 221 to reflect the
      scholarly division. Replace "The two figures are the same
      warrior-god under different local names; the SB recension's
      substitution reflects the cosmopolitan re-identification of
      the war-god under the Nippur-centred name" with: "Ningirsu
      was identified with Ninurta in a documented syncretism by
      the time of Gudea (late third millennium); whether the two
      were originally manifestations of a single warrior-god or
      two distinct cult-center deities subsequently merged is a
      question on which Assyriologists remain divided (Black &
      Green 1992 lean toward two-deities-in-origin; other
      scholars read them as a single warrior-figure under local
      names). The SB recension's substitution of Ninurta for
      Ningirsu reflects the 1st-millennium cosmopolitan
      consolidation of the warrior-god identity under the
      Nippur-centred name, regardless of how the underlying
      identity question is resolved."

  - id: F-5
    claim_number: 19 (claim at lines 190, 215 — SB closing fifty-names hymn)
    kind: HEDGING-NEEDED / PARTIALLY-SUPPORTED
    severity: MEDIUM
    claim: |
      "The SB recension's closing celebration is structured as a
      hymn of praise to Ninurta, enumerating his fifty names — a
      structural feature that parallels the fifty-names finale of
      *Enūma Eliš* (Tablet VI–VII)." (Lines 190, 215.)
    issue: |
      The "fifty-names" structural parallel to Enūma Eliš VI–VII
      is plausible and well-supported in the secondary literature
      as a STRUCTURAL feature (extended hymnic litany at the close
      of an Akkadian combat-myth). However, the specific count
      "fifty" for the Ninurta names in SB Anzu Tablet III is not
      independently triangulated in this audit. Gatewaystobabylon
      attests "multiple divine names and epithets for Ninurta
      across various locations ('Ningirsu,' 'Pabilsag,'
      'Shushinak,' 'Lugalbanda,' etc.), though the exact count
      isn't specified as 'fifty.'" The INFERENCE marker at line
      196 properly frames the parallel as the writer's
      interpretive reading with stated risk; the bare claim at
      line 190 needs hedging.
    evidence: |
      gatewaystobabylon (WebFetch verbatim): "The text does
      conclude with multiple divine names and epithets for
      Ninurta across various locations ('Ningirsu,' 'Pabilsag,'
      'Shushinak,' 'Lugalbanda,' etc.), though the exact count
      isn't specified as 'fifty.'"
      Eisenbrauns ToC for Annus 2001: confirms a third tablet but
      does not enumerate the names; direct Annus 2001 text not
      accessible.
    recommended_fix: |
      Hedge lines 190 and 215 by replacing "enumerating his fifty
      names" with "enumerating a hymnic litany of his names and
      epithets across the southern Mesopotamian sanctuaries — a
      structural feature paralleled by the fifty-names finale of
      Enūma Eliš (Tablet VI–VII), though whether the SB Anzu
      closing hymn formally enumerates exactly fifty names is
      not securely established in the surviving text." Retain the
      INFERENCE marker at line 196 as the locus of the
      interpretive parallel.

  - id: F-6
    claim_number: 11 (claim at line 148 — Sharur in OB Anzu attestation)
    kind: PARTIAL-SUPPORT / COMPARATIVE-FRAMING
    severity: LOW
    claim: |
      "A distinctive feature of the SB recension — and, in
      fragmentary form, the OB recension — is Sharur (*Šaruru*),
      the sentient war-mace of the warrior-hero." (Line 148.)
    issue: |
      Sharur in SB Anzu is firmly attested. The OB Anzu attestation
      "in fragmentary form" is taken on trust pending direct
      Vogelzang 1988 access. Independent verification was not
      possible in this audit. More substantively, Sharur is even
      more prominent in the **Sumerian** *Lugal-e* (per mythlok
      and worldhistory.org/Ninurta), where the mace's role is
      foregrounded; this comparative observation is missed in the
      claims doc and could be foregrounded for the influences-
      chapter hand-off.
    evidence: |
      mythlok.com s.v. Sharur (WebFetch verbatim): "In
      mythological narratives, particularly the epic *Lugal-e*,
      Sharur is depicted as essential to Ninurta's victories over
      demons and monstrous foes."
      worldhistory.org/Ninurta: "In the poem Lugale (also known
      as The Exploits of Ninurta), Ninurta's mace, Sharur,
      encourages him to go battle the demon..."
    recommended_fix: |
      The SB Sharur attestation is fine. For the OB Sharur claim,
      consider hedging line 148: "A distinctive feature of the
      SB recension — and, fragmentarily attested in the OB
      recension per Vogelzang 1988 — is Sharur." The Lugal-e
      comparative parallel (where Sharur is more prominent than
      in the Akkadian Anzu) could be added to the COMPARATIVE-
      HOOK at line 243; this is a polishing item, not a blocker.

