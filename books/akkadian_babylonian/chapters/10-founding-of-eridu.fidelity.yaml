  claim_mapping:
    - claim_number: 1
      claim_text: "Source overview: The Founding of Eridu is a short bilingual Sumerian-Akkadian incantation prologue narrating Marduk's creation of primordial cities, rivers, and humankind. Single manuscript BM 93014 (British Museum). King 1901 cuneiform edition (CT XIII) / King 1902 Seven Tablets of Creation II (translation, transliteration, commentary). Lambert 2013 pp. 366-375 standard edition."
      claims_line: 41
      narrative_line: 4
      status: MAPPED
      note: "Reframed in draft as an opening 'establishing shot' sentence that incorporates the manuscript-identifier framing AND the seven-step narrative shape (cosmos empty → cities → waters dammed → rivers → humankind) as a compressed forecast. The opening footnote is byte-identical to the claims-doc footnote, including the round-1 LOW-finding F-1 King 1901 / 1902 publication-history wording."
    - claim_number: 2
      claim_text: "Multiple alternative editorial titles: Lambert 2013 'The Founding of Eridu'; King 1902 'The Bilingual Creation of the World by Marduk' / 'The Bilingual Version of the Creation Legend'; Foster 2005 'Marduk, Creator of the World' (in 'Myths of Origins' sub-section)."
      claims_line: 44
      narrative_line: 7
      status: MAPPED
      note: "Verbatim apart from one prose connective: claims 'used \"The Bilingual Creation...\" or \"The Bilingual Version...\"' → draft 'used *The Bilingual Creation...* or *The Bilingual Version...*' (italic markup vs. quotes). Foster 2005 p. 487 'Marduk, Creator of the World' / 'Myths of Origins' attribution preserved verbatim."
    - claim_number: 3
      claim_text: "Standard modern critical edition is Lambert 2013, pp. 366-375. Foster 2005 p. 487 supplies accessible English translation. Dalley 2008 does not contain this composition."
      claims_line: 48
      narrative_line: 11
      status: MAPPED
      note: "Draft drops 'under the editorial title \"Marduk, Creator of the World\"' qualifier (already stated in the immediately preceding paragraph at draft line 7); minor de-duplication, no factual loss."
    - claim_number: 4
      claim_text: "BM 93014 is bilingual (parallel Sumerian and Akkadian columns); approximately 40 lines preserved in complete or nearly-complete form, remainder fragmentary; bilingual parallelism (each column glossing the other) is principal internal-reconstruction mechanism."
      claims_line: 53
      narrative_line: 16
      status: MAPPED
      note: "Draft 'The single manuscript is bilingual' (vs. claims 'The single manuscript, BM 93014, is bilingual'); BM 93014 identifier omitted only because it has just been named in the LACUNA marker that follows immediately at draft line 20 and in the opening overview at line 4. No factual loss."
    - claim_number: 5
      claim_text: "Setting: composition is the cosmogonic prologue of a longer ritual incantation; cosmogony establishes Marduk's authority; incantation invokes that authority; recited in E-Zida temple — probably Nabu's temple at Borsippa, principal cult-centre of Marduk's son."
      claims_line: 63
      narrative_line: 26
      status: MAPPED
      note: "Verbatim apart from one prose connective: claims 'the incantation that follows on the same tablet invokes that authority for ritual purposes' → draft 'the incantation that follows on the same tablet then invokes that authority for ritual purposes' ('then' connective added). The text-itself-indicates wording is preserved exactly."
    - claim_number: 6
      claim_text: "Dating: Neo-/Late-Babylonian (sixth century BCE) in surviving manuscript form; underlying composition probably earlier (Kassite or post-Kassite) based on theological content (Marduk supreme creator + bilingual-tradition framework rather than Standard Babylonian epic register) and ritual context (temple-incantation use)."
      claims_line: 67
      narrative_line: 30
      status: MAPPED
    - claim_number: 7
      claim_text: "Bilingual format characteristic of late-Babylonian temple-scholarly compositions; Sumerian by then learned/liturgical not vernacular; per scope.md, Sumerian column in scope only insofar as integral to Akkadian literary product."
      claims_line: 71
      narrative_line: 34
      status: MAPPED
      note: "Draft drops the parenthetical '— parallel Sumerian and Akkadian columns —' (already stated at draft line 16); minor de-duplication. The scope.md Sumerian-column-in-scope framing is preserved verbatim."
    - claim_number: 8
      claim_text: "Negative-cosmogonic opening: 'the holy house, the house of the gods in the holy place had not yet been made'; not a positive-action opening (cf. *Enūma Eliš*'s *enūma eliš lā nabû šamāmū* — 'When on high the heavens had not yet been named'); negative inventory of what does not yet exist; no temple, no city, no land has yet come into being."
      claims_line: 77
      narrative_line: 40
      status: MAPPED
      note: "Verbatim quote ('the holy house, the house of the gods in the holy place had not yet been made') preserved byte-identical. *enūma eliš lā nabû šamāmū* counter-example with translation preserved verbatim. Only change: 'cf.' → 'compare' (semantic equivalence, no factual change). Section heading drops the inner quotes around the verbatim phrase."
    - claim_number: 9
      claim_text: "Marduk founds Eridu first: established in the Apsû (freshwater cosmic abyss beneath the earth); temple built; Eridu the cosmologically first city in Mesopotamian theological geography; traditional cult-centre of Ea (Enki)."
      claims_line: 86
      narrative_line: 49
      status: MAPPED
      note: "Verbatim apart from one prose connective: claims 'Eridu is the cosmologically first city... the traditional cult-centre of Ea (Enki)' → draft 'Eridu is the cosmologically first city... and the traditional cult-centre of Ea (Enki)' ('and' added). No factual change."
    - claim_number: 10
      claim_text: "After Eridu, Marduk founds additional primordial cities: Babylon (Esagil), Nippur (E-kur), Erech / Sumerian Uruk (E-Aena); cities and temples are cosmic structures created with the world, not historical foundations."
      claims_line: 96
      narrative_line: 59
      status: MAPPED
      note: "Draft uses em-dashes around 'Sumerian Uruk' apposition: 'Erech — Sumerian Uruk — with its temple E-Aena' (claims uses parentheses: 'Erech (Sumerian Uruk; with its temple E-Aena)'). Minor punctuation reformatting; identical content."
    - claim_number: 11
      claim_text: "Geographic scope: southern Mesopotamian alluvium (Eridu, Uruk, Nippur, Babylon); northern Akkadian/Assyrian cities (Aššur, Nineveh, Kalḫu) absent from cosmogonic founding-list; worldview Babylon-centred but takes in canonical southern-Mesopotamian cities as primordial-cosmos cohort."
      claims_line: 101
      narrative_line: 64
      status: MAPPED
    - claim_number: 12
      claim_text: "Marduk dams cosmic waters; creates the two great rivers — Idiglat (Tigris), Purattu (Euphrates) — by name-giving; cosmogonic naming = cosmogonic establishment."
      claims_line: 107
      narrative_line: 70
      status: MAPPED
    - claim_number: 13
      claim_text: "Cosmogonic act of naming parallels Enūma Eliš Tablet VII fifty-names sequence; divine speech (pronouncing a name) as cosmogonic mechanism in both compositions."
      claims_line: 112
      narrative_line: 75
      status: MAPPED
    - claim_number: 14
      claim_text: "Anthropogony: Marduk + Aruru jointly create 'the seed of mankind' (Aruru as mother-goddess co-creator, Marduk as cosmogonic-supreme co-creator); stated motive: to 'settle the gods in the dwelling of (their) heart's delight' — humans created so that gods may dwell in cult-cities and receive offerings without having to perform agricultural labour themselves."
      claims_line: 119
      narrative_line: 82
      status: MAPPED
      note: "Both verbatim quotes ('the seed of mankind'; 'settle the gods in the dwelling of (their) heart's delight') preserved byte-identical. Only change: claims 'i.e., humans are created' → draft 'that is, humans are created' (semantic equivalence, no factual change)."

