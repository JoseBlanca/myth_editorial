marker_audit:
  evidence_markers_count: 47
  comparative_hook_markers_count: 19
  inference_markers_count: 3
  lacuna_markers_count: 1
  reconstruction_markers: 0
  variant_markers: 0
  speculation_markers: 0
  appropriation_flag_markers: 0
  marker_placement_check:
    method: "grep -nE '\\S.*//(EVIDENCE|COMPARATIVE-HOOK)' chapters/00-introduction.adoc"
    output: "(empty — clean)"
    verdict: "All EVIDENCE and COMPARATIVE-HOOK markers start at column 0 on their own line; none are appended after paragraph text."
  inference_marker_audits:
    - location: line 87
      content: "[INFERENCE: The date of composition is bracketed by the events the poem alludes to (the Sutian incursions and Babylon's eighth-century travails) and by the colophon's own claim of a single named author; together they argue strongly for late-eighth-century composition, though Cagni notes that some scholars push it as late as the seventh century.]"
      verdict: "Genuinely inferential (the date is debated). See F-5: should also acknowledge the ninth-century alternative."
    - location: line 145
      content: "[INFERENCE: The acrostic is one of the earliest sustained alphabetic acrostics in any literary tradition, and Saggil-kīnam-ubbib's specific identification of himself as an incantation-priest situates the *Theodicy* squarely within the professional scribal apparatus rather than in any popular or folk register.]"
      verdict: "Genuinely inferential — both clauses are interpretive readings, not directly attested."
    - location: line 222
      content: "[INFERENCE: The convergence of these three contact streams... is the deepest reason this book treats the Akkadian-Babylonian-Assyrian tradition as a single corpus. ...]"
      verdict: "Genuinely interpretive; appropriately marked."
  lacuna_marker_audits:
    - location: line 102
      content: "[LACUNA: The endings of all three recensions are damaged; whether Etana succeeded in obtaining the plant of birth, and whether the entire ascent was a dream or a literal journey, cannot be determined from the surviving manuscripts.]"
      verdict: "Confirmed: external sources confirm all three Etana recensions have damaged endings. Marker is correct."

glossary_audit:
  never_use_substring_scan:
    method: "Grepped the chapter for each glossary entry's never_use forms (Inanna, Enki, An, Nanna, Nanna-Suen, Utu, Iškur, Damgalnuna, abzu, Anzud, Huwawa, Dumuzid, Bilgames, Unug, Tammuz, Ningirsu, Ellil, Irra, Ashur, Utnapishtim, Atrahasis, Gilgamesh, Ishtar, Ereshkigal, Shamash). Most matches were false positives — substring matches inside Anu / Enkidu / Anzu / Anatolia / Tukulti-Ninurta / E-abzu (allowed temple name) / and inside the Sumerian-tradition title 'Inanna's Descent' (which the glossary forbids as a deity-name but does not forbid as a composition title)."
    real_violations:
      - term: "Bilgames"
        location: "line 98 (COMPARATIVE-HOOK marker)"
        usage: "'the Sumerian Bilgames poems'"
        analysis: "Used as a Sumerian-tradition title for the five Sumerian poems. Glossary's never_use does not carve out a title-citation exception; see F-8."
      - term: "Ningirsu"
        location: "line 80 (Anzû paragraph)"
        usage: "'in the Old Babylonian *Anzû*, the slayer is Ningirsu, the warrior-god of Lagaš'"
        analysis: "Used to name the OB-recension hero, exactly the use-case the glossary anticipates — but the glossary restricts this use to 'chapter 15 only', and the introduction is chapter 0. See F-2."
    non_violations:
      - term: "Inanna"
        usage: "Appears only in Sumerian-tradition contexts: the title 'Inanna's Descent' and the phrase 'the *me* of Inanna'. The glossary's never_use is for the Akkadian-deity name; the Sumerian-title use is implicitly permitted by the same logic that permits Foster/Dalley to cite 'Inanna's Descent' as a Sumerian title."
      - term: "Ishtar"
        usage: "Appears only in the title 'The Descent of Ishtar' (the universally-cited English title). The glossary lists 'Ishtar' as anglicized but only forbids 'Inanna' for the deity-name; 'The Descent of Ishtar' is the standard scholarly title and not a never_use violation."
      - term: "abzu"
        usage: "Appears only in the temple name 'E-abzu' (Eridu's temple). 'E-abzu' is a proper noun for Ea's temple complex, not the Sumerian deity-form 'Abzu'."

  rendering_check:
    Ištar: "✓ uses š throughout"
    Ereškigal: "✓ uses š throughout (also: 'Ereshkigal' DOES NOT appear)"
    Šamaš: "✓ N/A — Šamaš does not appear in the introduction"
    Sîn: "✓ uses circumflex throughout (Narām-Sîn, Sîn-lēqi-unninni)"
    Anzû: "✓ uses circumflex throughout"
    Atra-ḫasīs: "✓ uses ḫ and macron throughout (no occurrence of 'Atrahasis')"
    Uta-napišti: "✓ uses š (no 'Utnapishtim')"
    Ḫumbaba: "✓ uses ḫ throughout"
    Aššur: "✓ uses š throughout (no 'Ashur' or 'Assur')"

