findings:
  - finding_id: F-1
    claim_number: 19
    kind: INTERNAL-VARIANCE
    severity: LOW
    claim: "The SB Gilgameš is a 7th-century scribe's copy of an 11th-century compilation by a scholar named Sîn-lēqi-unninni."
    issue: "Sîn-lēqi-unninni is conventionally placed 1300-1000 BCE, with most scholars settling on the 13th-12th centuries BCE (Middle Babylonian, late Kassite). The chapter's '11th-century compilation' takes the very latest end of the bracket and presents it as fact. Wikipedia and Grokipedia both place him 'between 1300 BC and 1000 BC' but most popular and scholarly summaries lean to 12th-13th century. The 11th-century placement is unusual."
    evidence: "Wikipedia (Sîn-lēqi-unninni): 'Sîn-lēqi-unninni was a mašmaššu (a type of priest) who lived in Mesopotamia, probably in the period between 1300 BC and 1000 BC.' Archaeo-Histories on X: 'Some time in 12th Century BC, Sin-leqi-unninni, a Babylonian scholar...' The chapter's later reference (line 95) calls him 'a Middle Babylonian scholar of the late second millennium BCE' — that phrasing is broader and uncontroversial; the '11th-century' specific date in line 15 is the issue."
    recommended_fix: "Replace '11th-century compilation' with '12th- or 11th-century compilation' or 'late-second-millennium compilation' to match the broader, less contested bracket."

  - finding_id: F-2
    claim_number: 79
    kind: GLOSSARY-VIOLATION
    severity: LOW
    claim: "In the OB Anzû the slayer is Ningirsu, warrior-god of Lagaš; in the SB recension the slayer is Ninurta. (Use of 'Ningirsu' in chapter 0.)"
    issue: "The glossary's Ninurta entry locks the OB-recension variant Ningirsu to 'chapter 15 only, where the recensional difference is the central interpretive issue.' The introduction is chapter 0, not chapter 15. The chapter's use of Ningirsu is in service of explaining the recensional difference (which is exactly the carve-out the glossary anticipates), but the glossary's chapter-15-only restriction is literal."
    evidence: "glossary.yaml under 'native: Ninurta', rationale: '*Ningirsu* is locked as the OB-recension variant in chapter 15 only, where the recensional difference is the central interpretive issue.'"
    recommended_fix: "Either (a) accept the use here, on the grounds that the glossary's intent is to keep Ningirsu out of generic prose and the intro's mention is a recension-difference flag identical in function to the chapter-15 use, OR (b) revise to 'in the OB Anzû the slayer is the OB-recension warrior-god (Ningirsu in his Lagaš name); in the SB recension, Ninurta...' which more transparently signals the recension-name carve-out. Or, simplest, relax the glossary entry's restriction to 'chapters 0 and 15'."

  - finding_id: F-3
    claim_number: 138
    kind: CITATION-WRONG
    severity: MEDIUM
    claim: "The Poor Man of Nippur is preserved on STT 38, 'with two minor witnesses STT 39 and STT 116.'"
    issue: "STT 39 and STT 116 are not two distinct witnesses. They are joined fragments of a single tablet, conventionally cited as STT 39+116. The chapter implies two separate manuscripts where there is one."
    evidence: "Wikipedia (Poor Man of Nippur): 'STT 39 + 116 are also in Neo-Assyrian script and were excavated in Sultantepe.' Cambridge IRAQ article (Gurney): 'STT 39 + 116' is a join, not two witnesses. Standard cuneiformist citation convention is the '+' between numbers indicating physical join."
    recommended_fix: "Revise to '...with the joined fragment STT 39+116' or 'with one further joined witness, STT 39+116'."

  - finding_id: F-4
    claim_number: 132
    kind: UNVERIFIED
    severity: LOW
    claim: "The Series of the Fox preserves about 200 lines across multiple tablets."
    issue: "I could not verify the specific 'about 200 lines' figure on a brief web pass. Kienast 2003 (Iškar šēlebi) is the modern critical edition, and Lambert 1960 (BWL 186-209) is the earlier treatment; both are likely in the chapter author's hands, and the 200-line ballpark is plausible. But the specific number is not directly verifiable from open sources, and the *iškaru* is reported in some summaries as 'a substantial composition' without a specific line count."
    evidence: "Search for line count of iškar šēlebi returned no specific number. Lambert 1960 occupies pp. 186-209 (which is too short for 200 lines if half is critical apparatus). Kienast 2003 runs to about 260 pages but that includes commentary."
    recommended_fix: "Either confirm the 200-line figure from Kienast 2003 (the locked source) and add a footnote anchor, or soften to 'preserves a substantial composition across multiple tablets'."

  - finding_id: F-5
    claim_number: 86
    kind: INTERNAL-VARIANCE
    severity: LOW
    claim: "The Erra and Išum poem was composed in the eighth century BCE."
    issue: "Scholarly opinion brackets Erra anywhere from the ninth to the seventh century BCE. The chapter's INFERENCE on line 87 reads the date as 'late-eighth-century, though Cagni notes that some scholars push it as late as the seventh century' — but does not flag the ninth-century alternative, which is also in the literature (Foster, Cagni, George 2015 view variations exist). The body text on line 85 simply asserts 'the eighth century BCE' as fact."
    evidence: "Researchgate (George 2015): scholars place the date 'between the ninth and seventh centuries BCE' or 'between 100 and 400 years older than that [seventh century]'."
    recommended_fix: "Either expand the INFERENCE marker to acknowledge the ninth-century alternative in addition to the seventh-century one, or soften the body text from 'composed in the eighth century BCE' to 'composed in the late ninth or eighth century BCE'."

  - finding_id: F-6
    claim_number: 67
    kind: CITATION-WRONG
    severity: LOW
    claim: "The Worm and the Toothache is preserved on a single tablet from Aššurbanipal's library, CT 17, 50."
    issue: "The conventional reference is 'CT 17 50' (CT volume 17, plate 50), not 'CT 17, 50'. Both forms are in circulation, but the comma-separated form is unusual; the tablet identifier is a publication line in the British Museum's Cuneiform Texts series, where '50' is the plate number not a sub-tablet. The scope.md's I.2 section refers to it as 'CT 17 50' (no comma). This is a typographical/stylistic inconsistency, not a substantive error."
    evidence: "scope.md line 54: 'The Worm and the Toothache (CT 17 50, the etiology of caries...)' — no comma. Cairn.info article: 'A handcopy of this text was published in CT 17 50.' The chapter is the only place using the comma."
    recommended_fix: "Change 'CT 17, 50' to 'CT 17 50' to match scope.md and standard CT-citation usage."

  - finding_id: F-7
    claim_number: 121
    kind: INTERNAL-VARIANCE
    severity: LOW
    claim: "The Theodicy acrostic reads 'I, Saggil-kīnam-ubbib, the incantation-priest, am a worshipper of god and king.'"
    issue: "Lambert 1960 (which the chapter implicitly attributes via its Oshima-supersedes-Lambert framing) reads the closing word as 'adorant' (paladu = pious worshipper). Foster 2005 has 'a worshipper'. The chapter's wording matches Foster, not Lambert. Both are within the standard rendering and the variant is purely lexical (adorant vs. worshipper). However, the chapter does not cite Foster for the acrostic; the footnote (Oshima 2014, pp. 201-380) is the locked source. Oshima's exact rendering should be checked against the chapter's wording."
    evidence: "Wikipedia (Babylonian Theodicy): 'The acrostic of the poem reads: I, Saggil-kīnam-ubbib, the incantation priest, am adorant of the god and king.'"
    recommended_fix: "Either confirm that Oshima 2014 reads 'worshipper' (matches the chapter), or add a footnote noting that the wording follows Foster 2005 (or whichever scholarly translation is in use)."

  - finding_id: F-8
    claim_number: "n/a"
    kind: GLOSSARY-VIOLATION
    severity: LOW
    claim: "Use of 'Bilgames' in the line-98 COMPARATIVE-HOOK ('the Sumerian Bilgames poems')."
    issue: "The glossary's Gilgameš entry has 'never_use: [Bilgames]'. The chapter uses 'Bilgames' in the COMPARATIVE-HOOK marker on line 98 to name the Sumerian compositions ('the Sumerian Bilgames poems'). This is exactly the situation the glossary's never_use rule addresses — but the rule has no carve-out for citing Sumerian-tradition titles, and the writer applied the same pragmatic logic that would be used for 'Inanna's Descent' (which is cited freely as a Sumerian-tradition title). I recommend treating this as glossary-discipline LOW: the chapter's intention (citing the Sumerian title) is correct, but the literal never_use rule is violated."
    evidence: "Line 98: '// COMPARATIVE-HOOK: the Sumerian Bilgames poems (ETCSL 1.8.1.x) as comparative substrate;'"
    recommended_fix: "Either (a) update glossary.yaml to permit 'Bilgames' inside flagged-comparative contexts (parallel to the implicit permission for 'Inanna' in *Inanna's Descent*, which is similarly never_use'd but appears in 4 places in the chapter as a Sumerian-tradition title), or (b) replace 'the Sumerian Bilgames poems' with 'the Sumerian Gilgameš poems' (the standard ETCSL/Black-2004 hybrid usage). Option (a) is cleaner because it acknowledges the consistent pattern that glossary never_use applies to deity-or-hero references in the body but not to Sumerian-tradition composition titles."

  - finding_id: F-9
    claim_number: 14
    kind: UNVERIFIED
    severity: LOW
    claim: "An Old Babylonian Sargon legend, the King of Battle, was preserved in an Egyptian royal archive at Amarna."
    issue: "The chapter calls the King of Battle 'Old Babylonian' (line 10) but its earliest manuscripts (per Wikipedia) are: 'two from Amarna in Egypt, six fragments of one from the Hittite capital Ḫattuša from the middle Babylonian period and one each from Aššur and Nineveh.' The Amarna copy is itself MB (mid-14th century BCE), and the composition is thought to have been committed to writing 'during the first half of the second millennium' — i.e., OB or earlier MB. Calling the legend 'Old Babylonian' in the body is defensible (the OB framework is the consensus) but the manuscript witnesses are MB and later, none OB. A reader would likely interpret 'Old Babylonian Sargon legend' as referring to the manuscript date; clarify."
    evidence: "Wikipedia (King of Battle): 'extant in five manuscripts: two from Amarna in Egypt, six fragments of one from the Hittite capital Ḫattuša from the middle Babylonian period and one each from Aššur and Nineveh, probably from the Neo-Assyrian period.' No OB manuscript witnesses are listed."
    recommended_fix: "Change 'an Old Babylonian Sargon legend, the King of Battle' to 'a Sargon legend with Old Babylonian origins, the King of Battle' or simply 'the Sargon legend known as the King of Battle'."

# ─────────────────────────────────────────────────────────────────────
# Pass 3 — Document-provenance contamination scan
# ─────────────────────────────────────────────────────────────────────

contamination_scan:
  result: CLEAN
  notes: |
    The chapter does NOT contaminate Akkadian compositions with Sumerian-only
    source-material. The four obvious risk-spots:

    1. Descent of Ishtar (line 72): "substantially different from the earlier
       Sumerian *Inanna's Descent* — shorter, more tightly plotted, less
       ritually framed. It is not a translation of the Sumerian text and must
       not be treated as one." — Explicit contamination guard. Sumerian text
       named only as comparative.

    2. Anzû (line 80): "in the Old Babylonian *Anzû*, the slayer is Ningirsu,
       the warrior-god of Lagaš; in the Standard Babylonian recension, the
       slayer is Ninurta..." — This is a recensional claim within the
       Akkadian Anzû corpus, not contamination from the Sumerian Lugal-e.
       The Sumerian Lugal-e appears only in the COMPARATIVE-HOOK on line 83.

    3. Atra-ḫasīs (line 213): "*Atra-ḫasīs* responds to and supersedes the
       Sumerian Eridu Genesis." — Comparative claim in the influences-preview;
       Eridu Genesis is named only as Sumerian context, not used as donor
       text.

    4. Adapa (line 51): "an Old Babylonian Sumerian-language *Adapa* tablet
       was excavated at Tell Haddad (ancient Me-Turan), but that text belongs
       to the Sumerian tradition and is reserved for comparative discussion
       in the influences chapter." — Explicit contamination guard, exactly
       as the inventory-audit's HIGH finding A1 required.

    Hard contamination boundary (language of composition) is respected
    throughout. No Hurro-Hittite, Ugaritic, or Aramaic text is silently used
    as Akkadian primary; all such references are flagged as comparative.

