      chapter-13 entry documenting this convention at lines
      515–536. Inline gloss in chapter 13 ("the shepherd-god, her
      own consort") at draft line 119.

      Adjudication: ACCEPT the Tammuz form for this chapter as a
      composition-specific Foster-translation convention, parallel
      to the Apsû/Abzû dual-rendering for E-abzu and the
      Gilgameš/Bilgames carve-out for Sumerian Gilgameš. The
      glossary.yaml may need a Tammuz carve-out for Foster-
      translation contexts — recommend opening one. (This is a
      note, not a blocker for chapter 13: the Tammuz form is
      defensible on the grounds the writer notes, and changing
      Tammuz to Dumuzi would cause more confusion than it solves
      because Foster's translation is the principal cited
      translation and uses Tammuz throughout.)
  akītu_decision:
    decision: NOT_APPLICABLE_TO_THIS_CHAPTER
    notes: |
      *akītu* does not appear in the chapter 13 draft. The
      composition is the *Descent of Ishtar*, not the *akītu*-
      festival, so the term is not naturally invoked. (The
      *akītu* is the New Year festival at which *Enūma Eliš* was
      recited; it is the genre of cult-festival, not the seasonal
      Tammuz wailing rite at the close of *The Descent of
      Ishtar*.) Not applicable.
  inanna_geshtinanna_carve_out:
    status: COMPLIANT_WITH_CARVE_OUT
    notes: |
