  tammuz_decision:
    decision: COMPLIANT_WITH_FOSTER_TRANSLATION_FORM
    notes: |
      Chapter uses "Tammuz" (Foster 2005 / Dalley 2008 translation
      form for the SB recension) consistently in body prose. The
      locked glossary form is "Dumuzi" with rationale "*Tammuz*
      is the later Aramaic-biblical reflex; using it imports out-
      of-period usage." For the SB recension of *The Descent of
      Ishtar*, however, the late-period composition is itself
      first-millennium; Tammuz is the form Foster 2005 adopts and
      the form by which the figure is typically known in this
      composition. The writer's gloss-decision documents this as
      FOSTER_TRANSLATION_FORM with a note that "glossary.yaml's
      chosen form may need a carve-out for first-millennium SB
      recensions / Foster-translation contexts, parallel to the
