  claim_mapping:
    - claim_number: 1
      claim_text: "Source overview: *The Descent of Ishtar* is a short Standard Babylonian poem of one hundred thirty-eight lines that narrates Ishtar's descent into the underworld, stripping at the seven gates, captivity, retrieval through a being created by Ea, and substitution of Tammuz for herself; closes with what appears to be a ritual instruction for the seasonal Tammuz wailing rites."
      claims_line: 21
      narrative_line: 4
      status: MAPPED
      note: "Verbatim semantic content; minor compression of the
        single sentence into a more narratively-flowing paragraph
        (the descent / stripping / captivity / retrieval /
        substitution / closing-ritual-instruction beats are all
        preserved). Footnote byte-identical (Foster 2005, pp.
        498–505; Dalley 2008, pp. 154–162)."
    - claim_number: 2
      claim_text: "Principal Akkadian witness K.162 in the British Museum (Aššurbanipal's seventh-century BCE royal library) plus parallel Neo-Assyrian fragments; an additional manuscript was recovered from the library of the chief singer (*nargallu*) at Aššur, on an early Neo-Assyrian tablet. Witnesses agree on the seven-gate structure and substitution ending; minor textual differences principally in the closing ritual lines."
      claims_line: 25
      narrative_line: 8
      status: MAPPED
      note: "Verbatim. The technical term *nargallu* preserved in
        the locked italic-underscore form. Footnote byte-identical."
    - claim_number: 3
      claim_text: "Standard accessible English translations: Foster *Before the Muses* (3rd ed., CDL Press 2005), pp. 498–505; Dalley *Myths from Mesopotamia* (rev. ed., OWC 2008), pp. 154–162. Modern critical edition: Lapinkivi 2010 *The Neo-Assyrian Myth of Ištar's Descent and Resurrection* SAACT 6 (named-but-flagged). eBL electronic text edition (https://www.ebl.lmu.de/corpus/L/1/8) consolidates and extends Lapinkivi (named-but-flagged)."
      claims_line: 29
      narrative_line: 12
      status: MAPPED
      note: "Verbatim. F-2 LOW (Lapinkivi 2010 named-but-flagged
        as the modern critical edition; this Helsinki edition
        supersedes the older 'Borger 1979 *BAL II*' reference
        noted in the inventory) preserved byte-identical from
        claims line 29. Footnote with full bibliographic data
        (Lapinkivi 2010, SAACT 6, Helsinki: Neo-Assyrian Text
        Corpus Project) preserved byte-identical. The Lapinkivi
        title is the one place in the chapter where 'Ištar' (with
        diacritic) appears in the body — because the title is
        Lapinkivi's published title; this is correct preservation
        of source-citation form per chapter-draft skill rule 4."
    - claim_number: 4
      claim_text: "Composition is preserved with only minor lacunae. Narrative arc — descent, stripping, captivity, retrieval, substitution — is fully recoverable from the surviving lines; closing ritual instruction for the Tammuz festival shows greater damage in some witnesses but is recoverable through cross-manuscript joining."
      claims_line: 33
      narrative_line: 16
      status: MAPPED
      note: "Verbatim. Footnote byte-identical (Foster 2005, pp.
        504–505; Foster 2007, pp. 26–29 on first-millennium
        transmission)."
    - claim_number: 5
      claim_text: "The composition opens by naming the underworld: *Kurnugê* — 'the Land of No Return', 'the dark house, the dwelling of Erkalla' — the Mesopotamian underworld where the dead reside. Conditions described in unusually direct images: those who enter are clothed in feathers like birds, dust is their food, clay their bread; they see no light and dwell in darkness."
      claims_line: 43
      narrative_line: 26
      status: MAPPED
      note: "Verbatim. The three-quoted-tags 'the Land of No
        Return', 'the dark house', 'the dwelling of Erkalla' are
        preserved (claims has 'the dark house, the dwelling of
        Erkalla' as one quoted phrase; draft splits into 'the dark
