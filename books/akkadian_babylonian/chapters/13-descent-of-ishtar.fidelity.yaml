    - claim_number: 12
      claim_text: "At each gate Ishtar protests; gatekeeper answers each protest with the formulaic refrain — 'Enter, my lady; thus are the rites of the Mistress of Earth' (or close equivalent in Foster). Refrain repeated through all seven gates; rhetorical insistence is a defining feature of the composition's poetic structure."
