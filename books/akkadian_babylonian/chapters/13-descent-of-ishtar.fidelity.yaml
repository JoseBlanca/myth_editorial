glossary_compliance:
  status: PARTIAL — glossary-compliance issue with "Ishtar"/"Ištar"
  ishtar_istar_decision:
    decision: REVISE-RECOMMENDED
    explicit_adjudication: |
      The chapter draft uses "Ishtar" (Foster's editorial form,
      matching the composition title "*The Descent of Ishtar*")
      consistently in body prose for the Akkadian goddess herself —
      28 occurrences in body prose for the goddess (out of 29
      total, the 29th being the section heading "=== Ishtar's
      descent and threat at the gate"). The locked glossary form
      per glossary.yaml is "Ištar" with the š-háček, with rationale
      "Per scope.md's Assyriological-standard policy. Sumerian
      *Inanna* belongs to the companion volume and is permitted
      only when citing Sumerian compositions by their Sumerian
      title."

      Chapter 0's precedent is unambiguous: the introduction uses
      "Ištar" (with diacritic) for the goddess in body prose
      (including possessives "Ištar's temple", "Ištar's marriage
      offer") and "Ishtar" only in the composition title
      "*Descent of Ishtar*". Chapter 13's draft body prose breaks
      from this precedent.

      The writer flagged this as an OPEN GLOSSARY QUESTION
      requiring fidelity-stage adjudication; the gloss-ledger entry
      for Ištar at lines 47–65 documents the open question.

      My adjudication: REVISE — the body prose should be aligned
      with the locked glossary form and chapter 0's precedent. The
      following surface revisions are required:
      - 28 body-prose occurrences of "Ishtar" referring to the
        goddess herself → "Ištar" (with š-háček)
      - 1 section heading "=== Ishtar's descent and threat at
        the gate" → "=== Ištar's descent and threat at the gate"
      - The chapter title "== The Descent of Ishtar" remains as
        is (editorial composition title; chapter 0 preserves the
        composition title in this form)
      - The composition title in body prose "*The Descent of
        Ishtar*" / "*Descent of Ishtar*" remains as is (editorial
        composition title; chapter 0 preserves the composition
        title in this form)
      - Footnotes preserve their source-citation forms verbatim
        (Foster 2005 uses "Ishtar" in citation, Black & Green
        1992 s.v. Ishtar, etc.) per chapter-draft skill rules 4
        and 5
      - EVIDENCE tokens, marker contents, and COMPARATIVE-HOOK
        comments preserve their source-citation/carry-through
        forms verbatim per chapter-draft skill rules 4 and 5
      - The Lapinkivi 2010 book title "*The Neo-Assyrian Myth of
        Ištar's Descent and Resurrection*" remains as is — it
        already uses "Ištar" because that is the published title
        of the SAACT 6 volume
      - The brief's entities_glossary uses "Ishtar" but the brief
        is upstream of the locked glossary; the locked glossary
        form takes precedence at the chapter-finalization stage
      - The post-human-normalize-approved claims document uses
        "Ishtar" in body prose at the same 28 positions; the
        approved claims document needs the same revision.
        Alternatively, the chapter draft can be revised
        independently of the claims document to bring the
        body prose into glossary compliance — the claims
        document's role is content fidelity, not surface form,
        and surface-form revisions to align with the locked
        glossary do not require re-running the claims-factcheck
        stage.

      Note: this is the principal blocker for a clean PASS
      verdict. All other fidelity checks pass; the recommended
      revision is purely a surface-form glossary-compliance fix
      to align body-prose with the locked Ištar form and the
      chapter-0 precedent. Once the body-prose s/Ishtar/Ištar/
      revision is applied, the chapter is fidelity-clean.

      Counter-argument considered (and rejected): the writer
      argues the editorial-Ishtar form maintains visual
      consistency with the composition title "*The Descent of
      Ishtar*" and matches the brief's entities_glossary. This is
      a coherent stylistic argument, but it is overridden by:
      (1) the locked glossary form is unambiguous; (2) chapter 0
      sets precedent for the goddess-in-body-prose use of Ištar
      while preserving Ishtar in the composition title; (3) the
      Assyriological-standard policy is the book-wide convention.
      The visual-consistency argument is satisfied by chapter 0's
      mixed convention (Ištar for goddess, Ishtar for title);
      chapter 13 should follow the same pattern.

  ereškigal_decision:
    decision: COMPLIANT
    notes: |
      The locked glossary form "Ereškigal" with the š-háček is
      used consistently in body prose, in markers, in footnotes,
