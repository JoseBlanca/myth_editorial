    - claim_number: 14
      claim_text: "While Ishtar is held below, fertility and reproduction cease above. Bull no longer mounts cow, donkey no longer mounts jenny, man no longer impregnates woman; man sleeps in his chamber, woman in her own. Cessation of generation on earth is the cosmic consequence of Ishtar's captivity."
