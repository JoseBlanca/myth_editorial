    - claim_number: 13
      claim_text: "When Ishtar reaches Ereškigal, naked, queen of *Kurnugê* turns sixty diseases — through Namtar — upon Ishtar's body. Ishtar held captive in the depth of the underworld, struck by sixty afflictions."
