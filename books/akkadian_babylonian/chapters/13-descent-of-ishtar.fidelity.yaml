    - claim_number: 11
      claim_text: "Composition's structural centrepiece is the descent through the seven gates. At each gate, gatekeeper takes one item of clothing or jewelry, fixed sequence preserved through all witnesses. Sequence: (1) great crown; (2) rings of her ears; (3) chains of her neck; (4) ornaments of her breast; (5) girdle of birthstones at her waist; (6) bangles of her hands and feet; (7) proud garment of her body. By the time Ishtar reaches Ereškigal, she stands naked."
      claims_line: 75
      narrative_line: 58
      status: MAPPED
      note: "Verbatim. All seven items preserved in the same
