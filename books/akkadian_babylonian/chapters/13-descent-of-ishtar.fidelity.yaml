comparative_hook_preservation:
  total_hooks_in_claims: 6
  total_hooks_in_narrative: 6
  hooks:
    - hook_index: 1
      claims_line: 173
      narrative_line: 156
      topic: "Sumerian (*Inanna's Descent*, ETCSL 1.4.1) — substantially longer (412 lines) and structurally distinct composition. Both texts share seven-gate stripping and underworld-substitution pattern, but Sumerian text has demonic *galla* pursuing Inanna's substitutes (Dumuzi, his sister Geshtinanna), Akkadian text has Ea's creation Aṣušu-namir as rescuing figure and Tammuz as substitute without sister-substitute episode. Akkadian *Descent of Ishtar* INDEPENDENT composition on shared theme, not translation. Per scope.md, Sumerian belongs to *Myths of Sumer*; reserved for influences chapter."
      status: PRESERVED_VERBATIM
      note: "Geshtinanna and 'Inanna's substitutes (Dumuzi, his
        sister Geshtinanna)' mentions are in explicit Sumerian-
        tradition citation context, permitted per glossary.yaml's
        never_use carve-out."
    - hook_index: 2
      claims_line: 174
      narrative_line: 157
      topic: "Akkadian internal — *Nergal and Ereškigal* (chapter 14) is principal Akkadian-internal comparandum among underworld compositions. Two texts together form paired underworld dossier (descent-and-substitution; reluctant-marriage). Share figure of Ereškigal and *Kurnugê* setting; narrative arcs complementary rather than overlapping."
      status: PRESERVED_VERBATIM
    - hook_index: 3
      claims_line: 175
      narrative_line: 158
      topic: "Greek — Persephone's descent to Hades and seasonal return shares structural pattern of seasonal-vegetation death and return. Cessation-of-fertility motif (failed harvests during Persephone's underworld stay) closely parallels cessation-of-generation motif in *Descent of Ishtar* (failed reproduction during Ishtar's captivity). Parallel typological — wider Mediterranean-Mesopotamian pattern of seasonal dying-and-returning gods — rather than transmissional. Reserved for influences chapter."
      status: PRESERVED_VERBATIM
    - hook_index: 4
      claims_line: 176
      narrative_line: 159
      topic: "Egyptian — Osiris's death and cyclical resurrection shares dying-god typology with Tammuz. Mesopotamian and Egyptian dying-god cults developed within independent ritual systems but produced strikingly parallel theological structures (god whose seasonal death and return underwrites year's agricultural and political cycles). Reserved for influences chapter."
      status: PRESERVED_VERBATIM
    - hook_index: 5
      claims_line: 177
      narrative_line: 160
      topic: "Hebrew Bible — Sheol imagery in Job, Psalms, Isaiah 14 echoes seven-gates and dust-as-food motifs of Mesopotamian underworld. Shared imagery represents wider ancient Near Eastern pattern of underworld description; Hebrew texts adapt imagery without retelling the Mesopotamian myth. Reserved for influences chapter."
      status: PRESERVED_VERBATIM
    - hook_index: 6
      claims_line: 178
      narrative_line: 161
      topic: "Worldwide (dying-god typology) — seasonal dying-and-returning god widely attested across ancient Near Eastern, Mediterranean, and adjacent traditions. *The Descent of Ishtar*, with its closing Tammuz wailing-rite hook, one of the earliest documented instantiations within the Akkadian tradition. Reserved for influences chapter."
      status: PRESERVED_VERBATIM

