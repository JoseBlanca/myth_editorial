supported_claims:
  - claim_number: 3
    claim: "There is no widely-used English-language anthology translation: neither Foster's *Before the Muses* (3rd ed., 2005) nor Dalley's *Myths from Mesopotamia* (rev. ed., 2008) includes *Uraš and Marduk*. Lambert's edition stands alone."
    source_id: foster-2005, dalley-2008
    source_loc: "full table of contents (verified)"
    verbatim_quote: |
      Foster 2005 (3rd ed., CDL Press) full TOC read directly via the
      4banks.net TOC PDF: Chapters I–IV cover Archaic, Classical,
      Mature, and Late Periods; the only "mythological narratives" in
      the Late Period (Chapter IV C) are "Erra and Ishum" (#17, p. 880)
      and "The Birth Legend of Sargon of Akkad" (#18, p. 912). Chapter
      III E "Mythological Poetry" includes Epic of Creation (#17),
      Myths of Origins (#18, with sub-entries on Marduk-Creator-of-the-
      World, Myth of the Plow, Creation of Humankind, Providing for
      the Gods, Creation of Sun and Moon, Creation of the King),
      Descent of Ishtar, Nergal and Ereshkigal, Adapa, Etana, Anzu,
      Monster Serpents (Serpent + Lion-Serpent). NO entry titled
      "Uraš and Marduk" appears anywhere in Foster 2005. Dalley 2008
      (verified previously in chapter 6 and 5 factchecks): TOC includes
      Atrahasis, Gilgamesh (SB + OB), Descent of Ishtar, Nergal and
      Ereshkigal (SB + Amarna), Adapa, Etana, Anzu (SB + OB), Epic of
      Creation, Theogony of Dunnu, Erra and Ishum — no Uraš and Marduk.
      The chapter's claim is correct.

  - claim_number: 7
    claim: "Uraš in this composition is ... a Mesopotamian goddess [or god — see F-4] attested ... in the dominant Mesopotamian theological tradition; ... *Uraš and Marduk* is unusual in pairing her [or him] with Marduk rather than with Anu. The composition's preserved lines name Anu and Ea in the cosmogonic background."
    source_id: lambert-2013, black-green-1992, rla
    source_loc: "Lambert 2013 chapter on Uraš and Marduk (pp. 311–315 corrected); Black & Green s.v. Uraš"
    verbatim_quote: |
      The general claim that Uraš (in either gender) is a traditional
      Mesopotamian deity, and that *Uraš and Marduk* is a composition
      that pairs Uraš with Marduk, is supported by HandWiki s.v. Urash
      (god): "A myth only known from a single poorly preserved tablet
      from Ur, _Urash and Marduk_, appears to describe how Marduk
      created plant life for Urash." The pairing-with-Marduk-instead-
      of-Anu framing is correct insofar as the female Uraš is the
      traditional spouse of Anu (Wikipedia s.v. Uraš: "Frans Wiggermann
      refers to her as his most commonly recognized wife"), so a Uraš-
      Marduk pairing is genuinely unusual. The Anu-and-Ea-as-cosmogonic-
      background claim is harder to verify without Lambert 2013 in
      hand, but is plausible given the standard late-Babylonian
      cosmogonic dossier framing. NOTE per F-4: which Uraš is in the
      composition is the deeper question — the secondary literature
      reads it as the male Dilbat Urash, not the female earth-goddess.

  - claim_number: 12
    claim: "*Uraš and Marduk* belongs to the late-Babylonian cosmogonic dossier — the cluster of compositions Lambert 2013 grouped under the heading 'Further Babylonian Creation Tales.' The dossier includes *Enūma Eliš*, *Enmešarra's Defeat*, *The Toil of Babylon*, *Damkina's Bond*, *The Slaying of Labbu*, and additional shorter compositions and incantation prologues."
    source_id: lambert-2013
    source_loc: "Part III, pp. 281–401 (TOC verified)"
    verbatim_quote: |
      Lambert 2013 TOC (read directly): "Part III Further Babylonian
      Creation Tales — Enmešarra's Defeat 281; The Town of Zarpānītum
      299; The Toil of Babylon 301; Uraš and Marduk 311; The Murder
