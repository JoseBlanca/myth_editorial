# ── Verdict reasoning ──────────────────────────────────────────────────────

verdict_reasoning: |
  Verdict rules from the skill: MAJOR-REVISE = ≥3 HIGH or any
  contamination or fabricated references; REVISE = 1–2 HIGH or >3
  MEDIUM or any silent bridge; PASS = 0 HIGH and 0 silent bridges
  and ≤3 MEDIUM. This audit finds:
    HIGH: 4 (F-1 page-range error for Lambert 2013 *Uraš and Marduk*;
              F-2 page-range error for Lambert 2013 *Damkina's Bond*;
              F-3 multi-manuscript framing wrong on count;
              F-4 Uraš identity may be male Dilbat tutelary not
                  female earth-goddess)
    MEDIUM: 4 (F-5 Marduk-absorbs-Anu's-consortship INFERENCE
                  contingent on F-4;
              F-6 marriage / consortship narrative content not
                  corroborated by secondary literature;
              F-7 cosmogonic-theological-function INFERENCE
                  contingent on F-4 and F-1;
              F-8 LACUNA / RECONSTRUCTION markers' multi-manuscript
                  framing wrong)
    LOW: 3 (F-9 VARIANT marker's multi-manuscript framing wrong;
            F-10 Lelwani COMPARATIVE-HOOK slightly mis-framed;
            F-11 Late-Babylonian dating may be wrong)
    NOTES: 2 (N-1 brief-revision needed; N-2 Streck 2014
                  recommended for sources.yaml)

  Per the verdict rules, 4 HIGH triggers MAJOR-REVISE (the threshold
  is ≥3 HIGH). Verdict: MAJOR-REVISE.

  The findings cluster around two upstream-structural issues:
  (1) the Lambert 2013 page ranges — both for *Uraš and Marduk*
      (pp. 311–315, not 308–325) and for *Damkina's Bond* (pp.
      321–325, not 326–360) — are wrong in the brief and cascade
      through the chapter's footnote apparatus (F-1, F-2);
  (2) the manuscript / identity premises — *Uraš and Marduk* is
      preserved on a single tablet (UET 6, 398 from Ur), and the
      Uraš in the composition is more likely the male Dilbat
      agricultural tutelary than the female earth-goddess — both
      contradict the chapter's central framing (F-3, F-4).

  The chapter writer faithfully implemented the brief — the
  failures are not in the writing itself but in the brief's
  underlying claims about pagination, manuscript count, and Uraš
  identity. The marker schema discipline is excellent (every LACUNA,
  RECONSTRUCTION, INFERENCE, VARIANT, and COMPARATIVE-HOOK is
  structurally well-formed); the failures are about the underlying
  substance, not the formal compliance.

  Recommendation for the human review pass: open Lambert 2013 pp.
  311–315 directly and answer four questions:
    (a) How many manuscripts does Lambert score for *Uraš and
        Marduk*? Single tablet UET 6, 398, or multiple witnesses?
    (b) What is the date of the manuscript(s)? Old Babylonian /
        Kassite / Late Babylonian?
    (c) How does Lambert identify the Uraš of this composition —
        female earth-goddess (spouse of Anu) or male Dilbat tutelary
        (agricultural deity)? On what philological grounds?
    (d) What does the surviving narrative actually relate? Marduk
        creating plant life for Uraš (consistent with the male
        agricultural reading), or a marriage / consortship between
        the female Uraš and Marduk, or something else?

  Depending on the answers:
    - If Lambert reads the Uraš as MALE (Dilbat agricultural
      tutelary), the chapter requires substantive rewriting:
      the entire "chthonic-celestial pairing", "feminine
      consortship", Damkina's Bond pairing, and Gaia–Ouranos
      comparative-hook all collapse. The chapter would need to be
      reframed around Marduk's cosmogonic / sovereignty assertion
      over the agricultural cycle / Dilbat cult.
    - If Lambert reads the Uraš as FEMALE (earth-goddess /
      Anu's spouse), the chapter's framing stands but: (i) the
      page ranges must be corrected throughout (pp. 311–315 +
      p. 496); (ii) the manuscript count must be corrected
      (single tablet UET 6, 398); (iii) verbatim quotes from
      Lambert pp. 311–315 must be supplied to anchor the female-
      Uraš identification against the secondary-literature
      consensus that places the composition with the male Dilbat
      Urash (HandWiki); (iv) the dating should be opened to OB /
      Kassite / Late Babylonian rather than fixed as Late
      Babylonian.
    - If Lambert is silent or cautious on the gender question,
      the chapter must be reframed with explicit acknowledgement
      of the open identification.

  In any of these resolutions, the chapter must NOT be allowed to
  go forward as it stands: the page-range errors alone (F-1, F-2)
  make a substantial fraction of the EVIDENCE-token apparatus
  unverifiable against the actual edition, and the Uraš identity
  question (F-4) is potentially structural to the chapter's
  argument. The brief at briefs/08-uras-and-marduk.yaml must be
  re-locked at chapter-briefs review with corrected source-loc
  pagination, corrected lacunae block, and an entities_glossary
  entry that acknowledges the male/female possibility-space.

summary: |
  *Uraš and Marduk* (chapter 8 claims) — FACTCHECK VERDICT:
  MAJOR-REVISE.

  The chapter's claims document is structurally well-disciplined
  (excellent marker schema compliance, conservative footnoting,
  no contamination from out-of-scope primary sources, glossary
  discipline maintained, comparative-hooks correctly forwarded
  to the influences chapter) — but it inherits four
  upstream-structural errors from the brief that together drive
  a MAJOR-REVISE verdict:

  HIGH-1 (F-1): The Lambert 2013 page range for the chapter
  "Uraš and Marduk" is locked in the brief as pp. 308–325 but is
  actually pp. 311–315 (+ p. 496 notes); pp. 308–310 belong to
  the previous chapter and pp. 316–325 belong to the next two.
  Verified directly via the Eisenbrauns/ETH Zurich book-level
  TOC PDF and the DeGruyter Brill chapter landing.

  HIGH-2 (F-2): The Lambert 2013 page range for *Damkina's Bond*
  cited in the chapter is pp. 326–360 but is actually pp. 321–325
  (+ p. 497 notes). Same verification.

  HIGH-3 (F-3): The chapter's framing of the composition as
  preserved on "multiple late-Babylonian manuscripts that overlap
  partially" is wrong: per Streck 2014 (BSOAS 77, p. 371) and
  HandWiki s.v. Urash (god), the composition is preserved on a
  SINGLE tablet UET 6, 398 from Ur. The LACUNA, RECONSTRUCTION,
  and VARIANT markers' multi-manuscript framings all collapse
  under this correction; the dating ("Late Babylonian / Hellenistic
  period") may also be wrong (HandWiki: possibly OB or Kassite
  composition with Dilbat origin).

  HIGH-4 (F-4): The chapter's identification of the Uraš in *Uraš
  and Marduk* as the FEMALE earth-goddess (spouse of Anu) is at
  variance with the available secondary literature: HandWiki
  frames the composition as being about the MALE agricultural
  tutelary of Dilbat ("Marduk created plant life for Urash"),
  and the Wikipedia article on the female Uraš does NOT mention
  the composition at all. If the male-Urash reading is correct,
  the chapter's entire framing as "chthonic-celestial pairing"
  / "feminine consortship" / pairing-with-Damkina's-Bond /
  Gaia–Ouranos parallel collapses.

  Plus 4 MEDIUM and 3 LOW findings, all dependency-cascading from
  F-1 / F-3 / F-4.

  The chapter writer faithfully implemented the brief; the failures
  are upstream at the brief stage. The brief at briefs/08-uras-and-
  marduk.yaml must be re-locked at chapter-briefs review with
  corrected pagination, corrected lacunae block, and an
  entities_glossary entry that acknowledges the male/female
  possibility-space for Uraš's identity in this composition.
  Direct access to Lambert 2013 pp. 311–315 is required to resolve
  F-3 (manuscript count), F-4 (Uraš identity), F-6 (narrative
  content), and F-11 (date). Until these are resolved, the chapter
  must not proceed to chapter-draft.
