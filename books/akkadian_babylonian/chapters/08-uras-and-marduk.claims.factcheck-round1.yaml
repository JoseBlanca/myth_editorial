  - finding_id: F-3
    claim_number: 4
    kind: UNVERIFIED
    severity: HIGH
    claim: |
      "The composition is preserved on multiple late-Babylonian
      manuscripts that overlap partially. Lambert 2013 collates these
      witnesses into a composite text; no single manuscript preserves
      the composition continuously, and substantial breaks remain even
      in the composite. The manuscripts are late — Late Babylonian
      (mid-first millennium BCE through the Hellenistic period) — and
      reflect the same temple-scholarly milieu that preserved the rest
      of the Marduk cosmogonic dossier."
      [+ associated LACUNA marker referring to "witness manuscripts"
      (plural) and "Lambert 2013's composite text"; + RECONSTRUCTION
      marker referring to "joining overlapping lines from different
      exemplars"; + claim 14's "the late-Babylonian witnesses Lambert
      2013 collates"; + VARIANT marker citing "partially overlapping
      late-Babylonian manuscripts"]
    issue: |
      The chapter, brief, and all four structural markers (LACUNA,
      RECONSTRUCTION, VARIANT, and the supporting EVIDENCE tokens)
      assert that *Uraš and Marduk* is preserved on MULTIPLE late-
      Babylonian manuscripts that overlap partially. The available
      secondary evidence directly contradicts this: Streck's 2014
      BSOAS review identifies the manuscript base as a SINGLE tablet
      "Uraš and Marduk (UET 6, 398)" — UET = *Ur Excavations Texts*
      vol. 6, no. 398. HandWiki s.v. Urash (god) similarly: "A myth
      only known from a single poorly preserved tablet from Ur,
      _Urash and Marduk_." This is a SINGLE-tablet attestation, NOT
      multiple overlapping manuscripts. Furthermore, the date and
      provenance are different from the chapter's framing: the tablet
      is from Ur (not necessarily late-Babylonian), and HandWiki notes
      "it is possible that it was composed earlier, in the Old
      Babylonian or Kassite period, and that it had its origin in
      Dilbat" — so the composition's date is uncertain (Old Babylonian
      / Kassite / late-Babylonian), and the provenance of the tablet
      is Ur, not the late-Babylonian Babylon-temple-scholarly milieu
      the chapter posits. The brief's lacunae block ("Multiple late-
      Babylonian manuscripts; substantial breaks throughout") and the
      chapter's manuscript-description claim are therefore both
      inconsistent with the secondary literature available to me.
      Severity HIGH because: (a) the multi-manuscript framing
      underwrites the LACUNA, RECONSTRUCTION, and VARIANT markers
      structurally, and removing it forces all three to be reframed
      around a single damaged tablet whose breaks Lambert restores
      from internal context (no parallel manuscripts available for
      fill); (b) the date framing ("Late Babylonian (mid-first
      millennium BCE through the Hellenistic period)") is not
      supported by HandWiki's note that the composition may date to
      the Old Babylonian or Kassite period, with its origin in Dilbat;
      (c) the temple-scholarly-milieu claim ("reflect the same temple-
      scholarly milieu that preserved the rest of the Marduk
      cosmogonic dossier") depends on the late-Babylonian dating and
      collapses if the tablet is from Ur. The chapter writer
      faithfully implemented the brief's locked lacunae and variant
      blocks — the failure is upstream at the brief stage.
    evidence: |
      Streck 2014 (BSOAS 77, 371–372), review of Lambert 2013, p. 371:
      "Part III, 'Further Babylonian creation tales' (pp. 281–401)
      gives an edition of no fewer than 16 Sumerian and Akkadian
      literary texts: Enmešarra's Defeat (PSBA 30, 53 ff. etc.), The
      Town of Zarpānītum (a fragmentary text not published before),
      The Toil of Babylon (TSBA 5, 303 ff. and STC 1, 219–20), **Uraš
      and Marduk (UET 6, 398)**, ..." — Streck's review identifies the
      manuscript base for *Uraš and Marduk* as the single tablet UET
      6, 398. UET 6 = *Ur Excavations Texts* vol. 6 (Sumerian and
      Akkadian literary texts from Old Babylonian Ur). HandWiki s.v.
      Urash (god): "A myth only known from a single poorly preserved
      tablet from Ur, _Urash and Marduk_, appears to describe how
      Marduk created plant life for Urash. ... It is possible that it
      was composed earlier, in the Old Babylonian or Kassite period,
      and that it had its origin in Dilbat."
    recommended_fix: |
      The chapter writer (and the brief's author) must open Lambert
      2013 pp. 311–315 directly and verify: (a) how many manuscripts
      Lambert lists in the manuscript score for *Uraš and Marduk*;
      (b) whether the manuscript(s) are dated Old Babylonian, Kassite,
      or Late Babylonian; (c) whether the provenance is Ur (per UET 6,
      398) or some other site; (d) whether the composition's origin
      is in Dilbat (per HandWiki). If the standard secondary
      description is correct (single tablet UET 6, 398 from Ur,
      possibly composed in OB or Kassite period), the chapter must be
      rewritten as follows: (i) claim 4 → "The composition is preserved
      on a single tablet from Ur, UET 6, 398, in poor preservation
      with substantial breaks. The date of composition is uncertain
      — Old Babylonian, Kassite, or Late Babylonian have all been
      proposed; the composition may have originated in Dilbat (the
      cult-centre of the male tutelary Uraš) but the surviving tablet
      is from Ur."; (ii) the LACUNA marker → "single damaged tablet
      from Ur (UET 6, 398); reconstruction provisional throughout; no
      parallel manuscripts available for fill"; (iii) the
      RECONSTRUCTION marker → fill_source: "limited; no parallel
      manuscripts; Lambert 2013's running text is restoration of breaks
      within a single witness using internal context"; (iv) the
      VARIANT marker → primary=Lambert 2013 reading of the single
      tablet; alt=alternative restorations of breaks within the
      single witness (philological, not exemplar-variation).
      Re-locking the brief's lacunae block at chapter-briefs review
      is mandatory before the chapter is re-cycled.

  - finding_id: F-4
    claim_number: 6
    kind: UNVERIFIED
    severity: HIGH
    claim: |
      "Uraš in this composition is the feminine earth-goddess, not to
      be confused with the homonymous male tutelary deity of Dilbat (a
      separate divine figure with a separate cult and iconography).
      Lambert 2013 identifies the Uraš of this composition as the
      female earth-goddess based on the gendered grammar of the
      surviving lines and on Uraš's traditional cosmogonic role."
    issue: |
      The chapter asserts that the Uraš of *Uraš and Marduk* is the
      FEMALE earth-goddess (the spouse of Anu), explicitly distinguishing
      her from the male Dilbat tutelary. The available secondary
      literature suggests the opposite: HandWiki's article on the MALE
      Urash (the Dilbat tutelary) is where the *Uraš and Marduk*
      composition is summarised — i.e., HandWiki frames the composition
      as being about the MALE Urash, not the female. HandWiki's
      summary specifically: "A myth only known from a single poorly
      preserved tablet from Ur, _Urash and Marduk_, appears to
      describe how Marduk created plant life for Urash. ... it is
      possible that it had its origin in Dilbat" — Dilbat is the cult-
      centre of the MALE Urash. "Plant life created for Urash" is
      consistent with the agricultural-character male Urash of Dilbat
      (HandWiki: "Urash had agricultural character"); the female Uraš
      (cosmogonic spouse-of-Anu) is not normally a recipient of plant-
      life creation. The Wikipedia article on the FEMALE Uraš
      (https://en.wikipedia.org/wiki/Ura%C5%A1) does NOT mention the
      *Uraš and Marduk* composition at all — the entire Wikipedia
      article on the female Uraš is silent on this text. By contrast,
      HandWiki s.v. Urash (god) — the male — covers the composition
      specifically. This strongly suggests that the standard scholarly
      identification places *Uraš and Marduk* with the MALE Urash, not
      the female. The chapter's identification is therefore at variance
      with the available secondary literature, and may be wrong.
      Severity HIGH because: (a) the gender / identity question is the
      chapter's central conceptual hinge — the entire framing of the
      composition as "chthonic-celestial pairing", "feminine
      consortship", "the chthonic earth-goddess paired with the
      celestial cosmic Marduk", the comparative-hook to Gaia–Ouranos,
      and the analytical pairing with Damkina's Bond (Damkina being
      Marduk's mother) all depend on the female-Uraš reading; (b) if
      the Uraš here is the MALE agricultural Dilbat tutelary, every
      one of those framings collapses or must be re-substantiated —
      the composition is then about Marduk creating plant life for the
      male agricultural deity of Dilbat, possibly as a theological
      assertion of Marduk's sovereignty over the agricultural cycle
      via the cult-centre Dilbat (which is in Marduk's Babylonian
      cultural sphere); (c) the chapter's footnote claim that
      "Lambert 2013 identifies the Uraš of this composition as the
      female earth-goddess based on the gendered grammar of the
      surviving lines" is a specific philological claim that I cannot
      verify without direct access to Lambert 2013, and which is
      inconsistent with the secondary-literature consensus I located.
      The chapter writer's assertion may rest on an authoritative
      reading of Lambert 2013 that I have not seen, or it may be a
      mis-reading; only direct access to Lambert can resolve.
    evidence: |
      HandWiki s.v. Urash (god): "Urash was the tutelary god of Dilbat,
      modern Tell al-Deylam in Iraq's Babil Governorate. ... Urash had
      agricultural character. ... A myth only known from a single
      poorly preserved tablet from Ur, _Urash and Marduk_, appears to
      describe how Marduk created plant life for Urash. ... It is
      possible that it was composed earlier, in the Old Babylonian or
      Kassite period, and that it had its origin in Dilbat." The
      composition is summarised in the article on the MALE Urash, not
      the female. Wikipedia s.v. Uraš (the FEMALE earth-goddess /
      spouse of Anu): the article makes NO mention of *Uraš and
      Marduk*. HandWiki notes the male/female distinction explicitly:
      "The god Urash worshiped in Dilbat was not the same as Urash,
      the spouse of Anu." This distinction is correct as presented in
      the chapter (claim 6) — but the chapter then incorrectly assigns
      *Uraš and Marduk* to the female side of the distinction.
    recommended_fix: |
      The chapter writer must open Lambert 2013 pp. 311–315 directly
      and verify: (a) does Lambert's commentary identify the Uraš of
      this composition as the FEMALE earth-goddess (Anu's spouse) or
      the MALE Dilbat tutelary? (b) what does Lambert say about the
      gender / identity of Uraš, and on what grammatical or contextual
      grounds? (c) what does the surviving text actually narrate —
      "Marduk creates plant life for Uraš" (consistent with the male
      Dilbat reading) or "Marduk takes Uraš as consort" (consistent
      with the female reading the chapter currently advances)?
      If Lambert reads the Uraš as the male Dilbat tutelary, the
      chapter requires substantive rewriting: (i) the entire "chthonic-
      celestial pairing" framing collapses (the male Urash is not
      chthonic in the cosmogonic sense the chapter posits — he is
      agricultural-tutelary); (ii) the "feminine consortship" register
      and the analytical pairing with Damkina's Bond also collapse
      (the comparandum loses its gender symmetry); (iii) the Greek
      Gaia–Ouranos COMPARATIVE-HOOK becomes inappropriate (Ouranos's
      consort Gaia is female; the Akkadian male Urash with Marduk is
      a different structural pattern); (iv) the Lelwani Hurro-Hittite
      hook also weakens (Lelwani is an underworld deity, not an
      agricultural-tutelary deity); (v) the "Marduk takes over Anu's
      consortship" INFERENCE (claim 8) collapses (the male Urash was
      never Anu's consort). The chapter would need to be rewritten
      around the male agricultural Urash framing, with the substantive
      narrative content as "Marduk creating plant life for Urash" —
      which is a quite different theological move (Marduk asserting
      sovereignty over the agricultural cycle / over the Dilbat cult-
      centre) than the chthonic-celestial-pairing the chapter currently
      offers. If Lambert reads the Uraš as the female earth-goddess
      (consistent with the chapter), the chapter's framing stands but
      a verbatim quote from Lambert pp. 311–315 anchoring the female
      identification must be supplied to override the secondary-
      literature consensus. The alternative — that Lambert is silent
      or cautious on the gender question, leaving the identification
      open — would also require the chapter to be reframed with
      explicit acknowledgement of the open identification and the
      male/female possibility-space.

