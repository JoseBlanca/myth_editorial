  - claim_number: 14
    claim: "*Uraš and Marduk* has no parallel manuscripts outside the late-Babylonian witnesses Lambert 2013 collates. There are no Old Babylonian, Middle Babylonian, or Neo-Assyrian witnesses to this composition. The textual history is confined to the late-Babylonian period."
    source_id: lambert-2013
    source_loc: "p. 311 (corrected from pp. 308–311 in the chapter)"
