contamination_scan:
  result: "no contamination found (but see F-4 conceptual smuggling note)"
  rationale: |
    All factual details about *Uraš and Marduk* and Uraš (in either
    gender) trace to Akkadian / Mesopotamian sources within the
    scope's date range (Akkadian cuneiform tradition, ca. 2300 BCE
    – 100 BCE). Specifically:
    - The single-tablet attestation UET 6, 398 (per Streck 2014 and
      HandWiki) is from Ur, an in-scope Akkadian site.
    - The female Uraš (spouse of Anu) is attested in Akkadian-
      cuneiform god-lists, the Sumerian-language tradition (where
      the goddess is also called Ki / Antu), and Old Babylonian /
      Akkadian-period sources — all in scope.
    - The male Uraš (Dilbat tutelary) is attested in the Akkadian
      tradition from the Old Babylonian period onward — in scope.
    - The Greek Gaia–Ouranos pairing (Hesiod *Theogony*) is OUT OF
      SCOPE as a primary source but is correctly framed as
      COMPARATIVE-HOOK only; no EVIDENCE token routes through Hesiod.
    - The Hurro-Hittite Lelwani / Hittite earth-deities are OUT OF
      SCOPE as primary sources but are correctly framed as
      COMPARATIVE-HOOK only; no EVIDENCE token routes through
      Hoffner 1998.
    - The Damkina's Bond and *Enūma Eliš* internal cross-references
      are all to Akkadian compositions in Lambert 2013 — in scope.
    No detail in the chapter is attested only in out-of-scope
    sources (Sumerian, Hurro-Hittite, Ugaritic, Hebrew, Aramaic,
    Greek). The Pass-3 scan returns clean for strict contamination.

    NOTE per F-4: there is a parallel kind of conceptual smuggling
    that is not strictly contamination — the female cosmogonic
    earth-goddess Uraš is being substituted for the more contextually
    plausible male Dilbat agricultural tutelary as the identity of
    the Uraš in *Uraš and Marduk*. Both Uraš figures are in-scope
    Akkadian / Mesopotamian deities, so the scope's contamination
    rule (which targets out-of-scope SOURCES) does not formally
    fire. But the same kind of conceptual error the contamination
    rule guards against — substituting a more familiar / more
    structurally appealing figure for the contextually correct one
    — is in play. F-4 captures this separately as an UNVERIFIED-HIGH
    finding.

