  total_claims: 14
  mapped: 14
  unmapped: 0
  claim_mapping:
    - claim_number: 1
      claim_text: "Source overview: *The Worm and the Toothache* is a short Akkadian incantation against toothache, preserved with a cosmogonic prologue. Principal cuneiform publication CT 17 plate 50 (Thompson 1903) with Nineveh witness BM K.2413 from Aššurbanipal's library + parallel K-collection fragments; Foster 2005's apparatus also references duplicates from Aššur."
      claims_line: 61
      narrative_line: 4
      status: MAPPED
      note: "Reframed in draft as an opening 'establishing shot' first paragraph that compresses the cosmogonic-narrative arc into a synoptic forecast (chain of begettings → lament → fig and apricot → defiance → curse → ritual prescription → etiology-as-cure framing). The opening footnote is byte-identical to the claims-line-61 footnote, including the Round-1 factcheck LOW-finding F-4 hedge ('whose Aššur attestation is sourced through Foster')."
    - claim_number: 2
      claim_text: "Standard accessible modern English translation is Foster 2005, *Before the Muses* (3rd ed., CDL Press), pp. 995–996. Speiser's older ANET (1969) translation excluded from sources.yaml as current reference. Lambert 2013 may include the composition in 'Mythological Introductions on Creation' pp. 399–402 (chapter 37) but this is unverified at the brief / claims stage. Dalley 2008 does not contain this composition."
      claims_line: 64
      narrative_line: 7
      status: MAPPED
      note: "Verbatim apart from one minor de-duplication: claims 'Lambert's *Babylonian Creation Myths* (2013) may include the composition in his \"Mythological Introductions on Creation\" section (pp. 399–402, chapter 37, which collects multiple short cosmogonic incantation prologues)' → draft 'Lambert's *Babylonian Creation Myths* (2013) may include the composition in his \"Mythological Introductions on Creation\" section (pp. 399–402)' (the parenthetical 'chapter 37, which collects multiple short cosmogonic incantation prologues' shortened to just the page range; chapter 37 / multiple-cosmogonic-incantation-prologues elaboration retained in the line-7 footnote which still cites 'Lambert 2013, possibly within pp. 399–402 (\"Mythological Introductions on Creation\")'). No factual loss."
    - claim_number: 3
      claim_text: "Composition preserved on multiple manuscripts that overlap. Principal witness Nineveh tablet (CT 17 50, BM K.2413 from Aššurbanipal's library, with parallel K-collection fragments); per Foster 2005's apparatus, additional duplicates are also known from Aššur. Composite text stable across duplicates; minor lexical variants between witnesses appear in the worm's request to Šamaš and Ea, but cosmogonic chain itself is invariant."
      claims_line: 68
      narrative_line: 11
      status: MAPPED
      note: "Verbatim. The Round-1 factcheck LOW-finding F-4 hedge ('per Foster 2005's apparatus' for the Aššur-duplicate attestation) is preserved byte-identical."
    - claim_number: 4
      claim_text: "Setting: composition is the cosmogonic prologue of an incantation, deployed in Akkadian medical-magical practice against toothache. Cosmogonic chain establishes worm's origin and place in cosmic order; etiology grounds practitioner's authority. Knowing the worm's origin is the practitioner's tool against it."
      claims_line: 77
      narrative_line: 20
      status: MAPPED
      note: "Verbatim apart from one prose connective: claims 'Knowing the worm's origin is the practitioner's tool against it.' → draft 'Knowing the worm's origin is, in the composition's magical logic, the practitioner's tool against it.' (the 'in the composition's magical logic' parenthetical inserted; semantic equivalent of claim's framing; no new factual content)."
    - claim_number: 5
      claim_text: "Composition's surviving copies first-millennium Babylonian / Assyrian (Nineveh witness from Aššurbanipal's seventh-century BCE library; Aššur duplicate(s) from same period). Compositional date is older than surviving copies — colophon on at least one duplicate notes copy from earlier version, indicating circulation in older recensions before Neo-Assyrian period."
      claims_line: 81
      narrative_line: 24
      status: MAPPED
      note: "Verbatim apart from one prose reformatting: claims 'first-millennium Babylonian / Assyrian (the Nineveh witness from Aššurbanipal's seventh-century BCE library; the Aššur duplicate(s) from the same period)' → draft 'first-millennium Babylonian / Assyrian — the Nineveh witness from Aššurbanipal's seventh-century BCE library, with duplicates from the same period at Aššur' (parenthetical-with-semicolon → em-dash-with-comma reformatting; identical content)."
    - claim_number: 6
      claim_text: "The composition opens with a six-step cosmogonic sequence: Anu created heaven; heaven created earth; earth created rivers; rivers created irrigation ditches; ditches created mud; mud created the worm. Speiser's older ANET translation gives a five-step variant with 'marsh' in place of the rivers-ditches-mud sequence — Anu → heaven → earth → rivers → marsh → worm. Chain is hierarchical and sequential; descends from Anu (sky-god) to worm (lowest creature) by chain of cosmogonic generation."
      claims_line: 87
      narrative_line: 30
      status: MAPPED
      note: "Verbatim. The Round-1 factcheck MEDIUM-finding F-2 fix (six-step Foster cosmogonic chain with Speiser five-step variant noted) is preserved byte-identical. Only minor reformatting: claims '(Speiser's older ANET translation gives a five-step variant ...; the difference is a translation choice on the same Akkadian text.)' as a parenthetical → draft 'Speiser's older ANET translation gives a five-step variant ... but the difference is a translation choice on the same Akkadian text. Either way, the chain is hierarchical and sequential' as a sentence (with the 'Either way' connective added to bridge to the next claim). No factual change."
    - claim_number: 7
      claim_text: "The worm — Akkadian *tūltu*, 'worm' or 'maggot' — is the sixth and final term of the cosmogonic chain in Foster's translation (the fifth and final term in Speiser's earlier rendering). Text personifies worm as speaking agent; named after a generic noun (a category of creature) rather than as an individual deity. Personified worm is etiology's protagonist; cosmogonic chain establishes its place in divinely-ordered world."
      claims_line: 91
      narrative_line: 34
      status: MAPPED
      note: "Draft drops the parenthetical '(a category of creature)' from the body — claims 'the worm is named after a generic noun (a category of creature) rather than as an individual deity' → draft 'the worm is named after a generic noun rather than as an individual deity'; minor de-duplication (the meaning is conveyed by 'generic noun' alone; the 'category of creature' parenthetical was a gloss). No factual loss."
    - claim_number: 8
      claim_text: "The worm weeps before Šamaš (sun-god, judge of gods and men) with tears flowing before Ea (wise god of fresh waters). Worm asks: 'What will you give me to eat? What will you give me to suck on?'"
      claims_line: 99
      narrative_line: 42
      status: MAPPED
      note: "Verbatim quote ('What will you give me to eat? What will you give me to suck on?') preserved byte-identical. One minor connective change: claims 'the sun-god and judge of gods and men' → draft 'the sun-god, judge of gods and men' (and-vs-comma appositive reformatting; semantic equivalence, no factual change)."
    - claim_number: 9
      claim_text: "Gods' answer is offer of ordinary food: ripe fig and apricot. Worm offered natural produce of cosmos as appropriate diet — fruit, gift of ordered cosmogonic system in which each creature has its proper food."
      claims_line: 103
      narrative_line: 46
      status: MAPPED
      note: "Verbatim, byte-identical."
    - claim_number: 10
      claim_text: "Worm rejects offer. In central speech of composition, worm declares refusal: 'What good is the ripe fig and the apricot? Lift me up, and let me dwell between the teeth and the gums! I will suck the blood of the tooth, and I will gnaw on the bone of the jaw!'"
      claims_line: 108
      narrative_line: 51
      status: MAPPED
      note: "Verbatim quote preserved byte-identical (the central speech of the composition, in Foster's wording per Round-1 factcheck LOW-finding F-5)."
    - claim_number: 11
      claim_text: "Worm's choice — to dwell in human teeth and gnaw their roots rather than subsist on fruit — is etiological hinge of composition. Aetiology of dental caries established here: worm has chosen tooth as dwelling, against gods' offer of ordinary food. Dental decay is consequence of worm's defiant election."
      claims_line: 111
      narrative_line: 54
      status: MAPPED
      note: "Verbatim, byte-identical."
    - claim_number: 12
      claim_text: "Ea responds to worm's defiance with curse: 'Because you have said this, O worm, may Ea strike you with the might of his hand!' Curse articulated in third person — Ea pronounces curse upon worm, with divine power of his own hand as punitive instrument. Curse converts etiological narrative into magical performance: practitioner who recites incantation invokes Ea's curse upon worm in patient's tooth."
      claims_line: 117
      narrative_line: 60
      status: MAPPED
      note: "Verbatim quote preserved byte-identical."
    - claim_number: 13
      claim_text: "Closing portion of tablet contains ritual prescription — instructions to practitioner for applying incantation to patient's tooth. Prescription specifies ingredients of paste/compound (surviving lines mention beer or other fluid as vehicle), recitation of incantation as paste applied, and number of repetitions. Practitioner performs incantation as part of medical-magical procedure that combines verbal and material elements."
      claims_line: 125
      narrative_line: 68
      status: MAPPED
      note: "Verbatim, byte-identical."
    - claim_number: 14
      claim_text: "Closing ritual-prescription is partly damaged in some duplicates of CT 17 50 — precise ingredient list, exact words of recitation directives, and specific repetition count not fully recoverable from any single witness. Composite text Foster 2005 reflects represents partial reconstruction; some details remain indeterminate."
      claims_line: 130
      narrative_line: 73
      status: MAPPED
      note: "Verbatim, byte-identical."

