        status: MAPPED
        note: "Verbatim, byte-identical. The Round-1 factcheck MEDIUM-finding F-3 fix (YOS 11, 5a → van Dijk, Goetze, and Hussey 1985 attribution; OB worm/leech-against-infant genre rather than toothache) is preserved byte-identical in the line-80 footnote, including the Cohen and Wasserman 2008 *RA* 102 pp. 71–88 named-but-flagged citation."
      - claims_line: 142
        narrative_line: 85
        topic: "*The Worm and the Toothache* significant within Akkadian corpus as most-anthologised brief cosmogony — frequently cited in introductions to Akkadian literature, Mesopotamian religion, history of medicine. Compactness (fewer than two dozen lines) + complete cosmogonic chain (Anu to worm) make it illustrative type for incantation-prologue cosmogony genre."
        status: MAPPED
      - claims_line: 146
        narrative_line: 89
        topic: "Composition's wider cultural reception unusually long. 'Tooth-worm' theory of dental caries persisted in European medical thinking through 18th century, traceable in part through long transmission history of Akkadian medical-magical material. Akkadian text not only source for tooth-worm theory in European medicine, but oldest documented instantiation."
        status: MAPPED
      - claims_line: 150
        narrative_line: 93
        topic: "Within Akkadian incantation-prologue cosmogony dossier, closest internal parallel = *The Founding of Eridu* (Chapter 10) — bilingual Sumerian-Akkadian incantation prologue on BM 93014. *The Founding of Eridu* larger and more developed; *The Worm and the Toothache* most-anthologised brief instance. Together exemplify how Akkadian incantations frame magical acts in cosmogonic narrative."
        status: MAPPED
        note: "Verbatim, byte-identical."

