writer_flagged_for_scrutiny_resolution:
  - flag_id: 1
    flag: "Historical Sargon reign dates (ca. 2334–2279 BCE, middle chronology) — verify against scholarly consensus."
    resolution: UPHELD
    detail: |
      Confirmed across multiple independent sources: Wikipedia s.v.
      Sargon of Akkad ("c. 2334 – c. 2279 BC"); Wikipedia s.v. Akkad
      (city) ("Sargon of Akkad (2334–2279 BC)"); World History
      Encyclopedia ("Reign dates: 2334-2279 BCE"). The middle-
      chronology dating is standard scholarly consensus and is the
      conventional anchor in Westenholz 1997. The chapter cites the
      dates correctly at lines 50, 62, 181.
  - flag_id: 2
    flag: "K.3401 + duplicates manuscript identifier — confirm provenance (Nineveh, Aššurbanipal's library) and dating (Neo-Assyrian, 7th c. BCE)."
    resolution: UPHELD-WITH-HEDGE
    detail: |
      Manuscript K.3401 confirmed:
      - British Museum object K-3401 (web search confirms): "fragment
        of clay tablet containing a legend concerning Sargon I, with
        17 lines of inscription. It is Neo-Assyrian in date."
      - From the Library of Ashurbanipal at Kouyunjik (Nineveh), Iraq.
      - The K-prefix designates the Kouyunjik collection of the
        British Museum (excavated 1850s; the principal source of the
        Aššurbanipal-library tablets).
      - The publication reference CT 13 42-43 (Cuneiform Texts from
        Babylonian Tablets in the British Museum, vol. 13, plates
        42-43) is the standard reference for the K.3401 text.

      HOWEVER — the chapter's specific framing "K.3401 + at least two
      Neo-Babylonian duplicate manuscripts" needs verification.
      Multiple independent open-web sources state "only the beginning
      of the text (the first two columns) is known, from the
      fragments of three manuscripts" (Wikipedia s.v. Sargon of
      Akkad) — but do not specify whether the three are all Neo-
      Assyrian, or a mix of Neo-Assyrian and Neo-Babylonian, or one
      Neo-Assyrian (K.3401) plus two Neo-Babylonian as the chapter
      claims. One source mentioned "four fragmentary tablets — three
      Neo-Assyrian and one Neo-Babylonian" (a different breakdown).
      The chapter's specific framing (one NA + two NB) is plausible
      but is not directly attested in the open-web triangulation; it
      may reflect Westenholz 1997's specific manuscript inventory.
      See F-2 (MEDIUM).
  - flag_id: 3
    flag: "The autobiographical opening 'Sargon, mighty king, king of Akkad, am I' — verify standard scholarly translation."
    resolution: UPHELD
    detail: |
      Confirmed across multiple translations:
      - Wikipedia s.v. Sargon of Akkad: cites this opening (in close
        variants — "the mighty king, king of Akkad").
      - World History Encyclopedia: "Sargon, the mighty king, king of
        Agade, am I."
      - Slightly Alive Translations (mostlydeadlanguages, CT 13 42-43):
        "I am Sargon, mighty king, king of Akkad."
      - Intertextual.bible: same wording.

      The chapter (line 86) renders this as "Sargon, mighty king,
      king of Akkad, am I" — matching Foster 2005's English
      translation and consistent with the scholarly standard.
      Supported.
  - flag_id: 4
    flag: "Mother as priestess — verify the Akkadian term *enitu* and the standard English rendering."
    resolution: UPHELD-WITH-MINOR-HEDGE
    detail: |
      The Akkadian term *enītu* (or *ēnitu* / *enitu*) is correct as
      the feminine of *ēnu* "high priest"; *enītu* is the feminine
      high-priestess of the type associated with the EN (en-)
      priesthood (cf. Enheduanna, Sargon's daughter, who was the EN-
      priestess of Nanna at Ur). The chapter (line 91) renders the
      mother as "an *enitu* — a high-priestess of the type whose
      office in Mesopotamian temple administration involved ritual
      celibacy" — and notes "the term is rendered in Westenholz 1997
      and Foster 2005 as 'high priestess' or 'changeling-priestess'".

      Cross-translation evidence:
      - Wikipedia s.v. Sargon of Akkad / multiple sources: "high
        priestess".
      - Older translation (Speiser, ANET): "changeling" (a now-
        contested reading; the Akkadian is *enītu* not *naditu* or
        another priestess class).
      - World History Encyclopedia: "changeling" (uses the older
        Speiser rendering).
      - Slightly Alive Translations (CT 13 42-43): "high priestess".

      The chapter's "ritual celibacy" framing is supported by the
      wider literature on *enītu* office (a priestess class whose
      celibacy is documented in some periods/contexts though the
      precise rules varied by city and period). Supported.
  - flag_id: 5
    flag: "Azupirānu ('Saffron City') on the Euphrates — verify."
    resolution: UPHELD
    detail: |
      Confirmed across multiple sources:
      - Wikipedia s.v. Sargon of Akkad: "Azupiranu... situated on the
        banks of the Euphrates."
      - World History Encyclopedia: "Born in Azupirani on the
        Euphrates River bank."
      - Slightly Alive Translations: "My city is Azupiranu, which is
        situated on the banks of the Euphrates."
      - Intertextual.bible: "City: Azupiranu on the Euphrates".

      The chapter (line 97) notes Azupirānu is not securely
      identified with any historically attested site; this is the
      scholarly consensus.

      The "Saffron City" translation is also confirmed — *azupīrānu*
      relates to *azupīru* "saffron" / "crocus" in Akkadian.
      Supported.
  - flag_id: 6
    flag: "Aqqi (Akki) the water-drawer (*dāli*?) — verify name and role."
    resolution: UPHELD
    detail: |
      Confirmed across multiple sources:
      - Wikipedia s.v. Sargon of Akkad: "Akki the water-drawer"
        / "drawer of water"; rescued Sargon and raised him as
        gardener.
      - World History Encyclopedia: "Aqqi, the water drawer raised
        me as his adopted son and set me to his gardening".
      - Slightly Alive Translations: "Akki, a water-drawer".

      The Akkadian term *dālû* (the chapter uses *dāli* / *dālû*)
      is correct for "bucket" / "drawer of water"; the agentive
      sense ("the man who works the bucket / who draws water from
      the river") is standard. The chapter's etymological note (line
      127) "the verbal-aspect of the drawing-up that is
      etymologically reminiscent of his trade" is a defensible
      Akkadian-philological reading. Supported.
  - flag_id: 7
    flag: "Ištar's love granting kingship — verify the line in the legend."
    resolution: UPHELD
    detail: |
      Confirmed across multiple translations:
      - Wikipedia s.v. Sargon of Akkad: "Ishtar granted me her love,
        and for four and ... years I exercised kingship".
      - World History Encyclopedia: "Ishtar came to love me, and
        thus I reigned as king for fifty-four (?) years".
      - Slightly Alive Translations: "Ishtar grew fond of me" then
        kingship follows.

      The chapter (lines 146, 152) renders this as "Ištar granted
      me her love" — matching Foster 2005 and the standard
      translation. The years-of-reign figure is partly damaged in
      the witnesses (chapter line 152) — supported. The Akkadian
      noun *râmu* "love" is the standard term (the chapter cites
      this at line 146). Supported.
  - flag_id: 8
    flag: "Basket of reeds sealed with bitumen / pitch (*kupru*?) — verify Akkadian terms and imagery."
    resolution: UPHELD
    detail: |
      Confirmed:
      - Wikipedia: "a basket of rushes, with bitumen she sealed my
        lid".
      - Intertextual.bible: "She placed me in a reed basket, with
        bitumen she caulked my hatch."
      - World History Encyclopedia: "set me in a basket of rushes...
        cast me into the river".

      The chapter (line 109) renders this faithfully. The Akkadian
      term *kupru* "bitumen" is standard (cognate to Hebrew *kōfer*
      and to the *gōfer* of the ark of Noah / the *ḥemar* of Moses's
      basket in Exodus 2). The chapter does not introduce *kupru*
      explicitly in the body prose but the imagery is correct.
      Supported.
  - flag_id: 9
    flag: "Westenholz 1997 publication details — verify ISBN 9780931464850 and the pp. 36–49 reference."
    resolution: UPHELD
    detail: |
      Eisenbrauns catalogue page (WebFetch) confirms:
      - Westenholz, J.G., *Legends of the Kings of Akkade: The
        Texts*, Mesopotamian Civilizations 7 (Eisenbrauns, 1997).
      - ISBN 978-0-931464-85-0 (hardcover).
      - "Dr. Westenholz offers an annotated edition of all the
        known legends of the Akkadian kings... includes 'The Birth
        Legend of Sargon' and related texts, presented with
        transliteration, translation, and commentary."

      The pp. 36–49 page-range for the Birth Legend is the brief's
      locked anchor; it could not be directly verified from open-
      web mirrors (which gave only the table of contents). The
      page range is consistent with the standard breakdown of the
      Westenholz volume (which devotes ca. 10–15 pages each to the
      principal legends, with the Birth Legend as one of the
      earliest entries). Taken on trust per the brief.
  - flag_id: 10
    flag: "Otto Rank 1909 *Myth of the Birth of the Hero* — verify date and Sargon's place in Rank's typology."
    resolution: UPHELD
    detail: |
      Wikipedia s.v. *The Myth of the Birth of the Hero* (WebFetch)
      confirms:
      - "a 1909 book by Austrian psychoanalyst Otto Rank."
      - German title: *Der Mythus von der Geburt des Helden*.
      - Birth narratives analysed include "Sargon of Akkad, Moses,
        Karna, Oedipus, Paris, Telephos, Perseus, Dionysus,
        Gilgamesh, Cyrus the Great, Trakhan, Tristan, Romulus,
        Hercules, Jesus, Siegfried, Lohengrin, and Sceafa" —
        Sargon's place in the typology is confirmed.
      - Rank's pattern (distinguished parents → prophetic warning
        → exposure → surrender to water → rescue by animals or
        lowly people → recognition → greatness) is correctly
        characterised in the chapter's COMPARATIVE-HOOK (line 255).

      The chapter correctly uses the named-but-flagged pattern for
      Rank (footnote at line 237; mentioned in COMPARATIVE-HOOK at
      lines 255, 261; no EVIDENCE token, since Rank 1909 is not in
      sources.yaml). Supported.
  - flag_id: 11
    flag: "Brian Lewis 1980 *The Sargon Legend* (ASOR Dissertation Series 4) — verify publication."
    resolution: UPHELD
    detail: |
      Amazon / Open Library / Goodreads / abebooks (web search)
      confirm:
      - Lewis, Brian, *The Sargon Legend: A Study of the Akkadian
        Text and the Tale of the Hero Who Was Exposed at Birth*,
        American Schools of Oriental Research Dissertation Series
        no. 4 (1980).
      - 298 pp. ISBN 9780897571043 / 0897571045.
      - "An analysis of the Sargon legend... the text of the legend
        in Akkadian and English."

      The chapter's footnote at line 237 correctly cites this
