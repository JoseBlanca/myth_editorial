    q1_opened_or_skimmed: |
      I did NOT have direct access to the brief's locked principal
      anchors:
      - Westenholz 1997, *Legends of the Kings of Akkade: The Texts*,
        pp. 36–49 (definitive critical edition): Eisenbrauns/Penn
        State University Press; archive.org has a copy but the
        WebFetch returned only a table-of-contents stub. No readable
        in-text preview of pp. 36–49 was retrievable. The full
        critical-edition apparatus (manuscript dossier, line-by-line
        commentary, the cuneiform text, the alternative-readings
        catalogue) is therefore taken on trust per the brief.
      - Foster 2005, *Before the Muses*, 3rd ed., pp. 912–913: CDL
        Press paywalled; dokumen.pub mirror reports "website under
        maintenance"; no readable in-text preview accessible.
      - Foster 2007, *Akkadian Literature of the Late Period*,
        pp. 95–98: print-only; not directly opened.
      - Black & Green 1992 s.v. Sargon / Akkad / Ištar: paywalled;
        not directly opened.
      - Bottéro 2001 *Religion in Ancient Mesopotamia*: print-only;
        not directly opened.
      - Noegel 2005 pp. 233–245 *Mesopotamian Epic*: print-only;
        not directly opened.
      - Kvanvig 2011 *Primeval History*: Brill; paywalled; not
        directly opened.

      I DID independently verify the following via open web:
      (a) **Wikipedia s.v. Sargon of Akkad** (WebFetch). Confirmed:
          reign dates 2334–2279 BC (middle chronology); Birth Legend
          fragments "found in the Library of Ashurbanipal" at Nineveh
          (Neo-Assyrian 7th c. BCE); Azupiranu "situated on the banks
          of the Euphrates"; mother as priestess who bore him in
          secret; basket of rushes sealed with bitumen; Akki the
          water-drawer rescued and raised him as gardener; "Ishtar
          granted me her love, and for four and ... years I exercised
          kingship"; the autobiographical opening "Sargon, the mighty
          king, king of Akkad, am I"; "only the beginning of the text
          (the first two columns) is known, from the fragments of
          three manuscripts"; first fragments "discovered as early as
          1850".
      (b) **British Museum object K-3401** (web search). Confirmed:
          fragment of clay tablet with the Birth Legend of Sargon of
          Akkad from the Library of Ashurbanipal at Nineveh
          (Kouyunjik), Neo-Assyrian, 17 lines of inscription.
      (c) **Wikipedia s.v. The Myth of the Birth of the Hero**
          (WebFetch). Confirmed: Otto Rank 1909, *Der Mythus von der
          Geburt des Helden*; the typology includes Sargon of Akkad,
          Moses, Karna, Oedipus, Romulus, Cyrus the Great (alongside
          Paris, Telephos, Perseus, Dionysus, Gilgamesh, Tristan,
          Hercules, Jesus, Siegfried, Lohengrin, Sceafa). Rank's
          pattern (distinguished parents, prophecy, exposure,
          surrender to the water, rescue by animals or lowly people,
          eventual recognition and greatness) is correctly framed.
      (d) **Amazon / Open Library / abebooks listings for Brian
          Lewis 1980** (web search). Confirmed: *The Sargon Legend:
          A Study of the Akkadian Text and the Tale of the Hero Who
          Was Exposed at Birth*, ASOR Dissertation Series no. 4,
          1980, 298 pp., ISBN 9780897571043 / 0897571045 — the
          chapter cites this title correctly.
      (e) **Eisenbrauns catalogue page** (WebFetch). Confirmed:
          Westenholz 1997 *Legends of the Kings of Akkade: The
          Texts*, Mesopotamian Civilizations 7, ISBN 978-0-931464-
          85-0; "annotated edition of all the known legends of the
          Akkadian kings… includes 'The Birth Legend of Sargon' and
          related texts, presented with transliteration, translation,
          and commentary."
      (f) **Livius / intertextual.bible / Slightly Alive
          Translations (mostlydeadlanguages) / World History
          Encyclopedia / claireSulos** (WebFetch). Multiple
          independent translation mirrors and scholarly summaries.
          Confirmed motif-by-motif: high-priestess mother; unknown
          father; the "brother(s) of MY FATHER" loving the hills /
          highlands (NOT mother's brothers — see F-1 MEDIUM);
          Azupiranu / Azupirānu on the Euphrates; basket of rushes
          / wicker; bitumen seal; the river bearing him; Akki the
          water-drawer rescuing him; the gardener apprenticeship;
          Ishtar's love granting kingship; "four and ... years"
          (damaged figure); the conquest catalogue's partial
          preservation.
      (g) **Wikipedia s.v. Akkad (city)** (WebFetch). Confirmed:
          Akkad / Agade location is unknown; Sargon (2334–2279 BC);
          city has never been securely located despite extensive
          search.
      (h) **Tumblr Slightly Alive Translations (mostlydeadlanguages)
          notes** (WebFetch). The manuscript identifier CT 13 42-43
          is given for the principal manuscript; this is the
          publication-reference form for K.3401 (Cuneiform Texts
          from Babylonian Tablets in the British Museum vol. 13,
          plates 42-43).

    q2_triangulated_or_assumed: |
      Open-web triangulation performed on: Sargon's reign dates
      (middle chronology 2334–2279 BCE) [confirmed]; K.3401 as the
      principal manuscript at Aššurbanipal's library at Nineveh
      [confirmed]; the autobiographical opening "Sargon, mighty
      king, king of Akkad, am I" [confirmed]; the mother as
      high-priestess / *enitu* (also rendered "changeling" in older
      translations) [confirmed as the standard reading]; Azupiranu
      on the Euphrates [confirmed]; the basket of rushes sealed
      with bitumen [confirmed verbatim across translations]; Akki/
      Aqqi the water-drawer rescuing the infant [confirmed]; the
      gardener apprenticeship [confirmed]; Ishtar's love granting
      kingship [confirmed]; the years-of-reign figure damaged in
      the witnesses [confirmed: "four and ... years"]; "first two
      columns known from fragments of three manuscripts" [confirmed
      verbatim]; Akkad / Agade as Sargon's unlocated capital
      [confirmed]; Otto Rank 1909 and Brian Lewis 1980 references
      [confirmed]; Westenholz 1997 publication details (ISBN,
      Mesopotamian Civilizations 7, Eisenbrauns) [confirmed]; the
      Moses / Exodus 2 parallel as the most-discussed cross-
      cultural anchor [confirmed].

      Taken on trust (no direct primary access in this audit, but
      consistent with secondary triangulation):
      - Westenholz 1997's exact pagination (pp. 36–49 for the
        Birth Legend; pp. 38–40 for the autobiographical opening
        and the basket-and-river sequence; pp. 40–42 for the Aqqi-
        and-Sargon section; pp. 42–44 for Ištar's love and the
        rise; pp. 44–48 for the conquest catalogue): page ranges
        consistent with the brief's locked anchor and with the
        standard breakdown of the legend's narrative shape; cannot
        be directly verified from open-web mirrors of Westenholz
        1997.
      - Foster 2005's exact pagination (pp. 912–913): page range
        plausible for the back-of-volume placement of the Sargon
        legends in the 3rd-edition reorganisation.
      - Foster 2007 pp. 95–98 (Sargon legends in the late
        tradition): consistent with the brief's locked anchor.
      - Black & Green 1992 s.v. Sargon / Akkad / Ištar entries:
        deity-handbook coverage consistent with the brief.
      - Bottéro 2001 passim on royal-legend tradition.
      - Noegel 2005 pp. 233–245 on the *narû* genre in the
        Akkadian narrative corpus.
      - Kvanvig 2011 on the Babylonian-biblical intertextual
        parallels.

    q3_real_quote_or_pattern_match: |
      For SUPPORTED verdicts: pattern-matched against Wikipedia s.v.
      Sargon of Akkad (verbatim autobiography excerpts); British
      Museum K.3401 catalogue entry; CT 13 42-43 publication
      reference (Cuneiform Texts vol. 13 pls. 42-43); Slightly Alive
      Translations / mostlydeadlanguages full translation; World
      History Encyclopedia full translation; intertextual.bible
      translation; Otto Rank 1909 Wikipedia article (typology
      confirmed); Brian Lewis 1980 Amazon / ASOR listing (citation
      confirmed); Eisenbrauns catalogue page for Westenholz 1997
      (ISBN confirmed). The Akkadian terms used in the chapter
      (*enitu*, *râmu*, *nukaribbu*, *dāli*, *dālû*, *kupru*) are
      standard Akkadian forms; *enitu* / *enītu* is the Akkadian
      for "high priestess" (a Sumerian loanword EN.NIN > enītu);
      *nukaribbu* is the Akkadian for "gardener"; *dālû* is the
      Akkadian for "drawer of water" / "bucket". No fabricated
      Akkadian terms detected.

      ONE TRANSLATION ISSUE detected: the chapter (line 91) renders
      the legend's line about the "brothers" as referring to the
      MOTHER'S brothers (maternal uncles), citing Westenholz 1997
      for the reading. But the standard scholarly translation
      across multiple sources (ANET / Speiser; Foster 2005; World
      History Encyclopedia; intertextual.bible; mostlydeadlanguages
      / Slightly Alive Translations) is "the brother(s) of MY
      FATHER" — i.e., PATERNAL uncles, NOT maternal. Even Slightly
      Alive Translations notes the line "literally means 'my
      father's brother'", noting the puzzling element given the
      claim of unknown father. The chapter's "mother's brothers /
      Sargon's maternal uncles" framing inverts the standard
      reading. This is a MEDIUM finding (F-1).

    q4_internal_variance_vs_contamination: |
      Yes. The chapter is SINGLE-PREVALENT per the brief; minor
      variants among the duplicate witnesses are flagged at the
      [VARIANT:] marker (line 216) and the substantive narrative is
      stable. The closing material's loss is flagged at the
