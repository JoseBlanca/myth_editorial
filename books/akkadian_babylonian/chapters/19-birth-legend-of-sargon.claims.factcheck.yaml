findings:
  - finding_id: F-1
    claim_number: 7
    location: "line 91 (parentage section, body) and line 92 (EVIDENCE pointer): 'The mother's brothers — Sargon's maternal uncles — are said to love the hills; the phrasing has been variously interpreted, but Westenholz 1997 reads it as locating the maternal family among the highland populations of upper Mesopotamia.'"
    kind: FACTUAL-ERROR
    severity: MEDIUM
    claim: "The legend's hill-loving brothers are the mother's brothers / maternal uncles."
    issue: |
      The standard scholarly translation of the legend's line about
      the brothers is "the brother(s) of MY FATHER" (PATERNAL uncles),
      NOT "the mother's brothers" / "maternal uncles" as the chapter
      states.

      Cross-translation evidence:
      (a) ANET (Speiser): "the brother of my father" (paternal).
      (b) World History Encyclopedia: "The brother(s) of my father
          loved the hills" (paternal).
      (c) Intertextual.bible (cites scholarworks.calstate.edu):
          similar phrasing (paternal).
      (d) Slightly Alive Translations / mostlydeadlanguages: "kin
          live in the highlands" with explicit note that the line
          "literally means 'my father's brother'"; the translator
          notes the paradox (Sargon claims unknown father yet
          knows of paternal uncles, suggesting either a textual
          puzzle or that the absent father is known by family
          context but not personally to the speaker).
      (e) Multiple other translations: consistently paternal.

      The chapter's "mother's brothers / maternal uncles" framing
      INVERTS the standard reading. The chapter then attributes the
      reading to Westenholz 1997 ("Westenholz 1997 reads it as
      locating the maternal family among the highland populations of
      upper Mesopotamia"). Without direct access to Westenholz 1997
      I cannot confirm whether Westenholz proposes an alternative
      reading that does involve the maternal family, but the
      mainstream rendering across multiple translation mirrors is
      PATERNAL. If Westenholz does propose a maternal reading, the
      chapter should clarify that this is Westenholz's own
      reinterpretation against the older standard rendering. If
      Westenholz reads "father's brothers" like everyone else, the
      chapter's framing is simply wrong.

      This is a MEDIUM finding because:
      (i) the line is a specific load-bearing factual claim about
          the legend's content;
      (ii) the chapter attributes its non-standard reading to
           Westenholz 1997, raising a citation-integrity concern;
      (iii) the "highland populations of upper Mesopotamia" framing
            (whether the brothers are paternal or maternal) is
            interpretive and only the kinship-side issue is fact-
            checkable from open-web triangulation.

      Not HIGH because: (a) the line itself is preserved across
      witnesses, and the chapter does cite the highlands setting
      correctly; (b) the kinship-side issue may be resolved by
      consulting Westenholz 1997 directly at human review.
    evidence: |
      Wikipedia s.v. Sargon of Akkad (WebFetch); World History
      Encyclopedia's quoted translation; Slightly Alive Translations
      (mostlydeadlanguages, CT 13 42-43): all read "brother(s) of
      MY FATHER" / "my father's brother" — paternal kinship.
    recommended_fix: |
      At line 91, replace "The mother's brothers — Sargon's maternal
      uncles — are said to love the hills" with "The brothers of
      Sargon's father — his paternal uncles — are said to love the
      hills" (matching the standard rendering across ANET, Foster
      2005, mostlydeadlanguages, World History Encyclopedia). Then
      cite Westenholz 1997's specific reading (whether it follows
      the paternal-kinship standard or proposes a maternal
      alternative) at line 91's footnote. If Westenholz does
      propose a maternal-kin reading, the chapter should note that
      this is a Westenholz-specific interpretation against the older
      standard (Speiser/ANET) reading. If Westenholz follows the
      paternal-kin standard, the chapter's "mother's brothers"
      framing is simply an error and should be corrected to
      "father's brothers". A safe interim fix is to use the
      paternal-kin rendering and note the paradox (the speaker
      claims unknown father yet knows of paternal uncles, which
      Westenholz 1997 treats with comment); the highland-population
      framing can stand for either reading.

  - finding_id: F-2
    claim_number: 2
    location: "line 50 (source overview, body), line 57 (paragraph 2 body), line 80 (LACUNA marker), line 82 (RECONSTRUCTION marker), line 216 (VARIANT marker)"
    kind: UNVERIFIED
    severity: MEDIUM
    claim: "K.3401 (Neo-Assyrian) + at least two Neo-Babylonian duplicate manuscripts."
    issue: |
      The chapter's specific framing of the manuscript dossier as
      "K.3401 (Neo-Assyrian) + at least two Neo-Babylonian duplicate
      manuscripts" needs verification. Open-web triangulation
      confirms:
      (a) K.3401 is the principal manuscript, Neo-Assyrian, from
          Aššurbanipal's library at Nineveh (British Museum K-3401
          catalogue entry) [confirmed].
      (b) "Only the beginning of the text (the first two columns)
          is known, from the fragments of three manuscripts"
          (Wikipedia s.v. Sargon of Akkad) [confirmed: three
          manuscripts].

      HOWEVER — the specific provenance of the other two manuscripts
      is NOT directly attested in the open-web triangulation. Two
      conflicting reports were found:
      (i) Wikipedia and several derivative sources do not specify the
          provenance of the non-K.3401 manuscripts; the implication
          (since they are referenced from Aššurbanipal's library
          coverage) is that all three are Neo-Assyrian.
      (ii) One source (a web-search summary citing scholarship on
           the legend's transmission) reported "four fragmentary
           tablets — three Neo-Assyrian and one Neo-Babylonian" —
           a different breakdown that suggests the duplicates may
           include both Neo-Assyrian and Neo-Babylonian witnesses
           rather than two Neo-Babylonian alone.

      The chapter's framing (one NA + two NB) is plausible and may
      reflect Westenholz 1997's specific manuscript inventory, but
      cannot be directly verified from open-web sources. The brief
      itself (line 27, lacunae block) refers to "K.3401 + duplicates"
      without specifying the provenance of the duplicates; the
      "Neo-Babylonian duplicate manuscripts" specification appears
      to have been introduced by the chapter writer.

      This is MEDIUM (not HIGH or LOW) because:
      (i) the principal manuscript (K.3401) is correct;
      (ii) the "three manuscripts" framing is correct;
      (iii) the chapter explicitly grounds the framing in
            Westenholz 1997 (citation integrity is preserved if
            Westenholz does specify the provenances as the chapter
            claims);
      (iv) but the specific NA-vs-NB breakdown is a factual claim
           that should be verified against Westenholz 1997 directly
           at human review.

      If Westenholz 1997 confirms one NA + two NB, the chapter is
      correct. If Westenholz 1997 specifies three NA (or three NA
      + one NB, or some other configuration), the chapter needs
      correction.
    evidence: |
      Wikipedia s.v. Sargon of Akkad (WebFetch): "Only the beginning
      of the text (the first two columns) is known, from the
      fragments of three manuscripts" — no provenance breakdown.
      British Museum K-3401 catalogue: confirms K.3401 only.
      Conflicting web-search report of "three Neo-Assyrian and one
      Neo-Babylonian" (four total).
    recommended_fix: |
      Verify against Westenholz 1997 pp. 36-37 (manuscript dossier
      section) at human review. If the dossier is in fact 1 NA +
      2 NB, retain the chapter's framing. If the dossier is 3 NA
      or 3 NA + 1 NB or another configuration, correct the
      "Neo-Babylonian duplicates" specification at line 50, 57, 80,
      82, 216 to match Westenholz 1997's actual inventory. The
      "three principal manuscript fragments" framing at lines 11–
      12, 57, 80 is supported and can stand. Alternative safe
      framing: "K.3401 (Neo-Assyrian, from Aššurbanipal's library)
      together with two further first-millennium duplicate
      manuscripts" — which preserves the three-manuscript count
      and the K.3401-as-principal designation without committing
      to the NB provenance of the duplicates pending direct
      verification.

  - finding_id: F-3
    claim_number: 20
    location: "line 50 (source overview), line 62 (paragraph 3), line 187 (legendary-tradition paragraph), line 232 (closing-position paragraph)"
    kind: HEDGING-NEEDED
    severity: LOW
    claim: "The Birth Legend is a 'first-millennium literary composition' that grew on the historical foundation; positioned at the late end of the layered tradition."
    issue: |
      The chapter consistently describes the *Birth Legend* as "a
      first-millennium literary composition" and a "fully literary
      elaboration rather than a contemporary record." The manuscript
      attestation (Neo-Assyrian K.3401 and Neo-Babylonian duplicates,
      7th c. BCE and following) is securely first-millennium and
      this part is correct.

      HOWEVER — there is a longstanding scholarly debate about the
      DATE OF COMPOSITION of the legend itself (distinct from the
      date of the surviving manuscripts). Some scholars (e.g., Brian
      Lewis 1980, building on earlier proposals) date the
      composition to the Neo-Assyrian period and link it to Sargon
      II's reign (722–705 BCE) as propaganda for the namesake king.
      Other scholars place the underlying composition earlier — Old
      Babylonian (early second millennium BCE) literary roots are
      possible — with the first-millennium manuscripts as the late
      transmission of an older composition.

      The web search summary "the text is most likely composed
      circa 2300 BCE" (a popular but unsupported claim, likely
      conflating the date of the historical Sargon with the date
      of the composition) and "the Sargon Birth Legend was likely
      compiled in the Neo-Assyrian period... reinterpretation as
      propaganda for Sargon II's legitimacy" indicate that the
      composition-date question is genuinely contested.

      The chapter's framing is defensible — "first-millennium
      literary composition" is the conservative position when the
      manuscript attestation is securely first-millennium and the
      underlying composition's date is debated. But the chapter
      could benefit from a brief hedge acknowledging that some
      scholars locate the composition earlier (Old Babylonian
      literary tradition with first-millennium curation) vs. later
      (a Sargon-II-period propaganda piece). The current "fully
      literary elaboration" framing reads as if the composition
      itself is uncontroversially first-millennium, which somewhat
      overstates the scholarly consensus.

      This is LOW (not MEDIUM) because:
      (i) the manuscript attestation is securely first-millennium
          and is what the chapter principally anchors to;
      (ii) the "first-millennium" composition framing is
           defensible as a manuscript-date-floor framing;
      (iii) the debate about earlier composition-roots is a
            scholarly subtlety, not a clear factual error.
    evidence: |
      Web-search summary of Sargon Birth Legend composition-date
      scholarship: "the Sargon Birth Legend was likely compiled in
      the Neo-Assyrian period, suggesting later reinterpretation as
      propaganda for Sargon II's legitimacy". Brian Lewis 1980
      (ASOR Diss. Series 4) is the principal monograph treatment
      of the composition-date question. Foster 2007 *Akkadian
      Literature of the Late Period* situates the legend in the
      late-period tradition.
    recommended_fix: |
      Optional refinement at line 187 (or line 232): add a brief
      hedge — e.g., "the *Birth Legend*'s underlying composition is
      dated by some scholars to the Neo-Assyrian period (linked to
      Sargon II's reign 722–705 BCE) and by others to an earlier
      literary tradition curated and transmitted in the first
      millennium." This sharpens the chapter's "first-millennium
      composition" framing as the conservative manuscript-attestation
      floor rather than a settled composition-date claim. Not a
      factual fix; a precision improvement.

