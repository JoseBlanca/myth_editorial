  - flag_id: 12
    flag: "Moses / Exodus 2 parallel — the basket / bitumen / river / rescue / royal rise motif — verify the parallel is correctly described as the most-discussed cross-cultural anchor."
    resolution: UPHELD
    detail: |
      Confirmed across multiple sources:
      - Wikipedia s.v. Sargon of Akkad: notes "similar exposure-and-
