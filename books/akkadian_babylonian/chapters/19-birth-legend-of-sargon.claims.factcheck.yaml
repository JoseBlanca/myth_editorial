supported_claims:
  - claim_number: 1
    claim: "The Birth Legend of Sargon is an Akkadian pseudo-autobiographical composition; Sargon of Akkad (Šarru-kīn, 'the king is true') is the speaker; founder of the Akkadian Empire ca. 2334–2279 BCE."
    source_id: westenholz-1997
    source_loc: "pp. 36–49 (introduction; historical Sargon)"
    verbatim_quote: |
      Wikipedia s.v. Sargon of Akkad confirms reign dates 2334–2279
      BC (middle chronology); the legend's autobiographical form is
      standard across the secondary literature. Supported.

  - claim_number: 2
    claim: "The principal manuscript is K.3401, a Neo-Assyrian tablet from Aššurbanipal's library at Nineveh (7th c. BCE), supplemented by Neo-Babylonian duplicates."
    source_id: westenholz-1997
    source_loc: "pp. 36–49 (manuscript dossier)"
    verbatim_quote: |
      British Museum K-3401 (web search): "fragment of clay tablet
      containing a legend concerning Sargon I... Neo-Assyrian in
      date... from the Library of Ashurbanipal" at Nineveh
      (Kouyunjik). The "K-" prefix designates the Kouyunjik
      collection. Wikipedia s.v. Sargon of Akkad: fragments "found
      in the Library of Ashurbanipal". The "supplemented by Neo-
      Babylonian duplicates" specifics need verification (see F-2
      MEDIUM); the K.3401-as-principal claim is supported.

  - claim_number: 3
    claim: "Only the first two columns of the composition (autobiographical opening + opening of conquest catalogue) are substantively preserved across three principal manuscript fragments."
    source_id: westenholz-1997
    source_loc: "pp. 36–49"
    verbatim_quote: |
      Wikipedia s.v. Sargon of Akkad: "Only the beginning of the
      text (the first two columns) is known, from the fragments of
      three manuscripts." Verbatim confirmation of the "first two
      columns" and "three manuscripts" specifications.

