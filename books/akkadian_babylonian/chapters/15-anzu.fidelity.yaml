f1_through_f6_resolution_check:
  status: PASS
  notes: |
    All six round-1-BLOCK / round-2-PASS findings from the
    factcheck cycle carry through into the chapter-draft body
    prose correctly:

    - F-1 (SB Anzû on THREE tablets — Tablet I, II, III —
      not two; SB-vs-OB framed in terms of LENGTH not tablet
      count). Body prose preserves "three tablets" at every
      SB-tablet-count occurrence: draft line 4 ("a Standard
      Babylonian recension of the first millennium BCE, also
      on three tablets — Tablet I, Tablet II, Tablet III in
      Annus 2001's SAACT 3 critical edition"), draft line 16
      ("Its three tablets — Tablet I, Tablet II, Tablet III
      in Annus 2001's SAACT 3 — run at greater length than
      the OB recension on the same frame"), draft line 36
      ("the SB recension being more expansive on the same
      three-tablet frame"), draft line 188 (VARIANT block:
      "three-tablet structure (Tablet I, Tablet II, Tablet
      III per Annus 2001 SAACT 3 ToC)"), draft line 190
      ("the SB recension's structure across three tablets").
      The SB-vs-OB comparison is consistently reframed in
      terms of LENGTH, not tablet count: draft line 4
      ("longer and more elaborated than the OB; the
      recensional difference is one of literary expansion
      and theological consolidation, not of tablet count"),
      36 ("the SB recension being more expansive on the
      same three-tablet frame as the OB"), 188 ("longer
      and more elaborated than the OB recension on the same
      three-tablet frame"), 190 ("The structural skeleton
      is shared; the recensional differences are differences
      of length, elaboration, and the warrior's name").

    - F-2 (SB candidate-search canonical sequence
      Adad → Gerra/Gibil → Šara). Body prose narrates the
      three named refusers in order:
      - Adad (first refuser) at draft line 94: "Adad — the
        storm-god, lord of thunder and the rains that bring
        or break the harvest, here cast as the canal-
        controller — is approached first and declines";
      - Gerra/Gibil (second refuser) at draft line 99:
        "Gerra (also spelled Girra or Gibil) — the fire-god
        — is approached second and likewise declines";
      - Šara (third refuser, son of Ištar) at draft line
        104: "Šara — a warrior-god of the pantheon, son of
        Ištar — is approached third and likewise declines.
        The canonical SB candidate-search sequence is thus
        Adad → Gerra/Gibil → Šara: three named refusers";
      - Ea proposes Ninurta after the three named refusers
        at draft line 109.
      The VARIANT block at draft line 188 and the variants
      paragraph at draft line 190 both name the canonical
      "Adad → Gerra/Gibil → Šara" sequence explicitly.

    - F-3 (Susa-only OB literary witnesses; Tell Asmar
      quarantined to iconography paragraph). Body prose
      lists OB literary witnesses as Susa-only at every
      occurrence: draft line 4 (source overview), 10 (OB
      paragraph: "Susa manuscripts — Sb 9470 (= OB Anzu II)
      and Sb 14683 (= OB Anzu III), both held at the
      Louvre"), 28 (LACUNA: same), 32 (RECONSTRUCTION:
      "OB Susa manuscripts (Sb 9470, Sb 14683)"), 80
      (RECONSTRUCTION: "Sb 14683, Louvre"), 188 (VARIANT:
