      (geographic spread paragraph: "The OB Susa witnesses
      (Sb 9470, Sb 14683, both Louvre)"). Tell Asmar
      appears ONLY at draft line 181 in the iconography
      paragraph as the Early Dynastic statue-base
      iconographic precursor, explicitly flagged: "An
      early-dynastic iconographic precursor of the
      storm-bird is preserved on the Tell Asmar Hoard
      statue from Eshnunna, where a small Anzû bird is
      carved on the base of a human eye-statue — a
      third-millennium iconographic witness, not a
      literary tablet of the epic."

    - F-4 (Ningirsu / Ninurta as originally distinct cult-
      centre deities syncretized by Gudea per Black &
      Green 1992; Assyriologists-divided hedge explicit;
      SB substitution as cult-political shift not mere
      rename). Body prose preserves the full framing at
      every occurrence:
      - draft line 42 (methodological-note paragraph):
        "Ningirsu (the Lagash war-god) and Ninurta (the
        Nippur war-god, warrior-son of Enlil) are treated
        by Black & Green 1992 as originally distinct
        cult-centre deities, syncretized by the time of
        Gudea (late third millennium) into a documented
        identification of Ningirsu as a 'local hypostasis'
        of Ninurta. Whether the two were originally
        manifestations of a single warrior-god or two
        distinct deities subsequently merged is a question
        on which Assyriologists remain divided; Black &
        Green lean toward two-deities-in-origin, while
        other scholars read them as a single warrior-figure
        under local names. The SB recension's substitution
        of Ninurta for Ningirsu reflects the first-
        millennium cosmopolitan consolidation of the
        warrior-god identity under the Nippur-centred name
        — a cult-political shift, not a mere rename —
