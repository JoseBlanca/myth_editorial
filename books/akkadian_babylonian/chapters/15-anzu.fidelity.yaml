    q2_every_paragraph_checked_for_additions: |
      Yes — every body paragraph in the draft (lines 4, 10, 16,
      22, 36, 42, 50, 55, 60, 65, 70, 75, 84, 89, 94, 99, 104,
      109, 115, 123, 130, 139, 146, 154, 159, 165, 175, 181, 190,
