      - Sharur full-gloss "(*Šaruru*), the sentient war-mace of
        the warrior-hero" at line 123 (new ch15 ledger entry);
      - Tiamat reminder-gloss "the primordial saltwater chaos-
        figure" at line 165 (last full mention chapter 06, 9
        chapters back).
      All licensed by the gloss-ledger entries and documented in
      the writer's gloss_decisions; the Ea claim-paragraph at
      claims line 195 ("Ea — god of wisdom, the freshwater
      *Apsû*, and incantation, patron of craft and cunning,
      father of Marduk —") is BARE in draft line 109 ("Ea
      proposes the solution. Ea's role as adviser-of-strategy
      in *Anzû* parallels his role in *Nergal and Ereškigal*
