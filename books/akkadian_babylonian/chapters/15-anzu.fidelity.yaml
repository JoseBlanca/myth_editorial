    q3_distortion_meaning_check: |
      Compared at the level of precise meaning, not topic. The
      composition's narrative arc — OB-vs-SB three-tablet
      recensional frame; OB Susa-only witnesses (Sb 9470 / Sb
      14683, both Louvre); SB Nineveh / Sultantepe / Tarbiṣu /
      Aššur witnesses; co-equal methodological note; OB
      recension narrated with Ningirsu as hero (assembly →
      bath-theft → decree-suspension → candidate-search →
      Ningirsu identified → partly-damaged combat-climax); SB
      recension narrated with Ninurta as hero (elaborated
      divine-council frame → same bath-theft → canonical Adad
      → Gerra/Gibil → Šara refusal sequence → Ea proposes
      Ninurta → Bēlet-ilī/Mami maternal commission → Sharur
      the sentient mace and his messenger role → first combat
      with Anzû's decree-reversal of weapons → Ea's south-wind-
      and-pinions counter-strategy → second combat killing-blow
      → cosmic-order restoration → SB closing hymnic litany of
      Ninurta's names with fifty-names hedge); ritual context
      (theogonic / cosmological / royal-legitimation functions
      + iconography on Neo-Assyrian reliefs and Tell Asmar
      Hoard statue as Early Dynastic iconographic precursor);
      variants section comparing the shared skeleton; place-in-
      the-corpus closing on the *Anzû* / *Enūma Eliš* paired
      combat-myth dossier and the geographic-chronological
      spread — is preserved beat-for-beat. All six round-1-
      BLOCK / round-2-PASS findings carry through to the draft.
      F-1 (SB three tablets — Tablet I, II, III): preserved at
      draft lines 4 (source overview), 16 (SB witnesses
      paragraph), 188 (VARIANT block), 190 (variants
      comparison). The SB-vs-OB comparison is consistently
      reframed in terms of LENGTH (SB longer; OB shorter), not
      tablet count, at draft lines 4 ("longer and more
      elaborated than the OB; the recensional difference is
      one of literary expansion and theological consolidation,
      not of tablet count"), 16 ("Its three tablets...run at
      greater length than the OB recension on the same frame"),
      36, 188, 190. F-2 (Adad → Gerra/Gibil → Šara canonical
      sequence): preserved at draft lines 94 (Adad first
      refuser), 99 (Gerra/Gibil second refuser), 104 (Šara
      third refuser, son of Ištar), 109 (Ea identifies Ninurta
      after the three named refusers), 188 (VARIANT block),
      190 (variants comparison). F-3 (Susa-only OB witnesses;
      Tell Asmar quarantined to iconography paragraph):
      preserved at draft lines 4 (Sb 9470, Sb 14683), 10 (Susa
      manuscripts, both Louvre), 28 (LACUNA Sb 9470/14683),
      32 (RECONSTRUCTION Susa manuscripts), 80 (RECONSTRUCTION
      Sb 14683), 188 (VARIANT Susa manuscripts only), 210
      (geographic spread Susa). Tell Asmar appears ONLY at
      draft line 181 in the iconography paragraph as the Early
      Dynastic statue-base iconographic precursor, explicitly
      flagged as "a third-millennium iconographic witness, not
      a literary tablet of the epic". F-4 (Ningirsu/Ninurta
      distinct cult-centre deities syncretized; Assyriologists-
      divided hedge explicit): preserved at draft lines 42
      (methodological-note paragraph: "Black & Green 1992 as
      originally distinct cult-centre deities, syncretized by
      the time of Gudea (late third millennium)... Whether the
      two were originally manifestations of a single warrior-
      god or two distinct deities subsequently merged is a
      question on which Assyriologists remain divided; Black
      & Green lean toward two-deities-in-origin, while other
      scholars read them as a single warrior-figure under
      local names. The SB recension's substitution... reflects
      the first-millennium cosmopolitan consolidation... a
      cult-political shift, not a mere rename — regardless of
      how the underlying identity question is resolved") and
      196 (variants-section repetition with the same hedge).
      The COMPARATIVE-HOOK at line 217 also preserves the
      "cult-political syncretism of originally distinct cult-
      centre deities (Lagash and Nippur), not as a mere local-
      name change" framing. F-5 (fifty-names hedged): preserved
      at draft lines 165 ("Whether the SB Anzû closing hymn
      formally enumerates exactly fifty names is not securely
      established in the surviving text; the structural
      parallel to the *Enūma Eliš* fifty-names finale is the
      load-bearing observation"), 171 (INFERENCE marker: "The
      exact count 'fifty' for the SB Anzû closing litany is
      not securely established in the surviving text and is
      hedged in the body"), 204 ("a litany of Ninurta's names
      and epithets in the SB *Anzû* paralleling that structure,
      with the exact count for SB Anzû not securely
      established"). F-6 (OB Sharur attestation fragmentary;
      Lugal-e comparative framing foregrounded in Sumerian
      COMPARATIVE-HOOK): preserved at draft lines 123 ("A
      distinctive feature of the SB recension — and
      fragmentarily attested in the OB recension per Vogelzang
      1988 — is Sharur..."), 135 (INFERENCE basis: "the OB
      Sharur attestation is fragmentary per Vogelzang 1988"),
      218 (Sumerian COMPARATIVE-HOOK: "The sentient war-mace
      Sharur is more prominent in *Lugal-e* (where the mace's
      role is foregrounded as Ninurta's encourager-to-battle)
      than in the Akkadian *Anzû* (where Sharur's role is
      concentrated in the messenger-to-Ea episode)"). Co-equal
      recensional handling is consistently maintained: both
      recensions narrated separately and each attributed to
      its source. Epistemic posture preserved: the two
      INFERENCE-flagged readings (Sharur as Marduk's-bow
      Akkadian-internal comparand + older-Mesopotamian-
      tradition framing with Lugal-e cross-reference; SB
      closing-litany as Enūma-Eliš-shared-scribal-milieu
      framing with fifty-names hedge) are NOT promoted to
      flat body-prose assertion — the body framing of these
      moves restates the claim-doc body framing while the
      deeper interpretive reading is kept inside the INFERENCE
      blocks.

