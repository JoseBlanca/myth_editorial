round1_finding_resolutions:
  - finding_id: F-1
    round1_severity: HIGH
    round1_kind: CONTAMINATION
    round1_issue: |
      Round-1 claims document framed *The First Brick* as
      Marduk-centred (section §"Marduk as divine architect"); the
      composition is in fact Ea-centred per three independent
      Wikipedia summaries footnoted to Lambert 2013 pp. 376–381.
    round2_status: RESOLVED
    round2_evidence: |
      The round-2 claims document at lines 41, 71–73, 78, 85–108
      consistently foregrounds Ea as the principal creator deity.
      Section structure is now §"Ea creates the freshwater deep"
      (line 71) and §"Ea fashions the craft-pantheon from clay"
      (line 85); there is no §"Marduk as divine architect" section.
      Marduk appears only (a) in Ea's first-mention gloss as "father
      of Marduk" (line 73; permitted per locked Ea glossary entry),
      (b) in the explicit absence statement "Marduk is not named in
      the surviving narrative of *The First Brick*; the composition
      belongs to the dossier's Ea-centred minority register" (line
      78), and (c) in comparative observations about other dossier
      compositions (lines 78, 137, 144, 148, 155–156). The round-2
      brief's entities_glossary at lines 109–124 has been
      re-anchored: Ea principal, Kulla and the seventeen-deity
      craft pantheon as the wider cast, Marduk not listed as a
      participant.

  - finding_id: F-2
    round1_severity: HIGH
    round1_kind: CITATION-WRONG
    round1_issue: |
      Round-1 claims document described the composition as preserved
      on a "single late-Babylonian manuscript with no parallels";
      the composition is in fact preserved on multiple Late
      Babylonian tablets (principally WVDOG 4 plate 12, with "etc."
      per Streck 2014) plus a late Assyrian fragment.
    round2_status: RESOLVED
    round2_evidence: |
      The round-2 claims document at lines 51, 54, 56, 126, 128
      consistently describes the witnesses as "multiple Late
      Babylonian witnesses, principally on the cuneiform tablet
      published as WVDOG 4 plate 12 ... with additional Late
      Babylonian tablets that Streck's 2014 review of Lambert 2013
      records summarily as 'etc.' A late Assyrian fragment is also
      attested." Streck 2014 is named-but-flagged at lines 44, 51,
      and 128 with the BSOAS 77 (2014) 371–372 citation. The LACUNA
      marker at line 54 reflects the multi-witness reality:
      "Multiple Late Babylonian witnesses (principally WVDOG 4 plate
      12, with additional Late Babylonian tablets per Streck 2014's
      'etc.') plus a late Assyrian fragment." The RECONSTRUCTION
      marker at line 56 invokes "cross-witness joining among the
      multiple Late Babylonian witnesses and the Assyrian fragment"
      and revises the confidence to "medium — multi-witness control
      is better than single-witness restoration". The VARIANT
      marker at line 126 retains single-prevalent classification on
      the duplicate-vs-recensional rationale per round-1 finding
      F-2 recommended fix. WVDOG 4 plate 12 is now cited (round-1
      F-7 also resolved at this stage).

  - finding_id: F-3
    round1_severity: HIGH
    round1_kind: CITATION-WRONG
    round1_issue: |
      Round-1 claims document framed the ritual context as new-temple
      foundation; the composition is in fact a temple-RENOVATION
      incantation, with the libittu maḫrītu being the brick recovered
      from the existing temple.
    round2_status: RESOLVED
    round2_evidence: |
      The round-2 claims document at lines 41, 58–69, 113–122
      consistently describes the ritual context as temple
      RENOVATION. Section heading at line 58 is now "Setting: temple
      renovation and the *libittu maḫrītu*". Line 60 explicitly
      states: "Babylonian temple-renovation rites required the
      recovery of the *libittu maḫrītu* — literally 'the first/former
      brick' — from the structure of the existing temple before its
      rebuilding. The recovered brick was preserved through the
      rebuilding process and reset into the new structure as a
      continuity-marker between the old and new temples." Line 120
      provides the corrected lexical reading: "the *libittu
      maḫrītu* is 'first' not because it inaugurates a new building
      but because it is the original brick of the old building,
      preserved through its reuse." This matches Novotny verbatim:
      "the libittu mañrîtu (here 'former brick'). The removal of
      this brick initiated the rebuilding process and served as a
      bridge between the old and new temples." Novotny is
      named-but-flagged at line 60 with the AOAT 366 citation.

  - finding_id: F-4
    round1_severity: MEDIUM
    round1_kind: UNVERIFIED
    round1_issue: |
      The §"The ušumgallu attribute and the foundation register"
      section of the round-1 claims document, and its associated
      INFERENCE marker, asserted that *ušumgallu* appears in *The
      First Brick* / Lambert 2013 ch. 33; this attestation could
      not be corroborated by any open source.
    round2_status: RESOLVED
    round2_evidence: |
      The string "ušumgallu" does not appear anywhere in the
      round-2 claims document. The §"The ušumgallu attribute and
      the foundation register" section is removed entirely, and the
      associated INFERENCE marker is gone. The brief's
      entities_glossary (round-2-revised) does not list ušumgallu.
      The R2-5 revision in the brief header explicitly documents
      this removal: "ušumgallu attribute: REMOVED from the entities
      glossary — no accessible independent source confirms its
      presence in Lambert 2013 chapter 33." Round-1 F-4 fully
      addressed; the safer course (omission pending direct Lambert
      2013 verification) is taken.

  - finding_id: F-5
    round1_severity: MEDIUM
    round1_kind: INFERENCE-OVER-EXTENDS
    round1_issue: |
      Round-1's architectural-cosmogony sub-corpus framing (pairing
      *First Brick* with *Toil of Babylon* and *Founding of Eridu*)
      did not adequately flag the divine-actor mismatch — *First
      Brick* is Ea-centred while the other two are Marduk-centred.
    round2_status: RESOLVED
    round2_evidence: |
      The round-2 claims document at line 78 explicitly states:
      "Where *Enūma Eliš* (chapter 1), *Enmešarra's Defeat* (chapter
      6), the *Toil of Babylon* (chapter 7), *Uraš and Marduk*
      (chapter 8), *Damkina's Bond* (chapter 9), and *The Founding
      of Eridu* (chapter 10) are Marduk-centred, *The First Brick*
      foregrounds Ea as the principal creator deity." The
      COMPARATIVE-HOOK at line 155 explicitly notes the
      divine-actor mismatch: "the principal divine actors and ritual
      contexts differ: *The Founding of Eridu* is a Marduk-centred
      city-and-rivers foundation cosmogony for a temple-incantation;
      *The Toil of Babylon* is a Marduk-centred labour-rebellion /
      divine-alienation composition; *The First Brick* is an
      Ea-centred craft-pantheon-creation composition for
      temple-renovation incantation. The editorial grouping
      reflects modern thematic categorisation, not ancient
      compositional intent or divine-actor coherence." The closing
      reflection's INFERENCE marker at line 153 also explicitly
      handles the dossier-diversity framing in a way that does not
      assimilate *The First Brick* to a Marduk-centred whole. F-5
      RESOLVED.

  - finding_id: F-6
    round1_severity: LOW
    round1_kind: PRECISION
    round1_issue: |
      Round-1 chapter glossed bare *libittu* via CAD L; the
      technical foundation/renovation-ritual lemma is *libittu
      maḫrītu* (CAD L plus CAD M/I s.v. maḫrû).
    round2_status: RESOLVED
    round2_evidence: |
      The round-2 claims document at line 120 cites the technical
      phrase libittu maḫrītu and provides explicit lexical
      commentary: "The Akkadian common noun *libittu* — 'brick' —
      is the underlying lexical term; the technical
      foundation/renovation phrase used in the composition and in
      the parallel royal-inscription rites is *libittu maḫrītu*
      ('first/former brick'). The qualifier *maḫrītu* (from *maḫrû*
      'first, former, prior') marks the brick as the original brick
      of the existing temple". The associated footnote cites both
      CAD L s.v. libittu AND CAD M/I s.v. maḫrû. F-6 RESOLVED.

  - finding_id: F-7
    round1_severity: LOW
    round1_kind: CITATION-PRECISION
    round1_issue: |
      Round-1 chapter did not name the cuneiform-publication sigil
      WVDOG 4 plate 12.
    round2_status: RESOLVED
    round2_evidence: |
