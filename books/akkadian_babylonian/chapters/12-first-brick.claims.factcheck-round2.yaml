# ── Findings (anything not ✓ SUPPORTED) ────────────────────────────────────

findings:
  - finding_id: F-R2-1
    claim_number: "INFERENCE marker line 111 (Sumerian-named-deity inheritance, new in round 2)"
    kind: PRECISION
    severity: LOW
    claim: |
      "The seventeen named craft-pantheon deities of *The First
      Brick* are largely Sumerian-named — Kulla, Ninildu, Ninsimug,
      Ninagal, Guškinbanda, Ninzadim, Ninkurra, Ašnan, Laḫar,
      Siris, Ningišzida, Ninšar, Adag, Umunmutamgu, Umunmutamnag,
      Kusu, and the partly-Akkadianised Arazu — though preserved
      within an Akkadian-language theological framework."
    issue: |
      The INFERENCE marker is properly hedged with basis-and-risk
      fields and the broad linguistic-historical observation
      (Sumerian etymologies for most of the names) is well-founded
      in Mesopotamian theology and accessible via Black & Green
      1992 entries. However, the specific characterisation of
      Arazu as "partly-Akkadianised" is an interpretive sub-claim
      that is not independently verifiable from the open sources
      consulted in this audit. Arazu (also Arazua) is generally
      attested in Sumerian and Akkadian theological contexts as
      a deity associated with prayer/petition; the
      "partly-Akkadianised" gloss is not a standard handbook
      classification. The risk language at line 111 ("the
      'Sumerian inheritance' reading is a linguistic-historical
      observation rather than a claim of the composition itself")
      does not specifically flag the Arazu sub-claim.
      Severity LOW because: (a) the broader Sumerian-inheritance
      observation is a fair linguistic-historical reading and is
      properly hedged; (b) the Arazu-specific gloss is a minor
      sub-claim within the wider INFERENCE; (c) the claim is
      defensible at the chapter-draft stage (Arazu's Akkadian-
      morphological behaviour can be verified via CAD or Tallqvist
      god-list references). The most conservative move at the
      chapter-draft stage would be to either (i) drop the
      "partly-Akkadianised" qualifier and treat Arazu as
      Sumerian-named like the others, or (ii) preserve it with an
      explicit footnote citing standard god-list literature.
    evidence: |
      No independent open source consulted in round 2 specifically
      classifies Arazu as "partly-Akkadianised". The wider claim
      (the seventeen craft-pantheon deities are largely
      Sumerian-named) is well-founded; the Arazu-specific gloss is
      the minor precision concern.
    recommended_fix: |
      Optional at the chapter-draft stage: either drop the
      "partly-Akkadianised" qualifier on Arazu (the safer move,
      since the broader Sumerian-inheritance reading does not
      depend on it) or preserve it with an explicit footnote
      citing Tallqvist's *Akkadische Götterepitheta* or the CAD
      A entry on Arazu. Not blocking; LOW severity.

