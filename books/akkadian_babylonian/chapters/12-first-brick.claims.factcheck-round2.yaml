  *The First Brick* (chapter 12 claims, round 2) — FACTCHECK
  VERDICT: PASS.

  All five round-1 HIGH/MEDIUM findings — F-1 (CONTAMINATION:
  Marduk-centred reading of an Ea-centred composition), F-2
