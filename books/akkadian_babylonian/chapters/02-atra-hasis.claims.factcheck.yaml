internal_variance_claims:
  - claim_number: 16
    claim: "By some readings of the broken opening, forty years; by others, three thousand six hundred years."
    note: "Internal-variance correctly handled. The 'forty years' figure (OB I:37) and the 3600-year figure (sometimes referenced for the entire pre-rebellion labour period in some readings, sometimes for the post-creation pre-flood multiplication interval) are both attested in different scholarly readings of the broken opening. The 'twelve hundred years' figure (between human creation and the first plague, OB II:1) is a third attested figure for an adjacent interval. The chapter's framing — that some readings give forty, others 3600 — is a defensible compression but slightly compresses two distinct intervals into one debate. See finding F-5 (LOW)."
    verdict: "Internal-variance acknowledged; not a finding under the brief's composite-editorial classification. F-5 below records the precision concern as LOW."

findings:
  - claim_number: 24
    finding_id: F-1
    kind: NOTE
    severity: LOW
    claim: "The god slain for the purpose is named Wê — sometimes Wê-ila."
    issue: "The slain god's name is read in the scholarship as Wê-ila / We-ila / Aw-ilu / Ilawela / Geshtu-E, with no fully settled standardisation. Lambert & Millard 1969 prefer Wê-ila (with circumflex on the Wê element); Foster 2005 prefers Aw-ilu; Wikipedia's Geshtu-E entry treats Geshtu-E and Wê-ila as alternate names for the same god of intelligence; ANET (Speiser tradition) prints Aw-ilu. The chapter's claim that 'Wê / Wê-ila' is the Lambert & Millard reading is correct; flagging this as a NOTE rather than a finding because the chapter implicitly acknowledges the variance ('sometimes Wê-ila') without naming the alternates."
    evidence: "Wikipedia Atra-Hasis: 'On some tablets the slained under-god is called Weila or Aw-ilu.' Wikipedia Geshtu-E: 'Ilawela (formerly variously transcribed as Geshtu-(E), Geshtu, Gestu, or We-ila).' Livius/ANET: 'They slaughtered Aw-ilu, who had the inspiration, in their assembly.'"
    recommended_fix: "OPTIONAL: at first mention of Wê / Wê-ila, add a footnote noting that Foster 2005 prints 'Aw-ilu' and that 'Geshtu-E' is the same god under a different reading. Not required for PASS verdict."

  - claim_number: 25
    finding_id: F-2
    kind: NOTE
    severity: LOW
    claim: "From this mixture humans receive a divine component: the *ṭēmu*, the rationality or animating spirit, derives from the slain god's flesh... A second concept derives from the slain god's blood: the *eṭemmu*, the ghost or shade."
    issue: "Standard scholarly readings of OB I:217 and OB I:223 (the line where the eṭemmu and the ṭēmu are derived from the slain god) vary on which component yields which: some readings (Lambert & Millard 1969, Bottéro) hold that the *eṭemmu* (ghost) derives from the flesh and the *ṭēmu* (intelligence/insight) from the slain god's god-quality (i.e., the slain god *had* ṭēmu, which becomes part of human nature via mixing). The Wikipedia Geshtu-E entry says: 'We-ila has insight, ṭemu, which means that he can contribute a ghost/spirit (eṭemmu) and blood (damu).' This reads as eṭemmu from the slain god as a whole, with the ṭemu being the slain god's pre-existing quality, not specifically blood→eṭemmu / flesh→ṭēmu. The chapter's two-component reading (ṭēmu from flesh, eṭemmu from blood) is a defensible interpretive reading following one strand of scholarship (Bottéro 2001 pp. 219–229; Kvanvig 2011) but is not the only attested reading. The page citation (pp. 58–60) is correct."
    evidence: "Wikipedia Geshtu-E: 'We-ila has insight, ṭemu, which means that he can contribute a ghost/spirit (eṭemmu) and blood (damu).' Wikipedia Atra-Hasis: 'The eṭemmu (ghost) of the slain god was left in human flesh and thus became part of human beings.' Britannica s.v. eṭemmu confirms the eṭemmu as the ghost-component."
    recommended_fix: "OPTIONAL: at the ṭēmu/eṭemmu paragraph, add a footnote acknowledging that scholars vary on which physical component (flesh, blood) yields which divine quality; the bipartite reading offered in the chapter follows Bottéro 2001 and Kvanvig 2011. Not required for PASS verdict."

  - claim_number: 47
    finding_id: F-3
    kind: NOTE
    severity: LOW
    claim: "Adad's storm rages for seven days and seven nights."
    issue: "The OB Atra-ḫasīs III text at the relevant lines (the 'seven-day deluge' phrase) is variously translated as 'seven days' or 'seven days and seven nights'. The 'seven days and seven nights' formula is universal in Gilgameš XI:127–131 (which borrows the scene). Whether the OB III text itself reads 'days and nights' as a doublet, or only 'seven days', depends on the partly reconstructed lines. The chapter's '[RECONSTRUCTION:]' marker at line 198 covers the partly-reconstructed status of this scene. Substantively, the seven-day duration is correct; the 'and seven nights' supplement may import the Gilgameš XI doublet."
    evidence: "Livius/ANET reproduction of OB III: 'he told it of the coming of the seven-day deluge.' Wikipedia Atra-Hasis: 'keep an eye on the hourglass for seven days from start of the catastrophe.' Gilgameš XI:127–131 has the 'six days and seven nights' / 'seven days and seven nights' doublet which is the closer-to-Hebrew form."
    recommended_fix: "OPTIONAL: change to 'Adad's storm rages for seven days' at line 203, or add a footnote noting that the OB III text gives 'seven days' and that the 'seven days and seven nights' doublet is the Gilgameš XI parallel. The existing [RECONSTRUCTION:] marker at line 198 already covers this. Not required for PASS verdict."

  - claim_number: 51
    finding_id: F-4
    kind: NOTE
    severity: LOW
    claim: "The 'pleasing aroma' of the sacrifice — Akkadian *erēšu ṭābu*."
    issue: "The Akkadian phrase as it appears in the OB Atra-ḫasīs III text and in the parallel Gilgameš XI passage is in a different case form than the lemma cited. Standard scholarly citations give the phrase as *iriš tābi* (status constructus + adjective in the genitive), or *erēša ṭāba* (accusative, governed by *iṣṣinū* 'they smelled'). The lemma form *erēšu ṭābu* (nominative singular) is correct as the dictionary headword (CAD E s.v. erēšu, ṭābu) but does not match the form in the actual text. This is a philological/grammatical point — substantively the claim is correct, and the citation form is acceptable as a lemma. The Hebrew rêaḥ nîḥôaḥ parallel (Genesis 8:21) is correctly given."
    evidence: "intertextual.bible Atrahasis–Genesis 8:21 entry confirms the motif and the Heb. rêaḥ nîḥôaḥ parallel; the Akkadian text uses iṣṣinū iriš tābi 'they smelled the sweet savour' (status constructus + genitive). CAD E s.v. erēšu II 'fragrance, smell' lemma form is *erēšu*; ṭābu lemma form *ṭābu*."
