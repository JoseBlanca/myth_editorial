  (2) F-R2-2: the COMPARATIVE-HOOK at line 108 conflates "the
      *Marduk Ordeal* and *Marduk-Address* texts" under the citation
      "Livingstone 1989, SAA 3 nos. 34–35" — but SAA 3 nos. 34–35
