      'Creation of Sun and Moon', 'Creation of the King' — all small-
      scale Marduk-creation narratives parallel in structure to *Uraš
      and Marduk*'s creation of plant life for Urash"]
      [+ COMPARATIVE-HOOK at line 109: "the cosmogonic incantation
      prologues collected in Foster 2005 pp. 436–440 ('Myth of the
      Plow', 'Creation of Humankind', 'Providing for the Gods',
      'Creation of Sun and Moon', 'Creation of the King')"]
    issue: |
      The Foster 2005 page range pp. 436–440 is wrong for the "Myths
      of Origins" sub-section. Foster 2005 (3rd edition, CDL Press
      2005)'s Section 17 "Epic of Creation" (= Enūma Eliš) begins at
      p. 436. Section 18 "Myths of Origins" — which contains "Marduk,
      Creator of the World", "Myth of the Plow", "Creation of
      Humankind", "Providing for the Gods", "Creation of Sun and
      Moon", "Creation of the King" — begins at p. 487. Verified
      directly via dokumen.pub-hosted Foster 2005 TOC and confirmed
      via multiple convergent web searches. The chapter's "pp.
      436–440" attribution for the "Myths of Origins" sub-section is
      thus a citation-pagination error on the same model as round 1's
      F-1 (wrong page range for Lambert 2013). Severity MEDIUM
      because: (a) the citation appears in three places (claim 9
      footnote and EVIDENCE token, INFERENCE marker basis, COMPARATIVE-
      HOOK) — this is a systemic error, not a localized one; (b) the
      substantive claim (Foster 2005 contains a "Myths of Origins"
      sub-section with these compositions) is correct; only the page
      range is wrong; (c) but a future reader looking up the cited
      compositions at "pp. 436–440" will land in the Enūma Eliš
      section, not in the cosmogonic incantation prologues. Note:
      these are NOT incantation prologues per se — they are Foster
      2005's grouping of small Marduk-creation compositions, and the
      claims document's framing as "cosmogonic incantation prologues"
      is also slightly imprecise (the underlying Akkadian
      compositions ARE often incantation prologues — e.g., the
      bilingual Creation of the World by Marduk — but Foster 2005's
      "Marduk, Creator of the World" is one such; the sub-section is
      mixed, not exclusively prologue-material).
    evidence: |
      dokumen.pub-hosted Foster 2005 TOC (read directly via WebFetch):
      "Section 18, 'Myths of Origins' (page 487), which includes:
      (a) Marduk, Creator of the World, 487; (b) The Myth of the
      Plow, 489; (c) Creation of Humankind, 491; ..." Independently
      confirmed via Google Books and multiple secondary sources. The
      Section 17 Epic of Creation begins at p. 436 — pages 436–440
      are the start of the Enūma Eliš section, not the cosmogonic
      sub-section.
    recommended_fix: |
      Revise the three citations:
      - claim 9 footnote and EVIDENCE token: "Foster 2005, pp.
        436–440" → "Foster 2005, pp. 487–502 (the 'Myths of Origins'
        sub-section, including 'Marduk, Creator of the World' p. 487,
        'Myth of the Plow' p. 489, 'Creation of Humankind' p. 491,
        and the further small Marduk-creation narratives)";
      - INFERENCE marker after claim 9 basis: same correction;
      - COMPARATIVE-HOOK at line 109: same correction.
      The substantive grouping argument stands; only the page range
      requires revision. The page range can be left open ("Foster
      2005, pp. 487 ff. ('Myths of Origins')") if a precise endpoint
      is hard to fix without direct access to Foster 2005.

  - finding_id: F-R2-2
    claim_number: COMPARATIVE-HOOK at line 108
    kind: CITATION-WRONG
    severity: MEDIUM
    claim: |
      "// COMPARATIVE-HOOK: Akkadian internal — Marduk's syncretism
      with local and functional cult-figures (Marduk-Asalluhi,
      Marduk-Tutu, Marduk-of-planting = Urash, Marduk-of-healing) is
      articulated most fully in *Enūma Eliš* Tablet VII's fifty-names
      sequence (Lambert 2013, pp. 1–277) and in the *Marduk Ordeal*
      and *Marduk-Address* texts (Livingstone 1989, SAA 3 nos. 34–35)."
    issue: |
      The COMPARATIVE-HOOK conjoins "the *Marduk Ordeal* and *Marduk-
      Address* texts" under the citation "Livingstone 1989, SAA 3
      nos. 34–35". Verification: SAA 3 nos. 34 and 35 are the *Marduk
      Ordeal* (Assur Version, no. 34; Nineveh Version, no. 35) per
      the Livingstone 1989 TOC. There is NO text in SAA 3 titled
      "Marduk-Address" or "Marduk's Address". "Marduk's Address to
      the Demons" is a different composition, originally published by
      W. G. Lambert in "An Address of Marduk to the Demons", AfO 17
      (1954–56), and republished by Geller 2016 as Udug-hul Tablet 11
      (Healing Magic and Evil Demons, De Gruyter, pp. 340–541). The
      conjunction of both texts under the SAA 3 nos. 34–35 citation
      is a false conjunction: the Marduk Ordeal IS at SAA 3 nos.
      34–35; the Marduk-Address texts ARE NOT. Severity MEDIUM
      because: (a) the COMPARATIVE-HOOK is structurally well-formed
      and the underlying argument (that the Marduk Ordeal and Marduk-
      Address texts develop the syncretism) is plausible and well-
      attested in the secondary literature (Wikipedia s.v. Marduk
      describes Marduk's Address as part of the syncretistic
      apparatus); (b) but the citation conflates two separate
      compositions and misroutes the reader to the wrong publication;
      (c) the same conflation appears in claim 5's footnote at line
      68: "Livingstone 1989 (Court Poetry and Literary Miscellanea,
      SAA 3, especially the *Marduk Ordeal* and Marduk-name-list
      compositions)". Here "Marduk-name-list compositions" is the
      ambiguous phrase — SAA 3 nos. 36 (Myth embedded in a Royal
      Ritual) and 39 (Mystical Miscellanea) contain Marduk-related
      cultic / theological material, but they are not specifically
      "Marduk-name-list" texts. The claim 5 footnote is closer to
      genre-acceptable than the COMPARATIVE-HOOK at line 108, but
      both should be tightened.
    evidence: |
      epdf.mx-hosted Livingstone 1989 SAA 3 TOC (read directly via
      WebFetch): "30. Magic against Bel-elir; 31. Defeat of Teumman
      and the Annexation of Elam; 32. The Underworld Vision of an
      Assyrian Prince; 33. The Sin of Sargon; 34. Marduk Ordeal
      (Assur Version); 35. Marduk Ordeal (Nineveh Version); 36. Myth
      embedded in a Royal Ritual; 37. A Cultic Commentary; 38. The
      Rites of Egasankalamma; 39. Mystical Miscellanea; ..." No SAA 3
      text is titled "Marduk-Address" or "Marduk's Address". The
      Geller 2016 De Gruyter chapter landing
      (doi:10.1515/9781614513094-008) confirms that Marduk's Address
      to the Demons = Udug-hul Tablet 11, originally published Lambert
      AfO 17 (1954-56) and re-edited Geller 2016.
    recommended_fix: |
      Revise the COMPARATIVE-HOOK at line 108: drop the "Marduk-Address
      texts" reference, OR re-cite to the correct publication: "in
      *Enūma Eliš* Tablet VII's fifty-names sequence (Lambert 2013,
      pp. 1–277), in the *Marduk Ordeal* (Livingstone 1989, SAA 3
      nos. 34–35), and in *Marduk's Address to the Demons* (Lambert,
      AfO 17 [1954–56]; re-edited Geller 2016, *Healing Magic and
      Evil Demons*, Udug-hul Tablet 11)." The claim 5 footnote's
      "Marduk-name-list compositions" can be tightened to "and other
      Marduk-related cultic / theological compositions" or dropped if
      a more specific citation is unavailable. The substantive
      argument (Marduk syncretism is articulated in multiple
      compositions including the Marduk Ordeal and the Marduk-Address)
      is correct and well-attested; only the citation routing needs
      correcting.

  - finding_id: F-R2-3
    claim_number: 6, INFERENCE marker after claim 6, claim 11
    kind: UNVERIFIED
    severity: LOW
    claim: |
      Three citations of "Black & Green 1992, s.v. Urash" for the
      "Marduk of planting" equation:
      - claim 6 footnote (line 40): "Black & Green 1992, s.v. Urash
        (the male tutelary of Dilbat; agricultural character;
        equation with Ninurta and Marduk in late commentary lists)"
      - INFERENCE marker after claim 6 (line 49) basis: "the late-
        Babylonian commentary equation 'Urash = Marduk of planting'
        is attested in the syncretistic god-list tradition (Black &
        Green 1992, s.v. Urash)"
      - claim 11 footnote (line 73): "Black & Green 1992, s.v. Urash
        ('Marduk of planting' equation)"
    issue: |
      The "Marduk of planting" equation IS well-attested in the
      secondary literature, but Wikipedia s.v. Urash (god) traces the
      equation to Lambert 2013 pp. 264–265 (the Enūma Eliš Tablet VII
      fifty-names commentary), not to Black & Green 1992. Whether
      Black & Green 1992 — a 192-page illustrated dictionary — has a
      dedicated Urash entry containing this specific equation could
      not be verified from the secondary sources I could access. The
      Black & Green 1992 attribution is plausible (the dictionary
      covers most major and many minor deities) but UNVERIFIED for
      the specific "Marduk of planting" equation. The substantive
      claim is supported (the equation is real and well-attested
      somewhere); the SOURCING is partly uncorroborated. Severity LOW
      because: (a) the substantive equation is fully corroborated by
      HandWiki and Wikipedia; (b) Black & Green 1992 is a standard
      genre-appropriate reference and a plausible source; (c) the
      better citation per Wikipedia is Lambert 2013 pp. 264–265 — the
      claims document already cites Lambert 2013 (with the corrected
      pp. 311–315 range for the chapter), so a parenthetical "(also
      Lambert 2013 pp. 264–265 in the Enūma Eliš VII commentary)"
      would tighten the attribution; (d) the citation is not load-
      bearing for the substantive argument — the male/female
      distinction and the agricultural / Marduk-of-planting equation
      are well-attested independently.
    evidence: |
      Wikipedia s.v. Urash (god) bibliography: "Lambert, W.G. (2013),
      Babylonian Creation Myths" — cited specifically for the
      "Marduk of planting" equation at pp. 264–265 (footnote 4).
      Black & Green 1992 is NOT cited in the Wikipedia article on
      Urash (god). Direct fetch of HandWiki and Wikipedia did not
      surface Black & Green 1992 as a source for this equation.
    recommended_fix: |
      Either: (a) verify the Black & Green 1992 s.v. Urash entry
      directly; or (b) tighten the citation to "Lambert 2013, pp.
      264–265 (the *Enūma Eliš* Tablet VII fifty-names commentary,
      where the 'Marduk of planting' equation is articulated as part
      of Marduk's syncretism with the regional cult-figures)" — and
