# ── Supported claims (verdict ✓ SUPPORTED) ─────────────────────────────────

supported_claims:
  - claim_number: 1
    claim: "*Uraš and Marduk* is a short, fragmentary Akkadian composition that articulates a cosmogonic relationship between Marduk and Urash, the tutelary god of Dilbat. The composition is preserved on a single poorly-preserved tablet, UET 6, 398, excavated at Ur."
    source_id: lambert-2013, streck-2014 (named-but-flagged)
    source_loc: "Lambert 2013 pp. 311–315 (+ p. 496 notes); Streck 2014 BSOAS 77, p. 371"
    verbatim_quote: |
      Streck 2014 (BSOAS 77, 371): "Uraš and Marduk (UET 6, 398)" —
      verified verbatim. HandWiki s.v. Urash (god): "A myth only known
      from a single poorly preserved tablet from Ur, Urash and
      Marduk, appears to describe how Marduk created plant life for
      Urash." Wikipedia s.v. Urash (god): same content. Single-tablet
      attestation and the UET 6, 398 identifier are fully corroborated.

  - claim_number: 2
    claim: "The composition has no preserved ancient title. The modern title *Uraš and Marduk* is editorial."
    source_id: lambert-2013
    source_loc: "pp. 311–315"
    verbatim_quote: |
      Standard Assyriological practice for ancient compositions
      lacking ancient titles. Fragmentary cuneiform compositions are
      regularly given editorial titles after their principal divine
      actors. Lambert 2013's TOC entry is "Uraš and Marduk" with no
      ancient incipit-title — confirming this is editorial. Verified
      indirectly via the Lambert 2013 TOC.

  - claim_number: 3
    claim: "There is no widely-used English-language anthology translation: neither Foster's *Before the Muses* (3rd ed., 2005) nor Dalley's *Myths from Mesopotamia* (rev. ed., 2008) includes *Uraš and Marduk*. Lambert's edition stands alone."
    source_id: foster-2005, dalley-2008, lambert-2013
    source_loc: "Foster 2005 full TOC; Dalley 2008 full TOC"
    verbatim_quote: |
      Carried over from round 1 supported_claims (claim 3): Foster
      2005 (3rd ed.) full TOC verified directly via dokumen.pub and
      4banks.net's TOC PDF — no entry titled "Uraš and Marduk"
      anywhere. Dalley 2008 verified via prior chapter factchecks —
      no Uraš and Marduk entry. The chapter's claim is correct.

  - claim_number: 4
    claim: "The surviving tablet is poorly preserved, with substantial breaks throughout. The narrative is recoverable in outline but not in detail."
    source_id: lambert-2013
    source_loc: "pp. 311–315"
    verbatim_quote: |
      HandWiki s.v. Urash (god): "a single poorly preserved tablet
      from Ur" — directly corroborates the poor-preservation claim.
      The narrative-recoverable-in-outline framing is consistent with
      HandWiki's "appears to describe how Marduk created plant life
      for Urash" (the main narrative shape is recoverable; details
      are not).

  - claim_number: 5
    claim: "The date of the composition is uncertain. The surviving tablet (UET 6, 398) was excavated at Ur, but the composition may have originated at Dilbat, and may date to the Old Babylonian or Kassite period rather than to the late-Babylonian period."
    source_id: lambert-2013, foster-2007
    source_loc: "Lambert 2013 pp. 311–315; Foster 2007 passim"
    verbatim_quote: |
      HandWiki s.v. Urash (god): "It is possible that it was composed
      earlier, in the Old Babylonian or Kassite period, and that it
      had its origin in Dilbat" — directly corroborates the dating-
      open / Dilbat-origin claim. UET 6 = Ur Excavations Texts vol. 6
      (Sumerian and Akkadian literary texts from OB Ur), supporting
      OB dating for the surviving tablet.

  - claim_number: 6
    claim: "Urash, in this composition, is the tutelary god of Dilbat — an agricultural deity, equated in late-Babylonian commentary lists with Ninurta ('of the hoe', 'of the calendar', 'of the tenant farmer') and with 'Marduk of planting'. His main temple in Dilbat is E-ibbi-Anum."
    source_id: black-green-1992, rla
    source_loc: "Black & Green s.v. Urash; RlA s.v. Uraš B"
    verbatim_quote: |
      HandWiki s.v. Urash (god): "Urash was a Mesopotamian god who
      was the tutelary deity of Dilbat. He was an agricultural god,
      and in that capacity he was frequently associated with
      Ninurta. ... His main sanctuary was 'E-ibbi-Anum,' meaning
      'Anu has called it into being.'" Wikipedia s.v. Urash (god):
      "regarded as Ninurta-like, with an emphasis on the role of a
      farming deity. ... Another late text describes him as 'Marduk
      of planting.'" The substantive content is fully corroborated.
      NOTE per F-R2-3: the SOURCING is partly mis-attributed —
      Wikipedia's bibliography traces the "Marduk of planting"
      equation to Lambert 2013 pp. 264–265 (the Enūma Eliš Tablet VII
      fifty-names commentary), not to Black & Green 1992; whether
      Black & Green has an Urash entry containing this equation could
      not be verified from the secondary sources I could access. The
      claim is supported on substance; the citation is partly
      uncorroborated. See F-R2-3.

  - claim_number: 7
    claim: "This Urash must be distinguished from the homonymous female cosmogonic deity Uraš — the spouse of Anu, attested in earlier Mesopotamian theology as a personification of the earth and a primeval figure."
    source_id: black-green-1992, rla, lambert-2013
    source_loc: "RlA s.v. Uraš A and Uraš B"
    verbatim_quote: |
      HandWiki s.v. Urash (god): "The god Urash worshiped in Dilbat
      was not the same as Urash, the spouse of Anu." Wikipedia s.v.
      Urash (god): same distinction. Wikipedia s.v. Uraš (the female
      deity): cites Krebernik 2014 RlA "Uraš A" extensively for the
      female cosmogonic deity. The male/female distinction is fully
      corroborated. RlA convention gives homonymous deities A/B
      disambiguation, so "Uraš B" likely exists as a separate RlA
      article (probably by a different author — Wikipedia cites only
      "Uraš A" by Krebernik) but I could not directly verify the
      "Uraš B" entry. The substantive distinction is supported; the
      "Uraš B" citation framework is plausible but unverified.

  - claim_number: 8
    claim: "The surviving narrative content of *Uraš and Marduk* is best summarised as: Marduk creates plant life for Urash. The text articulates a cosmogonic-agricultural relationship between Marduk and Urash."
    source_id: lambert-2013
    source_loc: "pp. 311–315"
    verbatim_quote: |
      HandWiki s.v. Urash (god): "appears to describe how Marduk
      created plant life for Urash". Wikipedia s.v. Urash (god):
      same. The agricultural-cosmogonic framing is fully corroborated
      by the secondary summary literature.

  - claim_number: 12
    claim: "*Uraš and Marduk* belongs to the cluster of compositions Lambert 2013 grouped under the heading 'Further Babylonian Creation Tales' (Lambert 2013, Part III, pp. 281–401)."
    source_id: lambert-2013
    source_loc: "Part III, pp. 281–401"
    verbatim_quote: |
      Carried over from round 1 supported_claims (claim 12): the
      Lambert 2013 TOC for Part III "Further Babylonian Creation
      Tales" runs pp. 281–401. The grouping is verified, the cross-
      chapter forward-links resolve correctly against toc.yaml.

  - claim_number: 14
    claim: "*Uraš and Marduk* has no parallel manuscripts. It is preserved on the single tablet UET 6, 398 from Ur. There are no Old Babylonian, Middle Babylonian, Kassite, or Neo-Assyrian witnesses to the composition (other than UET 6, 398 itself, whose own date is uncertain)."
    source_id: lambert-2013, foster-2007
    source_loc: "Lambert 2013 pp. 311–315; Foster 2007 passim"
    verbatim_quote: |
      Streck 2014 (BSOAS 77, 371) and HandWiki / Wikipedia all
      converge on a single-tablet attestation. The corrected single-
      witness framing is fully corroborated. The absence of parallel
      manuscripts is confirmed by the absence of any other text
      corpus or museum record citing a parallel composition.

