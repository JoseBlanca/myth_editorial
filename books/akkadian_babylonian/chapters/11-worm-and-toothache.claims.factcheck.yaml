    q4_distinguished_variance_from_contamination: |
      Yes — with one substantive caveat. The claims document's
      cosmogonic chain "Anu → heavens → earth → rivers → canals →
      marshes → mud → worm" is described as "seven-step", with the
      parenthetical caveat that "Some translations group the sequence
      as six steps by combining marsh and mud into one node". This
      framing partially handles the variance but does not capture
      the actual situation: NO accessible translation has all of
      canals, marshes, AND mud as three separate intermediates. The
      Speiser ANET version (5 steps, with rivers → marsh → worm) and
      the Foster/ETANA version (6 steps, with rivers → ditches → mud
      → worm, NO marsh) are the two principal traditions, and the
      claims doc appears to conflate them. This is variance-to-
      contamination boundary issue: the seven-step chain may be the
      result of editorial conflation rather than direct attestation
      in any one translation. Conservative reading: the claims doc
      should either commit to Foster's 6-step chain (rivers → ditches
      → mud → worm) or to Speiser's 5-step chain (rivers → marsh →
      worm), not present a 7-step composite that no single
      translation attests. The OB variant chain (YOS 11, 5a) is
      correctly distinguished from the first-millennium chain;
      contamination with the OB variant's "stench, mud, fly, worm"
      sequence is avoided. The COMPARATIVE-HOOK to Genesis 1 is
      correctly framed as typological structural comparison and
      correctly deferred to the influences chapter; no EVIDENCE
      token routes through Genesis 1. The COMPARATIVE-HOOK to
      Hurrian Mari 5 is correctly deferred to the influences
      chapter, but carries the Cohen-Wasserman misattribution
      (substantive bibliographic error, not contamination per se).
      No other contamination detected: all EVIDENCE tokens route
      through in-scope sources (foster-2005, lambert-2013 via
      brief-conditional, black-green-1992, bottero-2001, foster-2007,
      dalley-2008-negative). The named-but-flagged convention is
      correctly applied for Thompson 1903 (CT 17 50), Hussey-van
      Dijk YOS 11 5 (with caveat: should be van Dijk/Goetze/Hussey
      1985, not Hussey-van Dijk), and Cohen-Wasserman 2018 (with
      caveat: misattribution — should be Campbell-Fischer 2018).
