    q2_triangulated_or_assumed: |
      Triangulated for: (a) The cosmogonic chain — verified via the
      Speiser ANET 1969 translation reproduced verbatim at
      mesopotamiangods.com (5-step chain: Anu → heaven → earth → rivers
      → marsh → worm); via the ETANA / Foster-reproduction snippet
