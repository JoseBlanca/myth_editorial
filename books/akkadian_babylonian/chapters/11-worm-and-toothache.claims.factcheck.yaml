verdict_reasoning: |
  Verdict rules from the skill: MAJOR-REVISE = ≥3 HIGH or any
  contamination or fabricated references; REVISE = 1–2 HIGH or
  >3 MEDIUM or any silent bridge; PASS = 0 HIGH and 0 silent
  bridges and ≤3 MEDIUM. This audit finds:
    HIGH: 1 (F-1 Cohen-Wasserman 2018 → Campbell-Fischer 2018
              misattribution in the Hurro-Hittite COMPARATIVE-HOOK
              and brief)
    MEDIUM: 2 (F-2 seven-step cosmogonic chain not directly
                  attested; F-3 YOS 11 5 author-order and siglum
                  precision)
    LOW: 2 (F-4 Aššur duplicate under-verified; F-5 worm's
                defiance verbatim wording variant)
    NOTES: 3 (N-1 Cohen-Wasserman 2008 *RA* 102 as the genuine
                  Cohen-Wasserman publication; N-2 Lambert 2013
                  pp. 399–402 conservative handling; N-3 Foster
                  2005 pp. 995–996 page-reference taken on trust)

  Per the verdict rules, 1 HIGH + 2 MEDIUM gives REVISE
  (1–2 HIGH triggers REVISE). Verdict: REVISE.

  The claims document represents a generally substantive and
  well-supported narrative reading of *The Worm and the
  Toothache*: the cosmogonic chain's existence, the worm-Šamaš-Ea
  dialogue, the fig-and-apricot offer, the worm's defiance, Ea's
  third-person curse, the ritual prescription, the late-period
  manuscript dating with possibly earlier composition, the OB
  variant cosmogonic chain, and the tooth-worm theory's
  transmission to European medicine are all directly or
  cross-translation corroborated. The composition's place in
  the Akkadian incantation-prologue cosmogony dossier (paired
  with *The Founding of Eridu* and structurally compared with
  *The Theogony of Dunnu*) is appropriately framed.

  However, three substantive bibliographic / textual issues
  require revision before the chapter advances:

  (1) HIGH F-1: The Cohen-Wasserman 2018 attribution for the
      Hurrian Mari 5 reanalysis is wrong. The actual authors are
      **Campbell and Fischer**, page range **31–47** (not
      31–50). The misattribution is in the COMPARATIVE-HOOK at
      line 119, and propagates from the brief (line 2136). The
      genuine Cohen-Wasserman publication on the topic of OB
      worm/leech incantations is **Cohen and Wasserman 2008**,
      *RA* 102, "On Leeches, Dogs, and Gods in Old Babylonian
      Medical Incantations" — a different article on a different
      tablet. The 2018 Mari 5 article must be re-attributed to
      Campbell and Fischer; the brief should also be corrected
      at brief-pass cleanup.

  (2) MEDIUM F-2: The seven-step cosmogonic chain (Anu →
      heavens → earth → rivers → canals → marshes → mud → worm)
      is not directly attested in any accessible English
      translation. The Speiser ANET 1969 version (5 steps; rivers
      → marsh → worm) and the Foster / ETANA-reproduction
      version (6 steps; rivers → ditches → mud → worm, NO marsh)
      are the two principal traditions. The claims doc's
      seven-step chain appears to be an editorial conflation.
      Recommend committing to Foster's 6-step chain (which is
      the brief's locked anchor) or to Speiser's 5-step chain;
      the claims doc's parenthetical "Some translations group
      the sequence as six steps by combining marsh and mud into
      one node" should be revised to accurately describe the
      step-count situation. The INFERENCE marker at line 57
      should also adjust.

  (3) MEDIUM F-3: The YOS 11, 5 OB variant attribution should
      be revised: the publication is **van Dijk, Goetze, and
      Hussey 1985** (not "Hussey-van Dijk"); the siglum is more
      precisely **YOS 11, 5a** (the "a" portion of YBC 4616);
      and the genre difference (OB anti-leech-against-infant vs.
      first-millennium anti-toothache) should be made explicit.

  Plus 2 LOW findings (F-4 Aššur duplicate under-verified; F-5
  worm's defiance verbatim wording variant) and 3 NOTES.

  All 5 COMPARATIVE-HOOK markers are appropriately scoped per
  scope.md (one needs the F-1 fix). Marker discipline is
  generally well-maintained: 2 INFERENCE markers (PASS); 1
  LACUNA marker (PASS-WITH-CAVEAT per F-4); 1 RECONSTRUCTION
  marker (PASS); 1 VARIANT marker (REVISE per F-3); 5
  COMPARATIVE-HOOK comments (REVISE per F-1). Contamination
  scan returns clean. No silent bridges.

  After REVISE-stage corrections (F-1 Cohen-Wasserman →
  Campbell-Fischer; F-2 step-count; F-3 YOS 11 5 attribution),
  the chapter will be ready to proceed to chapter-draft.
  Optional: F-4 Aššur duplicate hedge and F-5 verbatim wording
  confirmation can be applied at post-human-normalize.

