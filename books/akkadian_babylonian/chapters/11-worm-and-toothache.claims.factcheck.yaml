      strangehistory.net (5-step). The claims doc's seven-step chain
      "Anu → heavens → earth → rivers → canals → marshes → mud → worm"
      with **canals, marshes, AND mud as three separate intermediates**
      is NOT directly attested in any of the accessible translations.
      The most authoritative-likely-Foster version (the ETANA
      reproduction) has 6 steps with **ditches → mud** (no marsh). The
      Speiser version has 5 steps with **rivers → marsh → worm** (no
      canals, no mud). The mention "Some translations group the
      sequence as six steps by combining marsh and mud into one node"
      is a partial acknowledgment but does not capture the actual
      situation: most translations have 5 or 6 steps, not 7. (b) The
      worm's dialogue partners — verified verbatim via Speiser ANET
      ("The worm went, weeping, before Shamash, / His tears flowing
      before Ea"); the worm weeps before Šamaš while its tears flow
      before Ea; both gods are present in the dialogue but Šamaš is
      the primary interlocutor of the lament. The claims doc's framing
      "weeps before Šamaš... with its tears flowing before Ea" is
      directly corroborated. (c) The gods' offer — verified verbatim:
      "I will give you the ripe fig and the apricot." Speiser ANET,
      mesopotamiangods.com, hubpages.com, and Spence 1916 (tota.world)
      all attest the fig and apricot (Spence has "ripe figs... ripe
      figs and scented wood" — minor variant). The claims doc's
      framing "the ripe fig and the apricot" is directly corroborated.
      (d) The worm's defiance — verified verbatim via Speiser ANET:
      "What good is the ripe fig and the apricot? Lift me up, and
      assign me to the teeth and the gums! I will suck the blood of
      the tooth, and I will gnaw its roots!" The claims doc's quotation
      "What good is the ripe fig and the apricot? Lift me up, and let
      me dwell between the teeth and the gums! I will suck the blood
      of the tooth, and I will gnaw on the bone of the jaw!" is a
      paraphrase/variant — Speiser has "assign me to the teeth and
      gums" / "gnaw its roots", not "let me dwell between" / "gnaw on
      the bone of the jaw". The claims doc's wording is closer to
      Foster (likely ETANA) or to a different translation tradition;
      since the claims doc anchors on Foster 2005 (which I cannot open
      directly), the wording could plausibly be Foster's. Treat as
      paraphrase variant within acceptable tolerance, not as a
      verbatim error. (e) Ea's curse — verified verbatim via Speiser
      ANET "May Ea strike you with the might of his hand!" The claims
      doc's "Because you have said this, O worm, may Ea strike you
      with the might of his hand!" matches the canonical formulation;
      the third-person attribution to Ea (not "may I, Ea, strike") is
      directly verified. (f) CT 17 50 = R. Campbell Thompson 1903 —
      directly verified via CDLI; confirmed publication date 1903,
