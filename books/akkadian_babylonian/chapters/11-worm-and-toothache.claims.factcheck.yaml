      and Wasserman, 'A Hurrian Ritual Against Toothache: A Reanalysis
      of Mari 5', *Revue d'Assyriologie* 112 [2018], 31–50; named-but-
      flagged) confirms that the tooth-worm motif circulated in the
      broader cuneiform cultural sphere across language boundaries."
    issue: |
      The bibliographic attribution is WRONG on two fronts. Per
      direct verification at shs.cairn.info/revue-d-assyriologie-2018-1-page-31
      (and confirmed via independent web search hits including ResearchGate
      and JStor), the actual article is:
      - **Authors: Dennis R.M. Campbell and Sebastian Fischer**, NOT
        Cohen and Wasserman.
      - **Pages: 31–47**, NOT 31–50.
      - Journal, volume, year are correct: *Revue d'assyriologie et
        d'archéologie orientale* 112(1) (2018).
      - Title is correct: "A Hurrian Ritual Against Toothache: A
        Reanalysis of Mari 5."
      The misattribution to "Cohen and Wasserman" is likely a
      conflation with Cohen and Wasserman 2008, "On Leeches, Dogs,
      and Gods in Old Babylonian Medical Incantations", *RA* 102,
      71–88 — which IS by Cohen and Wasserman and IS about
      Old-Babylonian worm/leech incantations including YOS 11, 5.
      That 2008 article is the genuine Cohen-Wasserman publication
      on the topic. The 2018 Mari 5 reanalysis is by Campbell and
      Fischer. The misattribution is also present in the brief
      (line 2136) and the cultural-relevance / cross-cultural-parallels
      section; the brief should be updated at brief-pass cleanup.
      Severity HIGH because: (a) the named-but-flagged convention
      requires accurate attribution; (b) the misattribution will
      propagate into the influences chapter if not corrected; (c)
      a substantive author-and-page-range error in a comparative
      reference materially degrades scholarly trust in the chapter's
      apparatus.
    evidence: |
      shs.cairn.info/revue-d-assyriologie-2018-1-page-31 (verbatim
      via WebFetch): authors **Dennis R.M. Campbell and Sebastian
      Fischer**; pages **31–47**; *Revue d'assyriologie et
      d'archéologie orientale* 112(1) (2018). The article cites
      CT 17 50 (footnote 106 of the article) but does not reference
      YOS 11 5; the Hurrian Mari 5 ritual is a distinct tradition
      from the Mesopotamian worm-cosmogony toothache approach
      (the Hurrian text invokes the daughters of the god Šimige,
      not a worm etiology). ResearchGate publication record and
      JStor *RA* 112 (2018) ToC independently confirm authors and
      page range.
    recommended_fix: |
      REQUIRED: change line 119 of the claims document to read:
      "Hurrian rituals against toothache are also attested. The
      Hurrian toothache ritual at Mari 5 (reanalysed in Campbell
      and Fischer, 'A Hurrian Ritual Against Toothache: A Reanalysis
      of Mari 5', *Revue d'Assyriologie* 112 [2018], 31–47;
