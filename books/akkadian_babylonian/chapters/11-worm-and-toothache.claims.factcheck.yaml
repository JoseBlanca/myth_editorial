supported_claims:
  - claim_number: 1
    claim: |
      "*The Worm and the Toothache* is a short Akkadian incantation
      against toothache, preserved with a cosmogonic prologue that
      grounds the magical efficacy of the cure. The principal cuneiform
      publication is CT 17, plate 50 — R. Campbell Thompson, *Cuneiform
      Texts from Babylonian Tablets in the British Museum*, Part XVII
      (London: British Museum, 1903), plate 50 — with multiple duplicates
      from Aššurbanipal's library at Nineveh and from Aššur."
    source_id: foster-2005
    source_loc: "Foster 2005 pp. 995–996; Thompson 1903 (CT 17 50)"
    verbatim_quote: |
      CDLI search result (verbatim): "CT 17 (Cuneiform Texts from
      Babylonian Tablets in the British Museum, Part 17) was published
      by R. Campbell Thompson in 1903." Multiple secondary sources
      (medboundtimes.com, ancientist.com, mesopotamiangods.com)
      confirm Nineveh / Aššurbanipal-library provenance for CT 17 50
      and the standard Speiser ANET attribution. The Aššur duplicate
      claim is plausible-on-its-face given the wider Mesopotamian
      medical-magical corpus's standard Nineveh-Aššur dual-witness
      pattern (BAM series at Aššur, K-collection at Nineveh) but is
      not directly verified in open sources. Treated as supported
      via the brief's foster-2005 pp. 995–996 anchor; flagged as
      under-verified for the specific Aššur-duplicate claim (see
      Finding F-4).

  - claim_number: 2
    claim: |
      "The standard accessible modern English translation is Benjamin
      Foster's *Before the Muses* (3rd ed., CDL Press 2005), pp.
      995–996. Foster's translation supersedes Speiser's older translation
      in *Ancient Near Eastern Texts* (ANET, 1969), which sources.yaml
      explicitly excludes as a current reference. Lambert's *Babylonian
      Creation Myths* (2013) may include the composition in his
      'Mythological Introductions on Creation' section (pp. 399–402,
      chapter 37, which collects multiple short cosmogonic incantation
      prologues), but this has not been directly verified at the brief
      or claims stage. Dalley's *Myths from Mesopotamia* (rev. ed.,
      2008) does not contain this composition."
    source_id: foster-2005, lambert-2013, dalley-2008
    source_loc: "Foster 2005 pp. 995–996; Lambert 2013 pp. 399–402 (unverified); Dalley 2008 (negative)"
    verbatim_quote: |
      Foster 2005 pp. 995–996 page reference is taken on trust from
      the brief; the genre placement (Foster's "Magic and Healing" /
      incantation section in the high-900s page range of the third
