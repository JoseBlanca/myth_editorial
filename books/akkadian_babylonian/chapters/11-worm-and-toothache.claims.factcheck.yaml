  - claim_number: 10
    claim: |
      "The gods' answer is the offer of ordinary food: the ripe fig
      and the apricot. The worm is offered the natural produce of the
      cosmos as its appropriate diet — fruit, the gift of an ordered
      cosmogonic system in which each creature has its proper food."
    source_id: foster-2005
    source_loc: "Foster 2005 pp. 995–996"
    verbatim_quote: |
      Speiser ANET (verbatim, via mesopotamiangods.com): "'I will
      give you the ripe fig and the apricot.'" — DIRECTLY VERBATIM
      CORROBORATED. The "ripe fig and apricot" wording is also
      attested in hubpages.com, strangehistory.net, and waxtablets
      reproductions. Lewis Spence 1916 (tota.world) gives "ripe
      figs... ripe figs and scented wood" — minor translation
      variant, but the fig is consistent.

  - claim_number: 12
    claim: |
      "Ea responds to the worm's defiance with a curse: 'Because you
      have said this, O worm, may Ea strike you with the might of his
      hand!' The curse is articulated in the third person — Ea
      pronounces the curse upon the worm, with the divine power of his
      own hand as the punitive instrument."
    source_id: foster-2005, bottero-2001
    source_loc: "Foster 2005 pp. 995–996"
    verbatim_quote: |
      Speiser ANET (verbatim, via mesopotamiangods.com): "'May Ea
      strike you with the might of his hand!'" — DIRECTLY VERBATIM
      CORROBORATED. The third-person formulation (Ea pronouncing
      the curse upon Ea's-own-hand striking the worm) is the
      canonical formulation. The full claims-doc wording "Because
      you have said this, O worm, may Ea strike you with the might
      of his hand!" matches the standard Speiser/Foster formulation
      with the conditional "Because you have said this, O worm"
      (also attested in hubpages.com reproduction: "Because you
      said this, worm, may Ea strike you with his mighty hand!").

  - claim_number: 14
    claim: |
      "The composition's wider cultural reception is unusually long.
      The 'tooth-worm' theory of dental caries — that decay is caused
      by a worm dwelling in the tooth — persisted in European medical
      thinking through the 18th century, traceable in part through the
      long transmission history of Akkadian medical-magical material.
      The Akkadian text is not the only source for the tooth-worm
      theory in European medicine, but it is the oldest documented
      instantiation."
    source_id: foster-2005, bottero-2001
    source_loc: "Foster 2005 pp. 995–996; Bottéro 2001 passim"
    verbatim_quote: |
      Multiple independent dental-history sources (zadehdentistry.com,
      encedentistry.com, fauchard.org, Wikipedia s.v. Pierre Fauchard,
      thearchaeologist.org) directly corroborate that Pierre Fauchard's
      1728 manuscript refuted the tooth-worm theory through microscope
      observation, and that the tooth-worm theory persisted in
      European medicine through the early 18th century. The
      "traceable in part through the long transmission history of
      Akkadian medical-magical material" framing is a more
      interpretive claim — the dental-history consensus holds that
      the tooth-worm idea is widespread across many ancient cultures
      (Egyptian, Chinese, Indian, Mesopotamian) rather than
      Akkadian-specific. The claims doc's careful hedging ("not the
      only source... but the oldest documented instantiation") is
      honest and within scholarly tolerance.

