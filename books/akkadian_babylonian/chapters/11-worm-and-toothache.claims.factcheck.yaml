      under-verified. (h) YOS 11, 5 OB variant — directly verified
      via SEAL (seal.huji.ac.il/node/7193) and via the Cohen-Wasserman
      2008 *RA* 102 article. The cosmogonic chain "Anu begot the sky,
      the sky bore the earth, the earth bore the stench, the stench
