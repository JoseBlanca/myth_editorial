  - finding_id: F-2
    claim_number: "claims 7, 8 (cosmogonic chain step count); brief line 2166"
    kind: INTERNAL-VARIANCE
    severity: MEDIUM
    claim: |
      "The composition opens with a seven-step cosmogonic sequence:
      Anu created heaven; heaven created earth; earth created rivers;
      rivers created canals (irrigation ditches); canals created
      marsh; marsh created mud; mud created the worm. (Some
      translations group the sequence as six steps by combining marsh
      and mud into one node.)"
    issue: |
      The seven-step chain with **canals + marshes + mud** as three
      separate intermediates is not directly attested in any
      accessible English translation. Verified accessible translations
      have either:
      - **Speiser ANET 1969 (5 steps)**: Anu → heaven → earth →
        rivers → marsh → worm (NO canals, NO mud).
      - **Foster / ETANA-reproduction (6 steps)**: Anum → heavens →
        earth → rivers → irrigation ditches → mud → maggot (NO
        marsh; rivers → ditches → mud).
      - **Lewis Spence 1916 / Tota.world (5 stages)**: Anu → heavens
        → earth → rivers → canals → marshes → worm (NO mud).
      - **HubPages (6 steps)**: Anu → heavens → earth → rivers →
        canals → mud → worm (NO marsh).
      - **YOS 11, 5a (OB variant; 6 steps)**: Anu → sky → earth →
        stench → mud → fly → worm (entirely different intermediates).
      The claims doc's seven-step "Anu → heavens → earth → rivers →
      canals → marshes → mud → worm" appears to be an editorial
      conflation of multiple translations. The most authoritative
      Foster-likely version (the ETANA reproduction, which uses
      "Anum" — Foster's transliteration spelling — and which dates
      to the relevant period of Foster's anthology updates) has 6
      steps with **rivers → ditches → mud → worm** (NO marsh as a
      separate node). The Speiser ANET version is 5 steps with
      **rivers → marsh → worm** (NO canals, NO mud). The claims
      doc's parenthetical caveat "Some translations group the
      sequence as six steps by combining marsh and mud into one
      node" partially acknowledges variance but does not capture
      the actual situation. Severity MEDIUM because: (a) the
      step-count is load-bearing for the claim that the worm is
      "the seventh and final term of the cosmogonic chain" (claim 8,
      line 53); (b) the step-count framing structures the chapter's
      analysis of the cosmogonic typology (the INFERENCE marker at
      line 57); (c) without direct access to Foster 2005 pp. 995–996,
      the seven-step claim cannot be fully verified, but the
      ETANA-reproduction (which is most plausibly Foster's
      translation) has 6 steps. The risk: the chapter may be
      committing to a step-count that is not actually attested in
      Foster.
    evidence: |
      Speiser ANET 1969 (verbatim, via mesopotamiangods.com):
      "After Anu had created heaven, / Heaven had created the earth,
      / The earth had created the rivers, / The rivers had created
      the marsh, / And the marsh had created the worm—" — 5 steps.
      ETANA / Foster-reproduction snippet (verbatim, via Google
      search reproduction): "After Anum had made the heavens, the
      heavens had made the earth, the earth had made the rivers,
      the rivers had made the irrigation ditches, the ditches had
      made the mud, and the mud had made the maggot" — 6 steps,
      NO marsh. Multiple independent reproductions (waxtablets,
      strangehistory, hubpages) are consistent: 5 or 6 steps, never
      7. The claims doc's seven-step framing is not directly
      attested.
    recommended_fix: |
      REQUIRED: revise claim 7 (line 49) to commit to a single
      attested chain. Two options:
      (a) Follow Foster (likely the brief's anchor): "The composition
          opens with a six-step cosmogonic sequence: Anu created
          heaven; heaven created earth; earth created rivers; rivers
          created irrigation ditches; ditches created mud; mud
          created the worm. (Some translations of the same Akkadian
          text render the chain in five steps, by combining ditches
          and mud into a single 'marsh' node.) The chain is
          hierarchical and sequential — each step generates the
          next, descending from the cosmological summit (Anu, the
          sky-god) to the lowest creature (the worm)."
      (b) Follow Speiser (5 steps), with a note that Foster's
          translation expands to 6 steps.
      Either way, claim 8 (line 53) needs adjustment: "The worm
      *tūltu* is the SIXTH (or fifth, per Speiser) and final term
      of the cosmogonic chain." The INFERENCE marker at line 57
      may also need light adjustment to reflect the corrected
      step-count. Recommend option (a) since the brief locks
      Foster 2005 as the anchor; this requires direct verification
      of Foster 2005 pp. 995–996 by the human reviewer or
      post-human-normalize stage.

  - finding_id: F-3
    claim_number: "VARIANT marker (line 97); claim 13 (line 99); footnote 17"
    kind: CITATION-WRONG
    severity: MEDIUM
    claim: |
      "[VARIANT: ... alt=YOS 11, 5 (Hussey-van Dijk publication), an
      Old Babylonian variant cosmogonic-chain incantation involving
      worms ...] ... 'Anu begot heaven, heaven brought forth earth,
      Earth bore stench, stench bore mud, Mud bore fly, fly bore worm'."
    issue: |
      Two related citation issues:
      (a) **Author-order**: the publication is **van Dijk, Goetze,
          and Hussey 1985** (*Early Mesopotamian Incantations and
          Rituals*, Yale Oriental Series 11). The standard short
          citation is "van Dijk/Goetze/Hussey 1985" or "van Dijk
          et al. 1985"; the brief's and claims doc's "Hussey-van
          Dijk" inverts the order and drops Goetze entirely. The
          first author is van Dijk (Jan), not Hussey.
      (b) **Siglum precision**: the cosmogonic chain "Anu begot
          heaven... fly bore worm" is at YOS 11, 5a lines 1–3 —
          the "a" portion of the tablet YBC 4616. The same tablet
          has a "b" portion (YOS 11, 5b) which is a Gula-and-dogs
          incantation against fly and scorpion. Citing as "YOS 11, 5"
          (without sub-letter) is acceptable shorthand but slightly
          under-specified; the more precise siglum is YOS 11, 5a.
      (c) **Generic vs. specific**: the YOS 11, 5a incantation is
          described as "an Old Babylonian variant cosmogonic-chain
          incantation involving worms". This is correct. However,
          it should be flagged that YOS 11, 5a is NOT a toothache
          incantation — it is a worm/leech-against-infant
          incantation invoking Gula. The cosmogonic chain "Anu →
          sky → earth → stench → mud → fly → worm" is a
          structurally-similar but textually-distinct tradition.
          The claims doc's framing "the relationship between the
          OB variant and the first-millennium *Worm and the
          Toothache* is interesting comparative material but the
          chapter focuses on the first-millennium recension" is
          honest and within tolerance, but the specific genre
          difference (anti-leech vs. anti-toothache) deserves
          explicit mention.
      Severity MEDIUM because: (a) the citation order is
      bibliographically incorrect; (b) the siglum precision is
      under-specified; (c) the genre-difference framing should
      be sharpened.
    evidence: |
      Yale Oriental Series listing (verbatim, via search):
      "Early Mesopotamian Incantations and Rituals (Yale Oriental
      Series, Babylonian Texts, Vol. XI), authors: Goetze, Albrecht;
      Hussey, Mary I.; Van Dijk, Jan, 1985, Yale University Press,
      ISBN 9780300031478." Standard catalogue listing puts the
      authors alphabetically: Goetze, Hussey, Van Dijk. However,
      the conventional cuneiform-publication shorthand is "van
      Dijk/Goetze/Hussey 1985" (with van Dijk first, as he was
      the lead editor). The "Hussey-van Dijk" form is non-standard
      and drops Goetze. SEAL (seal.huji.ac.il/node/7193) directly
      confirms the YOS 11, 5a (worm/leech incantation; tablet YBC
      4616 from Larsa area; Gula's daughter; targets children's
      blood and ocular damage). The cairn.info Cohen-Wasserman
      2008 article confirms the cosmogonic chain at lines 1-3 of
      YOS 11, 5a.
    recommended_fix: |
      REQUIRED: revise the VARIANT marker (line 97) and footnote
      17 (line 99) to:
      - Cite the publication as "van Dijk, Goetze, and Hussey
        1985, *Early Mesopotamian Incantations and Rituals* (Yale
        Oriental Series 11)" or shorthand "van Dijk et al. 1985".
        Drop "Hussey-van Dijk".
      - Specify the siglum as YOS 11, 5a (or note "YOS 11, 5
        (specifically the 5a portion of YBC 4616)").
      - Clarify the genre difference: "an Old Babylonian
        worm/leech-against-infant incantation invoking Gula, with
        a different cosmogonic chain ('Anu begot heaven, heaven
        brought forth earth, Earth bore stench, stench bore mud,
        Mud bore fly, fly bore worm') ending in the worm. The OB
        text is a structurally-similar but textually-distinct
        tradition — not a toothache incantation per se but an
        anti-pest incantation that shares the worm-cosmogony
        pattern."

