  - finding_id: F-5
    claim_number: "claim 11 (worm's defiance verbatim quote, line 70)"
    kind: INTERNAL-VARIANCE
    severity: LOW
    claim: |
      "'What good is the ripe fig and the apricot? Lift me up, and
      let me dwell between the teeth and the gums! I will suck the
      blood of the tooth, and I will gnaw on the bone of the jaw!'"
    issue: |
      The claims doc quotation differs from the canonical Speiser
      ANET 1969 wording in two respects:
      - Speiser: "Lift me up, and **assign me to the teeth and the
        gums**" — claims doc: "Lift me up, and **let me dwell
        between** the teeth and the gums". Variant verb;
        "assign / let me dwell between" are different phrasings
        but the underlying request is the same.
      - Speiser: "I will suck the blood of the tooth, and I will
        **gnaw its roots**" — claims doc: "I will suck the blood
        of the tooth, and I will **gnaw on the bone of the jaw**".
        This is a more substantive variance: Speiser's "gnaw its
        roots" (i.e., the tooth's roots) becomes "gnaw on the bone
        of the jaw" in the claims doc. The wider scholarly
        literature has both formulations: the strangehistory.net
        version is closer to "gnaw on the gums / jaw" while
        hubpages.com has "mince up the gum". Multiple translation
        variants exist; the claims doc's wording is plausibly
        Foster's (which I cannot directly verify).
      Severity LOW because: (a) the substantive content is
      consistent across all attestations (the worm wants to dwell
      in human teeth and gums and gnaw the tooth's substance);
      (b) the variance is at the level of translation choice
      (Foster vs. Speiser), not at the level of factual error;
      (c) the claims doc's wording is plausibly Foster's
      translation. The variance is within acceptable
      verbatim-paraphrase tolerance.
    evidence: |
      Speiser ANET 1969 (verbatim, via mesopotamiangods.com):
      "'What good is the ripe fig and the apricot? Lift me up,
      and assign me to the teeth and the gums! I will suck the
      blood of the tooth, and I will gnaw its roots!'"
      Multiple secondary reproductions show the wider variance:
      hubpages.com ("mince up the gum"); strangehistory.net
      (the worm wants to dwell in teeth and gums and gnaw the
      gum/jaw); Spence 1916 ("devour the blood of the teeth and
      the strength thereof"). The claims doc's wording is one
      attested variant.
    recommended_fix: |
      Optional: confirm at post-human-normalize that the claims-
      doc wording matches Foster 2005 pp. 995–996 verbatim. If
      it does, no change needed. If Foster's wording differs,
      adjust to Foster's exact wording or convert the
      block-quote to a paraphrase with explicit attribution.
      No substantive correction required at the factcheck stage.

