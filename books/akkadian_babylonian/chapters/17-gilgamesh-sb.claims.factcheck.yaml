findings:
  - finding_id: F-1
    claim_number: 3
    location: "line 33 (comment block) and line 67 (body): 'Late Babylonian *Catalogue of Texts and Authors* (Lambert's list, ca. 1200 BCE)'"
    kind: FACTUAL-ERROR
    severity: MEDIUM
    claim: "The Catalogue of Texts and Authors is dated ca. 1200 BCE and is called 'Lambert's list'."
    issue: |
      Two problems with this framing:

      (a) **Dating error**: The Catalogue of Texts and Authors is
          NOT dated ca. 1200 BCE. Per Wikipedia s.v. Catalogue of
          Texts and Authors (citing Lambert 1962 and Mitto 2022):
          the catalogue is "tentatively dated at some point between
          the 10th (the plausible composition date of the latest
          works included in it) and 7th centuries BCE (the date of
          its earliest manuscripts)." The surviving manuscripts are
          (i) 7th-century Nineveh (Ashurbanipal's library) and
          (ii) Hellenistic or Arsacid Babylon. The chapter has
          conflated the (estimated) date of Sîn-lēqi-unninni
          himself (late 2nd millennium BCE, ca. 1300–1000 BCE) with
          the date of the catalogue that names him (first
          millennium BCE).

      (b) **Internal contradiction**: The chapter calls the catalogue
          both "Late Babylonian" (= first millennium BCE) AND "ca.
          1200 BCE" in the same phrase (line 33). Late Babylonian
          and ca. 1200 BCE are not the same period. "Late
          Babylonian" is correct for the latest manuscripts; "ca.
          1200 BCE" is incorrect for the catalogue itself.

      (c) **"Lambert's list" is misleading**: Lambert PUBLISHED the
          catalogue in 1962 (JCS 16: 59-77) as "A Catalogue of
          Texts and Authors". He did not author it. The phrase
          "Lambert's list" is a common shorthand but readers
          unfamiliar with the literature may be misled into
          thinking Lambert is the cataloguer rather than the
          modern editor. The brief itself refers to it as the
          "*Catalogue of Texts and Authors* (KAR 158 = K. 9717+
          Tablet IV)" with no "ca. 1200 BCE" dating — the writer
          appears to have introduced the date themselves.

      This is a load-bearing claim: the redactor-as-author framing
      of Sîn-lēqi-unninni rests on the catalogue's testimony, and
      a wrong date for the testimony weakens the [INFERENCE:]
      marker at line 112. The catalogue's first-millennium-BCE
      date is consistent with its role as the late tradition's
      ascription of authorship to a late-2nd-millennium scholar
      — but the chapter as it stands conflates the two.
    evidence: |
      Wikipedia s.v. Catalogue of Texts and Authors (WebFetch):
      "tentatively dated at some point between the 10th... and 7th
      centuries BCE"; manuscripts from "7th century Nineveh and
      Hellenistic or Arsacid Babylon".
      Lambert 1962, "A Catalogue of Texts and Authors", JCS 16
      (3): 59-77 — Lambert as MODERN editor.
    recommended_fix: |
      At line 33 and line 67, replace "Late Babylonian *Catalogue
      of Texts and Authors* (Lambert's list, ca. 1200 BCE)" with
      "first-millennium *Catalogue of Texts and Authors*
      (preserved on Neo-Assyrian and Late Babylonian manuscripts;
      published by Lambert 1962 [JCS 16: 59-77])". Optionally add
      a note that the catalogue's date (10th-7th c. BCE for
      composition; 7th c. BCE Nineveh and Hellenistic/Arsacid
      Babylon for the surviving manuscripts) is distinct from the
      conventionally inferred date of Sîn-lēqi-unninni himself
      (late 2nd millennium BCE, ca. 1300-1000 BCE). The INFERENCE
      marker at line 112 can stand; only the dating phrase needs
      correction.

  - finding_id: F-2
    claim_number: 17
    location: "line 233: 'with its third snort three hundred'"
    kind: UNVERIFIED
    severity: LOW
    claim: "The Bull of Heaven's first snort opens a pit swallowing 100 men, second 200, third 300."
    issue: |
      The 100-and-200 progression is well-attested across translation
      mirrors and Wikipedia s.v. Bull of Heaven. The third-snort
      300-men extension is plausible — the SB Tablet VI pit-
      enumeration uses escalating numbers, and George 2003's text
      reads with a third stage in some manuscripts — but the
      third-snort detail is not explicitly confirmed in the open-
      web triangulation accessible in this audit. Foster 2005's
      translation should be checked to confirm; the chapter's
      framing is likely correct but the third stage may be
      restored from manuscript variants rather than uniformly
      attested. This is a minor LOW-severity verification item.
    evidence: |
      Wikipedia s.v. Bull of Heaven (WebFetch): "The Bull's first
      breath blows a hole in the ground so large that one hundred
      men fall into it, while its second breath creates a hole
      larger still, which traps two hundred more." No mention of
      third breath.
    recommended_fix: |
      Verify against Foster 2005 p. 162-166 and Dalley 2008 pp.
      82-86 at human-review stage 12a. If George 2003 attests
      the third snort, retain "three hundred"; if it is restored
      or variant, hedge with "and so on" or "in escalating
      sequence". No structural change required.

  - finding_id: F-3
    claim_number: 3
    location: "line 33 (comment block), line 67 (body), and line 112 (INFERENCE marker): Sîn-lēqi-unninni's role"
    kind: HEDGING-NEEDED
    severity: MEDIUM
    claim: "Sîn-lēqi-unninni as redactor of the SB form; the [INFERENCE:] framing."
    issue: |
      The chapter's redactor-as-author framing is essentially
      correct, and the [INFERENCE:] marker at line 112 hedges
      appropriately ("redactor-as-author framing rather than an
      attestation that Sîn-lēqi-unninni *composed* the epic").
      However, two related framings would benefit from sharper
      hedging:

      (a) **"Sîn-lēqi-unninni's redaction (or earlier MB redactions)"**
          (line 335): this hedge is good; it acknowledges that the
          precise locus of incorporation of the Atra-ḫasīs flood
          material may pre-date Sîn-lēqi-unninni. Keep.

      (b) **The catalogue notice as "the only named-author trace"**
          (line 67): correct, but should clarify that the catalogue
          is first-millennium evidence (not late-2nd-millennium
          colophon evidence). Sîn-lēqi-unninni's name DOES appear
          in colophons of the SB Gilgameš manuscripts as well — this
          is what most directly anchors the attribution to the SB
          text. The brief's entities_glossary (line 85) correctly
          says "his name appears in colophons"; the chapter body
          could foreground this colophon evidence alongside the
          catalogue.

      The "ca. 1200 BCE" date for the catalogue (separate F-1)
      is part of this finding's cluster — the chapter's overall
      Sîn-lēqi-unninni framing is internally consistent only if
      the catalogue date is corrected.
    evidence: |
      BMCR review of George 2003: "supposedly as edited by one
      Sin-leqi-unninni some time in the late second millennium
      BCE" — confirming the redactor-not-author framing and the
      late-2nd-millennium dating for Sîn-lēqi-unninni HIMSELF
      (distinct from the catalogue dating).
      Wikipedia s.v. Sîn-lēqi-unninni: name appears in "colophons"
      of SB tablets.
    recommended_fix: |
      At line 67, augment the catalogue-notice framing to also
      mention SB-colophon evidence: "named in the late
      *Catalogue of Texts and Authors* (first millennium BCE)
      and in colophons of SB Gilgameš manuscripts at Nineveh and
      other centres" — this strengthens the attribution by citing
      both the catalogue and the colophon traces, and (with the
      F-1 fix) corrects the dating. No structural change
      required.

  - finding_id: F-4
    claim_number: 35
    location: "lines 40-46, 355, 394: 'partial Akkadian translation of the second half of the Sumerian Gilgameš, Enkidu, and the Netherworld'"
    kind: HEDGING-NEEDED
    severity: LOW
    claim: "Tablet XII is a 'partial Akkadian translation' of the second half of the Sumerian poem."
    issue: |
      The chapter's "partial" framing is somewhat understated.
      Multiple open-web sources describe Tablet XII as a "literal,
      word-for-word translation" of the second half of the Sumerian
      poem — i.e., the translation is LITERAL (where it appears)
      and PARTIAL (only the second half is translated). The
      chapter's "partial Akkadian translation" implies less-than-
      complete-translation-of-what-it-covers; the more accurate
      framing is "a literal Akkadian translation of the second
      half" (literal in technique, partial only in scope). This
      is a minor framing refinement, not a factual error — the
      chapter's "partial" is defensible if read as "covering only
      part" of the Sumerian source.
    evidence: |
      Wikipedia s.v. Epic of Gilgamesh: "Tablet XII is a literal,
      word-for-word translation of the last part of Gilgamesh,
      Enkidu, and the Netherworld" (note the "literal" framing).
      Spoken Past blog (third-party summary of Tablet XII):
      "While most of the parts of the epic are free adaptations
      of their respective Sumerian predecessors, Tablet XII is a
      literal, word-for-word translation of the last part of
      Gilgamesh, Enkidu, and the Netherworld".
    recommended_fix: |
      Optional refinement: at lines 40-46, 355, and 394, consider
      rephrasing "partial Akkadian translation of the second half"
      as "literal Akkadian translation of the second half"
      (literal in technique; partial only in that it covers only
      the second half of the Sumerian source). This sharpens
      Tablet XII's distinctive textual status as the one place
      where the Akkadian Gilgameš tradition translates a Sumerian
      Gilgameš source rather than recomposing from it. Not a
      factual fix; a precision improvement.

