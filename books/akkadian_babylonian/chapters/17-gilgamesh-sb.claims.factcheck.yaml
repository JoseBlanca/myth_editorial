writer_flagged_for_scrutiny_resolution:
  - flag_id: 1
    flag: "Sîn-lēqi-unninni's redactorship — Catalogue of Texts and Authors (KAR 158 = K. 9717+ Tablet IV) names him; verify framing is hedged."
    resolution: UPHELD-WITH-HEDGE
    detail: |
      The chapter's redactor-not-author framing is essentially correct
      and is supported by George 2003's reading of the catalogue and
      by independent open-web triangulation. Sîn-lēqi-unninni is the
      named tradent associated with the Gilgameš series in the
      Catalogue; the [INFERENCE:] marker at line 112 hedges
      appropriately ("redactor-as-author framing rather than an
      attestation that Sîn-lēqi-unninni *composed* the epic"; "the
      catalogue notice is sparse, and the precise scope of his
      editorial intervention is reconstructed rather than directly
      attested"). HOWEVER — the chapter's dating of the catalogue at
      "ca. 1200 BCE" (line 33 and line 67) is INCORRECT. The
      Catalogue of Texts and Authors is conventionally dated 10th–
      7th centuries BCE (Lambert 1962; the surviving manuscripts are
      Neo-Assyrian Nineveh and Hellenistic/Arsacid Babylon). The
      chapter has conflated the (estimated) date of Sîn-lēqi-unninni
      HIMSELF (late 2nd millennium BCE) with the date of the
      CATALOGUE that names him (first millennium BCE). The label
      "Late Babylonian *Catalogue of Texts and Authors* (Lambert's
      list, ca. 1200 BCE)" is also internally contradictory: Late
      Babylonian is first millennium BCE, not ca. 1200. The
      "Lambert's list" framing is also misleading — Lambert
      PUBLISHED the catalogue in 1962; he did not author it. See
      F-1 (MEDIUM) and F-3 (MEDIUM).
  - flag_id: 2
    flag: "Two prologues co-present — ša naqba īmuru (late) AND šūtur eli šarrī (older); verify George 2003 attests both within SB manuscripts."
    resolution: UPHELD
    detail: |
      Confirmed across multiple open-web sources (Wikipedia s.v.
      Epic of Gilgamesh; s.v. Sîn-lēqi-unninni; lostmediawiki
      summary). The SB Tablet I opens with *ša naqba īmuru* (the
      late-recension prologue) and retains *šūtur eli šarrī* as the
      inner hymnic opening of the older Akkadian Gilgameš tradition.
      George 2003 vol. 1's reconstruction of the relationship is
      cited correctly. The [VARIANT:] marker at line 110 handles
      the doubling correctly as "structural rather than narrative"
      and notes the OB forerunners lack the late-recension prologue.
      Supported.
  - flag_id: 3
    flag: "Tablet XII as appendix — verify (a) second half, not first; (b) translation, not free adaptation; (c) Enkidu alive in XII."
    resolution: UPHELD
    detail: |
      All three sub-claims verified:
      (a) **Second half, not first**: Confirmed across multiple
          open-web sources. The Sumerian *Gilgameš, Enkidu, and the
          Netherworld* (ETCSL 1.8.1.4) has a long mythological
          prologue and an episodic first half; Tablet XII translates
          the SECOND half (the *pukku/mekkû*-lost-to-the-underworld
          / Enkidu-descends / underworld-fates dialogue).
      (b) **Translation, not free adaptation**: STRENGTHENED in fact
          — multiple open-web sources describe Tablet XII as "a
          literal, word-for-word translation of the last part of
          Gilgamesh, Enkidu, and the Netherworld" — even MORE
          literal than the chapter's "partial Akkadian translation"
          framing suggests. The chapter's "partial" is correct in
          the sense that only the second half is translated; the
          translation itself is literal/verbatim where it appears.
          See F-4 (LOW) for a minor refinement opportunity.
      (c) **Enkidu alive in XII**: Confirmed. The chapter handles
          the continuity break correctly (lines 44, 362, 368). The
          [VARIANT:] marker at line 368 documents the issue
          explicitly.
  - flag_id: 4
    flag: "Tablet XI as Atra-ḫasīs intertext — direction of borrowing (FROM Atra-ḫasīs, not the reverse)."
    resolution: UPHELD
    detail: |
      Confirmed. The chapter (line 335) states "The Tablet XI flood
      narrative is borrowed from the Akkadian *Atra-ḫasīs* tradition
      (chapter 2), incorporated into the SB Gilgameš epic by the
      Sîn-lēqi-unninni redaction (or earlier MB redactions)." This
      is the consensus scholarly view (Tigay 1982; Lambert & Millard
      1969 demonstration; George 2003 traces verbal correspondences).
      The direction of dependence is from Atra-ḫasīs INTO Gilgameš
      XI, not the reverse. The "or earlier MB redactions" hedge is
      appropriate — the precise locus of incorporation (Sîn-lēqi-
      unninni vs. MB intermediate redaction) is not directly
      attested. The Uta-napišti / Atra-ḫasīs name-equation in the
      late tradition is also confirmed (Uta-napišti is given the
      epithet *Atra-ḫasīs* in Tablet XI). Supported.
  - flag_id: 5
    flag: "Bull of Heaven — Tablet VI; verify Ištar's marriage proposal preceded the Bull; Anu's reluctance and seven-year drought; Enkidu's death sentence linked to Bull-killing."
    resolution: UPHELD
    detail: |
      All sub-claims verified:
      - Ištar's marriage proposal in Tablet VI precedes the Bull
        sequence ✓
      - Anu warns of seven-year famine; Ištar provisions seven years
        in advance ✓ (chapter line 233 captures this correctly)
      - Enkidu's death sentence in Tablet VII is linked to BOTH
        the slaying of Ḫumbaba (Tablet V) and the slaying of the
        Bull of Heaven (Tablet VI) ✓ — the chapter is correct that
        the divine council weighs both offences (chapter line 239,
        248); Wikipedia s.v. Bull of Heaven foregrounds the Bull-
        killing but the SB Tablet VII text names both.
      - Enkidu's thigh-throwing gesture at Ištar ✓
      - The 100/200 snort-pit progression ✓ (third-snort-300 is the
        only sub-detail not directly confirmed in open-web
        triangulation; see F-2 LOW).
      Supported overall.
  - flag_id: 6
    flag: "Mt Māšu and Šiduri — Tablets IX–X; verify geographic / cosmological framing."
    resolution: UPHELD
    detail: |
      Confirmed:
      - Mt Māšu as twin-peaked mountain at the edge of the world ✓
      - Šamaš passes through the tunnel beneath each day ✓
      - Scorpion-People (girtablilû) guard the entrance ✓
      - 12 double-hours through the tunnel ✓
      - Jewelled garden of the gods on the far side ✓
      - Šiduri the tavern-keeper / alewife at the cosmic shore ✓
      - In the SB recension, Šiduri directs Gilgameš to Ur-šanabi
        (chapter line 308) — this is correct for the SB recension;
        OB Sippar tablet preserves a longer Šiduri wisdom-discourse
        that the SB recension truncates (an OB→SB difference that
        the chapter does not foreground but does not need to).
      Supported.
  - flag_id: 7
    flag: "Plant of rejuvenation / snake — Tablet XI ending; verify Foster 2005 and Dalley 2008 wording."
    resolution: UPHELD
    detail: |
      Confirmed:
      - Plant grows in the freshwater Apsû ✓ (chapter line 341
        "thorny plant growing in the freshwater Apsû")
      - Gilgameš dives with stones tied to his feet ✓
      - Snake takes the plant during the bathing-stop ✓
      - Snake-shedding etiology built into the loss ✓
      - Closing ring on Uruk's walls answering the šūtur eli šarrī
        opening ✓ (chapter line 347 ring-composition reading)
      - Foster 2005 pp. 219–220 and Dalley 2008 pp. 124–125 page-
        anchors are consistent with the text-range expected.
      Supported.
  - flag_id: 8
    flag: "Composite-editorial classification — verify SB is distinct from OB Gilgameš (different composition, not forerunner-recension in George's terminology); verify cross-fill discipline."
    resolution: UPHELD
    detail: |
      Confirmed:
      - George 2003 treats OB and SB as distinct textual traditions
        (BMCR review: "the older versions of the Epic" presented
        separately from "The Standard Babylonian epic"; the SB epic
        is described as "in complete contrast to its forerunners").
        George's framing supports the brief's COMPOSITE-EDITORIAL
        classification.
      - The chapter correctly characterises OB material as
        "forerunners" rather than as merely earlier recensions of
        the same composition (chapter lines 17, 80, 372); OB is
        used as cross-fill donor only for SB Tablet IV's Cedar
        Forest journey, with explicit [RECONSTRUCTION:] marker
        naming the donor recension and dialect (line 92).
      - MB material (Boğazköy, Megiddo, Ur, Nippur) is documented
        as Late Bronze diffusion attestation (line 80, 397), not
        used as silent cross-fill.
      - Sumerian Gilgameš poems are explicitly comparative-only,
        not cross-fill donors (lines 137, 394); the only Akkadian
        engagement with a Sumerian Gilgameš source is Tablet XII's
        partial translation, which is correctly flagged as
        editorial appendix.
      Cross-fill discipline is sound. Supported.

supported_claims:
  - claim_number: 1
    claim: "Some 80 first-millennium SB manuscripts from Nineveh, Aššur, Sultantepe, Sippar, Babylon, Uruk; OB and MB forerunners; no single ms preserves the entire 12-tablet epic."
    source_id: george-2003
    source_loc: "vol. 1, manuscript catalogue"
    verbatim_quote: |
      Triangulated via Wikipedia s.v. Epic of Gilgamesh and BMCR
      review of George 2003: George's vol. 1 catalogues the multi-
      manuscript dossier; the SB recension is preserved across
      multiple Mesopotamian centres; no single complete witness.

  - claim_number: 2
    claim: "12-tablet canonical SB shape; Tablets I-XI integral; Tablet XII editorial appendix."
    source_id: george-2003
    source_loc: "vol. 1, introduction"
    verbatim_quote: |
      Wikipedia s.v. Epic of Gilgamesh: Tablet XII "is mainly an
      Akkadian translation of an earlier Sumerian poem... a sequel
      to the original 11"; "Enkidu is still alive, despite having
      died earlier in the epic". The 12-tablet shape is the
      canonical SB form; Tablet XII is structurally distinct.

  - claim_number: 3
    claim: "SB recension attributed to Sîn-lēqi-unninni in the Catalogue of Texts and Authors."
    source_id: george-2003
    source_loc: "vol. 1, introduction (Sîn-lēqi-unninni attribution)"
    verbatim_quote: |
      Wikipedia s.v. Sîn-lēqi-unninni: Sîn-lēqi-unninni "lived...
      probably in the period between 1300 BC and 1000 BC"; his
      version identified by "ša nagba īmuru" incipit; later Uruk
      families traced ancestry to him. Catalogue of Texts and
      Authors (Lambert 1962) names him as the tradent of the
      Gilgameš series. Attribution supported; dating of the
      catalogue itself needs correction (see F-1).

  - claim_number: 4
    claim: "Two prologues co-present in SB Tablet I — ša naqba īmuru (late) and šūtur eli šarrī (older)."
    source_id: george-2003
    source_loc: "vol. 1, Tablet I"
    verbatim_quote: |
      Wikipedia s.v. Epic of Gilgamesh: "the older version begins
      with the words 'Surpassing all other kings'" (šūtur eli
      šarrī); the SB version opens with "He who saw the deep" (ša
      naqba īmuru). The two are co-present in SB Tablet I per
      George 2003's reconstruction.

  - claim_number: 5
    claim: "Aruru creates Enkidu in the wilderness as Gilgameš's counterpart."
    source_id: george-2003
    source_loc: "vol. 1, Tablet I"
