  honesty_self_check:
    q1_opened_or_skimmed: |
      I did NOT have direct access to the brief's locked principal
      anchors:
      - George 2003, *The Babylonian Gilgamesh Epic*, 2 vols. (Oxford
        University Press): vol. 1 PDF mirror at SOAS eprints redirects
        to repository landing page; no readable in-text preview
        retrievable in this audit window. The SOAS-deposited PDF is
        the definitive critical edition and is the load-bearing
        primary anchor for nearly every chapter claim; not directly
        opened here.
      - Foster 2005, *Before the Muses*, pp. 99–220: CDL Press
        paywalled; no readable preview of these pages was directly
        accessible.
      - Dalley 2008, *Myths from Mesopotamia*, pp. 39–153: OUP World's
        Classics; no readable preview accessible.
      - Lambert & Millard 1969, *Atra-Ḫasīs*: archive.org mirror
        exists but the page-level dependency analysis for SB
        Gilgameš XI was triangulated via Wikipedia's Gilgamesh-flood-
        myth article (which cites Lambert & Millard) and Tigay 1982
        secondary summaries rather than from the 1969 primary.
      - Black & Green 1992 s.v. Gilgameš / Enkidu / Ḫumbaba / Bull of
        Heaven / Uta-napišti: paywalled; not directly opened.
      - Bottéro 2001 *Religion in Ancient Mesopotamia*: print-only;
        not directly opened.
      - Foster 2007 pp. 1–20: print-only; not directly opened.
      - Noegel 2005 pp. 233–245: print-only; not directly opened.

      I DID independently verify the following via open web:
      (a) **Wikipedia s.v. Epic of Gilgamesh** (WebFetch). Confirmed:
          two-prologue structure; *ša naqba īmuru* is the SB
          (Sîn-lēqi-unninni) opening; *šūtur eli šarrī* is the
          older opening, retained inside; "Tablet XII is mainly an
          Akkadian translation of an earlier Sumerian poem" and "a
          sequel to the original 11"; "Enkidu is still alive, despite
          having died earlier in the epic"; 12 double-hours through
          Šamaš's tunnel at Mt Māšu in Tablet IX; snake-and-shed-skin
          etiology in Tablet XI; "edited by Sîn-lēqi-unninni" (he is
          editor not author).
      (b) **Wikipedia s.v. Sîn-lēqi-unninni** (WebFetch). Confirmed:
          Sîn-lēqi-unninni "lived... probably in the period between
          1300 BC and 1000 BC"; he is "compiler" / "redactor"; his
          version identified by "ša nagba īmuru" incipit; later Uruk
          families traced their ancestry to him.
      (c) **Wikipedia s.v. Catalogue of Texts and Authors** (WebFetch).
          CRITICAL FINDING: the Catalogue is "tentatively dated at
          some point between the 10th (the plausible composition
          date of the latest works included in it) and 7th centuries
          BCE (the date of its earliest manuscripts)." NOT "ca. 1200
          BCE" as the chapter states (line 33 and line 67). The
          chapter conflates the date of Sîn-lēqi-unninni HIMSELF
          (late 2nd millennium) with the date of the CATALOGUE that
          names him (first millennium, surviving manuscripts from
          7th-century Nineveh and Hellenistic/Arsacid Babylon).
          See F-1 (MEDIUM).
      (d) **Wikipedia s.v. Bull of Heaven** (WebFetch). Confirmed:
          Ishtar's marriage proposal precedes the Bull; Anu warns
          of seven years of famine; Ishtar provides seven years'
          provisions; Enkidu throws the right thigh at Ishtar;
          Anu/Ea/Šamaš decide either Gilgameš or Enkidu must die
          for slaying the Bull; first breath swallows 100 men,
          second 200. The chapter's "third snort three hundred"
          (line 233) is plausible from George 2003 (the snort-pit
          sequence escalates in the SB recension) but only 100/200
          are explicitly confirmed in the open-web triangulation;
          minor verification note (LOW), see F-2.
      (e) **Wikipedia s.v. Gilgamesh flood myth** (WebFetch).
          Confirmed: scholarly consensus that the SB Gilgameš XI
          flood narrative is borrowed FROM the *Atra-ḫasīs* tradition
          (NOT the reverse); Tigay specifically maintains that
          "the flood story in tablet XI was based on a late version
          of the Atrahasis story." The chapter's framing (line 335)
          is correct on direction of dependence.
      (f) **Bryn Mawr Classical Review on George 2003**: confirmed
          George 2003 is the definitive 2-vol critical edition;
          the OB and SB are presented as distinct textual traditions
          ("the older versions of the Epic"... separately from "The
          Standard Babylonian epic"). The framing of OB as forerunner
          rather than as merely an earlier recension of the same
          composition is consistent with the brief's
          composite-editorial classification.
      (g) **maniadelight / spokenpast / ancientmesopotamia.org**
          on Tablet XII: confirmed Tablet XII is "mostly a translation
          of the second half of an earlier Sumerian poem 'Gilgamesh,
          Enkidu and the Netherworld'"; Enkidu alive in XII.
      (h) **scorpion-man / wikipedia**: confirmed Mt Māšu twin-peaked,
          Scorpion-People (girtablilû) guard Šamaš's tunnel; 12
          double-hours; jewelled garden of the gods on far side.
      (i) **Independent Foster / Dalley translation mirrors** for
          Tablet XI: confirmed dove/swallow/raven sequence; "gods
          smelled the sweet savour and gathered like flies"; Mt
          Nimuš (newer reading of Nisir) as landing point;
          snake-and-shedding etiology.

    q2_triangulated_or_assumed: |
      Open-web triangulation performed on: the two-prologue structure;
      Sîn-lēqi-unninni as redactor (not original author); the
      Catalogue of Texts and Authors dating (CRITICAL FINDING — the
      chapter's "ca. 1200 BCE" dating is too early); Tablet XII as
      "second half" of Sumerian *Gilgameš, Enkidu, and the
      Netherworld* and as "literal translation" rather than "free
      adaptation" (chapter says "partial Akkadian translation"; the
      "literal/word-for-word" framing in open-web sources slightly
      strengthens the chapter's claim — Tablet XII is more literal
      than adaptive); Enkidu-alive-in-XII; Tablet XI's direction of
      dependence on Atra-ḫasīs (chapter is correct on direction);
      Tablet VI Ištar-proposal-precedes-Bull and Anu seven-year
      drought; Mt Māšu / Scorpion-People / 12 double-hours; plant
      of rejuvenation / snake-and-shedding; OB vs. SB as distinct
      compositional traditions in George 2003.

      Taken on trust (no direct primary access in this audit, but
      consistent with the secondary triangulation):
      - Exact page-anchors in Foster 2005 (pp. 99–220), Dalley 2008
        (pp. 39–153), Foster 2007 (pp. 1–20), Noegel 2005
        (pp. 233–245). The page-ranges are consistent with the
        chapter's coverage; individual claims triangulated via
        open-web verbatim translation mirrors.
      - George 2003 specific apparatus-level claims about
        manuscript joins (Sultantepe+Nineveh for Tablet VII opening;
        OB Schøyen/Sippar cross-fill for Tablet IV); these are
        documented in the brief and consistent with the standard
        critical-edition practice.
      - Black & Green 1992's specific s.v. entries.
      - Bottéro 2001's commentary on the SB epic's wisdom register.
      - Lambert & Millard 1969's specific verbal-correspondence
        analysis for SB Gilgameš XI ↔ Atra-ḫasīs (triangulated via
        Tigay 1982 and Wikipedia's Gilgamesh-flood-myth coverage,
        which cites Lambert & Millard for the direction of borrowing).

    q3_real_quote_or_pattern_match: |
      For SUPPORTED verdicts: pattern-matched against Wikipedia's
      Gilgamesh, Sîn-lēqi-unninni, Catalogue of Texts and Authors,
      Bull of Heaven, Gilgamesh flood myth, Scorpion man, Urshanabi
      articles; Bryn Mawr Classical Review of George 2003;
      independent translation mirrors (gatewaystobabylon and
      similar). No verbatim primary quotations of George 2003's
      Akkadian text are introduced by the chapter; the chapter
      cites George's framing rather than quoting it verbatim, so
      the verbatim-fabrication risk is minimal. The two Akkadian
      incipits cited (*ša naqba īmuru*, *šūtur eli šarrī*) are
      standard transliterations and verified against multiple
      open-web sources.

    q4_internal_variance_vs_contamination: |
      Yes. The chapter is COMPOSITE-EDITORIAL per the brief; OB and
      MB forerunner cross-fills are flagged at [RECONSTRUCTION:]
      markers with dialect/period gaps named (lines 92, 94); the
      Tablet XII compositional break and Enkidu-alive-in-XII problem
      is flagged at [VARIANT:] markers (line 368). The
      Atra-ḫasīs/Gilgameš XI relationship is flagged at COMPARATIVE-
      HOOK (line 390) with the borrowing direction stated correctly.
      No contamination from outside the Akkadian tradition: Sumerian
      Gilgameš poems are explicitly comparative-only (line 137,
      394); Hebrew Bible flood parallel is flagged at COMPARATIVE-
      HOOK (line 396) as typological-not-transmission, reserved for
      influences chapter; Greek epic parallels (line 398) same
      handling. Boğazköy Hittite/Hurrian Gilgameš fragments noted
      as MB diffusion evidence (line 80, 397), not used as cross-
      fill donors.

    q5_same_model_invalidating_audit: |
      No — this audit is in a fresh conversation. The same model
      (claude-opus-4-7) was used for the chapter-claims writing,
      but the fresh-context rule per the skill is satisfied: I have
      no memory of writing this claims document. The skill
      explicitly permits same-model different-fresh-conversation
      when running a different model is impractical.

