registry:
  # ── Primary critical editions ─────────────────────────────────────────

  - id: lambert-2013
    source_tier: primary
    in_scope: true
    author: "Lambert, Wilfred G."
    title: "Babylonian Creation Myths"
    year: 2013
    full_citation: "Lambert, W.G., *Babylonian Creation Myths*, Mesopotamian Civilizations 16 (Winona Lake, IN: Eisenbrauns, 2013)."
    short_citation: "Lambert 2013"
    identifier_type: ISBN
    identifier_value: "9781575062471"
    notes: "The standard critical edition of *Enūma Eliš* and the wider Babylonian creation dossier (*Enmešarra's Defeat*, *Theogony of Dunnu*, *Slaying of Labbu*, *Toil of Babylon*, *Uraš and Marduk*, *Damkina's Bond*, *First Brick*, cosmogonic incantation prologues). Cite for any creation-text textual claim."

  - id: lambert-millard-1969
    source_tier: primary
    in_scope: true
    author: "Lambert, Wilfred G.; Millard, Alan R."
    title: "Atra-Ḫasīs: The Babylonian Story of the Flood"
    year: 1969
    full_citation: "Lambert, W.G., and Millard, A.R., *Atra-Ḫasīs: The Babylonian Story of the Flood* (Oxford: Clarendon Press, 1969)."
    short_citation: "Lambert & Millard 1969"
    identifier_type: ISBN
    identifier_value: "9781575060392"
    notes: "Foundational critical edition of *Atra-ḫasīs*. Reissued by Eisenbrauns 1999 with original pagination preserved. Still the reference text despite later joins."

  - id: george-2003
    source_tier: primary
    in_scope: true
    author: "George, Andrew R."
    title: "The Babylonian Gilgamesh Epic: Introduction, Critical Edition and Cuneiform Texts"
    year: 2003
    full_citation: "George, A.R., *The Babylonian Gilgamesh Epic: Introduction, Critical Edition and Cuneiform Texts*, 2 vols. (Oxford: Oxford University Press, 2003)."
    short_citation: "George 2003"
    identifier_type: ISBN
    identifier_value: "9780199278985"
    notes: "Definitive critical edition of all Akkadian Gilgamesh material — the Standard Babylonian recension of Sîn-lēqi-unninni, the OB and MB forerunners, and every known fragment. Cite for any Gilgamesh textual claim."

  - id: cagni-1969
    source_tier: primary
    in_scope: true
    author: "Cagni, Luigi"
    title: "L'epopea di Erra"
    year: 1969
    full_citation: "Cagni, L., *L'epopea di Erra*, Studi Semitici 34 (Rome: Istituto di Studi del Vicino Oriente, 1969)."
    short_citation: "Cagni 1969"
    identifier_type: corpus-id
    identifier_value: "Studi-Semitici-34"
    notes: "Standard critical edition of *Erra and Išum*. Italian translation; Akkadian text is the reference. See also Cagni's English edition (1977, Sources from the Ancient Near East 1/3) for an accessible translation."

  - id: westenholz-1997
    source_tier: primary
    in_scope: true
    author: "Westenholz, Joan Goodnick"
    title: "Legends of the Kings of Akkade: The Texts"
    year: 1997
    full_citation: "Westenholz, J.G., *Legends of the Kings of Akkade: The Texts*, Mesopotamian Civilizations 7 (Winona Lake, IN: Eisenbrauns, 1997)."
    short_citation: "Westenholz 1997"
    identifier_type: ISBN
    identifier_value: "9780931464850"
    notes: "Critical edition of the Sargon and Narām-Sîn legend cycles, including the *Birth Legend of Sargon*, the *King of Battle* (*šar tamḫāri*), and the *Cuthaean Legend of Narām-Sîn*. Cite for any royal-legend textual claim."

  - id: machinist-1978
    source_tier: primary
    in_scope: true
    author: "Machinist, Peter B."
    title: "The Epic of Tukultī-Ninurta I: A Study in Middle Assyrian Literature"
    year: 1978
    full_citation: "Machinist, P.B., *The Epic of Tukultī-Ninurta I: A Study in Middle Assyrian Literature* (PhD diss., Yale University, 1978)."
    short_citation: "Machinist 1978"
    identifier_type: corpus-id
    identifier_value: "Yale-diss-1978-Machinist"
    notes: "Standard critical edition and study of the *Tukulti-Ninurta Epic*. Cite for any Tukulti-Ninurta textual claim. Foster 2005 (BTM) reproduces a translation drawing on Machinist."

  - id: annus-2001
    source_tier: primary
    in_scope: true
    author: "Annus, Amar"
    title: "The Standard Babylonian Epic of Anzu"
    year: 2001
    full_citation: "Annus, A., *The Standard Babylonian Epic of Anzu*, State Archives of Assyria Cuneiform Texts 3 (Helsinki: Neo-Assyrian Text Corpus Project, 2001)."
    short_citation: "Annus 2001"
    identifier_type: ISBN
    identifier_value: "9789514590498"
    notes: "Critical edition of the SB *Anzû*. For the OB *Anzû* see Vogelzang 1988."

  - id: vogelzang-1988
    source_tier: primary
    in_scope: true
    author: "Vogelzang, Marianna E."
    title: "Bin šar dadme: Edition and Analysis of the Akkadian Anzu Poem"
    year: 1988
    full_citation: "Vogelzang, M.E., *Bin šar dadme: Edition and Analysis of the Akkadian Anzu Poem* (Groningen: Styx, 1988)."
    short_citation: "Vogelzang 1988"
    identifier_type: ISBN
    identifier_value: "9789072371041"
    notes: "Critical edition of the Old Babylonian *Anzû* and analysis of the recensional history. Pair with Annus 2001 for full coverage."

  - id: izreel-2001
    source_tier: primary
    in_scope: true
    author: "Izre'el, Shlomo"
    title: "Adapa and the South Wind: Language Has the Power of Life and Death"
    year: 2001
    full_citation: "Izre'el, S., *Adapa and the South Wind: Language Has the Power of Life and Death*, Mesopotamian Civilizations 10 (Winona Lake, IN: Eisenbrauns, 2001)."
    short_citation: "Izre'el 2001"
    identifier_type: ISBN
    identifier_value: "9781575060484"
    notes: "Standard critical edition of the *Adapa* fragments (Tell Haddad OB, Amarna MB, Nineveh NA). Cite for any *Adapa* textual claim."

  - id: lambert-1960
    source_tier: primary
    in_scope: true
    author: "Lambert, Wilfred G."
    title: "Babylonian Wisdom Literature"
    year: 1960
    full_citation: "Lambert, W.G., *Babylonian Wisdom Literature* (Oxford: Clarendon Press, 1960). Reissued Eisenbrauns 1996 with corrections."
    short_citation: "Lambert 1960"
    identifier_type: ISBN
    identifier_value: "9781575060040"
    notes: "Standard critical edition for nearly the full Akkadian wisdom-and-narrative-wisdom corpus: *Ludlul bēl nēmeqi*, *Babylonian Theodicy*, *Dialogue of Pessimism*, *Counsels of Wisdom*, *Counsels of a Pessimist*; the disputation poems (*The Tamarisk and the Date Palm*, *The Ox and the Horse*, *Nisaba and Wheat*, *The Fable of the Willow*); the *Series of the Fox*; and the Akkadian proverb collections. The reference for the disputations, fables, practical-instruction, and reflective-dialogic genres alike."

  - id: oshima-2014
    source_tier: primary
    in_scope: true
    author: "Oshima, Takayoshi"
    title: "Babylonian Poems of Pious Sufferers: Ludlul Bēl Nēmeqi and the Babylonian Theodicy"
    year: 2014
    full_citation: "Oshima, T., *Babylonian Poems of Pious Sufferers: Ludlul Bēl Nēmeqi and the Babylonian Theodicy*, Orientalische Religionen in der Antike 14 (Tübingen: Mohr Siebeck, 2014)."
    short_citation: "Oshima 2014"
    identifier_type: ISBN
    identifier_value: "9783161536366"
    notes: "Up-to-date critical edition that supersedes Lambert 1960 for *Ludlul* and the *Babylonian Theodicy* on textual readings (incorporates joins published 1960–2014). Use Oshima for current readings, Lambert 1960 for editorial history and the rest of the wisdom corpus."

  - id: cohen-2013
    source_tier: primary
    in_scope: true
    author: "Cohen, Yoram"
    title: "Wisdom from the Late Bronze Age"
    year: 2013
    full_citation: "Cohen, Y., *Wisdom from the Late Bronze Age*, Writings from the Ancient World 29 (Atlanta: Society of Biblical Literature, 2013)."
    short_citation: "Cohen 2013"
    identifier_type: ISBN
    identifier_value: "9781589836846"
    notes: "Critical edition and translation of the Akkadian practical-wisdom compositions transmitted through the Late Bronze peripheral scribal centers — *Šimâ milka* / *Instructions of Šūpê-amēli* (Emar, Ugarit, Hattusa recensions) and related instruction texts. Cite for any *Šimâ milka* textual claim."

  - id: kienast-2003
    source_tier: primary
    in_scope: true
    author: "Kienast, Burkhart"
    title: "Iškar šēlebi: Die Serie vom Fuchs"
    year: 2003
    full_citation: "Kienast, B., *Iškar šēlebi: Die Serie vom Fuchs*, Freiburger Altorientalische Studien 22 (Stuttgart: Franz Steiner, 2003)."
    short_citation: "Kienast 2003"
    identifier_type: ISBN
    identifier_value: "9783515081283"
    notes: "Modern critical edition of the *Series of the Fox*, superseding Lambert 1960's partial treatment for textual readings. Pair with Lambert 1960 for editorial history and the wider fable context."

  - id: livingstone-1989
    source_tier: primary
    in_scope: true
    author: "Livingstone, Alasdair"
    title: "Court Poetry and Literary Miscellanea"
    year: 1989
    full_citation: "Livingstone, A., *Court Poetry and Literary Miscellanea*, State Archives of Assyria 3 (Helsinki: Helsinki University Press, 1989)."
    short_citation: "Livingstone 1989"
    identifier_type: ISBN
    identifier_value: "9789515700360"
    notes: "SAA 3. Standard critical edition of the *Underworld Vision of an Assyrian Prince* (no. 32, manuscript VAT 10057 from Aššur) and other Neo-Assyrian court literary compositions. Cite for any *Underworld Vision* textual claim. Added to registry per inventory-audit finding A2."

  - id: kvanvig-2011
    source_tier: secondary
    in_scope: true
    author: "Kvanvig, Helge S."
    title: "Primeval History: Babylonian, Biblical, and Enochic — An Intertextual Reading"
    year: 2011
    full_citation: "Kvanvig, H.S., *Primeval History: Babylonian, Biblical, and Enochic — An Intertextual Reading*, Supplements to the Journal for the Study of Judaism 149 (Leiden: Brill, 2011)."
    short_citation: "Kvanvig 2011"
    identifier_type: ISBN
    identifier_value: "9789004205451"
    notes: "Detailed scholarly study of *Adapa*, the *Apkallu* tradition, and Babylonian primaeval history. Useful for the influences chapter and for *Adapa* interpretation."

  # ── Translation collections (scholar-grade) ──────────────────────────

  - id: foster-2005
    source_tier: primary-translation
    in_scope: true
    author: "Foster, Benjamin R."
    title: "Before the Muses: An Anthology of Akkadian Literature"
    year: 2005
    full_citation: "Foster, B.R., *Before the Muses: An Anthology of Akkadian Literature*, 3rd ed. (Bethesda, MD: CDL Press, 2005)."
    short_citation: "Foster 2005"
    identifier_type: ISBN
    identifier_value: "9781883053765"
    notes: "Most comprehensive single-author translation anthology of Akkadian literature. Covers nearly the entire in-scope corpus. The default English entry point; cross-check against the relevant critical edition for any contested reading."

  - id: dalley-2008
    source_tier: primary-translation
    in_scope: true
    author: "Dalley, Stephanie"
    title: "Myths from Mesopotamia: Creation, the Flood, Gilgamesh, and Others"
    year: 2008
    full_citation: "Dalley, S., *Myths from Mesopotamia: Creation, the Flood, Gilgamesh, and Others*, rev. ed., Oxford World's Classics (Oxford: Oxford University Press, 2008)."
    short_citation: "Dalley 2008"
    identifier_type: ISBN
    identifier_value: "9780199538362"
    notes: "Accessible scholarly translation of *Atra-ḫasīs*, *Enūma Eliš*, *Gilgameš*, *Descent of Ishtar*, *Nergal and Ereškigal*, *Adapa*, *Anzû*, *Etana*, *Erra and Išum*, *Theogony of Dunnu*. Useful as a second translation for triangulation."

  - id: cos
    source_tier: reference
    in_scope: true
    author: "Hallo, William W.; Younger, K. Lawson, Jr."
    title: "The Context of Scripture"
    year: 1997-2017
    full_citation: "Hallo, W.W., and Younger, K.L. Jr. (eds.), *The Context of Scripture*, 4 vols. (Leiden: Brill, 1997–2017)."
    short_citation: "COS"
    identifier_type: ISBN
    identifier_value: "9789004135130"
    notes: "Multi-volume scholarly translation collection. Akkadian narrative texts in vol. I (Canonical Compositions). Cite for translations cross-checked against the critical editions; use COS reference numbers (e.g., COS 1.111 for *Enūma Eliš*)."

  # ── Reference works ──────────────────────────────────────────────────

  - id: cad
    source_tier: reference
    in_scope: true
    author: "Oppenheim, A. Leo et al."
    title: "The Assyrian Dictionary of the Oriental Institute of the University of Chicago"
    year: 1956-2010
    full_citation: "*The Assyrian Dictionary of the Oriental Institute of the University of Chicago* (CAD), 21 vols. (Chicago: Oriental Institute, 1956–2010)."
    short_citation: "CAD"
    identifier_type: stable-url
    identifier_value: "https://isac.uchicago.edu/research/publications/assyrian-dictionary-oriental-institute-university-chicago-cad"
    access_url: "https://isac.uchicago.edu/research/publications/assyrian-dictionary-oriental-institute-university-chicago-cad"
    notes: "Standard scholarly Akkadian dictionary; complete in 21 volumes (A through Z, plus supplementary). Free PDF distribution from the Oriental Institute (now ISAC). Cite by volume letter, e.g., 'CAD A/1, p. 200'."

  - id: ahw
    source_tier: reference
    in_scope: true
    author: "von Soden, Wolfram"
    title: "Akkadisches Handwörterbuch"
    year: 1965-1981
    full_citation: "von Soden, W., *Akkadisches Handwörterbuch*, 3 vols. (Wiesbaden: Harrassowitz, 1965–1981)."
    short_citation: "AHw"
    identifier_type: ISBN
    identifier_value: "9783447006910"
    notes: "Compact German-language Akkadian dictionary, complementary to CAD. Different approach (etymological rather than encyclopedic). Standard reference paired with CAD."

  - id: rla
    source_tier: reference
    in_scope: true
    author: "Ebeling, Erich; Edzard, Dietz Otto; Streck, Michael P. (eds.)"
    title: "Reallexikon der Assyriologie und Vorderasiatischen Archäologie"
    year: 1928-2018
    full_citation: "*Reallexikon der Assyriologie und Vorderasiatischen Archäologie* (RlA), 15 vols. (Berlin: De Gruyter, 1928–2018)."
    short_citation: "RlA"
    identifier_type: stable-url
    identifier_value: "https://www.degruyter.com/serial/rla-b/html"
    access_url: "https://www.degruyter.com/serial/rla-b/html"
    notes: "Standard German-language encyclopedia of Assyriology. Authoritative scholarly entries on every major deity, composition, place, and concept. Cite by volume and entry headword."

  - id: oracc
    source_tier: reference
    in_scope: true
    author: "Tinney, Steve; Robson, Eleanor; et al."
    title: "Open Richly Annotated Cuneiform Corpus"
    year: 2007-present
    full_citation: "*Open Richly Annotated Cuneiform Corpus* (ORACC), University of Pennsylvania and University College London, http://oracc.museum.upenn.edu/."
    short_citation: "ORACC"
    identifier_type: stable-url
    identifier_value: "http://oracc.museum.upenn.edu/"
    access_url: "http://oracc.museum.upenn.edu/"
    notes: "Federation of online Akkadian text projects. Includes Cuneiform Commentaries Project, RIBO (Royal Inscriptions of Babylonia Online), RINAP (Royal Inscriptions of the Neo-Assyrian Period), eTACT, and others. Cite by sub-project (e.g., 'ORACC/CCP K.1234')."

  - id: cdli
    source_tier: reference
    in_scope: true
    author: "Cuneiform Digital Library Initiative"
    title: "Cuneiform Digital Library Initiative"
    year: 2000-present
    full_citation: "*Cuneiform Digital Library Initiative* (CDLI), https://cdli.ucla.edu/."
    short_citation: "CDLI"
    identifier_type: stable-url
    identifier_value: "https://cdli.ucla.edu/"
    access_url: "https://cdli.ucla.edu/"
    notes: "Primary online catalog for tablet identification: P-numbers, museum numbers, photographs, transliterations, physical metadata. Use to verify any tablet reference."

  # ── Secondary scholarship ────────────────────────────────────────────

  - id: black-green-1992
    source_tier: secondary
    in_scope: true
    author: "Black, Jeremy; Green, Anthony"
    title: "Gods, Demons and Symbols of Ancient Mesopotamia: An Illustrated Dictionary"
    year: 1992
    full_citation: "Black, J., and Green, A., *Gods, Demons and Symbols of Ancient Mesopotamia: An Illustrated Dictionary* (London: British Museum Press, 1992)."
    short_citation: "Black & Green 1992"
    identifier_type: ISBN
    identifier_value: "9780714117058"
    notes: "Reliable single-volume reference for individual deities and motifs. Useful for character-appendix work."

  - id: bottero-2001
    source_tier: secondary
    in_scope: true
    author: "Bottéro, Jean"
    title: "Religion in Ancient Mesopotamia"
    year: 2001
    full_citation: "Bottéro, J., *Religion in Ancient Mesopotamia*, trans. Teresa Lavender Fagan (Chicago: University of Chicago Press, 2001). Originally published as *La plus vieille religion: en Mésopotamie* (Paris: Gallimard, 1998)."
    short_citation: "Bottéro 2001"
    identifier_type: ISBN
    identifier_value: "9780226067186"
    notes: "Standard interpretive synthesis of Mesopotamian religion by a major scholar. Useful for the introductory chapter and for thematic framing; cross-check specific claims against the critical editions."

  - id: jacobsen-1976
    source_tier: secondary
    in_scope: true
    author: "Jacobsen, Thorkild"
    title: "The Treasures of Darkness: A History of Mesopotamian Religion"
    year: 1976
    full_citation: "Jacobsen, T., *The Treasures of Darkness: A History of Mesopotamian Religion* (New Haven: Yale University Press, 1976)."
    short_citation: "Jacobsen 1976"
    identifier_type: ISBN
    identifier_value: "9780300022919"
    notes: "Influential interpretive synthesis. Useful for thematic framing but distinctive in its developmental schema; cross-check specific textual claims against the critical editions."

  - id: foster-2007
    source_tier: secondary
    in_scope: true
    author: "Foster, Benjamin R."
    title: "Akkadian Literature of the Late Period"
    year: 2007
    full_citation: "Foster, B.R., *Akkadian Literature of the Late Period*, Guides to the Mesopotamian Textual Record 2 (Münster: Ugarit-Verlag, 2007)."
    short_citation: "Foster 2007"
    identifier_type: ISBN
    identifier_value: "9783934628700"
    notes: "Concise survey of first-millennium Akkadian literature. Useful for situating each text in its compositional and recensional context."

  - id: noegel-2007
    source_tier: secondary
    in_scope: true
    author: "Noegel, Scott B."
    title: "Mesopotamian Epic"
    year: 2007
    full_citation: "Noegel, S.B., 'Mesopotamian Epic,' in J.M. Foley (ed.), *A Companion to Ancient Epic* (Oxford: Blackwell, 2005), pp. 233–245."
    short_citation: "Noegel 2005"
    identifier_type: ISBN
    identifier_value: "9781405188388"
    notes: "Useful overview of the Akkadian epic genre, covering Gilgameš, Anzû, Erra, Tukulti-Ninurta, and the royal legend cycles together."

  # ── Influences-chapter sources (Sumerian, Hurro-Hittite, comparative) ─

  - id: hoffner-1998
    source_tier: comparative
    in_scope: false
    author: "Hoffner, Harry A. Jr."
    title: "Hittite Myths"
    year: 1998
    full_citation: "Hoffner, H.A. Jr., *Hittite Myths*, 2nd ed., Writings from the Ancient World 2 (Atlanta: Scholars Press, 1998)."
    short_citation: "Hoffner 1998"
    identifier_type: ISBN
    identifier_value: "9780788504884"
    notes: "Comparative source for the influences chapter. The Kumarbi cycle and other Hurro-Hittite material — out of scope as primary text, in scope as comparative material for *Enūma Eliš* and theogonic patterns."

  - id: black-2004
    source_tier: comparative
    in_scope: false
    author: "Black, Jeremy; Cunningham, Graham; Robson, Eleanor; Zólyomi, Gábor"
    title: "The Literature of Ancient Sumer"
    year: 2004
    full_citation: "Black, J.A., Cunningham, G., Robson, E., and Zólyomi, G., *The Literature of Ancient Sumer* (Oxford: Oxford University Press, 2004)."
    short_citation: "Black et al. 2004"
    identifier_type: ISBN
    identifier_value: "9780199296330"
    notes: "Comparative source for the influences chapter. The Sumerian compositions (Inanna's Descent, Lugal-e, Enki cycle, etc.) — out of scope as primary text (covered in *The Myths of Sumer*), in scope as comparative material for the Sumerian-Akkadian relationship."

  - id: etcsl
    source_tier: comparative
    in_scope: false
    author: "Black, Jeremy; Cunningham, Graham; Flückiger-Hawker, Esther; Robson, Eleanor; Zólyomi, Gábor"
    title: "The Electronic Text Corpus of Sumerian Literature"
    year: 1998-2006
    full_citation: "Black, J.A., Cunningham, G., Flückiger-Hawker, E., Robson, E., and Zólyomi, G., *The Electronic Text Corpus of Sumerian Literature* (https://etcsl.orinst.ox.ac.uk/), Oxford, 1998–2006."
    short_citation: "ETCSL"
    identifier_type: stable-url
    identifier_value: "https://etcsl.orinst.ox.ac.uk/"
    access_url: "https://etcsl.orinst.ox.ac.uk/"
    notes: "Comparative reference. Sumerian counterparts of Akkadian compositions are cited from ETCSL when needed for the influences chapter or for footnotes that cross-reference Sumerian originals."

  - id: smith-1994
    source_tier: comparative
    in_scope: false
    author: "Smith, Mark S."
    title: "The Ugaritic Baal Cycle, Volume I: Introduction with Text, Translation and Commentary of KTU 1.1–1.2"
    year: 1994
    full_citation: "Smith, M.S., *The Ugaritic Baal Cycle, Volume I: Introduction with Text, Translation and Commentary of KTU 1.1–1.2*, Vetus Testamentum Supplements 55 (Leiden: Brill, 1994)."
    short_citation: "Smith 1994"
    identifier_type: ISBN
    identifier_value: "9789004099951"
    notes: "Comparative reference for the Tiamat-combat parallels. Out of scope as primary, in scope for the influences chapter and for footnotes on the West Semitic sea-combat motif."

blacklist:
  - pattern: "wikipedia.org"
    reason: "Unvetted; routinely conflates Sumerian and Akkadian material and reproduces popular-press summaries without philological control."
  - pattern: "worldhistory.org"
    reason: "Popular summaries; frequent conflation of Sumerian, Babylonian, and Assyrian traditions."
  - pattern: "ancient.eu"
    reason: "Redirects to worldhistory.org. Same conflation issues."
  - pattern: "mythopedia.com"
    reason: "No philological rigor; treats pan-Mesopotamian as a single undifferentiated tradition."
  - pattern: "theoi.com"
    reason: "Greco-Roman focus; Mesopotamian content is shallow and conflated."
  - pattern: "Sitchin"
    reason: "Pseudoscholarship (*The 12th Planet* and related works). Any source citing or treating Sitchin as serious scholarship is excluded."
  - pattern: "Heidel 1942"
    reason: "Heidel's *Babylonian Genesis* (1942) is superseded for textual readings by Lambert 2013 and Foster 2005. Cite Lambert for *Enūma Eliš* text and Foster for translation; do not rely on Heidel."
  - pattern: "Speiser ANET"
    reason: "Pritchard's *Ancient Near Eastern Texts* (ANET, 1969) translations are largely superseded by Foster 2005 and COS. Acceptable for citation history; not a current reference for textual claims."
  - pattern: "Any source treating *Atra-ḫasīs*, *Enūma Eliš*, or *Adapa* as Sumerian"
    reason: "Misattribution signals the source does not distinguish Sumerian and Akkadian traditions. The Sumerian Flood Story (*Eridu Genesis*, ETCSL 1.7.4) is a different composition from *Atra-ḫasīs*; the Sumerian *Inanna's Descent* (ETCSL 1.4.1) is a different composition from the Akkadian *Descent of Ishtar*."

triangulation_databases:
  - id: ORACC
    url: "http://oracc.museum.upenn.edu/"
    covers: "Federated Akkadian text projects — Cuneiform Commentaries, RIBO, RINAP, eTACT, etc. The primary online corpus."
  - id: CDLI
    url: "https://cdli.ucla.edu/"
    covers: "Tablet catalog — P-numbers, museum numbers, photographs, transliterations, physical metadata."
  - id: ETCSL
    url: "https://etcsl.orinst.ox.ac.uk/"
    covers: "Sumerian literary texts — used here only for the Sumerian counterparts cited in the influences chapter and footnotes."
  - id: SAA-online
    url: "http://oracc.museum.upenn.edu/saao/"
    covers: "State Archives of Assyria Online — Neo-Assyrian royal correspondence, treaties, oracular queries; useful for the Tukulti-Ninurta and Assyrian-period context."
  - id: BibleWorks/Logos-CAD
    url: "https://isac.uchicago.edu/research/publications/assyrian-dictionary-oriental-institute-university-chicago-cad"
    covers: "CAD PDFs for lexical verification."
