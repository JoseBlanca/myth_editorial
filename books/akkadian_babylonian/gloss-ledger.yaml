  # Places — full first-mention gloss given in chapter 08
  - native: "Dilbat"
    full_gloss_in: "08"
    last_reminder_in: null
    last_mention_in: "08"
    chapters_used: ["08"]
    # Dilbat (modern Tell al-Deylam, Iraq's Babil Governorate) is the cult-
    # centre of the male agricultural tutelary Urash; the gloss is given
    # inline in chapter 08's "Urash of Dilbat" section. If Dilbat reappears
    # in a later chapter, a glossary.yaml entry should be opened and this
    # ledger entry promoted.
  - native: "Ur"
    full_gloss_in: "08"
    last_reminder_in: null
    last_mention_in: "08"
    chapters_used: ["08"]
    # Ur is named in chapter 08 only as the find-spot of the single tablet
    # UET 6, 398 (the sole witness to Uraš and Marduk). The composition
    # itself may have originated at Dilbat. Inline gloss only; if Ur
    # reappears as a place of action in a later chapter, a glossary.yaml
    # entry should be opened.

  # Deities — full first-mention gloss given in chapter 08
  - native: "Urash"
    full_gloss_in: "08"
    last_reminder_in: null
    last_mention_in: "08"
    chapters_used: ["08"]
    # The MALE agricultural tutelary of Dilbat — distinguished in chapter
    # 08 from the female cosmogonic Uraš (spouse of Anu). Late-Babylonian
    # commentary lists equate this Urash with "Ninurta of the hoe", "of
    # the calendar", "of the tenant farmer", and "Marduk of planting".
    # The body prose uses "Urash" for the male Dilbat tutelary; the
    # composition title preserves the diacritic ("*Uraš and Marduk*") to
    # match Lambert 2013's editorial convention. Not in glossary.yaml; if
    # the male Urash reappears in a later chapter, a glossary entry should
    # be opened. The female Uraš (cosmogonic spouse of Anu) is named only
    # in the disambiguation paragraph in chapter 08; if she becomes more
    # central in a later chapter (e.g., a chapter on the Anu-Uraš pairing
    # in Mesopotamian theogony), a separate glossary entry will be needed.

  # Places — full first-mention gloss given in chapter 09
  - native: "Nippur"
    full_gloss_in: "09"
    last_reminder_in: null
    last_mention_in: "09"
    chapters_used: ["09"]
    # Ancient Mesopotamian city, traditional cult-centre of Enlil and the
    # older pantheon. Substantively introduced in chapter 09 (referenced
    # earlier in scope.md and in passing as a scribal centre) where it
    # is the setting of the Marduk-vs-Enlil conflict in *Damkina's Bond*.
    # If Nippur reappears as a place of action in a later chapter, a
    # glossary.yaml entry should be opened.
  - native: "Eshumesha"
    full_gloss_in: "09"
    last_reminder_in: null
    last_mention_in: "09"
    chapters_used: ["09"]
    # Ninurta's temple at Nippur. The "360 gods of Eshumesha" captured by
    # Marduk in *Damkina's Bond* are the constellation of deities
    # associated with Ninurta's cult and the Enlil-pantheon at Nippur.
    # Inline gloss in chapter 09 only; if Eshumesha reappears in a later
    # chapter (esp. the Anzu chapter, where Ninurta is central), a
    # glossary.yaml entry should be opened.
  - native: "Malgium"
    full_gloss_in: "09"
    last_reminder_in: null
    last_mention_in: "09"
    chapters_used: ["09"]
    # Ancient Babylonian city; Lambert 2013 proposes Malgium as the place
    # of origin of *Damkina's Bond*. Mentioned only as a Lambert-proposal
    # site of composition; not load-bearing for any narrative claim. No
    # glossary.yaml entry needed unless Malgium becomes substantively
    # important in a later chapter.

  # Deities — full first-mention gloss given in chapter 09
  - native: "Neretagmil"
    full_gloss_in: "09"
    last_reminder_in: null
    last_mention_in: "09"
    chapters_used: ["09"]
    # The *sukkal* (vizier or messenger-god) of the deified river-god
    # Nāru. In *Damkina's Bond* he delivers a message to Damkianna
    # (Damkina) about the battle at Nippur, prompting her intervention.
    # Not in glossary.yaml; if Neretagmil reappears in a later chapter,
    # a glossary entry should be opened.
  - native: "Nāru"
    full_gloss_in: "09"
    last_reminder_in: null
    last_mention_in: "09"
    chapters_used: ["09"]
    # The deified river-god whose *sukkal* (Neretagmil) delivers the
    # decisive message in *Damkina's Bond*. Inline gloss in chapter 09
    # only; if Nāru reappears in a later chapter, a glossary.yaml entry
    # should be opened.
  - native: "Damgalnuna"
    full_gloss_in: "09"
    last_reminder_in: null
    last_mention_in: "09"
    chapters_used: ["09"]
    # The Sumerian form of the goddess's name (Akkadian: Damkina). Named
    # in chapter 09 only in the Damkianna / Damgalnuna / Damkina lineage
    # disambiguation paragraph; not used as a body-prose substitute for
    # the locked Akkadian Damkina. The late Akkadian variant spelling
    # Damkianna also appears in the same disambiguation, attested in
    # some manuscripts of *Damkina's Bond* and adopted by Oshima 2010
    # in his edition title. No glossary.yaml entry needed.

  # Technical, ritual, and genre terms — full first-mention gloss given in chapter 09
  - native: "sukkal"
    full_gloss_in: "09"
    last_reminder_in: null
    last_mention_in: "09"
    chapters_used: ["09"]
    # Akkadian for "vizier" or "messenger-god" — the deity who serves as
    # an intermediary or delegate of a senior god. Inline gloss in
    # chapter 09 (Neretagmil as the *sukkal* of Nāru). Recurring term
    # in the Akkadian narrative tradition; if it reappears in a later
    # chapter, a glossary.yaml entry should be opened.
  - native: "pirištu"
    full_gloss_in: "09"
    last_reminder_in: null
    last_mention_in: "09"
    chapters_used: ["09"]
    # Akkadian for "secret" — the standard term in scholarly-priestly
    # colophons classing a composition's contents as restricted material.
    # Inline gloss in chapter 09 (the BM 27776 colophon's secret-of-Marduk
    # classification, given as the genre-typical Akkadian term). Recurs
    # in the secret-tablet tradition (Livingstone 1989 SAA 3 nos. 34–35);
    # if substantively used in a later chapter, a glossary.yaml entry
    # should be opened.
  - native: "il-let-sa"
    full_gloss_in: "09"
    last_reminder_in: null
    last_mention_in: "09"
    chapters_used: ["09"]
    # Composition-specific Akkadian term in *Damkina's Bond* — the object
    # Damkina releases at the narrative's hinge. The term is contested
    # between Lambert 2013 ("bond", a displayable token) and Oshima 2010
    # ("burden", derived from *e'iltu* "obligation, bond, sin"). The
    # philological disagreement is treated as a [VARIANT:] marker in
    # chapter 09. Highly composition-specific; no glossary.yaml entry
    # needed.

  # Deities — full first-mention gloss given in chapter 10
  - native: "Aruru"
    full_gloss_in: "10"
    last_reminder_in: null
    last_mention_in: "10"
    chapters_used: ["10"]
    # Mother-goddess of the Akkadian-Mesopotamian pantheon. In *The
    # Founding of Eridu* (chapter 10) she collaborates with Marduk in
    # creating "the seed of mankind" — a joint anthropogony distinct
    # from *Enūma Eliš* Tablet VI's solo-Marduk creation from Qingu's
    # blood. Aruru also appears in *The Epic of Gilgameš* I where she
    # creates Enkidu from clay; she is likely to recur in chapter 17
    # (Standard Babylonian Gilgameš). If she becomes more central in
    # a later chapter, a glossary.yaml entry should be opened.

