  # Deities — full first-mention gloss given in chapter 08
  - native: "Urash"
    full_gloss_in: "08"
    last_reminder_in: null
    last_mention_in: "08"
    chapters_used: ["08"]
    # The MALE agricultural tutelary of Dilbat — distinguished in chapter
    # 08 from the female cosmogonic Uraš (spouse of Anu). Late-Babylonian
    # commentary lists equate this Urash with "Ninurta of the hoe", "of
    # the calendar", "of the tenant farmer", and "Marduk of planting".
    # The body prose uses "Urash" for the male Dilbat tutelary; the
    # composition title preserves the diacritic ("*Uraš and Marduk*") to
    # match Lambert 2013's editorial convention. Not in glossary.yaml; if
    # the male Urash reappears in a later chapter, a glossary entry should
    # be opened. The female Uraš (cosmogonic spouse of Anu) is named only
    # in the disambiguation paragraph in chapter 08; if she becomes more
    # central in a later chapter (e.g., a chapter on the Anu-Uraš pairing
    # in Mesopotamian theogony), a separate glossary entry will be needed.

