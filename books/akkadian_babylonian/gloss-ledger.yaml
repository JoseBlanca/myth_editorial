  - native: "Tammuz"
    full_gloss_in: "13"
    last_reminder_in: null
    last_mention_in: "13"
    chapters_used: ["13"]
    # Late-Aramaic-biblical reflex of the Akkadian shepherd-god Dumuzi.
    # Foster 2005 and Dalley 2008 use "Tammuz" in their translations of
    # the Standard Babylonian *Descent of Ishtar*; the editorial / Foster-
    # translation form is preserved in this chapter to match the
    # composition's cited translation (and the brief's entities_glossary).
    # The locked Akkadian form per glossary.yaml is "Dumuzi" (with
    # rationale "*Tammuz* is the later Aramaic-biblical reflex; using
    # it imports out-of-period usage"). For the SB recension of
    # *The Descent of Ishtar*, however, the late-period composition
    # is itself first-millennium; "Tammuz" is the form Foster 2005
    # adopts and the form by which the figure is typically known in
    # this composition. Glossary.yaml's chosen form may need a carve-
    # out for first-millennium SB recensions / Foster-translation
    # contexts, parallel to the Apsû/Abzû carve-out for E-abzu.
    # Inline gloss in chapter 13 ("the shepherd-god, her own consort").
    # If Tammuz reappears in later chapters, this convention should
    # be reviewed.
  - native: "Aṣušu-namir"
    full_gloss_in: "13"
    last_reminder_in: null
    last_mention_in: "13"
