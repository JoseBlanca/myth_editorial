    # is woven inline in Tablet VI at first substantive mention. Bare
    # term used elsewhere — Ištar was reminder-glossed in ch13 just
    # four chapters back and is recurring across the cycle. The
    # editorial-title convention is preserved: "Ishtar" appears only
    # in *Descent of Ishtar* and *Ishtar-Ereškigal* citations inside
