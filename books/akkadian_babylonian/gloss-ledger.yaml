    # narrative"; cross-references to Marduk-centred compositions of
    # the dossier). No reminder gloss given — Marduk has been the
    # central figure of chapters 1, 5, 6, 7, 8, 9, 10, 11 and is
    # familiar to the reader; the chapter 12 mentions are all in
    # contrast contexts where the bare term is sufficient.
    # Chapter 16 (Erra and Išum) is Marduk-adjacent: the patron-god
    # of Babylon is induced to leave his throne, allowing Erra's
    # rampage. Bare term used throughout — Marduk was named in ch15
    # (just one chapter back) and the figure is central across the
    # cycle; no reminder gloss needed at first mention in ch16.
