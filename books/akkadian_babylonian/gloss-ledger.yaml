  - native: "E-kur"
    full_gloss_in: "10"
    last_reminder_in: null
    last_mention_in: "10"
    chapters_used: ["10"]
    # Enlil's temple at Nippur (the "Mountain House"). A primordial
    # cosmic structure in *The Founding of Eridu*. Inline gloss in
    # chapter 10 only; if E-kur reappears in a later chapter, a
    # glossary.yaml entry should be opened.
  - native: "E-Aena"
    full_gloss_in: "10"
    last_reminder_in: null
    last_mention_in: "10"
    chapters_used: ["10"]
    # The temple of Erech (Sumerian Uruk) in *The Founding of Eridu*.
    # Inline gloss in chapter 10 only; specific to this composition.
  - native: "E-Zida"
    full_gloss_in: "10"
    last_reminder_in: null
    last_mention_in: "10"
    chapters_used: ["10"]
    # The temple complex (probably Nabu's at Borsippa) where the
    # surviving manuscript's incantation was recited. Ritual setting
    # of the composition's preservation. Inline gloss in chapter 10
    # only; if E-Zida reappears in a later chapter, a glossary.yaml
    # entry should be opened.
  - native: "Erech"
    full_gloss_in: "10"
    last_reminder_in: null
    last_mention_in: "10"
    chapters_used: ["10"]
    # Older biblical / scholarly form of the Sumerian city name Uruk
    # (Genesis 10:10). Lambert 2013 / Foster 2005 use "Erech" as the
    # editorial form for *The Founding of Eridu*'s primordial-city
    # cohort. Inline parenthetical gloss with "Sumerian Uruk" in
    # chapter 10. Uruk itself is glossed in chapter 0; if Erech as a
    # form recurs, a glossary.yaml entry should be opened.

