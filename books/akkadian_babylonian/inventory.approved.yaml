cycles:
  # ── I. Cosmogony, creation, and primordial order ─────────────────────

  - id: cosmogony
    name: "Cosmogony, creation, and primordial order"
    stories:
      - id: enuma-elish
        title: "Enūma Eliš"
        native_title: "Enūma Eliš (When on high)"
        sources:
          - id: lambert-2013
            loc: "pp. 3–144 (Tablets I–VII, critical edition with apparatus)"
            identifier: "ISBN 9781575062471"
          - id: foster-2005
            loc: "Before the Muses, pp. 436–486"
            identifier: "ISBN 9781883053765"
        date_range: "Composed late 2nd millennium BCE (likely Kassite or early post-Kassite); Standard Babylonian recension transmitted ca. 1100 BCE through the Hellenistic period."
        summary: "Marduk rises from the youngest generation of gods to defeat the primordial sea-mother Tiamat in single combat, splits her body to form the cosmos, and is exalted to kingship over the gods. Tablet VII recites his fifty names — a hymnic theology of Babylonian sovereignty."
        variants: "First-millennium recensions from Babylon, Aššur, and Nineveh largely agree; Tablet VII name lists vary in order across manuscripts."
        scope_uncertain: false
        identifier_missing: false
        notes: "Reference manuscripts include K.3473 + duplicates (Nineveh) and the Aššur copies. Lambert 2013 supersedes earlier editions."

      - id: atra-hasis
        title: "Atra-ḫasīs"
        native_title: "inūma ilū awīlum (When the gods were like men)"
        sources:
          - id: lambert-millard-1969
            loc: "pp. 42–109 (OB recension, MS A); pp. 110–137 (later recensions)"
            identifier: "ISBN 9781575060392"
          - id: foster-2005
            loc: "Before the Muses, pp. 227–280"
            identifier: "ISBN 9781883053765"
        date_range: "Old Babylonian original ca. 1700 BCE (MS A colophon names the scribe Ipiq-Aya in the reign of Ammi-ṣaduqa); Middle Babylonian and Standard Babylonian recensions through the first millennium."
        summary: "The lower gods rebel against the toil of digging the earth's canals; the mother-goddess Mami creates humans to take over the labor. Humanity's noise grows oppressive, and Enlil sends plague, drought, famine, and finally a flood — survived only by Atra-ḫasīs, the 'exceedingly wise', warned by Enki in a reed-hut whisper."
        variants: "OB Sippar (Ipiq-Aya MS A) is the most complete; SB recensions are heavily fragmentary. The flood scene was independently incorporated into Standard Babylonian Gilgameš XI."
        scope_uncertain: false
        identifier_missing: false
        notes: "Lambert & Millard 1969 remains the reference critical edition; subsequent joins are summarised in Foster 2005."

      - id: adapa
        title: "Adapa and the South Wind"
        native_title: "Adapa"
        sources:
          - id: izreel-2001
            loc: "pp. 9–73 (the Akkadian fragments edited together)"
            identifier: "ISBN 9781575060484"
          - id: foster-2005
            loc: "Before the Muses, pp. 525–530"
            identifier: "ISBN 9781883053765"
        date_range: "Middle Babylonian Amarna fragment (Fragment A in Izre'el 2001; the largest and most important Akkadian witness, 14th c. BCE); Neo-Assyrian Nineveh fragments (Fragments B, C, D, etc., 7th c. BCE). No Old Babylonian Akkadian witness is known — the Tell Haddad / Me-Turan tablet sometimes cited in older literature is a Sumerian-language composition and is out of scope here as primary; it is comparative material for the influences chapter only."
        summary: "Adapa, the antediluvian sage and priest of Ea at Eridu, breaks the wing of the south wind in a fishing accident and is summoned to Anu's heaven. Warned by Ea against accepting the food and drink offered him, he refuses what turn out to be the bread and water of immortality — losing eternal life for himself and humankind."
        variants: "The Middle Babylonian Amarna fragment and the Neo-Assyrian Nineveh fragments preserve substantially different versions of the heaven audience scene."
        scope_uncertain: false
        identifier_missing: false
        notes: "Tablet identifiers: Amarna EA 356 (MB) = Izre'el's Fragment A; Kuyunjik fragments K.8743 + duplicates (NA). The Sumerian Tell Haddad / Me-Turan Adapa (Cavigneaux & Al-Rawi 1993) is out of scope per the language-of-composition boundary in scope.md and is treated only as comparative Sumerian background in the influences chapter. Inventory revised on 2026-05-06 per inventory-audit finding A1."

      - id: theogony-of-dunnu
        title: "The Theogony of Dunnu"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: lambert-2013
            loc: "pp. 387–395"
            identifier: "ISBN 9781575062471"
          - id: foster-2005
            loc: "Before the Muses, pp. 487–489"
            identifier: "ISBN 9781883053765"
        date_range: "First-millennium Babylonian recension; underlying tradition likely earlier."
        summary: "A genealogical creation narrative in which successive generations of cosmic deities — Plough/Earth, Sea, Cattle-god — kill, marry, and replace their parents in the city of Dunnu. The text reads like a violent dynastic chronicle of cosmogony."
        variants: "Single recension on tablet CT 46, 43 (BM 74329)."
        scope_uncertain: false
        identifier_missing: false
        notes: "Manuscript: BM 74329 (= CT 46, 43). Striking parallels to the Hurro-Hittite Kumarbi succession — central case for the influences chapter."

      - id: slaying-of-labbu
        title: "The Slaying of Labbu"
        native_title: "Labbu"
        sources:
          - id: lambert-2013
            loc: "pp. 361–365"
            identifier: "ISBN 9781575062471"
          - id: foster-2005
            loc: "Before the Muses, pp. 581–582"
            identifier: "ISBN 9781883053765"
        date_range: "Neo-Assyrian recension (manuscript from Nineveh); composition likely earlier."
        summary: "The gods are terrorized by the dragon Labbu, who has emerged from the sea. A divine champion is dispatched to slay him; the surviving fragment preserves the divine planning council and the start of the combat but breaks off before the kill."
        variants: "Single fragmentary recension."
        scope_uncertain: false
        identifier_missing: false
        notes: "Manuscript CT 13, 33–34. The champion's name is lost in the lacuna; Tišpak has been proposed but remains conjectural."

      - id: enmesharra-defeat
        title: "Enmešarra's Defeat"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: lambert-2013
            loc: "pp. 281–298"
            identifier: "ISBN 9781575062471"
        date_range: "First-millennium Babylonian recension; underlying tradition older."
        summary: "Marduk defeats the chthonic god Enmešarra and his sons, who challenge his cosmic authority. The text intersects with the Marduk Ordeal and Akītu liturgical complex; cosmic order is restored after a contest among the gods."
        variants: "Several manuscript groups; reconstruction provisional."
        scope_uncertain: false
        identifier_missing: false
        notes: "Lambert 2013 is the only modern critical edition. Linked to the New Year (Akītu) festival cosmology."

      - id: toil-of-babylon
        title: "The Toil of Babylon"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: lambert-2013
            loc: "pp. 366–375"
            identifier: "ISBN 9781575062471"
        date_range: "Late Babylonian (Hellenistic-period manuscript)."
        summary: "A creation narrative emphasizing the building of Babylon by divine and human labor under Marduk's direction. The text foregrounds the city's cosmic centrality from its first foundation."
        variants: "Single late manuscript."
        scope_uncertain: false
        identifier_missing: false
        notes: "Manuscript BM 47860. Modern title."

      - id: uras-and-marduk
        title: "Uraš and Marduk"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: lambert-2013
            loc: "pp. 308–325"
            identifier: "ISBN 9781575062471"
        date_range: "Late Babylonian recension."
        summary: "A theogonic-cosmogonic narrative pairing the earth-goddess Uraš with Marduk, foregrounding the chthonic-celestial union of the divine pair. Preserved fragmentarily across multiple manuscripts."
        variants: "Multiple late manuscripts; reconstruction provisional."
        scope_uncertain: false
        identifier_missing: false
        notes: "Lambert 2013 collects the manuscripts. Modern title."

      - id: damkina-bond
        title: "Damkina's Bond"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: lambert-2013
            loc: "pp. 326–333"
            identifier: "ISBN 9781575062471"
        date_range: "Late Babylonian recension."
        summary: "A creation narrative in which Damkina (Marduk's mother) plays a structuring role in establishing the cosmic order. Heavily fragmentary."
        variants: "Single recension, heavily damaged."
        scope_uncertain: false
        identifier_missing: false
        notes: "Lambert 2013 is the sole modern edition."

      - id: founding-of-eridu
        title: "The Founding of Eridu (bilingual creation prologue)"
        native_title: "enūma Anum ibnû šamê (When Anu created the heavens)"
        sources:
          - id: lambert-2013
            loc: "pp. 376–383"
            identifier: "ISBN 9781575062471"
          - id: foster-2005
            loc: "Before the Muses, p. 488"
            identifier: "ISBN 9781883053765"
        date_range: "Late Babylonian manuscript; underlying tradition older."
        summary: "A bilingual (Sumerian-Akkadian) cosmogonic prologue narrating the creation of the heavens and earth, with the founding of Eridu as the world's first city. Originally a ritual incantation prologue, transmitted as a freestanding cosmogony."
        variants: "Single bilingual recension, multiple manuscripts."
        scope_uncertain: false
        identifier_missing: false
        notes: "Sippar manuscript. The text begins with the incipit 'enūma Anum ibnû šamê' and is sometimes called 'The Bilingual Creation of the World by Marduk'. Page range to be spot-checked against a physical copy of Lambert 2013 before chapter-claims, per inventory-audit finding A8."

      - id: worm-and-toothache
        title: "The Worm and the Toothache"
        native_title: "(incantation prologue, CT 17 50)"
        sources:
          - id: lambert-2013
            loc: "pp. 396–398"
            identifier: "ISBN 9781575062471"
          - id: foster-2005
            loc: "Before the Muses, pp. 995–996"
            identifier: "ISBN 9781883053765"
        date_range: "First-millennium Babylonian/Assyrian recension (Nineveh library MS); tradition older."
        summary: "A brief etiological narrative inside an incantation against toothache. Anu creates the heavens, the heavens create earth, earth rivers, rivers canals, canals marshes, marshes the worm — who chooses to dwell in human teeth rather than eat figs and apples. The cosmogony grounds the magical cure."
        variants: "CT 17 50; multiple Nineveh and Aššur duplicates."
        scope_uncertain: false
        identifier_missing: false
        notes: "Often anthologised as the shortest Akkadian cosmogony. The illustrative type for §I cosmogonic incantation prologues."

      - id: first-brick
        title: "The First Brick"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: lambert-2013
            loc: "pp. 384–386"
            identifier: "ISBN 9781575062471"
        date_range: "Late Babylonian manuscript; tradition older."
        summary: "A short etiological narrative on the cosmic origin of the first brick laid in temple foundation, framing the act of brick-making as an inheritance from the gods. Embedded in foundation ritual context."
        variants: "Single manuscript."
        scope_uncertain: false
        identifier_missing: false
        notes: "Lambert 2013 treats this as a discrete composition adjacent to The Founding of Eridu (cleared by inventory-audit finding A8). Page range to be spot-checked against a physical copy of Lambert 2013 before chapter-claims."

  # ── II. Divine conflict, descent, and the underworld ─────────────────

  - id: divine_conflict
    name: "Divine conflict, descent, and the underworld"
    stories:
      - id: descent-of-ishtar
        title: "The Descent of Ishtar"
        native_title: "ana kurnugê (To the land of no return)"
        sources:
          - id: foster-2005
            loc: "Before the Muses, pp. 498–505"
            identifier: "ISBN 9781883053765"
          - id: dalley-2008
            loc: "Myths from Mesopotamia, pp. 154–162"
            identifier: "ISBN 9780199538362"
        date_range: "Standard Babylonian recension (mid-1st millennium BCE); Nineveh library copies 7th c. BCE."
        summary: "Ishtar descends to the underworld to confront her sister Ereškigal, removing one item of jewelry or garment at each of seven gates until she stands naked before her sister, who hangs her on a hook. Ea creates a being to rescue her; she returns, with Tammuz substituted as her replacement in the underworld."
        variants: "The Akkadian Standard Babylonian recension is substantially different from the earlier Sumerian *Inanna's Descent* (ETCSL 1.4.1, covered in *The Myths of Sumer* — out of scope as primary text here, comparative in the influences chapter)."
        scope_uncertain: false
        identifier_missing: false
        notes: "K.162 + duplicates (Nineveh). Foster 2005 and Dalley 2008 are the standard English translations; a modern text edition is now available in the electronic Babylonian Library (eBL, https://www.ebl.lmu.de/corpus/L/1/8) per inventory-audit finding A7. Borger 1979 *BAL II* is a teaching anthology, not a critical edition."

      - id: nergal-ereshkigal
        title: "Nergal and Ereškigal"
        native_title: "(no preserved native title)"
        sources:
          - id: foster-2005
            loc: "Before the Muses, pp. 506–524 (Amarna, Sultantepe, and Uruk recensions)"
            identifier: "ISBN 9781883053765"
          - id: dalley-2008
            loc: "Myths from Mesopotamia, pp. 163–181"
            identifier: "ISBN 9780199538362"
        date_range: "Middle Babylonian Amarna recension (14th c. BCE, EA 357); Standard Babylonian Sultantepe recension (7th c. BCE); Late Babylonian Uruk fragment."
        summary: "Nergal, war-god of the upper world, descends to the netherworld of Ereškigal — first as visitor, later as her co-ruler. The two main recensions tell substantially different versions: the brief MB Amarna text and the long SB Sultantepe poem with its elaborate courtship and royal-wedding frame."
        variants: "Substantial differences across recensions: Amarna (concise, etiological), Sultantepe (long, romantic-courtly), Uruk fragment."
        scope_uncertain: false
        identifier_missing: false
        notes: "Amarna EA 357; Sultantepe STT 28 + joins (the SB recension was edited by O. R. Gurney in *Anatolian Studies* 10 (1960), pp. 105–131); Uruk fragment. Tablet identifier corrected from 'SU 51/7 + duplicates' per inventory-audit finding A9; field number to be re-verified against CDLI before chapter-claims."

      - id: anzu
        title: "Anzû"
        native_title: "Anzû"
        sources:
          - id: annus-2001
            loc: "SAACT 3, entire (Standard Babylonian recension)"
            identifier: "ISBN 9789514590498"
          - id: vogelzang-1988
            loc: "entire (Old Babylonian recension)"
            identifier: "ISBN 9789072371041"
          - id: foster-2005
            loc: "Before the Muses, pp. 555–578"
            identifier: "ISBN 9781883053765"
        date_range: "Old Babylonian recension ca. 1700 BCE; Standard Babylonian recension transmitted through the 1st millennium."
        summary: "Anzû, the great storm-bird, steals the Tablet of Destinies from Enlil. After two heroes refuse the task, the slayer is sent to recover it; following a fierce aerial combat, he slays Anzû and is exalted as the warrior of the gods, with the Tablet of Destinies restored to its proper holder."
        variants: "Substantive recensional differences. **The hero is Ningirsu in the OB recension and Ninurta in the SB recension** — the divine identity of the slayer changes between recensions and is one of the principal substantive differences (Vogelzang 1988). The structural framing also differs: OB recension follows the Tablet's recovery from Enlil's bath in a 3-tablet structure; SB recension uses a divine-council frame in 2 tablets."
        scope_uncertain: false
        identifier_missing: false
        notes: "The Sumerian *Lugal-e* (ETCSL 1.6.2) covers similar Ninurta-versus-monster motifs but is a distinct composition (out of scope here as primary; comparative in influences chapter)."

      - id: erra-and-ishum
        title: "Erra and Išum"
        native_title: "Erra"
        sources:
          - id: cagni-1969
            loc: "L'epopea di Erra, entire (5 tablets)"
            identifier: "Studi-Semitici-34"
          - id: foster-2005
            loc: "Before the Muses, pp. 880–911"
            identifier: "ISBN 9781883053765"
          - id: dalley-2008
            loc: "Myths from Mesopotamia, pp. 282–315"
            identifier: "ISBN 9780199538362"
        date_range: "First-millennium Babylonian; likely 8th c. BCE (the colophon names Kabti-ilāni-Marduk as the composer)."
        summary: "Erra, god of plague and violence, is roused by his demons (the Sebitti) to attack Babylon. While Marduk is induced to leave his throne for ritual cleaning, Erra unleashes catastrophic war upon Mesopotamian cities; his vizier Išum eventually persuades him to relent, and the poem closes with his restoration to good order and a prophecy of future Babylonian victory."
        variants: "Multiple manuscripts agree closely; minor textual variants in the Sebitti list."
        scope_uncertain: false
        identifier_missing: false
        notes: "Five-tablet structure. The poem itself functioned as a protective amulet — copies were buried under foundations and worn as pendants."

  # ── III. Heroic and mythic epics ─────────────────────────────────────

  - id: heroic_epic
    name: "Heroic and mythic epics"
    stories:
      - id: gilgamesh-sb
        title: "The Standard Babylonian Epic of Gilgameš"
        native_title: "ša naqba īmuru (He who saw the deep)"
        sources:
          - id: george-2003
            loc: "vols. 1–2 entire (critical edition + cuneiform texts)"
            identifier: "ISBN 9780199278985"
          - id: foster-2005
            loc: "Before the Muses, pp. 99–220"
            identifier: "ISBN 9781883053765"
        date_range: "SB recension attributed to Sîn-lēqi-unninni, late 2nd millennium BCE (ca. 1200); transmitted through the 1st millennium. OB and MB forerunners ca. 1700–1400 BCE."
        summary: "King Gilgameš of Uruk and his wild companion Enkidu undertake heroic adventures: defeating the giant Ḫumbaba in the Cedar Forest, slaying the Bull of Heaven, and refusing Ishtar's marriage offer. Enkidu's death plunges Gilgameš into a search for immortality, leading him to Uta-napišti the flood survivor; the epic closes with his return to Uruk having understood that immortality lies only in the works of one's hands."
        variants: "SB Sîn-lēqi-unninni recension dominant (12 tablets); OB and MB forerunners (Pennsylvania tablet, Yale tablet, Sippar tablet, Boğazköy fragments) preserve substantial earlier material treated separately by George 2003. Tablet XI's flood narrative is heavily indebted to *Atra-ḫasīs*."
        scope_uncertain: false
        identifier_missing: false
        notes: "George 2003 is definitive. The Sumerian Gilgameš poems (ETCSL 1.8.1.x) are out of scope here as primary; comparative reference in introduction and footnotes."

      - id: etana
        title: "Etana"
        native_title: "Etana"
        sources:
          - id: foster-2005
            loc: "Before the Muses, pp. 533–554"
            identifier: "ISBN 9781883053765"
          - id: dalley-2008
            loc: "Myths from Mesopotamia, pp. 189–202"
            identifier: "ISBN 9780199538362"
        date_range: "Old Babylonian recension (Sippar tablets, ca. 1700 BCE); Middle Assyrian recension; Standard Babylonian recension (Nineveh, 7th c. BCE)."
        summary: "Etana, an early king of Kish granted kingship by the gods but lacking an heir, aids a wounded eagle imprisoned in a pit by the serpent he has betrayed. In gratitude, the eagle carries Etana on his back up to heaven to seek the plant of birth from Anu and Ishtar."
        variants: "Three substantial recensions (OB, MA, SB) differing in detail. Ending lost in all extant copies."
        scope_uncertain: false
        identifier_missing: false
        notes: "K.2606 + duplicates (SB). Saggs 1986 published an important join."

  # ── IV. Royal legends and pseudo-historical epics ────────────────────

  - id: royal_legend
    name: "Royal legends and pseudo-historical epics"
    stories:
      - id: birth-legend-of-sargon
        title: "The Birth Legend of Sargon"
        native_title: "(autobiographical incipit: 'I, Sargon, mighty king...')"
        sources:
          - id: westenholz-1997
            loc: "Legends of the Kings of Akkade, pp. 36–49"
            identifier: "ISBN 9780931464850"
          - id: foster-2005
            loc: "Before the Muses, pp. 912–913"
            identifier: "ISBN 9781883053765"
        date_range: "First-millennium Babylonian/Assyrian recension (likely Sargon II's reign, late 8th c. BCE, and after); the legendary tradition is older."
        summary: "Sargon, a self-styled abandoned infant put in a basket of reeds, sealed with bitumen, and cast on the river, is rescued by Aqqi the water-drawer, raised as a gardener, and ultimately rises to kingship of Akkad. The pseudo-autobiography opens with a famous first-person address."
        variants: "Several manuscripts, generally agreeing."
        scope_uncertain: false
        identifier_missing: false
        notes: "K.3401 + duplicates. Striking similarity to the biblical Moses birth account — discussed in the influences chapter."

      - id: king-of-battle
        title: "The King of Battle (šar tamḫāri)"
        native_title: "šar tamḫāri"
        sources:
          - id: westenholz-1997
            loc: "Legends of the Kings of Akkade, pp. 102–139"
            identifier: "ISBN 9780931464850"
          - id: foster-2005
            loc: "Before the Muses, pp. 252–257"
            identifier: "ISBN 9781883053765"
        date_range: "Middle Babylonian Amarna recension (14th c. BCE, EA 359); Neo-Assyrian Nineveh recension (7th c. BCE)."
        summary: "Sargon of Akkad campaigns against Nūr-Daggal, ruler of distant Anatolian Purušḫanda, at the request of merchants who have been mistreated. The legend highlights Sargon's reach to the far west and his readiness to defend the trade routes of his subjects."
        variants: "Amarna and Nineveh recensions differ substantially; the Amarna copy was preserved in an Egyptian royal archive — direct evidence for the legend's international circulation in Akkadian as a literary lingua franca."
        scope_uncertain: false
        identifier_missing: false
        notes: "EA 359 (Amarna; Cairo 48396); K.13228 + duplicates (Nineveh)."

      - id: great-revolt-against-naram-sin
        title: "The Great Revolt against Narām-Sîn"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: westenholz-1997
            loc: "Legends of the Kings of Akkade, pp. 221–262 (chapter 9)"
            identifier: "ISBN 9780931464850"
        date_range: "Old Akkadian exercise tablet (text 15) ca. 2200 BCE; three Old Babylonian recensions (texts 16A, 16B, 17) and one Old Babylonian excerpt with curse formula (text 19), ca. 1700 BCE."
        summary: "A coalition of city-rulers led by Iphur-Kiš of Kish and Amar-Girid of Uruk rises against Narām-Sîn of Akkad, who defeats them after a sequence of battles framed by divine warning and royal piety. The composition is preserved in four substantially different recensions, each emphasising a different aspect of the revolt and its suppression."
        variants: "Four recensions: (1) an Old Akkadian exercise tablet, (2) two OB excerpt tablets following the historical descriptions closely, (3) an incomplete OB recension, (4) an OB excerpt tablet ending with a votive-style curse formula."
        scope_uncertain: false
        identifier_missing: false
        notes: "Added per inventory-audit finding A4. One of the major OB narrative compositions about an Akkadian king, comparable in scholarly weight to the *Birth Legend of Sargon*. Westenholz 1997 publishes all four recensions in synopsis."

      - id: naram-sin-and-lord-of-apishal
        title: "Narām-Sîn and the Lord of Apišal"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: westenholz-1997
            loc: "Legends of the Kings of Akkade, pp. 173–188 (chapter 6)"
            identifier: "ISBN 9780931464850"
        date_range: "Neo-Assyrian recension; underlying composition Akkadian, possibly OB."
        summary: "A short Akkadian narrative legend about Narām-Sîn's siege of Apišal, distinct from the *Cuthaean Legend* and from *Erra and Narām-Sîn*. Survives on a single Neo-Assyrian tablet."
        variants: "Single recension."
        scope_uncertain: false
        identifier_missing: false
        notes: "Added per inventory-audit finding A5."

      - id: erra-and-naram-sin
        title: "Erra and Narām-Sîn"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: westenholz-1997
            loc: "Legends of the Kings of Akkade, pp. 189–202 (chapter 7)"
            identifier: "ISBN 9780931464850"
        date_range: "Old Babylonian recension, ca. 1700 BCE."
        summary: "An Old Babylonian narrative composition pairing the war-god Erra with king Narām-Sîn, distinct from both the first-millennium *Erra and Išum* (different protagonist and period) and the *Cuthaean Legend* (different framing and recension). Preserved on a single OB tablet."
        variants: "Single OB recension."
        scope_uncertain: false
        identifier_missing: false
        notes: "Tablet BM 120003 (British Museum); editio princeps Lambert *AfO* 24 (1973), critical edition Westenholz 1997. Added per inventory-audit finding A3."

      - id: cuthean-legend-of-naram-sin
        title: "The Cuthaean Legend of Narām-Sîn"
        native_title: "(Narām-Sîn naru text)"
        sources:
          - id: westenholz-1997
            loc: "Legends of the Kings of Akkade, pp. 263–368 (with parallel OB and SB recensions)"
            identifier: "ISBN 9780931464850"
          - id: foster-2005
            loc: "Before the Muses, pp. 344–356"
            identifier: "ISBN 9781883053765"
        date_range: "Old Babylonian original ca. 1700 BCE; Standard Babylonian recension transmitted through the 1st millennium."
        summary: "A pseudo-autobiographical naru-text in which Narām-Sîn of Akkad recounts how he rashly waged war against monstrous invaders against the divine warning, suffered catastrophic defeat, and finally learned wisdom. The text closes with an injunction to the future king: consult oracles before war."
        variants: "OB and SB recensions differ in framing details; both anchor the legend in Cutha (Kutha), city of Nergal."
        scope_uncertain: false
        identifier_missing: false
        notes: "Foundational text of the Akkadian *naru* (pseudo-autobiographical-royal) genre."

      - id: elegy-on-death-of-naram-sin
        title: "Elegy on the Death of Narām-Sîn"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: westenholz-1997
            loc: "Legends of the Kings of Akkade, pp. 203–220 (chapter 8)"
            identifier: "ISBN 9780931464850"
        date_range: "Old Babylonian or later recension; tradition older."
        summary: "A short narrative composition mourning the death of Narām-Sîn, closing the OB Narām-Sîn legend cycle. The chapter brief should evaluate whether the elegy's narrative substance warrants a full chapter or appendix treatment."
        variants: "Single recension."
        scope_uncertain: false
        identifier_missing: false
        notes: "Added per inventory-audit finding A6. The auditor flagged this entry's narrative substance as possibly below the chapter-inclusion threshold; flagged for editorial decision at chapter-briefs stage."

      - id: tukulti-ninurta-epic
        title: "The Tukulti-Ninurta Epic"
        native_title: "(no preserved native title)"
        sources:
          - id: machinist-1978
            loc: "PhD dissertation, Yale University, 1978, entire"
            identifier: "Yale-diss-1978-Machinist"
          - id: foster-2005
            loc: "Before the Muses, pp. 298–317"
            identifier: "ISBN 9781883053765"
        date_range: "Middle Assyrian; composed shortly after the events it describes (Tukulti-Ninurta I's campaign against Kashtiliash IV of Babylon, ca. 1230 BCE)."
        summary: "Tukulti-Ninurta I of Assyria wages war against Kashtiliash IV of Babylon, who has broken the treaty between the two kingdoms. The epic frames the campaign as Marduk's abandonment of Babylon for Aššur's sake; Tukulti-Ninurta is divinely guided to victory and to the carrying-off of Marduk's statue."
        variants: "Composite manuscript tradition with substantial damage."
        scope_uncertain: false
        identifier_missing: false
        notes: "Witnesses include VAT 9820, VAT 9596 + 12960, and VAT 10358 in the Vorderasiatisches Museum Berlin (per the SEAL Sources of Early Akkadian Literature project, https://seal.huji.ac.il/node/1592). VAT identifiers to be verified against CDLI before chapter-claims, per inventory-audit finding A12."

  # ── V.A Wisdom: reflective dialogue and complaint ────────────────────

  - id: wisdom_dialogic
    name: "Wisdom: reflective dialogue and complaint"
    stories:
      - id: dialogue-between-man-and-god
        title: "Dialogue between a Man and his God"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: foster-2005
            loc: "Before the Muses, p. 148"
            identifier: "ISBN 9781883053765"
        date_range: "Old Babylonian, late OB period (reign of Ammi-Ditana, ca. 1683–1640 BCE); attributed by colophon to the scribe Kalbanum."
        summary: "A first-person Akkadian wisdom-dialogue between a sufferer and his personal god: the man complains of unjust suffering, the god answers, and reconciliation is reached. The earliest known Akkadian-language theodicy composition, antedating the Babylonian Theodicy by roughly 700 years."
        variants: "Single OB tablet, AO 4462 (Louvre)."
        scope_uncertain: false
        identifier_missing: false
        notes: "Added per inventory-audit finding A2-MISSING. Editio princeps Lambert, *Archiv für Orientforschung* 19 (1959–60); recent critical edition Hätinen, *KASKAL* 16 (2019). Tablet AO 4462 (Louvre, attributed to Kalbanum, reign of Ammi-Ditana). The principal precursor of *Babylonian Theodicy* and *Ludlul bēl nēmeqi* and a major piece of the Akkadian theodicy tradition."

      - id: ludlul-bel-nemeqi
        title: "Ludlul bēl nēmeqi (I will praise the lord of wisdom)"
        native_title: "Ludlul bēl nēmeqi"
        sources:
          - id: oshima-2014
            loc: "Babylonian Poems of Pious Sufferers, pp. 1–200"
            identifier: "ISBN 9783161536366"
          - id: lambert-1960
            loc: "Babylonian Wisdom Literature, pp. 21–62"
            identifier: "ISBN 9781575060040"
          - id: foster-2005
            loc: "Before the Muses, pp. 392–409"
            identifier: "ISBN 9781883053765"
        date_range: "Kassite-period composition (ca. 1300 BCE), traditionally attributed to Šubši-mešrê-Šakkan; transmitted through the 1st millennium."
        summary: "First-person poetic monologue of a sufferer who has lost everything — health, property, social standing — despite his piety. He recounts his vivid dreams of three intercessors who lift his afflictions; the poem concludes with restoration and a hymn of praise to Marduk, the inscrutable 'lord of wisdom'."
        variants: "Multiple manuscripts from Aššur, Nineveh, and Sippar. Oshima 2014 supersedes Lambert 1960 for textual readings, incorporating joins published 1960–2014."
        scope_uncertain: false
        identifier_missing: false
        notes: "Four-tablet poem. Often paired with the Babylonian Theodicy as the central Akkadian theodicy texts."

      - id: babylonian-theodicy
        title: "The Babylonian Theodicy"
        native_title: "(authored by Saggil-kīnam-ubbib, named by acrostic)"
        sources:
          - id: oshima-2014
            loc: "Babylonian Poems of Pious Sufferers, pp. 201–380"
            identifier: "ISBN 9783161536366"
          - id: lambert-1960
            loc: "Babylonian Wisdom Literature, pp. 63–91"
            identifier: "ISBN 9781575060040"
          - id: foster-2005
            loc: "Before the Muses, pp. 914–922"
            identifier: "ISBN 9781883053765"
        date_range: "ca. 1000 BCE; the acrostic of the poem spells out the author's name and a prayer formula."
        summary: "Acrostic dialogue between a sufferer and his wise friend on the problem of why the wicked prosper while the pious suffer. The friend defends the gods and the social order; the sufferer presses ever more pointed objections; the dialogue ends in formal closure rather than resolution."
        variants: "Multiple manuscripts; Oshima 2014 supersedes Lambert 1960 for textual readings."
        scope_uncertain: false
        identifier_missing: false
        notes: "27-stanza acrostic. Saggil-kīnam-ubbib is named in colophons of incantation tablets."

      - id: dialogue-of-pessimism
        title: "Dialogue of Pessimism (Master and Servant)"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: lambert-1960
            loc: "Babylonian Wisdom Literature, pp. 139–149"
            identifier: "ISBN 9781575060040"
          - id: foster-2005
            loc: "Before the Muses, pp. 923–926"
            identifier: "ISBN 9781883053765"
        date_range: "Standard Babylonian recension; underlying text 1st millennium or earlier."
        summary: "Master proposes a series of actions (going to the palace, hosting a banquet, taking a wife, doing a good deed); the servant agrees and supplies a reason; the master then reverses, and the servant supplies an opposite reason. The poem ends with the master's despairing question — what then is good? — and the servant's macabre answer."
        variants: "Single recension, multiple manuscripts."
        scope_uncertain: false
        identifier_missing: false
        notes: "K.7674 + duplicates."

  # ── V.B Wisdom: practical instruction ────────────────────────────────

  - id: wisdom_practical
    name: "Wisdom: practical instruction"
    stories:
      - id: counsels-of-wisdom
        title: "Counsels of Wisdom"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: lambert-1960
            loc: "Babylonian Wisdom Literature, pp. 96–107"
            identifier: "ISBN 9781575060040"
          - id: foster-2005
            loc: "Before the Muses, pp. 412–414"
            identifier: "ISBN 9781883053765"
        date_range: "First-millennium recension; underlying tradition older."
        summary: "Father-to-son instruction comprising about 160 lines of practical and ethical advice — on speech and silence, choice of friends and wife, treatment of the poor, business honesty, and conduct before officials. The closest Akkadian equivalent to Egyptian *Instruction* genres."
        variants: "Several manuscripts, fragmentary; reconstruction provisional."
        scope_uncertain: false
        identifier_missing: false
        notes: "K.4509 + duplicates."

      - id: counsels-of-pessimist
        title: "Counsels of a Pessimist"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: lambert-1960
            loc: "Babylonian Wisdom Literature, pp. 107–109"
            identifier: "ISBN 9781575060040"
          - id: foster-2005
            loc: "Before the Muses, pp. 415–416"
            identifier: "ISBN 9781883053765"
        date_range: "First-millennium recension."
        summary: "Short fragmentary instruction in the wisdom mode, emphasizing the transience of life and the futility of striving. The title reflects its rhetorical kinship to the Dialogue of Pessimism rather than a textual relationship."
        variants: "Single fragmentary recension."
        scope_uncertain: false
        identifier_missing: false
        notes: "K.7897."

      - id: shima-milka
        title: "Šimâ milka (Hear the counsel) / Instructions of Šūpê-amēli"
        native_title: "Šimâ milka"
        sources:
          - id: cohen-2013
            loc: "Wisdom from the Late Bronze Age, pp. 81–176 (Emar, Ugarit, Hattusa recensions in synopsis)"
            identifier: "ISBN 9781589836846"
          - id: foster-2005
            loc: "Before the Muses, pp. 416–421"
            identifier: "ISBN 9781883053765"
        date_range: "Late Bronze Age peripheral cuneiform recensions (Emar, Ugarit, Hattusa); 14th–13th c. BCE; original earlier."
        summary: "A father, the sage Šūpê-amēli, instructs his son in practical wisdom — on travel, friends, women, debts, and the limits of human knowledge. The son responds with a long pessimistic reflection on the futility of all counsel in the face of mortality."
        variants: "Three substantially overlapping recensions from Emar, Ugarit, and Hattusa; Cohen 2013 publishes them in synopsis."
        scope_uncertain: false
        identifier_missing: false
        notes: "Emar 6/4 No. 778; RS 22.439 (Ugarit); KUB 4.3 (Hattusa). The peripheral attestation is itself evidence for Akkadian's role as international literary lingua franca."

  # ── VI. Disputations and animal fables ───────────────────────────────

  - id: disputations
    name: "Disputations and animal fables"
    stories:
      - id: tamarisk-and-date-palm
        title: "The Tamarisk and the Date Palm"
        native_title: "(no preserved native title)"
        sources:
          - id: lambert-1960
            loc: "Babylonian Wisdom Literature, pp. 151–164"
            identifier: "ISBN 9781575060040"
          - id: foster-2005
            loc: "Before the Muses, pp. 927–930"
            identifier: "ISBN 9781883053765"
        date_range: "Old Babylonian recension (early 2nd millennium); Middle Assyrian recension; possibly later as well."
        summary: "Two trees argue before the king as to which is more useful: the tamarisk for its uses in cult, scribal craft, and royal regalia; the date palm for its sustenance, shade, and rope-making fiber. The dispute is staged as a court trial."
        variants: "OB and MA recensions differ in detail; the OB version is the older."
        scope_uncertain: false
        identifier_missing: false
        notes: "Ancestral to the Aramaic / biblical 'trial of trees' motif (cf. *Aḥiqar*) — discussed in the influences chapter."

      - id: ox-and-horse
        title: "The Ox and the Horse"
        native_title: "(no preserved native title)"
        sources:
          - id: lambert-1960
            loc: "Babylonian Wisdom Literature, pp. 175–185"
            identifier: "ISBN 9781575060040"
          - id: foster-2005
            loc: "Before the Muses, pp. 936–938"
            identifier: "ISBN 9781883053765"
        date_range: "First-millennium Babylonian/Assyrian recension; tradition possibly earlier."
        summary: "Two domestic animals contend before a god, each arguing the dignity of his own labor: the ox boasts of the plough, the canal, and the king's table; the horse boasts of the chariot, the chase, and the warrior's victory."
        variants: "Multiple fragments; reconstruction provisional."
        scope_uncertain: false
        identifier_missing: false
        notes: "K.4231 + duplicates."

      - id: nisaba-and-wheat
        title: "The Series of Nisaba and Wheat"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: lambert-1960
            loc: "Babylonian Wisdom Literature, pp. 168–175"
            identifier: "ISBN 9781575060040"
        date_range: "First-millennium Babylonian recension."
        summary: "A disputation in which the grain goddess Nisaba and the personified Wheat (Akk. *ašnan*) contend over agricultural primacy — divine patronage versus the staple itself. Heavily fragmentary."
        variants: "Single recension, fragmentary."
        scope_uncertain: false
        identifier_missing: false
        notes: "Lambert 1960 is the only modern treatment."

      - id: fable-of-the-willow
        title: "The Fable of the Willow"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: lambert-1960
            loc: "Babylonian Wisdom Literature, pp. 165–167"
            identifier: "ISBN 9781575060040"
        date_range: "First-millennium recension."
        summary: "Disputation in which the willow tree pleads its case for usefulness against rival plants. Heavily fragmentary."
        variants: "Single damaged manuscript."
        scope_uncertain: false
        identifier_missing: false
        notes: "Discrete composition per Lambert 1960's chapter 7 'Fables or Contest Literature' arrangement (cleared by inventory-audit finding A11). Plot summary is generic; spot-check against Foster 2005 for any detail-level claims before chapter-claims."

      - id: series-of-the-fox
        title: "The Series of the Fox"
        native_title: "iškar šēlebi"
        sources:
          - id: kienast-2003
            loc: "Iškar šēlebi, pp. 1–260 (critical edition)"
            identifier: "ISBN 9783515081283"
          - id: lambert-1960
            loc: "Babylonian Wisdom Literature, pp. 186–209"
            identifier: "ISBN 9781575060040"
          - id: foster-2005
            loc: "Before the Muses, pp. 931–935"
            identifier: "ISBN 9781883053765"
        date_range: "First-millennium Babylonian/Assyrian recension; underlying tradition possibly earlier."
        summary: "A long fable cycle in which the fox, accused before the gods of crimes by his fellow animals, defends himself with cunning rhetoric, attempting to turn each charge against his accusers. Multiple tablets and scenes survive."
        variants: "Multiple manuscripts; Kienast 2003 supersedes Lambert 1960 for textual readings."
        scope_uncertain: false
        identifier_missing: false
        notes: "Roughly 200 lines preserved across the surviving tablets."

      - id: fable-of-the-riding-donkey
        title: "The Fable of the Riding-Donkey"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: lambert-1960
            loc: "Babylonian Wisdom Literature, pp. 209–212"
            identifier: "ISBN 9781575060040"
          - id: foster-2005
            loc: "Before the Muses, pp. 940–941"
            identifier: "ISBN 9781883053765"
        date_range: "First-millennium recension."
        summary: "A brief animal fable in which a riding-donkey complains about its lot to the man who owns it. Survives in fragments only."
        variants: "Single damaged manuscript."
        scope_uncertain: false
        identifier_missing: false
        notes: "Renamed from 'Poor Man and the Donkey' per inventory-audit finding A10. Lambert 1960 chapter 7 lists this composition as 'The Fable of the Riding-Donkey'; the prior title was a non-standard label, possibly conflated with *The Poor Man of Nippur*."

  # ── VII. Visionary and popular narratives ────────────────────────────

  - id: visionary_popular
    name: "Visionary and popular narratives"
    stories:
      - id: underworld-vision-of-an-assyrian-prince
        title: "The Underworld Vision of an Assyrian Prince (Kummâ)"
        native_title: "(no preserved native title; modern designation)"
        sources:
          - id: livingstone-1989
            loc: "SAA 3, no. 32 (critical edition with translation and apparatus)"
            identifier: "ISBN 9789515700360"
          - id: foster-2005
            loc: "Before the Muses, pp. 832–839"
            identifier: "ISBN 9781883053765"
        date_range: "Neo-Assyrian; reign of Aššurbanipal (7th c. BCE) likely. The prince Kummâ may be a literary persona."
        summary: "An Assyrian prince Kummâ recounts his terrifying dream-journey to the netherworld. He sees the underworld assembly with monstrous demons in attendance and is finally returned to life with a divine warning. The vision is framed as a moral and political lesson on royal piety."
        variants: "Single recension."
        scope_uncertain: false
        identifier_missing: false
        notes: "VAT 10057 (Aššur) — Vorderasiatisches Museum Berlin. Tablet identifier corrected from 'K.883 + K.2727 (Nineveh)' per inventory-audit finding A2. Livingstone 1989 (SAA 3 no. 32) added to source registry as the standard critical edition."

      - id: poor-man-of-nippur
        title: "The Poor Man of Nippur"
        native_title: "(Akkadian incipit not preserved or never present)"
        sources:
          - id: foster-2005
            loc: "Before the Muses, pp. 357–364"
            identifier: "ISBN 9781883053765"
          - id: dalley-2008
            loc: "Myths from Mesopotamia, pp. 213–222"
            identifier: "ISBN 9780199538362"
        date_range: "Standard Babylonian recension (Sultantepe MS, 7th c. BCE); composition likely older."
        summary: "Gimil-Ninurta, a poor citizen of Nippur, exchanges his last goat for an audience with the city governor — only to be cheated by him. He revenges himself three times in absurd, escalating ways: as a ride-mooching nobleman, as a club-wielding stranger, and as a hidden assailant. A comic folktale of social inversion."
        variants: "Principal manuscript STT 38 (= SU 1951, 078; additional witnesses STT 39 and STT 116) — Sultantepe / ancient Ḫuzirina."
        scope_uncertain: false
        identifier_missing: false
        notes: "Tablet identifier corrected from 'SU 51/4 (Sultantepe)' per inventory-audit finding A1. Reference editions are Gurney *Anatolian Studies* 6 (1956) and 7 (1957); accessible English translations in Foster 2005 and Dalley 2008."

