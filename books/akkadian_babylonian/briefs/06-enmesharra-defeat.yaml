special_instructions: |
  Short, fragmentary composition (800–2000 words). Single critical edition (Lambert 2013); no other modern treatment. The text's significance is more ritual-theological than narrative — present it in connection with the Akītu festival and the Marduk Ordeal commentaries. The seven-sons motif is striking; preserve it, even though the order of the sons varies across manuscripts. This composition is part of the broader Marduk-cosmogonic dossier; cross-reference Enūma Eliš and (where appropriate) the Toil of Babylon. Mark all reconstructions with `[RECONSTRUCTION:]` tags.
