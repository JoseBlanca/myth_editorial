special_instructions: "This is the central wisdom text and a chapter of maximum length. Structure the chapter around the four-tablet division and the three healing dreams of Tablet III. Foreground: (1) the first-person voice and the sufferer's named identity (Šubši-mešrê-Šakkan); (2) the catalogue of afflictions in Tablet II — the loss of social standing, the bodily symptoms, the abandonment by personal god — as the most detailed case-history in Akkadian literature; (3) the three intercessor-dreams of Tablet III, named in order; (4) the seven-gate restoration in Esagil in Tablet IV; (5) the closing doxology and the inscrutability of Marduk. Note explicitly that ancient Babylonian scholars composed line-commentaries on Ludlul — the only wisdom text so honoured (commentaries are reserved for canonical compositions like Enūma Eliš). Cite Oshima 2014 for current readings and Lambert 1960 for the editorial history. Foster 2005 is the working English translation. Use [RECONSTRUCTION:] markers wherever Oshima's composite fills a gap from a different witness, naming the donor manuscript. The Job comparison is unavoidable but should be handled with discipline: structural parallel, not literary descent — the case for direct influence remains scholarly hypothesis, not consensus."
