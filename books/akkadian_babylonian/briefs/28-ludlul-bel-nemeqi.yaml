entities_glossary:
  - name: "Šubši-mešrê-Šakkan"
    role: hero
    first_mention_gloss_candidate: "the named sufferer-protagonist of the poem; speaks in first person throughout; traditionally the Kassite-period nobleman to whom the composition is attributed"
  - name: "Marduk"
    role: deity
    first_mention_gloss_candidate: "chief god of Babylon, the *bēl nēmeqi* (lord of wisdom) of the title; the inscrutable god whose wrath afflicts the sufferer and whose mercy ultimately restores him"
  - name: "Sarpānītu"
    role: deity
    first_mention_gloss_candidate: "consort of Marduk, named alongside him in the closing doxology"
  - name: "Laluralimma"
    role: hero
    first_mention_gloss_candidate: "the third intercessor in the dream sequence — the *kalû* (lamentation-priest) of Nippur who pronounces the formal absolution"
  - name: "ūmu (𒅔, dream)"
    role: ritual-term
    first_mention_gloss_candidate: "the dream-vision medium through which the three intercessors appear to the sufferer in Tablet III"
  - name: "šēdu and lamassu"
    role: deity
    first_mention_gloss_candidate: "the protective spirits — male šēdu, female lamassu — whose departure from the sufferer's body in Tablet I marks the onset of his catastrophe"
  - name: "Esagil"
    role: place
    first_mention_gloss_candidate: "Marduk's temple-complex in Babylon; site of the sufferer's restoration in Tablet IV"
  - name: "ludlul (𒅗𒍪𒈝)"
    role: ritual-term
    first_mention_gloss_candidate: "the cohortative verb 'let me praise' that opens the poem and gives it its incipit-title"

cultural_relevance:
  centrality: central
  centrality_evidence:
    - kind: attestation-volume
      detail: "Manuscripts attested at Aššur, Nineveh, Sippar, Babylon, Sultantepe, and Ḫuzirina — the broadest geographic spread of any Akkadian wisdom composition; transmitted continuously from the Kassite period through the Hellenistic"
      source: "oshima-2014 pp. 1–60 (manuscript catalog)"
    - kind: scholarly-attention
      detail: "Ancient Babylonian scholars composed line commentaries on Ludlul (preserved on tablets edited in the Cuneiform Commentaries Project at ORACC); a scholarly indicator of canonical status reserved for first-rank texts like Enūma Eliš"
      source: "oshima-2014 pp. 379–460 (commentary tradition); ORACC/CCP"
    - kind: ritual-context
      detail: "Specific lines cited and adapted in Neo-Babylonian and Late Babylonian prayer compositions; transmitted in *bīt mummi* scribal training"
      source: "oshima-2014 pp. 1–10"
    - kind: scholarly-attention
      detail: "Universally treated in modern scholarship as the central Akkadian theodicy text, the Akkadian counterpart to the biblical Job"
      source: "bottero-2001 pp. 251–267; foster-2007 pp. 21–24"
  function:
    - role: didactic
      basis: "Presents the proper response of a pious sufferer to inscrutable divine wrath — submission, lament, eventual praise — modelling theological conduct for the literate elite"
      source: "oshima-2014 pp. 11–14"
    - role: literary
      basis: "First-person poetic monologue with elaborate dream-vision sequence; central to the Akkadian poetic canon and explicitly engaged with by later wisdom compositions"
      source: "lambert-1960 pp. 21–27"
    - role: ritual-aetiological
      basis: "Closes with the sufferer entering Esagil and being restored at the seven gates; the structure recalls and may have informed the New Year (Akītu) restoration sequence"
      source: "oshima-2014 pp. 1–10"
  cross_cultural_parallels:
    - other_culture: "biblical Israel"
      parallel: "Universally cited in scholarship as the Akkadian counterpart to the biblical Job — the same problem of unjust suffering by a pious individual, the same dialogic structure of lament and consolation, the same eventual restoration"
      source: "bottero-2001 pp. 251–267"
    - other_culture: "biblical Israel"
      parallel: "The dream-intercession sequence parallels the dream-revelation tradition of the Joseph narrative and of Daniel; the doxology closing parallels Psalm 30 and similar thanksgiving psalms"
      source: "oshima-2014"
    - other_culture: "Sumerian"
      parallel: "The Sumerian *Man and his God* (ETCSL 5.2.4) is a structural ancestor in the lament-and-restoration form, comparative only"
      source: "lambert-1960"

comparative_hooks:
  - other_culture: "biblical Israel"
    parallel: "Job's structure (lament, dialogue, theophany, restoration) closely parallels Ludlul's; Oshima frames the two as the principal monuments of an ancient Near Eastern theodicy genre"
    source: "oshima-2014"
  - other_culture: "biblical Israel"
    parallel: "Psalm 30 ('I will extol thee, O Lord, for thou hast lifted me up') exhibits the same praise-after-restoration structure; the Akkadian *ludlul* and Hebrew *aromemkā* function as parallel cohortative incipits"
    source: "oshima-2014"
  - other_culture: "Sumerian"
    parallel: "*Man and his God* (ETCSL 5.2.4) and *Ur-lament* compositions stand behind Ludlul as Sumerian-substrate compositions of the same dialogic-lament family"
    source: "lambert-1960"
  - other_culture: "Akkadian (intra-tradition)"
    parallel: "Direct continuity with *Dialogue between a Man and his God* (ch. 27) and direct kinship with the *Babylonian Theodicy* (ch. 29) — Ludlul stands between them as the poem of resolved theodicy versus the Theodicy's unresolved one"
    source: "oshima-2014"

