special_instructions: |
  Short composition (800–2000 words) — but more substantive than its length suggests, because the text is the illustrative type for the incantation-prologue cosmogony genre. Foreground the form: the cosmogony is functional, framing a magical cure. The cosmogonic chain (Anu → heavens → earth → rivers → canals → marshes → worm) is the signature feature; preserve its hierarchy. Pair analytically with Founding of Eridu (chapter 10). The text is often cited as "the shortest Akkadian cosmogony" — but the chapter should resist treating it as a curiosity; it is a window into how cosmogony is deployed in everyday Mesopotamian life.
