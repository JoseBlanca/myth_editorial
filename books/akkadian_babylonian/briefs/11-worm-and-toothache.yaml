special_instructions: |
  Short Akkadian incantation against toothache, with a cosmogonic prologue. The principal cuneiform publication is CT 17, plate 50 (R. Campbell Thompson, *Cuneiform Texts from Babylonian Tablets in the British Museum*, Part XVII, London: British Museum, 1903). Modern accessible English translation: Foster 2005 *Before the Muses* (3rd ed., CDL Press), pp. 995–996. Speiser's older ANET translation is excluded per sources.yaml (cited only for translation history). Lambert 2013 may include the text in his "Mythological Introductions on Creation" section (pp. 399–402, chapter 37) but this has not been directly verified — the chapter handles Lambert 2013 conservatively as a possible but unverified additional edition source. Dalley 2008 *Myths from Mesopotamia* does NOT contain this composition.

  CRITICAL CONTENT MODEL: The composition is a short incantation against toothache, with a cosmogonic prologue that grounds the magical efficacy of the cure. The text consists of:

  1. The seven-step cosmogonic chain: Anu created heaven; heaven created earth; earth created rivers; rivers created canals (irrigation ditches); canals created marsh / mud; marsh / mud created the worm. The chain is hierarchical and sequential — each step generates the next.
  2. The worm's lament before Šamaš (sun-god) and Ea (god of fresh waters): the worm weeps and asks what it shall be given to eat.
  3. The gods' offer: "I will give you the ripe fig and the apricot."
  4. The worm's defiance and demand: "What good is the ripe fig and the apricot? Lift me up, and let me dwell between the teeth and the gums! I will suck the blood of the tooth, and I will gnaw on the bone of the jaw!"
  5. Ea's curse: "Because you have said this, O worm, may Ea strike you with the might of his hand!"
  6. Ritual prescription: instructions for the practitioner to apply the incantation (specific ritual-medical actions; partly recoverable from the closing portion of the tablet).

  The composition's signature feature is the cosmogonic chain — preserve its hierarchy explicitly. Pair analytically with *The Founding of Eridu* (Chapter 10) as the two principal incantation-prologue cosmogonies in the Akkadian dossier.

  The Akkadian word for the worm is *tūltu* (also spelled *tu-ul-tu*, *tultu*); the text personifies the worm as a speaking agent without making it a deity. Mark the *tūltu* / "the worm" first-mention gloss.

  Verbatim quotations should be limited to the cosmogonic chain itself (well-attested across translations) and the worm's defiance speech (also well-attested). The closing ritual-prescription is partly damaged in some witnesses; treat it descriptively rather than verbatim.

  Note: an Old Babylonian variant cosmogonic-chain incantation involving worms is preserved on YOS 11, 5 (Hussey-van Dijk publication; "Anu begot heaven, heaven brought forth earth, Earth bore stench, stench bore mud, Mud bore fly, fly bore worm"). This OB variant has a different chain (with stench and fly intermediate); the relationship between it and the first-millennium CT 17 50 *Worm and the Toothache* is interesting comparative material but the chapter focuses on the first-millennium recension. Mark the OB variant in a [VARIANT:] sub-clause.

  R. Campbell Thompson 1903 (CT 17 50) is the cuneiform-publication anchor; not currently in sources.yaml. Recommended for sources.yaml addition at inventory-audit. Cohen and Wasserman 2018 (the *RA* 112 reanalysis of the Hurrian Mari 5 toothache ritual) is named in a comparative-hook only; named-but-flagged.
