    - other_culture: "Hurro-Hittite"
      parallel: "Hurrian rituals against toothache are also attested (e.g., Mari 5, the Hurrian toothache ritual studied in the recent reanalysis by Cohen and Wasserman 2018) — the comparative material confirms that the tooth-worm motif circulated in the broader cuneiform cultural sphere. The chapter's primary subject is the Akkadian text; the Hurrian comparandum is mentioned in the comparative-hooks for the influences chapter only."
      source: "hoffner-1998 (general Hittite mythology); the Hurrian toothache ritual at Mari 5 is treated in Cohen and Wasserman, 'A Hurrian Ritual Against Toothache: A Reanalysis of Mari 5', *Revue d'Assyriologie* 112 (2018), 31–50 (named-but-flagged; not in sources.yaml)"

