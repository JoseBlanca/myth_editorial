      source: "kvanvig-2011 (Genesis 1 cosmogonic chain)"
    - other_culture: "Worldwide (folk magic)"
      parallel: "Brief etiological narratives explaining diseases or pests via ad-hoc cosmogonies appear in many cultures' magical-medical traditions; the etiology-as-cure pattern (knowing the origin of an affliction grants power to address it) is widespread in folk-magical practice."
