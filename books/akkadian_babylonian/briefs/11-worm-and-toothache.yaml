# Brief revised 2026-05-08, before stage 10a, on the basis of preemptive
# Lambert 2013 TOC verification (DeGruyter Brill chapter landings) and
# the chapter 8 / 10 factcheck-round-1 page-range pattern. The original
# brief carried one upstream error:
# (1) Wrong Lambert 2013 page range — locked as pp. 396–398; that range
#     belongs to "The River Incantation" (Lambert 2013 chapter 36), not
#     "The Worm and the Toothache". Lambert 2013 may include *The Worm
#     and the Toothache* in his "Mythological Introductions on Creation"
#     section (pp. 399–402, Lambert 2013 chapter 37) — this is a chapter
#     in which Lambert collects multiple short cosmogonic incantation
#     prologues — but I have NOT directly verified that Lambert 2013
#     edits *The Worm and the Toothache* under that section. The chapter
#     therefore handles Lambert 2013 conservatively: as a possible (but
#     unverified) edition source within pp. 399–402.
#
# In place of Lambert 2013 as the locked critical edition, the chapter
# uses two anchor sources:
# - Foster 2005 *Before the Muses* (3rd ed.), pp. 995–996 (the
#   accessible English translation; this page reference is locked from
#   the original brief and is plausible — Foster 2005's "Magic and
#   Healing" / incantation section runs in the high-900s page range).
# - The original cuneiform publication: R. Campbell Thompson,
#   *Cuneiform Texts from Babylonian Tablets in the British Museum*,
#   Part XVII (London: British Museum, 1903), plate 50 — i.e., CT 17 50
#   (named-but-flagged; not currently in sources.yaml).
#
# Two manuscripts are referenced in the standard secondary literature:
# the Nineveh tablet (Aššurbanipal's library, the principal CT 17 50
# witness) and an Aššur duplicate. The composite text is stable; the
# incantation has been actively studied since Thompson 1903 and
# Speiser's translation in ANET (excluded as a current reference per
# sources.yaml's exclusion of *Speiser ANET*; cited only for translation
# history).

