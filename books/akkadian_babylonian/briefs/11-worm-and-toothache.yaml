      source: "bottero-2001 passim"
  function:
    - role: ritual-aetiological
      basis: "Etiology of dental caries embedded in an incantation against toothache; the cosmogony is functional, supporting the cure. Knowing the worm's origin is the practitioner's claim of authority to address it."
