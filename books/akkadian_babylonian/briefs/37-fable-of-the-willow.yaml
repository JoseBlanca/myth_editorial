special_instructions: "Short fragmentary text. The chapter must be very honest: only short sections of the manuscript are legible, and many details (including the willow's interlocutors) cannot be securely reconstructed. Reproduce the legible portion in extended translation; do not pad with conjectural narrative. Plot summary in the inventory is generic; spot-check Foster 2005 for any detail-level claims before drafting (per inventory-audit finding A11). The Sumerian *Tree and Reed* and Jotham's parable are the controlling cross-cultural hooks; do NOT retell them. Most of the genre work for this cycle is done collectively across chapters 34–39."
