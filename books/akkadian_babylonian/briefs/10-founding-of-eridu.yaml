target_length_words: 1800

special_instructions: |
  Short composition (800–2000 words). The text is a bilingual incantation prologue; the Sumerian column is in scope ONLY as integral to the Akkadian literary product (per scope.md), not as a Sumerian primary. Audit finding A8 flagged the Lambert 2013 page range for spot-checking before chapter-claims — note this in any source-pinning communication. Foreground the incantation-ritual function: this is not freestanding mythology but cosmogony deployed for magical efficacy. Use the alternative title "Bilingual Creation of the World by Marduk" alongside "Founding of Eridu" — both are in scholarly use. Treat alongside Worm and the Toothache (chapter 11) as the two principal incantation-prologue cosmogonies.
