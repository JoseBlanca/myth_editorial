# Brief revised 2026-05-08, before stage 10a, on the basis of preemptive
# Lambert 2013 TOC verification (DeGruyter Brill chapter landings;
# chapter 8 factcheck-round-1 finding F-1 page-range pattern). The
# original brief carried two upstream errors:
# (1) wrong Lambert 2013 page range — locked as pp. 376–383; actual
#     range for "The Founding of Eridu" is pp. 366–375. Pp. 376–383
#     belongs to "The First Brick" (Chapter 12 of this volume) per
#     the Lambert 2013 TOC verified at the DeGruyter Brill chapter
#     landing for "The First Brick" (doi:10.1515/9781575068619-028).
#     Lambert 2013's "Notes on the Other Texts" for the "Founding of
#     Eridu" chapter is at p. ~497–498 (alongside Damkina's Bond's
#     notes at p. 497).
# (2) wrong incipit attribution — the original brief identifies the
#     composition's opening as "enūma Anum ibnû šamê" ("When Anu
#     created the heavens"). This is incorrect: that incipit belongs
#     to a different incantation-prologue composition (or possibly to
#     Enūma Anu Enlil, the astrological series). The actual opening
#     of "The Founding of Eridu" / BM 93014 is about a primordial
#     state in which "the holy house, the house of the gods in the
#     holy place had not yet been made" — i.e., a negative-cosmogonic
#     opening of the type "X had not yet been done" rather than a
#     positive-action opening.
#
# Audit finding A8 (carried in the original brief's note) flagged the
# page range for spot-checking; this revision discharges that flag.
# The corrected brief follows.

