    source: "lambert-2013"
  - other_culture: "Akkadian (internal)"
    parallel: "*The Worm and the Toothache* (Chapter 11) — the closest internal comparandum among incantation-prologue cosmogonies; both compositions deploy a brief creation narrative as the magical-aetiological ground for a ritual incantation that follows on the same tablet."
