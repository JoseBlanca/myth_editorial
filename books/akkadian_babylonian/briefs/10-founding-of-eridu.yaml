cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Single bilingual manuscript BM 93014, but the composition's cosmogonic content has wide secondary-literature reception as one of the principal late-Babylonian creation texts outside *Enūma Eliš* itself."
      source: "lambert-2013, pp. 366–375"
    - kind: ritual-context
      detail: "The text is an incantation prologue — embedded in the recitation context of the E-Zida temple (possibly Nabu's at Borsippa). The cosmogony grounds the magical efficacy of the ritual that follows on the same tablet."
      source: "lambert-2013, pp. 366–375"
    - kind: scholarly-attention
      detail: "Important for the bilingual Sumerian-Akkadian tradition and for understanding how cosmogony was deployed in incantation; routinely treated alongside *Enūma Eliš* in discussions of Babylonian creation theology."
      source: "lambert-2013, pp. 366–375; bottero-2001 passim"
  function:
    - role: cosmological
      basis: "Narrates Marduk's creation of the primordial cities (Eridu, Babylon, Nippur via E-kur, Uruk via E-Aena), the rivers Tigris and Euphrates, and (with Aruru) humankind. A coherent if compressed cosmogony of city-foundation, river-creation, and anthropogony."
      source: "lambert-2013, pp. 366–375; foster-2005, p. 487"
    - role: ritual-aetiological
      basis: "Embedded as the prologue of a temple incantation; the cosmogony establishes the cosmic-creator authority of Marduk that the subsequent ritual invokes."
      source: "foster-2005, p. 487"
    - role: theological-political
      basis: "By placing Marduk at the centre of the foundational cosmogonic acts (creating Eridu — Ea's traditional cult-centre — and Esagil at Babylon, plus collaborating with Aruru in the creation of mankind), the composition articulates Marduk's cosmogonic supremacy in a form complementary to *Enūma Eliš* but framed in the bilingual scribal tradition rather than the Standard Babylonian epic register."
      source: "lambert-2013, pp. 366–375; bottero-2001 on Marduk's cosmogonic supremacy"
  cross_cultural_parallels:
    - other_culture: "Sumerian (comparative)"
      parallel: "The Sumerian column of the bilingual is integral to the Akkadian literary product. The composition straddles the Sumerian and Akkadian traditions in a way characteristic of late-Babylonian scholarly bilingualism."
      source: "etcsl"
    - other_culture: "Akkadian (internal)"
      parallel: "*Enūma Eliš* (Chapter 1) gives Marduk solo-credit for creating humankind from Qingu's blood; *The Founding of Eridu* gives Aruru a co-creator role. The two compositions articulate complementary anthropogonies — the epic-violent (*Enūma Eliš*) and the bilingual-collaborative (*Founding of Eridu*) — within the late-Babylonian Marduk cosmogony dossier."
      source: "lambert-2013"
    - other_culture: "Akkadian (internal)"
      parallel: "*The Worm and the Toothache* (Chapter 11) is the principal comparandum among incantation-prologue cosmogonies: a brief creation-of-the-world narrative framing a magical rite. *The Founding of Eridu* is the larger and more-developed instance of the same incantation-prologue cosmogony genre."
      source: "lambert-2013"
    - other_culture: "Hebrew Bible (Genesis 1)"
      parallel: "Negative-cosmogonic opening — 'X had not yet been made' / 'the earth was without form and void' — is a structural pattern shared with Genesis 1 and other ancient Near Eastern creation texts. The opening of *The Founding of Eridu* ('the holy house, the house of the gods in the holy place had not yet been made') falls within this typology."
      source: "kvanvig-2011"

