variants:
  classification: single-prevalent
  prevalent_version:
    source: lambert-2013
    why_prevalent: "Single bilingual recension preserved across multiple manuscripts that share the same incipit (enūma Anum ibnû šamê). Lambert 2013 is the modern edition."
  alternates:
    - source: lambert-2013
      difference: "Manuscripts vary in incidental wording in the Sumerian column; the Akkadian translation is more stable across witnesses."

entities_glossary:
  - name: "Anu"
    role: deity
    first_mention_gloss_candidate: "sky-god, first cosmic agent in the prologue ('When Anu created the heavens')"
  - name: "Ea (Enki)"
    role: deity
    first_mention_gloss_candidate: "wise god of fresh waters; cult founder of Eridu"
  - name: "Marduk"
    role: deity
    first_mention_gloss_candidate: "in some bilingual recensions, the demiurge; the text is sometimes called 'The Bilingual Creation of the World by Marduk'"
  - name: "Eridu"
    role: place
    first_mention_gloss_candidate: "ancient cult-center of Ea; first city in Mesopotamian tradition; cosmic center"
  - name: "Apsû"
    role: place
