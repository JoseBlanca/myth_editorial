special_instructions: |
  Short bilingual Sumerian-Akkadian composition preserved on a single manuscript, BM 93014 (British Museum). The text is an incantation prologue — the cosmogonic narrative is the opening of a longer ritual incantation recited in the E-Zida temple (probably Nabu's at Borsippa). Lambert 2013 pp. 366–375 is the standard modern critical edition. Foster 2005 *Before the Muses* (3rd ed.) p. 487 gives an accessible English translation under the editorial title "Marduk, Creator of the World" within the "Myths of Origins" sub-section (cf. chapter 8's COMPARATIVE-HOOK reference to Foster 2005's Myths of Origins). Dalley 2008 *Myths from Mesopotamia* does NOT contain this composition.

  CRITICAL CONTENT MODEL: This is NOT a freestanding mythology piece — it is a cosmogonic narrative deployed as the prologue of a ritual incantation, ending in the magical-aetiological move that grounds the ritual's efficacy. The cosmogony is short (about 40 lines preserved) but substantively rich:

  1. Negative-cosmogonic opening: "the holy house, the house of the gods in the holy place had not yet been made" — primordial state before any cosmic structures. (NOT "When Anu created the heavens" / *enūma Anum ibnû šamê* — that incipit belongs to a different composition.)
  2. Marduk creates Eridu and its temple in the Apsû (the primordial freshwater abyss). Eridu — Ea / Enki's traditional cult-centre — is the first cosmic structure made.
  3. Marduk creates Babylon and its temple Esagil; Nippur and its temple E-kur; Erech (Uruk) and its temple E-Aena; the other primordial cities.
  4. Marduk dams the cosmic waters; the earth is established as habitable land.
  5. Marduk creates the rivers Idiglat (Tigris) and Purattu (Euphrates), naming them and setting them in their courses.
  6. Marduk and Aruru together create humankind — "the seed of mankind" — in order to settle the gods in their dwellings. This co-creator role for Aruru distinguishes this composition's anthropogony from *Enūma Eliš*'s solo-Marduk creation.
  7. The ritual incantation follows on the same tablet; the cosmogony grounds the magical authority that the incantation invokes.

  Multiple alternative editorial titles are in scholarly use: "The Founding of Eridu" (Lambert 2013); "The Bilingual Creation of the World by Marduk" / "Bilingual Version of the Creation Legend" (older usage from L. W. King's *The Seven Tablets of Creation*, 1902, and the older bilingual-version literature); "Marduk, Creator of the World" (Foster 2005). Use Lambert's title in the chapter heading; mention the alternative titles in the source-overview section.

  Treat alongside *The Worm and the Toothache* (Chapter 11) as the two principal incantation-prologue cosmogonies in the Akkadian dossier. Both are cosmogonic narratives in the service of magical rituals; both are short, formulaic, and ritually-grounded; both are preserved on tablets that combine the cosmogony with the magical text. *The Founding of Eridu* is the larger and more developed instance.

  All reconstructions must be flagged with [RECONSTRUCTION:] markers; the bilingual parallelism (Sumerian column glosses Akkadian and vice versa) is the primary internal-reconstruction mechanism. Mark the closing portion of the tablet (more heavily damaged) explicitly. Distinguish (a) the cosmogonic prologue (extensively preserved) from (b) the ritual incantation that follows on the same tablet (more fragmentary), and treat the chapter as primarily about (a).

  L. W. King's older publication of the bilingual text — *The Seven Tablets of Creation* II (1902), with the BM 93014 transliteration and translation — is named-but-flagged in this brief; King 1902 is not currently in sources.yaml. Lambert 2013 is the locked source-anchor, with Foster 2005 p. 487 as the accessible-translation anchor.
