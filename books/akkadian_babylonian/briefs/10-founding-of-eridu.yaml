lacunae:
  - source: lambert-2013
    location: "Single bilingual manuscript: BM 93014 (British Museum). Approximately 40 lines preserved in complete or nearly-complete form, with the remainder of the tablet fragmentary."
    what_is_missing: "Several lines of the bilingual columns are damaged; the parallel structure of the Sumerian and Akkadian columns allows partial reconstruction since each column glosses the other. The closing portion of the tablet is more heavily damaged than the opening."
    in_tradition_fills_available: "yes — the Sumerian column glosses the Akkadian and vice versa; Lambert 2013's edition exploits the bilingual parallelism for internal reconstruction. No external in-tradition donor source (no parallel manuscripts in any period) supplies fill for the more heavily damaged closing portion."

