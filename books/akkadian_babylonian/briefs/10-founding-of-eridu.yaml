cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Multiple manuscripts of the bilingual incantation prologue; the incipit enūma Anum ibnû šamê is widely echoed in Babylonian incantation literature."
      source: "lambert-2013, pp. 376–377"
    - kind: ritual-context
      detail: "The text is an incantation prologue — embedded in ritual practice — and was actively used in cult. Its cosmogonic narrative grounded the magical act."
      source: "foster-2005, p. 488; lambert-2013, p. 380"
    - kind: scholarly-attention
      detail: "Important for the bilingual tradition (Sumero-Akkadian) and for understanding how cosmogony was deployed in incantation."
      source: "lambert-2013, pp. 376–383"
  function:
    - role: cosmological
      basis: "Narrates the creation of heavens and earth and the founding of Eridu as world's first city — a brief but coherent cosmogony."
      source: "lambert-2013, pp. 376–383"
    - role: ritual-aetiological
      basis: "Embedded as the prologue of a ritual incantation; the cosmogony grounds the magical efficacy of the ritual that follows."
      source: "foster-2005, p. 488"
  cross_cultural_parallels:
    - other_culture: "Sumerian (comparative)"
      parallel: "The Sumerian column of the bilingual is integral; the composition straddles the Sumerian and Akkadian traditions."
      source: "etcsl"
    - other_culture: "Hebrew Bible"
      parallel: "Genesis 1's 'in the beginning God created the heavens and the earth' parallels the incipit 'When Anu created the heavens'; the introductory cosmogonic gesture is shared."
      source: "kvanvig-2011"
    - other_culture: "Akkadian (internal)"
      parallel: "The Worm and the Toothache shares the incantation-prologue cosmogony pattern — brief creation framing a magical act."
      source: "lambert-2013"

comparative_hooks:
  - other_culture: "Sumerian"
    parallel: "Bilingual nature integrates Sumerian and Akkadian columns; the Sumerian column is in scope only because it is integral to the Akkadian literary product as transmitted (per scope.md)."
    source: "etcsl"
  - other_culture: "Hebrew Bible (Genesis 1)"
    parallel: "Cosmogonic incipit pattern: 'When Anu created the heavens' / 'In the beginning God created the heavens'."
    source: "kvanvig-2011"
  - other_culture: "Akkadian (internal)"
    parallel: "The Worm and the Toothache as another brief cosmogony embedded in incantation; together with Founding of Eridu, they exemplify the incantation-prologue cosmogony genre."
    source: "lambert-2013"

