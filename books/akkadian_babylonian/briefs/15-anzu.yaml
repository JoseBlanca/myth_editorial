variants:
  classification: co-equal
  prevalent_version:
    source: annus-2001
    why_prevalent: "Two substantively different recensions: OB Anzû (3 tablets, Ningirsu hero, ca. 1700 BCE) and SB Anzû (2 tablets, Ninurta hero, 1st millennium). The SB recension is more complete and more widely attested in 1st-millennium libraries; the OB is earlier and shows the original framing. Neither alone is sufficient — the recensional difference is itself central to the chapter."
  alternates:
    - source: vogelzang-1988
      difference: "OB recension: hero is Ningirsu (the Lagash war-god); 3-tablet structure; Tablet's recovery from Enlil's bath at the start; Susa and Tell Asmar manuscripts."
    - source: annus-2001
      difference: "SB recension: hero is Ninurta (the more cosmopolitan war-god, identified with Ningirsu but distinct in pantheon); 2-tablet structure with divine-council frame; multiple Nineveh, Sultantepe, and Tarbiṣu manuscripts."

