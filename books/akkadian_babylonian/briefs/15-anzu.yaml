cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "OB recension on Susa and Tell Asmar tablets; SB recension at Nineveh, Sultantepe, Tarbiṣu, Aššur — wide first-millennium circulation."
      source: "annus-2001; vogelzang-1988"
    - kind: scholarly-attention
      detail: "Two modern critical editions (Annus 2001, Vogelzang 1988); foundational text for studying the Akkadian combat-myth."
      source: "annus-2001; vogelzang-1988"
    - kind: iconography
      detail: "The Anzû-Ninurta combat is depicted on Neo-Assyrian reliefs and seals; the bird-monster motif is widespread."
      source: "black-green-1992, s.v. Anzû"
  function:
    - role: theogonic
      basis: "Articulates Ninurta's establishment as warrior-of-the-gods; situates the storm-god-warrior in the cosmic hierarchy."
      source: "annus-2001 (commentary)"
    - role: royal-legitimation
      basis: "Ninurta's defeat of Anzû is invoked in royal inscriptions as a model for the king's defeat of his enemies."
      source: "foster-2007, pp. 35–39"
    - role: cosmological
      basis: "The theft of the Tablet of Destinies and its recovery articulate the precariousness of cosmic order and its dependence on heroic action."
      source: "annus-2001 (commentary)"
  cross_cultural_parallels:
    - other_culture: "Sumerian (comparative)"
      parallel: "Lugal-e (ETCSL 1.6.2) — Sumerian Ninurta epic against the asakku-monster; covers similar Ninurta-vs-monster motifs but is a distinct composition (out of scope here as primary, comparative in the influences chapter)."
      source: "etcsl"
    - other_culture: "Indo-European"
      parallel: "The HERO SLAY SERPENT formula — Indra-Vṛtra, Thor-Jörmungandr, Apollo-Python — structurally parallels Ninurta-Anzû; one of the clearest Akkadian instances of the widespread Indo-European storm-god/dragon-slaying typology."
      source: "annus-2001"
    - other_culture: "Hurro-Hittite"
      parallel: "Illuyanka, the Hittite serpent slain by the storm-god Tarḫunna; the storm-god-vs-monster pattern is shared."
      source: "hoffner-1998"

comparative_hooks:
  - other_culture: "Sumerian (Lugal-e)"
    parallel: "Lugal-e is the Sumerian Ninurta combat-epic; Anzû is the Akkadian. Treat as distinct compositions — Anzû is not a translation of Lugal-e. Per scope.md, Sumerian is comparative only."
    source: "etcsl 1.6.2"
  - other_culture: "Indo-European"
    parallel: "HERO SLAY SERPENT formula; the storm-god-defeats-dragon pattern is one of the deepest motifs in Indo-European mythology, with Akkadian Ninurta-Anzû as a Near Eastern instantiation."
    source: "annus-2001"
  - other_culture: "Hurro-Hittite (Illuyanka)"
    parallel: "Hittite Illuyanka — storm-god-defeats-serpent — a closely-related Anatolian instance of the pattern."
    source: "hoffner-1998"
  - other_culture: "Akkadian (internal)"
    parallel: "Marduk-Tiamat in Enūma Eliš and Ninurta-Anzû share the storm-god-cosmic-combat pattern; the Tablet of Destinies appears in both."
    source: "lambert-2013"

