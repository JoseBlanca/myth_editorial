variants:
  classification: co-equal
  prevalent_version:
    source: annus-2001
    why_prevalent: "Two substantively different recensions: OB Anzû (3 tablets, Ningirsu as hero, ca. 1700 BCE, Susa manuscripts only) and SB Anzû (3 tablets — Tablet I, II, III per Annus 2001 SAACT 3 ToC; Ninurta as hero; 1st millennium BCE). The SB recension is longer and more widely attested across 1st-millennium libraries (Nineveh, Sultantepe, Tarbiṣu, Aššur); the OB is earlier and shows the original framing. Neither alone is sufficient — the recensional difference is itself central to the chapter."
  alternates:
    - source: vogelzang-1988
      difference: "OB recension: hero is Ningirsu (the Lagash war-god); three-tablet structure; bath-theft motif preserved; Susa manuscripts only (Sb 9470 = OB Anzu II; Sb 14683 = OB Anzu III, both Louvre per SEAL HUJI). NOT attested on Tell Asmar tablets — the Tell Asmar Hoard's Anzû bird is iconographic (statue base), not a literary witness."
    - source: annus-2001
      difference: "SB recension: hero is Ninurta (the warrior-son of Enlil at Nippur). Ningirsu (the Lagash war-god) and Ninurta (the Nippur war-god) are treated by Black & Green 1992 as originally distinct cult-centre deities subsequently syncretized; the OB→SB substitution reflects the 1st-millennium cosmopolitan consolidation under the Nippur-centred name. Three-tablet structure (Tablet I, II, III per Annus 2001 SAACT 3 ToC); divine-council frame elaborated; multiple Nineveh, Sultantepe, Tarbiṣu, and Aššur manuscripts."

