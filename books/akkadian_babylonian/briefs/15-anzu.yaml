# ROUND 2 CORRECTIONS (2026-05-11)
# Revised after round-1 claims-factcheck (chapters/15-anzu.claims.factcheck.yaml)
# returned BLOCK with five HIGH findings. Brief-level corrections:
#   R2-1: SB Anzû recension structure corrected from "2 tablets" to
#         "3 tablets" (Tablet I, II, III per Annus 2001 SAACT 3 ToC;
#         independently confirmed by gatewaystobabylon, encyclopedia.com,
#         bildungblocks). The variants block (prevalent_version,
#         alternates) is corrected; the chapter-claims doc's own
#         EVIDENCE tokens at "SB Tablet III" had been internally
#         inconsistent with the previous "2 tablets" framing.
#   R2-2: Tell Asmar removed as an OB literary witness. The OB Anzû
#         literary manuscripts are from Susa only — Sb 9470 (= OB Anzu
#         II) and Sb 14683 (= OB Anzu III), both Louvre, per SEAL HUJI.
#         The "Tell Asmar" reference appears to confuse the Tell Asmar
#         Hoard iconographic statue (early-dynastic eye-statue with an
#         Anzû bird carved on the base — Black & Green s.v. Anzû) with
#         a literary tablet of the epic. The Tell Asmar Hoard Anzû
#         iconography is retained as iconographic, not literary,
#         evidence.
#   R2-3: Gerra (also Girra, Gibil) added to entities_glossary as the
#         second candidate-refuser in the SB Anzû divine-council
#         search. Canonical sequence is Adad → Gerra/Gibil → Šara
#         (three named candidates who all refuse before Ea proposes
#         Ninurta). Per gatewaystobabylon (verbatim "Adad (canal-
#         controller), Gerra, and Shara"), encyclopedia.com (verbatim
#         "Adad... Girru and Shara"), and altorientale-mythologie
#         (verbatim "Adad → Gibil → Šara").
#   R2-4: Ningirsu/Ninurta variant alternates entry hedged to reflect
#         the scholarly division — Black & Green 1992 are cited
#         (per Wikipedia s.v. Ningirsu) as treating Ningirsu and
#         Ninurta as "two gods from different cult centers in origin"
#         (Ningirsu = Lagash; Ninurta = Nippur), subsequently
#         syncretized; the question of original single-deity vs.
#         two-deities-merged is contested (Wikipedia s.v. Ninurta:
#         "Assyriologists are divided"). The brief's framing is
#         updated from "identified with Ningirsu but distinct in
#         pantheon" to "originally distinct cult-centre deities,
#         syncretized by the time of Gudea (late third millennium)."

