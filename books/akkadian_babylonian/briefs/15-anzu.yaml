special_instructions: |
  Co-equal recensions (4000–6000 words). Present the OB Anzû (Ningirsu
  hero, three tablets, Susa manuscripts only — Sb 9470 = OB Anzu II
  and Sb 14683 = OB Anzu III, both Louvre per SEAL HUJI) and SB Anzû
  (Ninurta hero, three tablets — Tablet I, II, III per Annus 2001
  SAACT 3 ToC) side by side in the body — the hero's identity change
  between recensions is one of the principal substantive variants and
  must NOT be glossed over. Vogelzang 1988 is the OB base; Annus 2001
  is the SB base. Mark dialect explicitly throughout.

  Tell Asmar is NOT an OB literary witness — the Tell Asmar Hoard
  statue (with an Anzû bird on the base) is iconographic, attested in
  Black & Green s.v. Anzû, and may be mentioned in the iconography
  paragraph, but it is not a manuscript of the epic.

  The SB candidate-search canonical sequence is Adad → Gerra/Gibil →
  Šara (three named candidates who all refuse before Ea proposes
  Ninurta). All three must be named; the brief's entities_glossary
  includes Gerra accordingly.

  The Ningirsu/Ninurta relationship is a contested scholarly question.
  Per Black & Green 1992 (via Wikipedia s.v. Ningirsu), the two are
  treated as originally distinct cult-centre deities (Ningirsu =
  Lagash; Ninurta = Nippur), syncretized by the time of Gudea (late
  third millennium). Wikipedia s.v. Ninurta: "Assyriologists are
  divided on the question of whether they were originally two
  manifestations of the same god, or two separate deities." The
  chapter should hedge the relationship as syncretism / cult-political
  shift rather than as a mere local-name change.

  The Sumerian Lugal-e is comparative only — never a primary, never a
  fill source. Sharur is more prominent in Lugal-e than in the
  Akkadian Anzû; this comparative observation may be foregrounded in
  the COMPARATIVE-HOOK to the influences chapter. The Indo-European
  HERO SLAY SERPENT typology is one of the most defensible cross-
  cultural anchors; preview it here for the influences chapter and
  comparative analysis. Sharur, the sentient mace, is a distinctive
  feature; preserve its dialogue with the hero. Mark all
  reconstructions, especially where SB fills OB or vice versa, with
  `[RECONSTRUCTION:]` markers naming the donor recension and dialect.

  The SB closing hymn enumerates a litany of Ninurta's names and
  epithets, structurally parallel to the fifty-names finale of Enūma
  Eliš VI–VII (Lambert 2013); the exact count "fifty" for the SB
  Anzû closing litany should be hedged unless directly verifiable
  in Annus 2001's transliteration.
