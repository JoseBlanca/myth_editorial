target_length_words: 5000

special_instructions: |
  Co-equal recensions (4000–6000 words). Present the OB Anzû (Ningirsu hero, 3 tablets) and SB Anzû (Ninurta hero, 2 tablets) side by side in the body — the hero's identity change between recensions is one of the principal substantive variants and must NOT be glossed over. Vogelzang 1988 is the OB base; Annus 2001 is the SB base. Mark dialect explicitly throughout. The Sumerian Lugal-e is comparative only — never a primary, never a fill source. The Indo-European HERO SLAY SERPENT typology is one of the most defensible cross-cultural anchors; preview it here for the influences chapter and comparative analysis. Sharur, the sentient mace, is a distinctive feature; preserve its dialogue with the hero. Mark all reconstructions, especially where SB fills OB or vice versa, with `[RECONSTRUCTION:]` markers naming the donor recension and dialect.
