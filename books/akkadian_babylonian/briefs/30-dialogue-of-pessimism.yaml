entities_glossary:
  - name: "the master (bēlu, 𒂗)"
    role: hero
    first_mention_gloss_candidate: "the unnamed nobleman who proposes a series of actions and then their reversals; the speaker whose oscillation drives the dialogue"
  - name: "the servant (ardu, 𒀵)"
    role: hero
    first_mention_gloss_candidate: "the unnamed servant who agrees with each proposal and each reversal, supplying a justifying maxim each time; the figure whose unflappable agreement gives the dialogue its bite"
  - name: "ṭābu (𒁲, good)"
    role: ritual-term
    first_mention_gloss_candidate: "the Akkadian evaluative term 'good' or 'pleasing'; the closing question 'mīnu damiq?' — 'what is good?' — interrogates this concept"
  - name: "damqu (good, fitting)"
    role: ritual-term
    first_mention_gloss_candidate: "paired with *ṭābu* and contrasted with *lemnu* (bad); the dialogue's polarity terms"

cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Multiple manuscripts from Nineveh and Aššur (principal witness K.7674 + duplicates); well-preserved relative to other wisdom compositions of comparable length"
      source: "lambert-1960 pp. 139–141"
    - kind: scholarly-attention
      detail: "Distinctive composition — paired in scholarship with Ludlul and the Babylonian Theodicy as the third member of the Akkadian dialogic-wisdom triad; treated by Lambert 1960 in the wisdom-literature volume and by Bottéro as the satirical or sceptical extension of the theodicy genre"
      source: "lambert-1960 pp. 139–149; bottero-2001 pp. 268–273"
  function:
    - role: literary
      basis: "Highly formal dialogic structure with rigid parallelism; the master-servant alternation is unique in the Akkadian corpus and exhibits a distinctive sceptical or satirical voice"
      source: "lambert-1960 pp. 139–149"
    - role: didactic
      basis: "Stages the futility of action by showing each course and its reversal as equally defensible; the closing exchange — 'what then is good? to break my neck and yours, to fall in the river' — is the most pointed nihilistic statement in Akkadian literature"
      source: "foster-2005 pp. 923–926"
  cross_cultural_parallels:
    - other_culture: "biblical Israel"
      parallel: "Ecclesiastes (Qohelet) is the closest ancient Near Eastern parallel — same exhaustion of value-judgments by enumeration, same closing question of 'what is good for man?' (Qoh 6:12)"
      source: "bottero-2001 pp. 268–273"
    - other_culture: "Egyptian"
      parallel: "The Egyptian *Dispute between a Man and his Ba* shares the dialogic-pessimism form, with a man's soul interrogating his exhausted will to live"
      source: "lambert-1960"

comparative_hooks:
  - other_culture: "biblical Israel"
    parallel: "Ecclesiastes' 'vanity of vanities' refrain and its catalogue of pursuits found wanting (eat, drink, build, plant — all *hebel*) directly parallel the Master's enumeration of pursuits and their reversals; the Akkadian and Hebrew compositions are commonly read together"
    source: "bottero-2001"
  - other_culture: "Egyptian"
    parallel: "*Dispute between a Man and his Ba* (Berlin Papyrus 3024) exhibits the same dialogic structure of a divided self confronting the futility of action; mid-2nd-millennium Egyptian; commonly cited alongside the Pessimism dialogue"
    source: "lambert-1960"
  - other_culture: "Akkadian (intra-tradition)"
    parallel: "Stands as the satirical inversion of the Theodicy: where the Theodicy stages a serious dialogue on theodicy, the Pessimism dialogue stages an absurd dialogue on action; both end in unresolved closure"
    source: "lambert-1960"

