special_instructions: "Preserve the dialogic structure throughout. Each round consists of: (1) Master proposes an action; (2) Servant agrees and supplies a justifying maxim; (3) Master reverses; (4) Servant supplies an opposite maxim. The chapter must reproduce at least three or four full rounds in extended translation so the reader sees the rhythm. Foreground the closing exchange — Master's question 'what then is good?' and the Servant's macabre answer about the river — as the most distinctive moment in Akkadian literature. The Ecclesiastes parallel is the controlling cross-cultural hook; the Egyptian *Dispute between a Man and his Ba* is the secondary parallel. Note explicitly that this composition is NOT covered by Oshima 2014 (which is restricted to Ludlul and the Theodicy); Lambert 1960 remains the standard critical edition. Foster 2005 is the working English translation. The dialogue's tone is satirical or sceptical, not necessarily nihilistic — flag the scholarly debate about whether the Master is in earnest, whether the Servant is undermining him, or whether the whole is a joke at the expense of the genre."
