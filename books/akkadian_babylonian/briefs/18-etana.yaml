variants:
  classification: co-equal
  prevalent_version:
    source: foster-2005
    why_prevalent: "Three substantial recensions across OB, MA, and SB. The SB recension (Nineveh K.2606 + duplicates) is the most fully preserved but the OB recension (Sippar) is significantly older. The MA recension is preserved in fragments. None is complete; none alone is sufficient."
  alternates:
    - source: foster-2005
      difference: "OB recension (Sippar, ca. 1700 BCE): earliest; eagle-and-serpent fable framing more compact."
    - source: foster-2005
      difference: "MA recension (Aššur, mid-2nd millennium): intermediate; partly preserved."
    - source: foster-2005
      difference: "SB recension (Nineveh, 7th c. BCE): K.2606 + duplicates; most fully preserved; standard scholarly base. Saggs 1986 published an important join."

