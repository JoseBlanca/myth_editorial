cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Three substantial recensions across OB, MA, and SB periods; Nineveh, Sippar, Aššur manuscripts."
      source: "foster-2005, pp. 533–537"
    - kind: iconography
      detail: "The Etana-on-eagle motif appears on Old Akkadian and later Mesopotamian seals; the iconographic tradition is older than the literary recensions."
      source: "black-green-1992, s.v. Etana"
    - kind: scholarly-attention
      detail: "Substantial scholarship; the eagle-and-serpent fable in particular is widely studied as a cross-cultural motif."
      source: "foster-2007, pp. 43–46"
    - kind: royal-inscription
      detail: "Etana appears in the Sumerian King List as 'the shepherd, who ascended to heaven'; integrated into the antediluvian-postdiluvian royal sequence."
      source: "foster-2005, p. 533"
  function:
    - role: royal-legitimation
      basis: "Etana is the model of the king who needs divine intervention to secure dynastic continuity; the heaven-flight grounds royal-divine relations."
      source: "foster-2005, pp. 533–554"
    - role: literary
      basis: "Combines the eagle-and-serpent fable (a self-contained didactic tale) with the heaven-flight, an unusual structural feature."
      source: "noegel-2005"
    - role: didactic
      basis: "The eagle-and-serpent fable teaches the consequences of betrayal; the heaven-flight teaches the king's need for divine sanction."
      source: "foster-2005 (commentary)"
  cross_cultural_parallels:
    - other_culture: "Greek"
      parallel: "Bellerophon and the heaven-flight — the king/hero who attempts to ascend to the gods and falls; structurally similar to Etana's flight."
      source: "noegel-2005"
    - other_culture: "Aramaic / Aḥiqar"
      parallel: "The eagle-and-serpent fable type appears in Aḥiqar and Aesopic tradition; the betrayal-and-divine-judgment structure is widespread."
      source: "foster-2005 (commentary)"
    - other_culture: "Hebrew Bible"
      parallel: "Childlessness motif resolved by divine intervention (Sarah/Isaac, Hannah/Samuel); the king-without-heir narrative is a recurrent biblical pattern."
      source: "foster-2005 (commentary)"

comparative_hooks:
  - other_culture: "Greek"
    parallel: "Bellerophon and Pegasus; the heaven-flight by mortal-on-divine-mount typology."
    source: "noegel-2005"
  - other_culture: "Aramaic Aḥiqar"
    parallel: "Aḥiqar's animal fables; the eagle-serpent betrayal structure shared with Aramaic and later Aesopic traditions."
    source: "foster-2005"
  - other_culture: "Akkadian (internal)"
    parallel: "Etana intersects with the Sumerian King List's royal sequencing — Etana is the postdiluvian king of Kish; the legend is part of the broader royal-legitimation literature."
    source: "foster-2005"

