special_instructions: |
  Co-equal recensions (4000–6000 words). Present OB, MA, and SB versions side by side; flag dialect throughout. Foster 2005 covers all three; Dalley 2008 second translation. The ending is LOST in all three recensions — make this absolutely explicit; do NOT extrapolate a resolution. The eagle-and-serpent fable can be presented as a self-contained narrative within the chapter; preserve its didactic structure (oath, betrayal, appeal to Šamaš, eagle's punishment, eagle's repentance, eagle's reciprocity to Etana). The Etana-on-eagle iconographic tradition predates the surviving literary recensions; mention this depth. Saggs 1986 join is significant for the SB recension; cite as known. The Kish setting situates Etana in the postdiluvian royal sequence per the Sumerian King List — note this without retelling the SKL itself.
