variants:
  classification: co-equal
  prevalent_version:
    source: cohen-2013
    why_prevalent: "No recension is prevalent — Cohen 2013 publishes the Emar, Ugarit, and Hattusa recensions side by side in synopsis because each has substantively distinct features and the scholarly community treats them as co-equal witnesses"
  alternates:
    - source: cohen-2013
      difference: "Emar 6/4 No. 778 (Emar recension) — the longest and most coherent witness; Late Bronze Age Syrian periphery; preserves the fullest version of the son's pessimistic counter-speech"
    - source: cohen-2013
      difference: "RS 22.439 (Ugarit recension) — the West Semitic periphery; substantively different in the maxim sequencing"
    - source: cohen-2013
      difference: "KUB 4.3 (Hattusa recension) — Hittite chancery copy; preserves the composition in the Hittite scribal milieu, with bilingual marginalia in some manuscripts; evidence for Akkadian-as-lingua-franca"

entities_glossary:
  - name: "Šūpê-amēli"
    role: hero
    first_mention_gloss_candidate: "the named sage-father whose instructions to his son make up the composition; literally 'the renowned man'; identified by name in the colophons of all three recensions"
  - name: "the son (unnamed)"
    role: hero
    first_mention_gloss_candidate: "the addressee of the instructions; in the closing section of the Emar recension, gives a long pessimistic counter-speech on the futility of all human counsel in the face of mortality"
  - name: "milku"
    role: ritual-term
    first_mention_gloss_candidate: "'counsel' — the central genre term that names the composition (*šimâ milka*, 'hear the counsel')"
  - name: "Emar (māt Aštata)"
    role: place
    first_mention_gloss_candidate: "Late Bronze Age Syrian city on the middle Euphrates; one of the three peripheral cuneiform centers where the composition was copied"
  - name: "Ugarit"
    role: place
    first_mention_gloss_candidate: "Late Bronze Age West Semitic kingdom on the Mediterranean coast; second of the three peripheral centers"
  - name: "Hattusa (Boğazköy)"
    role: place
    first_mention_gloss_candidate: "Hittite imperial capital in central Anatolia; third of the three peripheral centers; preserved the composition in the Hittite chancery library"

cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Three substantially overlapping recensions from three distinct peripheral cuneiform centers (Emar, Ugarit, Hattusa) — the broadest geographic spread of any Late Bronze Akkadian wisdom composition"
      source: "cohen-2013 pp. 81–100 (manuscript catalog)"
    - kind: scholarly-attention
      detail: "Universally cited in scholarship as the prime evidence for Akkadian as Late Bronze international literary lingua franca — the same composition transmitted across the Hittite, West Semitic, and Mesopotamian peripheral worlds"
      source: "cohen-2013 pp. 1–80 (introduction); foster-2007 pp. 29–32"
    - kind: scholarly-attention
      detail: "Cohen 2013 is the major recent monograph on the entire peripheral wisdom corpus; *Šimâ milka* is its principal text"
      source: "cohen-2013"
  function:
    - role: didactic
      basis: "Father-to-son instruction in the Akkadian wisdom-genre tradition — on travel, friends, women, debts, and the limits of human knowledge — followed by the son's pessimistic counter-speech"
      source: "cohen-2013 pp. 81–176"
    - role: literary
      basis: "Distinctive bipartite structure (instructions + son's counter-speech) sets the composition apart from the simpler maxim-collections like *Counsels of Wisdom*; the bipartite form is preserved across all three recensions"
      source: "cohen-2013 pp. 81–176"
  cross_cultural_parallels:
    - other_culture: "Egyptian"
      parallel: "The Egyptian instruction tradition (Amenemope, Ptahhotep, Any) is the controlling parallel form; *Šimâ milka* stands within the same Eastern Mediterranean instruction tradition that includes Egyptian and Hebrew compositions"
      source: "cohen-2013"
    - other_culture: "biblical Israel"
      parallel: "Proverbs (especially Proverbs 1–9 and 22:17–24:22) shares the father-to-son instruction frame; the son's pessimistic counter-speech finds a thematic parallel in Ecclesiastes' interrogation of accumulated wisdom"
      source: "cohen-2013"
    - other_culture: "Aramaic"
      parallel: "The Aramaic *Words of Aḥiqar* is the direct downstream West Semitic continuation of this multinational instruction tradition"
      source: "foster-2007"

comparative_hooks:
  - other_culture: "Late Bronze international culture"
    parallel: "The very fact of the Emar–Ugarit–Hattusa transmission is itself the comparative hook: *Šimâ milka* documents the Late Bronze cuneiform koiné, in which Akkadian functioned as the international literary language across Anatolia, the Levant, and Mesopotamia (visible also in the Amarna letters and the *King of Battle* legend)"
    source: "cohen-2013"
  - other_culture: "Egyptian"
    parallel: "Specific maxim parallels with *Amenemope* and *Ptahhotep* on the conduct of speech, choice of friends, and avoidance of bad women; the parallel is part of the wider three-way Egypt–Mesopotamia–Levant wisdom-instruction tradition"
    source: "cohen-2013"
  - other_culture: "biblical Israel"
    parallel: "Proverbs' father-to-son frame and Ecclesiastes' exhaustion-of-counsel both find counterparts in *Šimâ milka*'s bipartite structure (paternal instruction + filial pessimism)"
    source: "cohen-2013"

