special_instructions: "Co-equal recensions — present the Emar, Ugarit, and Hattusa versions side by side, each introduced with its source, following Cohen 2013's synoptic format. Do NOT collapse the three recensions into a single composite. The chapter must (1) name the three peripheral centers (Emar, Ugarit, Hattusa) and the principal manuscripts (Emar 6/4 No. 778, RS 22.439, KUB 4.3); (2) treat the bipartite structure (paternal instructions + son's pessimistic counter-speech) as the composition's distinctive feature; (3) foreground the Late Bronze Age peripheral attestation as the prime evidence for Akkadian's role as international literary lingua franca — this is the point that makes *Šimâ milka* significant beyond its content; (4) reproduce the title-formula 'šimâ milka' ('hear the counsel') as the incipit. Use Cohen 2013 throughout. The Emar recension is the longest and gives the fullest version of the son's counter-speech."
