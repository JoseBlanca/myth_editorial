cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Roughly 200 lines preserved across multiple manuscripts from Nineveh, Aššur, and Babylon — the longest and most extensively preserved Akkadian animal fable cycle"
      source: "kienast-2003 pp. 1–60 (manuscript catalog)"
    - kind: scholarly-attention
      detail: "Modern critical edition by Kienast 2003 — a 260-page monograph dedicated to a single fable cycle, indicating the composition's perceived importance to the disputation/fable corpus"
      source: "kienast-2003"
    - kind: scholarly-attention
      detail: "The Akkadian title *iškar šēlebi* uses the term *iškaru* — 'canonical series' — the technical term reserved for fixed-sequence multi-tablet compositions in scribal libraries (cf. *Enūma Anu Enlil*, *Maqlû*); confirms the composition's status as a recognized canonical work"
      source: "kienast-2003 pp. 1–30; foster-2007 pp. 32–35"
  function:
    - role: literary
      basis: "Long animal-fable cycle with a court-trial frame; the most ambitious example of the Akkadian fable genre"
      source: "kienast-2003 pp. 1–60"
    - role: didactic
      basis: "Encodes social lessons about cunning, accusation, and rhetorical defense in the form of animal characters; the fox's defense-rhetoric is the model"
      source: "lambert-1960 pp. 186–209"
  cross_cultural_parallels:
    - other_culture: "Greek (Aesop)"
      parallel: "The Aesopic fable corpus is the most direct generic descendant — the fox-and-lion, fox-and-grapes, fox-and-crow fables of Aesop are the West Greek heirs of this Mesopotamian tradition"
      source: "lambert-1960"
    - other_culture: "Aramaic"
      parallel: "The Aramaic *Aḥiqar* preserves animal-fable material that descends from this Akkadian tradition; the Series of the Fox is the principal Akkadian ancestor"
      source: "foster-2007"
    - other_culture: "Sumerian"
      parallel: "Sumerian fox-fables and proverbs (ETCSL 6.x — comparative only) are the genre's prehistory; the Akkadian series is the Akkadian-language continuation"
      source: "lambert-1960"

comparative_hooks:
  - other_culture: "Greek (Aesop)"
    parallel: "The Aesopic corpus of fox-fables (fox and lion, fox and grapes, fox and crow) is the principal Greek-language descendant; both traditions share the cunning-fox protagonist and the moralising-fable form"
    source: "lambert-1960"
  - other_culture: "Aramaic"
    parallel: "*Aḥiqar*'s animal-fable corpus and the later Aramaic fable tradition descend from the Akkadian fable cycle; the Series of the Fox is one of the principal Akkadian ancestors"
    source: "foster-2007"
  - other_culture: "Sumerian"
    parallel: "Sumerian proverbs and fox-fables (ETCSL 6.1.x — comparative only) are the genre prehistory; the Akkadian series continues the genre into the first millennium"
    source: "lambert-1960"

