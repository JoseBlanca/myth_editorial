special_instructions: "The longest Akkadian animal fable cycle and the largest disputations chapter. Use Kienast 2003 for textual readings (German); Foster 2005 for the working English translation; Lambert 1960 for editorial history. The chapter must (1) reproduce several full episodes in extended translation — the fox's defense rhetoric is the heart of the composition; (2) explain the *iškaru* (canonical series) terminology and what it implies about the composition's scribal status; (3) develop the Aesopic and Aramaic *Aḥiqar* downstream parallels substantively — the Akkadian fox is the ancestor of an enormous cross-cultural tradition; (4) acknowledge the lacunary state of the cycle honestly — the precise sequence of episodes is uncertain. Use [RECONSTRUCTION:] markers wherever Kienast's composite fills a gap from a different witness. Note that the SB recension treats the fox as a defendant in a divine court — the trial-frame is the structural innovation."
