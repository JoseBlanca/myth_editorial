special_instructions: |
  Co-equal recensions: present the Amarna (MB, Fragment A) and the Nineveh (NA, Fragments B/C/D) versions side by side in the body, each introduced by recension and dialect. Do NOT use the Sumerian Tell Haddad / Me-Turan Adapa as a primary source or to fill gaps — it is comparative material only (audit finding A1). The "bread and water of life" misunderstanding scene is the climax; preserve the sequence: (1) Ea's warning, (2) Anu's offer, (3) Adapa's refusal, (4) Anu's laughter or sorrow, (5) the lost immortality. Use Izre'el 2001 as the philological base. The apkallu lineage (Adapa as first of seven sages) is a later overlay on the original story; flag this stratification.
