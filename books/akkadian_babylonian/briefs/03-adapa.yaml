cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Three substantial fragmentary recensions across MB and NA; further attestations in Late Babylonian apkallu lists."
      source: "izreel-2001, pp. 9–11"
    - kind: ritual-context
      detail: "Adapa is integrated into the apkallu tradition by the Late Babylonian period and figures in apotropaic rituals invoking the seven sages."
      source: "kvanvig-2011, pp. 107–115"
    - kind: scholarly-attention
      detail: "A foundational text for the study of Mesopotamian wisdom and the lost-immortality archetype; attracted scholarship since the 19th century."
      source: "izreel-2001, pp. xv–xviii"
  function:
    - role: didactic
      basis: "Frames the loss of human immortality as a misunderstanding/miscommunication between Ea and his protégé — a meditation on the limits of wisdom."
      source: "izreel-2001, p. 121 (commentary)"
    - role: ritual-aetiological
      basis: "Adapa is the priest of Ea at Eridu; the story grounds the ritual specialist's craft in the antediluvian sage's privileged knowledge."
      source: "kvanvig-2011, pp. 107–115"
    - role: cosmological
      basis: "Anu's heavenly court, the gatekeepers Tammuz and Gizzida, and the bread/water of life situate human-divine boundaries."
      source: "izreel-2001, Amarna and Nineveh fragments"
  cross_cultural_parallels:
    - other_culture: "Hebrew Bible"
      parallel: "Genesis 2–3 — a divine-prohibition-misobeyed scene that bars humanity from immortality; Adapa refuses the food of life under prophet-like instruction, parallel to Adam's eating of forbidden fruit."
      source: "kvanvig-2011"
    - other_culture: "Sumerian (comparative)"
      parallel: "The Sumerian Tell Haddad / Me-Turan Adapa text (Cavigneaux & Al-Rawi 1993) is a Sumerian composition treating the same figure; comparative material only, not a primary source for this Akkadian chapter."
      source: "etcsl"
    - other_culture: "Greek"
      parallel: "Prometheus's gift withheld and Pandora's box — a structural parallel for misdirected human acquisition of divine goods, though the mechanism differs."
      source: "izreel-2001 (commentary)"

comparative_hooks:
  - other_culture: "Hebrew Bible (Genesis 2–3)"
    parallel: "Specific motif: a divine warning against eating leads to forfeited immortality. In Adapa, the warning is misheard/well-intended deception by Ea; in Genesis, the warning is correctly given but disobeyed. Kvanvig 2011 reads them as inverted forms of the same archetype."
    source: "kvanvig-2011"
  - other_culture: "Sumerian (comparative)"
    parallel: "The Tell Haddad / Me-Turan Sumerian Adapa is comparative background only — out of scope as primary text per the language-of-composition boundary in scope.md (audit finding A1)."
    source: "etcsl"
  - other_culture: "Indo-European"
    parallel: "The 'apkallu' as antediluvian sage echoes Indo-European traditions of pre-flood culture-bringers (e.g., Vedic ṛṣis); Kvanvig discusses the comparative apkallu/sage typology."
    source: "kvanvig-2011"

