lacunae:
  - source: izreel-2001
    location: "Fragment A (Amarna MB, EA 356), reverse"
    what_is_missing: "End of the Amarna recension — the conclusion of the heaven audience and Adapa's return are partly broken."
    in_tradition_fills_available: "partial — Fragment B (NA) supplies a different framing of the audience; the recensions are not strictly substitutable."
  - source: izreel-2001
    location: "Fragments B, C, D (Nineveh NA, K.8743 + duplicates)"
    what_is_missing: "Beginning of the Nineveh recension — Adapa's identity and the south-wind incident are partly lost; the seven-fold breaking of the south-wind's wing reconstructed from cross-fragment readings."
    in_tradition_fills_available: "yes — internal Nineveh joins; Izre'el 2001 reconstructs the SB composite."

variants:
  classification: co-equal
  prevalent_version:
    source: izreel-2001
    why_prevalent: "The Amarna fragment (Fragment A, MB, 14th c.) is the longest single witness and provides the bulk of the heaven-audience scene; the NA Nineveh fragments are shorter but preserve a substantively different framing of the same scene. Neither alone is complete; both are needed."
  alternates:
    - source: izreel-2001
      difference: "Amarna recension (MB) emphasizes Ea's instructions and the south-wind episode in greater detail; Nineveh recension (NA) extends the Anu-audience scene and the offered-bread-and-water sequence."
    - source: izreel-2001
      difference: "Fragment names differ in spelling/dialect across recensions (Adapa, Adamu, Uan). The sage's identity as the first apkallu is a Late Babylonian addition, not present in the Amarna copy."

