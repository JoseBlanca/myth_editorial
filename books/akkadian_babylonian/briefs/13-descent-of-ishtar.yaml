special_instructions: |
  Medium-length composition (2500–4000 words). The Akkadian Descent of Ishtar is an INDEPENDENT composition, NOT a translation of the Sumerian Inanna's Descent — make this absolutely explicit per scope.md. The Sumerian original is comparative material only, never used to fill gaps in the Akkadian text. Foreground the seven-gate stripping structure (one item at each gate); preserve the rhetorical pattern of the gatekeeper's challenges. The closing ritual instruction for the Tammuz festival is the etiological hook — keep it. Audit finding A7 noted the eBL electronic edition (https://www.ebl.lmu.de/corpus/L/1/8) as a recent text resource; cross-reference but do not substitute for Foster/Dalley as cited translations. NB: no critical edition (in the Lambert/George sense) exists; rely on the translation collections and eBL.
