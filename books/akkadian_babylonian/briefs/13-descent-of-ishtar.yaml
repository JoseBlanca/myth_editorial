cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Multiple Nineveh manuscripts; widely read in the first millennium and recently re-edited in the electronic Babylonian Library (eBL)."
      source: "foster-2005, p. 498; eBL https://www.ebl.lmu.de/corpus/L/1/8"
    - kind: ritual-context
      detail: "Closes with what appears to be a ritual instruction for the seasonal Tammuz festival; embedded in cult."
      source: "foster-2005, p. 504"
    - kind: scholarly-attention
      detail: "One of the most-studied Akkadian myths; cited in virtually every introduction to Mesopotamian religion."
      source: "bottero-2001, passim"
  function:
    - role: eschatological
      basis: "Articulates the geography and laws of the underworld; the seven gates and the substitution ritual structure death and seasonal return."
      source: "foster-2005, pp. 498–505"
    - role: ritual-aetiological
      basis: "The closing lines link the narrative to the seasonal Tammuz wailing rites; the myth grounds a recurring ritual."
      source: "foster-2005, p. 504"
    - role: theogonic
      basis: "Articulates the relationship between Ishtar and Ereškigal as paired sisters with celestial/chthonic offices."
      source: "dalley-2008, pp. 154–162"
  cross_cultural_parallels:
    - other_culture: "Sumerian (comparative)"
      parallel: "The Sumerian Inanna's Descent (ETCSL 1.4.1) is a substantially different and much longer composition; the Akkadian Descent of Ishtar is an INDEPENDENT composition on a shared theme, NOT a translation."
      source: "etcsl"
    - other_culture: "Greek"
      parallel: "Persephone's descent and seasonal return from Hades shares the structural pattern of seasonal-vegetation death and return."
      source: "bottero-2001"
    - other_culture: "Egyptian"
      parallel: "Osiris's death and cyclical resurrection shares the dying-god typology."
      source: "bottero-2001"

comparative_hooks:
  - other_culture: "Sumerian (Inanna's Descent)"
    parallel: "The Akkadian Descent of Ishtar is shorter, more focused, and structurally distinct from the Sumerian original; the seven-gate stripping is shared but the Sumerian text has the demonic galla retrieval, the Akkadian has Ea's creation Aṣušu-namir. Treat as comparative material per scope.md, not a primary source."
    source: "etcsl 1.4.1"
  - other_culture: "Greek"
    parallel: "Persephone-Hades; the dying-god / seasonal-return type."
    source: "bottero-2001"
  - other_culture: "Akkadian (internal)"
    parallel: "Nergal and Ereškigal (chapter 14) shares the underworld setting and the figure of Ereškigal; the two compositions form a paired underworld dossier."
    source: "foster-2005"
  - other_culture: "Hebrew Bible"
    parallel: "Sheol imagery in Job, Psalms, Isaiah 14 echoes the seven-gates and dust-as-food motifs of the Mesopotamian underworld."
    source: "bottero-2001"

