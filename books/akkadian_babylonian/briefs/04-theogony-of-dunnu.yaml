cultural_relevance:
  centrality: marginal
  centrality_evidence:
    - kind: attestation-volume
      detail: "Single manuscript (BM 74329); no liturgical, ritual, or recension footprint beyond this tablet."
      source: "lambert-2013, p. 387"
    - kind: scholarly-attention
      detail: "Marginal individually but significant comparatively — the text is the principal Akkadian witness to a 'violent succession' cosmogony pattern."
      source: "lambert-2013, pp. 387–395; bottero-2001, pp. 92–97"
  function:
    - role: theogonic
      basis: "Genealogical creation by violent dynastic succession — each generation kills, weds, or replaces its predecessors."
      source: "lambert-2013, pp. 388–389"
    - role: cosmological
      basis: "Equates cosmic deities with agricultural and pastoral elements (plough, earth, cattle) — a creation rooted in agrarian work."
      source: "lambert-2013, p. 392 (commentary)"
  cross_cultural_parallels:
    - other_culture: "Hurro-Hittite"
      parallel: "The Kumarbi Cycle's violent generational succession (Anu castrated by Kumarbi, Kumarbi displaced by Teshub) is the closest known parallel; both share the dynastic-replacement-by-violence pattern."
      source: "hoffner-1998"
    - other_culture: "Greek"
      parallel: "Hesiod's Theogony — Ouranos castrated by Kronos, Kronos overthrown by Zeus — preserves the same generational-violence pattern, plausibly through Levantine mediation."
      source: "hoffner-1998"
    - other_culture: "Phoenician (Sanchuniathon via Philo of Byblos)"
      parallel: "The Phoenician cosmogony preserved in Eusebius and Philo's Greek paraphrase shares the violent-succession framework; debated direct contact with Mesopotamian traditions."
      source: "lambert-2013, p. 393 (commentary)"

comparative_hooks:
  - other_culture: "Hurro-Hittite (Kumarbi)"
    parallel: "Best-attested non-Mesopotamian parallel to the Theogony of Dunnu's succession-by-violence pattern. Hoffner 1998 traces the Anu-Kumarbi-Teshub succession as a likely intermediate between Mesopotamian Theogony of Dunnu and Hesiod."
    source: "hoffner-1998"
  - other_culture: "Greek (Hesiod)"
    parallel: "Hesiod's Theogony Castrating-Father-Slaying-Son sequence is structurally the same as Ḫarab → Sea → Sumuqan in Dunnu; central case for the influences chapter."
    source: "hoffner-1998"
  - other_culture: "Phoenician"
    parallel: "Sanchuniathon's cosmogony as preserved by Philo of Byblos; fragmentary but shows the succession pattern in a Levantine medium."
    source: "lambert-2013"

