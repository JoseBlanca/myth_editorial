special_instructions: |
  Short composition (2500–4000 words). Single manuscript = single-prevalent classification by default. The Theogony of Dunnu is the most important Akkadian text for the Hurro-Hittite/Greek comparative discussion in the influences chapter — keep the comparative framing visible but reserve the deep analysis for the influences chapter itself. The list of generations is genealogical; preserve the "who killed/married whom" sequence faithfully. Note that Dunnu is a real but obscure Mesopotamian place name, not a fictional setting — Lambert 2013 discusses possible identifications.
