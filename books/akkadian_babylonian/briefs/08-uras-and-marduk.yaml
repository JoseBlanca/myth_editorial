# Brief revised 2026-05-08 after stage 10b factcheck on the original claims
# returned MAJOR-REVISE. The original brief carried four upstream errors:
# (1) wrong Lambert 2013 page range — locked as pp. 308–325, but the chapter
#     "Uraš and Marduk" is in fact at pp. 311–315 (+ p. 496 notes); pp. 308–310
#     belong to the previous chapter (The Toil of Babylon) and pp. 316–325 to
#     the next two (The Murder of Anšar?, Damkina's Bond);
# (2) wrong page range for Damkina's Bond cited downstream — pp. 326–360 in the
#     old brief vs. the actual pp. 321–325 (+ p. 497 notes);
# (3) the manuscript framing was wrong on count — Uraš and Marduk is preserved
#     on a SINGLE poorly-preserved tablet UET 6, 398 from Ur (per Streck 2014,
#     BSOAS 77, 371; cross-verified at HandWiki s.v. Urash god), not on multiple
#     overlapping late-Babylonian manuscripts; the date may be Old Babylonian or
#     Kassite (with Dilbat origin), not necessarily late-Babylonian;
# (4) the Uraš identity was wrong — the Uraš in this composition is the MALE
#     agricultural tutelary of Dilbat (consort of Ninegal, equated with Ninurta
#     "of the hoe", "of the calendar", "of the tenant farmer", and even with
#     "Marduk of planting"), NOT the female earth-goddess (spouse of Anu).
#     The female cosmogonic Uraš is a different deity; the Wikipedia article
#     on the female Uraš does not even mention this composition. The myth's
#     content per HandWiki is "Marduk created plant life for Urash" — an
#     agricultural-creation register, not a chthonic-celestial pairing.
# See chapters/08-uras-and-marduk.claims.factcheck.yaml for the full factcheck
# (verdict MAJOR-REVISE, 4 HIGH / 4 MEDIUM / 3 LOW findings); see
# completions/12-claims-factcheck-ch08.done.yaml for the disposition.
# The corrected brief follows.

