special_instructions: |
  Short, fragmentary late-Babylonian composition (800–2000 words). Single critical edition (Lambert 2013). The composition's narrative is sketchy due to manuscript damage; treat it as a node in the late-Babylonian cosmogonic dossier rather than as a freestanding myth. Pair it analytically with Damkina's Bond (the next chapter) — both texts foreground a feminine chthonic-celestial pairing with Marduk. Mark all reconstructions. Avoid over-interpreting the limited narrative; preserve the philological transparency of "we have these pieces, fitted together by Lambert."
