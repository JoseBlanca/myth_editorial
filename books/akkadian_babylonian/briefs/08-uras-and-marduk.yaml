special_instructions: |
  Short, fragmentary Akkadian composition preserved on a single poorly-preserved tablet, UET 6, 398, excavated at Ur. The composition itself may have been composed earlier (Old Babylonian or Kassite period) and may have originated at Dilbat, the cult-centre of the male agricultural deity Urash; the surviving tablet's date and the composition's date should be distinguished. Lambert 2013 pp. 311–315 is the sole modern critical edition; notes on the text are at p. 496. Foster 2005 *Before the Muses* and Dalley 2008 *Myths from Mesopotamia* do NOT contain this composition.

  CRITICAL CONTENT MODEL: The Uraš in this composition is the MALE tutelary god of Dilbat — an agricultural deity equated in late commentaries with Ninurta ("of the hoe", "of the calendar", "of the tenant farmer") and with "Marduk of planting" — NOT the female cosmogonic earth-goddess (spouse of Anu) who is a different figure (RlA s.v. Uraš A). HandWiki summarises the surviving content as: "Marduk created plant life for Urash." The composition is therefore an agricultural-cosmogonic narrative: Marduk (Babylon's patron) creates plant life for Urash (Dilbat's tutelary), an act that articulates Marduk's cosmogonic / sovereign relationship to the agricultural domain and possibly his syncretistic absorption of a local-cult double of himself.

  Do NOT frame this composition as a chthonic-celestial divine pairing or as a feminine consortship — those framings (which the original brief and original claims document advanced) are wrong because they presuppose the female Uraš identification. The corrected framing is: Marduk's cosmogonic-agricultural creation for the male Dilbat tutelary, with theological-syncretism as the operative register. The Damkina's Bond pairing as a "feminine consortship sub-cluster" is also dropped — Damkina's Bond is the next chapter in Lambert's TOC (pp. 321–325, NOT pp. 326–360 as the old brief carried), but it is a separate composition with a different feminine figure (Damkina, Marduk's mother) and the analytical pairing is no longer apt.

  The Greek Gaia–Ouranos comparative-hook is DROPPED (it depended on the female-Uraš reading; the male agricultural Urash is not a primordial-earth figure). The Hurro-Hittite Lelwani hook is also DROPPED. The corrected comparative hooks are internal-Akkadian: Marduk's syncretism with local cult-figures, and Marduk's cosmogonic creation of specific aspects of the lived world.

  All reconstructions must be flagged with [RECONSTRUCTION:] markers; the single witness has substantial breaks. The LACUNA marker should reference the single tablet UET 6, 398 (not "multiple manuscripts"). The RECONSTRUCTION marker's fill_source should be "internal context only; no parallel manuscripts available" (not "internal joins among multiple witnesses"). The VARIANT marker should be reframed as restoration-variation within a single damaged witness, not as exemplar-variation.

  Do NOT assert verbatim quotations from Lambert 2013 unless directly verified against a print copy. The chapter should preserve philological transparency: "we have a single damaged tablet, in poor preservation, that Lambert 2013 has edited and translated; the surviving content is best summarised as Marduk creating plant life for the Dilbat tutelary Urash, with substantial gaps in the narrative."

  Streck 2014 (BSOAS 77, 371–372) — the standard scholarly review of Lambert 2013 — identifies the manuscript base of *Uraš and Marduk* as UET 6, 398. Streck 2014 is not currently in sources.yaml; if added, it would also benefit chapters 5–9 on manuscript-base claims (per factcheck note N-2).
