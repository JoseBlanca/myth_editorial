special_instructions: "Short fragmentary text. The chapter must be honest about how little survives — only short sections are legible. Reproduce the legible portion in extended translation; do not pad. Foreground the unusual disputant pairing (a goddess versus the personified crop she patronises) — this is the distinctive feature. The Sumerian *Ewe and Grain* is the controlling comparative parallel and should be cited from ETCSL but not retold. Most of the genre work for the disputations cycle is done collectively across chapters 34–39; chapter 36's job is mainly to display this contestation and explain the unusual goddess-versus-staple pairing."
