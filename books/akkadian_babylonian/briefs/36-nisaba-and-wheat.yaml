cultural_relevance:
  centrality: marginal
  centrality_evidence:
    - kind: attestation-volume
      detail: "Single fragmentary tablet; among the most poorly preserved Akkadian disputation texts"
      source: "lambert-1960 pp. 168–175"
    - kind: scholarly-attention
      detail: "Treated only by Lambert 1960; cited primarily as a member of the disputation genre"
      source: "lambert-1960 pp. 168–175"
  function:
    - role: didactic
      basis: "Stages the polarity between divine patronage and the staple itself — agricultural primacy as a contestation between goddess and grain; encodes the religious framing of cereal agriculture"
      source: "lambert-1960 pp. 168–175"
    - role: literary
      basis: "Member of the Akkadian disputation genre; collectively significant alongside the Tamarisk-Date Palm dispute, the Ox-Horse, the Fox, the Willow, and the Riding-Donkey as the corpus that connects Sumerian disputation poems to the Aramaic *Aḥiqar* tradition"
      source: "lambert-1960"
  cross_cultural_parallels:
    - other_culture: "Sumerian"
      parallel: "The Sumerian disputation *Ewe and Grain* (ETCSL 5.3.2 — comparative only) covers the same ground (cereal-versus-livestock primacy) and is the most direct genre ancestor; the Akkadian Nisaba-and-Wheat is its first-millennium continuation"
      source: "lambert-1960"
    - other_culture: "Aramaic"
      parallel: "*Aḥiqar*'s animal-and-object disputations descend from the broader Mesopotamian disputation corpus, of which Nisaba-and-Wheat is one member"
      source: "lambert-1960"

comparative_hooks:
  - other_culture: "Sumerian"
    parallel: "*Ewe and Grain* (ETCSL 5.3.2) is the closest Sumerian analogue: a disputation between agricultural primaries; the Akkadian text continues the genre into the first millennium"
    source: "lambert-1960"
  - other_culture: "Sumerian"
    parallel: "Sumerian Nisaba is the same goddess; the Akkadian composition is in cultural-religious continuity with Sumerian Nisaba-cult, not a translation"
