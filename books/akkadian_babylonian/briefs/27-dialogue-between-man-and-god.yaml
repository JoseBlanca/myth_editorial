target_length_words: 3000

special_instructions: "Foreground the genealogical importance: this is the earliest Akkadian theodicy, the seed of Ludlul and the Babylonian Theodicy. The chapter must explain that pivotal status. The tablet AO 4462 is the only witness — flag every gap as a physical lacuna and do not silently fill from later compositions. Note the Sumerian *Man and his God* as comparative background only (out-of-scope as primary); do not retell the Sumerian poem. Cite the colophon: scribe Kalbanum, reign of Ammi-Ditana — this gives the only secure date for the composition."
