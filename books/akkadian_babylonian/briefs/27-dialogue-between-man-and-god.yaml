entities_glossary:
  - name: "Kalbanum"
    role: artifact
    first_mention_gloss_candidate: "the scribe named in the colophon of AO 4462; copied the tablet in the reign of Ammi-Ditana of Babylon (ca. 1683–1640 BCE)"
  - name: "ilum (𒀭)"
    role: deity
    first_mention_gloss_candidate: "the sufferer's personal god — in Mesopotamian religion, the small tutelary deity who attends an individual through life, distinct from the great cosmic gods"
  - name: "Ammi-Ditana"
    role: place
    first_mention_gloss_candidate: "First Dynasty king of Babylon under whose reign the only surviving copy was inscribed; provides the historical anchor for dating the composition"
  - name: "AO 4462"
    role: artifact
    first_mention_gloss_candidate: "the unique Old Babylonian tablet preserved in the Louvre that is our sole witness to the composition"

cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Single OB tablet (AO 4462) — but the tablet's importance in scholarship vastly outweighs its physical attestation, because it is the earliest known Akkadian theodicy and the principal precursor of the central wisdom-dialogues that followed"
      source: "foster-2005 p. 148; lambert-1960 pp. 10–12"
    - kind: scholarly-attention
      detail: "Lambert's editio princeps in AfO 19 (1959–60) and the recent critical re-edition by Hätinen (KASKAL 16, 2019) frame the text as the genealogical source of the entire Akkadian theodicy genre"
      source: "lambert-1960 pp. 10–12; oshima-2014 pp. 11–14"
  function:
    - role: didactic
      basis: "First-person complaint and divine response model the proper attitude of a sufferer toward his personal god — confess, lament, accept, be reconciled"
      source: "foster-2005 p. 148"
    - role: literary
      basis: "Establishes the Akkadian theodicy form (sufferer + divine response with reconciliation) that Ludlul and the Theodicy will inherit and complicate"
      source: "oshima-2014 pp. 11–14"
  cross_cultural_parallels:
    - other_culture: "biblical Israel"
      parallel: "The complaint-and-divine-response structure prefigures the form of the biblical Psalms of Lament (e.g., Pss 6, 13, 22) and stands at the head of the trajectory that culminates in the book of Job"
      source: "oshima-2014"
    - other_culture: "Sumerian"
      parallel: "Closely paralleled by the Sumerian *Man and his God* (ETCSL 5.2.4, comparative only here) — the Akkadian composition is structurally indebted to but not a translation of the Sumerian"
      source: "lambert-1960"

comparative_hooks:
  - other_culture: "Sumerian"
    parallel: "*Man and his God* (ETCSL 5.2.4) is the direct Sumerian-language analogue; the Akkadian poem is a sister composition, not a translation"
    source: "lambert-1960"
  - other_culture: "biblical Israel"
    parallel: "Psalms of Lament and the dialogic frame of Job 3–42 inherit the complaint–response–reconciliation structure visible here in its earliest Akkadian form"
    source: "oshima-2014"

triangulation_databases:
