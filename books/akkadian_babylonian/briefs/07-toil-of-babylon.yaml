    - role: cosmological
      basis: "Foregrounds Babylon as the locus of a divine-displeasure / labour-rebellion narrative. The composition gives an alternative theological register for Babylon: not the triumphal Marduk-builds-Esagil cosmogony of *Enūma Eliš* VI, but a darker scene of conscripted toil, divine resentment, and decreed extinguishing."
