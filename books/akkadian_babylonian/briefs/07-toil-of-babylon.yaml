    - role: theological-counterpoint
      basis: "Functions as a theological counter-register to the triumphalist Marduk-cosmogony of *Enūma Eliš* and the labour-resolution narrative of *Atra-ḫasīs*: where *Atra-ḫasīs* solves the divine-labour problem by creating humans, *The Toil of Babylon* shows the burden falling back on the populace under conditions of divine alienation."
