special_instructions: |
  Short, fragmentary, late-Babylonian composition (800–2000 words). Single manuscript = single-prevalent. The text is best treated alongside the other minor cosmogonic compositions as part of the late-Babylonian Marduk-cosmogonic dossier. Foreground Babylon's status as cosmic center — Esagil's construction is the focal point. Mark all reconstructions; the manuscript is heavily damaged in places. The Genesis-11 Tower of Babel comparison is interesting precisely because the Akkadian text celebrates what the Hebrew text condemns; reserve full comparative analysis for the influences chapter.
