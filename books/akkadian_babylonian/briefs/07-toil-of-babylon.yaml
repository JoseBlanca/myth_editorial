special_instructions: |
  Short, fragmentary, Neo-Babylonian composition. Witness lineage: single tablet, traces back to Boscawen TSBA 5, 303 ff. (1877) and King STC I, 219–20 (1902); Lambert 2013 pp. 301–310 is the standard modern edition.

  CRITICAL CONTENT MODEL: The surviving columns describe a labour-rebellion / divine-displeasure / urban-doom narrative, NOT a celebratory Marduk-builds-Esagil cosmogony. Verified opening lines (Col. I.1–2): "All the Anunnaki hated the father of all the gods, / And Marduk, in his temple, was despondent." The populace of Babylon is conscripted into onerous toil (Col. I.5–6); a figure (most naturally Marduk himself, on the surviving pronoun chain) declares "He determined to overthrow the dynasty" (Col. I.13); Col. II shifts to divine politics — Enlil exultant, Lugaldukuga bitter and descending to the Apsû, a death-sentence motif involving Damkina and a "my son" address (Col. II.16–17, heavily damaged), and a figure who "escaped swiftly" (Col. II.19); Col. V closes with "for eternity they decreed extinguishing as the destiny of the peoples" (Col. V.9) and the gods weeping for Babylon (Col. V.17–19). The earlier brief's framing of the text as a celebratory cosmogony with Marduk directing construction and the Anunnaki cooperatively building Esagil was wrong — that material is in *Enūma Eliš* Tablet VI, not in *The Toil of Babylon*.

  The closest Akkadian comparandum is *Atra-ḫasīs*'s Igigi-rebellion / labour-resentment opening — not *Enūma Eliš* VI's Esagil-construction sequence. Mark this distinction explicitly: *Enūma Eliš* VI is a COUNTER-FOIL to *The Toil of Babylon*, not a parallel.

  All reconstructions must be flagged with [RECONSTRUCTION:] markers; only three of five columns are partly legible. Do NOT assert a specific BM number unless directly verified against a print copy of Lambert 2013; the working description is "the British Museum tablet edited by Lambert 2013, witness lineage from Boscawen TSBA 5 (1877) and King STC I (1902)".

  The Genesis-11 Tower of Babel comparison should be set up as a COMPARATIVE-HOOK only and deferred to the influences chapter. The earlier "Akkadian celebrates / Hebrew condemns" framing was based on the wrong reading of the Akkadian text and must be retracted; the correct framing is that the Akkadian Toil and the Hebrew Tower-of-Babel both present Babylon as a site of divine displeasure and frustrated labour, with substantially different theological resolutions.
