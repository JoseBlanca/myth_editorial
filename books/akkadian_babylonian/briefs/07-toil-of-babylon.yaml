  cross_cultural_parallels:
    - other_culture: "Hebrew Bible"
      parallel: "Genesis 11's Tower of Babel narrative is also set in Babylon and also concerns labour and divine displeasure. The earlier framing — Akkadian celebrates / Hebrew condemns — turns out to be too simple: the surviving Akkadian columns themselves contain a register of divine resentment and decreed doom over Babylon. The closer comparison is between two Babylon-as-locus-of-divine-displeasure traditions, not between celebration and condemnation."
      source: "kvanvig-2011 (for the Genesis-11 textual relationships)"
    - other_culture: "Akkadian (internal)"
      parallel: "The Igigi-rebellion / forced-toil scene of Atra-ḫasīs is the closer Akkadian comparandum than the Esagil-construction triumph of Enūma Eliš VI. The labour-rebellion register, the divine resentment, and the populace's burden all parallel Atra-ḫasīs's opening; the difference is that Atra-ḫasīs resolves the problem (by creating humans) while The Toil of Babylon ends with decreed extinguishing."
      source: "lambert-millard-1969"

