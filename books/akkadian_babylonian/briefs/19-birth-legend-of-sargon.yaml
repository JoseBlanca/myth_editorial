cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Multiple manuscripts (K.3401 + duplicates) from Nineveh and elsewhere; the legend was actively transmitted in 1st-millennium libraries."
      source: "westenholz-1997, pp. 36–37"
    - kind: scholarly-attention
      detail: "One of the best-known Akkadian compositions due to the biblical Moses parallel; substantial cross-cultural scholarship."
      source: "westenholz-1997, pp. 36–49 (commentary)"
    - kind: royal-inscription
      detail: "Sargon's historical reign (ca. 2334–2279 BCE) is attested in Old Akkadian inscriptions; the legendary tradition grew on this historical foundation."
      source: "westenholz-1997, introduction"
  function:
    - role: royal-legitimation
      basis: "The legend asserts Sargon's divine election (Ištar's love) despite humble origins (basket-on-the-river); a paradigmatic 'self-made-king' myth."
      source: "westenholz-1997, pp. 36–49"
    - role: literary
      basis: "Pseudo-autobiography with a famous first-person opening; one of the Akkadian compositions in the naru genre."
      source: "westenholz-1997 (commentary)"
    - role: didactic
      basis: "The legend frames the king as exemplar of divinely-favored rise from obscurity."
      source: "foster-2007, pp. 95–98"
  cross_cultural_parallels:
    - other_culture: "Hebrew Bible"
      parallel: "Exodus 2 — Moses placed in a reed basket sealed with bitumen and pitch and set adrift on the Nile, rescued by Pharaoh's daughter, raised at the Egyptian court. The shared motif (basket / bitumen / river / rescue / royal rise) is the most-discussed Akkadian-biblical parallel after the Flood."
      source: "westenholz-1997, p. 37 (commentary); kvanvig-2011"
    - other_culture: "Greek"
      parallel: "Romulus and Remus — exposed twins set on the Tiber, raised by a humble figure (the she-wolf), founders of Rome. The 'exposed-infant-becomes-founder-king' typology is widespread."
      source: "westenholz-1997 (commentary)"
    - other_culture: "Persian"
      parallel: "Cyrus's birth legend in Herodotus — exposed infant raised by herdsman, rises to kingship; the typology continues into Iranian tradition."
      source: "westenholz-1997 (commentary)"

comparative_hooks:
  - other_culture: "Hebrew Bible (Exodus 2)"
    parallel: "Specific motif: basket of reeds sealed with bitumen, infant set on river, rescued, raised in foreign household, rises to leadership. The Sargon-Moses parallel is the most-discussed; the Akkadian text predates the biblical by at least half a millennium in its underlying tradition. Direction of dependence is debated — most likely shared Near Eastern motif rather than direct borrowing."
    source: "westenholz-1997"
  - other_culture: "Greek/Roman"
    parallel: "Exposed-infant-king typology: Romulus, Cyrus, Sargon, Moses — a widespread pattern of the divine-favor narrative."
    source: "westenholz-1997"
  - other_culture: "Egyptian"
    parallel: "Königsnovelle genre (Royal Novella) — Egyptian royal legends share the divinely-favored-rise framing; structurally akin to Akkadian naru-texts."
    source: "westenholz-1997"

