target_length_words: 3500

special_instructions: |
  Medium-length composition (2500–4000 words). Single-prevalent recension. The first-person opening ('Sargon, mighty king, king of Akkad, am I...') is iconic; preserve the autobiographical voice in retelling. The biblical Moses parallel is the most-defensible cross-cultural anchor — preview here for the influences chapter and comparative analysis. The shared motif is real (basket of reeds, bitumen, river, rescue) but the direction of dependence is debated; treat carefully without over-claiming. Include the historical context (Sargon's actual reign ca. 2334–2279 BCE) without conflating history with legend. The text is an example of the naru genre (pseudo-autobiographical-royal); cross-reference with the Cuthaean Legend (chapter 24) which shares the genre.
