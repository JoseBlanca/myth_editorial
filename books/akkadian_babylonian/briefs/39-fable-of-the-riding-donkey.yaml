special_instructions: "Short fragmentary text. The chapter must be honest: only short sections of the manuscript are legible, and the precise narrative is uncertain. Reproduce the legible portion in extended translation; do not pad with conjectural narrative. CRITICAL: this is *The Fable of the Riding-Donkey*, NOT *The Poor Man and the Donkey*. The composition was renamed from the non-standard 'Poor Man and the Donkey' label per inventory-audit finding A10. Lambert 1960's chapter 7 lists this as 'The Fable of the Riding-Donkey'; the prior title was a non-standard label, possibly conflated with *The Poor Man of Nippur* (chapter 41 — a completely different composition). Be especially careful not to conflate this with the Poor Man of Nippur. The Aesopic donkey-fable parallel is the controlling cross-cultural hook."
