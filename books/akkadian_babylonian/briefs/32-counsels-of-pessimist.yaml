special_instructions: "Short fragmentary text. The chapter must be honest about how little survives — K.7897 is a single damaged tablet and there are no parallel witnesses. Reproduce the legible portion in extended translation; do not pad. The title 'Counsels of a Pessimist' is modern (given by Lambert 1960); explain that the title reflects the rhetorical kinship to the *Dialogue of Pessimism* but the two are not textually related. Note explicitly the composition's place between *Counsels of Wisdom* (ch. 31) and the dialogic-pessimism group — same instruction form, pessimistic theological tone."
