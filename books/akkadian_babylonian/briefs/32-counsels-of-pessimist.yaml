cultural_relevance:
  centrality: marginal
  centrality_evidence:
    - kind: attestation-volume
      detail: "Single fragmentary tablet K.7897 from Nineveh; among the most poorly preserved Akkadian wisdom texts"
      source: "lambert-1960 pp. 107–109"
    - kind: scholarly-attention
      detail: "Brief treatment in Lambert 1960; cited by Foster 2005 and 2007 in the wisdom-instruction context but rarely analyzed in its own right; significant primarily as a member of the Akkadian instruction genre alongside *Counsels of Wisdom* and *Šimâ milka*"
      source: "foster-2007 pp. 27–29"
  function:
    - role: didactic
      basis: "Counsels of resignation in light of mortal transience — the title 'Counsels of a Pessimist' is modern, given by Lambert 1960 to mark the rhetorical kinship with the *Dialogue of Pessimism*"
      source: "lambert-1960 pp. 107–109"
    - role: literary
      basis: "Member of the practical-instruction genre; pairs structurally with *Counsels of Wisdom* but with the pessimistic theological tone of the dialogic-wisdom group"
      source: "foster-2007 pp. 27–29"
  cross_cultural_parallels:
    - other_culture: "biblical Israel"
      parallel: "The transience-resignation tone is the Akkadian counterpart to Ecclesiastes' 'enjoy your life under the sun, for tomorrow you die' (Qoh 9:7–10)"
      source: "lambert-1960"
    - other_culture: "Egyptian"
      parallel: "The Egyptian *Harpers' Songs* express the same carpe-diem-in-mortality pessimism alongside the standard instruction genre"
      source: "foster-2007"

comparative_hooks:
  - other_culture: "biblical Israel"
    parallel: "Ecclesiastes 9:7–10 ('go, eat your bread with joy') exhibits the same pessimistic-instruction blend; the Counsels of a Pessimist is one of the closer Akkadian parallels to Qoheleth's tone"
    source: "lambert-1960"
  - other_culture: "Egyptian"
    parallel: "The Egyptian *Harpers' Songs* (e.g., the Antef harper's song) share the carpe-diem-in-mortality theme; the parallel suggests a wider ancient Near Eastern pessimistic-instruction tradition"
    source: "foster-2007"
  - other_culture: "Akkadian (intra-tradition)"
    parallel: "Stands between the *Counsels of Wisdom* (practical-instruction proper) and the *Dialogue of Pessimism* (sceptical dialogue) — title and tone reflect that hybrid position"
    source: "lambert-1960"

