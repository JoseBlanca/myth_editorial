cultural_relevance:
  centrality: marginal
  centrality_evidence:
    - kind: attestation-volume
      detail: "Single fragmentary recension on K.4231 + duplicates; among the more poorly preserved Akkadian disputation texts"
      source: "lambert-1960 pp. 175–185"
    - kind: scholarly-attention
      detail: "Treated by Lambert 1960 as part of the disputation corpus; cited rarely outside specialist literature on Akkadian *Streitliteratur*; significant primarily as a member of the disputation genre"
      source: "lambert-1960 pp. 175–185"
  function:
    - role: didactic
      basis: "Encodes the relative dignity of agricultural and martial labor — the same logic that informs the Mesopotamian social hierarchy; staged as a courtroom contest like the Tamarisk-Date Palm dispute"
      source: "lambert-1960 pp. 175–185"
    - role: literary
      basis: "Member of the Akkadian disputation genre; significant collectively as part of the corpus that connects Sumerian disputation poems to the Aramaic *Aḥiqar* tradition"
      source: "lambert-1960 pp. 175–185"
  cross_cultural_parallels:
    - other_culture: "Aramaic"
      parallel: "The Aramaic *Words of Aḥiqar* preserves animal-fable and disputation material that descends from the Akkadian disputation tradition; the Ox-and-Horse dispute is one of the Akkadian texts that stands behind this West Semitic continuation"
      source: "lambert-1960"
    - other_culture: "Greek (Aesop)"
      parallel: "Aesop's animal fables in which animals dispute or argue out their relative usefulness (the donkey and the lap-dog, the war-horse and the ass) share the form, even where direct dependence cannot be shown"
      source: "lambert-1960"
    - other_culture: "Sumerian"
      parallel: "Sumerian disputation poems (*Hoe and Plough* ETCSL 5.3.1, *Ewe and Grain* 5.3.2 — comparative only) are the genre ancestors; the Akkadian Ox-and-Horse continues the genre into the first millennium"
      source: "lambert-1960"

