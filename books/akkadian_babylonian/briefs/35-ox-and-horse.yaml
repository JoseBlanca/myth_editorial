special_instructions: "Short fragmentary text. The chapter must be honest about how little survives. Reproduce the legible portion in extended translation. Foreground the agronomy/martial polarity — the ox represents the settled agricultural economy, the horse the chariot-and-warfare elite. Note that the horse was introduced into Mesopotamia only in the early second millennium and remained a luxury animal — this is the realia behind the disputation's rhetoric. The chapter is brief; collectively the disputations chapter (34–39) makes the genre argument, so chapter 35's job is mainly to display this contestation. The Sumerian disputations are comparative-only background; the Aramaic *Aḥiqar* and Aesopic parallels are the controlling downstream connections."
