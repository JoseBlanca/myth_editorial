special_instructions: |
  The central composition of the book — give it the longest treatment (12000–15000 words). Structure: (1) introduce the Akītu ritual context up front so the recitation function frames the retelling; (2) tablet-by-tablet narrative for I–VI with prose-fluent retelling; (3) Tablet VII as a separate analytic section on the fifty names rather than a flat recitation. Use Lambert 2013 as the base text; cite Foster 2005 and Dalley 2008 only where translations diverge meaningfully. The Aššur recension's substitution of Aššur for Marduk is a footnote, not a body-text variant. Mark all reconstructions in Tablet V with `[RECONSTRUCTION:]` markers naming the donor manuscript. Distinguish Tiamat as primordial salt-sea from later "monster" misreadings — she is mother before she is enemy.
