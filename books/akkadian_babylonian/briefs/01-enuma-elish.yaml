lacunae:
  - source: lambert-2013
    location: "Tablet V, lines 1–22 (heavens and constellations) and lines 50–86 (calendar and time-keeping)"
    what_is_missing: "Stretches of Tablet V are heavily damaged; the cosmographic detail on celestial fixtures is partial."
    in_tradition_fills_available: "yes — parallel manuscripts from Aššur and Nineveh fill many gaps; Lambert 2013 reconstructs from K.3473 + duplicates against Aššur exemplars."
  - source: lambert-2013
    location: "Tablet VII, lines 1–10 of various manuscripts (the fifty-names recitation)"
    what_is_missing: "Order and partial readings of name epithets vary across exemplars; one or two names remain partially reconstructed."
    in_tradition_fills_available: "yes — Lambert 2013 collates Babylon, Aššur, and Nineveh witnesses into the standard composite."

variants:
  classification: single-prevalent
  prevalent_version:
    source: lambert-2013
    why_prevalent: "The first-millennium Standard Babylonian recension dominates the textual tradition; first-millennium witnesses from Babylon, Aššur, Nineveh, Kalḫu, and Sippar agree on the seven-tablet structure and main narrative. Lambert 2013 establishes the standard composite text."
  alternates:
    - source: lambert-2013
      difference: "Tablet VII fifty-names list varies in line order between manuscripts; some Aššur copies reverse the order of paired epithets."
    - source: lambert-2013
      difference: "The Aššur recension occasionally substitutes Aššur for Marduk as cosmic king (at one point inserting Aššur as Anšar) — a politically motivated Assyrian recension recorded in Lambert's apparatus."

