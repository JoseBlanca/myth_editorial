cultural_relevance:
  centrality: central
  centrality_evidence:
    - kind: ritual-context
      detail: "The full poem was recited on the fourth day of the Babylonian Akītu (New Year) festival in the Esagil temple, attested in late ritual texts from Babylon and Uruk."
      source: "lambert-2013, pp. 449–465; bottero-2001, pp. 234–243"
    - kind: attestation-volume
      detail: "First-millennium manuscripts survive from Babylon, Aššur, Nineveh, Kalḫu, Sippar, and Late Babylonian Uruk; the textual tradition is unusually rich for an Akkadian literary composition."
      source: "lambert-2013, pp. 4–25 (manuscript catalogue)"
    - kind: scholarly-attention
      detail: "Continuously studied since George Smith's 1875 publication of the creation tablets; cited in virtually every introduction to Mesopotamian religion."
      source: "lambert-2013, pp. xiii–xx"
    - kind: royal-inscription
      detail: "Marduk's fifty names and his cosmic kingship are echoed in Neo-Babylonian and Late Babylonian royal inscriptions, particularly Nebuchadnezzar II's building inscriptions."
      source: "oracc/RIBO; foster-2007, pp. 51–53"
  function:
    - role: cosmological
      basis: "Provides the canonical Babylonian account of how the cosmos was made — heavens, earth, calendar, constellations, and humanity."
      source: "lambert-2013, Tablets IV–VI"
    - role: theogonic
      basis: "Narrates the succession of divine generations from Apsû and Tiamat through Anšar, Anu, Ea, and Marduk."
      source: "lambert-2013, Tablet I"
    - role: royal-legitimation
      basis: "Establishes Marduk's kingship over the gods and, by analogy, the Babylonian king's earthly sovereignty; the Akītu recitation renewed both annually."
      source: "bottero-2001, pp. 234–243; lambert-2013, pp. 449–465"
    - role: ritual-aetiological
      basis: "Tablet VII's fifty-name recitation functions as a hymnic theology of Marduk and was performed liturgically."
      source: "lambert-2013, Tablet VII commentary"
  cross_cultural_parallels:
    - other_culture: "Hurro-Hittite"
      parallel: "The Kumarbi succession cycle (Anu → Kumarbi → Teshub) shares the structural pattern of younger storm-god displacing elder sky-figures, plausibly mediated through Hurrian contact."
      source: "hoffner-1998"
    - other_culture: "Greek"
      parallel: "Hesiod's Theogony (Ouranos → Kronos → Zeus) shows the same generational succession-and-storm-god-victor pattern; debated whether by direct or indirect mediation through the Eastern Mediterranean."
      source: "hoffner-1998 (on the Hurrian intermediary)"
    - other_culture: "Hebrew Bible"
      parallel: "Genesis 1's separation of waters above from waters below resonates with Marduk's splitting of Tiamat into upper and lower waters; debated as direct dependence vs. shared Levantine cosmography."
      source: "kvanvig-2011"
    - other_culture: "Ugaritic"
      parallel: "The Baal Cycle's combat between Baal and Yamm (Sea) parallels the storm-god-versus-sea motif at the heart of Marduk-Tiamat."
      source: "smith-1994"

comparative_hooks:
  - other_culture: "Hurro-Hittite"
    parallel: "Specific motif: castration/swallowing of the elder generation in Kumarbi → Marduk's defeat of Tiamat by enclosing her body. Hoffner 1998 details the Anu-Kumarbi-Teshub generational pattern."
    source: "hoffner-1998"
  - other_culture: "Greek"
    parallel: "The Hesiodic succession (Ouranos-Kronos-Zeus) with the storm-god as final victor mirrors Anšar-Anu-Marduk; the Indo-European storm-god slays the serpent/sea formula is operative."
    source: "hoffner-1998"
  - other_culture: "Hebrew Bible"
    parallel: "Genesis 1's wind hovering over the deep (təhôm — etymologically related to Tiamat) and the firmament splitting waters; Marduk-Tiamat's body-as-cosmos splitting is the most-discussed Babylonian-biblical parallel."
    source: "kvanvig-2011"
  - other_culture: "Ugaritic"
    parallel: "Baal-Yamm sea-combat as an intermediate Levantine attestation of the storm-god-defeats-sea pattern; the chaoskampf typology spans Akkadian, Ugaritic, and biblical material."
    source: "smith-1994"
  - other_culture: "Sumerian (comparative)"
    parallel: "No single Sumerian composition corresponds to Enūma Eliš; the Babylonian poem is an Akkadian creation, not a translation. Sumerian theogonic fragments (e.g., the Nippur god list) provide background but not narrative source."
    source: "black-2004"

