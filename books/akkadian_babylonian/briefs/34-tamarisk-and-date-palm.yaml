entities_glossary:
  - name: "the tamarisk (bīnu, 𒁉𒉡)"
    role: artifact
    first_mention_gloss_candidate: "the disputant tree representing scribal craft, royal regalia, and cultic use; *bīnu* in Akkadian; native to the Mesopotamian alluvium"
  - name: "the date palm (gišimmaru, 𒄑𒁉)"
    role: artifact
