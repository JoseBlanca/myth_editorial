special_instructions: "Co-equal OB and MA recensions — present them in parallel following Lambert 1960's synoptic edition. Do NOT collapse them into a single composite; foreground that the dispute was reworked across the centuries. The chapter must: (1) reproduce the speeches of both trees in extended translation — the trees' rhetoric IS the composition; (2) explain the agronomy honestly (tamarisk: framework wood, ritual wood, scribal stylus material, royal regalia; date palm: dates as staple food, shade in the orchard, rope from the fiber); (3) frame the dispute as a courtroom trial before the king; (4) develop the Sumerian-disputation ancestry and the Aramaic/biblical descendant tradition (Jotham's parable, *Aḥiqar*'s trial of trees) — this is the controlling cross-cultural argument. The Sumerian disputations are comparative-only background — do not retell them, only cite ETCSL."
