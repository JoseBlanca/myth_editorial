cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Two major recensions (OB and MA) span roughly 700 years, each with multiple witnesses; the longest sustained transmission of any Akkadian disputation text"
      source: "lambert-1960 pp. 151–164"
    - kind: scholarly-attention
      detail: "Universally cited as the principal example of the Akkadian *Streitliteratur* (disputation) genre; treated extensively in Lambert 1960 chapter 7 and in the comparative scholarship on Aramaic and biblical 'trial of trees' motifs"
      source: "lambert-1960 pp. 151–164"
    - kind: iconography
      detail: "The date palm is ubiquitous in Mesopotamian art and iconography; the so-called 'sacred tree' motif on Assyrian palace reliefs draws on the date palm's symbolic standing"
      source: "black-green-1992 'Sacred tree' entry"
  function:
    - role: didactic
      basis: "Encodes practical agronomy and craft knowledge — the actual uses of the tamarisk and date palm — in the form of a courtroom contest"
      source: "lambert-1960 pp. 151–164"
    - role: literary
      basis: "The Akkadian-language continuation of the Sumerian disputation tradition (cf. Sumerian *Tree and Reed*, *Hoe and Plough*, *Ewe and Grain*); preserves the genre into the Middle Assyrian period"
      source: "lambert-1960 pp. 151–155"
  cross_cultural_parallels:
    - other_culture: "Aramaic"
      parallel: "The Aramaic *Words of Aḥiqar* contains a 'trial of trees' fable (in some versions) that descends from the Akkadian disputation tradition; the Tamarisk-Date Palm dispute is the principal Akkadian ancestor of this West Semitic motif"
      source: "lambert-1960"
    - other_culture: "biblical Israel"
      parallel: "Jotham's parable of the trees (Judges 9:8–15) — in which the trees seek a king among themselves, with the bramble's reply — is the closest biblical parallel; commonly cited alongside the Akkadian disputation"
      source: "lambert-1960"
    - other_culture: "Sumerian"
      parallel: "The Sumerian disputation poems (*Tree and Reed* ETCSL 5.3.4, *Hoe and Plough* 5.3.1, *Ewe and Grain* 5.3.2 — comparative only) are the genre's prehistory; the Akkadian Tamarisk-Date Palm is the Akkadian-language continuation"
      source: "lambert-1960"

comparative_hooks:
  - other_culture: "Sumerian"
    parallel: "Sumerian *Tree and Reed* (ETCSL 5.3.4) is the most direct genre ancestor; the Akkadian composition continues the disputation form into the OB and MA periods, then the form continues westward into the Aramaic tradition"
    source: "lambert-1960"
  - other_culture: "Aramaic"
    parallel: "*Aḥiqar* preserves a 'trial of trees' segment in some recensions; the Akkadian Tamarisk-Date Palm dispute is a principal Akkadian ancestor of this West Semitic motif"
    source: "lambert-1960"
  - other_culture: "biblical Israel"
    parallel: "Jotham's parable in Judges 9:8–15 — the parable of the olive, fig, vine, and bramble seeking a king — shows the 'trial of trees' motif fully naturalised in Hebrew narrative; the Akkadian disputation is one of the standard comparanda"
    source: "lambert-1960"

