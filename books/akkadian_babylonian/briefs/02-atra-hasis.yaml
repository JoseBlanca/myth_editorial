special_instructions: |
  Long treatment (10000–15000 words). The OB Sippar recension is the base text; flag dialect and recension explicitly when switching to MB or SB material. Three-tablet structure: (I) Igigi rebellion + creation of humans; (II) plagues; (III) flood. Mark all reconstructions with `[RECONSTRUCTION:]` markers naming the donor manuscript and dialect. The relationship to Gilgameš XI is critical: present Atra-ḫasīs as the prior, independent composition; Tablet XI is a downstream borrowing inside the Gilgameš epic, not the other way around. The Sumerian Eridu Genesis is comparative material only, never used to fill gaps. The "noise" complaint motif (rigmu, ḫubūru) and Enki's reed-hut speech are signature scenes — preserve their rhetorical structure.
