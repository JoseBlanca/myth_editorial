cultural_relevance:
  centrality: central
  centrality_evidence:
    - kind: attestation-volume
      detail: "Multiple OB, MB, and SB manuscripts; flood scene independently incorporated into Gilgameš Tablet XI, expanding the textual footprint."
      source: "lambert-millard-1969, pp. 31–40 (manuscript catalogue)"
    - kind: scholarly-attention
      detail: "Foundational composition for the study of Mesopotamian cosmogony, theodicy, and biblical-comparative work since the 19th century."
      source: "kvanvig-2011, passim"
    - kind: ritual-context
      detail: "While not part of a known recurring liturgy, the composition's anthropogony and flood narrative shaped the broader literary imagination of human origins and divine-human relations."
      source: "bottero-2001, pp. 219–229"
  function:
    - role: cosmological
      basis: "Narrates the creation of humanity as labor-substitute for the rebelling Igigi; the structural account of why humans exist."
      source: "lambert-millard-1969, OB Tablet I"
    - role: theogonic
      basis: "Articulates the relationship between the Anunnaki ruling gods, the Igigi working gods, and the new human laborers."
      source: "lambert-millard-1969, OB Tablet I"
    - role: didactic
      basis: "Frames the population-control sequence (plague, drought, famine, flood) as a divine response to overcrowding — a theological account of mortality, infertility, and infant mortality."
      source: "lambert-millard-1969, OB Tablet III, post-flood council"
    - role: literary
      basis: "Established the flood-survivor archetype later borrowed into Gilgameš XI."
      source: "george-2003, pp. 506–512"
  cross_cultural_parallels:
    - other_culture: "Hebrew Bible"
      parallel: "Genesis 6–9 flood narrative shares the divine-displeasure-with-humanity structure, the warning to one righteous figure, the ark/boat, and the post-flood sacrifice; the scholarly question is mediated dependence versus shared Levantine tradition."
      source: "kvanvig-2011"
    - other_culture: "Sumerian (comparative)"
      parallel: "The Sumerian Eridu Genesis (ETCSL 1.7.4) preserves a different flood narrative with Ziusudra as survivor; Atra-ḫasīs is not a translation but an independent Akkadian composition on a shared theme."
      source: "etcsl"
    - other_culture: "Greek"
      parallel: "Deucalion's flood preserves the survivor-couple motif; debated whether through Eastern Mediterranean transmission."
      source: "kvanvig-2011"

comparative_hooks:
  - other_culture: "Hebrew Bible (Genesis 6–9)"
    parallel: "Specific motifs: divine displeasure, single-family survival, multi-deck boat, sacrifice after disembarking accepted as 'pleasing aroma' (Akk. erēšu ṭābu / Heb. rêaḥ nîḥôaḥ). Kvanvig 2011 traces the textual relationships."
    source: "kvanvig-2011"
  - other_culture: "Sumerian"
    parallel: "Eridu Genesis's Ziusudra and Atra-ḫasīs both fit a 'wise survivor' archetype; the Sumerian text is comparative background, not source — Atra-ḫasīs is not a translation."
    source: "etcsl 1.7.4"
  - other_culture: "Akkadian (internal)"
    parallel: "Gilgameš SB Tablet XI explicitly borrows the flood scene from Atra-ḫasīs (Uta-napišti's first-person retelling); George 2003 demonstrates the textual dependence."
    source: "george-2003"

