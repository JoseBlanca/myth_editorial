lacunae:
  - source: lambert-millard-1969
    location: "OB Tablet I, lines 1–37 (incipit and Igigi rebellion preamble)"
    what_is_missing: "First column of MS A is partly broken; the opening cosmic-labor scene needs reconstruction at line level."
    in_tradition_fills_available: "yes — Sippar duplicates and a fragment of Tablet I from Nippur fill most of the gap; Foster 2005 incorporates more recent joins."
  - source: lambert-millard-1969
    location: "OB Tablet II, columns vi–viii (drought and famine plagues)"
    what_is_missing: "Several columns of MS A are physically lost; the sequence of plagues is partly reconstructed from secondary witnesses."
    in_tradition_fills_available: "yes — fragments from Sippar, Nippur, and Aššur supply much of the missing content."
  - source: lambert-millard-1969
    location: "OB Tablet III, columns iv–vi (the flood and post-flood sacrifice)"
    what_is_missing: "Damaged sections in MS A; the flood narrative's specific details and the gods' sacrifice-acceptance scene need reconstruction."
    in_tradition_fills_available: "yes — partly from later SB recensions; cross-checked against Gilgameš XI which incorporates an independent retelling."

variants:
  classification: composite-editorial
  prevalent_version:
    source: lambert-millard-1969
    why_prevalent: "The OB Sippar recension (MS A, scribed by Ipiq-Aya in the reign of Ammi-ṣaduqa, ca. 1646–1626 BCE) is the most complete single witness; Lambert & Millard's composite text is the scholarly standard, supplemented by SB and MB joins."
  alternates:
    - source: lambert-millard-1969
      difference: "MB and SB recensions (heavily fragmentary) preserve a slightly different framing of the flood causation — the noise-pollution motif is sharper in OB, more theological in SB."
    - source: foster-2005
      difference: "Post-1969 joins (notably the Borger fragments) clarify the Igigi-rebellion scene and the creation of humans from clay mixed with the slain god's flesh and blood."

