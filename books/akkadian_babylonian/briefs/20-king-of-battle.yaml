variants:
  classification: co-equal
  prevalent_version:
    source: westenholz-1997
    why_prevalent: "Two substantially different recensions are roughly co-equal: the MB Amarna (EA 359, Cairo 48396, 14th c. BCE) preserved in an Egyptian royal archive, and the NA Nineveh (K.13228 + duplicates, 7th c. BCE). Neither alone is complete; both attest the legend's wide circulation."
  alternates:
    - source: westenholz-1997
      difference: "Amarna recension (MB): preserved in Egypt, evidence of the legend's international Late Bronze circulation. Compact, focused on the merchant-petition framing."
    - source: westenholz-1997
      difference: "Nineveh recension (NA): later, longer, with more elaborate description of the Anatolian campaign and Nūr-Daggal's defeat."

