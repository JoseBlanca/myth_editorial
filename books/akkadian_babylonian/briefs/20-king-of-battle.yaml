special_instructions: |
  Medium-length composition (2500–4000 words). Co-equal recensions: present Amarna (MB, brief) and Nineveh (NA, longer) versions side by side, with explicit dialect and recension flagging. The Amarna preservation in Egypt is itself a topic — flag it as evidence for the international Akkadian literary tradition in the Late Bronze. Foster 2005 is the working English; Westenholz 1997 the philological base. The merchant-petition framing is a distinctive feature of this legend; preserve it. Purušḫanda's identification (probably central Anatolia, Acemhöyük or similar) is debated; use "central Anatolia" without committing to a specific site unless Westenholz does. Note the recension-history relationship to the Hittite chancery's use of Akkadian.
