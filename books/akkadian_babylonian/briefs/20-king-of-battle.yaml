cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Two recensions across MB and NA; preservation in Egypt (Amarna) is itself evidence for the legend's international stature."
      source: "westenholz-1997, pp. 102–106"
    - kind: scholarly-attention
      detail: "Substantial scholarship; the Amarna copy in particular is foundational to studies of Akkadian as Late Bronze literary lingua franca."
      source: "westenholz-1997, pp. 102–139"
  function:
    - role: royal-legitimation
      basis: "Frames Sargon as defender of his subjects' commercial interests across vast distances; royal duty extends to the merchant frontier."
      source: "westenholz-1997 (commentary)"
    - role: literary
      basis: "Naru-style pseudo-historical epic; Sargon's reach to the far west is the central rhetorical claim."
      source: "westenholz-1997 (commentary)"
    - role: didactic
      basis: "The merchant-petition opening teaches the king's responsibility to defend trade routes; an unusually commercial framing for a royal legend."
      source: "westenholz-1997"
  cross_cultural_parallels:
    - other_culture: "Hurro-Hittite (Anatolia)"
      parallel: "The legend's setting in Purušḫanda (central Anatolia) is significant: Anatolia was a Hittite/Hurrian zone in the Late Bronze, and the Amarna copy attests Anatolian literary engagement with Akkadian Sargon traditions."
      source: "westenholz-1997 (commentary); hoffner-1998"
    - other_culture: "Egyptian"
      parallel: "The Königsnovelle genre — Egyptian royal-legend narratives — shares the structural framing of king-responding-to-divine-or-petition-summons."
      source: "westenholz-1997 (commentary)"
    - other_culture: "Akkadian (internal)"
      parallel: "Pairs with the Birth Legend of Sargon and other Sargon legends as part of the royal-legend dossier; together with the Cuthaean Legend, the King of Battle constitutes the Akkadian narratives of Sargon's reach."
      source: "westenholz-1997"

comparative_hooks:
  - other_culture: "Hurro-Hittite"
    parallel: "Preservation in Boğazköy archives; the Hittite chancery used Akkadian as lingua franca and engaged with Sargon traditions. Hoffner 1998 covers the Anatolian context."
    source: "hoffner-1998"
  - other_culture: "Amarna context"
    parallel: "The Amarna copy (EA 359) was preserved in an Egyptian royal archive — direct evidence for the legend's circulation as a literary lingua franca document in the 14th century BCE."
    source: "westenholz-1997"
  - other_culture: "Egyptian Königsnovelle"
    parallel: "King-responds-to-divine-or-petitionary-summons framing is shared with Egyptian Königsnovelle tradition."
    source: "westenholz-1997"

