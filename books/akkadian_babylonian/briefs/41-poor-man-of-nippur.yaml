cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Principal manuscript STT 38 with two minor witnesses (STT 39, STT 116); single-recension but with confirming witnesses"
      source: "foster-2005 pp. 357–364"
    - kind: scholarly-attention
      detail: "Universally cited in scholarship as the principal Akkadian comic folktale and the principal evidence for non-elite popular narrative in the cuneiform record; distinctive in tone and register from the rest of the Akkadian corpus"
      source: "bottero-2001 pp. 286–294; foster-2007 pp. 37–40"
    - kind: scholarly-attention
      detail: "Occasionally proposed in scholarship as influence on the *Tales of Aladdin* / Arabian Nights tradition — the trickster-revenge folktale form recurs across the Mesopotamian-Persian-Arabic transmission; the proposal is a comparative hypothesis, not a demonstrated descent"
      source: "foster-2007 pp. 37–40"
  function:
    - role: literary
      basis: "Comic folktale of social inversion — the poor citizen out-tricks the powerful mayor; distinctive register sets it apart from the rest of the Akkadian corpus and demonstrates the existence of popular narrative in the Mesopotamian repertoire"
      source: "bottero-2001 pp. 286–294"
    - role: didactic
      basis: "Encodes a social critique: the corrupt mayor is justly punished, the poor man's wit is rewarded; functions as moral entertainment with the populist edge characteristic of trickster tales"
      source: "foster-2005 pp. 357–364"
  cross_cultural_parallels:
    - other_culture: "later Persian/Arabic"
      parallel: "Frequently compared to the trickster-revenge tales of the *Arabian Nights* (e.g., the *Tales of Aladdin* cycle) — the poor protagonist who out-tricks the powerful tyrant is a recurring folktale form across the Mesopotamian-Persian-Arabic transmission; the proposal of direct descent is a scholarly hypothesis, not consensus"
      source: "foster-2007 pp. 37–40"
    - other_culture: "Greek (Aesop)"
      parallel: "Trickster-revenge fables and the comic-inversion tale form are widely attested in Aesopic and Greek folktale tradition; the Poor Man of Nippur is one of the earliest literary attestations of the form"
      source: "bottero-2001"
    - other_culture: "later folklore (cross-cultural)"
      parallel: "The threefold-revenge structure (three escalating disguises) is a widely attested folktale type in cross-cultural folklore (cf. AT/ATU index types of trickster-revenge tales); the Poor Man of Nippur is the earliest Mesopotamian literary instance"
      source: "foster-2007"

comparative_hooks:
  - other_culture: "later Persian/Arabic"
    parallel: "The *Arabian Nights* trickster-revenge cycle (e.g., the cycles around the Caliph and disguised commoners) shares the threefold-disguise revenge structure; some scholars propose direct transmission via the long Mesopotamian-Persian-Arabic literary continuity, but the case is not decisive"
    source: "foster-2007"
  - other_culture: "Greek (Aesop)"
    parallel: "Aesopic trickster-revenge fables share the form; the Poor Man of Nippur is one of the earliest literary attestations of the comic social-inversion folktale"
    source: "bottero-2001"
  - other_culture: "later folklore (cross-cultural)"
    parallel: "The threefold-revenge structure (three escalating disguises) is a widely attested folktale type (cf. Aarne-Thompson-Uther index); Poor Man of Nippur is the earliest Mesopotamian literary instance and a landmark in folklore-historical studies"
    source: "foster-2007"

