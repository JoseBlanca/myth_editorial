special_instructions: "Comic register — the chapter must preserve the comic tone of the composition. This is unique in the Akkadian corpus: a folkloric trickster tale, distinct from the high-literary register of Ludlul, the Theodicy, Enūma Eliš, and Gilgameš. Reproduce the three escalating revenge episodes (1: the noble visitor with chariot; 2: the disguised stranger with cudgel; 3: the hidden assailant) in extended translation — the three-revenge structure IS the tale, and a comic translation must convey the comic timing of the original. The principal manuscript is STT 38 from Sultantepe (ancient Ḫuzirina), with secondary witnesses STT 39 and STT 116 — corrected from the earlier 'SU 51/4 (Sultantepe)' identifier per inventory-audit finding A1. Reference editions are Gurney's *Anatolian Studies* 6 (1956) and 7 (1957); Foster 2005 and Dalley 2008 are the working English translations. The *Arabian Nights* / *Tales of Aladdin* parallel should be developed substantively but with appropriate scholarly hedging — the proposal of direct descent is a comparative hypothesis, not consensus. Honor the protagonist's name (Gimil-Ninurta — 'recompense of Ninurta') as itself a piece of the tale's literary craft."
