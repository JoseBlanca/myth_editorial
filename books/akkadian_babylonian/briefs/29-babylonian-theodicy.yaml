entities_glossary:
  - name: "Saggil-kīnam-ubbib"
    role: hero
    first_mention_gloss_candidate: "the author of the Theodicy, named in the acrostic that runs across the 27 stanzas: 'I, Saggil-kīnam-ubbib, the incantation-priest, am one who blesses the god and the king'; identifiable in colophons of incantation tablets as a named first-millennium scholar"
  - name: "kittu (𒅗𒋾𒁴, truth/justice)"
    role: ritual-term
    first_mention_gloss_candidate: "the Akkadian theological term for divine justice; one of the cosmic principles that the dialogue tests against observed human suffering"
  - name: "mīšaru (justice/equity)"
    role: ritual-term
    first_mention_gloss_candidate: "paired with *kittu*; the ordering principle of human society as established by the gods"
  - name: "the sufferer (unnamed)"
    role: hero
    first_mention_gloss_candidate: "the pious complainant of the dialogue, who never names himself; his stanzas alternate with the friend's defenses"
  - name: "the friend (unnamed)"
    role: hero
    first_mention_gloss_candidate: "the wise interlocutor who defends the gods, the social order, and the propriety of pious resignation"
  - name: "ilu and ištaru (𒀭, personal god and goddess)"
    role: deity
    first_mention_gloss_candidate: "the personal protective deities — male *ilu*, female *ištaru* — whose neglect or absence the sufferer laments"

cultural_relevance:
  centrality: central
  centrality_evidence:
    - kind: attestation-volume
      detail: "Manuscripts attested at Aššur, Babylon, Sippar, and Nineveh; transmitted into Hellenistic-period Babylonian libraries"
      source: "oshima-2014 pp. 201–270 (manuscript catalog)"
    - kind: scholarly-attention
      detail: "Named author preserved by the acrostic — exceedingly rare in Akkadian literature, where compositions are typically anonymous; the named-author convention places the Theodicy in the same prestige class as Sîn-lēqi-unninni's Gilgameš and Kabti-ilāni-Marduk's Erra"
      source: "lambert-1960 pp. 63–66"
    - kind: scholarly-attention
      detail: "Universally cited as the central document of Mesopotamian theodicy alongside Ludlul; the formal apex of the dialogic theodicy genre"
      source: "bottero-2001 pp. 251–267; foster-2007 pp. 21–24"
  function:
    - role: literary
      basis: "27-stanza acrostic dialogue is the most formally demanding composition in the entire Akkadian corpus; the constraint of 11 lines per stanza, all beginning with the same syllable, demonstrates virtuoso scribal authorship"
      source: "lambert-1960 pp. 63–66; oshima-2014 pp. 201–250"
    - role: didactic
      basis: "Stages the central problem of pious resignation versus protest; the friend defends the gods, the sufferer presses ever more pointed objections — the dialogue ends in formal closure rather than resolution, leaving the reader to weigh the arguments"
      source: "oshima-2014 pp. 201–250"
  cross_cultural_parallels:
    - other_culture: "biblical Israel"
      parallel: "The dialogic theodicy structure (sufferer + friend, escalating objections, no clean resolution) is the closest ancient Near Eastern parallel to the Job dialogues (Job 3–37); both stage the same problem in the same form"
      source: "bottero-2001 pp. 251–267"
    - other_culture: "biblical Israel"
      parallel: "Ecclesiastes (Qohelet) shares the unresolved-pessimism conclusion: the world's apparent injustice is registered without theological repair"
      source: "oshima-2014"
    - other_culture: "Akkadian (intra-tradition)"
      parallel: "Direct kinship with Ludlul (ch. 28) — same theology of inscrutable divine wrath, but Ludlul resolves into restoration whereas the Theodicy stops at unresolved closure; both are by Oshima 2014's framing 'poems of pious sufferers'"
      source: "oshima-2014"

comparative_hooks:
  - other_culture: "biblical Israel"
    parallel: "Job 3–37 closely parallels the Theodicy's dialogic form: cycles of speeches between sufferer and friends, with the same structural escalation of objections; the Theodicy and Job are commonly treated as the two great monuments of ancient Near Eastern dialogic theodicy"
    source: "oshima-2014"
  - other_culture: "biblical Israel"
    parallel: "Ecclesiastes (Qohelet) shares the unresolved-pessimism conclusion and the centrality of *hebel* / Akkadian-equivalent vanity language"
    source: "oshima-2014"
  - other_culture: "Akkadian (intra-tradition)"
    parallel: "*Dialogue between a Man and his God* (ch. 27) is the genealogical ancestor; Ludlul (ch. 28) is the resolved-restoration sister text; *Dialogue of Pessimism* (ch. 30) is the satirical inversion"
    source: "oshima-2014"

