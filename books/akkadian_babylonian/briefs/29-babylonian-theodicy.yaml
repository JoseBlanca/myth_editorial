special_instructions: "Foreground the acrostic. The 27-stanza acrostic spells: 'I, Saggil-kīnam-ubbib, the incantation-priest, am one who blesses the god and the king' — a named author signature unique among the major Akkadian theodicies. The chapter must (1) reproduce the acrostic in transliteration so the reader sees the technical achievement; (2) explain that *Saggil-kīnam-ubbib* is identifiable in incantation-tablet colophons as a real named first-millennium scholar — this is not a literary persona but a known scribe; (3) preserve the dialogic alternation (sufferer / friend / sufferer / friend...) for at least several stanzas in extended translation; (4) emphasize that the dialogue ends in unresolved closure, not theological resolution — this is the structural feature that distinguishes the Theodicy from Ludlul. Use Oshima 2014 for readings, Lambert 1960 for the editorial history, Foster 2005 for the working English translation. The Job parallel is the controlling cross-cultural hook and must be handled with the same care as in chapter 28 — structural parallel, not literary descent. Use [RECONSTRUCTION:] markers wherever Oshima's composite fills a damaged stanza."
