special_instructions: |
  Short, partly fragmentary Akkadian composition preserved on TWO manuscripts: A 7882 (Neo-Assyrian, Oriental Institute, Chicago) and BM 27776 (Neo-Babylonian, British Museum). Lambert 2013 pp. 321–325 (+ p. 497 notes) is the standard modern critical edition; Oshima 2010 ("Damkina shall not bring back her Burden in the future: A new Mythological Text of Marduk, Enlil, and Damkianna", on academia.edu — exact journal venue not yet verified) provides an independent edition with a substantive philological disagreement on the *il-let-sa* term. Neither Foster 2005 *Before the Muses* nor Dalley 2008 *Myths from Mesopotamia* contains this composition.

  CRITICAL CONTENT MODEL: This is NOT primarily a "feminine cosmogonic agency" / "structuring role in establishing cosmic order" composition (the original brief's framing, inherited from the wrong chapter-8 model). The actual narrative is a conflict-and-resolution sequence between Marduk's pantheon (Babylon) and Enlil's pantheon (Nippur):

  1. Marduk arrives at Nippur with his army (the surviving lines preserve a flooding / inundation motif).
  2. The gods of Eshumesha (Ninurta's temple at Nippur, in Enlil's pantheon) capture Anunnaki deities — i.e., the Enlil-side gods initially gain ground.
  3. Neretagmil, the *sukkal* (vizier) of the god Nāru (the deified river), delivers a message to Damkianna (Akkadian: Damkina) about the battle.
  4. Damkianna releases her *il-let-sa* — a contested term: Lambert reads it as "bond" (a displayable object, perhaps a clay tablet); Oshima reads it as "burden" (a potentially catastrophic plague or natural / celestial disaster).
  5. Marduk captures 360 gods of Eshumesha all together, with Enlil among them.
  6. The Neo-Babylonian copy's colophon says the contents were a secret and revealing them was a taboo of Marduk; future generations are warned against repeating the transgressions.

  Lambert dates the composition to the Kassite or Isin II dynasty (mid-2nd millennium BCE) on the basis that Marduk is already king of the gods but Nabu is still his scribe rather than his son. Oshima dates it to "the first quarter of the first millennium" (i.e., c. 1000–750 BCE). Lambert proposes Malgium as the place of composition. The text is composed in Akkadian with some Aramaic linguistic influence.

  The il-let-sa interpretation is load-bearing: under Lambert's "bond" reading, Damkina's act is a positive theological gesture (a binding / pact / displayable token that ends the conflict on Marduk's terms); under Oshima's "burden" reading, the act is more ominous (releasing a catastrophe). Mark this as a [VARIANT:] / [INFERENCE:] within the chapter — both readings are scholarly proposals on the same Akkadian word, not parallel manuscripts.

  Drop the "feminine cosmogonic chthonic pairing" framing entirely. The closer Akkadian internal comparandum is *Enmešarra's Defeat* (Chapter 6) — also a Marduk-subordinates-elder-divine-order narrative with binding / capture / judgement elements. The earlier "feminine consortship sub-cluster" framing (which paired Damkina's Bond with Uraš and Marduk under a presupposed female-Uraš identification) is dropped throughout.

  Oshima 2010 is NOT in sources.yaml; cite it via the named-but-flagged pattern (name in the footnote and in markers, but route EVIDENCE tokens through Lambert 2013 only). Recommend adding Oshima 2010 to sources.yaml at inventory-audit. Streck 2014 (BSOAS 77, 371) — already named-but-flagged from chapter 8 — also remains relevant for the manuscript-base identification (the Streck review names *Damkina's Bond*'s manuscripts).

  Mark all reconstructions with [RECONSTRUCTION:] markers. The two-manuscript collation is partial; the LACUNA marker should reference both A 7882 and BM 27776 with the specific damage profile. The VARIANT marker should distinguish (a) sub-manuscript variation within the two-witness tradition (philological) and (b) the Lambert / Oshima editorial disagreement on the il-let-sa term (interpretive).
