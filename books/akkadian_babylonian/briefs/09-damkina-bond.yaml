# Brief revised 2026-05-08, before stage 10a, on the basis of the chapter 8
# factcheck-round-1 finding F-2 ("Damkina's Bond is at Lambert 2013 pp.
# 321–325, NOT pp. 326–360 as the original chapter-8 brief carried; the
# chapter-9 brief inherits this error and must be re-locked at chapter-9
# brief stage") and on additional secondary verification (Wikipedia s.v.
# Damgalnuna; Oshima 2010 on academia.edu). The original brief carried
# four errors:
# (1) wrong page range — locked as pp. 326–333; actual is pp. 321–325 (+
#     p. 497 notes). Pp. 326–329 belong to the next chapter "The Defeat of
#     Enutila, Enmešarra, and Qingu", and pp. 330–345 to "Enki and
#     Ninmaḫ".
# (2) wrong manuscript count — described as a "single late-Babylonian
#     recension"; the composition is in fact preserved on TWO copies — a
#     Neo-Assyrian tablet A 7882 (Oriental Institute, Chicago) and a
#     Neo-Babylonian tablet BM 27776 (British Museum). Lambert 2013 and
#     Oshima 2010 both edit both manuscripts.
# (3) wrong narrative summary — described as "Damkina's structuring role
#     in establishing cosmic order without preserving the narrative
#     sequence." The actual narrative is substantive (not just gestures):
#     Marduk arrives at Nippur with his army; the gods of Eshumesha
#     (Ninurta's temple in Nippur, in Enlil's pantheon) capture Anunnaki
#     deities; Damkianna (Akkadian: Damkina) releases an object referred
#     to in the text as her *il-let-sa* — read by Lambert as "bond"
#     (something displayable, perhaps a clay tablet) and by Oshima as
#     "burden" (a plague or natural / celestial catastrophe); Marduk
#     captures 360 gods of Eshumesha including Enlil. The colophon of
#     the Neo-Babylonian copy says the contents were a secret and
#     revealing them was a taboo of Marduk.
# (4) wrong analytical pairing — paired with Uraš and Marduk as a
#     "feminine cosmogonic chthonic pairing" sub-cluster. The chapter 8
#     brief has been corrected to drop this framing (the Uraš in *Uraš
#     and Marduk* is the male agricultural Dilbat tutelary, not the
#     female cosmogonic Uraš); accordingly, the analytical pairing for
#     *Damkina's Bond* must be reframed. Damkina's Bond is closer to
#     *Enmešarra's Defeat* (Chapter 6) — both are conflict-and-binding
#     narratives in the Marduk dossier — than to the agricultural-
#     cosmogonic *Uraš and Marduk*.
#
# See chapters/08-uras-and-marduk.claims.factcheck-round1.yaml (finding
# F-2 specifically) for the upstream catch on the page range, and the
# academia.edu and Wikipedia s.v. Damgalnuna sources for the manuscript
# and narrative corrections. The corrected brief follows.

