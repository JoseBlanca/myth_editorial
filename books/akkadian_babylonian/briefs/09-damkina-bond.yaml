special_instructions: |
  Short, very fragmentary text (800–2000 words). Single late-Babylonian manuscript; the narrative is largely lost. Be transparent about how little is preserved — do NOT extrapolate a full story from a few lines. Best treated as a brief notice in the cosmogonic dossier, with explicit acknowledgement of the manuscript's damage. Pair analytically with Uraš and Marduk (chapter 8) — both attest to late-Babylonian interest in feminine cosmogonic agency. Mark all reconstructions; the manuscript's brokenness is itself part of the chapter's content.
