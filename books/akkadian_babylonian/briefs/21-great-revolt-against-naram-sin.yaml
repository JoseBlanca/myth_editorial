special_instructions: |
  Medium-length composition (2500–4000 words). Co-equal classification — four recensions (OA exercise + three OB recensions). Westenholz 1997 publishes all four in synopsis; preserve the recension differentiation in the chapter. The OA tablet is exercise-style, very fragmentary; the three OB recensions are co-equal. The Narām-Sîn legend cycle (chapters 21–25) is one of the most important royal-legend dossiers — preview the cycle structure here. Note the historical kernel: a contemporary Old Akkadian inscription mentions Narām-Sîn's suppression of a great revolt, so the legend has a historical foundation rare among Mesopotamian myths. Distinguish carefully from the Cuthaean Legend (chapter 24) — different composition, different framing. Audit finding A4 added this composition; reflect that this is a substantial OB narrative.
