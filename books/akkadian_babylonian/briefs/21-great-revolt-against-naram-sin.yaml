cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Four recensions across Old Akkadian and Old Babylonian periods; the legend was actively transmitted for centuries."
      source: "westenholz-1997, pp. 221–262"
    - kind: scholarly-attention
      detail: "Major OB narrative composition about an Akkadian king; comparable in scholarly weight to the Birth Legend of Sargon."
      source: "westenholz-1997, p. 221 (introduction)"
    - kind: royal-inscription
      detail: "Narām-Sîn's historical reign (ca. 2254–2218 BCE) is attested in Old Akkadian royal inscriptions, including a contemporary account of suppressing a great revolt; the legend grew on a historical kernel."
      source: "westenholz-1997, introduction; oracc/RIBO"
  function:
    - role: royal-legitimation
      basis: "Frames Narām-Sîn's piety and military success as divinely-sanctioned response to a coalition revolt; the king's piety is contrasted with the rebels' impiety."
      source: "westenholz-1997 (commentary)"
    - role: literary
      basis: "Naru-style narrative; one of the major OB compositions about an Akkadian king."
      source: "westenholz-1997"
    - role: didactic
      basis: "Teaches royal piety, the importance of consulting the gods, and the consequences of rebellion against divinely-sanctioned authority."
      source: "westenholz-1997 (commentary)"
  cross_cultural_parallels:
    - other_culture: "Hebrew Bible"
      parallel: "King-suppresses-rebellion narratives in the Davidic and Solomonic histories (1 Kings) share the structural framing of divinely-sanctioned royal authority confronting impious revolt."
      source: "westenholz-1997 (commentary)"
    - other_culture: "Akkadian (internal)"
      parallel: "Pairs with other Narām-Sîn legends (Cuthaean Legend, Erra and Narām-Sîn, Lord of Apišal, Elegy on the Death of Narām-Sîn) as part of the rich legend cycle around this king. The Great Revolt is the most historically-grounded of the Narām-Sîn legends."
      source: "westenholz-1997"
    - other_culture: "Egyptian"
      parallel: "Königsnovelle: king-confronts-rebellion-with-divine-aid is a recurrent Egyptian royal-legend pattern."
      source: "westenholz-1997 (commentary)"

