variants:
  classification: co-equal
  prevalent_version:
    source: westenholz-1997
    why_prevalent: "Four substantially different recensions are co-equal: (1) Old Akkadian exercise tablet (text 15, ca. 2200 BCE); (2) two OB excerpt tablets following the historical descriptions closely (texts 16A, 16B); (3) an incomplete OB recension (text 17); (4) an OB excerpt with curse formula ending (text 19). Westenholz 1997 publishes all four in synopsis as the standard edition; no single recension dominates."
  alternates:
    - source: westenholz-1997
      difference: "OA exercise tablet (text 15): earliest, fragmentary, ca. 2200 BCE."
    - source: westenholz-1997
      difference: "OB texts 16A, 16B: closely-related excerpt tablets following historical descriptions of the revolt."
    - source: westenholz-1997
      difference: "OB text 17: incomplete OB recension; differs in narrative framing."
    - source: westenholz-1997
      difference: "OB text 19: ends with a votive-style curse formula; situates the legend in cult-protective register."

