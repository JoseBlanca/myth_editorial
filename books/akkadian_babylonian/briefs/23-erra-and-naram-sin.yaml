special_instructions: |
  Short composition (800–2000 words). Single-prevalent (single OB tablet, BM 120003). Audit finding A3 added this entry to the inventory; the editio princeps was Lambert AfO 24 (1973), and Westenholz 1997 is the critical edition. CRITICAL: this composition is DISTINCT from the first-millennium Erra and Išum (chapter 16). Different protagonist (king Narām-Sîn vs. god Išum), different period (OB vs. NB), different framing (royal-legend vs. theological-narrative). Both share only the Erra figure. Be explicit about this distinction in the chapter opening — the conflation risk is real, especially in popular sources. Treat as one node in the Narām-Sîn dossier alongside chapters 21, 22, 24, 25.
