special_instructions: |
  Short composition (800–2000 words). Single-prevalent classification (single NA tablet). The composition is fragmentary; be transparent about how little is preserved. Audit finding A5 added this entry to the inventory; treat it as one node in the broader Narām-Sîn dossier. Distinguish carefully from the Cuthaean Legend (chapter 24), Erra and Narām-Sîn (chapter 23), and the Elegy (chapter 25) — these are FOUR distinct compositions, easily conflated. Apišal's location is debated; use "Mesopotamian" without committing to a specific identification unless Westenholz does. Mark all reconstructions; the manuscript's brokenness should be transparent.
