special_instructions: |
  Short, fragmentary text (800–2000 words). Single-manuscript composition; the hero's name is LOST in the lacuna — present this fact transparently rather than committing to "Tišpak". Mark the conjecture explicitly: `[CONJECTURE: hero's name lost; commonly identified as Tišpak]`. The text is most valuable as one node in the broader Akkadian combat-myth dossier; its own narrative is too fragmentary for deep treatment. Place it in the cosmogonic dossier framing — it is one of the alternative combat-cosmogonies that surrounded the dominant Marduk-Tiamat narrative.
