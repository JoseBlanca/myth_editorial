cultural_relevance:
  centrality: marginal
  centrality_evidence:
    - kind: attestation-volume
      detail: "Single fragmentary Neo-Assyrian manuscript (CT 13, 33–34); no other witnesses."
      source: "lambert-2013, pp. 361–362"
    - kind: scholarly-attention
      detail: "Marginal individually; significant collectively as part of the corpus showing how Babylonian creation thought varied beyond Enūma Eliš."
      source: "lambert-2013, pp. 361–365"
  function:
    - role: cosmological
      basis: "Combat-myth in which a divine champion is dispatched against a sea-emerging dragon — a parallel cosmogonic combat alongside Marduk vs. Tiamat."
      source: "lambert-2013, pp. 361–365"
    - role: ritual-aetiological
      basis: "Likely embedded in cult traditions of Ešnunna or another center where Tišpak was venerated; the cult context is conjectural."
      source: "lambert-2013, p. 364 (commentary)"
  cross_cultural_parallels:
    - other_culture: "Ugaritic"
      parallel: "Baal's combat against the seven-headed Lôtan (Litan) in the Baal Cycle — the dragon-from-sea / storm-god-champion combat motif is shared."
      source: "smith-1994"
    - other_culture: "Indo-European"
      parallel: "The HERO SLAY SERPENT formula (Indra-Vṛtra, Thor-Jörmungandr, Apollo-Python) — Labbu is one of the Akkadian instantiations of this widespread motif."
      source: "lambert-2013 (commentary)"
    - other_culture: "Hebrew Bible"
      parallel: "Leviathan and Rahab as primordial sea-monsters in Job 26, Psalm 74, Isaiah 27 — the chaoskampf typology spans the cultural sphere."
      source: "smith-1994"

comparative_hooks:
  - other_culture: "Ugaritic (Baal Cycle)"
    parallel: "Lôtan — the seven-headed sea-serpent slain by Baal — is the closest West Semitic parallel for Labbu; Smith 1994 covers the Baal-Yamm/Lôtan combats."
    source: "smith-1994"
  - other_culture: "Indo-European"
    parallel: "The 'hero slays serpent' pattern is the structural-comparative anchor; treated as a corpus motif rather than a direct borrowing."
    source: "lambert-2013"
  - other_culture: "Akkadian (internal)"
    parallel: "The combat-myth pattern is shared with Marduk vs. Tiamat (Enūma Eliš), Ninurta vs. Anzû, and the Cuthaean Legend monsters; Labbu is one node in this dossier."
    source: "lambert-2013"

