    - kind: scholarly-attention
      detail: "Substantial scholarship on the recensional differences; Gurney's 1960 SB edition and Foster's translation are reference points."
      source: "foster-2005, pp. 506–524"
  function:
    - role: theogonic
      basis: "Articulates the relationship between the upper-world war-god (Nergal) and the underworld queen (Ereškigal) — a divine pairing across cosmic spheres."
      source: "foster-2005, pp. 506–509"
    - role: eschatological
      basis: "Develops underworld geography and the laws governing celestial-chthonic encounter."
      source: "dalley-2008, pp. 163–181"
    - role: literary
      basis: "The SB Sultantepe version develops a romantic-courtly literary mode unusual in Akkadian myth — extended courtship, passionate dialogue, royal-wedding closure."
      source: "foster-2005, pp. 514–524"
