variants:
  classification: co-equal
  prevalent_version:
    source: foster-2005
    why_prevalent: "Two substantially different recensions are roughly co-equal in scholarly weight: the brief MB Amarna (EA 357, 14th c. BCE) and the long SB Sultantepe (STT 28 + joins, 7th c. BCE). The Sultantepe version is longer but later; the Amarna version is shorter but earlier. Neither dominates the scholarly record."
  alternates:
    - source: foster-2005
      difference: "MB Amarna recension: brief, etiological, focused on Nergal's descent and the establishment of his joint rule with Ereškigal. Possibly without the elaborate courtship scenes."
    - source: foster-2005
      difference: "SB Sultantepe recension: long, romantic-courtly, with elaborate scenes of Nergal's first descent (under Ea's instruction with fourteen demons and chair-trick), his return to heaven, his second descent in passionate haste, and the formal royal-wedding-and-coronation. Edited by O.R. Gurney in Anatolian Studies 10 (1960)."
    - source: foster-2005
      difference: "Late Babylonian Uruk fragment: brief, partly overlaps with the Sultantepe recension."

