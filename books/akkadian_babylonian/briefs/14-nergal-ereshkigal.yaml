special_instructions: |
  Co-equal recensions: present the MB Amarna (brief) and SB Sultantepe (long) versions side by side in the body, each introduced by recension and dialect. The Late Babylonian Uruk fragment may be footnoted. The audit finding A9 corrected the Sultantepe identifier from "SU 51/7" to STT 28 + joins; flag the field number for re-verification against CDLI before chapter-claims. Foster 2005 is the base translation for both recensions; cross-check Dalley 2008. The SB Sultantepe version's elaborate courtship scenes are exceptional in Akkadian literature — preserve their courtly register. The Amarna version's preservation in Egypt (alongside Adapa, Etana, King of Battle) is itself a piece of evidence for Akkadian's Late Bronze international circulation; mention this context.
