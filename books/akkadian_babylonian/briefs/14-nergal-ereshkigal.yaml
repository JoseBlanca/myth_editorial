# Brief revised 2026-05-09 (round 2), after the round-1 claims-factcheck
# returned BLOCK with three HIGH findings. Three brief-level corrections:
#   (R2-1) The Sultantepe SB recension's closure: removed the "formal
#          royal-wedding-and-coronation" framing (factcheck F-4
#          FACTUAL-FABRICATION). The actual surviving SB ending is
#          Anu's decree (much of which is damaged) establishing
#          Nergal's permanent co-rule with Ereškigal, followed by the
#          closing line of Nergal and Ereškigal entering the bedchamber
#          together. There is no separate wedding ceremony, no
#          coronation sequence, and no formal divine-assembly
#          ratification scene in the surviving text.
#   (R2-2) Amarna recension's narrative climax: the Amarna recension
#          preserves a hair-seizing-and-plea-for-life climax (Nergal
#          seizes Ereškigal by the hair, threatens to kill her, and
#          accepts joint rule when she pleads for her life) which
#          factcheck F-3 INCOMPLETE-FRAMING noted was elided in the
#          round-1 claims. The brief's `alternates` description is
#          updated to flag the Amarna climax explicitly.
#   (R2-3) Amarna literary cluster: the brief's `special_instructions`
#          referenced the Amarna cluster with "Adapa, Etana, King of
#          Battle" as parallel literary tablets. *Etana* is NOT in the
#          Amarna archive (factcheck F-1 FACTUAL-FABRICATION). The
#          attested Amarna mythological cluster is Adapa (EA 356),
#          Nergal (EA 357), and the King of Battle (Šar tamḫāri,
#          EA 359), plus miscellaneous lexical and educational material.
#          *Etana*'s manuscript witnesses are at Susa, Aššur, and
#          Nineveh.
# Audit finding A9 (Sultantepe identifier) was already resolved at
# round-1 brief-level: STT 28 + joins is the locked identifier, with
# the inventory's earlier "SU 51/7" form replaced.

