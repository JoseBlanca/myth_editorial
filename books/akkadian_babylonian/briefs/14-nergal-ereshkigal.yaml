variants:
  classification: co-equal
  prevalent_version:
    source: foster-2005
    why_prevalent: "Two substantially different recensions are roughly co-equal in scholarly weight: the brief MB Amarna (EA 357, 14th c. BCE) and the long SB Sultantepe (STT 28 + joins, 7th c. BCE). The Sultantepe version is longer but later; the Amarna version is shorter but earlier. Neither dominates the scholarly record."
  alternates:
    - source: foster-2005
      difference: "MB Amarna recension: brief, etiological, with a violent narrative climax: Nergal descends, seizes Ereškigal by the hair, pulls her from her throne, and is on the point of killing her when she pleads for her life by offering him joint kingship of the underworld. He accepts; the two are married. The brief etiological resolution closes the Amarna text. Possibly without the elaborate first-descent / Ea-instruction / fourteen-demons stratagem of the SB recension."
    - source: foster-2005
      difference: "SB Sultantepe recension: long, romantic-courtly, with elaborate scenes of Nergal's first descent (under Ea's instruction with fourteen demons; the prohibitions catalogue against the underworld's offerings of chair, food, beer, water, and bathing-vision), his return to heaven, his second descent in passionate haste (with the hair-seizing motif also attested here, paralleling the Amarna climax but here resolved in reunion rather than confrontation), and the closing scene with Anu's decree establishing Nergal's permanent co-rule and the closing bedchamber line. Edited by O. R. Gurney in *Anatolian Studies* 10 (1960). NB: there is no separate royal-wedding-ceremony or coronation sequence in the surviving SB text; Anu's decree IS the ratification, and the bedchamber reunion IS the resolution."
    - source: foster-2005
      difference: "Late Babylonian Uruk fragment: brief, partly overlaps with the Sultantepe recension."

