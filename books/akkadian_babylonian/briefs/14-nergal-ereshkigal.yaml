special_instructions: |
  Co-equal recensions: present the MB Amarna (brief) and SB Sultantepe (long) versions side by side in the body, each introduced by recension and dialect. The Late Babylonian Uruk fragment may be footnoted. The audit finding A9 corrected the Sultantepe identifier from "SU 51/7" to STT 28 + joins; flag the field number for re-verification against CDLI before chapter-claims. Foster 2005 is the base translation for both recensions; cross-check Dalley 2008. The SB Sultantepe version's elaborate Ea-stratagem and prohibitions-catalogue are exceptional in Akkadian literature — preserve their courtly-romantic register. The Amarna version's preservation in Egypt (alongside *Adapa* on EA 356, *Šar tamḫāri* / *King of Battle* on EA 359, and miscellaneous lexical and educational material) is itself a piece of evidence for Akkadian's Late Bronze international circulation; mention this context. NB: *Etana* is NOT in the Amarna archive (round-2 brief revision per factcheck F-1); the Amarna mythological cluster is Adapa (EA 356), Nergal (EA 357), King of Battle (EA 359). NB on Sultantepe ending: there is no formal royal-wedding ceremony or coronation in the surviving SB text — the closure is Anu's decree (much of which is damaged) establishing the permanent co-rule, followed by the closing bedchamber line. The "wedding-and-coronation" framing of the original brief was a fabrication corrected by the round-1 factcheck. NB on union duration: Foster's translation gives "six days and six nights" of union (not seven); the action turns on the seventh day with Anu's intervention / Nergal's escape.
