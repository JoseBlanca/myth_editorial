special_instructions: |
  Short composition (800–2000 words). Audit finding A6 flagged the elegy's narrative substance as possibly below the chapter-inclusion threshold; the editorial decision (made here at chapter-briefs stage) is to KEEP it as a brief chapter to round out the Narām-Sîn dossier (chapters 21–25). The composition is fragmentary; be transparent about how little is preserved. Treat it as the structural close to the legend cycle — the elegy is the cycle's natural ending. Mark all reconstructions. Distinguish carefully from the Cuthaean Legend (chapter 24), which has a didactic ending; the elegy provides an alternative, lament-mode ending.
