cultural_relevance:
  centrality: central
  centrality_evidence:
    - kind: attestation-volume
      detail: "Some 80 SB manuscripts; OB and MB forerunners; first-millennium copies from Nineveh, Aššur, Sultantepe, Sippar, Babylon, Uruk; Late Bronze diffusion to Hattusa, Megiddo, Emar, Ugarit."
      source: "george-2003, vol. 1, manuscript catalogue"
    - kind: scholarly-attention
      detail: "The most-studied composition in Akkadian literature since George Smith's 1872 publication of the flood tablet; subject of an enormous secondary literature."
      source: "george-2003, vol. 1, introduction"
    - kind: iconography
      detail: "Gilgameš, Ḫumbaba, and the Bull of Heaven appear on Mesopotamian seals and reliefs across two millennia; the Ḫumbaba-mask amulet is a distinctive iconographic class."
      source: "black-green-1992, s.v. Gilgameš, Ḫumbaba"
    - kind: ritual-context
      detail: "Gilgameš figures in funerary rituals and underworld liturgies as a judge of the dead in some traditions."
      source: "black-green-1992, s.v. Gilgameš"
  function:
    - role: literary
      basis: "The supreme literary achievement of the Akkadian-language tradition; the first extant epic with sustained psychological development."
      source: "noegel-2005"
    - role: didactic
      basis: "Meditation on mortality, friendship, and the meaning of human achievement; the late-recension prologue explicitly frames it as wisdom literature."
      source: "george-2003 (commentary on prologue)"
    - role: royal-legitimation
      basis: "Gilgameš is presented as the model king; the epic situates royal piety, building, and wisdom in the Uruk frame."
      source: "george-2003 (introduction)"
    - role: cosmological
      basis: "Tablet XI's flood narrative connects Gilgameš to the cosmogonic-anthropogonic tradition of Atra-ḫasīs."
      source: "lambert-millard-1969"
  cross_cultural_parallels:
    - other_culture: "Hebrew Bible"
      parallel: "Tablet XI's flood narrative parallels Genesis 6–9; the textual relationships are central to comparative Babylonian-biblical scholarship."
      source: "kvanvig-2011"
    - other_culture: "Greek"
      parallel: "The Odyssey's Achilles-Patroclus friendship, the underworld journey, and the longing for immortality have Gilgameš as a structural antecedent in the broader cuneiform-Mediterranean cultural sphere."
      source: "noegel-2005"
    - other_culture: "Sumerian (comparative)"
      parallel: "The Sumerian Gilgameš poems (ETCSL 1.8.1.1–1.8.1.5) cover individual episodes (Gilgameš and the Cedar Forest, Bull of Heaven, Death of Gilgameš); the Akkadian SB epic is an INDEPENDENT literary product, not a translation. The Sumerian poems are comparative material per scope.md."
      source: "etcsl"
    - other_culture: "Hurro-Hittite"
      parallel: "Boğazköy preserves a Hurrian Gilgameš and a Hittite paraphrase; the epic was actively known and adapted in Anatolia in the Late Bronze."
      source: "george-2003 (Boğazköy material)"

comparative_hooks:
  - other_culture: "Sumerian (Gilgameš poems)"
    parallel: "The Sumerian poems treat Gilgameš in episodes (Cedar Forest, Bull of Heaven, Bilgames and the Netherworld). The Akkadian SB epic synthesizes some but not all of these into a unified literary product. Treat as comparative material per scope.md."
    source: "etcsl 1.8.1.1–1.8.1.5"
  - other_culture: "Akkadian (internal — Atra-ḫasīs)"
    parallel: "Tablet XI's flood narrative is borrowed from Atra-ḫasīs; the Gilgameš tradition incorporates the cosmogonic flood inheritance. George 2003 traces the textual dependence."
    source: "george-2003"
  - other_culture: "Hebrew Bible"
    parallel: "Genesis 6–9 flood; Tablet XI is the most-studied Babylonian-biblical comparative case. Specific motifs: divine warning, multi-deck boat, sending of birds, post-flood sacrifice, divine acceptance."
    source: "kvanvig-2011"
  - other_culture: "Hurro-Hittite"
    parallel: "Boğazköy Hurrian and Hittite Gilgameš fragments evidence the epic's Late Bronze international diffusion in cuneiform circles."
    source: "george-2003"

