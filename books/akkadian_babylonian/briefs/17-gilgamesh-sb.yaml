special_instructions: |
  Major composition (10000–15000 words). The supreme epic of the tradition; structure as a tablet-by-tablet retelling (I–XI), with Tablet XII handled as a separate section flagged as the editorial appendix it is. George 2003 is the philological base; cite Foster 2005 for the working English. Distinguish between (a) SB Sîn-lēqi-unninni recension as base text, (b) OB and MB forerunners cited by name and dialect when they preserve different material, (c) Tablet XII as a partial Akkadian translation of a Sumerian source — flagged as editorial overlay. Mark all reconstructions with `[RECONSTRUCTION:]` markers naming the donor manuscript and dialect/period. The Sumerian Gilgameš poems are comparative ONLY — never used to fill gaps in the Akkadian text. Foreground the late-recension prologue (ša naqba īmuru, "He who saw the deep") as a wisdom-literature framing. The Tablet XI flood scene is downstream from Atra-ḫasīs; flag the textual dependence. Dialect markers throughout: SB is the body text; OB and MB are signposted when used.
