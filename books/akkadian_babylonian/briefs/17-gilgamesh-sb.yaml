lacunae:
  - source: george-2003
    location: "Tablet I, prologue, lines 1–28 (the late-recension prologue)"
    what_is_missing: "Several lines of the late-recension prologue are damaged; the relationship between the original opening (šūtur eli šarrī) and the late-recension prologue (ša naqba īmuru) is partly reconstructed."
    in_tradition_fills_available: "yes — multiple manuscripts; George 2003 collates."
  - source: george-2003
    location: "Tablet IV (Cedar Forest journey), various breaks"
    what_is_missing: "Tablet IV's framework of seven-day-march sections has gaps in the dream sequences."
    in_tradition_fills_available: "yes — partly from OB and MB forerunners (Schøyen tablet, Sippar tablets), with `[RECONSTRUCTION:]` flagging the donor recension and dialect."
  - source: george-2003
    location: "Tablet VII, opening (Enkidu's curse and dream)"
    what_is_missing: "The opening of Tablet VII is damaged in the principal manuscripts."
    in_tradition_fills_available: "yes — secondary Nineveh manuscripts and Sultantepe joins fill most gaps."
  - source: george-2003
    location: "Tablet XII (descent-to-the-underworld appendix)"
    what_is_missing: "Tablet XII is preserved but its relationship to Tablets I–XI is editorial — it is a partial Akkadian translation of the second half of the Sumerian Gilgameš, Enkidu, and the Netherworld appended to the SB epic."
    in_tradition_fills_available: "yes — single-source Akkadian; the Sumerian original is comparative material only."

variants:
  classification: composite-editorial
  prevalent_version:
    source: george-2003
    why_prevalent: "The Standard Babylonian recension attributed to Sîn-lēqi-unninni (late 2nd millennium BCE) is the dominant scholarly text; the SB recension is preserved across some 80 manuscripts from Nineveh, Aššur, Sultantepe, Sippar, Babylon, Uruk, and other centers. George 2003 establishes the standard composite text by collating these witnesses; no single manuscript preserves the entire 12-tablet epic."
  alternates:
    - source: george-2003
      difference: "OB forerunners (Pennsylvania tablet [Yale Babylonian Collection], Yale tablet, Sippar tablet [the 'Old Babylonian Tablet III/IV']) preserve substantial earlier material with significant differences — the OB Gilgameš is structurally more compact and lacks the late-recension prologue."
    - source: george-2003
      difference: "MB forerunners (Boğazköy fragments in Akkadian; the Megiddo fragment) attest the epic's Late Bronze international diffusion."
    - source: george-2003
      difference: "Tablet XI's flood narrative is heavily indebted to Atra-ḫasīs; Tablet XII is a partial Akkadian translation of the second half of the Sumerian Gilgameš, Enkidu, and the Netherworld — both are editorial overlays on the underlying epic."

