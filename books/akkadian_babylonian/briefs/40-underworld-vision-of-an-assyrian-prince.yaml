entities_glossary:
  - name: "Kummâ"
    role: hero
    first_mention_gloss_candidate: "the Assyrian prince who recounts his dream-journey to the underworld; identity uncertain — possibly a literary persona rather than a historical Neo-Assyrian crown prince; the name is preserved in the colophon"
  - name: "Nergal (𒀭𒅈)"
    role: deity
    first_mention_gloss_candidate: "king of the underworld in the Assyrian recension; appears in the vision enthroned in the netherworld assembly"
  - name: "Ereškigal"
    role: deity
    first_mention_gloss_candidate: "queen of the underworld; appears alongside Nergal in the netherworld court"
  - name: "Namtar"
    role: deity
    first_mention_gloss_candidate: "the underworld vizier and god of fate-as-death; one of the demonic figures in the assembly"
  - name: "the demons (gallû, mukīl rēš lemutti, etc.)"
    role: deity
    first_mention_gloss_candidate: "the monstrous attendants of the underworld court; the vision describes their forms in detail"
  - name: "kurnugê (𒆳𒉡𒄀𒂊, the land of no return)"
    role: place
    first_mention_gloss_candidate: "the underworld; the technical Akkadian designation for the realm of the dead, used here in its full eschatological sense"
  - name: "VAT 10057"
    role: artifact
    first_mention_gloss_candidate: "the unique Neo-Assyrian tablet from Aššur (Vorderasiatisches Museum Berlin) that is our sole witness to the composition"

cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Preserved on a single Neo-Assyrian tablet (VAT 10057, Aššur); but the composition's importance vastly outweighs its physical attestation, because it is the most detailed Akkadian description of the underworld and the central document of Mesopotamian visionary literature"
      source: "livingstone-1989 SAA 3 no. 32"
    - kind: scholarly-attention
      detail: "Cited extensively in scholarship on Mesopotamian eschatology; the principal Akkadian text for the underworld geography and demonography that informs the broader Mesopotamian afterlife concept"
      source: "bottero-2001 pp. 268–286; foster-2007 pp. 35–37"
    - kind: ritual-context
      detail: "Likely composed in the reign of Aššurbanipal or his predecessors; closely linked to Neo-Assyrian royal piety and the *takultu* ritual context in which dream-revelations were a recognised channel of divine warning"
      source: "livingstone-1989 SAA 3 introduction"
  function:
    - role: eschatological
      basis: "Provides the most detailed Akkadian description of the underworld assembly, demons, and infernal geography; the principal Akkadian eschatological vision text"
      source: "livingstone-1989 SAA 3 no. 32"
    - role: royal-legitimation
      basis: "Frames the vision as moral and political lesson on royal piety — the prince is shown the consequences of impiety and returned to life with a divine warning; functions as Neo-Assyrian dynastic instruction"
      source: "livingstone-1989; foster-2007 pp. 35–37"
    - role: literary
      basis: "First-person dream-vision narrative; the principal Akkadian instance of the visionary genre that will inform later Hellenistic and Jewish apocalyptic"
      source: "bottero-2001 pp. 268–286"
  cross_cultural_parallels:
    - other_culture: "Hellenistic and later Mediterranean"
      parallel: "The katabasis tradition — dream- or soul-journeys to the underworld with moral instruction returned to life — finds its earliest Akkadian instance here; later Hellenistic katabasis literature (Plato's *Myth of Er*, Plutarch's *De genio Socratis*) and Roman *Aeneid* VI inherit the form"
      source: "bottero-2001 pp. 268–286"
    - other_culture: "biblical Israel"
      parallel: "The biblical apocalyptic visionary genre (1 Enoch, Daniel 7–12, the Ezekiel vision-cycle) shares the form of the dream-revelation given to a named pious figure with eschatological content; the Akkadian Underworld Vision stands among its ancient Near Eastern antecedents"
      source: "foster-2007"
    - other_culture: "Akkadian (intra-tradition)"
      parallel: "Continuity with the *Descent of Ishtar* (ch. 13) and *Nergal and Ereškigal* (ch. 14) — same underworld geography, same dramatis personae (Nergal, Ereškigal, Namtar); the Underworld Vision is the human-prince counterpart to the divine-descent narratives"
      source: "livingstone-1989"

comparative_hooks:
  - other_culture: "Hellenistic and later Mediterranean"
    parallel: "Plato's *Myth of Er* (Republic X), Plutarch's *De genio Socratis*, and the Aeneid VI's underworld scene exhibit the same dream-vision-of-the-afterlife form with moral instruction; the Akkadian Underworld Vision is the earliest extant Mesopotamian instance of the form that informs the Mediterranean tradition"
    source: "bottero-2001"
  - other_culture: "biblical Israel"
    parallel: "1 Enoch's tour-of-the-cosmos visions (1 Enoch 17–36) and Daniel 7's vision of the heavenly throne-room share the form of the dream-vision given to a named seer with eschatological content; Akkadian visionary texts stand among the antecedents"
    source: "foster-2007"
  - other_culture: "Hurro-Hittite"
    parallel: "Hittite dream-narratives at Boğazköy and the wider Anatolian dream-revelation tradition share elements of the form; a regional ancient Near Eastern visionary tradition stands behind both"
    source: "livingstone-1989"

