special_instructions: "Single substantial recension. The chapter must (1) reproduce the catalog of demons and their forms in extended translation — this is the most distinctive feature of the composition and the principal evidence cited in scholarship on Mesopotamian demonography; (2) name the prince Kummâ and acknowledge that he may be a literary persona rather than a historical crown prince; (3) preserve the dream-frame structure (vision-during-sleep, return-with-warning); (4) develop the eschatological function — this is the principal Akkadian underworld-vision text, and it stands at the head of a long Mediterranean katabasis tradition. The tablet is VAT 10057 (Aššur) — corrected from the earlier 'K.883 + K.2727 (Nineveh)' identifier per inventory-audit finding A2. Use Livingstone 1989 (SAA 3 no. 32) for the critical edition and Foster 2005 for the working English translation. Use [RECONSTRUCTION:] markers where damaged sections are restored; honestly flag the dream-frame opening and the closing divine warning as physically damaged."
