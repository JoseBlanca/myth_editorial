target_length_words: 2200

special_instructions: "Short fragmentary instruction. Structure the chapter around the surviving topic-clusters: speech (and silence), choice of friends, charity to the poor, business honesty, marriage, and conduct before officials. Reproduce a representative selection of maxims in extended translation — the chapter is short and the maxims must do the work. The Egyptian *Amenemope* / *Ptahhotep* and biblical Proverbs 22:17–24:22 parallel is the controlling cross-cultural hook and should be discussed substantively, not merely listed. Note that this composition is fragmentary — the opening is damaged and the addressee-formula is reconstructed from genre context, not directly preserved."
