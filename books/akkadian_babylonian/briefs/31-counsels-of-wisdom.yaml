entities_glossary:
  - name: "the father (unnamed addressor)"
    role: hero
    first_mention_gloss_candidate: "the speaker who instructs his addressee with maxims; not named in the surviving text but identifiable by genre as a father (or mentor) addressing a son (or pupil)"
  - name: "the son (unnamed addressee)"
    role: hero
    first_mention_gloss_candidate: "the recipient of the counsels; identified by the vocative 'my son' (mārī) at multiple points in the text"
  - name: "milku (𒈠𒋾, counsel)"
    role: ritual-term
    first_mention_gloss_candidate: "the central genre term — 'counsel', 'advice', 'wise instruction'; the operative word of the practical-wisdom corpus"
  - name: "nēmequ (wisdom)"
    role: ritual-term
    first_mention_gloss_candidate: "the same theological wisdom-term that titles Ludlul (*bēl nēmeqi*); here used in its everyday practical sense rather than its theological one"

cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Multiple Nineveh manuscripts (K.4509 + duplicates); transmitted in first-millennium scribal libraries"
      source: "lambert-1960 pp. 96–98"
    - kind: scholarly-attention
      detail: "Universally cited as the closest Akkadian equivalent to Egyptian *Instruction* genres (Ptahhotep, Amenemope, Any) and as the principal Akkadian witness to the practical-wisdom genre"
      source: "lambert-1960 pp. 96–107; foster-2007 pp. 27–29"
  function:
    - role: didactic
      basis: "Father-to-son maxims on speech and silence, choice of friends, treatment of the poor, business honesty, conduct before officials, marriage — practical ethics for the literate elite"
      source: "lambert-1960 pp. 96–107"
    - role: literary
      basis: "The principal Akkadian instance of the *instruction* genre; preserves the maxim form as a discrete literary type alongside the dialogic and disputational forms"
      source: "foster-2007 pp. 27–29"
  cross_cultural_parallels:
    - other_culture: "biblical Israel"
      parallel: "The biblical book of Proverbs (especially Proverbs 1–9) shares the father-to-son instruction frame and the maxim form; the closest ancient Near Eastern Hebrew parallel"
      source: "lambert-1960 pp. 96–107"
    - other_culture: "Egyptian"
      parallel: "Egyptian *Instruction of Amenemope* and *Instruction of Ptahhotep* are the controlling generic parallels; the Akkadian Counsels stands within the same Eastern Mediterranean instruction tradition"
      source: "lambert-1960"
    - other_culture: "Aramaic"
      parallel: "The Aramaic *Words of Aḥiqar* (set at the Assyrian court) is the direct downstream continuation of this maxim tradition into the West Semitic world"
      source: "foster-2007"

comparative_hooks:
  - other_culture: "Egyptian"
    parallel: "Specific maxim parallels with *Amenemope* and *Ptahhotep* — on speech, on the treatment of the poor, on the avoidance of bad company; these stand at the head of an ancient Near Eastern instruction-tradition that links Egypt, Mesopotamia, and the West Semitic world"
    source: "lambert-1960"
  - other_culture: "biblical Israel"
    parallel: "Proverbs 1–9 (the long father-to-son introduction) and Proverbs 22:17–24:22 (the 'Words of the Wise') share specific maxims with Egyptian *Amenemope* and the Akkadian Counsels; the three-way parallel is one of the strongest cases for ancient Near Eastern wisdom transmission"
    source: "lambert-1960"
  - other_culture: "Aramaic"
    parallel: "The Aramaic *Aḥiqar* is the Late Iron Age/Persian-period heir of this instruction tradition — set at the Assyrian court precisely because the genre was at home there"
    source: "foster-2007"

triangulation_databases:
