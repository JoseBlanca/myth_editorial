special_instructions: |
  Short composition (800–2000 words). Single late-Babylonian manuscript = single-prevalent. Audit finding A8 flagged the Lambert 2013 page range for spot-checking before chapter-claims — preserve this note. The text is a discrete composition (per Lambert 2013's chapter arrangement, cleared by audit A8); do NOT conflate with the Founding of Eridu. The brick-foundation theme is best framed as part of the architectural-cosmogony sub-corpus alongside Toil of Babylon and Founding of Eridu. Mark all reconstructions; the manuscript's brokenness should be transparent. The chapter is the closing piece of the cosmogonic cycle in the book — provide a brief summative reflection on how the cosmogonic dossier has shown the diversity of Babylonian creation thought beyond the dominant Enūma Eliš.
