# Brief revised 2026-05-09 (round 1), before stage 10a, on the basis of
# preemptive Lambert 2013 TOC verification (DeGruyter Brill chapter
# landing; resolves audit finding A8). The original brief carried one
# upstream error:
# (1) wrong Lambert 2013 page range — locked as pp. 384–386; actual
#     range for "The First Brick" (Lambert 2013 chapter 33) is pp.
#     376–383, verified at the DeGruyter Brill chapter landing for
#     "The First Brick" (doi:10.1515/9781575068619-028). The original
#     pp. 384–386 corresponds to a different chapter in the volume
#     ("Another Dragon-Slaying Episode", per the DeGruyter Brill
#     volume table of contents). This correction is consistent with
#     the chapter 10 brief revision, which determined that pp. 366–375
#     is "The Founding of Eridu" (not pp. 376–383, as the chapter 10
#     inventory had said) and that pp. 376–383 is "The First Brick".
# Audit finding A8 (severity MEDIUM, kind SILENT-CONFLATION) is
# accordingly resolved at the bibliographic level: the page-range
# discrepancy is corrected; the distinction between The First Brick
# and The Founding of Eridu as two separate compositions in adjacent
# sections of Lambert 2013 is preserved.
#
# Brief revised again 2026-05-09 (round 2), after the round-1
# claims-factcheck returned BLOCK with three HIGH findings (F-1
# CONTAMINATION, F-2 and F-3 CITATION-WRONG). The original brief
# (and the round-1 brief revision) was structurally misaligned with
# the actual content of Lambert 2013 chapter 33. The round-2
# revisions:
#
# (R2-1) Principal divine actor: Ea (NOT Marduk). Verified via
#     three independent Wikipedia articles (s.v. Enki, Kusu,
#     Ningishzida), each footnoted to specific Lambert 2013 pages
#     within pp. 376–381. Marduk is conspicuously absent from
#     Lambert 2013 chapter 33.
# (R2-2) Wider divine cast: Ea creates the Abzû and then fashions
#     from clay seventeen further deities — Kulla (the brick-god,
#     tasked to renovate the first brick), Ninildu, Ninsimug,
#     Ninagal (tasked to help with the construction), Arazu,
#     Guškinbanda, Ninzadim, Ninkurra, Ašnan, Laḫar, Siris,
#     Ningišzida, Ninšar, Adag, Umunmutamgu, and Umunmutamnag (the
#     last eight tasked to supply resources to mankind for regular
#     offerings), and Kusu (tasked to perform the rites of the
#     temple) — plus a king and mankind. The composition is a
#     polytheistic / craft-pantheon-creation cosmogony, not a
#     Marduk-and-Ea two-actor cosmogony.
# (R2-3) Ritual context: TEMPLE RENOVATION (not new-temple
#     foundation). The libittu maḫrītu ("first/former brick") is
#     the brick recovered from the existing temple's structure
#     during renovation, recycled into the new structure as a
#     continuity-marker between old and new temples; not the
#     inaugural brick of a wholly-new construction. Independently
#     attested by Novotny "Temple Building in Assyria" for the
#     Esarhaddon and Assurbanipal royal-inscription first-brick rite
#     and by all three Wikipedia summaries of Lambert 2013 ch. 33.
# (R2-4) Manuscript witnesses: NOT a single manuscript — multiple
#     Late Babylonian tablets (principally WVDOG 4 plate 12, with
#     "etc." per Streck 2014 BSOAS 77 [2014] 371–372 review) PLUS a
#     late Assyrian fragment. The single-prevalent classification is
#     retained because the late Assyrian fragment functions as a
#     duplicate rather than a recensional variant; but the witness
#     statement must accurately reflect plural witnesses.
# (R2-5) ušumgallu attribute: REMOVED from the entities glossary —
#     no accessible independent source confirms its presence in
#     Lambert 2013 chapter 33. The Wikipedia article on Ušumgallu
#     does not cite The First Brick; the three composition-summaries
#     do not mention ušumgallu. Without direct Lambert 2013 access,
#     the safer course is to omit.
# (R2-6) Architectural-cosmogony sub-corpus framing: HEDGED. The
#     three compositions (First Brick, Toil of Babylon, Founding of
#     Eridu) differ in principal divine actor — First Brick is
#     Ea-centred, while Founding of Eridu and Toil of Babylon are
#     Marduk-centred. The unifying thread is "construction-as-
#     cosmogony" only at the broadest typological level; the
#     editorial grouping reflects modern thematic categorisation,
#     not ancient compositional intent or divine-actor coherence.
#
# See chapters/12-first-brick.claims.factcheck.yaml for the full
# round-1 factcheck findings (verdict: BLOCK; HIGH findings F-1, F-2,
# F-3; MEDIUM findings F-4, F-5; LOW findings F-6, F-7).

