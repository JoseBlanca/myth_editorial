special_instructions: |
  Short composition (800–2000 words). The composition is preserved on multiple Late Babylonian witnesses (principally WVDOG 4 plate 12, with additional witnesses per Streck 2014 BSOAS) plus a late Assyrian fragment; classified single-prevalent because the witnesses function as duplicates of a single recension. Audit finding A8 (page-range spot-check) is resolved at the bibliographic level by the 2026-05-09 round-1 brief revision: Lambert 2013 chapter 33 = pp. 376–383.

  PRINCIPAL CONTENT MODEL (round-2-revised): The First Brick is an Ea-centred polytheistic / craft-pantheon-creation cosmogony embedded in a temple-RENOVATION incantation. Ea creates the Abzû and then fashions from clay seventeen named craft-pantheon deities (Kulla and the rest), plus a king and mankind, who together perform the temple-renovation labour. Marduk is NOT in the composition; do not import Marduk-centred framing from the wider late-Babylonian dossier. The libittu maḫrītu ("first/former brick") is the brick recovered from the existing temple during renovation and recycled into the new structure — a continuity-marker between old and new temples, not the inaugural brick of a wholly-new construction.

  The text is a discrete composition (per Lambert 2013's chapter arrangement, cleared by audit A8); do NOT conflate with the Founding of Eridu. The brick-renovation theme can be framed at the level of typology with Toil of Babylon and Founding of Eridu as compositions in which architectural acts are cosmogonically loaded, but the chapter must explicitly note the divine-actor difference (First Brick is Ea-centred; the other two are Marduk-centred). Do not present the three compositions as a unified Marduk-cosmogonic sub-corpus.

  Mark all reconstructions; the manuscript's brokenness should be transparent. The chapter is the closing piece of the cosmogonic cycle in the book — provide a brief summative reflection on how the cosmogonic dossier has shown the diversity of Babylonian creation thought beyond the dominant Enūma Eliš, with First Brick contributing the polytheistic / craft-pantheon-creation register that complements the more familiar Marduk-centred compositions.
