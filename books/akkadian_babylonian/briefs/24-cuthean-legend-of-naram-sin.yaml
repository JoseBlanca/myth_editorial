cultural_relevance:
  centrality: central
  centrality_evidence:
    - kind: attestation-volume
      detail: "OB and SB recensions; SB witnesses include manuscripts from Sultantepe, Nineveh, and Aššur — the legend was widely transmitted."
      source: "westenholz-1997, pp. 263–270"
    - kind: scholarly-attention
      detail: "The foundational text of the Akkadian naru genre; major piece in studies of Mesopotamian historiography and royal legend."
      source: "westenholz-1997, pp. 263–368; foster-2007"
    - kind: ritual-context
      detail: "Anchored in Cutha, cult center of Nergal; the legend frames itself as inscribed in Nergal's temple as a teaching for future kings."
      source: "westenholz-1997 (commentary)"
  function:
    - role: didactic
      basis: "The legend's closing injunction — consult oracles before war — is explicit didactic teaching for future kings; this is the text's stated function."
      source: "westenholz-1997, closing lines"
    - role: royal-legitimation
      basis: "Inverts the standard royal-success pattern: Narām-Sîn's HUMILIATION is the source of his wisdom. A negative model that reinforces the positive — kings should heed divine warnings."
      source: "westenholz-1997 (commentary)"
    - role: literary
      basis: "Foundational naru genre — the pseudo-autobiographical-royal narrative form."
      source: "foster-2007, pp. 95–98"
    - role: ritual-aetiological
      basis: "The text is set in Cutha and frames itself as Nergal's teaching to future kings; embedded in the cult of Cutha."
      source: "westenholz-1997"
  cross_cultural_parallels:
    - other_culture: "Hebrew Bible"
      parallel: "Penitential royal narratives (David's repentance, Manasseh's repentance) share the structure of king-suffers-and-learns-wisdom; the didactic frame for future kings is shared."
      source: "westenholz-1997 (commentary)"
    - other_culture: "Egyptian"
      parallel: "Königsnovelle: pseudo-autobiographical-royal genre is paralleled in Egyptian royal-legend tradition."
      source: "westenholz-1997"
    - other_culture: "Akkadian (internal)"
      parallel: "Pairs with Birth Legend of Sargon and the rest of the Sargonic-Naramsinid cycle; the Cuthaean Legend is the fully-developed naru text, where the Sargon legend is more straightforwardly biographical."
      source: "westenholz-1997"

comparative_hooks:
