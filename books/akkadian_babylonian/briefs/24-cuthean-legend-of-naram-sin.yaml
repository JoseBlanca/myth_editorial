special_instructions: |
  Co-equal recensions, central composition (4000–6000 words). Present OB and SB recensions side by side, with explicit dialect flagging. Westenholz 1997 publishes the parallel recensions; Foster 2005 is the working English. The naru genre framing is essential — open the chapter by introducing the genre, since this is its foundational text. The closing injunction (consult oracles before war) is the legend's stated didactic purpose; preserve it as the chapter's pivot. The setting in Cutha (cult center of Nergal) anchors the legend in cult and explains the title. The monstrous invaders' descriptions vary across recensions; preserve the recensional differences. Mark all reconstructions with `[RECONSTRUCTION:]` markers naming donor recension/dialect. Distinguish from the other Narām-Sîn legends (chapters 21, 22, 23, 25).
