    source: cagni-1969
    why_prevalent: "Single first-millennium recension preserved across multiple manuscripts that agree closely; the colophon of one manuscript names Kabti-ilāni-Marduk as the composer, citing divine inspiration. Cagni 1969 is the standard."
  alternates:
    - source: cagni-1969
      difference: "Manuscripts vary in the order of the Sebitti list (Erra's seven demonic agents) in Tablet I; Cagni 1969 records the variants."
