special_instructions: |
  Major composition (8000–10000 words). Five-tablet structure; treat each tablet sequentially with prose-fluent retelling. Cagni 1969 is the philological base (Italian); Foster 2005 is the working English translation; Dalley 2008 is the second English. The colophon names Kabti-ilāni-Marduk as composer with the unusual claim of divine dream-inspiration — preserve this self-attribution; it is one of the few cases of a named author in Akkadian literature. The amulet-function is structurally important: the closing lines instruct the reader to copy and wear the text. Foreground Marduk's cleansing-absence as the trigger for Erra's rampage; this is theology disguised as plot. Cagni's English edition (1977 SANE 1/3) is a useful translation cross-check. Distinguish carefully from the OB Erra and Narām-Sîn (chapter 23, royal legend cycle).
