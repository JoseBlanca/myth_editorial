cultural_relevance:
  centrality: central
  centrality_evidence:
    - kind: attestation-volume
      detail: "Multiple first-millennium manuscripts from Babylon, Aššur, Nineveh, Sultantepe, and other centers; manuscripts often serve as amulets."
      source: "cagni-1969; foster-2005, p. 880"
    - kind: ritual-context
      detail: "The poem itself functioned as a protective amulet — copies were buried under foundations and worn as pendants. The poem's own closing lines invoke its talismanic power."
      source: "foster-2005, pp. 909–911 (closing colophon-like lines)"
    - kind: scholarly-attention
      detail: "Major composition; one of the most-studied first-millennium Akkadian texts."
      source: "foster-2007, pp. 39–43"
    - kind: royal-inscription
      detail: "Echoed in Neo-Babylonian and Neo-Assyrian royal contexts as a meditation on divine wrath and restoration."
      source: "foster-2007, pp. 39–43"
  function:
    - role: theogonic
      basis: "Articulates the relationship between Erra (violence), Išum (restraint), and Marduk (kingship); the poem is theological as much as narrative."
      source: "cagni-1969 (commentary)"
    - role: ritual-aetiological
      basis: "Poem-as-amulet: the text itself protects against plague and disorder. The closing lines explicitly invoke this function."
      source: "foster-2005, pp. 909–911"
    - role: literary
      basis: "Extended dialogue between Erra and Išum, with passages of considerable rhetorical power; one of the high points of Akkadian poetry."
      source: "foster-2007, pp. 39–43"
    - role: didactic
      basis: "Meditation on the costs of violence, the failure of restraint, and the eventual restoration of order — a pessimistic-yet-redemptive theological poem."
      source: "bottero-2001, passim"
  cross_cultural_parallels:
    - other_culture: "Hebrew Bible"
      parallel: "Prophetic literature on divine wrath and restoration (Isaiah, Jeremiah, Ezekiel) shares the rhetorical mode of cosmic punishment narrated as theological warning."
      source: "foster-2007, pp. 39–43"
    - other_culture: "Greek"
      parallel: "Ares vs. Athena dynamic in the Iliad — violence and restraint personified — has structural similarity to Erra/Išum, though no genetic link."
      source: "foster-2007"
    - other_culture: "Akkadian (internal)"
      parallel: "Erra and Išum is structurally distinct from the OB Erra and Narām-Sîn (chapter 23); the latter pairs Erra with a king, the former with the god Išum. Both are part of the Erra dossier."
      source: "westenholz-1997"

comparative_hooks:
  - other_culture: "Hebrew Bible (prophetic)"
    parallel: "Divine-wrath-and-restoration rhetorical mode; specific motifs of cosmic plague, destruction of cities, eventual divine relenting."
    source: "foster-2007"
  - other_culture: "Akkadian (internal)"
    parallel: "Erra and Narām-Sîn (chapter 23) — the OB legend pairing Erra with a king is a different composition; Erra and Išum is a freestanding theological poem."
    source: "westenholz-1997"
  - other_culture: "Mesopotamian apotropaic tradition"
    parallel: "Poem-as-amulet: the text functions as a protective object. Other Akkadian compositions (incantation series) share this magical-protective function but few are explicitly framed as amulet from within the text itself."
    source: "foster-2005"

