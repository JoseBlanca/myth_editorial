special_instructions: |
  Medium-length composition (4000–6000 words). Single-prevalent classification (single MA recension on composite manuscript tradition). Audit finding A12 noted that VAT identifiers (VAT 9820, VAT 9596 + 12960, VAT 10358) need verification against CDLI before chapter-claims; flag this in the source-pinning communication. The historical context is essential: this is a near-contemporary royal-legitimation document, composed shortly after Tukulti-Ninurta I's actual campaign against Kashtiliash IV (ca. 1230 BCE). Distinguish carefully from the older legendary tradition — this is royal EPIC, not royal LEGEND. The Marduk-abandonment-of-Babylon theme is the theological pivot; preserve it as the cosmic-political reframing of historical event. The carrying-off of Marduk's statue is the ritual climax. Foster 2005 is the working English; Machinist 1978 the philological base. Note the SEAL Sources of Early Akkadian Literature project (https://seal.huji.ac.il/node/1592) for additional manuscript metadata. The chapter is the closing piece of the royal-legend cycle in the book — provide a brief summative reflection.
