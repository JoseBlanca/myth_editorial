cultural_relevance:
  centrality: significant
  centrality_evidence:
    - kind: attestation-volume
      detail: "Composite manuscript tradition (VAT 9820, VAT 9596 + 12960, VAT 10358); near-contemporary with the events it describes (composed shortly after Tukulti-Ninurta I's reign, ca. 1230 BCE)."
      source: "machinist-1978; foster-2005, p. 298"
    - kind: scholarly-attention
      detail: "Major composition; Machinist 1978 is foundational for studies of Middle Assyrian literature and royal-ideology."
      source: "machinist-1978; foster-2007"
    - kind: royal-inscription
      detail: "Near-contemporary Middle Assyrian royal-legitimation document; bridges literary-epic and royal-inscription genres. The historical kernel (the campaign against Kashtiliash IV) is firmly attested."
      source: "machinist-1978; oracc/RINAP"
  function:
    - role: royal-legitimation
      basis: "Frames Tukulti-Ninurta I's campaign against Kashtiliash IV as divinely-sanctioned; Marduk himself abandons Babylon for Aššur's sake. The epic is a contemporary propaganda document."
      source: "machinist-1978 (commentary)"
    - role: literary
      basis: "Middle Assyrian literary epic — a rare instance of contemporary royal events narrated in epic form."
      source: "noegel-2005"
    - role: didactic
      basis: "Teaches royal piety and divine reciprocity: the king's faithful service brings divine reward (Marduk's transfer to Aššur)."
      source: "machinist-1978 (commentary)"
    - role: ritual-aetiological
      basis: "The carrying-off of Marduk's statue is the ritual climax; the epic frames the historical event as cosmic transfer of divine favor."
      source: "machinist-1978"
  cross_cultural_parallels:
    - other_culture: "Hebrew Bible"
      parallel: "Davidic and Solomonic narratives — divinely-sanctioned royal warfare framed in literary form. The carrying-off of cult images and Yahweh-as-warrior themes have structural parallels."
      source: "foster-2007"
    - other_culture: "Egyptian"
      parallel: "Königsnovelle — Egyptian royal-legend genre; Tukulti-Ninurta Epic shares the king-as-divine-instrument framing."
      source: "machinist-1978 (commentary)"
    - other_culture: "Akkadian (internal)"
      parallel: "Distinct from the older Akkadian royal-legend cycle (Sargon and Narām-Sîn legends, chapters 19–25) — Tukulti-Ninurta is a CONTEMPORARY epic about a recent king, not a pseudo-historical legend cycle. The genre boundary matters."
      source: "machinist-1978"

comparative_hooks:
  - other_culture: "Akkadian (internal — royal epic vs. royal legend)"
    parallel: "The Tukulti-Ninurta Epic differs from the Sargon-Naramsinid legend cycle: it is contemporary with its events, not legendary. Genre boundary distinguishes royal epic (Tukulti-Ninurta) from pseudo-historical royal legend (Sargon/Narām-Sîn cycle)."
    source: "machinist-1978"
  - other_culture: "Hebrew Bible"
    parallel: "Davidic narratives (1–2 Samuel) — divine-warrior framing of contemporary royal events; carrying-off of cult images parallels."
    source: "foster-2007"
  - other_culture: "Egyptian Königsnovelle"
    parallel: "King-as-divine-instrument narrative form; the Königsnovelle structural parallel."
    source: "machinist-1978"
  - other_culture: "Akkadian (internal — Marduk theology)"
    parallel: "The framing of Marduk's abandonment of Babylon is reused in the Erra and Išum epic (chapter 16) and in later Marduk-prophecy texts. The Tukulti-Ninurta Epic is one of the earliest deployments of the divine-abandonment theme."
    source: "machinist-1978"

