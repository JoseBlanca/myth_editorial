terms:
  # ── Deities ──────────────────────────────────────────────────────────

  - native: "Marduk"
    renderings_considered:
      - { form: "Marduk", source: "universal in Akkadian scholarship" }
    chosen: "Marduk"
    rationale: "No variation in scholarship."
    first_mention_gloss: "head of the Babylonian pantheon, son of Ea and Damkina, slayer of Tiamat in *Enūma Eliš*"
    never_use: []

  - native: "Tiamat"
    renderings_considered:
      - { form: "Tiamat", source: "universal" }
      - { form: "Tiāmat", source: "with macron, philological" }
    chosen: "Tiamat"
    rationale: "Universal anglicized form; the macron is rarely written in scholarly prose since the long vowel is conventional."
    first_mention_gloss: "primordial salt-water mother, defeated by Marduk in *Enūma Eliš* and split to form heaven and earth"
    never_use: []

  - native: "Apsû"
    renderings_considered:
      - { form: "Apsu", source: "anglicized in popular and scholarly use" }
      - { form: "Apsû", source: "with circumflex (Akkadian transliteration; Lambert 2013)" }
      - { form: "abzu", source: "Sumerian form (out of scope as locked rendering)" }
    chosen: "Apsû"
    rationale: "Per scope.md's Assyriological-standard policy. The Sumerian *abzu* is reserved for explicit Sumerian-tradition references in the influences chapter, and is also retained as part of the conventional Sumerian temple name *E-abzu* (Ea's temple at Eridu), which is universally cited by that form in scholarly literature regardless of whether the surrounding text is Akkadian. Updated 2026-05-07 to document the E-abzu carve-out per prose-factcheck."
    first_mention_gloss: "the *Apsû* — the cosmic freshwater deep beneath the earth, dwelling of Ea; in *Enūma Eliš* also a primordial god"
    never_use: ["abzu (as a freestanding term in body prose; permitted in the Sumerian temple name *E-abzu* and in explicit Sumerian-tradition citations)"]

  - native: "Ea"
    renderings_considered:
      - { form: "Ea", source: "universal Akkadian form (Foster 2005, Dalley 2008, Lambert 2013)" }
      - { form: "Enki", source: "Sumerian equivalent — out of scope as locked rendering" }
    chosen: "Ea"
    rationale: "This is an Akkadian-language book; Ea is the Akkadian form. Sumerian *Enki* belongs to the companion *Myths of Sumer* volume."
    first_mention_gloss: "god of wisdom, the freshwater *Apsû*, and incantation, patron of craft and cunning, father of Marduk"
    never_use: ["Enki"]

  - native: "Anu"
    renderings_considered:
      - { form: "Anu", source: "universal Akkadian form" }
      - { form: "An", source: "Sumerian equivalent — out of scope" }
    chosen: "Anu"
    rationale: "Akkadian form for an Akkadian book. Sumerian *An* belongs to the companion volume."
    first_mention_gloss: "sky god, formal head of the divine hierarchy, father of the Anunnaki"
    never_use: ["An"]

  - native: "Enlil"
    renderings_considered:
      - { form: "Enlil", source: "universal in both Sumerian and Akkadian" }
      - { form: "Ellil", source: "variant Akkadian transliteration" }
    chosen: "Enlil"
    rationale: "Universal form; the *Ellil* variant appears occasionally in late Akkadian scholarship but is non-standard."
    first_mention_gloss: "storm and command-god of Nippur, second-ranking god of the cosmos, who decrees fates"
    never_use: []

  - native: "Ištar"
    renderings_considered:
      - { form: "Ishtar", source: "anglicized (popular and Foster 2005 prose)" }
      - { form: "Ištar", source: "Assyriological standard (Lambert 2013, George 2003, Dalley 2008)" }
      - { form: "Inanna", source: "Sumerian equivalent — out of scope" }
    chosen: "Ištar"
    rationale: "Per scope.md's Assyriological-standard policy. Sumerian *Inanna* belongs to the companion volume and is permitted only when citing Sumerian compositions by their Sumerian title (e.g., 'the Sumerian *Inanna's Descent*') or in explicit comparative contexts naming the Sumerian goddess as such — never as a name for the Akkadian goddess in body prose. Updated 2026-05-07 in parallel with the Gilgameš/Bilgames carve-out per prose-factcheck finding F-8."
    first_mention_gloss: "goddess of love, war, and the planet Venus; queen of heaven, sister of Ereškigal"
    never_use: ["Inanna (as a name for the Akkadian goddess; permitted only when citing Sumerian compositions or in explicit Sumerian-tradition contexts)"]

  - native: "Ereškigal"
    renderings_considered:
      - { form: "Ereshkigal", source: "anglicized (Foster 2005 prose)" }
      - { form: "Ereškigal", source: "Assyriological standard" }
    chosen: "Ereškigal"
    rationale: "Per scope.md's diacritic policy."
    first_mention_gloss: "queen of the netherworld, elder sister of Ištar"
    never_use: []

  - native: "Nergal"
    renderings_considered:
      - { form: "Nergal", source: "universal" }
    chosen: "Nergal"
    rationale: "No variation."
    first_mention_gloss: "god of war, plague, and the netherworld; consort of Ereškigal; identified with Erra in some contexts"
    never_use: []

  - native: "Ninurta"
    renderings_considered:
      - { form: "Ninurta", source: "Standard Babylonian *Anzû*; universal in 1st-millennium scholarship" }
      - { form: "Ningirsu", source: "Old Babylonian *Anzû* hero; the same warrior-god under his Lagash name" }
    chosen: "Ninurta"
    rationale: "Standard form for the SB recension and for 1st-millennium Akkadian literature generally. *Ningirsu* is permitted in any passage discussing the OB *Anzû* recension's hero — primarily chapter 15 (where the recensional difference is the central interpretive issue), but also in any other chapter (e.g., the introduction, the comparative chapter, the influences chapter) that names the OB hero in service of explaining the OB→SB substitution. Updated 2026-05-07 per prose-factcheck finding F-2."
    first_mention_gloss: "warrior-son of Enlil, slayer of Anzû, champion of the gods"
    never_use: []

  - native: "Anzû"
    renderings_considered:
      - { form: "Anzu", source: "anglicized" }
      - { form: "Anzû", source: "Akkadian transliteration (Annus 2001, Vogelzang 1988)" }
      - { form: "Anzud", source: "Sumerian form — out of scope" }
    chosen: "Anzû"
    rationale: "Per scope.md's diacritic policy. Sumerian *Anzud* belongs to the companion volume."
    first_mention_gloss: "the divine lion-headed eagle, thief of the Tablet of Destinies"
    never_use: ["Anzud"]

  - native: "Erra"
    renderings_considered:
      - { form: "Erra", source: "universal (Cagni 1969, Foster 2005)" }
      - { form: "Irra", source: "older transliteration; superseded" }
    chosen: "Erra"
    rationale: "Universal modern form."
    first_mention_gloss: "god of plague and violence, sometimes identified with Nergal; protagonist of the *Erra and Išum* poem"
    never_use: ["Irra"]

  - native: "Išum"
    renderings_considered:
      - { form: "Ishum", source: "anglicized (Foster 2005 prose)" }
      - { form: "Išum", source: "Assyriological standard (Cagni 1969)" }
    chosen: "Išum"
    rationale: "Per scope.md's diacritic policy."
    first_mention_gloss: "vizier of Erra and herald of the gods; the calming counterweight to Erra's rage"
    never_use: []

  - native: "Sîn"
    renderings_considered:
      - { form: "Sin", source: "anglicized" }
      - { form: "Sîn", source: "Akkadian transliteration with circumflex on contracted long vowel (Sîn < Suʾen)" }
      - { form: "Suen", source: "early-Akkadian and Sumerian-derived form" }
      - { form: "Nanna", source: "Sumerian equivalent — out of scope" }
    chosen: "Sîn"
    rationale: "Per scope.md's diacritic policy. *Nanna(-Suen)* belongs to the companion volume."
    first_mention_gloss: "moon god, patron of Ur and Ḫarrān, decree-giver among the high gods"
    never_use: ["Nanna", "Nanna-Suen"]

  - native: "Šamaš"
    renderings_considered:
      - { form: "Shamash", source: "anglicized (Foster 2005 prose)" }
      - { form: "Šamaš", source: "Assyriological standard" }
      - { form: "Utu", source: "Sumerian equivalent — out of scope" }
    chosen: "Šamaš"
    rationale: "Per scope.md's diacritic policy. Sumerian *Utu* belongs to the companion volume."
    first_mention_gloss: "sun god, lord of justice and the divine oracle, judge of disputes among gods and humans"
    never_use: ["Utu"]

  - native: "Adad"
    renderings_considered:
      - { form: "Adad", source: "universal Akkadian form" }
      - { form: "Iškur", source: "Sumerian equivalent — out of scope" }
    chosen: "Adad"
    rationale: "Akkadian form for an Akkadian book."
    first_mention_gloss: "storm god, lord of thunder and the rains that bring or break the harvest"
    never_use: ["Iškur"]

  - native: "Damkina"
    renderings_considered:
      - { form: "Damkina", source: "Akkadian form (Lambert 2013)" }
      - { form: "Damgalnuna", source: "Sumerian equivalent — out of scope" }
    chosen: "Damkina"
    rationale: "Akkadian form for an Akkadian book."
    first_mention_gloss: "consort of Ea, mother of Marduk"
    never_use: ["Damgalnuna"]

  - native: "Mami"
    renderings_considered:
      - { form: "Mami", source: "*Atra-ḫasīs* I (Lambert & Millard 1969)" }
      - { form: "Bēlet-ilī", source: "epithet 'Lady of the gods' used interchangeably in *Atra-ḫasīs*" }
      - { form: "Nintu", source: "Sumero-Akkadian birth-goddess epithet" }
    chosen: "Mami"
    rationale: "*Atra-ḫasīs* uses *Mami* as the goddess's primary name in the creation-of-humans episode. *Bēlet-ilī* is noted as an interchangeable epithet on first mention."
    first_mention_gloss: "the mother goddess (also *Bēlet-ilī*, 'Lady of the gods'), who creates humanity in *Atra-ḫasīs*"
    never_use: []

  - native: "Dumuzi"
    renderings_considered:
      - { form: "Dumuzi", source: "Akkadian form (Foster 2005, Dalley 2008 in OB and MB contexts)" }
      - { form: "Tammuz", source: "later Aramaic-biblical form, used in some 1st-millennium translations" }
      - { form: "Dumuzid", source: "Sumerian form — out of scope" }
    chosen: "Dumuzi"
    rationale: "Standard Akkadian form. *Tammuz* is the later Aramaic-biblical reflex; using it imports out-of-period usage. *Dumuzid* is the Sumerian form."
    first_mention_gloss: "shepherd-god, consort of Ištar; the dying god whose descent and substitution structure the *Descent of Ishtar*"
    never_use: ["Dumuzid"]

  # ── Heroes and named figures ─────────────────────────────────────────

  - native: "Gilgameš"
    renderings_considered:
      - { form: "Gilgamesh", source: "anglicized (universally recognized)" }
      - { form: "Gilgameš", source: "Assyriological standard (George 2003)" }
      - { form: "Bilgames", source: "Sumerian form — out of scope" }
    chosen: "Gilgameš"
    rationale: "Per scope.md's diacritic policy. *Bilgames* is the Sumerian form and is permitted only when citing Sumerian compositions by their Sumerian title (e.g., 'the Sumerian Bilgames poems') or in explicit comparative contexts that name the Sumerian hero as such — never as a name for the Akkadian hero. Updated 2026-05-07 per prose-factcheck finding F-8."
    first_mention_gloss: "king of Uruk, two-thirds divine, hero of the Standard Babylonian epic"
    never_use: ["Bilgames (as a name for the Akkadian hero; permitted only when citing Sumerian compositions)"]

  - native: "Enkidu"
    renderings_considered:
      - { form: "Enkidu", source: "universal" }
    chosen: "Enkidu"
    rationale: "No variation."
    first_mention_gloss: "wild man fashioned by the gods, companion of Gilgameš, whose death precipitates the search for immortality"
    never_use: []

  - native: "Atra-ḫasīs"
    renderings_considered:
      - { form: "Atrahasis", source: "anglicized" }
      - { form: "Atra-ḫasīs", source: "Assyriological standard (Lambert & Millard 1969)" }
    chosen: "Atra-ḫasīs"
    rationale: "Per scope.md's diacritic policy."
    first_mention_gloss: "'the exceedingly wise' — antediluvian sage who survives the flood by Ea's warning, hero of the *Atra-ḫasīs* epic"
    never_use: []

  - native: "Adapa"
    renderings_considered:
      - { form: "Adapa", source: "universal" }
    chosen: "Adapa"
    rationale: "No variation."
    first_mention_gloss: "antediluvian sage and priest of Ea at Eridu, the *apkallu* who refused immortality"
    never_use: []

  - native: "Uta-napišti"
    renderings_considered:
      - { form: "Uta-napishti", source: "anglicized (Foster 2005)" }
      - { form: "Uta-napišti", source: "Assyriological standard (George 2003)" }
      - { form: "Utnapishtim", source: "older anglicization" }
    chosen: "Uta-napišti"
    rationale: "Per scope.md's diacritic policy. The Akkadian counterpart of *Atra-ḫasīs* in *Gilgameš* XI."
    first_mention_gloss: "'he found life' — the flood-survivor whom Gilgameš seeks out for the secret of immortality, the Akkadian counterpart of *Atra-ḫasīs*"
    never_use: ["Utnapishtim"]

  - native: "Sargon"
    renderings_considered:
      - { form: "Sargon", source: "biblical-derived anglicization (universal)" }
      - { form: "Šarru-kīn", source: "Akkadian transliteration ('the king is true')" }
    chosen: "Sargon"
    rationale: "Universal in scholarship; *Šarru-kīn* noted on first mention as the Akkadian form."
    first_mention_gloss: "Šarru-kīn ('the king is true') — founder of the Akkadian empire (ca. 2334 BCE), protagonist of the *Birth Legend* and *šar tamḫāri*"
    never_use: []

  - native: "Narām-Sîn"
    renderings_considered:
      - { form: "Naram-Sin", source: "anglicized" }
      - { form: "Narām-Sîn", source: "Assyriological standard with macrons (Westenholz 1997)" }
    chosen: "Narām-Sîn"
    rationale: "Per scope.md's diacritic policy."
    first_mention_gloss: "'beloved of Sîn' — grandson of Sargon, fourth king of Akkad (ca. 2254–2218 BCE), protagonist of the *Cuthaean Legend*, *Great Revolt*, and *Erra and Narām-Sîn*"
    never_use: []

  - native: "Ḫumbaba"
    renderings_considered:
      - { form: "Humbaba", source: "anglicized (Foster 2005 prose)" }
      - { form: "Ḫumbaba", source: "Assyriological standard (George 2003)" }
      - { form: "Huwawa", source: "Sumerian form — out of scope" }
    chosen: "Ḫumbaba"
    rationale: "Per scope.md's diacritic policy. *Huwawa* is the Sumerian form."
    first_mention_gloss: "guardian of the Cedar Forest appointed by Enlil, defeated by Gilgameš and Enkidu in *Gilgameš* IV–V"
    never_use: ["Huwawa"]

  # ── Places ───────────────────────────────────────────────────────────

  - native: "Babylon"
    renderings_considered:
      - { form: "Babylon", source: "universal English" }
      - { form: "Bābili", source: "Akkadian transliteration" }
    chosen: "Babylon"
    rationale: "Universal English form. *Bābili* noted on first mention as the Akkadian form."
    first_mention_gloss: "Bābili — the Akkadian-speaking metropolis of southern Mesopotamia, seat of Marduk's temple Esagila and the cosmic centre of the Akkadian literary world"
    never_use: []

  - native: "Aššur"
    renderings_considered:
      - { form: "Ashur", source: "anglicized (popular)" }
      - { form: "Assur", source: "anglicized (older scholarship)" }
      - { form: "Aššur", source: "Assyriological standard" }
    chosen: "Aššur"
    rationale: "Per scope.md's diacritic policy. Used both for the city and for the chief Assyrian god, who shares the name."
    first_mention_gloss: "the city on the Tigris that gave its name to the Assyrian kingdom, and the head god of the Assyrian pantheon who shares the name"
    never_use: ["Ashur"]

  - native: "Nineveh"
    renderings_considered:
      - { form: "Nineveh", source: "universal English" }
      - { form: "Ninua", source: "Akkadian/Hurrian transliteration" }
    chosen: "Nineveh"
    rationale: "Universal English form."
    first_mention_gloss: "the late Neo-Assyrian capital, where Aššurbanipal's library preserved most of what we now have of Akkadian literature"
    never_use: []

  - native: "Akkad"
    renderings_considered:
      - { form: "Akkad", source: "anglicized (universal)" }
      - { form: "Agade", source: "the city's own name in cuneiform" }
    chosen: "Akkad"
    rationale: "Universal English form for the kingdom and the city. *Agade* used only when explicitly transliterating cuneiform."
    first_mention_gloss: "Agade — the lost capital city of Sargon's empire, and the name of the kingdom that gave Akkadian its name"
    never_use: []

  - native: "Eridu"
    renderings_considered:
      - { form: "Eridu", source: "universal" }
    chosen: "Eridu"
    rationale: "No variation."
    first_mention_gloss: "the southernmost city of Mesopotamia, traditionally the first city of the world; seat of Ea's temple the E-abzu and home of Adapa"
    never_use: []

  - native: "Uruk"
    renderings_considered:
      - { form: "Uruk", source: "Akkadian form (universal in Akkadian-language scholarship)" }
      - { form: "Unug", source: "Sumerian form — out of scope" }
    chosen: "Uruk"
    rationale: "Akkadian form for an Akkadian book."
    first_mention_gloss: "the walled city of Gilgameš in the southern Mesopotamian alluvium, seat of Ištar's temple the E-ana"
    never_use: ["Unug"]

  - native: "Cutha"
    renderings_considered:
      - { form: "Cutha", source: "Latinized (universal in scholarly use)" }
      - { form: "Kutha", source: "transliteration closer to the Akkadian *Kutê*" }
    chosen: "Cutha"
    rationale: "Universal in scholarly prose; *Kutha* noted parenthetically on first mention."
    first_mention_gloss: "Kutha — the northern Babylonian city of Nergal, the setting of the *Cuthaean Legend of Narām-Sîn*"
    never_use: []

  # ── Technical, ritual, and genre terms ───────────────────────────────

  - native: "akītu"
    renderings_considered:
      - { form: "Akitu festival", source: "anglicized" }
      - { form: "akītu festival", source: "Assyriological standard" }
      - { form: "New Year festival", source: "translated" }
    chosen: "*akītu*"
    rationale: "Italicized Akkadian term, always paired with 'festival' or glossed at first mention. Captures both the ritual occasion and the cosmic-order theology that *Enūma Eliš* underwrites."
    first_mention_gloss: "the *akītu* festival — the spring New Year ritual at Babylon during which *Enūma Eliš* was recited, re-enacting Marduk's victory over Tiamat and re-installing cosmic order for the coming year"
    never_use: []

  - native: "Tablet of Destinies"
    renderings_considered:
      - { form: "Tablet of Destinies", source: "universal English" }
      - { form: "Tablet of Fates", source: "less common variant" }
      - { form: "ṭuppi šīmāti", source: "Akkadian transliteration" }
    chosen: "Tablet of Destinies"
    rationale: "Universal English; Akkadian *ṭuppi šīmāti* noted on first mention."
    first_mention_gloss: "the Tablet of Destinies (*ṭuppi šīmāti*) — the cosmic decree-tablet that confers supreme authority on whoever holds it; central artifact in *Enūma Eliš* and *Anzû*"
    never_use: []

  - native: "naru"
    renderings_considered:
      - { form: "*narû* literature", source: "Assyriological standard with circumflex" }
      - { form: "naru literature", source: "anglicized" }
      - { form: "pseudo-autobiography", source: "translated genre label" }
    chosen: "*narû*"
    rationale: "Italicized Akkadian genre term, always paired with 'genre', 'text', or 'literature'."
    first_mention_gloss: "the *narû* genre — pseudo-autobiographical royal literature in which a king (most often Sargon or Narām-Sîn) addresses a future ruler from the inscribed monument that bears his words"
    never_use: []

  - native: "apkallu"
    renderings_considered:
      - { form: "*apkallu*", source: "Assyriological standard, italicized" }
      - { form: "antediluvian sage", source: "translated" }
      - { form: "Seven Sages", source: "collective" }
    chosen: "*apkallu*"
    rationale: "Italicized Akkadian term; the canonical seven (the *apkallū*) is the relevant referent."
    first_mention_gloss: "the *apkallū* — the seven antediluvian sages who brought civilization to humanity; Adapa is the first of them"
    never_use: []

  - native: "Sebitti"
    renderings_considered:
      - { form: "Sebitti", source: "Assyriological standard" }
      - { form: "Sibitti", source: "variant transliteration" }
      - { form: "the Seven", source: "translated" }
    chosen: "Sebitti"
    rationale: "Standard form (Cagni 1969). The Akkadian word means 'the Seven'; the proper-noun form refers to Erra's specific war-band of demonic warriors."
    first_mention_gloss: "the Sebitti — Erra's seven demonic warriors, the war-band whose voices rouse him to attack Babylon in *Erra and Išum*"
    never_use: []

  - native: "iškaru"
    renderings_considered:
      - { form: "*iškaru*", source: "Assyriological standard" }
      - { form: "canonical series", source: "translated" }
      - { form: "literary series", source: "popular" }
    chosen: "*iškaru*"
    rationale: "Italicized Akkadian term, paired with 'series' or 'canonical series' on first mention."
    first_mention_gloss: "the *iškaru* — a canonical multi-tablet literary series, transmitted as a single composition in scribal training; e.g., *iškar šēlebi*, the *Series of the Fox*"
    never_use: []

  - native: "ṭupšarru"
    renderings_considered:
      - { form: "*ṭupšarru*", source: "Assyriological standard" }
      - { form: "scribe", source: "translated" }
      - { form: "*tupsharrūtu*", source: "abstract noun, 'scribal art'" }
    chosen: "scribe"
    rationale: "Translated for readability. The Akkadian term *ṭupšarru* and the abstract noun *ṭupšarrūtu* (scribal art) are noted on first mention where the technical sense matters."
    first_mention_gloss: "the scribe (*ṭupšarru*) — the cuneiform-trained literate professional who copied and transmitted the texts of this book; the scribal craft as a whole was called *ṭupšarrūtu*"
    never_use: []
