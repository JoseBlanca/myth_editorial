    "<basis>": 0
    "<risk>": 0
    "<reconstruction>": 0
    "<what>": 0
    "<gap_source>": 0
  no_empty_slot_artefacts:
    empty_paren_dot_bracket: 0
    empty_inference_paren: 0
  no_double_period_artefacts:
    "..]_": 0
    "..footnote:": 0
  bibliography_resolution:
    unresolved_evidence_ids: 0
    bibliography_entries_off_whitelist: 0
  cross_references:
    character_appendix_to_chapter_anchors: "all 41 used <<ch-NN-slug>> xrefs resolve"
  cover_image:
    file: "cover/cover.jpg"
    referenced_in_master: ":front-cover-image: image:cover/cover.jpg[]"
    exists: true
  output_files:
    pdf_exists: true
    pdf_non_empty: true
    epub_exists: true
    epub_non_empty: true
  no_legacy_book_files: true
  asciidoctor_clean_exit:
    pdf: 0
    epub: 0

handoff: "Book complete. Ready for stage 19 translate-spanish (deferred per scope-lock)."

summary: "Format-finalize stage complete. Bibliography (65 BibTeX entries) extracted from 3811 EVIDENCE tokens with zero unresolved IDs. Production markers stripped. Pipeline meta-commentary cleaned from 11 chapters. Five render-blocker content issues fixed (one INCLUSION-MARGINAL leak, one list-index J. escape, five inner-italic conversions, four constrained-strong-plural fixes). Master adoc assembled and rendered to PDF (19.5MB) and EPUB (1.69MB) with zero asciidoctor warnings or errors. All EPUB anti-pattern checks pass (zero EVIDENCE, COMPARATIVE-HOOK, empty-paren, or _(.footnote artefacts in xhtml)."
