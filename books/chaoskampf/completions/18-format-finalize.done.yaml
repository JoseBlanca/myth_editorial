bibliography_extraction:
  unique_source_ids_in_evidence_tokens: 65
  registry_entries: 65
  unresolved_ids: 0
  unused_in_evidence_tokens: 0
  triangulation_databases_excluded: 8
  notes: |
    All 65 in-scope registry entries are cited via EVIDENCE tokens in at
    least one chapter. The 8 triangulation_databases entries (cdli,
    ctr-ugaritic, kotenbunko, oracc, perseus, titus, worldcat, etc.) are
    deliberately excluded since they are reference databases, not citation
    sources.

marker_strip_pre_assembly:
  evidence_tokens_dropped: 3811
  comparative_hook_tokens_dropped: 421
  whole_line_drops: 4232
  mid_line_strips: 0
  notes: |
    Per the skill's step 2 (marker strip): all production markers
    `// EVIDENCE:` and `// COMPARATIVE-HOOK:` were stripped from the
    `chapters/*.edited.adoc` files. The `.resolved.adoc` and
    `.grammar-checked.adoc` files preserve the markers as the audit trail.

content_fix_pre_render:
  pipeline_meta_prose_cleanup:
    files_affected: 11
    paragraph_deletions: 9
    sentence_rewordings: 11
    rationale: |
      20 prose references to "EVIDENCE token" or "COMPARATIVE-HOOK"
      had leaked into final chapters as pipeline meta-commentary. The
      render helper greps the EPUB for these bare strings and would
      have failed. Pipeline-discipline paragraphs (whole-paragraph
      meta-commentary about citation routing) were deleted; legitimate
      scholarly paragraphs containing the words had the words rewritten
      ("EVIDENCE token" → "primary citation" / "load-bearing claim";
      "// COMPARATIVE-HOOK" → "structural-comparative cross-reference").
  asciidoctor_render_blockers:
    inclusion_marginal_block_removed: 1
    list_index_J_dot_escaped: 1
    inner_italic_unconstrained_conversions: 5
    constrained_strong_with_plural_suffix_fixes: 4
    notes: |
      Initial PDF render produced 5 ERRORs (failed to parse formatted
      text) and 1 WARNING. Root causes:
        1. ch17 line 4 had a [INCLUSION-MARGINAL: ...] paragraph block
           that should have been resolved at marker-resolve. Removed.
        2. ch19 line 102 starts with "J. R. R. Tolkien", which AsciiDoc
           parsed as a J-th list-marker item where A. was expected.
           Wrapped the J. in pass:[J.] inline pass-through.
        3. Five paragraphs had italic-paren `_(...footnote:[...].)_`
           with single-underscore italics inside the footnote, which
           breaks asciidoctor-pdf's prawn formatter (the inner italic
           closes the outer span). Converted inner `_word_` to
           unconstrained `__word__` only inside footnotes that appear
           inside italic-paren paragraphs.
        4. ch13 had four `*Yašt*s` patterns where constrained strong
           is immediately followed by a lowercase plural suffix that
           breaks the constrained-quote boundary. Converted to
           `**Yašt**s` (unconstrained).

self_checks:
  no_old_markers_remain:
    INFERENCE: 0
    LACUNA: 0
    RECONSTRUCTION: 0
    VARIANT: 0
    SPECULATION: 0
  no_evidence_or_hook_after_strip:
    EVIDENCE_in_edited_adoc: 0
    COMPARATIVE_HOOK_in_edited_adoc: 0
    EVIDENCE_in_rendered_epub_xhtml: 0
    COMPARATIVE_HOOK_in_rendered_epub_xhtml: 0
  no_placeholder_leaks:
