    severity: NOTE
    claim_number: null
    narrative_location: "L36, L40, L75, L107, L138, L155, L172, L202, L226"
    issue: |
      Nine unfootnoted prose bridges appear in the narrative: one source-
      overview-closing roadmap, six section-opener bridges (one per §I-§VI
