forbidden_words_and_glossary:
  forbidden_words_check: |
    The glossary entry for chaoskampf bans "dragon myth (too narrow)" and
    "dragon-slaying myth (misses the cosmogonic function)". Neither phrase
    appears in the narrative as a book-voice category-label; "dragon myth"
    appears only inside Ogden's book-title (*Drakōn: Dragon Myth and
    Serpent Cult in the Greek and Roman Worlds*), which is permitted as
    title-citation. The glossary entry for "the adversary" bans "chaos-
    figure" and "chaos-monster" as book-voice category-labels; "chaos-
    figure" appears at narrative L189 and L192, but in both occurrences
    the term names the rhetoric the chapter is refuting (Ballentine's
    critique-target) rather than functioning as the book's own category-
    label. Both occurrences are present in the approved claims at L191
    and L194 in identical metalinguistic frames; both are permitted in
    a §V critique-of-rhetoric register. No GLOSSARY-VIOLATION.
  glossary_renderings_check: |
    "chaoskampf" rendered consistently in lower-case as the book's term-
    of-art, with one capitalized "Chaoskampf" at narrative L19 inside
    quotation in the body-prose discussion of Gunkel's coinage (matches
    claims-approved L35 byte-identically in the footnote body). Tiamat,
    Marduk, Yahweh, Leviathan, Rahab, Lotan, Yamm rendered per
    glossary-locked diacritical conventions. *Enūma Eliš*, *purulli*,
    *tehôm* / *tehom* italicized as expected (note: claims-approved uses
    "tehom" without macron at L191; narrative L189 uses "tehôm" with
    circumflex per glossary lock — narrative is the glossary-correct
    rendering. The footnote bodies at narrative L189 and claims L191
    both render "tehom" without diacritic, byte-identically; the
    body-prose diacritical correction at narrative L189 is consistent
    with glossary v2 convention).

