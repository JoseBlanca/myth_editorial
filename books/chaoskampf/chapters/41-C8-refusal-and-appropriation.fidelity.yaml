  Belcher); the §IV INFERENCE block uses the locked basis: / risk:
  schema with substantive risk-content; the §VI SPECULATION block
  uses the locked basis: / counterargument: schema with substantive
  counter-content; the area-specialist-first discipline is observed at
  §I (5 Aboriginal-Australian-framing paragraphs at lines 45-57 BEFORE
  the chaoskampf-typological-extension critique at line 60), at §II
  (8 Anishinaabe-framing paragraphs at lines 78-99 BEFORE the
  contrastive-tier classification at line 102), and at §III (4
  Nyanga-framing paragraphs at lines 117-126 BEFORE the fuller
