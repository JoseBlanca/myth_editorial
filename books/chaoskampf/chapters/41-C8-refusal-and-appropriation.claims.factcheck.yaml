  - id: NOTE-02
    severity: NOTE
    category: structural-observation | banned-term-scoping
    claim_anchor: chapter-wide body prose ("chaos-X" compounds)
    description: |
      The chapter uses unmarked "chaos-X" compounds throughout body
      prose and footnotes (line 87 "chaos-adversary class member" /
      "pan-Aboriginal chaos-adversary"; line 109 "chaos-versus-order
      adversaries"; line 115 "chaos-adversary class member"; line
      124 "chaos-vs-order mapping" / "chaos-figure vs. cosmos-figure"
      / "ordered cosmos against an adversarial chaos"; line 215
      "chaos-vs-order encounter-framing"; line 225 "chaos-versus-
      order opposition"; line 239 "chaos-versus-order categorical
      apparatus"; line 247 "chaos-vs-order encounter-framing"; etc.).
      The glossary.yaml never_use list (line 126) bans bare "chaos-
      figure" / "chaos-monster" because they "beg the question";
      Ch40 FIND-02 flagged this as a MEDIUM finding for §IV body
      prose specifically.
    issue: |
      In Ch41, in contrast to Ch40 §IV's narrower scope, the "chaos-
      X" compounds are *pervasively* in argument-context describing
      the framing being refused: every occurrence is in a sentence
      that registers (a) the chaoskampf-typological reading the
      area-specialists refuse, or (b) the typological apparatus the
      Anishinaabe / Nyanga / Aboriginal-Australian frameworks
      explicitly decline. The compounds function as *names of the
      framing being critiqued*, not as the chapter's own
      categorical apparatus, and the chapter's argument structure
      requires them at exactly the points where they appear (the
      area-specialists' refusal of these specific framings is the
      chapter's principal substantive claim). The glossary.yaml
      banned-term scoping is properly read as banning "chaos-X"
      compounds *as the chapter's own categorical apparatus*, not
      as banning their use *as the name of the apparatus the
      chapter critiques*. The chapter's overall discipline therefore
      passes — the compounds are used as critical objects, not as
      analytical tools — and the chapter's argument structure
      makes the Ballentine-critique register pervasive in a way
      that Ch40 §IV's local scoping issue does not parallel.
      Recorded as a structural observation with no finding because
      the compounds' usage is consistent with the chapter's
      critique-register argument structure throughout.
    evidence: |
      glossary.yaml line 126 never_use: ["chaos-figure (begs the
      question); chaos-monster (same reason; the corpus is not
      uniformly 'chaos')"].
      Ch41 chapter-wide pattern: every "chaos-X" compound is
      introduced inside a clause that registers the framing as the
      one being refused or critiqued (e.g., line 124's "the apparatus
      that places the figures in adversarial pairs (chaos-figure vs.
      cosmos-figure; serpent vs. champion) and reads the encounters
      as combat-and-defeat occasions" — explicitly framing the
      apparatus as the one the Anishinaabe refusal targets).
      Ch40 FIND-02 precedent: the §IV scope-failure flag was for
      compounds that did *not* explicitly register the Ballentine-
      critique frame; Ch41's compounds consistently do so.
    recommended_fix: |
      None required. Optional: at post-human-normalize, scare-quote
      the most prominent "chaos-X" compounds in §I, §II, and §VI
      ("chaos-adversary", "chaos-vs-order", "chaos-figure vs. cosmos-
      figure") to make the critique-register attribution explicit
      at the surface level — but the underlying argument structure
      already supports the unmarked usage.

