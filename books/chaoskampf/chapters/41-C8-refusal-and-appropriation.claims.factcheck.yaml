    issue: |
      Positive structural observation: the [APPROPRIATION-FLAG:] /
      [INFERENCE:] marker-distribution choice in Ch41 is defensible
      and consistent with the brief's distinction between (a) the
      §§I-III principal area-specialist-refusal cases (where the
      area-specialist objection is registered as an
      APPROPRIATION-FLAG with the locked four sub-fields), (b) the
      §IV Lönnrot case (a "different kind of appropriation" by a
