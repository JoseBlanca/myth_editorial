findings:
  - id: FIND-01
    severity: MEDIUM
    category: citation-wrong | date-error
    claim_anchor: line 221 (§V, Mapuche supporting case — footnote citation of Foerster's volume)
    description: |
      Ch41 line 221's body-prose footnote cites Foerster's volume as
      "Foerster, R., *Introducción a la religiosidad mapuche*
      (Santiago: Editorial Universitaria, 1995)". The correct
      publication date is 1993, per (a) sources.yaml line 557 entry
      foerster-religiosidad-mapuche year: 1993; (b) the full_citation
      field at line 558: "Foerster González, R., *Introducción a la
      religiosidad mapuche* (Santiago: Editorial Universitaria,
      1993)."; (c) Ch27 claims-approved line 39's author-year "Foerster
      González 1993"; and (d) Ch27 claims-approved line 36's footnote
      "Foerster 1993, *Introducción a la religiosidad mapuche*
      (Santiago: Editorial Universitaria, 1993; ISBN 9789561109124)".
    issue: |
      Date error in body-prose footnote citation. The error is
      MEDIUM because (a) it is a verifiable bibliographic-data error
      with a clear corrective; (b) the same source is registered
      correctly at sources.yaml; (c) the corresponding EVIDENCE token
      at line 223 is correctly source_id=foerster-religiosidad-mapuche
      and routes through the correct sources.yaml entry, so the EVIDENCE
      attribution is not affected — the error is only in the body-prose
      footnote's bibliographic citation. The factual claim (the Wenu /
      Naq / Minche Mapu cosmography per Foerster) is unaffected.
    evidence: |
      sources.yaml line 552-558:
        - id: foerster-religiosidad-mapuche
          ...
          year: 1993
          full_citation: "Foerster González, R., *Introducción a la
          religiosidad mapuche* (Santiago: Editorial Universitaria,
          1993)."
      Ch27 line 36: "Foerster 1993, *Introducción a la religiosidad
        mapuche* (Santiago: Editorial Universitaria, 1993; ISBN
        9789561109124)"
      Ch41 line 221 footnote: "Foerster, R., *Introducción a la
        religiosidad mapuche* (Santiago: Editorial Universitaria,
        1995)" — date is wrong.
    recommended_fix: |
      Replace "1995" with "1993" in the line 221 footnote. Verbatim-
      substitutable replacement:
        "Foerster, R., *Introducción a la religiosidad mapuche*
        (Santiago: Editorial Universitaria, 1993), on the cosmographic-
        and-ritual framing"
      Optionally also align name-form to the Ch27 / sources.yaml
