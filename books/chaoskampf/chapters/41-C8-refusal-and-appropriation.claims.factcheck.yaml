  - id: FIND-02
    severity: MEDIUM
    category: unverified | invented-name | name-attestation-failure
    claim_anchor: line 178 (§IV, Lönnrot — list of named rune-collectors)
    description: |
      Ch41 line 178 lists "Henrik Reinhold Antell" as one of the
      19th-century rune-collectors that Lönnrot drew on, in a list
      otherwise composed of (a) Lönnrot himself, (b) "David Emmanuel
      Daniel Europaeus" (the full name of Daniel Europaeus, 1820-
      1884, a real historical rune-collector verified upstream), and
      (c) "the wider Finnish Literature Society [SKS] rune-collecting
      apparatus that Lönnrot drew on".
    issue: |
      No upstream attestation for "Henrik Reinhold Antell". Ch31
      claims-approved (the upstream anchor for the Finnic material)
      lists the rune-collectors in the line 38 introductory paragraph
      as "Elias Lönnrot, Daniel Europaeus, August Ahlqvist, Arvid
      Genetz, Julius and Kaarle Krohn, and other 19th- and early
      20th-century rune-collectors", and again at line 121 for the
      collecting-tour history; Antell appears in neither. A grep
      across the entire project source-base (sources.yaml, glossary.
      yaml, briefs/, chapters/, scope.md, toc.yaml) returns zero
      occurrences of "Antell". The name does not match any known
      19th-century Finnish folklorist or rune-collector in the
      published Finnish-folkloristics scholarly tradition that the
      auditor is aware of. The claim is UNVERIFIED — possibly
      invented, possibly conflated with another scholar's name —
      and the chapter should not assert the participation of a named
      historical figure without a sources.yaml-routed anchor or an
      upstream-chapter precedent.
    evidence: |
      Ch31 claims-approved line 38:
        "...the textual witness situation for the present chapter is
        therefore the body of 19th-century rune-collection fieldwork
        conducted across Karelia and Finland by Elias Lönnrot, Daniel
        Europaeus, August Ahlqvist, Arvid Genetz, Julius and Kaarle
        Krohn, and other 19th- and early 20th-century rune-
        collectors..."
      Ch31 claims-approved line 67 [VARIANT: ...] lists the same
      collectors explicitly as Lönnrot, Europaeus, Ahlqvist, Genetz,
      and the Krohn brothers; no Antell.
      Ch41 line 178:
        "Lönnrot himself in his collecting expeditions of the 1820s-
        1840s; David Emmanuel Daniel Europaeus; Henrik Reinhold
        Antell; and the wider Finnish Literature Society [SKS] rune-
        collecting apparatus..."
      Project-wide grep for "Antell" returns zero matches outside this
      single Ch41 occurrence.
    recommended_fix: |
      Either (a) remove "Henrik Reinhold Antell" from the list and
      replace with one or more of the rune-collectors actually
      attested in Ch31 (August Ahlqvist; Arvid Genetz; Julius Krohn;
      Kaarle Krohn) — verbatim-substitutable replacement:
        "Lönnrot himself in his collecting expeditions of the 1820s-
        1840s; David Emmanuel Daniel Europaeus; August Ahlqvist;
        Arvid Genetz; Julius and Kaarle Krohn; and the wider Finnish
        Literature Society [SKS] rune-collecting apparatus that
        Lönnrot drew on"
      OR (b) verify "Henrik Reinhold Antell" against an external
      authoritative source (Finnish biographical dictionary; SKS
      Folklore Archives' published collector-history; relevant
      Finnish-folkloristics secondary literature) and add the citation
      to the footnote if the figure is in fact a documented historical
      rune-collector. Option (a) is the conservative and recommended
      fix since the chapter's apparatus does not require the specific
      Antell attribution and the verbatim-substitutable replacement
      is fully attested by Ch31.

  - id: FIND-03
    severity: LOW
    category: paraphrase-drift | minor-narrative-detail-elaboration
    claim_anchor: line 209 (§V, Bakunawa — eclipse noise-making practice)
    description: |
      Ch41 line 209's body-prose footnote describes the Bakunawa
      eclipse-noise-making practice as "the beating of pots and
      pans, the firing of guns in later periods, the collective-
      vocal noise-making". The "firing of guns in later periods"
      element does not appear in Ch30 claims-approved's enumeration
      of the practice.
    issue: |
      Minor narrative-detail elaboration. Ch30 claims-approved line
      83 lists the practice as "beating drums, sounding gongs,
      shouting, banging metal pots and other resonant objects, and
      otherwise making sustained loud noise"; the brief 30-bakunawa.
      yaml summary lists "communal noise-making (drums, gongs,
      shouting)". Neither attests gun-firing specifically. While
      gun-firing as part of eclipse-noise practices is plausible
      historically (Spanish-and-American-colonial-period firearms
      could plausibly have been incorporated into the practice
      across the colonial centuries), the specific claim "firing of
      guns in later periods" does not have an upstream attestation
      in Ch30 or in sources.yaml-routed Eugenio 2001 evidence. This
      is a minor paraphrase-drift / inferential-elaboration finding
      registered as LOW severity because (a) the claim is plausible
      and not fabricated; (b) the load-bearing element of the
      paragraph (communal-and-recurring noise-making, no hero, no
      slaying) is fully supported; (c) the EVIDENCE token at line
      210 is correctly source_id=eugenio-philippine-myths and the
      attribution is not affected at the source-routing level.
    evidence: |
      Ch30 claims-approved line 83:
        "...the human community responds collectively by beating
        drums, sounding gongs, shouting, banging metal pots and
        other resonant objects, and otherwise making sustained loud
        noise..."
      Brief 30-bakunawa.yaml summary: "communal noise-making (drums,
        gongs, shouting)".
      Ch41 line 209 footnote:
        "...the villagers' ritual noise-making during eclipses (the
        beating of pots and pans, the firing of guns in later
        periods, the collective-vocal noise-making that interrupts
        the eclipse's progression)..."
    recommended_fix: |
      Either (a) remove "the firing of guns in later periods" from
      the line 209 footnote and align with Ch30's enumeration —
      verbatim-substitutable replacement:
        "...the villagers' ritual noise-making during eclipses (the
        beating of drums and gongs, the banging of metal pots, the
        collective shouting and vocal noise-making that interrupts
        the eclipse's progression)..."
      OR (b) retain the gun-firing element with an explicit
      citation-and-period qualifier:
        "...the firing of firearms in the colonial-period and
        20th-century elaborations of the practice attested in some
        regional recordings..."
      Option (a) is the conservative fix and preserves the
      paragraph's load-bearing communal-and-recurring framing.

  - id: FIND-04
    severity: LOW
    category: paraphrase-drift | name-form-discipline
    claim_anchor: line 221 (§V, Mapuche supporting case — Foerster name form)
    description: |
      Ch41 line 221 body prose names the Mapuche-area scholar as
      "Rolf Foerster" and the line 221 footnote names him as
      "Foerster, R.". The canonical name form per sources.yaml
