      claims-approved line 39 uses the form "Rolf Foerster González".
    issue: |
      Minor name-form discipline drift. The Spanish double-surname
      convention ("Foerster González") is the canonical form in
      Spanish-language and Anglophone scholarship for this author
      (Rolf Foerster González, b. 1952, Chilean anthropologist), and
      Ch27 / sources.yaml use the full form. Ch41's bare "Foerster"
      form is acceptable on second mention but the first-mention
      body-prose form should give the full name. LOW severity
      because (a) "Foerster" is unambiguous in the Mapuche-studies
      context and the short_citation field at sources.yaml uses
      "Foerster 1993" without the second surname; (b) the substantive
      attribution is correct.
    evidence: |
      sources.yaml line 555:
        author: "Foerster González, Rolf"
      Ch27 claims-approved line 39: "Rolf Foerster González's
        *Introducción a la religiosidad mapuche* (1993)"
      Ch41 line 221 body prose: "Rolf Foerster's *Introducción a la
        religiosidad mapuche*"
      Ch41 line 221 footnote: "Foerster, R., ..."
    recommended_fix: |
      Optional, post-human-normalize. On first body-prose mention
      use the full canonical form "Rolf Foerster González" per Ch27
      / sources.yaml convention, and on subsequent footnote citations
      use either "Foerster González, R." or accept the short form
