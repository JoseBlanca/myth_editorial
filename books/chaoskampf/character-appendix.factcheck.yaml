      1934, Watkins 1995 ch. 45). The "(two per head)" parenthetical reading of
      the six eyes is a standard Avestan-philology gloss.
    recommendation: "accept."

  - id: F019
    severity: LOW
    pass: 2
    location: "Creatures and Monsters / [[char-azi-dahaka]] (line 1552)"
    claim: |
