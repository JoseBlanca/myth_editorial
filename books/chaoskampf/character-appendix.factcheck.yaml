    verdict: "! CITATION-WRONG"
    evidence: |
      Independent verification (Wikipedia / Smarthistory / Mexicolore / Tenochtitlan-
      Fordham / atlasobscura): the Coatlicue statue is carved from ANDESITE
      (a dense volcanic rock quarried from the Basin of Mexico), NOT basalt.
      Height: 2.52 m (8.3 ft), not "approximately 2.6 metres." The footnote
      attribution to Matos Moctezuma 1988 is plausible at the level of iconographic
      content but the medium-and-height micro-claim either misreads Matos Moctezuma
      or has been written from independent recollection that doesn't match standard
      art-historical reference. Cannot reach a SUPPORTED verdict.
    recommendation: "revise as: change 'basalt sculpture approximately 2.6 metres tall' to 'andesite sculpture approximately 2.52 metres tall' (or simply 'approximately 2.5 metres tall' with the medium given as andesite)."

