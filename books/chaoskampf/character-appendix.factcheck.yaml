  - id: F010
    severity: MEDIUM
    pass: 2
    location: "Deities / [[char-marduk]] (line 691)"
    claim: |
      "_Enūma Eliš_ Tablet I describes Marduk at his birth as having four eyes and
      four ears, of surpassing physical proportions, and as radiant from birth — a
      catalogue of features marking him as outside the ordinary divine type. The
      catalogue is brief and the rest of the figure is not described."
    verdict: "△ INTERNAL-VARIANCE"
    evidence: |
      Tablet I lines 95-98 do give Marduk four eyes and four ears. Some translations
      (Dalley, Foster) also include "When he moved his lips fire blazed forth" /
      "tongue of fire" / "breathing fire" as part of the same catalogue, and
      Lambert 2013 includes mention of his "fearful" or "double" godhead and
      doubled "limbs" "ingeniously made beyond comprehension." The appendix's
      claim that "the rest of the figure is not described" understates the
      catalogue: the Tablet I birth-description does include fire-breathing /
      lips-emit-fire as a further attestation point. Editorially defensible to
      conflate or omit, but the strict "no further description" framing is
      slightly incomplete.
    recommendation: "revise as: 'a catalogue of features (four eyes, four ears, surpassing proportions, radiance from birth, fire from his lips when he moved them) marking him as outside the ordinary divine type. The catalogue is concentrated in lines 95-98 and the rest of the figure is not described.' Or accept the existing wording with the understanding that 'a catalogue of features' is editorially abbreviated."

  - id: F011
    severity: LOW
    pass: 2
    location: "Deities / [[char-anu]] (line 111) and Anzû entry (line 116-129)"
    claim: |
      "convenes the divine assembly after Anzû's theft of the Tablet of Destinies
      and successively summons Adad, Gerra, and Šara as champions"
    verdict: "△ INTERNAL-VARIANCE"
    evidence: |
      In the Standard Babylonian Anzû Epic Tablet I (Annus 2001 critical edition,
      Foster 2005 translation, ll. 60ff.), Anu does convene the assembly and
      summons three failed champions (Adad → Gerra → Šara). However, the role
      of summoner in some manuscript traditions is attributed to Enlil rather
      than Anu, depending on which speech-attribution the editor follows for the
      assembly scene. Annus 2001 follows the convention that has Anu doing the
      summoning. Defensible.
    recommendation: "accept."

  - id: F012
    severity: LOW
    pass: 2
    location: "Deities / [[char-jormungandr]] (line 618)"
    claim: |
      "depicted on at least four pre-Christian runestones and picture-stones
      (Altuna, Hørdum, Gosforth, Ardre VIII) two to five centuries before the
      surviving Eddic and Snorra Edda manuscripts"
    verdict: "△ INTERNAL-VARIANCE"
    evidence: |
      The four picture-stones cited are correct (Altuna runestone, Hørdum stone,
      Gosforth stone-slab, Ardre VIII picture-stone) and are widely cited
      together in West 2007 ch. 6 and in the iconographic dossier of
      Jǫrmungandr scholarship. However: (a) Gosforth is in Cumbria and is
      typically described as a *Christian-era* sculpture (with Norse iconography
      preserved in the Christian context), not pre-Christian; (b) the dating
      windows for the Hørdum stone are debated (8th-11th century) and so the
      "two to five centuries before" gap is wide and depends on which stones
      one anchors to. Editorially defensible at the typological level but
      strict pre-Christian categorisation of all four stones is overstated.
    recommendation: "revise as: 'depicted on at least four runestones and picture-stones (Altuna in Sweden, Hørdum in Denmark, Gosforth in Cumbria, Ardre VIII on Gotland), some pre-Christian, some Christian-era preserving older iconographic types, all dating from earlier than the surviving Snorra Edda manuscripts.' Or simpler — drop the 'pre-Christian' qualifier."

