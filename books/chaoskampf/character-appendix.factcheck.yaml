  - id: F006
    severity: MEDIUM
    pass: 2
    location: "Creatures and Monsters / [[char-geryon]] (line 1664)"
    claim: |
      "Geryon is depicted in the iconographic tradition with three heads, three
      torsos, and three pairs of legs; he is morphologically a triple-bodied warrior
      rather than a serpent."
    verdict: "△ INTERNAL-VARIANCE"
    evidence: |
      The iconographic record gives multiple variants. Hesiod (Theog. 287) gives
      Geryon as "three-headed" with one body. Aeschylus and the standard fifth-
      century vase tradition give him three full bodies (i.e., three heads, three
      torsos, three pairs of arms) growing from one set of legs (so one pair of
      legs, not three). Stesichorus (lost Geryoneis) describes six hands and six
      feet (i.e., three pairs of hands and three pairs of feet) plus wings.
      The appendix's "three heads, three torsos, three pairs of legs" formulation
      is closest to a specific Aeschylean / vase-painting variant — but there is
      no single consensus "the iconographic tradition" form. The phrasing "three
      pairs of legs" (i.e., six legs) is not the dominant Greek vase-painting
      iconography (which has one pair of legs supporting three torsos).
    recommendation: "revise as: 'Geryon is depicted in the iconographic tradition variously as three-headed (Hesiod) and as triple-bodied (three torsos joined at the waist, supported by one or two sets of legs depending on the vase tradition); he is morphologically a triple-bodied warrior rather than a serpent.' Or footnote the iconographic variation."

  - id: F007
    severity: MEDIUM
    pass: 2
    location: "Creatures and Monsters / [[char-kaliya]] (line 1730)"
    claim: |
      "the head-count varies across sources from five to seven to one hundred and
