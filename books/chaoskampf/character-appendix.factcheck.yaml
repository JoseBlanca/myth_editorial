  - id: F001
    severity: HIGH
    pass: 1
    location: "Deities / [[char-cassiopeia]] (lines 267-278)"
    claim: "Cassiopeia is placed in the Deities section."
    verdict: "✗ FABRICATION"
    evidence: |
      Cassiopeia is the queen of Aithiopia in Apollodorus Bibliotheca 2.4.3 — a
      mortal queen, not a deity. The entry's own opening line correctly identifies
      her as "Mother of Andromeda in the Greek tradition" (i.e., a mortal queen);
      the section heading "=== Deities" is therefore a misclassification, not a
      content error per se. Pre-flagged by prior agents.
    recommendation: "revise as: move Cassiopeia entry to the Heroes and Mortals section, alphabetically between Bellerophon and Beowulf or between Beowulf and Christ depending on letter-rank decision."

  - id: F002
    severity: HIGH
    pass: 1
    location: "Deities / [[char-hou-yi]] (lines 482-493)"
    claim: "Hou Yi is placed in the Deities section."
    verdict: "△ INTERNAL-VARIANCE"
    evidence: |
      Hou Yi's status — divine archer (descended from heaven, sometimes counted as
      *xian*) vs. mortal sage-king-era hero — is debated in the scholarship. Birrell
      1993 and Lewis 2006 both treat him as a divine archer-figure sent down by
      Di Jun, but he is also described as the human archer who serves Yao on earth.
      The appendix's own characterisation in the Relevance line ("classifies him as
      a related-tier order-restoration case") is neutral on the divine/heroic
      question. Placement under Deities is defensible but not unambiguous; the
      placement under Heroes and Mortals (with Mwindo, Beowulf, Sigurd) would be
      equally defensible. Pre-flagged by prior agents.
    recommendation: "accept (with editorial note) or revise as: move Hou Yi to Heroes and Mortals if the editorial choice is to classify him as a hero rather than a deity. Either choice is defensible. Document the decision."

  - id: F003
    severity: HIGH
