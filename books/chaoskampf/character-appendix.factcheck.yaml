      manuscript reading that Tagare records — but cannot be confirmed without
      page-level access.
    recommendation: "revise as: human reviewer should verify against Tagare 1976-78 directly. If the 110-heads-in-some-manuscripts claim is preserved in Tagare, accept; otherwise revise to a less specific upper bound."

  - id: F008
